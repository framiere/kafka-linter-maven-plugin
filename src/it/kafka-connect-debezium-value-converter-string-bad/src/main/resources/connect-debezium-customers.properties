# =============================================================================
# Debezium MySQL CDC source connector for the customers schema.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#   value.converter = org.apache.kafka.connect.storage.StringConverter
#
# WHY THIS IS WRONG (for a Debezium source connector):
#
# A Debezium source connector emits a structured Connect Struct envelope for
# every change event. The envelope is shaped roughly:
#
#   Struct {
#     before  : Struct { id, email, name, created_at, ... } | null
#     after   : Struct { id, email, name, created_at, ... } | null
#     source  : Struct { version, connector, name, ts_ms, db, table, ... }
#     op      : "c" | "u" | "d" | "r"
#     ts_ms   : long
#     transaction : Struct | null
#   }
#
# The Kafka Connect StringConverter does ONE thing on the produce path:
#   StringConverter.fromConnectData(topic, schema, value) calls
#   value.toString() and serializes the resulting Java String to UTF-8.
#
# For a primitive String value (the converter's intended use, e.g. for the
# file-stream sink that genuinely produces String records), that is fine.
# For a Connect Struct, Struct.toString() returns the Java debug format —
# something like:
#
#   Struct{before=Struct{id=42,email=alice@example.com,name=Alice,...},
#          after=Struct{id=42,email=alice@new.com,name=Alice,...},
#          source=Struct{version=2.5.0.Final,connector=mysql,...},
#          op=u,ts_ms=1716393600000}
#
# That text:
#   - is NOT JSON (no quotes around keys or string values, no escaping)
#   - is NOT Avro (no schema, no binary framing)
#   - is NOT Protobuf (no wire-format tags)
#   - has no escape grammar — a customer name like "Smith, John" or an email
#     containing '=' will silently corrupt the output
#   - is intended for log/debug output only, NEVER as a wire format
#
# DOWNSTREAM CONSEQUENCES (the CDC topic LOOKS populated but is broken):
#
#   - Kafka Streams: KStream<String,String>.mapValues(...) sees the raw debug
#     text as a String; there is no Struct to operate on. Every downstream
#     map/filter/groupByKey works on the wrong shape.
#   - JDBC Sink connector with pk.fields=after.id throws
#     IllegalArgumentException because it cannot extract field "after.id"
#     from a value of type String.
#   - Elasticsearch Sink connector cannot extract fields for indexing.
#   - ksqlDB CREATE STREAM ... WITH (VALUE_FORMAT='AVRO') fails because
#     schema inference cannot derive a schema from a raw String.
#   - Mirror Maker 2 happily replicates the raw debug strings to the DR
#     cluster, where every downstream pipeline reproduces the same failure.
#
# COMMON ROOT CAUSES:
#   (a) "StringConverter is the simplest converter, no Schema Registry needed"
#       — true for sinks that handle strings, fatal for a Debezium source.
#   (b) Copy-paste from a sink connector config that legitimately emits
#       Strings (e.g. file-stream sink, S3 sink with json.bytes format).
#   (c) Helm chart shipping StringConverter as a "safe default" for the
#       worker's value.converter (the connector inherits the worker default
#       unless overridden).
#   (d) Temporary workaround for a Schema Registry outage that was never
#       reverted after Registry was restored.
#
# FIX:
#   value.converter = io.confluent.connect.avro.AvroConverter
#   value.converter.schema.registry.url = http://schema-registry:8081
#
# or for JSON-based pipelines:
#   value.converter = org.apache.kafka.connect.json.JsonConverter
#   value.converter.schemas.enable = true
#
# or for Protobuf-based pipelines:
#   value.converter = io.confluent.connect.protobuf.ProtobufConverter
#   value.converter.schema.registry.url = http://schema-registry:8081
# =============================================================================

name = mysql-customers-cdc
connector.class = io.debezium.connector.mysql.MySqlConnector
tasks.max = 1

config.providers = file
config.providers.file.class = org.apache.kafka.common.config.provider.FileConfigProvider

database.hostname = mysql.prod.svc.cluster.local
database.port = 3306
database.user = debezium
database.password = ${file:/run/secrets/debezium.properties:password}
database.server.id = 184054
topic.prefix = customers-cdc

schema.history.internal.kafka.bootstrap.servers = kafka:9092
schema.history.internal.kafka.topic = schema-history.customers

table.include.list = customers.user,customers.account,customers.address

# Key side is correctly configured with AvroConverter so the primary key
# Struct serializes to a parseable binary format that sinks can join on.
key.converter = io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url = http://schema-registry:8081
key.converter.auto.register.schemas = false

# VIOLATION: value side uses StringConverter, which flattens the Debezium
# Struct envelope to Java debug-format text. The CDC pipeline is silently
# broken from this line forward.
value.converter = org.apache.kafka.connect.storage.StringConverter
