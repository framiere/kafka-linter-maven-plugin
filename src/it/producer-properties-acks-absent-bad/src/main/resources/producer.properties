# RULE: PRODUCER_PROPERTIES_ACKS_ABSENT.
#
# This producer config is otherwise reasonable:
#   - compression.type=zstd            (good — compressed batches)
#   - enable.idempotence=true          (good — no duplicates on retry)
#   - linger.ms=20                     (good — batching window opened)
#   - batch.size=131072                (good — 128 KiB batches)
#
# ...but it never sets `acks`. The kafka-clients ConfigDef default for `acks`
# is VERSION-DEPENDENT:
#   - kafka-clients 2.x  → default `acks=1`   (leader-only durability — LOSS on
#                                              leader failover before replication)
#   - kafka-clients 3.x+ → default `acks=all` (per KIP-679 — durable)
#
# That means: the SAME .properties file shipped against two different
# kafka-clients JAR versions gets two completely different durability
# contracts. The version switch is silent: no log line, no metric, no error
# — just two different outcomes for the same config.
#
# What this looks like in production:
#   - The team deploys this config against kafka-clients 2.8.x (the project's
#     pinned version, never bumped since 2019). Default is `acks=1`.
#     Every record is one-replica durable.
#   - A leader-election happens (routine cluster maintenance, AZ outage,
#     EBS volume replacement) — between the leader's ACK to the producer
#     and the follower's catch-up, there is a window of 1-1000 ms where
#     records are on the leader only.
#   - Records in that window are LOST when the leader dies before replicating.
#   - The producer's send() callback already fired success.
#   - Downstream consumers never see the records.
#   - There is NO record-loss metric — from the producer's point of view,
#     nothing failed.
#
# Discovery shape: weeks later, "missing records" tickets pile up. The team
# greps the producer config, finds no `acks` line, and realizes the default
# was leader-only the whole time.
#
# Fix: ONE LINE. Set `acks=all` for production durability, OR `acks=1` with
# an explicit comment documenting the trade-off (low-latency / non-critical
# streams), OR `acks=0` with a comment (telemetry / metrics shippers only).
# The choice MUST be in the file — never inherited from the kafka-clients
# version default.
bootstrap.servers=kafka-1.prod.example.com:9092
client.id=bad-no-acks-producer
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=org.apache.kafka.common.serialization.StringSerializer
compression.type=zstd
enable.idempotence=true
linger.ms=20
batch.size=131072
