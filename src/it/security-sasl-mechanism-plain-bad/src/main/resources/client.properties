# =============================================================================
# IT fixture: SECURITY_SASL_MECHANISM_PLAIN (bad)
# =============================================================================
#
# What this file is
#   A Kafka client .properties file for `data-platform-ingest` — a
#   Java service running on bare-metal RHEL 8 in an on-prem datacenter,
#   producing application telemetry to a self-hosted Apache Kafka 3.7
#   cluster. The cluster is provisioned by an internal platform team
#   that operates ~40 Kafka clusters across the org and standardised
#   on SCRAM-SHA-512 in 2020 — every broker has SCRAM enabled, every
#   service account in the IAM system has a SCRAM credential
#   provisioned and rotated every 90 days, and the platform team's
#   Helm chart for client deployments defaults to SCRAM-SHA-512.
#
#   The bug here is NOT a broker limitation. The brokers support
#   SCRAM perfectly. The bug is a client config that opted out of
#   the org's standard.
#
# What's wrong
#   `sasl.mechanism=PLAIN` paired with `security.protocol=SASL_SSL`
#   — the wire is encrypted by TLS, so credentials are NOT visible
#   to a packet capture on the network path. But every other PLAIN
#   liability remains:
#
#   (1) **Broker sees the cleartext password on every authentication.**
#       The SASL/PLAIN frame contains `\0<username>\0<password>` per
#       RFC 4616. The broker decodes, then compares against the
#       PlainLoginModule's user database — where credentials are
#       stored unencrypted in `/opt/kafka/config/kafka_server_jaas.
#       conf` (or fetched from LDAP/SSO which has its own storage
#       footguns). A broker-disk compromise (insider, leaked nightly
#       backup, RCE) yields every service's password in cleartext.
#
#   (2) **Cleartext storage of all client credentials.** The platform
#       team's broker-side JAAS file holds the cleartext password
#       for `data-platform-ingest` (and ~600 other service accounts
#       that opted into PLAIN). A grep on the broker filesystem
#       reveals everything. With SCRAM, the same file holds only
#       PBKDF2-derived `SaltedPassword` values that are useless
#       against any broker without the original password (and
#       brute-forcing the original requires ~5ms per guess on
#       commodity CPU, infeasible for any password with non-trivial
#       entropy).
#
#   (3) **Compliance failure.** PCI-DSS 4.0 §8.3.1 requires
#       'strong cryptography' for credentials at rest. FedRAMP
#       Moderate IA-5(1)(c) requires cryptographic storage of
#       authenticator secrets. PLAIN explicitly fails both.
#       Auditors find this with a one-line grep across the broker
#       fleet.
#
#   (4) **Replay-attack window if security.protocol degrades.** A
#       future config change that flips `security.protocol` to
#       `SASL_PLAINTEXT` (operator typo, Helm-template bug, an
#       upstream config inheritance accident) makes the cleartext
#       credentials visible on the wire IMMEDIATELY. With SCRAM,
#       the same misconfiguration leaks only the challenge-
#       response — still bad, but recoverable by rotating the
#       password without retroactive damage to past sessions.
#
#   (5) **Password rotation is org-wide-coordinated.** PLAIN
#       passwords cannot be rotated server-side without a synchronous
#       client restart. SCRAM supports dual-credential active-active
#       rotation (broker accepts BOTH old and new credentials during
#       the migration window), so the org rotates 600 service
#       accounts independently and in parallel. The PLAIN-using
#       services force the platform team to schedule a synchronized
#       restart day every 90 days — a four-hour outage window that
#       the entire org has to plan around.
#
# The eight bug shapes this rule catches
#   (1) **Confluent Cloud API-key copy-paste.** Confluent Cloud uses
#       SASL_SSL + PLAIN by default because the API key/secret model
#       maps cleanly to PLAIN; this is the legitimate case where
#       PLAIN-over-TLS is acceptable, but the rule still fires as a
#       nudge to consider OAUTHBEARER (KIP-768) or SCRAM-SHA-512
#       (Confluent Cloud also supports both since 2022).
#
#   (2) **AWS MSK SCRAM-available-but-PLAIN-configured.** MSK
#       supports SCRAM, mTLS, IAM, and unauthenticated listeners.
#       Operators sometimes leave a SASL_PLAINTEXT + PLAIN listener
#       open for 'debug access' that nobody decommissions; client
#       configs end up pointing at it.
#
#   (3) **On-prem broker with SCRAM-enabled but client picked PLAIN
#       for simplicity.** This fixture's scenario. The broker
#       supports both `sasl.enabled.mechanisms=PLAIN,SCRAM-SHA-512`,
#       the client side could use either, the operator picked
#       PLAIN because the JAAS config is one line shorter.
#
#   (4) **Strimzi KafkaUser type mismatch.** The KafkaUser CRD
#       configures the broker side with
#       `authentication.type=scram-sha-512`, but the Streams app's
#       .properties still says `sasl.mechanism=PLAIN`. Authentication
#       fails; the developer changes the CLIENT to PLAIN to 'match
#       the easier default' rather than fixing the KafkaUser.
#
#   (5) **Helm chart with PLAIN as default-easy.** Many Kafka client
#       Helm charts ship with PLAIN as the default to minimize
#       per-environment setup; the default propagates everywhere in
#       prod.
#
#   (6) **Apache Kafka quickstart copy-paste.** The official client
#       quickstart historically used PLAIN; the SCRAM examples live
#       deeper in the security docs. Copy-paste from quickstart
#       ends up in production.
#
#   (7) **Spring Boot Kafka autoconfig.** The autoconfig does not
#       require `spring.kafka.properties.sasl.mechanism`; teams
#       commonly set it to PLAIN explicitly in `application.yml`
#       because tutorials show that value first.
#
#   (8) **Mixed-mechanism cluster operations.** A platform team
#       operates a cluster that accepts PLAIN, SCRAM, and OAUTHBEARER
#       simultaneously. Auditors find via grep that 30% of clients
#       still use PLAIN years after the SCRAM standard was adopted;
#       the rule helps the team enforce the standard before merge.
#
# Why WARNING (not ERROR / INFO) by default
#   PLAIN-over-TLS is functionally working (the wire is encrypted,
#   the broker still authenticates the client correctly). The
#   issues — broker-side credential storage, compliance failures,
#   replay-attack expansion on protocol downgrade — are real but
#   not immediate availability or correctness failures. WARNING is
#   the right level: surface the issue in code review, let the
#   team triage rather than blocking the build.
#
#   This IT fixture's pom.xml overrides the severity to ERROR so
#   that `mvn verify` fails on this bad configuration, demonstrating
#   the rule fires correctly.
#
# Fix
#   On the client side, three steps:
#     1. Change `sasl.mechanism=PLAIN` to `sasl.mechanism=
#        SCRAM-SHA-512`.
#     2. Change the JAAS config from `PlainLoginModule` to
#        `ScramLoginModule`:
#          sasl.jaas.config=org.apache.kafka.common.security.scram.\
#            ScramLoginModule required username="data-platform-\
#            ingest" password="${env:KAFKA_PASSWORD}";
#     3. Restart the client.
#
#   On the broker side (already done in this fixture's scenario):
#     1. Ensure SCRAM is in `sasl.enabled.mechanisms`:
#          sasl.enabled.mechanisms=SCRAM-SHA-512,PLAIN
#     2. Provision the SCRAM credential:
#          kafka-configs.sh --alter --add-config 'SCRAM-SHA-512=\
#            [iterations=4096,password=<password>]' \
#            --entity-type users --entity-name data-platform-ingest
#     3. Verify with `kafka-configs.sh --describe --entity-type \
#          users --entity-name data-platform-ingest`.
#
#   For Confluent Cloud, prefer OAUTHBEARER (KIP-768) with the
#   corporate IdP; if neither OAUTHBEARER nor SCRAM is available,
#   ensure `security.protocol=SASL_SSL` is explicit and rotate the
#   API key at least every 90 days.
# =============================================================================

# Cluster connectivity.
bootstrap.servers=kafka-prod.platform.internal:9094

# Security stack.
security.protocol=SASL_SSL

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# THE BUG:
# `PLAIN` — the broker receives the cleartext password on every authentication;
# it is stored unencrypted in the broker's JAAS file. A broker-disk compromise
# leaks all 600 service account passwords. Compliance auditors flag PLAIN as
# failing PCI-DSS 4.0 §8.3.1 and FedRAMP Moderate IA-5(1)(c) regardless of
# TLS configuration. SCRAM-SHA-512 fixes both; the broker has SCRAM enabled.
# Fix: change to SCRAM-SHA-512 and update the JAAS config to ScramLoginModule.
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
sasl.mechanism=PLAIN
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required \
    username="data-platform-ingest" \
    password="${env:KAFKA_PASSWORD}";

# Truststore for broker certs.
ssl.truststore.location=/etc/data-platform-ingest/kafka.truststore.p12
ssl.truststore.password=${env:KAFKA_TRUSTSTORE_PASSWORD}
ssl.truststore.type=PKCS12

# Standard producer knobs.
client.id=data-platform-ingest-pod-0
acks=all
enable.idempotence=true
compression.type=zstd
linger.ms=20
batch.size=131072
buffer.memory=67108864
max.block.ms=60000
delivery.timeout.ms=120000
request.timeout.ms=30000

# Serializers.
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer

# Connection / metadata.
metadata.recovery.strategy=rebootstrap
