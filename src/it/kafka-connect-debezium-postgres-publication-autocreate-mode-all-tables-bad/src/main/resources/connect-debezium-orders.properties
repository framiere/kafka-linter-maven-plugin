# =============================================================================
# Debezium PostgreSQL connector capturing the `public.orders` table from the
# orders OLTP database.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#   publication.autocreate.mode = all_tables    (with table.include.list set)
#
# WHY THIS IS A SECURITY-AND-DATA-GOVERNANCE BUG:
#
# Postgres logical replication (the foundation Debezium uses to stream CDC
# events) requires a server-side PUBLICATION object. A publication has two
# forms:
#
#   (a) CREATE PUBLICATION <name> FOR TABLE <t1>, <t2>, ...;
#       — narrow publication. Captures ONLY the named tables. New tables
#         added later are NOT captured.
#
#   (b) CREATE PUBLICATION <name> FOR ALL TABLES;
#       — broad publication. Captures EVERY table in the current database,
#         including tables added LATER by other teams.
#
# Debezium's `publication.autocreate.mode` config governs which form the
# connector creates on startup:
#
#   disabled    — operator must pre-create the publication manually
#   filtered    — Debezium creates form (a), derived from include/exclude
#                 lists (the SAFE choice; Debezium 2.x+ default)
#   all_tables  — Debezium creates form (b) (Debezium 1.x default;
#                 deliberately CHANGED to `filtered` in 2.x because the
#                 community recognized it as a footgun)
#
# THE VIOLATION:
#
# This config sets `publication.autocreate.mode = all_tables` EXPLICITLY.
# Even though `table.include.list` narrows what events become Kafka topics,
# the PUBLICATION captures every table — meaning:
#
#   1. The Postgres slot retains WAL for every table (not just orders).
#      If the orders connector falls behind, the slot's confirmed_flush_lsn
#      lags, and Postgres retains WAL for EVERY table until the slot
#      advances — including tables this connector doesn't even care about.
#      Postgres disk usage spikes; the on-call team gets paged for pg_wal
#      filling the data volume.
#
#   2. Every captured table's WAL is decoded by the connector process.
#      The bytes for tables OTHER THAN orders pass through the connector's
#      memory, are written to the database.history Kafka topic, and are
#      filtered out CLIENT-SIDE before being emitted to Kafka topics. A
#      memory dump, container breakout, or auth bypass of the connector
#      process exposes the raw bytes of all those tables — INCLUDING any
#      PII or secrets-storage tables added later by other teams.
#
#   3. A new `public.user_passwords_hash` table added next quarter for
#      application auth is silently captured by the publication, even though
#      this connector's operator never authorized capturing PII or secrets.
#
#   4. `CREATE PUBLICATION ... FOR ALL TABLES;` requires the connector's
#      Postgres role to be SUPERUSER or hold the `pg_create_subscription`
#      predefined role (Postgres 16+). Production-DBA-approved roles
#      typically do not grant either — the path of least resistance is to
#      ask the DBA to elevate the connector's role, expanding the blast
#      radius beyond what was originally agreed.
#
# The downstream filter (`table.include.list=public.orders` below) does
# NOT prevent any of the above — it only filters which events become
# Kafka topics AFTER the data has already been exposed to the connector
# process.
#
# FIX:
#
#   publication.autocreate.mode = filtered
#   table.include.list          = public.orders
#
# This generates `CREATE PUBLICATION <name> FOR TABLE public.orders;` —
# the publication captures ONLY the named table. New tables added later
# are NOT captured. Postgres only retains WAL for public.orders in the
# slot. The connector role only needs `CREATE PUBLICATION ... FOR TABLE`
# permission (a much narrower grant than `FOR ALL TABLES`).
# =============================================================================

name=orders-source
connector.class=io.debezium.connector.postgresql.PostgresConnector
tasks.max=1

database.hostname=orders-db.internal
database.port=5432
database.user=debezium
database.password=changeme
database.dbname=orders
topic.prefix=db.orders

plugin.name=pgoutput
slot.name=debezium_orders_slot
publication.name=debezium_orders_pub

# Downstream filter — narrows which events become Kafka topics. Does NOT
# prevent the publication from capturing every table; that filter is the
# `publication.autocreate.mode` setting below.
table.include.list=public.orders

# VIOLATION: explicitly sets `all_tables` mode. The publication captures
# EVERY table in the orders DB (orders, customers, audit_log, secrets, the
# new PII table added next quarter, ...), retains WAL for all of them in
# the slot, exposes their bytes to the connector process, and requires
# SUPERUSER permission to create. Should be `filtered`.
publication.autocreate.mode=all_tables

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false

schema.history.internal.kafka.topic=schema-history.orders-source
schema.history.internal.kafka.bootstrap.servers=kafka.internal:9092
