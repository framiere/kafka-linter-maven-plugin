# =============================================================================
# A Kafka Connect WORKER configuration declaring `rest.advertised.host.name`
# as a LOOPBACK address (`localhost`). This is the hostname the worker
# advertises to OTHER workers in the cluster (via the `connect-configs`
# topic) as the address at which it can be reached for inter-worker
# REST-API forwarding.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#
#   rest.advertised.host.name = localhost
#
# Connect distributed mode forms a cluster of multiple worker processes.
# Every worker exposes the full REST API; when a request lands on a
# worker that is NOT the leader for a given connector, the worker
# FORWARDS the request to the connector's leader via an HTTP call to
# the leader's advertised address. The advertised address is read
# from `rest.advertised.host.name` and written into the cluster's
# `connect-configs` topic at worker startup; every other worker reads
# the topic and builds a routing table for forwarding decisions.
#
# When every worker advertises `localhost`, every worker's forwarding
# logic resolves the target against its OWN loopback interface:
#
# (1) If the worker's REST listener is bound to 0.0.0.0 (the default),
#     the forwarded request hits the FORWARDING worker's own REST
#     endpoint via localhost — returning data for the WRONG worker's
#     state. `GET /connectors` returns the forwarding worker's view,
#     not the actual leader's; `GET /connectors/{name}/status` returns
#     404 because the forwarding worker doesn't know about that
#     connector; `POST /connectors` may create a duplicate connector
#     on the forwarding worker or return 409 Conflict.
#
# (2) If the worker's REST listener is bound to a non-loopback
#     interface only, the forwarded request gets ECONNREFUSED on
#     localhost; the original REST client sees HTTP 502 Bad Gateway
#     from the receiving worker.
#
# Either way, the cluster is broken for any REST call that requires
# forwarding — which is ~67% of calls on a 3-worker cluster (probability
# of landing on the non-owning worker = (N-1)/N).
#
# THE HERDER PROTOCOL ALSO BREAKS:
#
# Connect's herder uses REST forwarding for config-update propagation:
# `PUT /connectors/<name>/config` from a non-leader worker forwards to
# the leader to apply the config change. With broken advertised
# hostnames, config updates either silently apply to the WRONG worker
# (whose local config diverges from the cluster's), or fail with 502.
# Either case produces config drift across workers; rebalances stall
# or partially complete; some workers run stale configs while others
# run new ones. Connectors with state-machine-sensitive config changes
# (Debezium snapshot triggering, MirrorMaker 2 topic-filter updates)
# end up in inconsistent states across the cluster.
#
# THE BUG IS INVISIBLE IN SINGLE-WORKER TESTS:
#
# Single-worker dev/staging deployments never exercise forwarding
# (every REST call lands on the only worker; the herder considers
# every connector locally-owned). The misconfiguration ships through
# CI green and only manifests at production multi-worker scale.
#
# HOW LOCALHOST ENDS UP IN PRODUCTION:
#
# (i) **Confluent quickstart copy-paste.** The Confluent quickstart's
#     `connect-distributed.properties` template historically used
#     `rest.advertised.host.name=localhost` (correct for a single-node
#     laptop tutorial); operators copied the file as their canonical
#     worker config and shipped it to multi-worker production clusters.
#     (THIS FIXTURE)
#
# (ii) **Helm chart with localhost default.** Org's Connect Helm chart
#      templates `restAdvertisedHostName: localhost` as a "safe default"
#      (the chart comment says "override for multi-worker deployments"
#      but no `values-prod.yaml` overlay enforces the override). Teams
#      deploy with the default; dev single-pod tests pass; production
#      multi-pod deployments break.
#
# (iii) **Docker-compose → Kubernetes migration.** Team operated Connect
#       via docker-compose on developer laptops (single Connect container
#       → `localhost` is correct). Migration to Kubernetes (multi-pod
#       StatefulSet) carries the same `localhost` advertised hostname;
#       every pod advertises `localhost`; cross-pod forwarding breaks.
#
# (iv) **Confluent Platform sidecar → Strimzi.** Confluent Platform
#      deployed Connect as a single process behind a sidecar reverse
#      proxy (the proxy routed all REST traffic to the single
#      `localhost`-bound Connect process — `localhost` was correct
#      because there was only one Connect process per VM). Strimzi
#      migrates this to a 3-pod StatefulSet; the operator copies the
#      old Confluent Platform Connect config; every pod advertises
#      `localhost`; the cluster doesn't work.
#
# (v) **Suppressing a noisy log message.** Operator saw repeated
#     'advertised URL changed from <ip> to <ip>' logs on pod restart
#     (because Kubernetes pod IPs change between restarts); they
#     "stabilized" the advertised URL by setting it to `localhost`
#     (which doesn't change). The log noise is gone but the cluster
#     is now broken.
#
# THE FIX:
#
# Set `rest.advertised.host.name=<worker-resolvable-hostname>` — the
# hostname must be reachable by every other worker in the cluster.
# Choices by deployment topology:
#
# (1) **Kubernetes StatefulSet** (one stable hostname per pod):
#
#       env:
#         - name: POD_NAME
#           valueFrom:
#             fieldRef:
#               fieldPath: metadata.name
#       command: ["...", "--override",
#                 "rest.advertised.host.name=$(POD_NAME).<headless-service>.<namespace>.svc.cluster.local"]
#
# (2) **Kubernetes Deployment** (use pod IP, accepting that the IP
#     changes between restarts and triggers cluster rebalance):
#
#       env:
#         - name: POD_IP
#           valueFrom:
#             fieldRef:
#               fieldPath: status.podIP
#       command: ["...", "--override", "rest.advertised.host.name=$(POD_IP)"]
#
# (3) **Docker** (use container hostname):
#
#       rest.advertised.host.name=${HOSTNAME}
#
# (4) **Bare-metal/VM** (use the FQDN):
#
#       rest.advertised.host.name=connect-worker-1.kafka.prod.example.com
#
# In every case the advertised hostname must be DIFFERENT per worker
# (every worker must advertise its OWN address, not a shared one);
# DNS-resolvable from every other worker; and port-reachable on
# `rest.advertised.port` (default 8083).
#
# =============================================================================

# Connect-cluster identity
group.id=connect-cluster

# Bootstrap servers (the Kafka cluster hosting the internal topics)
bootstrap.servers=kafka-broker-1.example.internal:9092,kafka-broker-2.example.internal:9092,kafka-broker-3.example.internal:9092

# Internal-topic names (using the conventional defaults)
config.storage.topic=connect-configs
offset.storage.topic=connect-offsets
status.storage.topic=connect-status

# Production-recommended replication factors (avoids cross-fire with
# CONNECT_WORKER_INTERNAL_TOPIC_REPLICATION_FACTOR_LOW)
config.storage.replication.factor=3
offset.storage.replication.factor=3
status.storage.replication.factor=3

# Partition counts (orthogonal to RF)
config.storage.partitions=1
offset.storage.partitions=25
status.storage.partitions=5

# VIOLATION: rest.advertised.host.name = localhost
# Every worker in this cluster will advertise `localhost` as its
# reachable address; cross-worker REST forwarding will resolve against
# each forwarding worker's own loopback interface — either hitting the
# wrong worker's REST endpoint (returning wrong-cluster state) or
# failing with connection-refused.
rest.advertised.host.name=localhost

# REST listener bind address and port
listeners=http://0.0.0.0:8083
rest.advertised.port=8083

# Converters (worker-level defaults)
key.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=false
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false

# Plugin path
plugin.path=/usr/share/java/kafka-connect-plugins
