# =============================================================================
# IT fixture: SR_NORMALIZE_SCHEMAS_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A producer .properties file destined for a `KafkaProducer<String,
#   SpecificRecord>` that emits Avro records via Confluent's
#   `KafkaAvroSerializer`. The producer is `order-events-producer` —
#   the canonical order-event-emitter for an e-commerce checkout
#   service. It runs as a Spring Boot service, deployed across 8
#   pods on EKS, and produces ~12k events/sec to the `orders` topic
#   (24 partitions, replication-factor=3). Schemas are managed via
#   a centralized Confluent Schema Registry at
#   `schema-registry.kafka.prod.example.com:8081`, shared across
#   ~40 producer/consumer services org-wide.
#
#   Every other Schema Registry knob and producer-hardening knob is
#   set correctly — `schema.registry.url` (with TLS + basic auth),
#   `auto.register.schemas=false` (Category-A producer hardening),
#   `use.latest.version=true` (the matching version-pinning gate),
#   `latest.compatibility.strict=true`, `key.serializer` +
#   `value.serializer`, `acks=all`, `enable.idempotence=true`,
#   `compression.type=zstd`, etc. The ONLY missing knob is
#   `normalize.schemas`.
#
# What's wrong
#   `normalize.schemas` (KIP-855, Confluent SR client 6.0,
#   October 2020) is the CANONICALIZATION GATE for schema TEXT
#   before the client hashes it to compute the registry-identity
#   lookup. Default value: `false` (for backward compatibility with
#   pre-6.0 registries containing non-normalized historical
#   schemas).
#
#   When `false`:
#     - The client takes the schema TEXT EXACTLY as emitted by
#       codegen / hand-written .avsc / .proto.
#     - Field ORDER matters. Whitespace matters. Comments matter.
#       Union member ORDER matters. Unresolved namespace aliases
#       matter.
#     - Two schemas that are SEMANTICALLY identical but BYTE-
#       different hash to DIFFERENT registry IDs.
#     - The producer registers (or, with `auto.register.schemas=
#       false` + `use.latest.version=true`, LOOKS UP) a new
#       subject-version for every byte-different copy.
#
#   When `true`:
#     - The client first normalizes the schema text — alphabetize
#       fields, normalize union ordering, strip comments, resolve
#       namespace aliases — then hashes.
#     - Semantically-equivalent schemas hash to the SAME registry
#       ID.
#     - Subject-versions reflect SEMANTIC schema evolution, not
#       formatter-quirk noise.
#
#   With the default `false` for THIS app (a Spring Boot service
#   touched by ~15 developers running mvn spotless:apply +
#   IntelliJ Reformat on the avro-maven-plugin codegen output),
#   the registry is silently polluted on every reformat:
#
#     - Developer A runs `mvn spotless:apply` on the codegen
#       package — fields reorder alphabetically; producer
#       restart triggers a new subject-version with the
#       reordered fields but the SAME semantic schema.
#     - Developer B regenerates from a slightly-different .avsc
#       (cherry-picked from a peer's branch); fields appear in
#       a different order; another subject-version is created.
#     - Cross-team Producer Z (Gradle's avro-gradle-plugin)
#       emits the same logical schema with sorted fields by
#       default; yet another subject-version.
#
#   After 6 months: each subject in SR has 30-50 byte-different
#   versions, all semantically equivalent. Consequences cascade:
#     (a) Registry-CPU SPIKES during compatibility-checks
#         (BACKWARD compares byte-by-byte against every prior
#         version — quadratic in subject-version count).
#     (b) Consumer schema-cache thrashing — the default 1000-entry
#         cache fills with byte-different copies; oldest entries
#         evict; the next record carrying an evicted ID triggers
#         a network-round-trip to SR; per-thread, per-evicted-ID =
#         consumer-latency spikes during high-throughput periods.
#     (c) Compatibility-check false-positives — a BACKWARD-
#         compatible field addition appears to ALSO touch
#         existing-field-order (byte-level diff), causing the
#         check to flag a non-trivial diff; operators respond by
#         setting compatibility=NONE, losing real protection.
#     (d) Subject-version explosion makes `GET /subjects/<name>/
#         versions` return slow (multi-second), breaking
#         schema-discovery UI tooling.
#     (e) Cross-team registry pollution — Team A and Team B
#         registering the "same" schema from different emitters
#         get two parallel subject-evolution trees, breaking the
#         single-source-of-truth invariant.
#
# This fixture's specific risk
#   This producer talks to a SHARED Confluent registry serving
#   ~40 services. The Maven (`avro-maven-plugin`) emit-order
#   differs from Gradle (`avro-gradle-plugin`, used by ~12 sibling
#   services). Without `normalize.schemas=true`, every cross-team
#   schema-reuse (e.g., consuming Team B's `Address` nested in
#   our `Order`) creates a byte-different subject-version on
#   first send. The org's registry currently holds ~7 subjects
#   per logical-schema due to this exact bug — operators have
#   spent ~3 quarters tracking it down via SR audit logs.
#
# Why this is "INFO" by default (not WARNING or ERROR)
#   (a) Flipping `normalize.schemas=true` is a one-way migration
#       for legacy registries. Re-registering existing schemas
#       under the normalized form creates NEW schema IDs; the
#       historical IDs remain, but every producer/consumer
#       cache-miss on an old ID re-fetches and may re-cache
#       under the normalized form. For migrated orgs the
#       deliberate choice is `=false` with documentation.
#
#   (b) For green-field deployments (every new Kafka cluster
#       after October 2020 — THE COMMON CASE), `=true` is the
#       correct choice and should have been the default.
#
#   (c) The bug shape is delayed and cumulative: it doesn't
#       manifest at deploy time, only after months of
#       formatter-driven schema-text drift. Hard to attribute
#       to the absent knob without registry-level monitoring.
#
#   (d) Confluent's framework defaults to `false`; Spring Boot
#       autoconfig does not override it; every Spring Boot
#       Kafka app inherits the framework's `false` by default
#       — operator-action-at-distance.
#
#   INFO is the right level: surfaces the missing knob and
#   prompts a deliberate green-field-vs-legacy choice without
#   false-alarming the legacy registries.
#
#   This IT overrides severity to ERROR via pom.xml
#   `<severities>` block to force the build to fail and verify
#   the rule fires.
#
# Common bug shapes
#   (1) IDE code-formatter triggered subject-version explosion.
#       A developer runs `mvn spotless:apply` or IntelliJ
#       Reformat on the Avro codegen output. The formatter
#       reorders fields alphabetically. The rebuilt producer
#       emits the SAME schema with DIFFERENT byte-layout. The
#       producer's first send registers a NEW subject-version
#       with the same fields in a different order. Multiplied
#       across producers + re-formats, subjects accumulate
#       dozens of byte-different but semantically-identical
#       versions.
#
#   (2) Multi-toolchain Avro codegen — Maven vs Gradle vs sbt.
#       The Maven `avro-maven-plugin` emits fields in
#       declaration order. The Gradle `avro-gradle-plugin`
#       sorts them. The sbt-avro plugin normalizes namespaces
#       differently. An org with mixed Maven+Gradle+sbt
#       producers pointing at the same SR cluster gets every
#       subject duplicated under each toolchain's emit-order.
#
#   (3) Cross-team registry pollution — same logical schema
#       registered twice.
#       Team A registers `com.acme.Order` from a hand-written
#       .avsc. Team B regenerates the same logical schema from
#       an OpenAPI-to-Avro converter that emits in a different
#       order. SR stores both as distinct subject-versions.
#       Both consumers cache different schema-IDs. The
#       registry-CPU spikes during compatibility-checks because
#       every check compares byte-by-byte against every prior
#       version.
#
#   (4) Compatibility-check false-positives.
#       `latestCompatibility=BACKWARD` rejects a schema that
#       ADDS A FIELD because the byte-level diff also touches
#       existing-field-order. The developer responds by setting
#       compatibility to NONE (the worst-of-all fixes), losing
#       real compatibility protection for the entire subject's
#       future evolution.
#
#   (5) Consumer schema-cache thrashing.
#       The default `KafkaAvroDeserializer` schema cache size
#       is 1000 (`CACHED_SCHEMA_MAP_SIZE_CONFIG`). Under
#       `normalize.schemas=false`, every byte-different copy
#       occupies a slot. The cache hits its cap; oldest entries
#       evict; the next record carrying an evicted ID triggers
#       a network-round-trip to SR; per-thread, per-evicted-ID
#       = consumer-latency spikes during high-throughput
#       periods.
#
#   (6) Spring Boot autoconfig default-leak.
#       Spring `KafkaAutoConfiguration` does NOT set
#       `normalize.schemas` in its default template. Every
#       Spring Boot Kafka app inherits the framework's `false`
#       default and silently accumulates SR pollution even when
#       the operator never explicitly chose `false`.
#
# Fix
#   ONE LINE.
#
#   For green-field deployments (THIS app's case — modern
#   Confluent registry, Apache Kafka 3.x):
#     normalize.schemas=true
#
#   For Spring Boot autoconfig:
#     spring.kafka.properties.normalize.schemas=true
#
#   For legacy-registry-constrained deployments (pre-6.0
#   registry with non-normalized historical schemas that must
#   not be re-IDed):
#     normalize.schemas=false   # legacy registry — DO NOT
#                                 # change without coordinating
#                                 # a re-ID migration across
#                                 # all producers + consumers.
#     # Setting the key explicitly to `false` (not just
#     # leaving it unset) disables this rule's trigger and
#     # records the deliberate choice.
#
# Sibling rules
#   `SR_AUTO_REGISTER_SCHEMAS_TRUE` — the producer-side
#   governance gate (should typically be `false` in
#   production); orthogonal but related, governs WHO can
#   push new schemas to SR.
#
#   `SR_USE_LATEST_VERSION_MISSING` — the version-pinning
#   sibling; works together with `auto.register.schemas=false`
#   to define producer-schema-resolution. The half-migrated
#   state (auto-register OFF, use-latest UNSET) is the same
#   half-migrated shape as `normalize.schemas` absent.
#
#   `SR_LATEST_COMPATIBILITY_STRICT_FALSE` — the
#   compatibility-check engine side of the same
#   canonicalization concern. Disabling strict compatibility
#   masks schema-evolution bugs that `normalize.schemas=true`
#   would also have prevented.
#
#   `CONNECT_AVRO_AUTO_REGISTER_SCHEMAS_TRUE` — the Connect-
#   converter equivalent of the auto-register gate; Connect
#   converters do NOT inherit this producer's setting, so
#   Connect-converter-touched topics may still suffer the same
#   pollution.
# =============================================================================

# Producer identity + cluster connectivity.
client.id=order-events-producer
bootstrap.servers=broker-1.kafka.prod.example.com:9092,broker-2.kafka.prod.example.com:9092,broker-3.kafka.prod.example.com:9092

# Avro serdes via Confluent.
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=io.confluent.kafka.serializers.KafkaAvroSerializer

# Schema Registry — HTTPS endpoint, shared across ~40 services.
schema.registry.url=https://schema-registry.kafka.prod.example.com:8081

# SR auth — BASIC over TLS (env-injected, not literal).
basic.auth.credentials.source=USER_INFO
basic.auth.user.info=${SR_USER_INFO}

# Producer-side schema-governance hardening — Category-A producer.
# (Both knobs set correctly; this fixture is NOT firing the
# SR_AUTO_REGISTER_SCHEMAS_TRUE or SR_USE_LATEST_VERSION_MISSING
# rules.)
auto.register.schemas=false
use.latest.version=true
latest.compatibility.strict=true

# Idempotence + acks=all = the standard exactly-once-producer posture
# (paired with `enable.idempotence=true` on the Streams side if this
# emits into a Streams topology).
acks=all
enable.idempotence=true
max.in.flight.requests.per.connection=5
retries=2147483647
delivery.timeout.ms=180000

# Throughput tuning — zstd is the modern compression choice (~2x ratio
# of snappy at similar CPU).
compression.type=zstd
linger.ms=20
batch.size=131072

# Memory budget for in-flight batches; 64 MiB at ~12k events/sec
# absorbs ~5s of broker stall before back-pressuring the application.
buffer.memory=67108864

# Request-level timeout — must exceed the broker's `replica.lag.time.
# max.ms` so that ISR-recovery doesn't trigger a client-side retry.
request.timeout.ms=30000

# Client-rack for fetcher locality on the consumer side (declared on
# the producer for symmetry — harmless on producer, picked up if the
# same .properties is reused by a sibling consumer).
client.rack=us-east-1a

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# MISSING:
#   normalize.schemas=true
# Without this key, Confluent's `AbstractKafkaAvroSerializer` defaults
# `normalize.schemas` to `false` (the KIP-855 backward-compatibility
# default for pre-6.0 registries containing non-normalized historical
# schemas). Per KIP-855 (Confluent SR client 6.0, October 2020), this
# is the CANONICALIZATION GATE for schema TEXT before the client
# hashes it to compute the registry-identity lookup. With the default
# `false`, the client uses the schema TEXT EXACTLY as emitted by
# codegen / hand-written .avsc / .proto files — field ORDER matters,
# whitespace matters, union member ORDER matters. Common developer-
# flow operations create near-duplicate subject-versions:
#   (1) IDE code-formatter (mvn spotless:apply / IntelliJ Reformat)
#       reorders fields alphabetically → new byte-different version
#       on next producer restart.
#   (2) Multi-toolchain Avro codegen — Maven's avro-maven-plugin emits
#       fields in declaration order, Gradle's avro-gradle-plugin sorts
#       them, sbt-avro normalizes namespaces differently → every
#       subject duplicated under each toolchain's emit-order.
#   (3) Cross-team registry pollution — two teams registering the same
#       logical schema from different .avsc emitters → parallel
#       subject-evolution trees, broken single-source-of-truth
#       invariant.
#   (4) Compatibility-check false-positives — BACKWARD compares byte-
#       by-byte; field-order diffs cause spurious compatibility
#       rejections; operators set compatibility=NONE in response,
#       losing real protection.
#   (5) Consumer schema-cache thrashing — default 1000-entry cache
#       fills with byte-different copies, evictions trigger network
#       round-trips, consumer-latency spikes.
#   (6) Spring Boot autoconfig default-leak — Spring KafkaAutoConfig
#       does not override the framework `false` default.
# For green-field deployments (modern Confluent registry, Apache
# Kafka 3.x — THIS app's case): set `normalize.schemas=true`. For
# Spring Boot apps: `spring.kafka.properties.normalize.schemas=true`.
# For legacy-registry-constrained deployments: set explicitly to
# `false` with documentation; the explicit value disables this
# rule's trigger and records the deliberate choice.
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
