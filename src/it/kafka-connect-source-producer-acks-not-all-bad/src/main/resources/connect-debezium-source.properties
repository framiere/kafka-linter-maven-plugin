name=debezium-postgres-source
connector.class=io.debezium.connector.postgresql.PostgresConnector
tasks.max=1

database.hostname=db.internal
database.port=5432
database.user=debezium
database.password=secret
database.dbname=orders
plugin.name=pgoutput
slot.name=debezium

table.include.list=public.orders,public.order_items
topic.prefix=cdc.orders

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false

# Anti-pattern: producer.override.acks=1 downgrades the durability of Connect's
# internal source-task producer below at-least-once. Kafka 3.0 (KIP-679) made
# acks=all the default specifically because acks=1 was understood as a footgun:
# the leader broker ACKs the record BEFORE in-sync replicas have it; a failover
# loses the record. Worse, Connect commits the source-offset (WAL LSN here) to
# the connect-offsets topic as soon as the producer ACKs — so on resume, Debezium
# skips PAST the lost CDC event with no recovery path other than full snapshot.
producer.override.acks=1
