name=jdbc-sink-multi-topic
connector.class=io.confluent.connect.jdbc.JdbcSinkConnector
tasks.max=2

topics=orders,prices,heartbeats

connection.url=jdbc:postgresql://db.internal:5432/analytics
connection.user=connect
connection.password=secret
insert.mode=insert
auto.create=true

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081

# SMT chain — Cast only applied to "prices" topic via a predicate.
# Anti-pattern: transforms.Cast.predicate=IsPrices but the predicates= chain
# was refactored to use a new alias "PriceTopicMatcher" without renaming this
# reference. The task will fail at startup with:
#   ConfigException: Predicate IsPrices not in predicates list
transforms=Cast
transforms.Cast.type=org.apache.kafka.connect.transforms.Cast$Value
transforms.Cast.spec=price:float64
transforms.Cast.predicate=IsPrices

predicates=PriceTopicMatcher
predicates.PriceTopicMatcher.type=org.apache.kafka.connect.transforms.predicates.TopicNameMatches
predicates.PriceTopicMatcher.pattern=prices
