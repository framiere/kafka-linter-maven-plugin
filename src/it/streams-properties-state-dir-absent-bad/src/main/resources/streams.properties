# RULE: STREAMS_PROPERTIES_STATE_DIR_ABSENT.
#
# This Streams config is otherwise reasonable:
#   - application.id set                (group identity)
#   - bootstrap.servers set
#   - default serdes set
#   - replication.factor=3              (changelog topics RF=3)
#   - processing.guarantee=exactly_once_v2 (EOS opted in)
#   - num.stream.threads=8              (parallelism declared)
#
# ...but it never sets `state.dir`. Kafka Streams defaults
# `state.dir` to `${java.io.tmpdir}/kafka-streams`, which on
# most JVMs resolves to `/tmp/kafka-streams` on Linux.
#
# THE BUG SHAPE THIS RULE CATCHES:
#
# Streams persists RocksDB state stores (plus a per-task lock
# file) under `state.dir`. Without an explicit setting and
# without a JVM-level `-Djava.io.tmpdir=/persistent/path`
# override, the directory IS `/tmp/kafka-streams`.
#
# `/tmp` on modern Linux is one of three things:
#
#   1. A tmpfs mount (RAM-backed; wiped on reboot).
#   2. A systemd-tmpfiles-managed directory (cleared on
#      every boot by /usr/lib/tmpfiles.d).
#   3. Inside a container, the WRITABLE LAYER on top of
#      the read-only image layers (lost when the container
#      restarts, even if the host's /tmp is persistent).
#
# All three are EPHEMERAL — state stores written there do not
# survive a JVM restart for any reason. Graceful redeployment.
# OOM kill. Eviction. Node drain. Host reboot. Each one wipes
# the local state and forces a FULL changelog replay on
# restart.
#
# SIBLING RULE:
#
# `STREAMS_STATE_DIR_TMP` (ERROR severity) catches the
# EXPLICIT case: `state.dir=/tmp/kafka-streams`. The operator
# wrote the bad path on purpose. This rule catches the
# ABSENT case: operator forgot to set it, and the default
# behavior is identical (`/tmp/kafka-streams` via JVM tmpdir
# resolution).
#
# CONCRETE FAILURE MODES:
#
# (1) Rolling deployment turns into multi-minute outage.
#     Kubernetes deployment with `rollingUpdate.maxSurge: 1,
#     maxUnavailable: 0`. State store is 4 GB (KTable of all
#     active customer sessions over 24h, ~10M keys). On
#     deployment, each pod must replay ~4 GB of changelog
#     records before resuming processing. At 10 MB/s changelog
#     read rate that's ~7 minutes per pod, sequentially across
#     8 pods = 56 minutes of partial unavailability.
#     Operator's monitoring shows 'state store restoring' but
#     no clear root cause. Fix: state.dir on a PVC; the
#     RocksDB state survives the pod restart entirely.
#
# (2) OOM kill turns into 30-minute restore.
#     Pod hits OOM during a memory-intensive aggregation;
#     OOMKilled. Kubernetes restarts the container. New
#     container has fresh /tmp; previous state is gone.
#     Streams replays changelog from scratch. The OOM was
#     caused by holding too many windowed-aggregations in
#     RocksDB cache simultaneously — the restore amplifies
#     the original problem because the cold cache is now
#     less aggressive about eviction (no pressure yet) and
#     the bulk-load restore path doesn't honor the same
#     RocksDB cache limits. Pod OOMs again on the restore.
#     Crash-loop until operator intervenes manually.
#
# (3) Cross-AZ failover loses state.
#     Cluster-autoscaler removes a node for cost optimization.
#     The Streams pod on that node is evicted; Kubernetes
#     reschedules it on a node in a different AZ. New pod
#     has no `/tmp/kafka-streams` — full changelog replay.
#     If the changelog topic is in the same AZ as the
#     departed node, the replay is also cross-AZ (network
#     latency, bandwidth charges).
#
# (4) Disk-pressure on the host evicts /tmp/kafka-streams.
#     Host disk pressure → systemd-tmpfiles eviction kicks
#     in mid-day, clearing /tmp aggressively. Streams pod
#     loses its state mid-flight. Recovery from changelog
#     while the topology is also trying to process new
#     input → backpressure, lag spike, eventual rebalance
#     to neighbors that ALSO have state on /tmp (same host
#     pressure). Cascading failure.
#
# (5) Cold start at the worst possible time.
#     Streams app aggregates real-time fraud signals over
#     a 1-hour sliding window. State store ~2 GB. Pod
#     restart happens during a Black Friday traffic spike.
#     Replay takes 12 minutes during which the topology
#     processes no new records — exactly when the business
#     most needs the fraud signals. Operator's post-mortem:
#     "we need to make restarts faster." Real fix: persist
#     state.dir so restarts don't trigger replays.
#
# WHY THIS RULE IS WARNING (NOT ERROR):
#
# The sibling [[streams-state-dir-tmp]] catches the EXPLICIT
# /tmp case at ERROR — operator wrote the bad path. This
# rule is one notch milder because:
#
#   - The operator MIGHT have a JVM-level `-Djava.io.tmpdir=
#     /var/lib/kafka-streams` override that redirects the
#     default to a persistent mount. The plugin cannot
#     inspect JVM args at build time, only the .properties
#     file.
#   - In single-node development environments, /tmp is
#     genuinely acceptable.
#
# Even with those exceptions, WARNING is right because the
# default is "data loss on restart" and the operator should
# pin the value explicitly to document the persistent-mount
# choice.
#
# Raised here to ERROR by config override so the IT fixture
# demonstrates the violation deterministically.
#
# Fix: ONE LINE.
#   - `state.dir=/var/lib/<app>/streams` on bare-metal.
#   - `state.dir=/data/streams` mounted to a PVC on K8s.
#   - `state.dir=/mnt/ebs/streams` mounted to EBS on EC2.
#   - `state.dir=/tmp/kafka-streams` EXPLICITLY for single-
#     node dev (which then trips STREAMS_STATE_DIR_TMP and
#     forces the operator to confront the choice).
#
# The point is: PIN IT to a persistent path that survives
# JVM restart.
application.id=fraud-signals-aggregator
bootstrap.servers=kafka-1.prod.example.com:9092
client.id=bad-no-state-dir-streams
default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
default.value.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
replication.factor=3
processing.guarantee=exactly_once_v2
num.stream.threads=8
