name=s3-sink-events
connector.class=io.confluent.connect.s3.S3SinkConnector
tasks.max=2

topics=app-events

s3.bucket.name=archive-kafka-events
s3.region=eu-west-1
s3.part.size=5242880

flush.size=1000
storage.class=io.confluent.connect.s3.storage.S3Storage
format.class=io.confluent.connect.s3.format.json.JsonFormat
partitioner.class=io.confluent.connect.storage.partitioner.TimeBasedPartitioner
path.format=YYYY/MM/dd/HH
partition.duration.ms=3600000
timezone=UTC
locale=en

# Anti-pattern: value.converter=JsonConverter but value.converter.schemas.enable
# is NOT explicitly set — defaults to true. The upstream 'app-events' topic is
# populated by a microservice using StringSerializer with plain JSON payloads
# like {"eventId":"abc","userId":42,"action":"click"}, so EVERY record will
# throw DataException ("JsonConverter with schemas.enable requires \"schema\"
# and \"payload\" fields"). With errors.tolerance=none (default), the task
# stops on the first record. The S3 bucket stays empty; the operator
# debugs S3 IAM permissions for hours before discovering the schemas.enable
# default is true.
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
# missing: value.converter.schemas.enable=false
