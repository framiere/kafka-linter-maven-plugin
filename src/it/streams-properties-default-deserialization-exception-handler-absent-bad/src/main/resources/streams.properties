# RULE: STREAMS_PROPERTIES_DEFAULT_DESERIALIZATION_EXCEPTION_HANDLER_ABSENT.
#
# This Streams config is otherwise reasonable:
#   - application.id set                (group identity)
#   - bootstrap.servers set
#   - default serdes set
#   - replication.factor=3              (changelog topics RF=3)
#   - processing.guarantee=exactly_once_v2 (EOS opted in)
#   - num.stream.threads=8              (parallelism declared)
#   - state.dir set to a persistent path
#
# ...but it never sets `default.deserialization.exception.handler`.
# Kafka Streams defaults this to `LogAndFailExceptionHandler`.
#
# THE BUG SHAPE THIS RULE CATCHES:
#
# `default.deserialization.exception.handler` controls what
# happens when Streams cannot deserialize an input record:
#
#   - LogAndFailExceptionHandler (DEFAULT):
#       Logs the error, then THROWS — propagates up to the
#       StreamThread which dies. With `num.stream.threads=1`
#       (the implicit default), the topology stops entirely.
#       With more threads, only the affected thread dies,
#       but the other threads will hit the same poison
#       record on rebalance and die too.
#
#   - LogAndContinueExceptionHandler:
#       Logs the error, increments the `skipped-records-
#       total` metric, and the topology moves on. Operators
#       should alert on the metric, not the log.
#
#   - Custom handler (DLQ pattern):
#       Routes the poison record's offset + headers + raw
#       bytes to a dead-letter topic for offline inspection,
#       then continues processing.
#
# Bug shape: operator deploys Streams app reading from a
# topic written by another team. Other team ships a new
# Avro schema (FORWARD-compatible per Schema Registry).
# Streams' cached Serde is compiled against the OLD schema;
# any record encoded with the new schema fails to deserialize.
#
# LogAndFailExceptionHandler kills the topology. The pod
# auto-restarts via Kubernetes liveness — and immediately
# re-reads the SAME poison offset, dying again. Infinite
# restart loop. No new records processed. Lag grows.
#
# Operator's first sign is a PagerDuty alert at 3 AM:
# "Consumer lag on topic X is 10 minutes and growing."
# Investigation: pod status shows CrashLoopBackOff. Pod
# logs show the deserialization exception. Root cause hunt:
# whose producer changed? Was the schema upgrade safe?
#
# Real fix: bounce the consumer offset past the poison
# record manually. Long-term fix: set the exception handler
# to LogAndContinue or a DLQ handler so individual bad
# records don't take down the topology.
#
# CONCRETE FAILURE MODES:
#
# (1) Schema-drift outage at 3 AM.
#     Streams app reads Avro-encoded events from a topic
#     owned by another team. Other team ships an Avro
#     schema change (added optional field; FORWARD-
#     compatible in Schema Registry). Streams' Serde was
#     instantiated at JVM start against the OLD schema;
#     it does not re-fetch the new schema on each record.
#     First record with the new schema hits the handler →
#     fail → topology dies. Pod restarts, dies again.
#     Lag accumulates 10 minutes before someone wakes up.
#
# (2) One bad producer kills downstream.
#     Topic accepts events from 50 producers; 49 are good,
#     one is shipping malformed JSON (wrong content-type
#     header, missing required field, encoding issue).
#     The single bad producer's records appear once per
#     hour or so. Each one kills the Streams topology and
#     forces a manual offset advance. Eventually somebody
#     wires up a Sentry alert on the exception, then
#     traces it back, but the cycle has consumed 2 weeks
#     of operator time and 47 paged-out engineers.
#
# (3) Replay of historical data fails on old records.
#     Operator reads from `earliest` to backfill a new
#     state store. The topic has 6 months of history;
#     somewhere in that history is a 1-record region from
#     a schema change that was rolled back but never
#     cleaned up. Streams hits it during backfill, fails,
#     restart loop. Backfill never completes. Operator
#     has to either truncate the topic or manually skip
#     the offset — neither is great.
#
# (4) Production crash from a single corrupted message.
#     One record's bytes get corrupted (broker storage
#     issue, network glitch during produce, a bug in a
#     wrapper SDK). The corrupted record is now permanent.
#     Streams hits it and dies. Forever. Until somebody
#     advances the offset past it manually. With LogAnd
#     Continue, the corrupted record would log + metric +
#     move on.
#
# (5) Test environments can't tolerate fail-fast.
#     QA / staging environments routinely receive bad
#     records from upstream test producers (developers
#     experimenting with new schemas, partially-implemented
#     features). Each bad record kills the QA Streams app;
#     QA team can't run end-to-end tests because the app
#     keeps dying. Production Streams config inherited
#     from staging-template → defaults to LogAndFail in
#     prod too.
#
# WHY THIS RULE IS INFO (NOT WARNING/ERROR):
#
# The default `LogAndFailExceptionHandler` is genuinely
# right for SOME workloads:
#
#   - Financial settlement (every record matters; better
#     to halt than to silently drop)
#   - Regulatory reporting (auditors will ask why a
#     record was missing; "we skipped it" is not an
#     acceptable answer)
#   - Strict-typing data pipelines (any deserialization
#     error is a real schema bug that must be fixed)
#
# For these workloads, `LogAndFailExceptionHandler`
# EXPLICITLY documents the deliberate choice. For most
# other workloads (analytics, monitoring, derived views,
# CDC-to-search-index), `LogAndContinueExceptionHandler`
# or a DLQ handler is correct.
#
# The plugin cannot infer your domain. INFO is right.
# Raised here to ERROR by config override so the IT fixture
# demonstrates the violation deterministically.
#
# Fix: ONE LINE.
#   - `default.deserialization.exception.handler=org.apache.
#     kafka.streams.errors.LogAndContinueExceptionHandler`
#     for most production workloads.
#   - A custom DLQ handler class for workloads that need
#     offline poison-record inspection.
#   - `default.deserialization.exception.handler=org.apache.
#     kafka.streams.errors.LogAndFailExceptionHandler`
#     EXPLICITLY to document the fail-fast posture.
#
# The point is: PICK ONE deliberately.
application.id=transactions-enricher
bootstrap.servers=kafka-1.prod.example.com:9092
client.id=bad-no-deser-handler-streams
default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
default.value.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
replication.factor=3
processing.guarantee=exactly_once_v2
num.stream.threads=8
state.dir=/var/lib/transactions-enricher/streams
