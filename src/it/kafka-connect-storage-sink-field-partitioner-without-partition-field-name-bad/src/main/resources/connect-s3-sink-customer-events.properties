# =============================================================================
# Confluent S3 sink connector consuming the `customer.events` topic and
# writing records to s3://my-data-lake/customer-events/.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#
#   partitioner.class    = io.confluent.connect.storage.partitioner.FieldPartitioner
#   # NOTE: NO `partition.field.name` line!
#
# WHY THIS IS A "BROKEN-PARTITIONING" BUG:
#
# Confluent's storage-sink connectors (S3SinkConnector, GcsSinkConnector,
# HdfsSinkConnector, Hdfs3SinkConnector) write Kafka records to object
# storage in Hive-style partitioned directory layouts that downstream query
# engines (Hive, Presto/Trino, Athena, Glue, Snowflake, BigQuery, Databricks)
# read as table partitions. The connector's `partitioner.class` config
# selects WHICH partitioning strategy to apply:
#
#   DefaultPartitioner
#     Partitions by Kafka partition ID. Files land at:
#       s3://bucket/topic/partition=<N>/<file>
#     No additional config required.
#
#   TimeBasedPartitioner (and subclasses DailyPartitioner / HourlyPartitioner)
#     Partitions by an extracted timestamp. Files land at:
#       s3://bucket/topic/year=YYYY/month=MM/day=DD/hour=HH/<file>
#     Requires: path.format, partition.duration.ms, timestamp.extractor.
#
#   FieldPartitioner
#     Partitions by the value of a named field extracted from the
#     record's value Struct. Files land at:
#       s3://bucket/topic/<field>=<value>/<file>
#     Requires: partition.field.name (no default).
#
# Each strategy has its own required configs; without those configs, the
# strategy is structurally incomplete. The FieldPartitioner's
# `partition.field.name` config is unique: it is the ONLY config that
# defines WHERE records are written. Without it, the partitioner has no
# field to extract — the strategy cannot function.
#
# REAL-WORLD INCIDENT SHAPES:
#
# (1) **Operator switches partitioner without reading docs.**
#     A team's S3 sink had been running with DefaultPartitioner, writing
#     to `s3://bucket/customer-events/partition=<N>/<file>`. The team's
#     data engineers complain: "we can't query by customer in Athena
#     because every customer's records are spread across all Kafka
#     partitions." The operator changes:
#
#        partitioner.class=io.confluent.connect.storage.partitioner.FieldPartitioner
#
#     They forget that FieldPartitioner needs `partition.field.name`.
#
#     In Confluent Platform 7.0+, the connector task fails at startup
#     with:
#
#        ConfigException: Partition field name(s) should be specified for FieldPartitioner
#
#     The error appears in the worker logs but the connector-status REST
#     endpoint still shows RUNNING (Connect's state model lets a connector
#     be RUNNING while all tasks are FAILED). The team's monitoring
#     dashboard says "green" while no records are written.
#
# (2) **Helm-chart drift.**
#     Org's Helm chart for S3 sink connectors has
#     `partitionerClass: io.confluent.connect.storage.partitioner.FieldPartitioner`
#     as the default (the chart author intended every team to set their
#     own `partition.field.name` via values override). A new team
#     deploys the chart with their values.yaml that overrides everything
#     EXCEPT `partition.field.name` (they didn't know about it). Every
#     connector deployed by this team fails at startup.
#
# (3) **Older Confluent version with silent runtime failure.**
#     A team running Confluent Platform 6.2 (pre-startup-validation)
#     deploys an S3 sink connector with FieldPartitioner and no
#     `partition.field.name`. The connector starts cleanly (configure
#     method accepts null field name). The first record arrives;
#     `FieldPartitioner#encodePartition` calls
#     `record.value().get(null)` which throws DataException; the task
#     transitions to FAILED. Worse, in early kafka-connect-storage-common
#     4.x versions, the partitioner uses the literal string 'null' as
#     both field name AND field value, writing files to:
#
#        s3://bucket/customer-events/null=null/<file>
#
#     The connector runs successfully but every file lands in the same
#     (broken) partition directory. Downstream Hive/Athena/Glue see
#     `null=null` and cannot query the data as expected.
#
# (4) **Migration from TimeBasedPartitioner.**
#     A team had `partitioner.class=TimeBasedPartitioner` with all the
#     time-related configs (path.format, partition.duration.ms,
#     timestamp.extractor). They want to switch to FieldPartitioner. They
#     change `partitioner.class` to FieldPartitioner and forget to set
#     `partition.field.name`. The old time-related configs are still
#     present (silently ignored by FieldPartitioner — see the inverse
#     rule CONNECT_STORAGE_SINK_PATH_FORMAT_WITHOUT_TIME_PARTITIONER).
#     The new connector fails at startup.
#
# (5) **Multi-level partitioning intent without the field-name list.**
#     Operator wants `<topic>/region=<r>/product_category=<c>/<file>` —
#     multi-level partitioning by region+product_category. They set
#     `partitioner.class=FieldPartitioner` but forget that the
#     multi-level case requires:
#
#        partition.field.name=region,product_category
#
#     (a comma-separated list). With the field name missing entirely,
#     the connector fails; with the field name set to just `region`,
#     the connector partitions only by region — not the intended
#     two-level scheme (a partial misconfiguration that this rule does
#     NOT catch).
#
# THE FIX:
#
# Either set partition.field.name (FieldPartitioner correctly configured):
#
#   partition.field.name = customer_id
#
# Or change partitioner.class to a different strategy if field-based
# partitioning was not actually intended:
#
#   # Kafka partition ID:
#   partitioner.class = io.confluent.connect.storage.partitioner.DefaultPartitioner
#
#   # Time-based (hourly):
#   partitioner.class = io.confluent.connect.storage.partitioner.HourlyPartitioner
#   path.format = 'year='YYYY/'month='MM/'day='dd/'hour='HH
#   partition.duration.ms = 3600000
#   timestamp.extractor = Record
#
# =============================================================================

name=customer-events-s3-sink
connector.class=io.confluent.connect.s3.S3SinkConnector
tasks.max=4

topics=customer.events

s3.bucket.name=my-data-lake
s3.region=eu-west-1
s3.part.size=26214400
storage.class=io.confluent.connect.s3.storage.S3Storage
format.class=io.confluent.connect.s3.format.parquet.ParquetFormat

# VIOLATION: FieldPartitioner declared but partition.field.name is absent.
# FieldPartitioner uses partition.field.name (no default) to identify the
# record-value field whose value becomes the partition key. Without it,
# the connector either fails at startup with ConfigException (Confluent
# Platform 7.0+), throws DataException on the first record (Confluent
# 6.x), or writes files to literal `<topic>/null=null/<file>` paths that
# downstream Hive/Athena/Glue tooling cannot query (older versions). Fix:
# either set `partition.field.name=customer_id` (or a comma-separated list
# for multi-level partitioning), or change partitioner.class to a
# different strategy.
partitioner.class=io.confluent.connect.storage.partitioner.FieldPartitioner

flush.size=10000
rotate.interval.ms=600000

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
