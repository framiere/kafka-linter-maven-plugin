# =============================================================================
# IT fixture: CONSUMER_PROPERTIES_CLIENT_RACK_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A kafka-clients consumer .properties file destined for
#   `new KafkaConsumer(Properties)` inside the
#   `payments-event-fanout` microservice — a Spring Boot
#   application running on EKS in eu-west-3 (Paris), with
#   pods spread across 3 availability zones (eu-west-3a,
#   eu-west-3b, eu-west-3c). The cluster is a managed MSK
#   Provisioned cluster: 9 brokers (3 per AZ), Apache Kafka
#   3.6.0, with KIP-392-compliant rack-aware broker setup:
#     - broker.rack=eu-west-3a (set per broker via MSK's
#       cluster-creation API; one rack tag per AZ)
#     - replica.selector.class=org.apache.kafka.common.replica
#       .RackAwareReplicaSelector (set cluster-wide in MSK's
#       advanced configuration; default for MSK 2.6.x+ is
#       still the leader-only selector, the operator set this
#       explicitly during cluster creation)
#
#   The consumer subscribes to `payment-events` (96
#   partitions, replication-factor=3, rack-aware placement
#   ensures one replica per AZ for every partition) at
#   ~50 MB/sec total cluster-wide consumer-side throughput.
#   The consumer fans out events to: (a) a per-tenant
#   downstream topic, (b) a fraud-screening pipeline,
#   (c) a finance audit log. Each pod runs 2 consumer
#   threads; the deployment has 20 pods across 3 AZs.
#
# What's wrong
#   `client.rack` (KIP-392, Apache Kafka 2.4, December
#   2019) is the CONSUMER-SIDE availability-zone tag that
#   tells the broker which AZ this consumer is running in.
#   Without it, the broker's `RackAwareReplicaSelector`
#   has no rack to match against — it falls back to
#   returning the partition leader for every fetch,
#   exactly as if the selector were `LeaderReplicaSelector`
#   (the default).
#
#   For this `payments-event-fanout` topology:
#     - 50 MB/sec fetch throughput across 20 pods
#     - RF=3 across 3 AZs → leaders distributed uniformly,
#       so ~67% of every consumer's fetches cross an AZ
#       boundary (the consumer is in AZ-X, the leader is
#       in AZ-Y or AZ-Z)
#     - 50 MB/sec × 67% cross-AZ × 86400s/day × 30 days
#       = ~87 TB/month of cross-AZ data transfer
#     - AWS charges $0.01/GB cross-AZ within a region
#       (TWICE — once for egress out of the source AZ,
#       once for ingress into the destination AZ; in
#       practice billed as $0.01/GB single direction =
#       $0.02/GB round-trip on the wire)
#     - 87 TB × $0.02/GB × 6 AZ-pair directions = a non-
#       trivial line on the monthly bill, in the
#       thousands-of-dollars range for THIS consumer
#       alone, and that's BEFORE the org's other 100+
#       microservices each leak their own share of
#       cross-AZ traffic
#
#   Setting `client.rack=${POD_ZONE}` (where POD_ZONE is
#   injected via the Kubernetes Downward API from the
#   node's `topology.kubernetes.io/zone` label):
#     - the broker selector matches the consumer's rack
#       against the in-sync follower replicas' racks
#     - returns the same-AZ follower (every partition has
#       one in this cluster, by rack-aware placement
#       guarantee)
#     - cross-AZ fetch traffic drops from ~67% to ~0%
#     - monthly AWS DataTransfer-Regional-Bytes line drops
#       by ~95% for this consumer
#
# The eight bug shapes this rule catches
#   (1) AWS multi-AZ cluster — SRE FinOps review surfaces
#       ~$5k/month of cross-AZ traffic; root cause is the
#       absence of `client.rack` on ~30 consumer apps. Each
#       app is small (a few hundred dollars per month);
#       aggregated, the bill is meaningful. The static-
#       analysis catch surfaces every absent occurrence at
#       PR time, before deployment.
#
#   (2) GCP multi-region cluster — RF=5 across 3 regions,
#       ~67% of fetches cross a region boundary, GCP
#       inter-region is $0.01-0.02/GB; 100 MB/sec total
#       fetch × 67% × $0.01/GB ≈ $17.4k/month vs $2k/month
#       with `client.rack` set.
#
#   (3) MSK / Confluent Cloud Dedicated — broker-side
#       ALREADY configured with rack-aware selector by
#       default; only the consumer side needs `client.rack`
#       set. Many operators do not realize the broker side
#       is already there and never configure the consumer
#       side. The cost savings are immediate the moment
#       `client.rack` is set.
#
#   (4) Strimzi cluster — broker.rack set via
#       `KafkaNodePool.spec.template.brokerRack` but
#       consumer-side empty. Broker side is configured;
#       broker selector falls back to leader because the
#       consumer-side rack is empty; the configured
#       broker-side stack does nothing. Silent: no error,
#       no log, just no cost reduction.
#
#   (5) Helm chart with no `client.rack` default — 100+
#       teams use the chart; each pays the cross-AZ tax.
#       Static analysis catches the chart-side absence at
#       first commit, prompting the platform team to add
#       `client.rack: "${KAFKA_CONSUMER_RACK}"` to the
#       chart's defaults and inject the AZ via the Downward
#       API.
#
#   (6) Spring Boot consumer config — Apache Kafka docs
#       treat `client.rack` as a footnote; most tutorials
#       never mention it. Spring Boot's
#       `spring.kafka.consumer.properties.*` passes through
#       to kafka-clients defaults UNLESS the operator
#       overrides. Every Spring Boot Kafka consumer on
#       default config pays cross-AZ.
#
#   (7) Multi-tenant consumer library passing properties
#       verbatim — internal library accepts a `Properties`
#       from the calling application and passes it
#       verbatim to `new KafkaConsumer(...)`. Library docs
#       list `bootstrap.servers`, `group.id`,
#       deserializers as 'required' and everything else as
#       'optional with sensible defaults'. `client.rack` is
#       not mentioned; no application ever sets it.
#
#   (8) Confluent Cloud tier mismatch — Confluent Cloud
#       Dedicated has rack-aware selector by default;
#       Basic / Standard tiers do NOT. Operators migrating
#       up tiers may set `client.rack` correctly, but
#       operators starting on Confluent Cloud may never
#       know it exists.
#
# Why INFO and not WARNING / ERROR
#   `client.rack` alone is a NO-OP if the broker-side stack
#   is not also configured. For deployments that ARE single-
#   AZ (some dev clusters, some cost-optimized prod
#   clusters), rack-awareness has no benefit. The linter
#   cannot infer the broker-side config or the deployment
#   shape from the consumer .properties alone. The rule is
#   a 'have you considered whether your deployment crosses
#   an AZ boundary?' nudge.
#
#   This IT fixture's pom.xml overrides the severity to
#   ERROR so that `mvn verify` fails on this bad
#   configuration, demonstrating the rule fires correctly.
#
# Fix
#   For multi-AZ / multi-region deployments where the
#   broker-side stack is configured (broker.rack per
#   broker + replica.selector.class=RackAwareReplicaSelector):
#
#     client.rack=${POD_ZONE}
#
#   In Kubernetes, inject POD_ZONE via the Downward API
#   from the node's `topology.kubernetes.io/zone` label,
#   then template it into the consumer.properties at
#   process start.
#
#   For single-AZ deployments or when the broker-side
#   stack is NOT configured, the right answer is still to
#   document the deliberate choice with a comment in the
#   .properties — but the rule will fire on absence. The
#   operator can either (a) set client.rack to a known
#   value and accept the no-op, (b) suppress the rule for
#   that specific deployment via the plugin's per-rule
#   severity override.
# =============================================================================

# Cluster connectivity.
bootstrap.servers=b-1.payments-msk.abc123.c5.kafka.eu-west-3.amazonaws.com:9098,b-2.payments-msk.abc123.c5.kafka.eu-west-3.amazonaws.com:9098,b-3.payments-msk.abc123.c5.kafka.eu-west-3.amazonaws.com:9098

# Consumer identity — group + per-pod client id.
group.id=payments-event-fanout
client.id=payments-event-fanout-pod-0

# Deserializers — the consumer-shape gate.
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer

# Schema Registry endpoint.
schema.registry.url=https://schema-registry.payments.svc.cluster.local:8081

# Offset semantics — earliest for the audit-log pipeline (we never want to skip).
auto.offset.reset=earliest

# Auto-commit is OFF — we commit manually after the downstream fanout completes.
enable.auto.commit=false

# Isolation — only read committed records (the producers are transactional).
isolation.level=read_committed

# Poll-loop dimensions — tuned for 200 records of average payment-event payload (~2 KB each).
max.poll.records=200
max.poll.interval.ms=300000

# Group-membership timing trio.
session.timeout.ms=45000
heartbeat.interval.ms=15000
request.timeout.ms=60000

# Fetch tuning — small batches for low end-to-end latency.
fetch.min.bytes=1024
fetch.max.wait.ms=500

# Cooperative-sticky for low-disruption rebalances.
partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# MISSING:
#   client.rack=${POD_ZONE}
# Without this key, the broker's RackAwareReplicaSelector falls back to leader
# for every fetch from this consumer — the configured broker-side rack-aware
# stack does nothing on the consumer side. For this MSK cluster on EKS spread
# across 3 AZs (eu-west-3a/b/c), ~67% of every fetch crosses an AZ boundary
# (the leader is in a different AZ from the consumer pod ~2/3 of the time).
# At 50 MB/sec cluster-wide consumer-side fetch throughput, that's ~33 MB/sec
# cross-AZ × 86400s × 30 days = ~87 TB/month of cross-AZ traffic. AWS charges
# $0.01/GB cross-AZ within a region; the monthly AWS DataTransfer-Regional-
# Bytes line for THIS consumer alone is in the thousands-of-dollars range,
# and the org has 100+ microservices each leaking their own share. Setting
# `client.rack=${POD_ZONE}` (with POD_ZONE injected via the Kubernetes
# Downward API from the node's `topology.kubernetes.io/zone` label) cuts
# cross-AZ fetch traffic from ~67% to ~0% (every partition has a same-AZ
# follower under RF=3 rack-aware placement) and drops the monthly bill by
# ~95% for this consumer. Companion broker-side prerequisites — already set
# on this MSK cluster: broker.rack per broker + replica.selector.class=
# org.apache.kafka.common.replica.RackAwareReplicaSelector. The optimization
# is one consumer-side line.
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
