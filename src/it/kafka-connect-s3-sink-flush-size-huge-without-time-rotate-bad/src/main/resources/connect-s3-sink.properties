name=s3-sink-events-warehouse
connector.class=io.confluent.connect.s3.S3SinkConnector
tasks.max=4

topics=events

s3.region=eu-west-1
s3.bucket.name=warehouse-events

# Anti-pattern: flush.size=1000000 with NO time-based rotation.
# The S3 sink buffers records in worker heap (per-partition
# ByteArrayOutputStream); without rotate.interval.ms or
# rotate.schedule.interval.ms, the buffer grows until 1M records have
# arrived. At average 1KB/record that is 1GB heap per partition per
# task. Worker OOMs before the first flush.
flush.size=1000000
storage.class=io.confluent.connect.s3.storage.S3Storage
format.class=io.confluent.connect.s3.format.parquet.ParquetFormat
partitioner.class=io.confluent.connect.storage.partitioner.DefaultPartitioner

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
