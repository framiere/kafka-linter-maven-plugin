# =============================================================================
# A Kafka producer configuration that has been HALF-HARDENED for production use
# with Confluent Schema Registry: `auto.register.schemas=false` is set (the
# correct hardening choice — producers should not POST new schemas to SR on
# the fly) but `use.latest.version=true` is MISSING. This is the dangerous
# half-migrated state from Confluent's "Category C → Category A" producer
# hardening workflow.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#
#   auto.register.schemas = false          # ← governance gate IN PLACE
#   # use.latest.version  = (UNSET)        # ← version-pinning gate OPEN
#
# WHY THIS IS A SILENT-DATA-LOSS BUG:
#
# Confluent's producer-side schema-resolution architecture has THREE valid
# states, controlled by the pair (`auto.register.schemas`, `use.latest.version`):
#
#   (1) `auto.register.schemas=true` (default; Category C):
#       Producer compares its embedded schema against SR's latest registered
#       version; if different, POSTs a new version. Drift-friendly,
#       schema-sprawl-friendly, no review. Appropriate ONLY for dev.
#
#   (2) `auto.register.schemas=false` + `use.latest.version=false` (default):
#       Producer cannot register new schemas (good — governance gate in
#       place) but on first send asks SR for the ID matching its EMBEDDED
#       (compile-time) schema. If found, caches that ID FOREVER. The
#       producer is PINNED to that schema-ID for its entire JVM lifetime.
#
#   (3) `auto.register.schemas=false` + `use.latest.version=true`:
#       Production-ready. Producer fetches LATEST registered version from
#       SR on roughly the cache-refresh cadence; writes records with that
#       latest version's ID; refreshes periodically. Category-A-and-
#       versioning-hardened. Kafka records track SR latest in lockstep.
#
# The half-migrated state (auto-register OFF, use-latest-version OFF) is a
# common artifact of partial security-review work: someone flips
# `auto.register.schemas=false` to clear an audit ticket, but the audit
# checklist doesn't include `use.latest.version`, so it stays default-false.
# The producer redeploys; the audit closes; the producer is now PINNED to
# whatever schema-ID was cached on first send.
#
# As new compatible schema versions are registered in SR (via Terraform,
# CI/CD, or peer producers), the half-migrated producer keeps writing
# records with the OLD cached ID. Downstream consumers using the LATEST
# schema project the missing-newer-fields to DEFAULTS — silent semantic
# data loss for every field added after producer deployment.
#
# REAL-WORLD INCIDENT SHAPES:
#
# (1) **Partial security-review migration.**
#     Security audit flags `auto.register.schemas=true` across the
#     producer fleet (Category C). Team mass-flips all producers to
#     `auto.register.schemas=false` to clear the audit ticket; the audit
#     checklist doesn't include `use.latest.version`. Producers redeploy
#     half-migrated; audit closes. Months later, a downstream team adds a
#     new field to the topic's Avro schema (registered via Terraform), but
#     the field never appears in any producer's records — every producer
#     is pinned to its compile-time schema-ID. Downstream analytics that
#     depend on the field show as null for that range; a backfill is
#     required across weeks of records.
#
# (2) **Cached-ID-no-longer-exists.**
#     A retention/cleanup task hard-deletes "unused" schema versions from
#     SR. One of the deleted versions is the version cached by a half-
#     migrated producer. The producer's next `send()` fails with
#     `Schema not found for ID 1234`. The producer crashes; auto-restart
#     re-caches against the new latest (whatever that is); the producer
#     now serializes against a different schema than its compiled POJO
#     knows about — Kafka records have the new schema-ID but the wire
#     bytes correspond to the OLD class structure. Consumers see decode
#     errors or wrong field values.
#
# (3) **Multi-team schema evolution.**
#     Team A owns a Kafka topic with multiple producer teams writing to
#     it. Team A registers a new compatible Avro schema version (added an
#     optional field). Team B's producers are half-migrated; they
#     continue writing records with the old schema-ID. Team C's producers
#     are fully hardened (auto-register=false, use.latest.version=true);
#     they immediately pick up the new schema and write records with the
#     new ID and the new field populated. Consumers see a MIX of records
#     — half with the new field, half without — and have to debug why
#     the field is sometimes present and sometimes not. Root cause: Team
#     B's half-migrated state.
#
# (4) **Helm-chart default-only hardening.**
#     Org's internal Helm chart for Kafka producers templates
#     `autoRegisterSchemas: "false"` by default (good — defaults to
#     hardened) but does NOT template `useLatestVersion: "true"`. Every
#     team that uses defaults gets the half-migrated state. The chart
#     author later realizes the gap and adds `useLatestVersion: "true"`
#     to defaults, but existing deployments don't pick up the chart
#     update until their next redeploy — the gap persists across the
#     fleet for an unbounded time.
#
# (5) **Confluent docs copy-paste.**
#     Developer reads the Confluent doc on disabling auto-register (the
#     security-hardening guide) and copies the `auto.register.schemas=
#     false` snippet into their producer config. The doc has `use.latest.
#     version=true` two paragraphs later in a separate code block, which
#     the developer doesn't include because they're treating each snippet
#     as independent. The producer ships half-migrated.
#
# (6) **CI/CD with manual schema registration.**
#     Team has a CI pipeline that registers schemas via Terraform.
#     Producers are configured with `auto.register.schemas=false` (so the
#     producer can't accidentally register a wrong schema). The CI
#     pipeline registers new versions over time. Producers, half-
#     migrated, never pick up the CI-registered versions because they're
#     cached on their initial-cached schema-IDs. Discovery happens during
#     an unrelated incident where someone queries SR for the current
#     schema and notices it's two versions ahead of what producers are
#     actually writing.
#
# THE FIX:
#
# Add `use.latest.version=true` alongside the existing
# `auto.register.schemas=false`:
#
#   auto.register.schemas         = false
#   use.latest.version            = true
#   latest.compatibility.strict   = true    # (the default — keep it)
#
# The producer will then fetch the LATEST registered version from SR per
# `cache.capacity.config` intervals, keeping records in lockstep with
# current SR state. `latest.compatibility.strict=true` (the default)
# ensures the runtime POJO can actually be projected into the latest
# schema before each record is written — fails fast otherwise (which is
# what you want during a deploy).
#
# =============================================================================

bootstrap.servers=kafka.internal:9092
client.id=orders-producer
acks=all
enable.idempotence=true

key.serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
value.serializer=io.confluent.kafka.serializers.KafkaAvroSerializer

schema.registry.url=https://sr.internal:8081

# VIOLATION: auto.register.schemas=false is the correct producer-hardening
# choice (Category-A governance gate) BUT use.latest.version is UNSET (defaults
# to false). The producer is now pinned to whatever schema-ID is cached on
# first send — it will NEVER pick up new compatible versions registered in SR
# afterwards. As schema evolution happens in SR (via Terraform/CI), this
# producer keeps writing records with the old cached ID; downstream consumers
# using the latest schema project the missing-newer-fields to defaults — silent
# semantic data loss. Fix: add `use.latest.version=true` alongside the existing
# `auto.register.schemas=false` to complete the Category-A migration.
auto.register.schemas=false

# Compression — orthogonal to the schema-resolution issue but included to make
# the fixture a realistic full producer config.
compression.type=zstd
linger.ms=20
batch.size=65536
buffer.memory=33554432
delivery.timeout.ms=120000
