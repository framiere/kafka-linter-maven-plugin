# =============================================================================
# IT fixture: SECURITY_SSL_TRUSTSTORE_LOCATION_TMP (bad)
# =============================================================================
#
# What this file is
#   A Kafka mTLS client .properties file for `risk-scoring-api` — a
#   Spring Boot 3.2 / Java 17 microservice running on a shared
#   OpenShift 4.14 cluster, consuming `risk.scoring.requests` from a
#   Kafka 3.7 cluster operated by the central security platform team.
#
#   The cluster requires both mTLS and SASL/SCRAM-SHA-512 (defence in
#   depth) — every client authenticates with a TLS client cert AND
#   sends a SCRAM credential over the encrypted channel.
#
#   The platform team supplies the corporate root CA bundle as a
#   ConfigMap; the Spring Boot app mounts the ConfigMap and uses it as
#   the truststore. The team's init-container script writes the
#   ConfigMap content to a Java-readable PKCS12 truststore at
#   `/tmp/kafka.truststore.p12` so the kafka-clients library can load
#   it through the standard JKS/PKCS12 SPI. (The team could use
#   `ssl.truststore.type=PEM` and skip the conversion entirely, but
#   the codebase was written before KIP-651 / Kafka 2.7 was widely
#   adopted, and the PEM type wasn't on the team's radar.)
#
# What's wrong
#   `ssl.truststore.location=/tmp/kafka.truststore.p12` — the truststore
#   (the CA bundle the client uses to validate broker certificates
#   during the TLS handshake) is stored in a world-writable scratch
#   directory.
#
#   **This is qualitatively worse than the keystore-in-tmp case** —
#   the keystore-in-tmp rule (sibling: security-ssl-keystore-location-
#   tmp) covers private-key EXFILTRATION: an attacker who reads the
#   keystore impersonates the client. The truststore-in-tmp rule
#   covers MITM via INJECTION: an attacker who writes to the
#   truststore replaces the CA bundle and the client trusts an
#   attacker-controlled broker. The MITM intercepts EVERY connection
#   the client makes, including the SCRAM credential the client sends
#   on the encrypted channel — defeating the defence-in-depth that
#   the SCRAM-on-top-of-mTLS was supposed to provide.
#
#   The attack does NOT trip any TLS-validation error: the client
#   sees a successful handshake, the broker doesn't see the
#   connection (it goes to the MITM proxy), the network layer sees a
#   normal TCP+TLS conversation. The only detection signal is on the
#   broker side ('I expected a connection from risk-scoring-api but I
#   never got one') and most ops teams don't alert on that.
#
# Why the truststore-overwrite attack is realistic
#   (1) **Sticky bit semantics on /tmp.** The Linux default mode on
#       `/tmp` is `1777` (drwxrwxrwt). The sticky bit (`1`) prevents
#       non-owners from `unlink()`-ing files. It does NOT prevent
#       `open(..., O_WRONLY | O_TRUNC)` on a file the attacker owns or
#       has write permission on, and the standard `umask 0022`
#       produces files with mode `644` (owner-writable). On a host
#       where the JVM runs as a shared service-account user, every
#       other process running as the same UID — including a sidecar
#       container, an init container, a debug `kubectl exec`, an
#       attacker who landed in a co-located pod — can rewrite the
#       file via `open(O_WRONLY | O_TRUNC)`. The sticky bit does NOT
#       help.
#
#   (2) **Container UID sharing.** On Kubernetes, multiple containers
#       in the same pod share the same Linux namespace and (by
#       default) the same `runAsUser`. If any sibling container in
#       this pod is compromised, it has full write access to /tmp.
#       Beyond that, on nodes where multiple pods run as the same UID
#       (a common default of UID 1000), pods in DIFFERENT workloads
#       can share /tmp if the platform mounts host /tmp into the pod
#       (some teams do this for `kubectl debug` ergonomics — an
#       anti-pattern).
#
#   (3) **Init-container failure window.** The cert-rotation init
#       container fetches the corporate CA bundle from Vault and
#       writes it to `/tmp/kafka.truststore.p12` on every pod startup.
#       The init-container runs as root (it needs to write to /tmp
#       owned by the previous pod's UID). If an attacker has briefly
#       gained code-exec in the init container's image (a compromised
#       base image, a supply-chain attack on Vault Agent, a CVE in
#       the init-container's HTTP client), they overwrite the
#       truststore before the app container starts. The app reads the
#       malicious truststore on startup and validates an attacker-
#       controlled broker cert successfully.
#
#   (4) **DNS hijack amplification.** The truststore-overwrite alone
#       is not enough — the attacker also needs to route the client's
#       connection to their MITM proxy. Several realistic vectors:
#         (a) Compromise of the K8s CoreDNS pod that resolves
#             `kafka-security.platform.internal` — the attacker
#             redirects to their MITM proxy IP.
#         (b) `/etc/hosts` injection from a sidecar with CAP_NET_ADMIN
#             or via a hostPath volume mount.
#         (c) `LD_PRELOAD` shim of `getaddrinfo()` from a sibling
#             pod sharing the JVM's PID namespace via ephemeral
#             debug container.
#       Each of these would normally fail the cert-hostname-
#       verification check — but with the attacker's truststore AND
#       a cert the attacker issued for the correct hostname (signed
#       by the attacker's CA in the malicious truststore), every
#       check passes.
#
#   (5) **Persistence across pod restarts.** On nodes where /tmp is
#       a tmpfs shared across pod restarts, the malicious truststore
#       persists. The cert-rotation pipeline DOES overwrite it on
#       the next pod startup (init container fetches a fresh CA
#       bundle from Vault), but the window between compromise and
#       the next pod restart can be days — and a determined attacker
#       can rewrite the truststore again from a co-located process
#       between pod restarts.
#
# Specific impact on this risk-scoring-api service
#   The service consumes risk.scoring.requests events; each event
#   contains a customer ID, transaction details, and the customer's
#   geographic location. With a successful MITM attack:
#     - The attacker sees EVERY transaction the bank scores in
#       real-time (PCI-DSS §3.4 cardholder-data exposure).
#     - The attacker can INJECT fake risk-scoring requests (the
#       MITM proxy sends arbitrary records to the app's consumer).
#     - The attacker captures the SCRAM credential and replays it
#       against the real broker from another network position to
#       maintain access independent of the MITM.
#     - The attacker can MODIFY in-flight risk-scoring responses
#       the app produces back to a `risk.scoring.results` topic,
#       silently downgrading high-risk-score transactions to low-
#       risk and bypassing the bank's fraud filtering.
#
# The six bug shapes this rule catches
#   (1) **Apache Kafka quickstart copy-paste.** The official SSL
#       quickstart shows `ssl.truststore.location=/tmp/kafka.client.
#       truststore.jks` next to the keystore example.
#
#   (2) **Init container writing CA bundle to /tmp.** A Vault Agent
#       or generic init container fetches the corporate CA bundle
#       and drops it in `/tmp/` for the app container to read. Fix:
#       use an EmptyDir mounted at `/var/run/secrets/kafka/`.
#
#   (3) **Bind-mounted host truststore.** A team mounts the host's
#       `/etc/ssl/certs/ca-bundle.crt` into the container at `/tmp/
#       ca-bundle.crt` for convenience; the path propagates into
#       production.
#
#   (4) **Dev shell script survival.** `local-dev.sh` writes a
#       test truststore to `/tmp/dev-truststore.jks` for local
#       integration tests with a Testcontainers Kafka broker; the
#       path leaks into production via Helm templating.
#
#   (5) **Spring Boot `application.yml` template.** Many Spring
#       Boot tutorials show `spring.kafka.properties.ssl.truststore.
#       location=/tmp/truststore.p12`. The value reaches production
#       via Helm chart inheritance.
#
#   (6) **CI runner test-config leak.** Test suites use `/tmp/
#       test-truststore.jks`; the path leaks into a production
#       config via a shared `application-test.yml` that overrides
#       `application.yml`.
#
# Why WARNING (not INFO / ERROR) by default
#   Exploiting the truststore-overwrite requires co-located code-exec
#   AND a DNS/routing hijack — both are non-trivial. In a fully
#   isolated single-tenant deployment, the immediate vulnerability is
#   lower. But the threat model is qualitatively worse than the
#   keystore case (MITM > impersonation), and on shared-tenancy
#   infrastructure (which is most enterprise K8s today) the rule
#   should probably be elevated to ERROR via pom-level override.
#
#   This IT fixture's pom.xml overrides the severity to ERROR so
#   `mvn verify` fails on this bad configuration, demonstrating the
#   rule fires correctly.
#
# Fix
#   Move the truststore to a path with proper file-system permissions
#   where ONLY a privileged user can write. The TRUSTSTORE CONTENT is
#   public (CA certs only, no private key material) so `chmod 644` is
#   safe — but the WRITE permission must be restricted. Pick the
#   appropriate runtime:
#
#   (1) **Kubernetes (preferred).** Mount the corporate CA bundle as
#       a ConfigMap at `/var/run/secrets/kafka/truststore.p12` with
#       `defaultMode: 0444`:
#         volumes:
#           - name: kafka-truststore
#             configMap:
#               name: risk-scoring-kafka-truststore
#               defaultMode: 0444
#         volumeMounts:
#           - name: kafka-truststore
#             mountPath: /var/run/secrets/kafka
#             readOnly: true
#       The ConfigMap is immutable on mount (any update requires a
#       pod restart); no process in the container can rewrite the
#       truststore file.
#
#   (2) **Vault Agent.** Write to `/run/vault/kafka/truststore.p12`
#       in a tmpfs mount that is per-pod and owned by the service
#       account, not the world-writable `/tmp`.
#
#   (3) **Bare-metal RHEL/Debian.** Write the truststore to
#       `/etc/kafka/ssl/truststore.p12` owned by `root:root` with
#       `chmod 644` — the JVM (running as a non-root service-account
#       user) reads it; no non-root process can rewrite it.
#
#   (4) **PEM-native preferred.** Use `ssl.truststore.type=PEM`
#       (KIP-651, Kafka 2.7+) and point at a ConfigMap-mounted CA
#       bundle in PEM form. This eliminates the JKS/PKCS12 conversion
#       step entirely and matches the cert-manager / Vault output
#       format natively.
# =============================================================================

# Cluster connectivity.
bootstrap.servers=kafka-security.platform.internal:9094

# Security stack — mTLS + SASL/SCRAM.
security.protocol=SASL_SSL
sasl.mechanism=SCRAM-SHA-512
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required \
    username="risk-scoring-api" \
    password="${env:KAFKA_SCRAM_PASSWORD}";

# Keystore (client identity, properly placed).
ssl.keystore.location=/etc/risk-scoring-api/keystore.p12
ssl.keystore.password=${env:KAFKA_KEYSTORE_PASSWORD}
ssl.keystore.type=PKCS12
ssl.key.password=${env:KAFKA_KEY_PASSWORD}

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# THE BUG:
# Truststore (broker CA bundle) stored in /tmp — world-writable. An attacker
# with code-exec on any co-located process overwrites the CA bundle with their
# own self-signed CA; the next TLS handshake validates an attacker-controlled
# broker cert successfully, and the client streams every produce/fetch + every
# SCRAM credential to the MITM proxy. No TLS-validation error trips because
# the truststore is the attacker's. Defeats the SCRAM-on-top-of-mTLS defence-
# in-depth entirely.
# Fix: mount the CA bundle as a Kubernetes ConfigMap at
# /var/run/secrets/kafka/truststore.p12 with defaultMode 0444.
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
ssl.truststore.location=/tmp/kafka.truststore.p12
ssl.truststore.password=${env:KAFKA_TRUSTSTORE_PASSWORD}
ssl.truststore.type=PKCS12

# Hostname verification.
ssl.endpoint.identification.algorithm=https

# Standard consumer knobs.
client.id=risk-scoring-api-pod-0
group.id=risk-scoring-api
auto.offset.reset=earliest
enable.auto.commit=false
isolation.level=read_committed
max.poll.records=500
max.poll.interval.ms=300000
session.timeout.ms=45000
heartbeat.interval.ms=3000

# Deserializers.
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer

# Connection / metadata.
metadata.recovery.strategy=rebootstrap
