# =============================================================================
# IT fixture: STREAMS_PROPERTIES_NUM_STANDBY_REPLICAS_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A Kafka Streams .properties file destined for `new StreamsConfig(props)`.
#   It declares application.id, bootstrap.servers, default serdes, processing
#   guarantee, replication factor, thread count, commit interval, state dir,
#   both exception handlers — a complete production-quality Streams config for
#   a STATEFUL aggregation topology — EXCEPT `num.standby.replicas` is not set
#   anywhere.
#
# What's wrong
#   `org.apache.kafka.streams.StreamsConfig.NUM_STANDBY_REPLICAS_CONFIG`
#   declares `num.standby.replicas` with `ConfigDef.Type.INT`, default `0`,
#   `ConfigDef.Importance.MEDIUM`. With `0`, NO warm copies of any state-store
#   partition are maintained on peer instances.
#
#   The state-store recovery contract for a stateful Streams app is:
#
#     1. Active task owns a RocksDB-backed state store on local disk.
#     2. Every state update is also written to a CHANGELOG TOPIC in Kafka.
#     3. On task migration (instance crash, rolling deploy, rebalance), the
#        new owner needs the state store on ITS local disk to resume.
#     4. With `num.standby.replicas=N`, N peer instances continuously REPLAY
#        the changelog topic into their OWN local RocksDB instances — warm
#        copies ready for instant promotion.
#     5. With `num.standby.replicas=0`, the new task owner has NO local state;
#        it must REPLAY THE ENTIRE CHANGELOG TOPIC FROM EARLIEST before
#        resuming input processing.
#
#   Restoration throughput is bounded by `restore.consumer` config (default
#   `max.poll.records=1000`, `fetch.max.bytes=52428800`). For a 10M-record
#   materialized aggregation, this is ~10 minutes of replay. For a 100M-
#   record foreign-key-joined materialized view, 1-3 hours. During the
#   entire restore window, the assigned INPUT partitions process ZERO
#   records; consumer lag accumulates linearly with traffic.
#
#   This fixture's topology is an aggregation accumulating per-user counts
#   over months — a non-trivial state store. The intent: HA on instance
#   crashes. The implementation: `num.standby.replicas` absent → default `0`
#   → no HA → every restart is a multi-minute outage on the assigned
#   partitions.
#
# Why this is "WARNING" by default (not INFO or ERROR)
#   (a) The default `0` is correct for STATELESS Streams apps (filter / map
#       / branch with no aggregations, no joins, no materialized stores).
#       For those apps, there are no state stores, no changelog topics,
#       nothing to recover — and `num.standby.replicas=0` is the right
#       choice.
#
#   (b) The plugin cannot infer from a .properties file whether the
#       topology has state stores. So it cannot escalate to ERROR.
#
#   (c) For STATEFUL apps (the majority of production Streams workloads),
#       `num.standby.replicas=0` is silently catastrophic: every pod
#       crash, every rolling deploy, every scale event causes a multi-
#       minute state-restore window. The failure mode is operational
#       degradation (lag spikes), not data loss — but it's a high-
#       visibility ops incident.
#
#   WARNING is the right default: surface the missing knob without
#   false-alarming stateless apps. Operators raise to ERROR for the
#   stateful-app templates they own.
#
#   This IT overrides severity to ERROR via pom.xml configuration to force
#   the build to fail and verify the rule fires.
#
# Common bug shapes
#   (1) Aggregation app with 6-month accumulated state.
#       Streams app maintains a count-per-user-per-month aggregation; six
#       months of state = ~50M keys in RocksDB. `num.standby.replicas`
#       unset → default 0. Kubernetes node drained for maintenance; one
#       Streams pod rescheduled. Pod restart triggers restore of ~12M
#       state-store keys from changelog topic; restore takes ~25 minutes
#       during which the pod's assigned input partitions process zero
#       records. Consumer lag spikes 25-minute-equivalent. Downstream
#       alerts fire. Fix: `num.standby.replicas=1` → sub-second handoff
#       to pre-warmed standby; zero lag impact on restart.
#
#   (2) Foreign-key-join materialized view.
#       Streams topology does `KTable.join(KTable)` foreign-key join
#       producing materialized output table; state size 100M+ records.
#       `num.standby.replicas=0` (default). Rolling deploy of 3 instances
#       (one at a time) triggers state restore on each pod; restore takes
#       90 minutes per pod; full rolling deploy = 4.5 hours of lag
#       degradation. Fix: `num.standby.replicas=1` → rolling deploy
#       completes in 5 minutes with zero lag impact.
#
#   (3) Geographic-DR Streams deployment.
#       Team deploys Streams app in two AZs (active-active for HA).
#       `num.standby.replicas=0` → NO state replication between AZs.
#       Full AZ outage requires surviving AZ pods to rebuild state from
#       changelog (which is on the SAME Kafka cluster — if the AZ outage
#       took down brokers, the changelog itself may be degraded). Fix:
#       `num.standby.replicas=1` → surviving AZ already has warm state;
#       failover is sub-second.
#
#   (4) GitOps / immutable infrastructure deployments.
#       Every deploy is a full pod replacement. `num.standby.replicas=0`
#       → every deploy causes state-restore cascade across all instances;
#       daily deploys = daily 30-minute degradation windows. Fix:
#       `num.standby.replicas=1` → deploys invisible to downstream
#       consumers.
#
#   (5) Spring Boot Streams autoconfig.
#       Spring Boot's Streams autoconfiguration (`spring-kafka`) provides
#       `KafkaStreamsConfiguration` from `application.yml` /
#       `application.properties`. The default Spring template OMITS
#       `num.standby.replicas`. Teams using the template inherit `0`
#       org-wide. Fix: explicit `num.standby.replicas=1` in the Spring
#       template.
#
#   (6) Confluent Cloud / managed Kafka — operators deliberately set 0.
#       Operators sometimes set `num.standby.replicas=0` deliberately on
#       managed Kafka where ingress/egress bandwidth is metered (each
#       standby continuously consumes the changelog, doubling egress
#       cost). Legitimate trade-off — but should be EXPLICIT in the
#       .properties to document the deliberate cost-vs-HA choice.
#
# Fix
#   ONE LINE. Production default for stateful Streams apps:
#     num.standby.replicas=1            # 1 warm copy per state-store
#                                       # partition; sub-second failover.
#
#   For stateless apps (no aggregations, no joins, no materialized stores):
#     num.standby.replicas=0            # EXPLICIT — documents the
#                                       # deliberate no-state-store choice.
#
#   For cross-AZ triple-redundancy (active-active in 3 AZs):
#     num.standby.replicas=2            # 2 warm copies, 1 per AZ.
#
# Sibling rule
#   `STREAMS_NUM_STANDBY_REPLICAS_ZERO` catches the bytecode-detected
#   explicit `=0` in code-side `Properties.put` calls; this rule catches
#   the .properties-file ABSENT case. `STREAMS_PROPERTIES_REPLICATION_
#   FACTOR_ABSENT` is the durability complement: standbys give HA on top
#   of the changelog topic's own durability.
# =============================================================================

application.id=user-counts-aggregation-stream
bootstrap.servers=broker-1.kafka.prod.example.com:9092,broker-2.kafka.prod.example.com:9092,broker-3.kafka.prod.example.com:9092

# Default serdes used by topology operators that don't pass explicit
# Consumed/Produced/Materialized/Grouped.
default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
default.value.serde=io.confluent.kafka.streams.serdes.avro.SpecificAvroSerde

# Internal-topic durability (replication factor for changelog + repartition topics).
replication.factor=3
min.insync.replicas=2

# Throughput & latency.
num.stream.threads=8
commit.interval.ms=5000

# At-least-once with explicit commit cadence.
processing.guarantee=at_least_once

# State-store location (outside /tmp; survives container restarts when mounted as a volume).
state.dir=/var/lib/kafka-streams/user-counts-aggregation

# Exception handlers — both set, so the existing handler-absent rules don't fire.
default.deserialization.exception.handler=org.apache.kafka.streams.errors.LogAndContinueExceptionHandler
default.production.exception.handler=org.apache.kafka.streams.errors.LogAndContinueProductionExceptionHandler

# Schema registry (Confluent Avro deserializer dependency).
schema.registry.url=http://schema-registry.kafka.prod.example.com:8081

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# MISSING:
#   num.standby.replicas=...
# Without this key, Kafka Streams defaults `num.standby.replicas` to `0`
# (declared in StreamsConfig.NUM_STANDBY_REPLICAS_CONFIG with ConfigDef.Type.
# INT, default = 0). With `0`, NO warm copies of any state-store partition
# are maintained on peer instances — meaning EVERY instance crash forces a
# multi-minute changelog-replay restore on the affected partitions. For
# this fixture's user-counts aggregation accumulating months of state,
# expect 25-minute lag spikes on every pod restart. The production default
# for stateful Streams apps is `num.standby.replicas=1`.
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
