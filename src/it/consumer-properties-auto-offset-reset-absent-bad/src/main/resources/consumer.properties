# RULE: CONSUMER_PROPERTIES_AUTO_OFFSET_RESET_ABSENT.
#
# This is the classic 'why didn't we get message X' bug shape — and
# the one a static linter is uniquely well-positioned to catch,
# because the failure mode is SILENT at runtime: the consumer joins
# cleanly, the broker is happy, the application logs no error, and
# the backlog is simply not consumed.
#
# WHY THIS FILE VIOLATES THE RULE:
#
# This consumer config has serializers, group.id, and bootstrap.
# servers — perfectly valid as a kafka-clients consumer. But it
# never sets `auto.offset.reset`. kafka-clients defaults the value
# to `latest`, which means: when this group joins a partition for
# the FIRST TIME (no committed offset exists), the consumer JUMPS
# to the high watermark and starts reading from there — silently
# SKIPPING every record produced before the join time.
#
# CONCRETE FAILURE SHAPES:
#
# (1) Analytics pipeline missing the backlog.
#     Team deploys a new Spark Streaming consumer to process
#     historical events. They forget to set auto.offset.reset.
#     The default `latest` is used. The new group joins at the
#     high watermark; weeks of historical data are silently
#     skipped. Discovered when downstream reports show data
#     starting at deploy time with no history.
#
# (2) Event-driven microservice missing first events.
#     Microservice consumes a topic of order/payment/signup events.
#     New deployment rolls out with default `latest`. The first
#     burst of events at-or-just-before deploy time are silently
#     dropped because the consumer joined AFTER those records
#     reached the broker. Downstream business state is missing
#     the corresponding orders/payments/signups.
#
# (3) DR consumer fails to replay.
#     A disaster-recovery consumer is provisioned in a new region
#     with a fresh group name, expected to replay from the topic's
#     earliest record. The operator forgot `auto.offset.reset=
#     earliest`; default `latest` is used; the DR consumer skips
#     the entire replay and starts from the high watermark. State
#     reconstruction does not happen.
#
# (4) CI-scoped consumer group expiring offsets.
#     CI uses a fresh group name each pipeline run. Default
#     `offsets.retention.minutes=10080` (7 days) means that on
#     day-8 of CI, the group's previous-week offsets have
#     expired; default `latest` fires; CI consumer skips the test
#     data set up at start of pipeline. CI tests pass/fail
#     inconsistently depending on timing.
#
# WARNING severity (not ERROR/INFO) because the default behavior
# is workload-dependent: silently right for monitoring/heartbeat
# consumers, silently catastrophic for analytics/replay/event-
# driven consumers. The plugin cannot determine intent from
# absence alone. Raised here to ERROR by config override so the IT
# fixture demonstrates the violation deterministically.
#
# Fix: ONE LINE. `auto.offset.reset=earliest` for replay/analytics/
# event-driven workloads (the default ALMOST ALL consumers want),
# `auto.offset.reset=latest` EXPLICITLY for monitoring/heartbeat
# (to document the choice), or `auto.offset.reset=none` for
# systems that MUST be explicitly bootstrapped via tooling.
bootstrap.servers=kafka-1.prod.example.com:9092
group.id=orders-analytics
client.id=bad-no-auto-offset-reset-consumer
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
enable.auto.commit=false
max.poll.records=500
max.poll.interval.ms=300000
isolation.level=read_uncommitted
session.timeout.ms=45000
fetch.min.bytes=1
