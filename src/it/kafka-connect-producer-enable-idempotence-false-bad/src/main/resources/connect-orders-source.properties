name=orders-jdbc-source
connector.class=io.confluent.connect.jdbc.JdbcSourceConnector
tasks.max=1

connection.url=jdbc:postgresql://orders-db.internal:5432/orders
connection.user=connect
connection.password=changeme

mode=incrementing
incrementing.column.name=id
table.whitelist=public.orders
topic.prefix=orders.

# Anti-pattern: explicitly disabling the idempotent producer protocol on a
# Connect source connector. KIP-679 (Kafka 3.0) made enable.idempotence=true
# the producer default precisely because the cost is negligible and the
# correctness benefit is large. Connect's WorkerSourceTask commits source
# offsets ONLY after the producer ACKs the record. With idempotence DISABLED
# AND the framework's default retries=Integer.MAX_VALUE, every retry-after-
# ACK-timeout (network blip, leader re-election, broker GC pause) silently
# appends a DUPLICATE on the broker while the source-offset advances as
# though a single record had been written. Connect exactly-once-source
# (KIP-618, Kafka 3.3+) also REQUIRES enable.idempotence=true; with this
# override the connector refuses to start under
# exactly.once.source.support=enabled.
producer.override.enable.idempotence=false

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
