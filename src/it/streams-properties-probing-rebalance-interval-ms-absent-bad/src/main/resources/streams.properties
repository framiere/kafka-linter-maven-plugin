# =============================================================================
# IT fixture: STREAMS_PROPERTIES_PROBING_REBALANCE_INTERVAL_MS_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A Kafka Streams .properties file destined for `new StreamsConfig(props)`.
#   It declares a complete production-quality Streams config for a HIGH-
#   CHURN CI-driven topology — a per-session clicks aggregator
#   (`session-clicks-aggregator-stream`) that processes web-event
#   clickstreams at 30k events/sec across 24 partitions, deployed via
#   GitOps (ArgoCD) with 8-12 rolling deploys per day across a 6-pod
#   Streams cluster on Kubernetes, with HPA-driven scale-up/scale-down
#   in response to consumer-group lag. The topology builds session
#   windows keyed by user_id and emits aggregated session-summary
#   events to a downstream analytics topic.
#
#   Every other Streams knob is set correctly — application.id,
#   bootstrap.servers, default serdes, processing guarantee, replication
#   factor, min.insync.replicas, num.standby.replicas, num.stream.
#   threads, commit.interval.ms, state.dir, both exception handlers,
#   topology.optimization=all, max.task.idle.ms, task.timeout.ms,
#   default.timestamp.extractor AND `acceptable.recovery.lag` explicitly.
#   Everything is set correctly EXCEPT `probing.rebalance.interval.ms`
#   is not set anywhere.
#
# What's wrong
#   `org.apache.kafka.streams.StreamsConfig.PROBING_REBALANCE_INTERVAL_
#   MS_CONFIG` declares `probing.rebalance.interval.ms` with:
#
#     ConfigDef.Type.LONG,
#     default = 600000 (10 minutes),
#     importance = LOW,
#     validator = ConfigDef.Range.atLeast(60000)  (1-minute minimum)
#
#   KIP-441 (Apache Kafka 2.6, October 2020) introduced this knob as
#   the CADENCE at which the HighAvailabilityTaskAssignor (default
#   since 2.6) triggers a FOLLOW-UP REBALANCE to re-evaluate whether
#   any LAGGED standby has caught up enough to become ACCEPTABLE
#   (i.e., lag <= `acceptable.recovery.lag`).
#
#   The probing-rebalance flow:
#     (1) Initial rebalance picks active assignments preferring the
#         most-caught-up ACCEPTABLE candidate per task.
#     (2) If NO candidate is ACCEPTABLE for a given task, the
#         assignor picks the LEAST-LAGGED LAGGED candidate as a
#         TEMPORARY active and assigns WARM-UP REPLICAS on other
#         instances (bounded by `max.warmup.replicas`, default 2).
#     (3) The warm-up replicas catch up in the background by
#         replaying the changelog topic.
#     (4) Every `probing.rebalance.interval.ms`, the StreamThread
#         LEADER (consumer-group-elected) triggers a follow-up
#         rebalance that re-evaluates ALL assignments — if any warm-
#         up replica's lag has dropped below `acceptable.recovery.
#         lag`, the assignor PROMOTES it to active and DEMOTES the
#         temporary-active.
#     (5) The cycle repeats until all assignments are STABLE (every
#         active task is on an ACCEPTABLE candidate, no more probing
#         needed).
#
#   The default `600000` (10 min) is calibrated for STABLE
#   deployments where rebalances are infrequent (a few per day,
#   mostly broker-restart-driven) — the 10-min cadence is unobtrusive
#   and amortizes rebalance overhead.
#
# This fixture's specific risk
#   THIS topology is a HIGH-CHURN CI-DRIVEN deployment:
#   8-12 rolling deploys per day. Each deploy triggers a rebalance.
#   When a destination instance has no warm-standby for a given task,
#   the assignor picks a LAGGED candidate as temporary-active and
#   assigns warm-ups. With 30k events/sec across 24 partitions =
#   1,250 events/sec/partition, the warm-up replicas catch up in
#   ~30-90 seconds (depending on changelog size).
#
#   But the assignor WAITS THE FULL 10 MINUTES before triggering the
#   follow-up rebalance to re-evaluate. During those 10 minutes:
#     - Temporary-actives process on STALE STATE (up to 10,000
#       changelog records of state-staleness per task per the
#       acceptable.recovery.lag setting).
#     - Downstream consumers see continuous freshness regressions
#       (the analytics service emits "session ended" events with
#       stale aggregation state).
#     - HPA may misinterpret the prolonged "task is lagged"
#       consumer-group metrics as a load spike and scale further,
#       triggering ANOTHER rebalance cycle.
#     - A 30-second deploy extends into a 30-minute stabilization
#       window during which the deployment looks unstable.
#
#   The right value for THIS app is `60000` (1 min — the minimum
#   allowed by the ConfigDef.Range.atLeast(60000) validator). At
#   1-minute cadence:
#     - Warm-ups that catch up in 30-90 sec are promoted within 1-2
#       minutes (vs 10+ min at the default).
#     - Stabilization latency drops by 10x.
#     - The deployment looks responsive again.
#
#   The cost: the assignor does 60 evaluations per hour even when no
#   rebalance is needed. For THIS app's cluster size (6 pods × 4
#   StreamThreads = 24 threads), 60 evaluations per hour is a few
#   percent of broker coordinator overhead — well within budget.
#
#   The operator typically misdiagnoses this as "rebalance is slow"
#   or "Kafka broker is overloaded" without realizing that the root
#   cause is the probing-rebalance cadence being too lenient for the
#   deployment's churn rate.
#
# Why this is "INFO" by default (not WARNING or ERROR)
#   (a) For STABLE-deployment workloads (manual deploys, few
#       rebalances per quarter), the default 10-min cadence is
#       unobtrusive and amortizes rebalance overhead. Tightening
#       the cadence would only add coordinator churn without
#       benefit.
#
#   (b) The right NON-default value is workload-dependent — depends
#       on deployment cadence, cluster size, and acceptable
#       stabilization latency. The linter cannot infer the
#       deployment's churn rate from .properties alone.
#
#   (c) The bug shape is delayed and deploy-triggered: it doesn't
#       manifest at deploy time, only during the post-deploy
#       stabilization window. Most operators only discover the
#       cadence mismatch when investigating "why does every deploy
#       have a 10-minute lag tail?".
#
#   INFO is the right level: surfaces the missing knob and prompts
#   a deliberate deployment-cadence choice without false-alarming
#   the stable-default workloads.
#
#   This IT overrides severity to ERROR via pom.xml configuration to
#   force the build to fail and verify the rule fires.
#
# Common bug shapes
#   (1) High-churn CI-driven rolling deploys — 10-min default
#       causes prolonged stabilization windows.
#       THIS app: 8-12 deploys per day via ArgoCD. Each deploy
#       triggers a rebalance; warm-ups catch up in 30-90 sec but
#       the assignor waits 9.5 more minutes before re-evaluating.
#       Setting `probing.rebalance.interval.ms=60000` (1 min —
#       minimum allowed) cuts the stabilization window by 10x.
#
#   (2) Frequent scale-up/scale-down via Kubernetes HPA.
#       A Streams app autoscales based on consumer-group lag.
#       During a traffic spike, HPA scales from 2 to 6 instances;
#       the 4 new instances have no state and start as warm-up
#       replicas; the existing 2 instances continue as temporary-
#       active. Warm-ups take 5 minutes to catch up; the assignor
#       waits the full 10 min before re-evaluating; during those
#       10 min, the 2 original instances are over-loaded; HPA may
#       scale further, exacerbating the issue.
#
#   (3) OOM-kill restart with warm-standby.
#       A Streams instance is OOM-killed mid-day; K8s restarts the
#       pod with a fresh state-dir; the new pod starts as warm-up
#       replicas for its 4 tasks; the existing standbys on other
#       instances are promoted to active. Meanwhile the new pod's
#       warm-ups catch up in 2 minutes (small state); the assignor
#       waits 8 more minutes before re-evaluating.
#
#   (4) Stable deployment — default is fine.
#       A Streams app is deployed manually every few months;
#       rebalances happen at most a few times per quarter (broker
#       maintenance windows, cluster upgrades). The default 10-min
#       cadence is unobtrusive. The operator might set
#       `probing.rebalance.interval.ms=1800000` (30 min) to reduce
#       coordinator overhead during the rare rebalance.
#
#   (5) Spring Boot Streams autoconfig — org-wide default leaks.
#       Spring Boot's Streams autoconfiguration (`spring-kafka`)
#       provides a `KafkaStreamsConfiguration` bean from
#       `application.yml`. The default Spring template DOES NOT
#       include `probing.rebalance.interval.ms`. Every Spring Boot
#       Streams app inherits the framework default 600000. For an
#       org with diverse deployment cadences (some CI-driven, some
#       manual), the org-wide default-leak masks workload-specific
#       tuning.
#
#   (6) Probing-rebalance churn — 1-min cadence itself becomes a
#       bottleneck.
#       Setting `probing.rebalance.interval.ms=60000` is the minimum
#       allowed, but at this rate the assignor does 60 evaluations
#       per hour even when no rebalance is needed (each evaluation
#       is a few-second coordinator round-trip plus assignment
#       recomputation). For a 100-instance cluster with frequent
#       membership changes, this overhead can saturate the consumer-
#       group coordinator. The right value is workload-dependent —
#       fast enough to react to deployments, slow enough to not
#       churn coordinator state.
#
# Fix
#   ONE LINE. For HIGH-CHURN CI-driven deployments (THIS app's case):
#     probing.rebalance.interval.ms=60000      # 1 min — minimum
#                                              # allowed; cuts
#                                              # stabilization
#                                              # latency by 10x;
#                                              # right for 5+
#                                              # deploys per day.
#
#   For typical-deployment workloads:
#     probing.rebalance.interval.ms=600000     # 10 min — explicit
#                                              # default; documents
#                                              # the deliberate
#                                              # choice; insulates
#                                              # from future
#                                              # framework default
#                                              # changes.
#
#   For very-stable deployments (manual deploys only, rare rebalances):
#     probing.rebalance.interval.ms=1800000    # 30 min — reduces
#                                              # coordinator
#                                              # overhead for the
#                                              # rare cases where
#                                              # warm-ups take long
#                                              # to catch up.
#
# Sibling rules
#   `STREAMS_PROPERTIES_ACCEPTABLE_RECOVERY_LAG_ABSENT` catches the
#   absent case for the warm-standby PROMOTION-THRESHOLD knob —
#   `acceptable.recovery.lag` declares HOW MUCH LAG is "good enough"
#   for promotion; `probing.rebalance.interval.ms` declares HOW
#   OFTEN to RE-CHECK whether a LAGGED standby has caught up. The
#   two rules form a pair: a tight lag threshold + slow probing
#   cadence = long stabilization (many warm-ups stuck in LAGGED
#   bucket); a loose lag threshold + fast probing cadence = stale
#   promotions + coordinator churn. Both need workload-tuning.
# =============================================================================

application.id=session-clicks-aggregator-stream
bootstrap.servers=broker-1.kafka.prod.example.com:9092,broker-2.kafka.prod.example.com:9092,broker-3.kafka.prod.example.com:9092

# Default serdes used by topology operators that don't pass explicit
# Consumed/Produced/Materialized/Grouped.
default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
default.value.serde=io.confluent.kafka.streams.serdes.avro.SpecificAvroSerde

# Internal-topic durability (replication factor for changelog + repartition topics).
replication.factor=3
min.insync.replicas=2

# Throughput & latency.
num.stream.threads=4
commit.interval.ms=5000

# HA for stateful tasks — 2 warm copies of every state-store partition,
# so that a rebalance can promote a standby without full changelog-
# replay delay.
num.standby.replicas=2

# At-least-once with explicit commit cadence.
processing.guarantee=at_least_once

# State-store location (outside /tmp; survives container restarts when mounted as a volume).
state.dir=/var/lib/kafka-streams/session-clicks-aggregator

# Internal-topic-layout consolidation (KIP-295 / KIP-862).
topology.optimization=all

# Exception handlers — both set, so the existing handler-absent rules don't fire.
default.deserialization.exception.handler=org.apache.kafka.streams.errors.LogAndContinueExceptionHandler
default.production.exception.handler=org.apache.kafka.streams.errors.LogAndContinueProductionExceptionHandler

# Schema registry (Confluent Avro deserializer dependency).
schema.registry.url=http://schema-registry.kafka.prod.example.com:8081

# Multi-source KTable-KStream join — `max.task.idle.ms=2000` accommodates
# the 2-second skew window. Set EXPLICITLY to isolate from
# STREAMS_PROPERTIES_MAX_TASK_IDLE_MS_ABSENT.
max.task.idle.ms=2000

# 30-min retry budget — accommodates prolonged broker outages.
# Set EXPLICITLY to isolate from STREAMS_PROPERTIES_TASK_TIMEOUT_MS_ABSENT.
task.timeout.ms=1800000

# Kafka-native producers write to LogAppendTime-typed topics — the broker
# guarantees valid timestamps; fail-fast on invalid is the right posture.
# Set EXPLICITLY to isolate from STREAMS_PROPERTIES_DEFAULT_TIMESTAMP_
# EXTRACTOR_ABSENT.
default.timestamp.extractor=org.apache.kafka.streams.processor.FailOnInvalidTimestamp

# Warm-standby promotion threshold — at 30k events/sec across 24 partitions =
# 1,250 events/sec/partition, default 10,000 records of lag is ~8 seconds —
# sub-window-of-time for an aggregation. Set EXPLICITLY at the default to
# isolate from STREAMS_PROPERTIES_ACCEPTABLE_RECOVERY_LAG_ABSENT.
acceptable.recovery.lag=10000

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# MISSING:
#   probing.rebalance.interval.ms=...
# Without this key, Kafka Streams defaults `probing.rebalance.interval.ms`
# to `600000` (10 minutes, declared in StreamsConfig.PROBING_REBALANCE_
# INTERVAL_MS_CONFIG with ConfigDef.Type.LONG; validator ConfigDef.Range.
# atLeast(60000) — 1-minute minimum). Per KIP-441 (Apache Kafka 2.6,
# October 2020), this is the CADENCE at which the HighAvailability
# TaskAssignor triggers a follow-up rebalance to RE-EVALUATE whether
# any LAGGED standby has caught up enough to become ACCEPTABLE
# (lag <= acceptable.recovery.lag). The default `600000` (10 min) is
# calibrated for STABLE deployments (rare rebalances, broker-restart-
# driven). For THIS app — HIGH-CHURN CI-driven (8-12 rolling deploys
# per day via ArgoCD, HPA-driven scale events, frequent OOM-kill
# restarts) — the 10-min cadence is the bottleneck: warm-ups catch up
# in 30-90 seconds at 1,250 events/sec/partition, but the assignor
# waits 9.5 more minutes before re-evaluating. During those 9.5
# minutes, temporary-actives process on stale state, downstream sees
# freshness regressions, HPA may scale further. For THIS app:
# `probing.rebalance.interval.ms=60000` (1 min — minimum allowed)
# cuts stabilization latency by 10x. For typical-deployment workloads,
# `probing.rebalance.interval.ms=600000` (explicit 10-min default).
# For very-stable deployments (manual deploys only), `probing.
# rebalance.interval.ms=1800000` (30 min — reduces coordinator
# overhead).
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
