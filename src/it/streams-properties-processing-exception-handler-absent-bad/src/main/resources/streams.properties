# =============================================================================
# IT fixture: STREAMS_PROPERTIES_PROCESSING_EXCEPTION_HANDLER_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A Kafka Streams .properties file destined for
#   `new StreamsConfig(Properties)` inside a long-running JVM
#   process. The application is `order-enrichment-streams` —
#   it consumes from the `orders-raw` topic (24 partitions,
#   replication-factor=3), enriches each order record with
#   customer-profile data from a `customer-profiles` GlobalKTable,
#   aggregates per-customer order metrics into a windowed
#   `customer-order-stats` KTable, and produces to the
#   `customer-order-stats-output` topic for downstream
#   analytics consumers.
#
#   The topology is roughly:
#     orders-raw → mapValues(parseOrderJson) → selectKey(customerId)
#                → join(customer-profiles, enrichWithProfile)
#                → groupByKey()
#                → windowedBy(TimeWindows.of(5min))
#                → aggregate(zero, addOrderMetrics)
#                → toStream() → mapValues(serializeStats)
#                → to(customer-order-stats-output)
#
#   So there are SIX user-lambda steps: `parseOrderJson`,
#   `selectKey(customerId)`, `enrichWithProfile`, `addOrderMetrics`,
#   `serializeStats`, and any further filtering/transforming.
#
#   Deployment shape: a 6-replica `Deployment` on Kubernetes
#   (EKS, us-east-1, eks-1.30), backed by RocksDB state-stores
#   on PVC-backed `state.dir=/var/lib/streams/order-enrichment`.
#   Brokers are Strimzi-managed Kafka 3.9.0 (released October
#   2024), so KIP-1033 (the `processing.exception.handler`
#   knob) is AVAILABLE in this client/broker pairing.
#
# What's wrong
#   `processing.exception.handler` (introduced by KIP-1033 in
#   Apache Kafka 3.9, November 2024) is the THIRD member of the
#   Streams exception-handler family:
#
#     - `default.deserialization.exception.handler` — covers
#       exceptions thrown by source-topic Serdes during the
#       Streams consumer's `poll()` call (poison records on the
#       INPUT side).
#     - `default.production.exception.handler` — covers
#       exceptions thrown by the underlying producer during
#       `send()` (broker rejection on the OUTPUT side, e.g.,
#       `RecordTooLargeException`, `AuthorizationException`).
#     - `processing.exception.handler` (THIS knob) — covers
#       exceptions thrown by USER PROCESSOR CODE in the MIDDLE
#       of the topology: the lambdas inside `mapValues`, `map`,
#       `transform`, `transformValues`, `flatMap`, `filter`,
#       `aggregate`, `reduce`, `join`'s ValueJoiner, and any
#       custom `Processor` / `Transformer` / `ValueTransformer`
#       implementation.
#
#   Default: `org.apache.kafka.streams.errors.LogAndFail
#   ProcessingExceptionHandler` — preserves pre-KIP-1033
#   behavior for backward compatibility. Returns FAIL for
#   EVERY exception:
#     - The handler logs the exception's class, message, and
#       `ErrorHandlerContext` (source topic / partition /
#       offset / timestamp / processorNodeId).
#     - The handler returns `Response.FAIL`.
#     - The FAIL response propagates up to the StreamThread's
#       run loop as a `StreamsException`.
#     - The StreamThread's configured uncaught-exception
#       handler is invoked. Default behavior (unless overridden
#       via `KafkaStreams.setUncaughtExceptionHandler`) is
#       `StreamThreadExceptionResponse.SHUTDOWN_CLIENT` — the
#       entire KafkaStreams instance dies.
#     - The pod restarts; the StreamThread re-polls; the SAME
#       bad record is re-read (no offset commit happened); the
#       SAME exception fires; the pod crashes again.
#     - INFINITE RESTART LOOP until someone manually advances
#       the consumer offset past the bad record (via
#       `kafka-consumer-groups.sh --reset-offsets --to-offset
#       <bad-offset + 1>`).
#
# The eight bug shapes this rule catches
#   (1) JSON parse exception in `mapValues`. The topology's
#       `parseOrderJson` step does `objectMapper.readTree(value).
#       get("orderId").asText()`. Works fine for years; then a
#       single upstream producer mis-configuration writes a
#       non-JSON record (perhaps a tombstone marker, perhaps
#       an HTML error page from a broken upstream API). The
#       `objectMapper.readTree(value)` throws
#       `JsonProcessingException`. Default
#       `LogAndFailProcessingExceptionHandler` returns FAIL;
#       StreamThread crashes; topology stops processing the
#       affected partition; pod restarts; same bad record;
#       infinite restart loop.
#
#   (2) NullPointerException in `transformValues` (or the
#       GlobalKTable `join` ValueJoiner). The enrichment step
#       looks up a customer profile: `enrichWithProfile(order,
#       profile) -> { return new EnrichedOrder(order, profile.
#       getName()); }`. The `profile` argument is null for some
#       customer ID (the profile has not been ingested yet, OR
#       was deleted upstream). `profile.getName()` throws NPE.
#       Default handler FAILs; topology crashes.
#
#   (3) ClassCastException in custom `Processor` after schema
#       drift. A custom `Processor<String, byte[]>`
#       implementation does `context().forward(key,
#       deserialize(value, OrderSchemaV1.class))`. The
#       `deserialize` call is runtime-typed and may throw
#       `ClassCastException` when a producer accidentally
#       writes records with `OrderSchemaV2` bytes (e.g., during
#       a partial schema evolution rollout). Default handler
#       FAILs.
#
#   (4) ArithmeticException in materialized aggregation. The
#       `addOrderMetrics` aggregator computes `(running_sum +
#       order_value) / order_count` where `order_count` can be
#       transiently zero during a key's first observation if
#       the aggregator's `initializer` is not careful. The
#       `ArithmeticException` (division by zero) crashes the
#       StreamThread on the first input for any new customer.
#
#   (5) IndexOutOfBoundsException in `flatMap`. The topology
#       has a downstream `flatMap` step that processes order
#       line-items: `order -> order.getLineItems().subList(1,
#       order.getLineItems().size())` (intended to skip the
#       first line-item which is a metadata header). For
#       orders with exactly ONE line-item, `subList(1, 1)` is
#       empty; the downstream `.get(0)` throws
#       `IndexOutOfBoundsException`. The bug surfaces only for
#       single-line-item orders — a rare path that may not be
#       exercised in QA.
#
#   (6) Schema-evolution drift in `mapValues`. The
#       `serializeStats` step accesses a field that was removed
#       in a recent schema evolution: `stats.getLegacyMetric()`
#       returns null (the field was removed; the Avro-generated
#       POJO returns null for any removed field accessed by an
#       old client jar); the downstream `.intValue()` throws
#       NPE. The operator carefully tested with the new schema
#       but the rolling deploy has some old-version pods still
#       running.
#
#   (7) Pre-KIP-1033 codepath: operator wraps 99 of 100 lambdas
#       in `try { ... } catch (Exception e) { log.error(...);
#       return Optional.empty(); }`. One lambda is missed —
#       perhaps a recently-added one, perhaps a refactor
#       introduced a new code path that someone forgot to wrap.
#       A single bad record hits the unwrapped lambda; the
#       StreamThread crashes; the operator is surprised because
#       'all lambdas are wrapped'. KIP-1033's
#       `processing.exception.handler` would have caught the
#       miss as a topology-wide safety net.
#
#   (8) Spring Boot autoconfig default-leak. This file is a
#       plain streams.properties (not Spring Boot), but in
#       Spring Boot apps the issue is identical: Spring Boot's
#       `KafkaStreamsConfiguration` bean does NOT set
#       `processing.exception.handler`. Every Spring Boot
#       Streams app on Kafka 3.9+ inherits the framework
#       default `LogAndFailProcessingExceptionHandler` unless
#       the operator explicitly sets
#       `spring.kafka.streams.properties.processing.exception.
#       handler=org.apache.kafka.streams.errors.
#       LogAndContinueProcessingExceptionHandler`.
#
# Why INFO and not WARNING
#   The knob requires Apache Kafka 3.9+ (November 2024). Older
#   clients silently ignore unknown configs, so adding the
#   knob is forward-compatible but not effective until the
#   client is upgraded. Additionally, fail-fast workloads
#   (financial settlement, regulatory reporting where every
#   record must be processed) are right to use the default
#   `LogAndFailProcessingExceptionHandler` — a single missed
#   record could be a compliance violation, and the explicit
#   choice is preferable to silent inheritance. The rule
#   prompts the operator to make the resilient-vs-fail-fast
#   choice explicit, but does not assume the worst — hence
#   INFO.
#
#   This IT fixture's pom.xml overrides the severity to ERROR
#   so that `mvn verify` fails on this bad configuration,
#   demonstrating the rule fires correctly.
#
# Fix
#   For resilient workloads (the majority — analytics, ETL,
#   event-driven processing):
#     processing.exception.handler=org.apache.kafka.streams.\
#     errors.LogAndContinueProcessingExceptionHandler
#   For Spring Boot:
#     spring.kafka.streams.properties.processing.exception.\
#     handler=org.apache.kafka.streams.errors.\
#     LogAndContinueProcessingExceptionHandler
#   For fail-fast workloads (financial settlement, regulatory
#   reporting): set
#     processing.exception.handler=org.apache.kafka.streams.\
#     errors.LogAndFailProcessingExceptionHandler
#   EXPLICITLY with a comment documenting the deliberate fail-
#   fast choice — the explicit value disables this rule's
#   trigger.
#   For DLQ routing of failed records: implement a custom
#   `ProcessingExceptionHandler` that returns `CONTINUE` after
#   sending the record to a side-channel DLQ producer.
# =============================================================================

# Application identity — the streams-shape gate.
application.id=order-enrichment-streams
client.id=order-enrichment-streams-0

# Cluster connectivity.
bootstrap.servers=kafka-bootstrap.kafka.svc.cluster.local:9092

# Default Serdes.
default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
default.value.serde=org.apache.kafka.common.serialization.Serdes$StringSerde

# Exactly-once-v2 (EOS-v2) for transactional aggregation guarantees.
processing.guarantee=exactly_once_v2

# Standby replicas + KIP-441 warm-standby promotion.
num.standby.replicas=2
acceptable.recovery.lag=10000
probing.rebalance.interval.ms=600000
max.warmup.replicas=2

# Rack-aware standby placement across the 3 EKS AZs.
rack.aware.assignment.tags=zone

# State-store persistence.
state.dir=/var/lib/streams/order-enrichment

# Group-membership + heartbeating tuned for K8s pod lifecycle.
session.timeout.ms=45000
heartbeat.interval.ms=3000
max.poll.interval.ms=300000

# I/O sibling handlers ARE set — the missing one is the middle handler.
default.deserialization.exception.handler=org.apache.kafka.streams.errors.LogAndContinueExceptionHandler
default.production.exception.handler=org.apache.kafka.streams.errors.DefaultProductionExceptionHandler

# Timestamp extractor — explicit fail-on-invalid.
default.timestamp.extractor=org.apache.kafka.streams.processor.FailOnInvalidTimestamp

# Topology optimization.
topology.optimization=all

# Commit interval (EOS-v2 default 100 ms is fine; set explicitly).
commit.interval.ms=100

# Number of StreamThreads.
num.stream.threads=4

# Metadata recovery strategy — K8s-aware.
metadata.recovery.strategy=rebootstrap

# Task idle ms for stream-stream join time-alignment.
max.task.idle.ms=200

# Task timeout.
task.timeout.ms=300000

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# MISSING:
#   processing.exception.handler=org.apache.kafka.streams.errors.LogAndContinueProcessingExceptionHandler
# Without this key, Apache Kafka 3.9+ defaults
# `processing.exception.handler` to `LogAndFailProcessingExceptionHandler`
# (preserves pre-KIP-1033 behavior for backward compatibility). Any
# `RuntimeException` thrown from user processor code — `mapValues`,
# `map`, `transform`, `transformValues`, `flatMap`, `filter`,
# `aggregate`, `reduce`, `join`'s ValueJoiner, custom `Processor` —
# kills the StreamThread and (with default `SHUTDOWN_CLIENT` uncaught-
# exception response) shuts down the entire KafkaStreams instance.
# The pod restarts; the same bad record is re-polled; the same
# exception re-fires — INFINITE RESTART LOOP until someone manually
# advances the consumer offset past the bad record. For this 6-
# replica EKS topology that does JSON parsing, GlobalKTable
# enrichment, windowed aggregation, and Avro serialization in user
# lambdas — every one of those is a potential exception source.
# Setting `processing.exception.handler=org.apache.kafka.streams.
# errors.LogAndContinueProcessingExceptionHandler` skips bad records,
# logs them, and alerts via the `dropped-records-total` metric — the
# topology stays alive while the operator investigates upstream.
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
