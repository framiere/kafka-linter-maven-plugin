# =============================================================================
# IT fixture: CONNECT_ERRORS_TOLERANCE_ALL_NO_LOG (bad)
# =============================================================================
#
# What this file is
#   A Kafka Connect SINK connector .properties file for the Confluent S3 sink
#   (a real, high-volume connector commonly deployed with `errors.tolerance=
#   all` because S3 has a documented 1-in-10000 transient 5xx error rate that
#   would otherwise halt the connector on every transient failure). The file
#   declares a complete production-quality S3-sink config: connector.class,
#   name, topics, tasks.max=12 (parallelism for a 12-partition topic), S3
#   coordinates, Parquet output, time-based partitioning, schema-registry-
#   backed AvroConverter on the value, `errors.tolerance=all`, and a FULL
#   DLQ stanza (topic name, replication factor, context-headers enabled) —
#   EXCEPT `errors.log.enable` is not set anywhere.
#
# What's wrong
#   Kafka Connect's `org.apache.kafka.connect.runtime.ConnectorConfig.
#   ERRORS_LOG_ENABLE_CONFIG` declares `errors.log.enable` with:
#
#     ConfigDef.Type.BOOLEAN, default = false, importance = MEDIUM
#
#   When absent from the connector .properties (or set to false), the
#   Connect runtime's `RetryWithToleranceOperator` SILENTLY swallows every
#   per-record processing exception when `errors.tolerance=all` is set.
#   No log line is written to the connector's own log stream. The ONLY
#   signals of failure are:
#
#     (a) JMX counters (`errors.tolerated`, `errors.total`, stage-specific
#         counters) — visible only to teams scraping Connect's JMX surface
#         into Prometheus/Grafana.
#     (b) The DLQ topic gradually filling — visible only to teams
#         monitoring DLQ topic length or actively consuming the DLQ.
#
#   For the dominant Connect-on-Kubernetes operational model — alerting
#   on connector log patterns (`level=ERROR` rules, log-aggregator
#   queries, `kubectl logs` tails) — the connector LOOKS healthy when it
#   is in fact silently failing record after record.
#
# Why this is "WARNING" by default (not INFO or ERROR)
#   (a) The consequence is observability degradation, not data loss —
#       this fixture HAS a DLQ stanza populated; failing records are
#       preserved and replayable; the issue is operators don't KNOW it's
#       happening from the log stream.
#
#   (b) For PII-sensitive pipelines, `errors.log.include.messages=false`
#       is the correct choice — and some teams extend that PII-caution
#       all the way to `errors.log.enable=false` because their exception
#       messages may contain field values from the failing record. The
#       plugin cannot infer which connectors handle PII. So WARNING is
#       one notch below ERROR.
#
#   (c) Some teams have a complete alternative observability story (DLQ
#       topic length in Prometheus, JMX counter alerting via
#       jmx-exporter) and deliberately disable the log channel to reduce
#       log volume on noisy connectors. WARNING surfaces the missing
#       knob without false-alarming those teams.
#
#   This IT overrides severity to ERROR via pom.xml configuration to
#   force the build to fail and verify the rule fires.
#
# Common bug shapes
#   (1) S3 sink with intermittent 5xx — slow trickle of failures into
#       DLQ, invisible to log-based monitoring.
#       This fixture's configuration. AWS S3 returns 5xx for ~0.1% of
#       PUTs (AWS-documented transient error rate). With
#       `errors.tolerance=all` + DLQ + `errors.log.enable=false` (the
#       default), the failing PUTs land in the DLQ; the connector's log
#       stream stays silent; operators tailing logs see no errors. The
#       slow data loss only surfaces when a downstream consumer of the
#       S3-bucket-mirrored Kafka topic notices missing records.
#
#   (2) JDBC sink with malformed upstream records — DLQ fills at
#       thousands/sec while logs stay silent.
#       A JDBC sink with `errors.tolerance=all` + DLQ but no log enabled
#       encounters an upstream service emitting malformed field values
#       after a deploy. Every record fails the value-converter; the DLQ
#       fills at thousands/sec; the connector's logs remain SILENT. The
#       team's PagerDuty rule keys on `level=ERROR` in the connector
#       log; the rule never fires. The bug is only noticed 6 hours
#       later when a downstream-data-warehouse daily-load alert catches
#       the missing rows. With `errors.log.enable=true`, the first
#       malformed record would have produced a connector-log ERROR line
#       within seconds; the on-call would have seen the spike
#       immediately.
#
#   (3) Debezium CDC with `errors.tolerance=all`, no log — schema-drift
#       gaps invisible.
#       A Debezium PostgreSQL connector with `errors.tolerance=all` (set
#       after a prior schema-drift incident to prevent task halt) and
#       no log. Post-incident, a different schema-drift event occurs;
#       events fail silently at the value-converter; the CDC topic
#       gaps go unnoticed; downstream materialized views drift from
#       source. With `errors.log.enable=true`, the failing events would
#       have logged with their LSN coordinates; the on-call would have
#       seen the issue in the first batch.
#
#   (4) MM2 replication with `errors.tolerance=all`, no log — cluster
#       divergence undetected.
#       A MirrorMaker 2 deployment with `errors.tolerance=all` (set to
#       keep replication running through occasional bad records)
#       silently drops replication events on per-record errors. The
#       DLQ is set so the bad records ARE captured — but operators
#       alerting on log patterns see nothing. Replication divergence
#       between clusters accumulates undetected for weeks.
#
#   (5) Connect-on-K8s operator template ships `errors.tolerance=all`
#       without the log knob.
#       A team's Connect operator template enables tolerance for
#       resilience but omits the log knob. Every connector deployed via
#       the template has structural log-blindness. Across an org with
#       40+ connectors, the SRE team's log-pattern-based alerting is
#       structurally blind to per-record failures; only the DLQ topic
#       length metric (if monitored — often not) is the signal.
#
#   (6) PII-handling pipeline — `errors.log.include.messages=false` IS
#       correct, but `errors.log.enable=true` should still be set.
#       A team enables `errors.log.enable=true` but deliberately leaves
#       `errors.log.include.messages=false` because the connector
#       handles records with PII (credit-card numbers, SSNs, health
#       records); they don't want full record payloads in their log
#       aggregator. The connector's log still gets ERROR lines
#       (exception class + message + stacktrace + source coordinates)
#       but NOT the failing record bytes — the right trade-off for
#       PII-sensitive pipelines. This rule's nudge is to set
#       `errors.log.enable=true` at minimum; the `include.messages`
#       knob is a separate per-connector PII decision.
#
# Fix
#   TWO LINES. Production default:
#     errors.log.enable=true             # Every swallowed exception
#                                        # generates a connector-log
#                                        # ERROR line: exception class,
#                                        # message, stacktrace, source
#                                        # topic/partition/offset.
#     errors.log.include.messages=true   # Additionally log the failing
#                                        # record's key+value+headers
#                                        # bytes. Disable when records
#                                        # may contain PII (still log
#                                        # the exception context).
#
# Sibling rule
#   `CONNECT_ERRORS_TOLERANCE_ALL_NO_DLQ` catches the complementary
#   DLQ-channel gap. Both rules can fire on the same .properties when
#   the operator set ONLY `errors.tolerance=all` and neither
#   observability channel. KIP-298 (Apache Kafka 2.0, July 2018)
#   designed `errors.tolerance` to work with TWO complementary channels:
#   the DLQ topic (record-level, durable, replayable) AND the in-process
#   log (connector-level, real-time, grep-able). This rule enforces the
#   second.
# =============================================================================

name=orders-events-to-s3-sink
connector.class=io.confluent.connect.s3.S3SinkConnector
topics=orders-events
tasks.max=12

# S3 destination coordinates
s3.bucket.name=acme-data-lake-prod
s3.region=us-east-1
s3.part.size=26214400
storage.class=io.confluent.connect.s3.storage.S3Storage
flush.size=100000
rotate.schedule.interval.ms=60000

# Output format: Parquet with Avro schemas resolved via schema registry.
format.class=io.confluent.connect.s3.format.parquet.ParquetFormat
parquet.codec=snappy

# Time-based partitioning for downstream query efficiency.
partitioner.class=io.confluent.connect.storage.partitioner.TimeBasedPartitioner
path.format=YYYY/MM/dd/HH
partition.duration.ms=3600000
timestamp.extractor=Record
locale=en-US
timezone=UTC

# Converters with their schema-registry URLs set (isolates this rule from
# CONNECT_SCHEMA_REGISTRY_CONVERTER_MISSING_URL).
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry.kafka.prod.example.com:8081
value.converter.auto.register.schemas=false

# Per-record failure handling: tolerate (S3 has 1-in-10000 transient 5xx that
# we don't want halting the connector) AND preserve failing records to a DLQ.
errors.tolerance=all

# DLQ stanza — fully configured so CONNECT_ERRORS_TOLERANCE_ALL_NO_DLQ,
# CONNECT_DLQ_CONTEXT_HEADERS_DISABLED, and CONNECT_DLQ_REPLICATION_FACTOR_LOW
# do NOT fire (we want to isolate the missing-log-channel violation).
errors.deadletterqueue.topic.name=orders-events-to-s3-sink-dlq
errors.deadletterqueue.topic.replication.factor=3
errors.deadletterqueue.context.headers.enable=true

# Retry on transient sink-write failures.
errors.retry.timeout=300000
errors.retry.delay.max.ms=60000

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# MISSING:
#   errors.log.enable=true
#   errors.log.include.messages=true
# Without these keys, Kafka Connect defaults `errors.log.enable` to `false`
# (declared in ConnectorConfig.ERRORS_LOG_ENABLE_CONFIG with ConfigDef.Type.
# BOOLEAN, default = false). With `false`, the runtime's
# RetryWithToleranceOperator writes NO log line at all when it catches and
# tolerates a per-record exception under `errors.tolerance=all`. The
# connector's log stream stays SILENT through every swallowed exception.
# Operators alerting on `level=ERROR` patterns in connector logs see nothing.
# Only the JMX `errors.tolerated` counter and the DLQ topic length signal
# the failures. For the dominant Connect-on-Kubernetes operational model
# (log-pattern alerting), this is structural blindness to per-record
# failures. The production posture is `errors.log.enable=true` paired with
# `errors.log.include.messages=true` (the latter optional when records
# contain PII).
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
