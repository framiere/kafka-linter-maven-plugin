# =============================================================================
# IT fixture: CONSUMER_PROPERTIES_HEARTBEAT_INTERVAL_MS_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A kafka-clients consumer .properties file destined for
#   `new KafkaConsumer<>(props)`. It declares deserializers, bootstrap.servers,
#   group.id, client.id, partition.assignment.strategy, auto.offset.reset,
#   enable.auto.commit, isolation.level, max.poll.records, max.poll.
#   interval.ms, AND session.timeout.ms (TUNED UP to 60s for a known-slow
#   consumer), fetch.min.bytes — a complete production-quality consumer
#   config — EXCEPT `heartbeat.interval.ms` is not set anywhere.
#
# What's wrong
#   The operator tuned `session.timeout.ms` UP to 60s (intentional: this
#   consumer's per-record processing can stretch up to 30s under load, and
#   the team wanted to absorb that without false-positive rebalances). But
#   they forgot to also set `heartbeat.interval.ms`, so it defaults to 3000
#   (3 seconds).
#
#   The coupling is now broken: heartbeat / session_timeout ratio is 1:20.
#   The consumer sends 20 heartbeats per session-timeout window — far more
#   than the 2-3 needed for the coordinator's miss-tolerance budget.
#
#   `org.apache.kafka.clients.consumer.ConsumerConfig.HEARTBEAT_INTERVAL_MS_
#   CONFIG` declares `heartbeat.interval.ms` with `ConfigDef.Type.INT`,
#   default `3000`, importance HIGH. The kafka-clients library does validate
#   that `heartbeat.interval.ms < session.timeout.ms` (throws ConfigException
#   on construction otherwise), but it does NOT warn or fail on a too-
#   aggressive heartbeat (e.g., 3s heartbeat with 60s session timeout —
#   valid but wasteful) or on a too-narrow ratio (e.g., 3s heartbeat with
#   6s session timeout — valid but fragile).
#
#   The community-canonical guideline (Confluent docs, Kafka Definitive
#   Guide, AWS MSK best practices, all major framework docs) is:
#
#     heartbeat.interval.ms <= session.timeout.ms / 3
#
#   so that 2-3 heartbeats can be missed before the coordinator considers
#   the consumer dead. This budget absorbs:
#     - JVM GC pauses (typically 1-2s on default G1GC, occasionally longer
#       on big-heap apps)
#     - Transient coordinator-side slowness (broker GC, network blips)
#     - Brief client-side scheduling delays
#
#   When the ratio is 1:20 (this fixture), heartbeats are sent 7x more
#   often than necessary — the consumer wastes JVM CPU on heartbeat thread
#   wake-ups, and the broker wastes capacity on heartbeat traffic from N
#   consumer instances × 20 heartbeats per minute. For a multi-tenant
#   cluster with 1000 consumer instances on this misconfig, the broker's
#   GroupCoordinator sees 20,000 unnecessary heartbeats per minute.
#
#   When the ratio is 1:2 (heartbeat=3s, session.timeout=6s — the inverse
#   misconfig, also caught by this rule's absence pattern), one missed
#   heartbeat + one slow heartbeat = false-positive rebalance.
#
# Why this is "INFO" by default (not WARNING or ERROR)
#   (a) The framework does NOT fail — the consumer runs fine with default
#       heartbeat and any session.timeout. The cost is wasted broker
#       capacity (over-aggressive heartbeat) or fragile rebalance behavior
#       (under-tuned heartbeat).
#
#   (b) Default 3s heartbeat works for default 45s session.timeout (3.x,
#       KIP-735) — 1:15 ratio, conservative. Operators on defaults are not
#       harmed.
#
#   (c) Some operators legitimately accept the default and document the
#       choice in a runbook ('our consumers do 200ms of work per record;
#       defaults work fine').
#
#   For these reasons, the rule's default severity is INFO — a documentation
#   nudge prompting the operator to set `heartbeat.interval.ms` AND
#   `session.timeout.ms` TOGETHER, documenting the coupling explicitly.
#
#   This IT overrides severity to ERROR via pom.xml configuration to force
#   the build to fail and verify the rule fires.
#
# Common bug shapes
#   (1) Slow consumer tuned with longer session.timeout.ms but heartbeat
#       left at default.
#       Team has a consumer that does heavy per-record work (~2-5 seconds
#       CPU per record). Long polls + slow processing trigger spurious
#       rebalances under default session.timeout.ms (10s on 2.x, 45s on
#       3.x). Team tunes `session.timeout.ms=120000` (2 min) to absorb
#       variation. They forget to set `heartbeat.interval.ms`; default 3s.
#       Consumer now sends 40 heartbeats per 120-second window — 13x more
#       than the recommended 2-3. Broker coordinator log fills with heart-
#       beat traffic from N consumers × 40/window; coordinator CPU spikes
#       during big-group rebalances. SRE investigation reveals the wasted
#       heartbeats. Setting `heartbeat.interval.ms=30000` is the fix.
#
#   (2) Fast-failover deployment tuned with shorter session.timeout.ms;
#       heartbeat ratio breaks.
#       SRE-mandated fast-failover: every consumer must be detected dead
#       within 6s of pod kill (Kubernetes liveness window). Team sets
#       `session.timeout.ms=6000`. They leave `heartbeat.interval.ms` at
#       default 3s. The ratio is 1:2 — one missed heartbeat plus a 0.5s
#       GC pause and the coordinator triggers a rebalance. During
#       production GC stops on a JVM with default G1GC (frequent ~200ms
#       young-gen stops, occasional ~2s mixed-gen stops), the 1:2 ratio is
#       too tight; the group rebalances multiple times per minute under
#       load; lag grows; SLO violations. Setting `heartbeat.interval.ms=
#       2000` (1:3 ratio) would have been safe.
#
#   (3) 2.x → 3.x upgrade silently flips heartbeat:session ratio.
#       kafka-clients 2.x default session.timeout.ms is 10s; with default
#       heartbeat=3s, ratio is ~1:3 (3 heartbeats per window). Team
#       upgrades to 3.x; session.timeout default is now 45s (KIP-735);
#       heartbeat still defaults to 3s; ratio is now ~1:15 — way more
#       conservative than needed, wastes broker capacity. The bug shape
#       is invisible from the consumer code; only broker-side coordinator
#       metrics show the spike. Static-analysis on the .properties (if
#       either or both keys were set explicitly) would have prevented
#       version-coupling drift.
#
#   (4) Mixed-tenant cluster: one team's wasted heartbeats hammer the
#       coordinator for everyone.
#       Multi-tenant cluster; one team has 200 consumer instances; their
#       consumer has `session.timeout.ms=90000` (intentional, slow
#       consumers) but `heartbeat.interval.ms` is default 3s. That's 200 ×
#       30 = 6000 heartbeats/minute to the GroupCoordinator for ONE
#       tenant. Visible spike in `kafka.server:type=GroupCoordinator,name=
#       NumGroupsRebalancing` and broker request log. SRE: 'who is sending
#       100 heartbeats/sec?' Investigation: one team's misconfigured
#       consumer; setting `heartbeat.interval.ms=30000` (1:3 ratio) fixes
#       the load and is functionally equivalent.
#
#   (5) Spring Boot passthrough: only one key is exposed in the team's
#       runbook.
#       Internal Spring Boot Kafka starter docs say 'set spring.kafka.
#       consumer.session-timeout for slow consumers'; doesn't mention
#       `heartbeat-interval`. Team sets session-timeout=60s; heartbeat
#       defaults to 3s. Coupling broken silently. Static analysis on the
#       underlying .properties surfaces the missing pair.
#
#   (6) Idle consumer with very long session.timeout for batch jobs.
#       Batch job consumer is idle 99% of the time but needs `session.
#       timeout.ms=300000` (5 min) to survive long idle stretches between
#       batches. With heartbeat default 3s, that's 100 heartbeats per
#       session window for a consumer doing nothing — pure waste. Setting
#       `heartbeat.interval.ms=60000` is the right pair.
#
# Fix
#   ONE LINE. Set `heartbeat.interval.ms` to ~1/3 of `session.timeout.ms`,
#   ALWAYS with both keys set together so future readers see the coupling:
#
#     # Conservative, default-3.x behavior:
#     heartbeat.interval.ms=15000
#     session.timeout.ms=45000
#
#     # Fast-failover (Kubernetes liveness coupling):
#     heartbeat.interval.ms=3000
#     session.timeout.ms=10000
#
#     # Slow batch consumer:
#     heartbeat.interval.ms=30000
#     session.timeout.ms=90000
#
#   For this fixture's `session.timeout.ms=60000`, the right pair is
#   `heartbeat.interval.ms=20000`.
#
#   The sibling rule [[consumer-heartbeat-session-ratio]] catches the
#   explicit-bad-ratio case (both keys set but ratio is wrong).
# =============================================================================

bootstrap.servers=broker-1.kafka.prod.example.com:9092,broker-2.kafka.prod.example.com:9092,broker-3.kafka.prod.example.com:9092
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer

# Group identity + client identity (isolate the rule from group-id-absent
# and client-id-absent siblings).
group.id=payments-events
client.id=payments-fraud-screening-consumer

# Partition assignment strategy (isolate the rule from the
# partition-assignment-strategy-absent sibling).
partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor

# Bootstrap-offset semantics.
auto.offset.reset=earliest

# At-least-once semantics.
enable.auto.commit=false

# Read-committed.
isolation.level=read_committed

# Poll-loop tuning.
max.poll.records=500
max.poll.interval.ms=300000

# Session timeout TUNED UP to 60s for this known-slow consumer (per-record
# processing can stretch to 30s under load). Without the matching heartbeat
# tune, the ratio is 1:20 — broker capacity wasted on excess heartbeats.
session.timeout.ms=60000

fetch.min.bytes=1024

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# MISSING:
#   heartbeat.interval.ms=...
# With session.timeout.ms=60000 above, the right pair is
# heartbeat.interval.ms=20000 (1:3 ratio). Default 3000 leaves the
# consumer sending 20 heartbeats per session window — 7x more than needed.
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
