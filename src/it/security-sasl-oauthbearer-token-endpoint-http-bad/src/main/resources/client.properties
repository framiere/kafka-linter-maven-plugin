# =============================================================================
# IT fixture: SECURITY_SASL_OAUTHBEARER_TOKEN_ENDPOINT_HTTP (bad)
# =============================================================================
#
# What this file is
#   A Kafka client .properties file destined for
#   `KafkaProducer(Properties)` / `KafkaConsumer(Properties)` inside
#   a Spring Boot 3 service `order-events-publisher` running on EKS,
#   producing order-created events to a Confluent Cloud cluster
#   secured with SASL/OAUTHBEARER + OIDC. The IdP is a self-hosted
#   Keycloak 24 running in a sibling K8s namespace, fronted by an
#   internal-only ClusterIP Service `keycloak.identity.svc.cluster.
#   local:8080` (no TLS termination — the operator deployed Keycloak
#   with `KC_HTTP_ENABLED=true` and intended to put an Istio gateway
#   in front of it later, but the gateway never shipped).
#
#   Deployment topology:
#     - EKS in eu-west-1, 3 AZs
#     - 6 pods of `order-events-publisher` distributed across AZs
#     - Each pod opens a Producer and authenticates via SASL/
#       OAUTHBEARER (the configured login callback is
#       OAuthBearerLoginCallbackHandler from KIP-768, Apache Kafka
#       3.1, January 2022)
#     - Token-endpoint POST cadence: every ~50 minutes per pod
#       (JWT lifetime is 1 hour; the Kafka client refreshes at
#       80% of TTL)
#     - 6 pods × ~1.2 POSTs/hour × 24h × 30d ≈ 5184 token-
#       endpoint POSTs/month carrying the client_secret + receiving
#       the JWT, ALL over cleartext HTTP
#
# What's wrong
#   `sasl.oauthbearer.token.endpoint.url` is set to
#   `http://keycloak.identity.svc.cluster.local:8080/realms/prod/
#   protocol/openid-connect/token` — meaning every OAuth2
#   client-credentials POST that the Kafka client makes to
#   exchange `client_id`/`client_secret` for a JWT bearer token
#   travels the network in cleartext.
#
#   Two distinct leaks happen simultaneously, both irreversible:
#
#   (1) client_secret leak — permanent compromise.
#       The POST body carries
#         grant_type=client_credentials
#         &client_id=order-events-publisher-prod
#         &client_secret=hXqPq9X3...<32-char-long-lived-secret>
#         &scope=kafka
#       OR equivalently as
#         Authorization: Basic <base64(client_id:client_secret)>
#       The client_secret is a LONG-LIVED machine credential
#       (Keycloak default rotation policy: never; org policy:
#       annual, in practice never). Once captured, the attacker
#       can mint NEW JWTs by calling the SAME endpoint with the
#       SAME credentials (over HTTPS — Keycloak does not refuse
#       requests on the basis of how the original credentials
#       were obtained). The compromise extends to EVERY service
#       in the OAuth2 trust boundary that accepts tokens for this
#       client_id, not just Kafka.
#
#   (2) JWT leak — immediate broker authentication.
#       The response body is a JSON document like
#         {"access_token":"eyJraWQiOi...","token_type":"Bearer",
#          "expires_in":3600,"scope":"kafka"}
#       The access_token is a self-contained JWT carrying the
#       `sub` (subject) and `aud` (audience) claims that the
#       Confluent Cloud brokers verify against the IdP's JWKS.
#       Once captured, the attacker can produce, consume, create
#       topics, list groups, etc. as `order-events-publisher-prod`
#       until the JWT expires — bounded only by the broker-side
#       ACLs on that subject.
#
#   Where the leak actually happens (any one of these is enough):
#     - The Istio sidecar on the Keycloak pod logs L7 HTTP access
#       (request_method, request_uri, request_body for plaintext
#       POST) to stdout; stdout is shipped to the central Loki
#       cluster, readable by every engineer with namespace-scoped
#       logs access — that's ~50 people on the platform team.
#     - The Datadog APM agent on the order-events-publisher pod
#       captures HTTP request bodies for outbound calls when the
#       URL doesn't start with `https://` — the client_secret
#       and the JWT both end up in the Datadog SaaS dashboards,
#       readable by Datadog tenant admins, and exported in every
#       trace dump shared with Datadog support.
#     - The corporate egress proxy (Zscaler) logs full request
#       URIs and bodies for `http://` traffic and only the
#       CONNECT verb for `https://` traffic; the client_secret
#       and JWT end up in the proxy access log indexed in Splunk
#       alongside every other employee's intra-corp request.
#     - The K8s network policy allows pod-to-pod within the
#       `identity` and `kafka` namespaces but does NOT prevent a
#       compromised pod in either namespace from running a
#       packet capture (`kubectl debug` or a CSI ephemeral
#       container with `NET_RAW`) — every pod-to-pod packet is
#       readable.
#
# The eight bug shapes this rule catches
#   (1) Strimzi + Keycloak with HTTP-only K8s Service. Strimzi's
#       `KafkaUser.spec.authentication.type=oauth` documentation
#       example shows `http://keycloak:8080/realms/...` as the
#       internal Service URL; operators copy-paste without
#       noticing the cluster needs an HTTPS-fronted Keycloak.
#
#   (2) Confluent Cloud + Okta — `https://` correctly required
#       for `{okta-domain}/oauth2/default/v1/token`, but
#       customers sometimes substitute the legacy `/api/v1/authn`
#       HTTP endpoint as a 'shortcut' during testing and forget
#       to revert it.
#
#   (3) Spring Boot autoconfig + custom login handler. Spring
#       Kafka does NOT validate that
#       `spring.kafka.properties.sasl.oauthbearer.token.endpoint.
#       url` starts with `https://`; the Spring Boot value is
#       forwarded verbatim to the underlying Kafka client.
#
#   (4) KRaft + Zitadel / Authentik / Ory Hydra / Dex / FusionAuth
#       — self-hosted IdPs commonly run on `:8080` with a 'we'll
#       add TLS later' comment in the README; the Kafka client
#       config locks in the cleartext URL and the migration
#       never happens.
#
#   (5) Terraform / Ansible templating leak — the IdP URL is
#       templated from a variable that resolves to `http://` in
#       the dev environment and never gets switched to
#       `https://` in prod because the prod variable was
#       forgotten in the env-specific var-file.
#
#   (6) Internal LB strip-and-forward — the operator put the IdP
#       behind an L7 LB that terminates TLS at the edge and
#       forwards `http://` internally; the operator copy-pasted
#       the INTERNAL LB URL into the Kafka client config — every
#       client-credentials request goes plaintext on the
#       internal LAN.
#
#   (7) Public WiFi from a developer laptop — a Java IDE running
#       a Kafka client with this config on a coffee-shop WiFi
#       advertises the client_secret to every other device on
#       the captive portal.
#
#   (8) Service-mesh sidecar L7 access logs — operator says
#       'the sidecar encrypts pod-to-pod, http:// inside the
#       cluster is fine' — but the sidecar's L7 access logs
#       (commonly enabled by default for Envoy/Istio/Linkerd)
#       record the full HTTP request including the body; the
#       client_secret ends up in the central logging platform.
#
# Why ERROR (not WARNING / INFO)
#   There is no production scenario where `http://` is correct
#   for this URL. The only legitimate setting is `https://...`
#   with a verified TLS certificate chain. The misconfiguration
#   is a CVE-grade leak of long-lived credentials (client_secret)
#   and short-lived but immediately-actionable tokens (JWT).
#   Severity is ERROR by default — the rule blocks the build
#   without needing per-fixture override.
#
# Fix
#   Change the URL to `https://...` with a properly-issued TLS
#   certificate. For an in-cluster IdP:
#     - Front Keycloak with an HTTPS ingress (cert-manager-
#       issued cert + Istio/NGINX/Traefik gateway).
#     - Use the public hostname of the gateway as the token
#       endpoint URL, NOT the in-cluster HTTP Service.
#     - Example fix:
#         sasl.oauthbearer.token.endpoint.url=\
#           https://keycloak.example.internal/realms/prod/\
#           protocol/openid-connect/token
#
#   For a self-signed cert in development, add the cert to the
#   JVM truststore via `cacerts` — NEVER fall back to `http://`
#   because the dev config will eventually leak into prod via
#   one of the templating mechanisms above.
# =============================================================================

# Cluster connectivity (Confluent Cloud private link endpoint).
bootstrap.servers=pkc-abc123.eu-west-1.aws.confluent.cloud:9092

# Security stack: SASL_SSL + OAUTHBEARER via Keycloak.
security.protocol=SASL_SSL
sasl.mechanism=OAUTHBEARER
sasl.login.callback.handler.class=org.apache.kafka.common.security.oauthbearer.secured.OAuthBearerLoginCallbackHandler

# OAuth2 client-credentials grant — client_id / client_secret kept in
# a sidecar-mounted secret file.
sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required \
    clientId="order-events-publisher-prod" \
    clientSecret="${env:OAUTH_CLIENT_SECRET}" \
    scope="kafka";

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# THE BUG:
# `http://` — the OAuth2 token-endpoint POST (carrying client_secret) and
# the response (carrying the JWT) travel the wire in cleartext. Any on-path
# observer (Istio sidecar L7 log, Datadog APM HTTP-body capture, Zscaler
# egress proxy log, in-pod tcpdump, compromised cluster-mesh component)
# captures BOTH credentials. Fix: change to https:// with a proper TLS cert.
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
sasl.oauthbearer.token.endpoint.url=http://keycloak.identity.svc.cluster.local:8080/realms/prod/protocol/openid-connect/token

# JWKS endpoint for broker-side token validation (broker fetches this; the
# CLIENT does not POST here, so `http://` here would be a different rule —
# this one is correct on `https://`).
sasl.oauthbearer.jwks.endpoint.url=https://keycloak.identity.svc.cluster.local/realms/prod/protocol/openid-connect/certs

# Token-refresh tuning.
sasl.login.refresh.window.factor=0.8
sasl.login.refresh.window.jitter=0.05
sasl.login.refresh.min.period.seconds=60
sasl.login.refresh.buffer.seconds=300

# Standard producer knobs.
client.id=order-events-publisher-pod-0
acks=all
enable.idempotence=true
compression.type=zstd
linger.ms=20
batch.size=131072
buffer.memory=67108864
max.block.ms=60000
delivery.timeout.ms=120000
request.timeout.ms=30000

# Serializers.
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
schema.registry.url=https://psrc-def456.eu-west-1.aws.confluent.cloud
basic.auth.credentials.source=USER_INFO
basic.auth.user.info=${SR_API_KEY}:${SR_API_SECRET}

# Connection / metadata.
metadata.recovery.strategy=rebootstrap
