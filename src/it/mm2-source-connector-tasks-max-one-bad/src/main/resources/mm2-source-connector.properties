# =============================================================================
# A MirrorMaker 2 source-connector configuration where the operator has left
# `tasks.max=1` — the Kafka-Connect ConfigDef default. On any production-scale
# MirrorSourceConnector deployment, this serializes ALL record replication
# through a single thread, single consumer instance, single producer instance
# — an artificial throughput bottleneck.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#
#   connector.class = MirrorSourceConnector
#   tasks.max       = 1               ← serializes the entire replication
#
# WHAT `tasks.max` ACTUALLY DOES ON MirrorSourceConnector:
#
# The Kafka Connect framework asks every connector at startup how to split its
# work across PARALLEL TASKS. The framework calls
# `Connector#taskConfigs(int maxTasks)`, passing the operator-configured
# `tasks.max` value, and the connector returns one `Map<String,String>` per
# task that it wants to run. The framework then launches that many tasks
# (each a separate thread, on whichever Connect-worker the framework
# schedules them onto).
#
# `MirrorSourceConnector#taskConfigs(int maxTasks)` implements this hook as:
#
#   1. Enumerate every source-cluster topic-partition matching the connector's
#      `topics` / `topics.exclude` regex. Call this set S = {tp_1, tp_2, ...,
#      tp_K}, with |S| = K. On a real production cluster, K is typically in
#      the hundreds to low thousands.
#
#   2. Round-robin assign the K partitions to `min(maxTasks, K)` task buckets.
#      Bucket i gets partitions tp_i, tp_{i + maxTasks}, tp_{i + 2*maxTasks},
#      ...
#
#   3. Return one task-config map per bucket — each containing the bucket's
#      partition list as a comma-separated string.
#
# If `tasks.max = 1`, step 2 produces a SINGLE bucket containing ALL K
# partitions. The framework launches ONE task. That one task runs in a SINGLE
# thread, creates ONE Kafka consumer (against the source cluster), ONE Kafka
# producer (against the target cluster), and processes its K partitions
# serially within its poll loop.
#
# THE THROUGHPUT CEILING:
#
# The single task's throughput ceiling is the throughput of one consumer +
# one producer running on commodity hardware. Typical numbers:
#
#   - One consumer: 100–300 MB/s raw, but with TLS, gzip/snappy, and
#     consumer-side deserialization typically 50–150 MB/s effective.
#   - One producer: 100–300 MB/s raw, but with TLS, compression, and
#     `acks=all` with `replication.factor=3` typically 50–150 MB/s effective.
#   - Both running in the SAME thread: ~50–100 MB/s end-to-end (the consumer
#     and producer share the thread; the thread alternates between
#     `consumer.poll()` and `producer.send()`).
#
# With `tasks.max=1` on a cluster producing 30 MB/s aggregate across 200
# partitions, replication keeps up — but with no headroom. With aggregate
# throughput of 80 MB/s (common in growing production deployments), the
# single-task ceiling is hit; replication lag grows monotonically.
#
# THE FAILURE MODE — SILENT IN STEADY STATE, CATASTROPHIC UNDER LOAD:
#
# `tasks.max=1` does NOT cause a startup failure. The connector registers, the
# single task runs, records flow. Steady-state monitoring (record-count
# dashboards, last-record-timestamp) shows replication working. The misconfig
# is invisible until ANY of:
#
#   (a) **Traffic spike.** Black-Friday-style spike, marketing campaign
#       launch, batch-job burst. Aggregate source throughput rises above the
#       single-task ceiling; lag rises; the team gets paged for 'DR is X
#       hours behind' and spends a war-room afternoon discovering tasks.max=1
#       in a config file no one had touched since initial deployment.
#
#   (b) **Post-restart catch-up.** Connect worker is restarted (rolling
#       upgrade, host maintenance, OOM kill). The single task restarts from
#       its last committed offsets, but now needs to replay the records
#       produced during the downtime. With one-task throughput at 50 MB/s
#       and a 30-minute downtime backlog representing 90 GB, catch-up takes
#       30 minutes — IF source throughput drops to near-zero during catch-up
#       (which it doesn't). In practice, catch-up never completes; the
#       deployment is permanently lagged.
#
#   (c) **Topic-set growth.** Source cluster adds 300 new partitions
#       (legitimate growth: new product line, new tenant). The single task
#       now spreads its fixed throughput budget across 500 partitions
#       instead of 200; per-partition replication lag rises 2.5x. No
#       alarm fires (aggregate throughput per task is unchanged), but the
#       team's DR-readiness dashboards show 2.5x worse per-partition
#       freshness.
#
#   (d) **Multi-source amplification.** Org has 5 source clusters each
#       replicating into one DR cluster with one MirrorSourceConnector per
#       source-DR pair, all with `tasks.max=1`. Aggregate cross-cluster
#       throughput is 5× one-task — the DR cluster's brokers are 90% idle,
#       but each source-DR replication is bottlenecked at 50 MB/s. Capacity
#       planners look at the DR cluster's headroom and conclude 'lots of
#       room'; they don't realize the bottleneck is upstream of the DR
#       cluster.
#
# HOW THIS HAPPENS:
#
# (a) **Tutorial copy-paste.** Almost every MM2 quick-start tutorial shows
#     `tasks.max=1` 'to keep the example simple'. The tutorial author is
#     teaching the Connect runtime, not parallelism. Team's first MM2
#     deployment is bootstrapped from the tutorial; tasks.max=1 carries
#     forward; the bottleneck is invisible until traffic grows.
#
# (b) **Helm-chart inheritance.** Org's generic 'kafka-connect connector'
#     Helm chart defaults `tasksMax: 1` because that matches the Connect
#     ConfigDef default and is correct for the majority of connectors (JDBC
#     source, FileStream, etc.). MM2 deployments inherit the chart; all
#     of them are bottlenecked from day one.
#
# (c) **Confusion with MirrorHeartbeatConnector / MirrorCheckpointConnector.**
#     `tasks.max=1` IS correct for both — they have minimal per-partition
#     workload (one record per heartbeat-interval / per group per emit-
#     interval). Operator copies a heartbeat-connector .properties as a
#     template for a source connector, changes connector.class, but forgets
#     to update tasks.max.
#
# (d) **'I will tune later' deferral.** Operator deliberately starts at
#     tasks.max=1 'to keep the initial deployment simple, then scale up
#     once we have throughput measurements'. The 'tune later' work is never
#     prioritized; the bottleneck becomes permanent.
#
# (e) **Mismatched understanding of `taskConfigs(maxTasks)`.** Operator
#     reads the Connect docs and thinks 'tasks.max is the MAXIMUM' — they
#     assume Connect will dynamically use fewer tasks if there's less work.
#     This is partially true (Connect won't create more tasks than there
#     are partitions to assign), but it's a CEILING, not a floor or a
#     hint. The operator sets tasks.max=1 thinking 'Connect will scale up
#     if needed'. Connect won't.
#
# THE FIX:
#
# Set `tasks.max` to a value matching the desired parallelism. Recommended
# starting point for production MM2 deployments: 4–8 tasks per source-DR
# pair, scaled up based on observed lag.
#
#   tasks.max=4               ← reasonable starting point for production
#   tasks.max=8               ← high-throughput deployments
#
# Rule of thumb: `tasks.max = min(8, max(2, partition-count / 100))`.
#
# Note: the Connect framework caps the effective task count at the number
# of source-side partitions — if your topics-regex matches only 3 partitions,
# `tasks.max=8` will still produce only 3 tasks (one per partition). So
# setting `tasks.max` higher than the eventual partition count is safe — it
# means 'use as many tasks as there are partitions, up to this ceiling'.
#
# =============================================================================

name=mm2-source
connector.class=org.apache.kafka.connect.mirror.MirrorSourceConnector

# VIOLATION: tasks.max=1 on a MirrorSourceConnector serializes all record
# replication through a single Connect task — one thread, one consumer, one
# producer. Production MM2 deployments typically need 4–8 tasks to keep up
# with the aggregate source-cluster throughput. Fix: set tasks.max to a
# value matching the parallelism your deployment needs (e.g., 4 or 8).
tasks.max=1

source.cluster.alias=primary
target.cluster.alias=dr

source.cluster.bootstrap.servers=primary-kafka.internal:9093
target.cluster.bootstrap.servers=dr-kafka.internal:9093

topics=orders\\..*,payments\\..*,inventory\\..*
groups=.*

replication.factor=3
offset-syncs.topic.replication.factor=3
heartbeats.topic.replication.factor=3
checkpoints.topic.replication.factor=3

refresh.topics.interval.seconds=600
