# =============================================================================
# IT fixture: SECURITY_SSL_PROTOCOL_LEGACY (bad)
# =============================================================================
#
# What this file is
#   A Kafka client .properties file used by `legacy-edi-bridge` — a JVM
#   service that bridges EDI X12 transactions from a 2014-era on-prem
#   Tibco bus to a modern Apache Kafka 3.7 cluster. The service runs
#   on a corporate VM (RHEL 7, OpenJDK 8u201) that has not been
#   refreshed since the original deployment in 2018.
#
#   The cluster the client connects to (`kafka-prod.example.com:9093`)
#   is a brand-new Apache Kafka 3.7 deployment on Strimzi/Kubernetes;
#   the brokers happily negotiate TLS 1.3, TLS 1.2, or TLS 1.1 —
#   because nobody has set `ssl.enabled.protocols` on the broker
#   side, the broker is on its TLS-1.2-floor default (Apache Kafka
#   3.0+ disables TLS 1.0 server-side but leaves 1.1 enabled for
#   backward compatibility).
#
# What's wrong
#   `ssl.protocol=TLSv1.1` — the operator pinned the client's TLS
#   handshake to a legacy version that is:
#     - deprecated by RFC 8996 (March 2021)
#     - explicitly disabled by JDK 8u291+, JDK 11.0.11+, and JDK 17+
#       via `jdk.tls.disabledAlgorithms` in `java.security`
#     - forbidden by PCI-DSS 4.0 (March 2025)
#     - forbidden by FedRAMP Moderate baseline
#     - rejected by every modern HTTP/3 / QUIC stack (which only
#       support TLS 1.3)
#     - vulnerable to BEAST (CVE-2011-3389), Lucky-13 timing
#       attacks, and the POODLE downgrade variant
#
#   Why this is in the file at all (the actual historical story):
#     - In 2018, the operator deployed `legacy-edi-bridge` against a
#       Kafka 0.11 cluster running on RHEL 6 (OpenJDK 7u80). That
#       JDK did NOT support TLS 1.2 client-side by default — TLS 1.2
#       had to be explicitly enabled via the `https.protocols`
#       system property or `ssl.protocol` per-client.
#     - Someone in the team copy-pasted `ssl.protocol=TLSv1.1` from
#       a Stack Overflow answer dated 2014 — the answer was wrong
#       even then, but the cluster was so old that TLSv1.1 happened
#       to work, so nobody noticed.
#     - The service has been working flawlessly for 7 years. No one
#       has touched this .properties file since.
#     - Today, the security team is forcing a JDK 8 -> JDK 17
#       upgrade across the fleet. The bridge crashes at startup with
#       `java.security.NoSuchAlgorithmException: TLSv1.1 SSLContext
#       not available`. The on-call engineer opens this file, sees
#       the pinning, and... has three bad choices.
#
# Three bad choices the engineer faces (without this rule)
#   (a) **Roll back the JDK upgrade.** Stays on JDK 8u201 forever;
#       inherits every JDK 8 CVE going forward; security team
#       eventually forces the upgrade anyway in 12 months when JDK 8
#       is removed from corporate-approved-software list.
#   (b) **Patch `java.security` to re-enable TLSv1.1.** The most
#       common 'fix' on legacy-system bridges: edit
#       `<JAVA_HOME>/conf/security/java.security`, remove `TLSv1.1`
#       from `jdk.tls.disabledAlgorithms`. The patch survives JDK
#       minor upgrades but breaks major upgrades; it also re-opens
#       the entire client-fleet to TLS 1.1 attacks because the patch
#       is applied to the JDK install, not just this app.
#   (c) **Change `ssl.protocol=TLSv1.1` to `TLSv1.2`** (or just
#       remove the line entirely). The actual fix. The Kafka broker
#       accepts TLS 1.3 / 1.2 / 1.1 anyway; removing the pinning
#       lets the JDK negotiate TLS 1.3 (with JDK 17) or 1.2 (with
#       JDK 8u291+), which is what the broker would have negotiated
#       all along if the client weren't actively forbidding it.
#
#   This lint rule catches the misconfiguration BEFORE the JDK
#   upgrade triggers the runtime crash — turning a multi-day
#   incident into a one-line PR.
#
# The eight bug shapes this rule catches
#   (1) Pinning TLSv1.1 on a legacy bridge that has 'worked for
#       years'. JDK upgrade exposes the pinning as a startup crash.
#       This fixture's scenario.
#
#   (2) Pinning TLSv1 on a Java 7 -> Java 8 migration. Same
#       trajectory, one TLS version earlier. The JDK 8 default
#       cipher list also dropped TLSv1, but it was re-enableable
#       via `-Dhttps.protocols=TLSv1`.
#
#   (3) Pinning `ssl.protocol=TLS` (the JDK alias). On JDK 7/8,
#       `TLS` resolved to 'whatever TLS version is highest'; on
#       JDK 11+, it resolves to TLS 1.3. The alias hides the
#       negotiated version from compliance auditors — they cannot
#       tell whether the client is on TLS 1.2 or TLS 1.3 without
#       inspecting the JDK build, and a JDK upgrade silently
#       changes the negotiated version.
#
#   (4) Pinning `ssl.protocol=SSL` or `SSL_TLS`. JDK aliases that
#       resolve to the default SSLContext but historically
#       permitted SSLv3 fallback. Removed in modern JDKs but the
#       string still appears in copy-pasted configs.
#
#   (5) Pinning SSLv3 explicitly. POODLE-vulnerable. Modern JDK
#       refuses to instantiate; older JDK silently connects with
#       a vulnerable cipher.
#
#   (6) Pinning SSLv2 / SSLv2Hello explicitly. DROWN-vulnerable.
#       Removed from every JDK shipped after 2015; specifying it
#       fails immediately on JDK 8+.
#
#   (7) Spring Boot autoconfig leak — Bitnami / Helm chart for
#       Kafka client puts `spring.kafka.properties.ssl.protocol=
#       TLS` as a 'safe default'; templated into every Spring
#       Boot Kafka app in the org; every Spring app inherits the
#       version-hiding alias.
#
#   (8) FIPS 140-2/3 mode failure. A FIPS-mode JDK refuses to
#       instantiate any SSLContext below TLS 1.2; the legacy
#       pinning makes the app non-startable in FIPS-mandated
#       environments (DoD, FedRAMP High, EU GDPR-Schrems-II
#       data-residency requirements).
#
# Why ERROR (not WARNING / INFO)
#   The default severity is ERROR because every legacy value here
#   is either non-functional on modern JDKs (immediate startup
#   crash) OR actively dangerous (silent downgrade to a known-
#   vulnerable cipher suite). There is no production scenario
#   where pinning `ssl.protocol` to TLS 1.1 or below is correct;
#   the right action is always to remove the line and let the JDK
#   default handle negotiation.
#
# Fix
#   DELETE the `ssl.protocol` line entirely:
#     # ssl.protocol=TLSv1.1     <-- remove this line
#   Modern JDK defaults handle the rest:
#     - JDK 17+: client offers TLS 1.3 / 1.2 in priority order
#     - JDK 11.0.11+: client offers TLS 1.3 / 1.2
#     - JDK 8u291+: client offers TLS 1.2
#   All three negotiate against any modern Kafka broker.
#
#   If you genuinely need to pin a specific minimum (regulated
#   environment, explicit audit requirement), use:
#     ssl.protocol=TLSv1.3
#     ssl.enabled.protocols=TLSv1.3
#   which locks the negotiation floor AND the version list to
#   TLS 1.3 only.
#
#   If a legacy broker is the actual blocker (it only supports
#   TLS 1.1), the BROKER is the bug — upgrade it. Apache Kafka 1.0
#   (November 2017) supports TLS 1.2; 3.0+ supports TLS 1.3.
# =============================================================================

# Cluster connectivity.
bootstrap.servers=kafka-prod.example.com:9093

# Security stack: TLS + SCRAM-SHA-512 (the brokers accept TLS 1.3).
security.protocol=SASL_SSL
sasl.mechanism=SCRAM-SHA-512
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required \
    username="legacy-edi-bridge" \
    password="${env:KAFKA_SCRAM_PASSWORD}";

# Truststore (PKCS12, properly configured).
ssl.truststore.location=/etc/legacy-edi-bridge/kafka.truststore.p12
ssl.truststore.password=${env:KAFKA_TRUSTSTORE_PASSWORD}
ssl.truststore.type=PKCS12

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# THE BUG:
# `TLSv1.1` — RFC-8996 deprecated, disabled by default on every modern JDK,
# vulnerable to BEAST + Lucky-13 + POODLE-downgrade, forbidden by PCI-DSS
# 4.0 and FedRAMP. On JDK 11.0.11+ / JDK 17+ the application CRASHES at
# startup with `java.security.NoSuchAlgorithmException: TLSv1.1 SSLContext
# not available`. Fix: delete this line; the JDK default handles it.
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
ssl.protocol=TLSv1.1

# Consumer identity + group.
group.id=legacy-edi-bridge
client.id=legacy-edi-bridge-pod-0
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer

# Reliability knobs.
enable.auto.commit=false
isolation.level=read_committed
auto.offset.reset=earliest
max.poll.records=500
max.poll.interval.ms=300000
session.timeout.ms=45000
heartbeat.interval.ms=15000
request.timeout.ms=60000
fetch.min.bytes=1
fetch.max.wait.ms=500
partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor

# Metadata recovery.
metadata.recovery.strategy=rebootstrap
