name=jdbc-source-orders-avro
connector.class=io.confluent.connect.jdbc.JdbcSourceConnector
tasks.max=1

connection.url=jdbc:postgresql://db.internal:5432/orders
connection.user=connect
connection.password=secret
table.whitelist=orders
mode=incrementing
incrementing.column.name=order_id

# Anti-pattern: AvroConverter is set on the value but no value.converter.schema.registry.url
# is provided. The converter REQUIRES schema.registry.url to construct its
# CachedSchemaRegistryClient. The task will fail at startup with
# ConfigException — or, on a permissive worker with worker-level
# value.converter.schema.registry.url defaults, silently bind to the wrong
# registry instance (e.g. prod when the connector was authored for staging).
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.auto.register.schemas=false
