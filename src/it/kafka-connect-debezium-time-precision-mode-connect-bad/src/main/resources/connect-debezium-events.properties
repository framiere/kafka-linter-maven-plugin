name=debezium-events
connector.class=io.debezium.connector.postgresql.PostgresConnector
tasks.max=1

database.hostname=events-db.internal
database.port=5432
database.user=debezium
database.password=changeme
database.dbname=eventstore

topic.prefix=cdc.events
slot.name=debezium_events
publication.name=dbz_publication_events

table.include.list=public.events,public.audit_log

schema.history.internal.kafka.topic=cdc.events.schema-history
schema.history.internal.kafka.bootstrap.servers=kafka:9092

snapshot.mode=initial

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081

# Anti-pattern: time.precision.mode=connect downgrades every temporal
# column to Kafka Connect's built-in Timestamp/Time/Date logical types,
# which have ONLY millisecond precision. For this event-sourcing store
# with Postgres TIMESTAMP(6) columns (microsecond precision), every
# event's created_at value is silently truncated from microseconds to
# milliseconds AT THE CONNECTOR, before the record reaches Kafka:
#   source:  2025-01-15 14:23:45.123456
#   kafka:   2025-01-15 14:23:45.123     (microseconds lost)
# Two events that occurred 50 microseconds apart on the source database
# arrive in Kafka with IDENTICAL millisecond timestamps. Downstream
# replay-in-order consumers cannot determine causal order; state
# reconstruction becomes non-deterministic. The correct setting for any
# CDC pipeline with sub-millisecond source precision is the default
# `adaptive` (preserves microsecond/nanosecond precision via
# io.debezium.time.MicroTimestamp / NanoTimestamp semantic types).
time.precision.mode=connect
