name=debezium-orders
connector.class=io.debezium.connector.mysql.MySqlConnector
tasks.max=1

database.hostname=orders-db.internal
database.port=3306
database.user=debezium
database.password=changeme
database.server.id=84001
database.include.list=orders

topic.prefix=cdc.orders
schema.history.internal.kafka.topic=cdc.orders.schema-history
schema.history.internal.kafka.bootstrap.servers=kafka:9092

table.include.list=orders.line_items,orders.invoices

snapshot.mode=initial

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081

# Anti-pattern: operator bumped max.batch.size 'for higher throughput'
# without bumping max.queue.size. Debezium docs explicitly state:
# 'max.queue.size should always be larger than the maximum batch size
# specified by the max.batch.size property.' Here we have:
#   max.batch.size = 16384  (above the default 2048)
#   max.queue.size = 8192   (unchanged from the default)
# Net effect: the bounded queue between the database-reader thread and
# the Connect-framework consumer thread can hold AT MOST 8192 records,
# but the consumer is asking for 16384 per poll. Every poll cycle drains
# at most 8192 records (the queue capacity), throughput collapses to
# ~queue-capacity-per-poll instead of the intended ~batch-size-per-poll,
# and out-of-band heartbeat/metadata events compete for the same scarce
# queue space causing sporadic reader-thread blocking.
max.batch.size=16384
