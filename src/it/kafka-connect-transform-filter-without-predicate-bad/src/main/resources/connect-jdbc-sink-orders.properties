# =============================================================================
# Confluent JDBC sink connector consuming records from the `events.orders.*`
# topics and writing them to a Postgres orders-replica database.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#
#   transforms = dropDeletes
#   transforms.dropDeletes.type = org.apache.kafka.connect.transforms.Filter
#   # NOTE: NO `transforms.dropDeletes.predicate` line!
#
# WHY THIS IS A "BLACK-HOLE CONNECTOR" BUG:
#
# Kafka Connect's Single-Message-Transform (SMT) framework lets operators
# apply a chain of in-process record transformations to source-connector
# records (before they reach the Kafka broker) or to sink-connector records
# (after they're polled from Kafka). The framework was introduced in Kafka
# 0.10.2 (KIP-66) and significantly expanded in Kafka 2.6 (KIP-585) with
# the addition of Predicates — small boolean functions that, when chained
# with an SMT via `transforms.<name>.predicate=<predicate-name>`, control
# whether the transform is applied to a given record.
#
# The `org.apache.kafka.connect.transforms.Filter` SMT is the canonical
# Predicate-paired transform. Its implementation is one line:
#
#   public R apply(R record) { return null; }
#
# Returning `null` from a transform's `apply()` tells the Connect-framework's
# TransformationChain to DROP the record from the pipeline. Filter is
# INTENDED to be paired with a Predicate, so dropping is CONDITIONAL:
#
#   transforms = dropDeletes
#   transforms.dropDeletes.type      = org.apache.kafka.connect.transforms.Filter
#   transforms.dropDeletes.predicate = isDelete
#   predicates                       = isDelete
#   predicates.isDelete.type         = org.apache.kafka.connect.transforms.predicates.RecordIsTombstone
#
# In the above (correct) configuration, the Filter SMT only drops records
# for which the `isDelete` predicate returns TRUE — i.e., tombstones
# (DELETEs from a CDC source). All other records pass through untouched.
#
# WITHOUT a predicate (this fixture), the framework ALWAYS invokes the
# transform's `apply()` — which always returns null — which drops the
# record. EVERY record passing through the connector is dropped.
#
# REAL-WORLD INCIDENT SHAPE:
#
# Operator wants to drop Debezium DELETE events at the sink (downstream is
# an append-only audit log that doesn't model deletes). They add the
# Filter SMT to the connector config, intending to add the predicate
# definition later (after they figure out which RecordIsTombstone /
# HasHeaderKey / TopicNameMatches predicate they need). They commit the
# Filter-only version. The reviewer doesn't catch the missing predicate
# (the SMT name `dropDeletes` looks self-explanatory). The connector is
# deployed.
#
# - Connect REST endpoint `/connectors/orders-sink/status` shows RUNNING.
# - Worker logs show normal poll/put cycles (consumer offsets advance).
# - The connector's `kafka_connect_sink_records_read` metric increments.
# - The downstream Postgres `orders` table receives ZERO rows.
#
# The team's first instinct is to debug:
#   - JDBC connection-string ("Is the password right?")
#   - Postgres permissions ("Is the `orders` table writable?")
#   - Schema-registry connectivity ("Is the value-converter working?")
#   - Kafka topic content ("Is the source actually producing records?")
#
# After ~4 hours, someone reads the SMT documentation and notices the
# predicate is missing. The fix is one line:
#
#   transforms.dropDeletes.predicate = isDelete
#   predicates                       = isDelete
#   predicates.isDelete.type         = org.apache.kafka.connect.transforms.predicates.RecordIsTombstone
#
# OTHER INCIDENT SHAPES:
#
#   - Helm chart with `transforms.filter.type=...Filter` as a template
#     default; teams deploy without adding the predicate override; every
#     deployed connector silently drops every record.
#
#   - Operator confuses Filter (record-level drop) with ReplaceField
#     (field-level projection) and writes `transforms.dropField.type=Filter`
#     with `transforms.dropField.exclude=internal_id` — the `exclude`
#     config is silently ignored (Filter doesn't accept it), every record
#     is dropped.
#
#   - Operator believes Filter is "opt-in to filtering" and adds it to
#     every connector config "in case we need it later"; every connector
#     silently drops every record from day one.
#
# THE FIX:
#
# Either attach a predicate (Filter drops only the intended subset):
#
#   transforms                       = dropDeletes
#   transforms.dropDeletes.type      = org.apache.kafka.connect.transforms.Filter
#   transforms.dropDeletes.predicate = isDelete
#   predicates                       = isDelete
#   predicates.isDelete.type         = org.apache.kafka.connect.transforms.predicates.RecordIsTombstone
#
# Or remove the Filter SMT entirely if the operator's intent was a
# different transform (ExtractField, ReplaceField, ValueToKey, etc.).
#
# =============================================================================

name=orders-sink
connector.class=io.confluent.connect.jdbc.JdbcSinkConnector
tasks.max=2

topics=events.orders.created,events.orders.shipped,events.orders.cancelled

connection.url=jdbc:postgresql://orders-replica.internal:5432/orders
connection.user=orders_writer
connection.password=changeme

insert.mode=upsert
pk.mode=record_key
pk.fields=order_id
auto.create=true
auto.evolve=true

# VIOLATION: Filter SMT declared without a predicate. The Filter SMT
# returns null from apply() unconditionally; with no predicate, the
# Connect framework invokes apply() on EVERY record, dropping every
# record from the pipeline. The connector reports RUNNING and worker
# metrics look normal, but the downstream Postgres `orders` table
# receives ZERO rows. Fix: attach a predicate (`transforms.dropDeletes.
# predicate=isDelete` + top-level `predicates=isDelete` + `predicates.
# isDelete.type=...RecordIsTombstone`) so Filter drops only tombstones,
# or remove the Filter SMT if the intent was a different transform.
transforms=dropDeletes
transforms.dropDeletes.type=org.apache.kafka.connect.transforms.Filter

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
