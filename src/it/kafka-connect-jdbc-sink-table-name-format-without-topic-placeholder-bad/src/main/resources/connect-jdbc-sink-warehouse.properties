# =============================================================================
# Confluent JDBC sink connector consuming from THREE topics (orders, prices,
# customers) and writing rows into a Postgres warehouse database.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#
#   topics              = orders,prices,customers     # ← 3 topics
#   table.name.format   = events_warehouse             # ← LITERAL, no ${topic}
#
# WHY THIS IS A "MULTI-TOPIC FUNNEL" BUG:
#
# The Confluent JDBC sink connector (`io.confluent.connect.jdbc.JdbcSinkConnector`)
# writes Kafka records into a relational database. For each consumed record,
# the connector resolves the TARGET TABLE NAME via the `table.name.format`
# config — a template string with one supported placeholder, `${topic}`,
# substituted at runtime with the source-topic name of the record being
# processed. The default value is `${topic}` itself, meaning "use the Kafka
# topic name as the target table name verbatim" — so records from topic
# `orders` go to table `orders`, records from topic `prices` go to table
# `prices`, etc.
#
# When `table.name.format` is set to a literal string with NO placeholder,
# the runtime substitution is a no-op. Every consumed record — regardless of
# its source topic — resolves to the SAME table name. With multiple topics
# (either a comma-separated `topics=A,B,C` or a `topics.regex=` that matches
# multiple topics), this collapses N topics' records into ONE shared table.
#
# REAL-WORLD INCIDENT SHAPES:
#
# (1) **CDC mirror with collapsed table.name.format.**
#     A team builds a Debezium-source-to-JDBC-sink CDC mirror for an entire
#     Postgres database. The source emits one Kafka topic per source table
#     (`cdc.public.orders`, `cdc.public.customers`, `cdc.public.products`).
#     The sink is deployed with `topics.regex=cdc\..*` and
#     `table.name.format=cdc_mirror` (the operator misread the docs and
#     thought this was the TARGET SCHEMA name — it isn't; it's a literal
#     TABLE name). The sink starts; `auto.create=true` is set; the connector
#     tries to create a single table `cdc_mirror` with the UNION of all
#     source-table columns; the schema-merge fails when `orders.id BIGINT`
#     collides with `products.id VARCHAR` (both topics have an `id` field
#     but different types).
#
#     The connector task fails at startup:
#
#        org.apache.kafka.connect.errors.DataException: Cannot reconcile
#        schema for cdc_mirror
#
# (2) **"I'll add the placeholder later".**
#     Operator deploys a multi-topic JDBC sink with `topics=A,B,C` and
#     `table.name.format=events` as a "temporary" value, planning to switch
#     to `${topic}` after testing. The sink runs in dev with a single topic
#     where everything works (no collapse — only one topic). Promotion to
#     staging activates topic B and C; rows from all three topics start
#     landing in `events` (a table that was supposed to be for topic A only).
#     Downstream queries fail because the schema of `events` is wrong for
#     B and C; if `auto.evolve=true`, the sink starts ALTERing `events` to
#     add columns from B and C; the table balloons to 50+ columns and
#     downstream analytics break.
#
# (3) **Multi-tenant sink with shared format.**
#     Team builds a multi-tenant JDBC sink with `topics.regex=tenant_.*\.events`
#     and `table.name.format=tenant_events` (intending: a single shared
#     table for all tenants, partitioned by tenant_id). The design is
#     technically valid (single-table-per-tenant-column is a legitimate
#     schema choice), but the operator hadn't thought through that the
#     per-tenant Kafka topics would land in a table with no `tenant_id`
#     column derived from the topic name. Records from `tenant_a.events`
#     and `tenant_b.events` land in the SAME table with no way to attribute
#     rows to tenants.
#
#     Fix: either `table.name.format=${topic}` (one table per tenant) OR
#     add an SMT that extracts the tenant from the topic name into a
#     column (`InsertField$Value` or a custom SMT).
#
# (4) **Helm chart with literal format default.**
#     Team's JDBC sink Helm chart templates `tableNameFormat: events` (a
#     literal default the chart author chose "as a placeholder for teams
#     to override"). A team deploys the chart with `topics.regex=service-.*`
#     (multiple topics) and forgets to override `tableNameFormat`. Every
#     service's events land in a shared `events` table.
#
# (5) **Migration from single-topic to multi-topic.**
#     Team had a single-topic JDBC sink (`topics=orders`) with
#     `table.name.format=orders_warehouse` (a literal, no placeholder —
#     fine for the single-topic case). Later they expand to multi-topic
#     (`topics=orders,prices,customers`) but forget to update
#     `table.name.format`. All three topics' records flow into
#     `orders_warehouse`; the table starts receiving rows that don't fit
#     the original schema.
#
# (6) **Copy-paste of working single-topic config.**
#     Operator copies a working JDBC sink config that had `topics=orders`
#     and `table.name.format=orders_v2` (literal — fine for that
#     single-topic deployment). The new deployment uses
#     `topics=orders,returns,refunds` but keeps `table.name.format=orders_v2`
#     from the copy. Three topics → one table.
#
# (7) **Misunderstanding of `topic.prefix` vs `table.name.format`.**
#     Operator confuses the Confluent JDBC SOURCE connector's `topic.prefix`
#     (which is prepended to source-table names to derive output-topic
#     names — `topic.prefix=cdc.` + table `orders` → topic `cdc.orders`)
#     with the SINK connector's `table.name.format` (which IS a format with
#     `${topic}` placeholder). They write `table.name.format=cdc` thinking
#     it's a prefix — but on the sink, that's the LITERAL table name.
#     Three multi-topic records all land in table `cdc`.
#
# THE FIX:
#
# Either insert the `${topic}` placeholder into the format string:
#
#   table.name.format = ${topic}                # default-equivalent
#   table.name.format = cdc_${topic}            # per-topic prefix
#   table.name.format = ${topic}_v2             # per-topic suffix
#
# OR reduce to a single topic if the operator's intent was truly
# "all of these records into one shared table":
#
#   topics = orders
#   table.name.format = orders_warehouse
#
# =============================================================================

name=warehouse-events-sink
connector.class=io.confluent.connect.jdbc.JdbcSinkConnector
tasks.max=4

# Three topics — the multi-topic precondition for the rule.
topics=orders,prices,customers

connection.url=jdbc:postgresql://warehouse-db.internal:5432/warehouse
connection.user=warehouse_etl
connection.password=warehouse_password_placeholder

# Required cross-key config for upsert mode (avoids cross-firing
# CONNECT_JDBC_SINK_UPSERT_OR_UPDATE_WITHOUT_PK).
insert.mode=upsert
pk.mode=record_key
pk.fields=id

auto.create=true

# VIOLATION: table.name.format is a literal string with NO `${topic}` placeholder.
# With three topics (orders, prices, customers) and `table.name.format=events_warehouse`,
# every record from all three topics is funneled into the SAME table
# `events_warehouse`. The records' value schemas collide; with `auto.create=true`
# the connector may fail at startup with a schema-merge type conflict
# (`Cannot reconcile schema for events_warehouse`); with `auto.evolve=true`
# (not set here) the connector would silently ALTER the shared table to
# accommodate every column from every topic. Fix: insert the `${topic}`
# placeholder — `table.name.format=${topic}` (one table per topic),
# `table.name.format=cdc_${topic}` (per-topic prefix), or reduce `topics` to
# a single topic if the operator's intent was truly "one shared table".
table.name.format=events_warehouse

batch.size=3000

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
