# =============================================================================
# IT fixture: SECURITY_SSL_KEYSTORE_TYPE_JKS (bad)
# =============================================================================
#
# What this file is
#   A Kafka mTLS client .properties file for `payments-settlement-batch`
#   — a Spring Boot 3.2 service running on OpenShift 4.14, consuming
#   payment events from a self-hosted Apache Kafka 3.7 cluster operated
#   by an internal platform team. The cluster requires mutual TLS (mTLS)
#   for every connection: every client must present an X.509 certificate
#   issued by the company's internal CA, and that certificate has to be
#   rotated every 90 days.
#
#   The certificate-rotation pipeline:
#     1. cert-manager v1.13 (running in the same OpenShift cluster)
#        watches a `Certificate` resource for this service.
#     2. cert-manager issues a fresh cert from the internal CA every
#        80 days (10-day overlap before expiry).
#     3. The cert lands in a Kubernetes `Secret` of type
#        `kubernetes.io/tls` as `tls.crt`, `tls.key`, and a PKCS12
#        bundle in `keystore.p12` (cert-manager 1.5+ feature, the
#        `keystores.pkcs12.create=true` field on the Certificate spec).
#     4. The Spring Boot pod mounts the Secret as a volume; the
#        application reads the keystore at startup.
#
# What's wrong
#   `ssl.keystore.type=JKS` — the rest of the certificate-management
#   pipeline produces and ships PKCS12. To use a JKS keystore in this
#   Kafka client, the pod runs an init-container that does a `keytool
#   -importkeystore -srcstoretype PKCS12 -deststoretype JKS` on every
#   pod startup. Each conversion takes ~3 seconds (the init-container
#   has to spin up, run, exit), adds an extra failure mode (init-
#   container's image registry credentials, the keytool binary's JDK
#   version mismatch, the conversion's password handling), and is
#   completely unnecessary — the Kafka client (kafka-clients 3.4+)
#   reads PKCS12 keystores natively via the standard JCA SPI.
#
#   This is NOT a runtime vulnerability — the JKS keystore is loaded
#   and parsed correctly, the mTLS handshake works, the Kafka client
#   produces and consumes as expected. The issue is a maintainability
#   tax that compounds every cert rotation: 4 rotations per year ×
#   ~30 pods running this service = 120 init-container runs per year
#   that exist solely to convert a format that the Kafka client can
#   read natively.
#
# Why this matters: the broader system context
#   (1) **cert-manager has NO `keystores.jks` field.** cert-manager's
#       Certificate CRD supports `keystores.pkcs12.create=true` (since
#       v1.5, Aug 2021) to materialize a PKCS12 bundle inside the
#       Secret. There is no equivalent JKS field. The team that
#       requires JKS keystores has to write either an init-container
#       (this fixture's anti-pattern) or a sidecar/operator that
#       watches the Secret and writes out a JKS — and the operator
#       becomes one more piece of homegrown infrastructure that has
#       to be maintained, monitored, and rotated independently.
#
#   (2) **The JKS format itself.** JKS is Sun's proprietary keystore
#       format from JDK 1.2 (1998). It uses a custom binary layout
#       (8-byte magic, version, salt, then a sequence of entry
#       records) and historically used SHA-1 for the integrity MAC.
#       JDK 8u301 (July 2021) switched the JKS MAC to SHA-256 by
#       default, but the format itself is still Java-only. PKCS12
#       (RFC 7292, ratified 2014) is the cross-platform alternative:
#       OpenSSL, Windows certutil, macOS Keychain, Linux p11-kit,
#       cert-manager, Vault PKI, AWS ACM, GCP Certificate Manager —
#       every modern tool reads and writes PKCS12 natively.
#
#   (3) **JDK 9+ default is PKCS12.** Since JEP 229 (JDK 9, September
#       2017) the JDK's default `keystore.type` system property is
#       `pkcs12`. New keystores created with `keytool -genkeypair`
#       (without an explicit `-storetype`) are PKCS12, not JKS. The
#       2026-era Apache Kafka quickstart docs also use PKCS12. This
#       fixture's JKS choice is a 2017-era pattern that has propagated
#       through Helm chart templates and team conventions but is no
#       longer aligned with the upstream defaults.
#
#   (4) **`keytool` deprecation warning.** Since JDK 9, EVERY `keytool`
#       operation on a JKS file prints:
#         'Warning: The JKS keystore uses a proprietary format. It is
#          recommended to migrate to PKCS12 which is an industry
#          standard format using "keytool -importkeystore
#          -srcstoretype JKS -deststoretype PKCS12".'
#       The warning surfaces on every interactive keystore operation
#       and is the upstream signal that the JDK team itself
#       discourages new JKS usage.
#
#   (5) **FIPS 140-3 mode.** A FIPS-mode JDK (Red Hat's OpenJDK in
#       FIPS mode, BC-FIPS provider) rejects SHA-1 MAC keystores and
#       imposes algorithm restrictions on the JKS format itself. The
#       same JDK happily loads PKCS12 keystores produced with FIPS-
#       approved algorithms. A regulated-industry team (banking,
#       healthcare, government) cannot ship JKS in FIPS mode.
#
#   (6) **Multi-language fleets.** This payments platform has Java
#       services (Spring Boot), Python services (FastAPI for ML
#       scoring), Go services (the API gateway), and a .NET 8 mobile
#       backend. All of them need to talk to the same Kafka cluster
#       with mTLS. The Python `confluent-kafka` library, the Go
#       `franz-go` library, and the .NET `Confluent.Kafka` library
#       all use PKCS12 / PEM natively — only the Java side needs
#       JKS. Sharing a single PKI bundle across the fleet requires
#       PKCS12.
#
# The six bug shapes this rule catches
#   (1) **Legacy on-prem JDK-8 deployment.** A team set up clients
#       in 2017 with JKS as the JDK 8 default; the property has
#       propagated to every new service through copy-paste from the
#       original team-internal template. Removing `ssl.keystore.type`
#       lets the JDK 11+/17+ default of PKCS12 kick in.
#
#   (2) **Apache Kafka quickstart copy-paste.** The 2016-era SSL
#       quickstart used `keytool -keystore server.keystore.jks`
#       everywhere; teams copying from that doc set
#       `ssl.keystore.type=JKS` explicitly even when their actual
#       tooling produces PKCS12. Post-3.0 docs use PKCS12.
#
#   (3) **Older Confluent Platform tutorials.** Pre-7.x Confluent
#       Platform tutorials used JKS examples; 7.0+ (Q1 2022) docs
#       use PKCS12. Teams that learned Kafka in 2019-2021 from the
#       older docs still write JKS.
#
#   (4) **Strimzi `KafkaUser` client cert.** Strimzi 0.30+ produces
#       a PKCS12 Secret for the user's client cert; teams transcode
#       to JKS for legacy application compatibility — but the legacy
#       app is usually fine with PKCS12 too, the JKS transcode is
#       cargo-cult.
#
#   (5) **Spring Boot `application.yml` template.** Many Spring Boot
#       tutorials set `spring.kafka.properties.ssl.keystore.type=JKS`
#       because that was the default in Spring Boot 2.x with JDK 8.
#       Spring Boot 3.x on JDK 17+ defaults to PKCS12; the explicit
#       JKS value is overriding the better default.
#
#   (6) **FIPS 140-3 compliance project.** A bank or fed-related
#       deployment needs to run on a FIPS-enabled JDK; the legacy
#       JKS keystores load with warnings (SHA-1 MAC) or fail outright
#       (modern FIPS mode); migration to PKCS12 is a prerequisite.
#
# Why INFO (not WARNING / ERROR) by default
#   JKS works. The Kafka client opens the keystore, the mTLS handshake
#   completes, the cert is presented to the broker, the connection
#   authenticates. There is no runtime vulnerability and no compliance
#   automation-failure mode by default. The issues are entirely about
#   maintainability and modernization — every cert rotation requires
#   one extra step, every new tool integration has to deal with the
#   format mismatch, every FIPS-compliance project has to migrate.
#
#   INFO is the right level: it surfaces the legacy choice in code
#   review, lets the team triage it during a planned cert-rotation
#   refactor rather than blocking the build today.
#
#   This IT fixture's pom.xml overrides the severity to ERROR so that
#   `mvn verify` fails on this bad configuration, demonstrating the
#   rule fires correctly.
#
# Fix
#   Two steps:
#     1. Convert the keystore file on disk (one-time, do it on a
#        cert-rotation day so the old JKS is naturally retired):
#          keytool -importkeystore \
#              -srcstoretype JKS \
#              -srckeystore client.keystore.jks \
#              -srcstorepass "${KAFKA_KEYSTORE_PASSWORD}" \
#              -deststoretype PKCS12 \
#              -destkeystore client.keystore.p12 \
#              -deststorepass "${KAFKA_KEYSTORE_PASSWORD}"
#        (On JDK 8u301+ you can omit `-deststoretype PKCS12` — it is
#        now the default.)
#
#     2. Update this properties file: change `ssl.keystore.type=JKS`
#        to `ssl.keystore.type=PKCS12` (or, simpler, delete the line
#        entirely — JDK 9+ defaults to PKCS12). Update
#        `ssl.keystore.location` to point at the new `.p12` file.
#
#   For cert-manager / Vault / ACM-driven PKI pipelines, the BETTER
#   answer is to skip keystores entirely and use the PEM keystore
#   type introduced by KIP-651 (Apache Kafka 2.7, December 2020):
#       ssl.keystore.type=PEM
#       ssl.keystore.location=/etc/payments-settlement/tls.crt
#       ssl.keystore.key=/etc/payments-settlement/tls.key
#   This eliminates the keystore-format middle-man entirely — the
#   Kafka client reads the cert-manager-produced PEM files directly.
#
#   Also update `ssl.truststore.type` if it is set to JKS; the
#   truststore has no key material to worry about and is a purely
#   cosmetic format change.
# =============================================================================

# Cluster connectivity.
bootstrap.servers=kafka-payments.platform.internal:9094

# Security stack — mTLS.
security.protocol=SSL

# Keystore (client identity).
ssl.keystore.location=/etc/payments-settlement-batch/keystores/client.keystore.jks
ssl.keystore.password=${env:KAFKA_KEYSTORE_PASSWORD}
ssl.key.password=${env:KAFKA_KEY_PASSWORD}

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# THE BUG:
# `JKS` is the proprietary Java-only keystore format from 1998. The rest of
# this system (cert-manager, Vault, ACM) produces PKCS12 natively; every cert
# rotation costs one init-container conversion step. JDK 9+ default is PKCS12,
# Spring Boot 3.x default is PKCS12, the JDK itself prints a deprecation
# warning on every JKS operation. Fix: change to PKCS12 (or PEM for cert-
# manager-driven workflows) and skip the init-container.
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
ssl.keystore.type=JKS

# Truststore (broker CA bundle).
ssl.truststore.location=/etc/payments-settlement-batch/keystores/server.truststore.jks
ssl.truststore.password=${env:KAFKA_TRUSTSTORE_PASSWORD}
ssl.truststore.type=JKS

# Hostname verification.
ssl.endpoint.identification.algorithm=https

# Standard consumer knobs.
client.id=payments-settlement-batch-pod-0
group.id=payments-settlement-batch
auto.offset.reset=earliest
enable.auto.commit=false
isolation.level=read_committed
max.poll.records=500
max.poll.interval.ms=300000
session.timeout.ms=45000
heartbeat.interval.ms=3000

# Deserializers.
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer

# Connection / metadata.
metadata.recovery.strategy=rebootstrap
