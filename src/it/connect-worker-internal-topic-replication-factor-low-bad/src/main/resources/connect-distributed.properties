# =============================================================================
# A Kafka Connect WORKER configuration (`connect-distributed.properties`)
# with all three durability-critical internal-topic replication factors
# set to 1. The values originated from a single-broker dev cluster where
# RF=3 is physically impossible; the file was checked into git as the
# project's canonical `connect-distributed.properties` and the
# production deployment pipeline picks up the same file with no
# environment-specific override.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#
#   config.storage.replication.factor = 1
#   offset.storage.replication.factor = 1
#   status.storage.replication.factor = 1
#
# All three default to 3 in the worker's DistributedConfig ConfigDef.
# Sub-3 values are routinely set in single-broker dev clusters and leak
# to production via Helm-chart inheritance, GitOps repo promotion,
# environment-overlay misconfiguration, or direct copy-paste from a
# `connect-distributed.properties` file checked into the repo.
#
# WHY EACH OF THE THREE KEYS MATTERS:
#
# (a) `config.storage.replication.factor` (governs `connect-configs`):
#     stores every connector's submitted configuration. Worker reads
#     this topic on startup to rehydrate its in-memory connector
#     registry; every `POST /connectors` REST call writes the new
#     connector's config to this topic. Loss of this topic = every
#     connector's config is lost; operator must re-submit every config
#     from a backup or from the platform-engineering GitOps repo.
#
# (b) `offset.storage.replication.factor` (governs `connect-offsets`):
#     stores SOURCE connectors' offset checkpoints. For Debezium MySQL
#     that's binlog file + position; for JDBC source with
#     mode=incrementing that's the highest tracking-column value;
#     for custom sources, whatever `SourceTask#commit()` writes. Loss
#     of this topic = every source connector restarts from initial
#     position. Debezium re-emits the entire binlog history (terabytes);
#     JDBC sources re-query every row ever processed; custom sources
#     lose their checkpoint and re-emit everything. Downstream consumers
#     double-process every record — often unrecoverable because
#     downstream systems may have applied side effects to those
#     duplicates (charging payments twice, sending notifications twice,
#     incrementing counters twice).
#
# (c) `status.storage.replication.factor` (governs `connect-status`):
#     stores task-level and connector-level status (RUNNING, FAILED,
#     PAUSED, UNASSIGNED). Loss of this topic = the Connect REST API
#     cannot answer `GET /connectors/{name}/status` correctly; downstream
#     monitoring (Prometheus exporters, custom health-check loops) goes
#     dark; alerting flatlines. The connector itself may still be
#     functioning correctly — but the team has no visibility into it.
#
# THE BLAST RADIUS OF RF=1 DURING A BROKER RESTART:
#
# Steady state: zero impact. Connect runs fine while no broker is
# restarting. The misconfiguration is INVISIBLE until the first broker
# outage on the Connect-cluster's bootstrap cluster.
#
# Broker restart (routine maintenance window, RF=1 leader on the
# affected broker):
#
# (1) `connect-configs` leader unavailable: worker's
#     `KafkaConfigBackingStore` cannot read the topic; connector
#     reconfigure attempts fail; the worker cannot accept new
#     connector submissions. If the worker restarts during the broker
#     outage, it comes up with an EMPTY connector registry — every
#     connector is gone until the broker comes back AND the worker is
#     restarted again.
#
# (2) `connect-offsets` leader unavailable: source connectors' offset
#     commits fail; the worker's `KafkaOffsetBackingStore` retries
#     indefinitely; the source connector's task continues to emit
#     records but cannot persist its progress. If the worker restarts
#     during this window, the source connector resumes from its LAST
#     SUCCESSFULLY COMMITTED offset — which may be hours/days behind
#     the actual progress — re-emitting every record between then and
#     the restart. Downstream consumers see massive duplication.
#
# (3) `connect-status` leader unavailable: task/connector status updates
#     fail; the REST API's `GET /connectors/{name}/status` returns
#     stale data; monitoring dashboards flatline. The operator cannot
#     tell whether the connectors are healthy or whether the entire
#     cluster has melted down.
#
# WHY 3 IS THE PRODUCTION-RECOMMENDED VALUE:
#
# The worker's `DistributedConfig` ConfigDef defaults all three RFs
# to 3 because Kafka's documented best practice for any
# durability-critical topic is `min.insync.replicas=2` paired with
# `replication.factor=3` — a configuration that survives any single
# broker outage without data loss. RF=2 is INSUFFICIENT because
# `min.insync.replicas=2` + RF=2 + one broker outage = the topic is
# unwriteable (insufficient ISRs to acknowledge writes); the practical
# minimum is RF=3.
#
# HOW RF=1 ENDS UP IN PRODUCTION:
#
# (i) **Dev `connect-distributed.properties` shipped to prod.**
#     Engineer set up the dev Connect cluster against a single-broker
#     dev Kafka cluster; copied `config.storage.replication.factor=1`,
#     etc. from a Confluent quickstart tutorial; checked the file into
#     git as the project's canonical worker config; the production
#     deployment pipeline picks up the same file. (THIS FIXTURE)
#
# (ii) **Helm chart with RF=1 dev shortcut.** Org's Helm chart for
#      Kafka Connect deployments has `configStorageReplicationFactor:
#      1` and `offsetStorageReplicationFactor: 1` as defaults
#      ("override these in production"); no `values-prod.yaml` overlay
#      exists; multiple teams deploy without overriding.
#
# (iii) **Confluent Cloud → self-managed migration carrying CC
#       defaults.** Migration script strips RF keys from the source
#       config (assumes Connect's ConfigDef defaults are safe), but a
#       sibling script for dev adds RF=1 explicitly to support the
#       single-broker dev cluster; dev-to-prod GitOps promotion picks
#       up the dev config and propagates it to prod.
#
# (iv) **Cluster scale-out without RF raise.** Connect cluster was
#      originally deployed against a 1-broker dev cluster; cluster
#      was scaled to 5 brokers in production; operator assumed RF
#      would auto-scale (it does not — existing topic RF is preserved).
#
# (v) **Operator copy-paste from `connect-standalone` mode.** Standalone
#     mode does NOT use internal topics; operator migrating to
#     distributed mode for the first time copied parts of the standalone
#     config and added the bare minimum new keys including RF=1 (chosen
#     because it "matched the standalone single-instance pattern").
#
# THE FIX:
#
# (1) Set every internal-topic RF key to >= 3 in the worker's
#     connect-distributed.properties:
#
#     config.storage.replication.factor = 3
#     offset.storage.replication.factor = 3
#     status.storage.replication.factor = 3
#
# (2) NOTE: existing topics retain their original RF — fixing the config
#     is necessary but not sufficient. The operator must ALSO raise the
#     RF of existing topics via kafka-reassign-partitions.sh:
#
#       # Generate a reassignment plan that raises RF to 3:
#       kafka-reassign-partitions.sh --bootstrap-server <broker> \
#         --topics-to-move-json-file connect-internal-topics.json \
#         --broker-list "1,2,3" --generate
#
#       # Apply the plan (with --throttle to avoid impacting application
#       # traffic):
#       kafka-reassign-partitions.sh --bootstrap-server <broker> \
#         --reassignment-json-file plan.json --execute --throttle 50000000
#
# (3) For dev clusters with < 3 brokers (where RF=3 is physically
#     impossible), use a dev-only build profile or suppress the rule
#     explicitly in the dev profile's plugin config:
#
#       <CONNECT_WORKER_INTERNAL_TOPIC_REPLICATION_FACTOR_LOW>OFF
#       </CONNECT_WORKER_INTERNAL_TOPIC_REPLICATION_FACTOR_LOW>
#
#     and document that the suppression is dev-only (NEVER ship the
#     dev profile's plugin config to production).
#
# =============================================================================

# Connect-cluster identity
group.id=connect-cluster

# Bootstrap servers (the Kafka cluster hosting the internal topics)
bootstrap.servers=kafka-broker-1.example.internal:9092,kafka-broker-2.example.internal:9092,kafka-broker-3.example.internal:9092

# Internal-topic names (using the conventional defaults)
config.storage.topic=connect-configs
offset.storage.topic=connect-offsets
status.storage.topic=connect-status

# VIOLATION 1: config.storage.replication.factor = 1
# The `connect-configs` topic stores every connector's submitted config.
# Loss = every connector's config is lost on the next worker restart.
config.storage.replication.factor=1

# VIOLATION 2: offset.storage.replication.factor = 1
# The `connect-offsets` topic stores SOURCE connectors' offset
# checkpoints. Loss = every source connector restarts from initial
# position, re-emitting every record ever produced (catastrophic
# data duplication, often unrecoverable).
offset.storage.replication.factor=1

# VIOLATION 3: status.storage.replication.factor = 1
# The `connect-status` topic stores task/connector status. Loss = the
# REST API status endpoint returns stale data, blinding monitoring.
status.storage.replication.factor=1

# Partition counts (orthogonal to RF — not flagged by this rule)
config.storage.partitions=1
offset.storage.partitions=25
status.storage.partitions=5

# Converters (worker-level defaults, can be overridden per connector)
key.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=false
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false

# Plugin path
plugin.path=/usr/share/java/kafka-connect-plugins
