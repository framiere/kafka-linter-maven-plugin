# =============================================================================
# IT fixture: STREAMS_PROPERTIES_STATESTORE_CACHE_MAX_BYTES_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A Kafka Streams .properties file destined for
#   `new StreamsConfig(Properties)` inside a long-running JVM
#   process. The application is `transaction-analytics-streams` —
#   a moderately-complex production topology consuming from
#   `transactions-raw` (48 partitions, replication-factor=3),
#   joining against `merchant-profiles` (GlobalKTable) and
#   `customer-tiers` (GlobalKTable), running per-customer
#   windowed aggregations (1h tumbling), per-merchant windowed
#   aggregations (15min hopping), per-region rollups (1h
#   tumbling), and producing to FIVE different output topics:
#   - `customer-transaction-stats-1h` (per-customer 1h stats)
#   - `merchant-volume-15m` (per-merchant 15min volume)
#   - `region-rollups-1h` (per-region 1h rollups)
#   - `fraud-signals` (filtered + enriched)
#   - `enriched-transactions-stream` (raw + GlobalKTable joins)
#
#   The topology has SIX MATERIALIZED state-stores:
#     1. customer-tx-window-store (windowed KTable, 1h tumbling)
#     2. merchant-volume-window-store (windowed KTable, 15m hop)
#     3. region-rollup-window-store (windowed KTable, 1h tumbling)
#     4. fraud-detection-state-store (KeyValueStore, custom)
#     5. merchant-profiles (GlobalKTable, cached)
#     6. customer-tiers (GlobalKTable, cached)
#
#   AND runs on 8 StreamThreads per instance (`num.stream.
#   threads=8`), with 8 instances in the Kubernetes Deployment.
#
#   Deployment shape: 8-replica `Deployment` on EKS (us-east-1,
#   eks-1.30), backed by RocksDB state-stores on PVC-backed
#   `state.dir=/var/lib/streams/transaction-analytics`. Brokers
#   are Strimzi-managed Kafka 3.9.0 (October 2024), so KIP-770's
#   `statestore.cache.max.bytes` (Apache Kafka 3.4, February
#   2023) is AVAILABLE in this client/broker pairing.
#
# What's wrong
#   `statestore.cache.max.bytes` (KIP-770, Apache Kafka 3.4,
#   February 2023, renamed from `cache.max.bytes.buffering`) is
#   the TOTAL cache budget for the entire KafkaStreams instance,
#   SHARED across ALL state-stores AND ALL StreamThreads. The
#   cache is a write-behind buffer that COALESCES repeated puts
#   to the same key within a single commit interval — every
#   `put(key, value)` writes to the cache; if the same key is
#   updated N times in the interval, only the FINAL value is
#   flushed to (a) the underlying RocksDB store, (b) the
#   changelog topic, (c) any downstream operator subscribing to
#   the KTable.
#
#   Default: `10485760` (10 MiB) TOTAL, calibrated for SMALL
#   topologies (1-2 state-stores, 1-2 threads). For this
#   topology with 6 state-stores × 8 StreamThreads = 48
#   store-thread combos, the effective per-store-per-thread
#   budget is 10 MiB ÷ 48 = ~213 KiB.
#
# The eight bug shapes this rule catches
#   (1) Hot-key aggregation thrashes the cache. The per-customer
#       1h windowed aggregation tracks ~5,000 active customers
#       per window with ~400-byte stat-objects per key — 2 MiB
#       working set per StreamThread. Effective cache per-store-
#       per-thread is ~213 KiB; the cache holds only 1/10 of the
#       working set; updates evict each other; coalescing
#       absorbs maybe 30% of repeated updates (vs 95%+ if the
#       cache were sized to 5-10× the working set). The
#       `customer-tx-window-store` sees 5-10× the necessary
#       RocksDB write rate; RocksDB L0 stalls become frequent;
#       throughput drops 3-5× from theoretical.
#
#   (2) Merchant-volume hopping window — 4× retention overhead.
#       The 15-min hopping window with 5-min advance keeps
#       FOUR overlapping windows per merchant key in the state-
#       store at any time. Working set is 4× the per-window
#       state — for ~10,000 active merchants, that's 16 MiB per
#       StreamThread. Effective cache per-store-per-thread is
#       ~213 KiB; coalescing effectiveness drops to ~10%; the
#       `merchant-volume-window-store` sees 10× the necessary
#       write rate; changelog topic write rate jumps the same.
#
#   (3) Region-rollup high-velocity aggregation. The per-region
#       1h tumbling rollup has only ~50 keys (regions), but
#       receives ~100,000 updates/sec/StreamThread (one per
#       transaction). With effective cache per-store-per-thread
#       of ~213 KiB and 50 keys × 200 bytes = 10 KiB working
#       set, the cache SHOULD coalesce 99.99% of updates — but
#       the cache is shared with the other 5 state-stores, so
#       LRU eviction by other stores' cooler keys steals slots
#       from the hot 50 region keys. Coalescing effectiveness
#       drops to ~50%; the `region-rollup-window-store` sees 2×
#       the necessary write rate.
#
#   (4) Fraud-detection state-store — read-modify-write
#       amplification. The custom Processor implementing fraud
#       detection does `store.get(customerId)` →
#       `riskScore.update(tx)` → `store.put(customerId,
#       riskScore)`. For high-velocity customers, the update
#       rate per key is ~100/sec. With effective per-store-per-
#       thread cache of ~213 KiB and ~2,000 active customers ×
#       300 bytes = 600 KiB working set, the cache holds 1/3 of
#       the working set; the read-modify-write pattern compounds
#       cache misses — every get() reads from RocksDB instead of
#       cache, every put() flushes to RocksDB immediately
#       (because the cache evicted the entry between the get
#       and put). Compaction backlog grows.
#
#   (5) GlobalKTable cache wasted on rarely-changing data. The
#       `merchant-profiles` and `customer-tiers` GlobalKTables
#       are rarely-changing (updates once per day). They consume
#       cache slots but don't benefit from coalescing (no
#       repeated updates). Worse, every other StreamThread's
#       state-store competes with these globals for the same
#       10 MiB total budget. The globals would be better cached
#       at the RocksDB block-cache level (`rocksdb.config.
#       setter`-controlled), not in the Streams cache.
#
#   (6) Changelog topic write-rate flood. With coalescing
#       effectiveness at 30% across the topology, the changelog
#       topics see 3.3× the necessary write rate. The 6
#       state-stores' changelogs (each with 48 partitions to
#       match the source topic, replication-factor=3) absorb
#       3.3× more replication traffic, broker disk I/O, and
#       broker disk space. Over a month, the 30-day-retention
#       changelog topics consume 3.3× more disk on the brokers.
#
#   (7) Downstream consumer flood. Downstream consumers of the
#       5 output topics see 3.3× more 'intermediate update'
#       records than they would with proper coalescing. The
#       downstream analytics dashboard refreshes 3.3× more
#       frequently than necessary, the downstream alerting
#       service evaluates 3.3× more rules per second, and the
#       downstream BI system's daily aggregations take 3.3× more
#       time to compute.
#
#   (8) Migration hazard from pre-3.4 — silent throughput
#       regression. Operator upgrades Kafka client from 3.3.x
#       (pre-KIP-770) to 3.9.x and migrates the old `cache.max.
#       bytes.buffering=10485760` to `statestore.cache.max.
#       bytes=10485760`, thinking the rename is 1-to-1. Pre-3.4,
#       the value was PER-StreamThread (so on this 8-thread
#       instance the actual budget was 80 MiB). Post-3.4, the
#       value is TOTAL (so the budget is now just 10 MiB, an
#       8× reduction). Coalescing effectiveness silently drops
#       by 5-10×; throughput regresses post-upgrade; the
#       operator blames the new client and reverts.
#
# Why INFO and not WARNING
#   The default `10485760` is defensible for SMALL topologies
#   (1-2 stores, 1-2 threads — hello-world tutorials, minimal
#   POCs, single-job demos). The linter cannot infer the
#   topology's state-store count or thread count from
#   .properties alone. The rule is a 'have you sized your cache
#   vs your topology's state-store and thread count?' nudge,
#   not a deployment-blocker. For trivial topologies, leaving
#   the default is the right answer; for production-scale
#   topologies, leaving the default is silently wrong.
#
#   This IT fixture's pom.xml overrides the severity to ERROR
#   so that `mvn verify` fails on this bad configuration,
#   demonstrating the rule fires correctly.
#
# Fix
#   For trivial topologies (1-2 stores, 1-2 threads):
#     statestore.cache.max.bytes=10485760
#   (10 MiB explicit — documents the deliberate choice;
#   insulates from future framework default changes.)
#
#   For medium topologies (4-8 stores, 4-8 threads — like this
#   fixture):
#     statestore.cache.max.bytes=134217728
#   (128 MiB — provides ~2-4 MiB per store-per-thread.)
#
#   For large topologies (16+ stores, 16+ threads):
#     statestore.cache.max.bytes=1073741824
#   (1 GiB — provides ~4 MiB per store-per-thread.)
#
#   For memory-constrained instances, size as a percentage of
#   the JVM heap (typical 5-15% of -Xmx); inject via Helm
#   template or Spring Boot @Value.
#
#   For migration from pre-3.4 `cache.max.bytes.buffering`:
#   multiply the old value by num.stream.threads to preserve
#   the same per-thread budget. Example: pre-3.4 value
#   10485760 on 8 threads → post-3.4 `statestore.cache.max.
#   bytes=83886080` (80 MiB).
# =============================================================================

# Application identity — the streams-shape gate.
application.id=transaction-analytics-streams
client.id=transaction-analytics-streams-0

# Cluster connectivity.
bootstrap.servers=kafka-bootstrap.kafka.svc.cluster.local:9092

# Default Serdes.
default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
default.value.serde=org.apache.kafka.common.serialization.Serdes$StringSerde

# Exactly-once-v2 (EOS-v2) for transactional aggregation guarantees.
processing.guarantee=exactly_once_v2

# Standby replicas + KIP-441 warm-standby promotion.
num.standby.replicas=2
acceptable.recovery.lag=10000
probing.rebalance.interval.ms=600000
max.warmup.replicas=2

# Rack-aware standby placement across the 3 EKS AZs.
rack.aware.assignment.tags=zone

# State-store persistence.
state.dir=/var/lib/streams/transaction-analytics

# Group-membership + heartbeating tuned for K8s pod lifecycle.
session.timeout.ms=45000
heartbeat.interval.ms=3000
max.poll.interval.ms=300000

# Exception handlers — all three sides set explicitly.
default.deserialization.exception.handler=org.apache.kafka.streams.errors.LogAndContinueExceptionHandler
default.production.exception.handler=org.apache.kafka.streams.errors.DefaultProductionExceptionHandler
processing.exception.handler=org.apache.kafka.streams.errors.LogAndContinueProcessingExceptionHandler

# Timestamp extractor — explicit fail-on-invalid.
default.timestamp.extractor=org.apache.kafka.streams.processor.FailOnInvalidTimestamp

# Topology optimization.
topology.optimization=all

# Commit interval (EOS-v2 default 100 ms is fine; set explicitly).
commit.interval.ms=100

# 8 StreamThreads per instance — multiplies the cache-budget shortfall.
num.stream.threads=8

# Metadata recovery strategy — K8s-aware.
metadata.recovery.strategy=rebootstrap

# Task idle ms for stream-stream join time-alignment.
max.task.idle.ms=200

# Task timeout.
task.timeout.ms=300000

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# MISSING:
#   statestore.cache.max.bytes=134217728
# Without this key, Apache Kafka 3.4+ defaults
# `statestore.cache.max.bytes` to `10485760` (10 MiB) TOTAL for the
# entire instance, SHARED across ALL state-stores AND ALL StreamThreads.
# For this topology with 6 state-stores × 8 StreamThreads = 48
# store-thread combos, the effective per-store-per-thread budget is
# 10 MiB ÷ 48 = ~213 KiB. The hot-key working sets (5k customers ×
# 400 bytes = 2 MiB for 1h-windowed customer aggregations, 10k
# merchants × 4 overlapping windows × 400 bytes = 16 MiB for 15m
# hopping merchant aggregations) are ORDERS OF MAGNITUDE larger than
# the per-store-per-thread cache slice. The cache evicts entries
# faster than it can coalesce; coalescing effectiveness drops from
# typical 80-99% to 10-30%; RocksDB write-amp jumps 3-10×; the
# changelog topics see 3-10× the necessary write rate; downstream
# consumers see 3-10× the redundant intermediate updates that should
# have been coalesced. Setting `statestore.cache.max.bytes=134217728`
# (128 MiB) provides ~2-4 MiB per store-per-thread, restoring 95%+
# coalescing effectiveness and cutting RocksDB write-amp, changelog
# write rate, and downstream flood to baseline.
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
