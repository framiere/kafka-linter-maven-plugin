# =============================================================================
# Confluent JDBC source connector for the `customers` table on the customers
# Postgres database.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#   validate.non.null = false   (with mode = timestamp)
#
# WHY THIS IS A SILENT-DATA-LOSS BUG:
#
# The Confluent JDBC source connector's `incrementing` and `timestamp` modes
# track row state via a designated column whose value monotonically increases
# as the connector progresses. On every poll the connector issues SQL shaped
# roughly:
#
#   SELECT * FROM <table>
#    WHERE <tracking-column> > <last-seen-value>
#    ORDER BY <tracking-column> ASC
#    LIMIT <fetch.size>
#
# (with the bound parameter set from the connector's offset store).
#
# This WHERE clause is the load-bearing piece. SQL three-valued logic
# treats `NULL > X` as `NULL` (NOT `TRUE`). So any row where the tracking
# column is NULL is SILENTLY FILTERED OUT by the WHERE clause: those rows
# are NEVER selected, NEVER emitted to Kafka, and there is no error, no
# warning, no DLQ entry, no metric. The downstream pipeline simply
# under-counts rows.
#
# To protect operators from this, the Confluent connector defaults
# `validate.non.null=true`. At startup the connector queries
# INFORMATION_SCHEMA.COLUMNS for the tracking column; if it allows NULL,
# the connector REFUSES TO START with:
#
#   ConfigException: Cannot find non-optional fields: [updated_at];
#     set 'validate.non.null=false' to ignore this requirement
#
# The error message itself suggests the workaround that causes silent
# data loss. Operators who follow the suggestion (set
# `validate.non.null=false` and restart) see the connector come up,
# records flow into Kafka, and assume they fixed the problem. In
# reality every row with `updated_at IS NULL` is now invisible to
# the connector — and will REMAIN invisible even after a full
# bulk-mode re-snapshot, because the bulk-mode poll uses the same
# WHERE clause.
#
# CONSEQUENCES:
#
#   - Downstream pipeline under-counts rows.
#   - Analytics dashboards diverge from `SELECT COUNT(*) FROM customers`.
#   - Regulatory reporting (PCI-DSS row reconciliation, GDPR data-subject
#     accounting, SOX financial-row counts) understates totals — a
#     compliance violation that can persist for years before being
#     surfaced in a reconciliation audit.
#   - Schema-migration cleanup that ADDS a new nullable tracking column
#     silently excludes every row from before the migration (they all
#     have NULL in the new column).
#
# FIX (in order of preference):
#
#   (a) Backfill NULLs in the source table and add NOT NULL:
#         UPDATE customers SET updated_at = created_at WHERE updated_at IS NULL;
#         ALTER TABLE customers ALTER COLUMN updated_at SET NOT NULL;
#       Then remove `validate.non.null=false` (or set it to true).
#
#   (b) Choose a tracking column that is already NOT NULL — typically
#       the table's auto-increment surrogate key:
#         mode=incrementing
#         incrementing.column.name=id
#       (then remove validate.non.null=false).
#
#   (c) Keep `validate.non.null=true` and accept the loud-failure mode
#       at startup until the source table is fixed (preferred during
#       investigation — at least the connector tells you what's wrong).
#
#   (d) Explicitly document the accepted data-loss surface (rarely
#       appropriate in production CDC pipelines).
# =============================================================================

name=jdbc-source-customers
connector.class=io.confluent.connect.jdbc.JdbcSourceConnector
tasks.max=1

connection.url=jdbc:postgresql://customers-db.internal:5432/customers
connection.user=connect
connection.password=changeme

mode=timestamp
timestamp.column.name=updated_at
poll.interval.ms=10000
table.whitelist=public.customers
topic.prefix=db.customers.

# VIOLATION: disables the connector's startup NOT-NULL check on the
# tracking column. The connector will start even if `updated_at` allows
# NULL on the source table — and then SILENTLY drop every NULL-updated_at
# row from the emitted stream forever.
validate.non.null=false

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
