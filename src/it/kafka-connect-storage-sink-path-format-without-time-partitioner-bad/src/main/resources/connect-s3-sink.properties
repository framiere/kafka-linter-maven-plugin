name=orders-s3-sink
connector.class=io.confluent.connect.s3.S3SinkConnector
tasks.max=2

topics=orders.events

s3.bucket.name=orders-data-lake
s3.region=us-east-1
storage.class=io.confluent.connect.s3.storage.S3Storage
format.class=io.confluent.connect.s3.format.parquet.ParquetFormat

flush.size=1000
rotate.interval.ms=600000

# Anti-pattern: path.format with time tokens is set, BUT partitioner.class is
# left as the default DefaultPartitioner (operator removed the explicit
# TimeBasedPartitioner line when "tuning" the config, not realizing the
# default IS DefaultPartitioner — non-time-based). Result: path.format is
# dead config (DefaultPartitioner never reads PATH_FORMAT_CONFIG), files
# land at s3://orders-data-lake/orders.events/partition=<N>/ paths, and the
# downstream Athena external table partitioned by year/month/day/hour finds
# zero data. There is no startup warning, no config-validation error — the
# misconfiguration is entirely silent.
path.format='year'=YYYY/'month'=MM/'day'=dd/'hour'=HH
locale=en-US
timezone=UTC

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
