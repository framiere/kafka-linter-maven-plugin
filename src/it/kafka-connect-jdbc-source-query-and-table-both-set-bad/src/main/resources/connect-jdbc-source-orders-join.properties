# =============================================================================
# Confluent JDBC source connector intended to emit an order+customer JOIN
# from the Postgres OLTP database to a single `db.orders_enriched` Kafka topic.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#   query = SELECT ...     AND
#   table.whitelist = orders
#   schema.pattern  = public
#
# WHY THIS IS A CONNECTOR-WONT-START BUG:
#
# The Confluent JDBC source connector supports TWO mutually-exclusive ways
# to specify what to poll from the source database:
#
#   (A) TABLE MODE (the default when `query` is absent)
#       The connector discovers tables via JDBC metadata
#       (DatabaseMetaData#getTables), filtered by:
#         - table.whitelist=<csv>     — only these tables
#         - table.blacklist=<csv>     — all tables EXCEPT these
#         - catalog.pattern=<like>    — which catalog/database
#         - schema.pattern=<like>     — which schema (e.g. `public`)
#       For each discovered table, the connector builds a polling query
#       `SELECT * FROM <table> WHERE <tracking-col> > ?` and emits the
#       rows to a per-table topic `<topic.prefix><table-name>`.
#
#   (B) QUERY MODE (used when `query=<SQL>` is set)
#       The connector bypasses table discovery. The operator provides ONE
#       custom SQL SELECT (typically a JOIN, aggregate, or filtered
#       projection that no single table can produce) and the connector
#       wraps it: `SELECT * FROM (<your-query>) WHERE <tracking-col> > ?`.
#       All rows go to a SINGLE topic (named by `topic.prefix` alone —
#       there is no per-table suffix). The table-mode configs (whitelist,
#       blacklist, catalog.pattern, schema.pattern) are MEANINGLESS in
#       query mode — there are no tables being iterated.
#
# The Confluent connector enforces the mutual exclusion with a hard
# cross-key validator in `JdbcSourceConnectorConfig#validateMultiConfigs`.
# Setting BOTH `query` AND ANY of {table.whitelist, table.blacklist,
# catalog.pattern, schema.pattern} causes the validate() endpoint to
# return:
#
#   ConfigException: Cannot specify both 'query' and 'table.whitelist'/
#     'table.blacklist'/'catalog.pattern'/'schema.pattern' in the same
#     connector configuration
#
# The connector REFUSES TO START. The Connect REST API surfaces the error
# in the validate-response error array (this is one of the FEW JDBC source
# cross-key checks that DOES fail at validate-time rather than at task
# start-time — most fail later in task start()).
#
# CONSEQUENCES:
#
#   - The Connect REST API returns a 400 Bad Request on the connector
#     POST/PUT — or, if the REST endpoint surfaces 201-with-errors-array
#     instead of 400, the operator may believe the deploy succeeded and
#     not check the per-task status until much later.
#   - The deploy pipeline rolls back if it checks the REST response.
#   - If the pipeline does NOT check the validate-response error array
#     (a common CI/CD oversight), the connector is registered but never
#     reaches RUNNING state — analogous to the silent-no-data symptoms
#     of [[connect-jdbc-sink-upsert-or-update-without-pk]].
#   - The team spends time debugging WHICH key to remove (the error
#     message names all four conflicting keys without saying which is
#     the redundant one for THIS config).
#
# COMMON ORIGINS:
#
#   1. Migration from table mode to query mode (or vice versa) leaves
#      the old config keys in place.
#   2. Copy-paste from two different tutorials — one demonstrating table
#      mode, one demonstrating query mode.
#   3. Helm chart with `tableWhitelist` as a sensible-default and `query`
#      as an OPTIONAL override; operator sets BOTH in their values file.
#   4. `schema.pattern=public` set 'just to be safe' in the original
#      table-mode config and forgotten about when query mode is added.
#
# FIX:
#
#   The operator MUST choose one mode and delete the other's keys.
#
#   To keep the custom JOIN (query mode), remove the table-mode keys:
#     query = SELECT o.id, o.created_at, o.amount, c.email \
#             FROM orders o JOIN customers c ON c.id = o.customer_id
#     # (delete: table.whitelist, schema.pattern, catalog.pattern,
#     #  table.blacklist)
#
#   To keep table mode (one topic per table), remove `query`:
#     table.whitelist = orders
#     schema.pattern  = public
#     # (delete: query)
# =============================================================================

name=orders-enriched-source
connector.class=io.confluent.connect.jdbc.JdbcSourceConnector
tasks.max=1

connection.url=jdbc:postgresql://oltp-db.internal:5432/shop
connection.user=connect
connection.password=changeme

mode=incrementing
incrementing.column.name=id
topic.prefix=db.

# VIOLATION: `query` is set (custom JOIN that aggregates orders + customers
# into a single denormalized row) AND BOTH `table.whitelist` and
# `schema.pattern` are also set (left over from the original table-mode
# config). The connector's validate() throws ConfigException; the connector
# refuses to start.
query=SELECT o.id, o.created_at, o.amount, c.email FROM orders o JOIN customers c ON c.id = o.customer_id
table.whitelist=orders
schema.pattern=public

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
