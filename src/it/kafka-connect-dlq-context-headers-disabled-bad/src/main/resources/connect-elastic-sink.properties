name=elastic-sink-events
connector.class=io.confluent.connect.elasticsearch.ElasticsearchSinkConnector
tasks.max=4

topics=app-events,billing-events,audit-events

connection.url=https://elasticsearch.internal:9200
connection.username=connect
connection.password=secret
type.name=_doc
key.ignore=true
schema.ignore=true
behavior.on.null.values=delete
write.method=upsert

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false

# Anti-pattern: DLQ is configured (errors.tolerance=all + DLQ topic) but the
# context.headers.enable knob is left at its default (false). Records that
# fail to index into Elasticsearch will end up in elastic-sink.dlq with ONLY
# their original key+value bytes — no source topic name, no partition, no
# offset, no Elasticsearch exception class, no exception message, no
# connector name. When the on-call engineer opens the DLQ to triage the
# 50,000 records that accumulated over the weekend, they see raw JSON
# payloads with no indication of WHY each record failed (e.g., was it
# a 'mapper_parsing_exception' for a malformed field type, or a
# 'circuit_breaking_exception' from an overloaded cluster?). The DLQ
# is undebuggable.
errors.tolerance=all
errors.deadletterqueue.topic.name=elastic-sink.dlq
errors.deadletterqueue.topic.replication.factor=3
# missing: errors.deadletterqueue.context.headers.enable=true
