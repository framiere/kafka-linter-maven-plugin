# =============================================================================
# IT fixture: STREAMS_PROPERTIES_MAX_TASK_IDLE_MS_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A Kafka Streams .properties file destined for `new StreamsConfig(props)`.
#   It declares application.id, bootstrap.servers, default serdes, processing
#   guarantee, replication factor, num.standby.replicas, num.stream.threads,
#   commit interval, state dir, both exception handlers, AND
#   topology.optimization=all — a complete production-quality Streams config
#   for a STREAM-STREAM JOIN topology (clicks JOIN impressions over a 5-minute
#   window) — EXCEPT `max.task.idle.ms` is not set anywhere.
#
# What's wrong
#   `org.apache.kafka.streams.StreamsConfig.MAX_TASK_IDLE_MS_CONFIG` declares
#   `max.task.idle.ms` with:
#
#     ConfigDef.Type.LONG, default = 0, importance = MEDIUM
#
#   KIP-695 (Apache Kafka 3.0, September 2021) redefined the semantics:
#
#     value 0  → task NEVER idles waiting for slow input partitions.
#                Processes whichever input partition has data, in wall-clock-
#                arrival order. Wall-clock ordering, not event-time ordering.
#
#     value N  → task waits UP TO N milliseconds for slow input partitions
#                to deliver records before processing whatever IS available.
#                Wall-clock-bounded wait, event-time-preferred ordering.
#
#     value -1 → task waits INDEFINITELY for slow input partitions before
#                processing anything. Correctness over progress — typically
#                a bad choice in production because a stuck partition stalls
#                the entire task.
#
#   For TOPOLOGIES WITHOUT multi-input operators (filter-map-to chains, single-
#   source aggregations), `0` is fine — each task has one input partition slice,
#   no cross-input ordering decision to make.
#
#   For TOPOLOGIES WITH JOINS or MERGES (this fixture's clicks JOIN impressions
#   pattern), `0` causes SILENT MISSED JOINS:
#
#     1. A task with TWO input partitions (one per join side) receives records
#        from both sides into per-partition buffers.
#     2. When one side's records arrive 10-100 ms slower than the other side
#        (network jitter, producer batching, partition rebalance, restore-
#        from-changelog), the task with `max.task.idle.ms=0` processes the
#        FAST side records IMMEDIATELY in wall-clock order, even though the
#        slow side hasn't delivered the matching records yet.
#     3. The join window moves past the fast-side record's timestamp.
#        Matching slow-side records arriving 50 ms later have no fast-side
#        record left in the join state-store to match against.
#     4. NO JOIN OUTPUT is emitted for the matched pair. The bug is silent:
#        no exception, no metric increment beyond `task-idle-ratio`, no log
#        line.
#
#   For THIS fixture's stream-stream join topology (clicks JOIN impressions),
#   the join hit rate visibly drops during producer-side jitter — for example,
#   during the impressions producer's deploy roll-out (8-second pause), the
#   clicks task processes clicks at full speed but the impressions side has
#   nothing buffered. Clicks that SHOULD have matched late-arriving impressions
#   get emitted with no join output.
#
# Why this is "INFO" by default (not WARNING or ERROR)
#   (a) The failure mode is silent missed-join data — not crash, not data
#       corruption, just incomplete join output. Streams works correctly
#       under `max.task.idle.ms=0` for non-join topologies.
#
#   (b) The right value depends on workload characteristics that the linter
#       can't infer from .properties alone:
#         - Pure-filter / pure-map / single-source-per-task topologies: 0
#           is correct.
#         - Stream-stream / stream-table joins: 100-500 ms is the typical
#           production choice.
#         - Foreign-key joins that must survive partition restore windows:
#           30000 (30 s) is used.
#
#   (c) Pre-KIP-695 (Apache Kafka <3.0) `max.task.idle.ms` had different
#       semantics. Operators on older versions who set `=0` thinking it
#       meant 'use the default reasonable behavior' are now on the worst
#       possible setting for join correctness. The plugin's nudge is to
#       make the operator MAKE A DELIBERATE CHOICE.
#
#   INFO severity is the right level: surfaces the missing knob without
#   flagging Streams apps as broken; operators raise to WARNING or ERROR
#   for the templates they own.
#
#   This IT overrides severity to ERROR via pom.xml configuration to force
#   the build to fail and verify the rule fires.
#
# Common bug shapes
#   (1) Order-enrichment KStream-KTable join — stale enrichment data.
#       Topology: `orders.join(customers, joiner)` where customers is a
#       KTable from a low-frequency change-log topic. With `max.task.idle.
#       ms=0`, orders process the moment they arrive — but the local
#       customers KTable state may not yet reflect the latest customer
#       record that arrived 30 ms ago on the brokers. The join silently
#       uses STALE customer state. Downstream sees occasional enriched
#       orders with outdated customer data. Investigation takes weeks
#       because the bug is intermittent and the data is wrong-but-
#       plausible. Setting `max.task.idle.ms=200` eliminates the stale-
#       state class of bug.
#
#   (2) Stream-stream window join under producer back-pressure.
#       Topology: `clicks.join(impressions, joiner, JoinWindows.of(5 min))`
#       — this fixture's pattern. Both sources produce ~10k records/sec.
#       During an impressions back-end deploy roll-out, the impressions
#       producer pauses for 8 seconds. The clicks task processes clicks
#       at full speed (`max.task.idle.ms=0`); impressions side has no
#       records buffered. Clicks that SHOULD have matched late-arriving
#       impressions are emitted with no join output. Downstream metric:
#       'join hit rate dropped from 95% to 87% during the deployment'.
#       Setting `max.task.idle.ms=2000` (2 s) absorbs the back-pressure
#       window.
#
#   (3) Foreign-key join under partition rebalance.
#       Topology: `leftTable.join(rightTable, foreignKeyExtractor, joiner)`.
#       During a rebalance (Streams instance restart, scale-up, scale-
#       down), the right-side state-store is being restored from changelog;
#       for ~30 seconds, the right side has no data buffered. With `max.
#       task.idle.ms=0`, the left-side task processes left-side updates
#       immediately; the foreign-key-join produces NULL output for left-
#       side records whose right-side match exists but hasn't been
#       restored yet. Operators see 'fk-join output dropped to zero for
#       30 s on every rolling deploy'. Setting `max.task.idle.ms=30000`
#       (30 s) absorbs the worst-case restore window.
#
#   (4) Heterogeneous-rate merge — broken event-time ordering.
#       Topology: `streamA.merge(streamB)` where streamA is 10k/sec and
#       streamB is 10/sec. With `max.task.idle.ms=0`, the merged stream
#       is dominated by streamA in wall-clock arrival order — events
#       from streamB are interleaved at their actual arrival time, but
#       a downstream consumer that expects event-time ordering sees
#       streamB events arrive AFTER streamA events with the same
#       timestamp. Setting `max.task.idle.ms=500` partially restores
#       event-time ordering.
#
#   (5) Spring Boot Streams autoconfig — org-wide silent join misses.
#       Spring Boot's Streams autoconfiguration (`spring-kafka`) provides
#       a `KafkaStreamsConfiguration` bean from `application.yml` /
#       `application.properties`. The default Spring template DOES NOT
#       include `max.task.idle.ms`. Every Spring Boot Streams app with
#       joins inherits the default `0`. Across an org with 30+ join-
#       containing Streams apps, the cumulative silent-join-miss rate is
#       significant — but rarely traced back to this knob.
#
#   (6) Pre-KIP-695 vs post-KIP-695 semantics — invisible regression.
#       Prior to Apache Kafka 3.0, `max.task.idle.ms` had different
#       semantics (default 0 ms but the algorithm waited indefinitely
#       for slow partitions in some cases). KIP-695 clarified the
#       semantics: `0` means NEVER WAIT; `-1` means WAIT INDEFINITELY;
#       positive values mean WAIT UP TO N MILLISECONDS. Operators on
#       older Streams versions who set `max.task.idle.ms=0` thinking it
#       meant 'use the default reasonable behavior' — under the new
#       semantics, that's the worst possible choice for join topologies.
#       The Streams version upgrade is the trigger; the bug appears
#       weeks after the upgrade in production join hit-rate metrics.
#
# Fix
#   ONE LINE. Production default for topologies WITH joins or merges:
#     max.task.idle.ms=200            # 200 ms wait for slow input
#                                     # partitions before processing
#                                     # available records. Robust against
#                                     # producer-side jitter, partition
#                                     # rebalance jitter, network jitter.
#                                     # Bounded latency cost.
#
#   For foreign-key joins (must survive partition restore windows):
#     max.task.idle.ms=30000          # 30 s wait — absorbs worst-case
#                                     # changelog-restore window during
#                                     # rolling deploys and rebalances.
#
#   For topologies WITHOUT joins or merges (explicit choice):
#     max.task.idle.ms=0              # Explicitly opt out of idling.
#                                     # Documents the deliberate choice;
#                                     # insulates the app from future
#                                     # Streams version changes that
#                                     # might shift the default.
#
# Sibling rule
#   `STREAMS_MAX_TASK_IDLE_MS_HIGH` catches the bytecode-detected explicit
#   very-high `=N` value in code-side `Properties.put` calls (blocking task
#   progress under healthy traffic); this rule catches the .properties-file
#   ABSENT case where the operator never set the knob at all.
# =============================================================================

application.id=clicks-impressions-join-stream
bootstrap.servers=broker-1.kafka.prod.example.com:9092,broker-2.kafka.prod.example.com:9092,broker-3.kafka.prod.example.com:9092

# Default serdes used by topology operators that don't pass explicit
# Consumed/Produced/Materialized/Grouped/Joined.
default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
default.value.serde=io.confluent.kafka.streams.serdes.avro.SpecificAvroSerde

# Internal-topic durability (replication factor for changelog + repartition topics).
replication.factor=3
min.insync.replicas=2

# Throughput & latency.
num.stream.threads=8
commit.interval.ms=5000

# HA for stateful tasks — 1 warm copy of every state-store partition.
num.standby.replicas=1

# At-least-once with explicit commit cadence.
processing.guarantee=at_least_once

# State-store location (outside /tmp; survives container restarts when mounted as a volume).
state.dir=/var/lib/kafka-streams/clicks-impressions-join

# Internal-topic-layout consolidation (KIP-295 / KIP-862).
topology.optimization=all

# Exception handlers — both set, so the existing handler-absent rules don't fire.
default.deserialization.exception.handler=org.apache.kafka.streams.errors.LogAndContinueExceptionHandler
default.production.exception.handler=org.apache.kafka.streams.errors.LogAndContinueProductionExceptionHandler

# Schema registry (Confluent Avro deserializer dependency).
schema.registry.url=http://schema-registry.kafka.prod.example.com:8081

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# MISSING:
#   max.task.idle.ms=...
# Without this key, Kafka Streams defaults `max.task.idle.ms` to `0` (declared
# in StreamsConfig.MAX_TASK_IDLE_MS_CONFIG with ConfigDef.Type.LONG, default
# 0). Per KIP-695 (Apache Kafka 3.0, September 2021), `0` means the task
# NEVER idles waiting for slow input partitions — processes whichever input
# partition has data in wall-clock-arrival order. For THIS topology's stream-
# stream JOIN pattern (clicks JOIN impressions over a 5-minute window),
# `=0` causes SILENT MISSED JOINS under producer-side jitter, partition
# rebalances, or back-pressure scenarios: the task processes the fast side
# before the slow side delivers matching records; the join window moves past
# unmatched records; no join output emitted for records that SHOULD have
# matched. The recommended production value for join-containing topologies
# is `max.task.idle.ms=200` — bounded latency cost, dramatic improvement in
# join completeness. For foreign-key joins, `30000` (30 s) is used to
# absorb partition-restore windows during rebalances.
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
