# =============================================================================
# IT fixture: CONSUMER_PROPERTIES_CLIENT_ID_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A kafka-clients consumer .properties file destined for
#   `new KafkaConsumer<>(props)`. It declares deserializers, bootstrap.servers,
#   group.id, auto.offset.reset, enable.auto.commit, isolation.level, poll-loop
#   tuning (max.poll.records, max.poll.interval.ms, session.timeout.ms,
#   fetch.min.bytes) — a complete production-quality consumer config —
#   EXCEPT `client.id` is not set anywhere.
#
# What's wrong
#   `org.apache.kafka.clients.consumer.ConsumerConfig.CLIENT_ID_CONFIG`
#   declares `client.id` with `ConfigDef.Type.STRING`, default `""` (the empty
#   string), importance MEDIUM. The kafka-clients parse step ACCEPTS the empty
#   value; `new KafkaConsumer<>(props)` succeeds without error.
#
#   Then, inside the KafkaConsumer constructor, kafka-clients sees that
#   `client.id` is empty and auto-generates:
#
#     "consumer-" + groupId + "-" + CONSUMER_CLIENT_ID_SEQUENCE.getAndIncrement()
#
#   when group.id is set (the standard consumer-group case), or just
#   "consumer-" + N when group.id is absent (for assign()-based consumers).
#   The AtomicInteger `CONSUMER_CLIENT_ID_SEQUENCE` is per-JVM and RESETS on
#   every restart.
#
#   So the first KafkaConsumer in this JVM with `group.id=payments-events`
#   becomes `consumer-payments-events-1`, the second is
#   `consumer-payments-events-2`, etc. Two replicas of the same Deployment
#   both run their own JVMs, both create their first consumer with the same
#   group, both auto-generate `consumer-payments-events-1` — broker-side-
#   indistinguishable.
#
#   The auto-gen value is THEN used downstream:
#     - Every FetchRequest, Heartbeat, OffsetCommit, JoinGroup, OffsetFetch
#       sent to the broker carries it in the request header's `client_id`.
#     - `kafka-consumer-groups --describe <group>` displays a CLIENT-ID
#       column — every row reads `consumer-<group>-N` from various pod IPs,
#       no way to map a row to a specific deployment / version / role.
#     - Broker-side per-client-id quotas (KIP-13 consumer-byte-rate quota):
#         kafka-configs --alter \
#           --add-config 'consumer_byte_rate=10485760' \
#           --entity-type clients --entity-name <client-id>
#       The quota applies to ALL consumer instances sharing the auto-gen
#       prefix (i.e., the whole group) — there is no way to target ONE
#       instance.
#     - JMX metric labels: `kafka.consumer:type=consumer-fetch-manager-
#       metrics,client-id=consumer-<group>-N` — dashboards built on this
#       label are unstable across restarts because bean init order varies
#       across builds.
#     - `__consumer_offsets`-keyed audit (when `log.request.principal=true`
#       is on): commits are attributed to `consumer-<group>-N`, anonymous
#       and unstable.
#
# Why this is "INFO" by default (not WARNING or ERROR)
#   (a) The framework does NOT fail — the consumer runs fine with the auto-gen
#       client.id. The cost is purely observability: broker-side metrics, log
#       attribution, KIP-13 quotas, and `kafka-consumer-groups --describe`
#       output are all useless without a stable handle.
#
#   (b) Some frameworks inject client.id PROGRAMMATICALLY:
#       - Spring Kafka uses `spring.kafka.consumer.client-id`.
#       - Quarkus Kafka extension exposes `quarkus.kafka.consumer.client-id`.
#       - Micrometer-Kafka integrations may template a meaningful value.
#       When in play, the underlying .properties may LEGITIMATELY omit client.id.
#
#   (c) Single-replica deployments may not need broker-side per-instance
#       disambiguation; group-level identification via group.id may suffice
#       for that operator's observability needs.
#
#   For these reasons, the rule's default severity is INFO — a documentation
#   nudge prompting the operator to make the choice deliberately.
#
#   This IT overrides severity to ERROR via pom.xml configuration to force the
#   build to fail and verify the rule fires.
#
# Common bug shapes
#   (1) `kafka-consumer-groups --describe` shows opaque rows.
#       Incident: consumer group has 30s lag. SRE runs
#         kafka-consumer-groups --describe --group payments-events
#       Output shows 8 rows, every CLIENT-ID is `consumer-payments-events-1`
#       through `-8`, HOST column shows 8 different pod IPs. No way to map
#       any row to a specific application deployment or version. SRE has to
#       go pod-by-pod via Kubernetes and grep for which one is the slow
#       consumer. Setting explicit client.id (e.g., `payments-fraud-consumer`)
#       would have made the row immediately identifiable.
#
#   (2) Per-client-id consumer quota cannot be targeted.
#       Broker bandwidth budget is exhausted by one consumer reading the full
#       backlog of a large topic. SRE wants to throttle that ONE consumer via
#       KIP-13 quota, but the client.id is `consumer-replay-group-1` — the
#       quota applies to all 4 consumer instances in the replay group,
#       including the 3 that are not the offender. Static-analysis catch at
#       PR time would have flagged the absent key, prompting the team to set
#       per-instance client.id (templated with pod-ordinal).
#
#   (3) Audit log for offset commits is anonymous.
#       SOX-audited financial service requires that every offset commit be
#       traceable to a specific application. Broker has `log.request.
#       principal=true`. `__consumer_offsets` shows commits keyed by
#       `client.id=consumer-orders-group-1` — anonymous and unstable. Auditor
#       flags 'inability to attribute consumption' as a finding. Recovery:
#       set explicit client.id per service, redeploy, re-attest.
#
#   (4) JMX dashboard regression after re-deploy.
#       Grafana dashboards for `kafka.consumer:type=consumer-fetch-manager-
#       metrics,client-id=<x>` were built using the auto-gen names. After a
#       routine pod rotation, the counter ordering changed (different bean
#       init order); dashboards now show different lines under the same
#       name; alerts fire on what looks like a regression but is actually
#       noise. Setting explicit client.id makes dashboard names stable.
#
#   (5) CI test groups colliding in broker-side metrics.
#       CI pipelines run integration tests that spin up consumers in
#       ephemeral groups. Default empty client.id means broker metrics see
#       hundreds of `consumer-test-group-1` rows per day. Broker-side metric
#       cardinality explodes (each test run is a new client.id label that
#       lingers in metric stores for hours). Setting
#       `client.id=ci-${CI_BUILD_ID}` gives each run a unique, traceable,
#       time-bounded label.
#
#   (6) Spring Kafka passthrough — assumed-set but missing.
#       Internal Spring Kafka starter is documented as 'sets client.id
#       automatically'. But a team's app has `spring.kafka.consumer.client-
#       id` UNSET (Spring does NOT auto-derive consumer client.id from
#       spring.application.name; it must be set in spring.kafka.consumer.
#       client-id explicitly). Effective client.id falls back to auto-gen.
#       Static analysis on the .properties (or the wrapper config) catches it.
#
# Fix
#   ONE LINE. Set `client.id` to `<service-name>-<consumer-role>`:
#
#     client.id=payments-fraud-screening
#     client.id=orders-export-to-warehouse-consumer
#     client.id=analytics-ingest-consumer
#
#   For multi-replica deployments, consider templating the pod-ordinal into
#   client.id so each pod is broker-side-distinguishable:
#
#     client.id=payments-fraud-screening-${HOSTNAME}
#
#   AVOID generic values (`my-consumer`, `consumer`, `client-1`) — those
#   defeat the purpose. The sibling rule KAFKA_CLIENT_ID_GENERIC catches
#   them as a separate violation.
# =============================================================================

bootstrap.servers=broker-1.kafka.prod.example.com:9092,broker-2.kafka.prod.example.com:9092,broker-3.kafka.prod.example.com:9092
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer

# Group identity (so the rule fires only on the absent client.id, not on
# absent group.id — that sibling rule has its own IT).
group.id=payments-events

# Bootstrap-offset semantics: replay backlog on a fresh group / fresh
# partition / expired-offset case.
auto.offset.reset=earliest

# At-least-once semantics: do not auto-commit; the application calls
# commitSync() after each successful batch.
enable.auto.commit=false

# Read-committed: skip aborted-transaction records.
isolation.level=read_committed

# Poll-loop tuning.
max.poll.records=500
max.poll.interval.ms=300000
session.timeout.ms=45000
fetch.min.bytes=1024

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# MISSING:
#   client.id=...
# kafka-clients auto-generates `consumer-<group>-<N>` per JVM (counter resets
# on restart). `kafka-consumer-groups --describe` rows, KIP-13 per-client-id
# quotas, JMX dashboards, and __consumer_offsets audit attribution are all
# left with this opaque label.
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
