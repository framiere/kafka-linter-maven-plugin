# RULE: STREAMS_PROPERTIES_PROCESSING_GUARANTEE_ABSENT.
#
# This Streams config is otherwise reasonable — it sets the
# other Streams essentials:
#   - application.id set                (group identity)
#   - bootstrap.servers set
#   - default serdes set
#   - replication.factor=3              (internal topics survive a broker loss)
#   - num.stream.threads=4              (parallelism declared)
#   - state.dir set to a persistent path
#
# ...but it never sets `processing.guarantee`. Kafka Streams
# defaults `processing.guarantee` to `at_least_once`.
#
# THE BUG SHAPE THIS RULE CATCHES:
#
# `processing.guarantee` controls the strongest semantic
# guarantee any Streams topology can offer:
#
#   - at_least_once (default):
#       After every commit, source-positions / changelog updates /
#       output produces have all flushed to the brokers — but the
#       three are NOT atomic. If the JVM crashes mid-commit, on
#       restart Streams replays from the last successful
#       source-position commit. Records whose output produce
#       already landed but whose source-position commit did NOT
#       are reprocessed and re-emitted → duplicate downstream
#       records.
#
#   - exactly_once_v2 (KIP-447, since Kafka 2.5):
#       Each commit wraps the source-position commit + changelog
#       update + output produce in a SINGLE Kafka transaction.
#       Either all three land or none do. No duplicates downstream
#       on crash / rebalance / restart.
#
# The default `at_least_once` is the most common "I assumed I
# had EOS because Kafka has EOS" bug in production Streams
# deployments. Streams does NOT default to EOS. You must
# opt in.
#
# CONCRETE FAILURE MODES:
#
# (1) Financial settlement double-counting.
#     Streams app aggregates `Payment` events keyed by account_id
#     into a balance state store, then emits a `Settlement` record
#     per commit window. Downstream banking system applies each
#     settlement to a ledger. Default `processing.guarantee=
#     at_least_once`. Pod is restarted during a deployment (or
#     crashes on an OOM). On recovery, the last batch of
#     Settlement records is re-emitted to the output topic.
#     Banking system applies them twice. Customers see double
#     debits. Discovered 3 weeks later by quarterly reconciliation;
#     by then $4.7M in duplicate debits have to be manually
#     refunded.
#
# (2) Inventory decrement duplication.
#     Streams app reads `OrderPlaced` events, decrements an
#     inventory state store, emits `InventoryUpdate` events to a
#     downstream micro-service. Default `at_least_once`. A broker
#     rolling restart triggers a rebalance; in-flight records on
#     the partition being rebalanced get replayed by the new
#     owner. Inventory decrements twice for the same order.
#     Phantom out-of-stock errors at checkout 30 seconds later;
#     customers abandon carts.
#
# (3) External API double-call.
#     Streams app reads `UserSignedUp`, calls the email-service
#     REST API to send welcome email via a custom Processor. No
#     idempotency key on the API. Default `at_least_once`. On
#     every redeployment, the most recent ~30 seconds of records
#     get reprocessed. Users get 2-3 welcome emails. Support
#     tickets pile up; engineers add a deduplication layer in
#     the Processor (which is a no-op because Streams doesn't
#     know about external side-effects). Real fix would have
#     been EOS + idempotent API call.
#
# (4) The inverse: EOS paid for, not needed.
#     Operator sees STREAMS_PROPERTIES_PROCESSING_GUARANTEE_
#     ABSENT in a monitoring dashboard and 'fixes' it by setting
#     `processing.guarantee=exactly_once_v2` on a workload that
#     writes to a Cassandra table keyed by event_id (idempotent
#     upsert). Throughput drops ~30% (commit.interval.ms pinned
#     to 100ms; transactional producer overhead per commit). For
#     a 100 events/sec workload that's fine; for a 100k
#     events/sec workload it's a capacity crisis.
#
# (5) Mixed-team confusion.
#     Service A team thinks EOS is on because 'we use Kafka and
#     EOS is Kafka's headline feature'. Service B team thinks
#     EOS is off because 'it's expensive and we never opted in'.
#     Same Streams config; nobody actually pinned the knob.
#     Bug reports diverge ('we see duplicates' / 'why is
#     throughput so low?'); root cause is the same absent line.
#
# WHY THIS RULE IS INFO (NOT WARNING/ERROR):
#
# The default is workload-dependent. Idempotent downstream →
# `at_least_once` is silently correct. Non-idempotent downstream
# → `at_least_once` is silently dangerous. The plugin cannot
# read your downstream's idempotency from the .properties file.
# The right behavior is: pin the knob explicitly, so the choice
# is documented and survives code review.
#
# Raised here to ERROR by config override so the IT fixture
# demonstrates the violation deterministically.
#
# Fix: ONE LINE.
#   - `processing.guarantee=at_least_once` to DOCUMENT that
#     at-least-once was deliberate (idempotent downstream).
#   - `processing.guarantee=exactly_once_v2` for EOS (requires
#     broker 2.5+, costs ~30% throughput, pins commit.interval.ms
#     to 100ms by default).
#   - DO NOT use `exactly_once` or `exactly_once_beta` — those
#     are deprecated by KIP-732 and removed in Kafka 4.0
#     (see STREAMS_EOS_V1_DEPRECATED).
#
# The point is: PICK ONE deliberately.
application.id=orders-aggregator
bootstrap.servers=kafka-1.prod.example.com:9092
client.id=bad-no-processing-guarantee-streams
default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
default.value.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
replication.factor=3
num.stream.threads=4
state.dir=/var/lib/orders-aggregator/streams
