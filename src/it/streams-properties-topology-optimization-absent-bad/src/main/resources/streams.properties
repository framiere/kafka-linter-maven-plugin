# =============================================================================
# IT fixture: STREAMS_PROPERTIES_TOPOLOGY_OPTIMIZATION_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A Kafka Streams .properties file destined for `new StreamsConfig(props)`.
#   It declares application.id, bootstrap.servers, default serdes, processing
#   guarantee, replication factor, thread count, commit interval, state dir,
#   both exception handlers, num.standby.replicas=1 (HA for state stores) —
#   a complete production-quality Streams config for a STATEFUL join-and-
#   aggregation topology — EXCEPT `topology.optimization` is not set
#   anywhere.
#
# What's wrong
#   `org.apache.kafka.streams.StreamsConfig.TOPOLOGY_OPTIMIZATION_CONFIG`
#   declares `topology.optimization` with:
#
#     ConfigDef.Type.STRING, default = "none", importance = MEDIUM
#     validValues = none | all | reuse.ktable.source.topics |
#                   merge.repartition.topics | single.store.self.join
#
#   With `none`, the topology builder generates internal CHANGELOG and
#   REPARTITION topics CONSERVATIVELY:
#
#     1. Every `KTable` materialized from a SOURCE TOPIC allocates a
#        SEPARATE changelog `<app-id>-<store-name>-changelog` that
#        DUPLICATES the source topic content. Every update is written
#        TWICE to brokers.
#
#     2. Every `groupBy().*` after a key-changing operation creates a
#        SEPARATE repartition topic. Chained `groupBy().reduce().toStream
#        ().groupBy().count()` allocates TWO repartition topics each
#        storing the full intermediate dataset.
#
#     3. Every `KStream` self-join (e.g. `stream.join(stream.mapValues
#        (...))`) allocates TWO state stores — one per side of the join.
#
#   For a non-trivial topology (one aggregation, two joins, three
#   repartition-inducing operators — this fixture's pattern), the default
#   `none` generates ~12 internal topics. With `topology.optimization=all`,
#   the same topology generates ~6 internal topics:
#
#     - `reuse.ktable.source.topics` — KTable changelogs reuse the source
#       topic; halves broker storage for that materialized state.
#     - `merge.repartition.topics` — consecutive repartition steps share
#       ONE topic; halves intermediate-data broker storage.
#     - `single.store.self.join` (KIP-862, Apache Kafka 3.4) — self-join
#       collapses to ONE state store; halves state-store size and
#       restore time.
#
#   Quantified impact for THIS fixture's topology pattern:
#     - Broker partition count: 96 → 48 (12 internal topics × 8
#       partitions, halved).
#     - Broker disk consumption: ~2x reduction on internal topics.
#     - Restore replay time on cold start: ~2x reduction (fewer
#       changelog topics to replay; smaller state stores per task).
#     - Rebalance time: 30% reduction (fewer partitions to assign).
#
# Why this is "INFO" by default (not WARNING or ERROR)
#   (a) Streams works CORRECTLY under `none`. The processing semantics
#       are identical between `none` and `all` — `topology.optimization`
#       only affects the INTERNAL topic layout, never the observable
#       behavior of the topology. So this is NOT a correctness issue.
#
#   (b) For EXISTING running applications, changing
#       `topology.optimization` from `none` to `all` is operationally
#       expensive: the internal topic identities change (new changelog
#       names, new sub-topology IDs), the OLD changelog topics become
#       orphaned, and the app must REBUILD state from scratch on first
#       deploy after the change. This is a one-time state-rebuild
#       window that must be planned. The conservative default exists
#       to prevent operators from accidentally triggering this.
#
#   (c) For NEW applications, `all` is the production default and
#       should be the deliberate choice. The plugin's nudge is to
#       ensure the operator made A DELIBERATE CHOICE rather than
#       accepting the implicit conservative default.
#
#   INFO severity is the right level: surfaces the missing optimization
#   without flagging Streams apps as broken; operators raise to WARNING
#   or ERROR for the templates they own.
#
#   This IT overrides severity to ERROR via pom.xml configuration to
#   force the build to fail and verify the rule fires.
#
# Common bug shapes
#   (1) Aggregation app with KTable source — doubled broker storage.
#       A Streams app has `builder.table('orders').groupBy(...).count()`.
#       With `topology.optimization=none` (default), Streams allocates an
#       internal changelog `<app-id>-orders-state-changelog` that
#       DUPLICATES `orders` content — every order is written to the source
#       AND to the changelog. With `topology.optimization=all`, the source
#       topic IS the changelog. For a 10M-record KTable, this is 10M
#       extra messages written daily and 5-10 extra minutes of restore
#       time per pod restart.
#
#   (2) Multi-stage aggregation with chained groupBy — doubled
#       intermediate-data cost.
#       A topology does `stream.groupBy(K1).reduce(...).toStream().
#       groupBy(K2).count()`. With `none`, two repartition topics are
#       created (one before each aggregation), each storing the full
#       intermediate dataset. With `all`, the two repartitions merge
#       into one — halving broker resource cost on the intermediate
#       datasets.
#
#   (3) Foreign-key join materialized view — gigabytes of saved broker
#       storage.
#       A topology does `leftTable.join(rightTable, foreignKeyExtractor,
#       joiner)`. The foreign-key-join operator internally creates 4-5
#       internal topics (subscription register, subscription response,
#       primary-key index, etc.). With `topology.optimization=all`, the
#       operator's internal topic count is reduced via repartition
#       consolidation. For a 100M-record join, the resource saving is
#       in the gigabytes of broker storage.
#
#   (4) Self-join on a KStream — halved state-store size.
#       A topology does `stream.join(stream.mapValues(...), joiner)` for
#       a self-join. With `none`, two state stores are allocated. With
#       `topology.optimization=all` (specifically `single.store.self.join`,
#       KIP-862, Apache Kafka 3.4), one state store is allocated. Halves
#       the state-store size and restore time.
#
#   (5) Spring Boot Streams autoconfig — org-wide resource overhead.
#       Spring Boot's Streams autoconfiguration (`spring-kafka`) provides
#       a `KafkaStreamsConfiguration` bean from `application.yml` /
#       `application.properties`. The default Spring template DOES NOT
#       include `topology.optimization`. Every Spring Boot Streams app
#       deployed via the template inherits the default `none`. Across
#       an org with 30+ Streams apps, the cumulative resource overhead
#       is significant.
#
#   (6) Migration constraint — existing app should set explicit `none`.
#       Changing `topology.optimization` on an EXISTING running
#       application reshuffles internal topic identities (new changelog
#       topic names, new state-store sub-topology IDs) — which means
#       the OLD changelog topics become orphaned and the app must
#       REBUILD state from scratch on first deploy after the change.
#       For an existing app, the operator should set explicit `none`
#       and document the migration constraint. The plugin's nudge is
#       to MAKE A DELIBERATE CHOICE rather than implicit default.
#
# Fix
#   ONE LINE. Production default for NEW Streams applications:
#     topology.optimization=all       # All three KIP-295 sub-optimizations
#                                     # active: reuse.ktable.source.topics,
#                                     # merge.repartition.topics, and (3.4+)
#                                     # single.store.self.join.
#
#   For EXISTING applications (document the migration constraint):
#     topology.optimization=none      # EXPLICIT — documents the deliberate
#                                     # choice to preserve compatibility
#                                     # with the existing running app's
#                                     # internal topic layout. Migration
#                                     # to `all` requires a one-time
#                                     # state-rebuild window.
#
#   Migration incrementally (enable individual sub-optimizations):
#     topology.optimization=reuse.ktable.source.topics
#                                     # Apply ONE sub-optimization at a
#                                     # time. Useful for staged migration
#                                     # of large existing apps.
#
# Sibling rule
#   `STREAMS_TOPOLOGY_OPTIMIZATION_NONE` catches the bytecode-detected
#   explicit `=none` in code-side `Properties.put` calls; this rule
#   catches the .properties-file ABSENT case where the operator never
#   set the knob at all.
#
#   `SPRING_BOOT_STREAMS_TOPOLOGY_OPTIMIZATION_NONE` catches the same
#   anti-pattern in Spring Boot's `application.properties` /
#   `application.yml`.
# =============================================================================

application.id=orders-enrichment-stream
bootstrap.servers=broker-1.kafka.prod.example.com:9092,broker-2.kafka.prod.example.com:9092,broker-3.kafka.prod.example.com:9092

# Default serdes used by topology operators that don't pass explicit
# Consumed/Produced/Materialized/Grouped.
default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
default.value.serde=io.confluent.kafka.streams.serdes.avro.SpecificAvroSerde

# Internal-topic durability (replication factor for changelog + repartition topics).
replication.factor=3
min.insync.replicas=2

# Throughput & latency.
num.stream.threads=8
commit.interval.ms=5000

# HA for stateful tasks — 1 warm copy of every state-store partition.
num.standby.replicas=1

# At-least-once with explicit commit cadence.
processing.guarantee=at_least_once

# State-store location (outside /tmp; survives container restarts when mounted as a volume).
state.dir=/var/lib/kafka-streams/orders-enrichment

# Exception handlers — both set, so the existing handler-absent rules don't fire.
default.deserialization.exception.handler=org.apache.kafka.streams.errors.LogAndContinueExceptionHandler
default.production.exception.handler=org.apache.kafka.streams.errors.LogAndContinueProductionExceptionHandler

# Schema registry (Confluent Avro deserializer dependency).
schema.registry.url=http://schema-registry.kafka.prod.example.com:8081

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# MISSING:
#   topology.optimization=...
# Without this key, Kafka Streams defaults `topology.optimization` to `none`
# (declared in StreamsConfig.TOPOLOGY_OPTIMIZATION_CONFIG with ConfigDef.Type.
# STRING, default = "none"). With `none`, the topology builder generates
# internal CHANGELOG and REPARTITION topics CONSERVATIVELY — every KTable
# materialization gets its own changelog (duplicating the source topic),
# every key-changing operator chain creates a separate repartition topic
# (instead of sharing one), and every self-join creates two state stores
# (instead of one). For this fixture's join-and-aggregation topology,
# the default generates ~12 internal topics; `topology.optimization=all`
# would generate ~6 — halving broker partition count, halving broker
# disk consumption, halving restore-replay time on cold start. The
# production default for NEW applications is `topology.optimization=all`
# (KIP-295, Apache Kafka 2.1, November 2018).
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
