# RULE: PRODUCER_PROPERTIES_COMPRESSION_TYPE_ABSENT.
#
# This producer config is otherwise PRODUCTION-QUALITY:
#   - acks=all                     (durability)
#   - enable.idempotence=true      (no duplicates on retry)
#   - linger.ms=20                 (batching window opened)
#   - batch.size=131072            (128 KiB batches)
#
# ...but it never sets compression.type, so kafka-clients uses the ConfigDef
# default `compression.type=none`. The records carrying acks=all + idempotence
# guarantees are then shipped UNCOMPRESSED over the wire and stored UNCOMPRESSED
# on the brokers' segment files.
#
# This is the silent version of the PRODUCER_COMPRESSION_NONE_EXPLICIT
# anti-pattern: nobody wrote `compression.type=none` on purpose, but the effect
# is identical — and worse, no reviewer notices the missing line, so the
# misconfiguration ages indefinitely.
#
# Concrete cost of leaving this implicit:
#   - JSON / Avro / protobuf payloads typically compress 3x-10x with zstd.
#   - Network bandwidth between producer and broker carries the full payload.
#   - Replication bandwidth between brokers carries the full payload *per replica*.
#   - Broker page cache holds the full payload, evicting other hot data.
#   - Disk segments store the full payload, multiplying retention storage cost.
#
# Setting `compression.type=zstd` (or lz4/snappy) is one line and almost always
# pays for itself within minutes of being deployed. The linter flags the
# ABSENCE so the gap can't survive code review by being invisible.
bootstrap.servers=kafka-1.prod.example.com:9092
client.id=bad-no-compression-producer
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=org.apache.kafka.common.serialization.StringSerializer
acks=all
enable.idempotence=true
linger.ms=20
batch.size=131072
