# =============================================================================
# A MirrorMaker 2 source-connector configuration where the operator has
# EXPLICITLY disabled topic-ACL synchronization by setting
# `sync.topic.acls.enabled=false`. The default for this key is `true`;
# disabling it opts out of one of MM2's core security guarantees and leaves
# the DR cluster's replicated topics with no source-derived ACLs.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#
#   connector.class             = MirrorSourceConnector
#   sync.topic.acls.enabled     = false   ← the smoking gun
#
# WHAT THIS KEY ACTUALLY CONTROLS:
#
# `sync.topic.acls.enabled` (default: true) tells the MirrorSourceConnector
# whether to COPY topic-level ACLs from source-cluster topics to their
# replicated counterparts on the target cluster. Topic-level ACLs include
# every principal-level access binding on the topic:
#
#   READ        — who can consume records from the topic
#   DESCRIBE    — who can describe topic metadata (partitions, configs)
#   WRITE       — who can produce records to the topic
#   DELETE      — who can delete the topic itself
#   ALTER       — who can change topic configs
#
# When MM2 syncs ACLs, it filters out WRITE-grant ACLs (so external producers
# on the target cluster cannot write to a replicated topic — only the MM2
# connector itself can write, preserving the read-only semantics of
# replicated topics on the DR cluster), but it preserves READ and DESCRIBE.
# This means: any principal that could read the topic on the source can
# read the replicated topic on the target. The same service accounts, the
# same data-team groups, the same downstream consumer applications — all
# work transparently during a primary→DR failover.
#
# When MM2 does NOT sync ACLs (sync.topic.acls.enabled=false), the
# replicated topic on the target is created with NO ACLs of its own. The
# target topic's effective access control is determined entirely by:
#   (a) the target cluster's broker-level `allow.everyone.if.no.acl.found`
#       setting, AND
#   (b) any wildcard or principal-level ACLs that pre-existed on the
#       target cluster.
#
# Neither of these has any relationship to the source topic's ACLs. The
# target topic's security posture is therefore COMPLETELY INDEPENDENT of
# the source topic's security posture — and the divergence is invisible
# in steady-state operation.
#
# TWO FAILURE SHAPES:
#
# (1) DATA LEAK ON THE TARGET. When the target cluster's broker config has
#     `allow.everyone.if.no.acl.found=true` (a very common legacy default
#     from clusters that started in 'no auth' mode and were later upgraded
#     to authentication-only without ACL-hardening), the replicated topic
#     has NO ACLs and is therefore readable by EVERY authenticated
#     principal on the target cluster. A `customer-pii` topic that was
#     tightly ACL'd on the primary cluster (only the customer-service
#     application's principal could read it; everyone else was denied)
#     becomes WIDE-OPEN on the DR cluster: the data-analytics team, the
#     marketing team, the BI team, the data-science team — every service
#     account on the DR cluster — has full READ access to the replicated
#     PII data. This is a SEVERE compliance violation:
#       - GDPR Article 25 (data protection by design) requires
#         access-on-need-to-know-basis; failure → fines up to 4% of global
#         revenue
#       - SOX requires segregation of duties and limited access to
#         financial data; failure → SEC enforcement
#       - PCI-DSS requires strict scoping of cardholder data; failure →
#         loss of merchant status
#     The leak is invisible in monitoring (replication metrics show
#     records flowing; no alarms fire). It is discovered only during a
#     quarterly security audit, a penetration test, or — worst — an
#     actual data exfiltration incident.
#
# (2) DR FAILOVER BLOCKED AT AUTHORIZATION. When the target cluster's
#     broker config has `allow.everyone.if.no.acl.found=false` (the
#     production-recommended default — 'deny by default'), the replicated
#     topic has NO ACLs and NO principal is authorized. During a
#     primary→DR cutover (real production outage; primary cluster is
#     down; DR plan calls for consumers to fail over to DR), the
#     consumer applications connect to DR; their service-account
#     principals attempt to consume from `customer-orders`; the target
#     broker checks ACLs; finds none for the principal; finds the broker
#     default `=false`; rejects the request with
#     `TopicAuthorizationException: Not authorized to access topics:
#     [customer-orders]`. The failover is BLOCKED at the authorization
#     layer; consumers cannot proceed. An operator must manually
#     enumerate the missing ACLs and apply them on the target cluster
#     via `kafka-acls.sh --add` (a 30+ minute scramble during an active
#     incident with stakeholders watching and revenue ticking away).
#
# WHY THIS LOOKS SAFE BUT IS NOT:
#
# Replication runs FINE with sync.topic.acls.enabled=false. Records flow
# from source to target. Throughput dashboards show steady-state
# replication. Lag metrics are healthy. The Kafka cluster's health-check
# dashboards report 'green'. Nothing alerts.
#
# The damage is INVISIBLE in normal operation. It manifests only at:
#   - a quarterly security audit ('show me the same access controls on
#     the source and the target — they should be identical')
#   - a DR drill (the principals fail to authorize against the target)
#   - an actual primary cluster failover (same as above but during an
#     incident with stakeholder pressure)
#   - a penetration test (the pentester discovers an over-permissive
#     replicated topic on the DR cluster)
#   - a data-exfiltration incident (an attacker with low-tier credentials
#     on the DR cluster discovers they can read high-sensitivity
#     replicated topics)
#
# Exactly the moments when the operator NEEDS the security posture to be
# correct. The misconfiguration is a time-bomb whose detonation aligns
# with regulatory, operational, or adversarial pressure.
#
# HOW THIS HAPPENS:
#
# (a) **MM2 connector user lacks ALTER permission on target ACLs.** This
#     is BY FAR the dominant cause. The MM2 connector authenticates to
#     the target cluster as a service-account principal (e.g.,
#     `User:mm2-connector`). For ACL sync to work, this principal needs
#     CLUSTER:ALTER permission on the target cluster (to call
#     `AdminClient.createAcls()`). If the principal lacks this permission,
#     the ACL sync calls fail with
#     `ClusterAuthorizationException: Cluster authorization failed`. The
#     Connect log fills with these errors at every sync cycle. Rather
#     than grant the missing ALTER permission (which requires
#     coordination with the target-cluster's security team and a change
#     to the cluster's ACL setup), the operator disables the sync to
#     silence the noise. The 'fix' was a workaround masking a
#     permission-config issue.
#
# (b) **Helm chart with `=false` as a 'simplicity' default.** Org's
#     internal Helm chart for MM2 deployments was authored by an engineer
#     whose dev cluster ran in 'no ACLs configured' mode (PLAINTEXT, no
#     auth, no ACLs). The engineer set `syncTopicAclsEnabled: false` as
#     a chart default because the dev cluster had no ACLs to sync
#     anyway. Multiple production teams deployed the chart without
#     overriding; every team's DR cluster has replicated topics with no
#     ACLs; every team has an invisible security divergence between
#     primary and DR.
#
# (c) **Tutorial copy-paste.** Early MM2 tutorial blog post used
#     `sync.topic.acls.enabled=false` 'to keep the tutorial simple' (no
#     need to set up source-cluster ACLs for the tutorial). The team's
#     first MM2 deployment was bootstrapped from that tutorial; the
#     explicit `=false` was carried forward through every subsequent MM2
#     deployment as 'the way we configure MM2 here'.
#
# (d) **Operator misunderstanding of ACL-sync direction.** A new SRE
#     assumes 'sync topic ACLs' means 'pulling ACLs from the target
#     cluster into the source cluster' (the wrong direction; they
#     imagined some kind of bidirectional sync) and is worried about
#     target-side experimental ACLs overwriting carefully-curated
#     source ACLs. They disable the sync 'to be safe'. The opposite is
#     true: MM2 syncs source→target only (replication direction);
#     disabling the sync removes the source→target propagation and
#     leaves the target with broker defaults.
#
# (e) **Migration from MirrorMaker 1.** MM1 had no ACL-sync feature at
#     all. Operators migrating from MM1 to MM2 inherited an ops culture
#     of 'manage target-cluster ACLs separately from source-cluster
#     ACLs'; the operator deliberately set `sync.topic.acls.enabled=
#     false` to preserve the manual-management workflow. The
#     manual-management workflow had been a workaround for MM1's
#     limitation; MM2's automatic sync was supposed to make it obsolete,
#     but the operator did not update their playbook.
#
# (f) **Security-team override.** Security team mandates that ACLs on
#     the DR cluster are managed exclusively by a separate ACL-governance
#     system (e.g., an org-wide identity service that automatically
#     applies ACLs based on data-classification tags). The operator
#     disables `sync.topic.acls.enabled` so that the MM2 connector does
#     not interfere with the governance system. This is LEGITIMATE — but
#     the rule should be suppressed explicitly via the per-rule severity
#     override, not left as an implicit `=false`. The static-analysis
#     catch surfaces (a)–(e) and prompts a documented decision on (f).
#
# THE FIX:
#
# Remove the explicit `=false` (the default `=true` is the
# production-recommended setting):
#
#   # sync.topic.acls.enabled=false       ← DELETE THIS LINE
#
# Or set explicitly to true to make the intent visible to future readers:
#
#   sync.topic.acls.enabled=true          ← OK (matches the default)
#
# AND ensure the MM2 connector's principal has the necessary permissions
# on the target cluster:
#
#   kafka-acls.sh --bootstrap-server dr-kafka.internal:9093 \
#       --add --allow-principal User:mm2-connector \
#       --operation All --cluster
#
# If the operator DELIBERATELY wants per-cluster security divergence
# (e.g., target is a sanitized analytics cluster with separately-managed
# ACLs), document the intent in a comment AND suppress this rule via
# per-rule severity override:
#
#   <severities>
#       <MM2_SYNC_TOPIC_ACLS_DISABLED>OFF</MM2_SYNC_TOPIC_ACLS_DISABLED>
#   </severities>
#
# IMPORTANT: enabling sync.topic.acls=true does NOT retroactively fix
# already-replicated topics that lack ACLs. MM2 syncs ACLs going forward
# on the next `sync.topic.acls.interval.seconds` cycle (default 600 s);
# topics that were created during the `=false` window will be back-filled
# on that next sync cycle. Verify the back-fill completed before relying
# on the sync — particularly important if you are remediating in response
# to a compliance finding.
#
# =============================================================================

name=mm2-orders-source
connector.class=org.apache.kafka.connect.mirror.MirrorSourceConnector
tasks.max=8

source.cluster.alias=primary
target.cluster.alias=dr

source.cluster.bootstrap.servers=primary-kafka.internal:9093
target.cluster.bootstrap.servers=dr-kafka.internal:9093

replication.factor=3
checkpoints.topic.replication.factor=3
heartbeats.topic.replication.factor=3
offset-syncs.topic.replication.factor=3

sync.topic.configs.enabled=true

# VIOLATION: sync.topic.acls.enabled=false — opts out of source→target
# topic-ACL synchronization. Replicated topics on the target cluster will
# have NO ACLs of their own; the effective access is determined by the
# target broker's `allow.everyone.if.no.acl.found` setting. Either a data
# leak (when =true) or a DR failover blocker (when =false). Fix: remove
# this line (the default `=true` is correct) AND ensure the MM2 connector
# principal has CLUSTER:ALTER on the target. If per-cluster security
# divergence is deliberate, document the intent and suppress this rule
# via `<MM2_SYNC_TOPIC_ACLS_DISABLED>OFF</MM2_SYNC_TOPIC_ACLS_DISABLED>`.
sync.topic.acls.enabled=false

topics=orders\\..*,payments\\..*,customers\\..*,customer-pii\\..*
topics.exclude=__consumer_offsets,__transaction_state,_schemas

refresh.topics.interval.seconds=600
refresh.groups.interval.seconds=600
