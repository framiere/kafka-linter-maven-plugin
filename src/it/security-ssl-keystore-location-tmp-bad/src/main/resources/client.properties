# =============================================================================
# IT fixture: SECURITY_SSL_KEYSTORE_LOCATION_TMP (bad)
# =============================================================================
#
# What this file is
#   A Kafka mTLS client .properties file for `fraud-screening-v2` —
#   a Java 17 microservice running as a Docker container on a shared
#   Bare-Metal Kubernetes node (multi-tenant, no node-level pod
#   isolation enforced by the platform team). The service consumes
#   `customer.transactions` events from a self-hosted Apache Kafka
#   3.7 cluster operated by the central security platform, and uses
#   mTLS — every fraud-screening pod presents a client certificate
#   issued by the corporate PKI, valid for 30 days.
#
#   How the keystore got into /tmp:
#     - The team started by following the official Apache Kafka SSL
#       quickstart (`https://kafka.apache.org/documentation/#security_
#       ssl`) which uses `/tmp/kafka.client.keystore.jks` throughout
#       (because `/tmp` always exists and is writable for the
#       tutorial's local dev scenario).
#     - The dev shell script wrote the keystore to `/tmp/...` because
#       the team didn't have access to `/etc/` on their dev machines.
#     - The dev shell script was packaged into the production
#       Docker image as the container entrypoint.
#     - Nobody noticed during code review because the value 'looked
#       like a real path'.
#
# What's wrong
#   `ssl.keystore.location=/tmp/fraud-screening.keystore.p12` — the
#   keystore (containing the client's private key + cert chain used
#   to authenticate as `fraud-screening-v2` to the Kafka cluster) is
#   stored in a directory with default mode `1777` (drwxrwxrwt). On
#   this multi-tenant node, that means:
#
#   (1) **Sibling pods on the same node can read it.** The node runs
#       fraud-screening-v2 alongside other workloads from other
#       teams. If any of those workloads has access to the host's
#       `/tmp` via a hostPath volume (some teams use `/tmp` as a
#       shared scratch space — a known anti-pattern), they read the
#       keystore directly.
#
#   (2) **Pod-level container compromise → cluster-wide identity
#       theft.** A bug in any other process running in this pod's
#       Linux namespace (a Java agent like Datadog, an init
#       container that lingers, a debug ephemeralcontainer attached
#       via `kubectl debug`) can read the file. The keystore
#       password is in the pod's environment variables, and a heap
#       dump on OOM lands at `/tmp/java_pid<n>.hprof` next to the
#       keystore. An on-call engineer who copies the heap dump to
#       their laptop just exfiltrated both the keystore and its
#       password.
#
#   (3) **Tmpfs persistence across pod restarts.** This node's
#       `/tmp` is a tmpfs (RAM-backed, default for K8s `EmptyDir`
#       with `medium: Memory`) but the tmpfs is shared across pod
#       restarts on the same node — the tmpfs survives until the
#       node reboots. After the fraud-screening pod restarts, the
#       next pod scheduled to the node sees the leftover keystore.
#       If that 'next pod' is a sibling workload from another team,
#       they have the fraud-screening service's identity.
#
#   (4) **Keystore replacement attack.** An attacker who briefly
#       gains code-exec on the node (a single RCE in any of the
#       ~40 workloads on the node, a JVM deserialization bug, a
#       kubelet CVE) replaces `/tmp/fraud-screening.keystore.p12`
#       with their own keystore containing a cert signed by a CA
#       the Kafka brokers trust (or one they got the corporate PKI
#       to issue via a social-engineering or impersonation attack).
#       The next time fraud-screening reloads SSL config (planned
#       cert rotation in 30 days), it loads the attacker's
#       keystore and authenticates as whatever identity the
#       attacker chose. The compromise persists across the legitimate
#       cert-rotation pipeline because the cert-rotation script
#       writes to `/tmp/fraud-screening.keystore.p12` — the same
#       path the attacker controls.
#
#   (5) **Co-located heap-dump leak.** The JVM's `-Djava.io.tmpdir`
#       defaults to `/tmp` on every JDK 8+ default config. A `kill
#       -3` or a `HeapDumpOnOutOfMemoryError` writes a heap dump to
#       `/tmp/java_pid<n>.hprof`. The heap dump contains:
#         (a) the loaded keystore's in-memory representation
#             INCLUDING the unencrypted private key bytes (the JCA
#             `KeyStore` object holds the decrypted `PrivateKey` in
#             a live field after `getKey()`);
#         (b) the keystore password string (held in the
#             `SslEngineFactory` / `SslContext` until JVM shutdown);
#         (c) the cert chain in DER form.
#       An on-call engineer copying the heap dump off-host for
#       analysis just exfiltrated everything needed to impersonate
#       this client.
#
#   (6) **CI runner shared-tmpfs leakage.** The team's CI pipeline
#       (Jenkins, running on a shared CI cluster) uses `/tmp` as
#       the default scratch space. Test runs from different
#       teams' branches share the same `/tmp` until the CI runner
#       Pod is restarted. A test run for fraud-screening writes a
#       test keystore to `/tmp`; the next CI run for an unrelated
#       team reads it. This is a well-known vector for staging-
#       credential theft via a public PR build.
#
# Why this matters: the broader system context
#   (1) **Linux `/tmp` semantics.** The sticky bit (`1777` = `1` =
#       sticky + `777` = world-rwx) prevents non-owners from
#       `unlink()`-ing other users' files. It does NOT prevent
#       reads, writes (creating new files with the SAME name as
#       another user's file via `O_TRUNC` is prevented by the
#       sticky bit only insofar as the file already exists with
#       a different owner — a `creat()` on a brand-new path is
#       unrestricted), listings (`ls`), or stats (`stat`). Every
#       process running on the host as ANY user can read the
#       keystore.
#
#   (2) **Unix file locks are advisory, not mandatory.** The JVM
#       holding the keystore open via `FileInputStream` does NOT
#       block other processes from reading it. The keystore is
#       fully readable to anyone on the host with read permission
#       on the file's containing directory and read permission on
#       the file itself (`644` is the default `umask 0022`).
#
#   (3) **`chmod 600` on the keystore file is not enough.** Even
#       with restrictive mode bits on the keystore itself
#       (`chmod 600 keystore.p12`), the surrounding `/tmp`
#       directory still leaks (a) the *existence* of the file
#       (an attacker doing `ls -la /tmp/` knows mTLS is in use
#       and what filename to target for a replacement attack);
#       (b) every read/write *timestamp* (correlatable with
#       broker-side authentication events to fingerprint the
#       client and its cert-rotation cadence); (c) the file's
#       *size* in bytes (revealing roughly how many certs are
#       bundled — single cert vs full chain vs intermediate CA
#       list). Confidentiality of the binary file content is one
#       part of the threat model; metadata leakage is another.
#
#   (4) **Container-tmpfs leftover certs.** On container hosts
#       where `/tmp` is a tmpfs (`Memory`-medium `EmptyDir` or
#       host-mounted), the keystore persists across pod restarts
#       in a way that operators don't expect. After a pod is
#       killed, the next pod on the same node sees leftover
#       certs from the previous tenant — and a leftover keystore
#       is indistinguishable from the current one. Container
#       debugging (`kubectl debug` / ephemeral debug containers
#       / `crictl exec`) further complicates the threat model
#       because the debug container shares the tmpfs.
#
# The five bug shapes this rule catches
#   (1) **Apache Kafka quickstart copy-paste.** The official
#       quickstart uses `/tmp/kafka.client.keystore.jks` for
#       every example. The path propagates from
#       `bin/kafka-console-consumer.sh --consumer.config /tmp/
#       client-ssl.properties` into team-internal templates and
#       eventually into production configs.
#
#   (2) **Tutorial/blog post copy-paste.** Most 2015-2020-era
#       Kafka SSL tutorials show `/tmp` for the same convenience
#       reason. Modern Confluent / Apache docs use
#       `/etc/kafka/ssl/` or `/var/private/ssl/` but copy-paste
#       from older sources is endemic.
#
#   (3) **Dev shell script that survived into prod.** A
#       `local-dev-run.sh` exports `KAFKA_KEYSTORE=/tmp/dev-
#       keystore.jks` for convenience (no root access needed on
#       the dev machine); the script gets templated into a Helm
#       chart for staging; the same chart reaches production.
#
#   (4) **Init container writing to a shared mount.** A
#       Kubernetes init container fetches a cert from Vault,
#       writes it to `/tmp/keystore.p12`, then the app
#       container reads it from there. The fix is to mount a
#       per-pod `emptyDir` at `/var/run/secrets/kafka/` instead
#       of overloading `/tmp`.
#
#   (5) **Spring Boot `application-local.yml` checked into
#       version control.** A team accidentally checks in their
#       local config with `spring.kafka.properties.ssl.keystore.
#       location=/tmp/dev-keystore.jks`; the default Spring
#       profile inherits and production runs with the dev path.
#
# Why WARNING (not INFO / ERROR) by default
#   The keystore is in `/tmp` but the attack vector requires
#   either (a) a hostile co-tenant on the same node, (b) a
#   sidecar / init container with read access to the file, or
#   (c) a code-exec compromise of an unrelated process on the
#   host. In a fully-isolated single-tenant deployment, the
#   immediate vulnerability is lower — but the configuration
#   is still a security smell that should be fixed before the
#   first multi-tenant deployment lands.
#
#   WARNING surfaces the issue in code review and lets the
#   team triage during a planned security audit rather than
#   blocking the build today. Teams running on shared-tenancy
#   infrastructure (most enterprise K8s clusters) should
#   probably elevate to ERROR via pom-level override.
#
#   This IT fixture's pom.xml overrides the severity to ERROR
#   so that `mvn verify` fails on this bad configuration,
#   demonstrating the rule fires correctly.
#
# Fix
#   Move the keystore to a path with proper file-system
#   permissions and ownership. Pick the appropriate option for
#   your runtime:
#
#   (1) **Kubernetes (preferred).** Mount a Secret of type
#       `kubernetes.io/tls` (or a generic Secret with the
#       keystore as a data key) at `/var/run/secrets/kafka/
#       keystore.p12` with:
#         volumes:
#           - name: kafka-tls
#             secret:
#               secretName: fraud-screening-kafka-tls
#               defaultMode: 0400
#         volumeMounts:
#           - name: kafka-tls
#             mountPath: /var/run/secrets/kafka
#             readOnly: true
#       and ensure the container runs as a non-root user.
#
#   (2) **Vault PKI agent.** Use Vault Agent's templating to
#       write the keystore into a tmpfs mount at
#       `/run/vault/kafka/` owned by the service account, not
#       `/tmp`. The Vault Agent sidecar handles cert renewal
#       and the path is per-pod.
#
#   (3) **Bare-metal RHEL / Debian.** Write the keystore to
#       `/etc/kafka/ssl/keystore.p12` owned by the service-
#       account user (`kafka-fraud` or similar) with `chmod
#       600`. Systemd unit `User=kafka-fraud Group=kafka-fraud`
#       enforces the ownership.
#
#   (4) **cert-manager output.** If cert-manager is producing
#       the keystore as a PKCS12 inside a Secret, mount the
#       Secret directly — there is no need to write the
#       keystore to `/tmp`.
#
#   For PEM workflows (cert-manager, Vault PKI), prefer the
#   PEM keystore type (KIP-651, Kafka 2.7+) and skip the
#   keystore-file middle-man entirely — but the directory the
#   PEM files live in still needs the same scrutiny as the
#   keystore.
# =============================================================================

# Cluster connectivity.
bootstrap.servers=kafka-security.platform.internal:9094

# Security stack — mTLS.
security.protocol=SSL

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# THE BUG:
# Client identity keystore stored in /tmp — world-readable, tmpfs-persistent
# across pod restarts on multi-tenant nodes, co-located with heap dumps that
# leak the keystore password. Any sibling pod, debug container, or RCE on the
# node reads the keystore and assumes the `fraud-screening-v2` identity to
# the Kafka cluster — bypassing every Kafka-side ACL.
# Fix: mount a Kubernetes Secret at /var/run/secrets/kafka/keystore.p12 with
# defaultMode 0400.
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
ssl.keystore.location=/tmp/fraud-screening.keystore.p12
ssl.keystore.password=${env:KAFKA_KEYSTORE_PASSWORD}
ssl.keystore.type=PKCS12
ssl.key.password=${env:KAFKA_KEY_PASSWORD}

# Truststore (broker CA bundle) — properly placed at /etc/.
ssl.truststore.location=/etc/fraud-screening-v2/kafka.truststore.p12
ssl.truststore.password=${env:KAFKA_TRUSTSTORE_PASSWORD}
ssl.truststore.type=PKCS12

# Hostname verification.
ssl.endpoint.identification.algorithm=https

# Standard consumer knobs.
client.id=fraud-screening-v2-pod-0
group.id=fraud-screening-v2
auto.offset.reset=earliest
enable.auto.commit=false
isolation.level=read_committed
max.poll.records=500
max.poll.interval.ms=300000
session.timeout.ms=45000
heartbeat.interval.ms=3000

# Deserializers.
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer

# Connection / metadata.
metadata.recovery.strategy=rebootstrap
