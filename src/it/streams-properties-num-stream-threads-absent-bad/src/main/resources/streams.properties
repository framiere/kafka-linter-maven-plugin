# RULE: STREAMS_PROPERTIES_NUM_STREAM_THREADS_ABSENT.
#
# This Streams config is otherwise reasonable:
#   - application.id set                (group identity)
#   - bootstrap.servers set
#   - default serdes set
#   - replication.factor=3              (internal topics survive a broker loss)
#   - processing.guarantee=at_least_once (explicit, documented choice)
#   - state.dir set to a persistent path
#
# ...but it never sets `num.stream.threads`. Kafka Streams
# defaults `num.stream.threads` to `1` — the topology runs on
# a SINGLE StreamThread, regardless of pod CPU allocation.
#
# THE BUG SHAPE THIS RULE CATCHES:
#
# `num.stream.threads` controls how many StreamThread workers
# run inside each application instance. Each thread:
#
#   1. Owns a slice of the assigned tasks (a task = a sub-
#      topology bound to a slice of input partitions)
#   2. Polls its assigned partitions sequentially
#   3. Runs the topology operators (filter / map / aggregate /
#      transform) for each polled record
#   4. Produces output records via the embedded producer
#
# All four steps happen SEQUENTIALLY on the thread. A single
# StreamThread is a single CPU core's worth of work.
#
# When `num.stream.threads` is absent:
#
#   - 1 StreamThread runs inside the JVM
#   - The pod may have 4 vCPUs allocated (k8s requests/limits)
#   - 1 core does work; 3 cores sit idle
#   - Pod CPU saturates at 25% under load (one core at 100%)
#   - Lag accumulates linearly with input traffic
#
# SIBLING RULE:
#
# `STREAMS_NUM_STREAM_THREADS_ONE` catches the EXPLICIT value
# `num.stream.threads=1`. This rule catches the ABSENT case.
# Functionally identical at runtime — both produce
# single-threaded topologies. The absence variant adds value
# because operators routinely forget to set the knob, never
# realizing the default is single-threaded.
#
# CONCRETE FAILURE MODES:
#
# (1) Horizontal scale-out at 25% CPU per pod.
#     Streams app deployed to Kubernetes with:
#         resources.requests.cpu: 4
#         resources.limits.cpu: 4
#     Operator sees pod CPU at 25% (one of four cores at
#     100%); lag accumulates. Operator's instinct: HPA scales
#     the deployment from 4 pods → 16 pods. Now 16 pods × 25%
#     CPU = the work of 4 pods at 100% CPU. Kubernetes node
#     budget triples for no throughput gain. Real fix would
#     have been `num.stream.threads=4` × 4 pods = same total
#     parallelism for 1/4 the pod count.
#
# (2) Blocking-call stall on a hot partition.
#     Streams topology has a `transform()` that calls an
#     external REST API for enrichment. The API has a P99
#     latency of 300 ms. Default `num.stream.threads=1`. All
#     8 assigned partitions are owned by the same thread.
#     When the API hits a P99 spike, the thread blocks on
#     ALL 8 partitions for 300 ms. Throughput drops 90%.
#     Fix: `num.stream.threads=8` → each partition owned by
#     its own thread; a P99 spike on one stalls only one.
#     (Better fix: async/non-blocking enrichment, but
#     threading buys breathing room.)
#
# (3) Multi-team team confusion.
#     Service A operator deploys with `num.stream.threads=8`
#     (correctly tuned). Service B operator copies Service A's
#     deployment manifest but inherits the streams.properties
#     from a different template that omits the threads knob.
#     Service B silently runs single-threaded on the same
#     pod shape. Symptom: 'A handles 10× B's traffic on the
#     same infra' — root cause is the absent knob.
#
# (4) The deployment grew out from under the knob.
#     Streams app originally deployed on 1-vCPU pods (default
#     `num.stream.threads=1` made sense). Infra team migrates
#     to 4-vCPU pods for cost reasons (fewer larger pods is
#     cheaper than many small pods on this cloud). Streams
#     config never updated. Now 75% of the new pod budget
#     is wasted. The migration's cost savings are negative.
#
# (5) Topology unable to keep up with traffic.
#     Streams app reads from a 100-partition input topic with
#     10 instances. Per-instance task count = 10 partitions.
#     Default `num.stream.threads=1` means each instance
#     processes 10 partitions serially. With per-record cost
#     of 5 ms (typical for stateful aggregation), max
#     throughput per instance = 200 records/sec. Total
#     fleet = 2000 records/sec. Set `num.stream.threads=4`:
#     each instance does 4-way parallel processing → 800
#     records/sec per instance → 8000 records/sec fleet-wide.
#     4× throughput, no infra change.
#
# WHY THIS RULE IS INFO (NOT WARNING/ERROR):
#
# Default `1` is defensible for:
#   - 1-vCPU dev/test pods
#   - single-partition pipelines (parallelism capped at 1
#     by partition count, not by threads)
#   - resource-constrained edge deployments
#
# Default `1` is wasteful for:
#   - production deployments on multi-vCPU pods
#   - topologies with blocking calls in transform/filter
#   - any topic with >1 input partition per instance
#
# The plugin cannot read your pod's CPU allocation or the
# topic's partition count from the .properties file. The
# right behavior is: pin the knob explicitly, so the choice
# is documented and survives code review.
#
# Raised here to ERROR by config override so the IT fixture
# demonstrates the violation deterministically.
#
# Fix: ONE LINE.
#   - `num.stream.threads=4` (or `=8`) for typical production
#     workloads on multi-vCPU pods.
#   - `num.stream.threads=1` EXPLICITLY to document that
#     single-threaded was deliberate.
#
# The point is: PIN IT, do not let it sit at the default 1
# by accident.
application.id=enrichment-pipeline
bootstrap.servers=kafka-1.prod.example.com:9092
client.id=bad-no-num-stream-threads-streams
default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
default.value.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
replication.factor=3
processing.guarantee=at_least_once
state.dir=/var/lib/enrichment-pipeline/streams
