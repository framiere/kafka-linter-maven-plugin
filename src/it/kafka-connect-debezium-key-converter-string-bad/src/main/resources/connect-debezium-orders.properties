# =============================================================================
# Debezium Postgres CDC source connector for the orders schema.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#   key.converter = org.apache.kafka.connect.storage.StringConverter
#
# WHY THIS IS WRONG (for a Debezium source connector):
#
# The Debezium key is a Connect Struct of the source row's primary-key
# columns — one field per column:
#
#   Single-column key:   Struct{order_id=12345}
#   Composite key:       Struct{tenant_id=7, order_id=12345}
#
# The Kafka Connect StringConverter on the KEY side does ONE thing on the
# produce path: it calls value.toString() on the key Struct and serializes
# the resulting Java String to UTF-8.
#
# For Struct{order_id=12345} the wire-bytes become the literal 20-character
# UTF-8 string "Struct{order_id=12345}". No quoting, no escaping, no
# schema, no machine-parseable grammar. This silently corrupts FOUR
# production-critical Kafka behaviors:
#
# (1) LOG-COMPACTION IS CORRUPTED BY UNSTABLE FIELD ORDER.
#
#     Kafka's log-compaction retains the LATEST value for each KEY (by
#     exact byte equality). Struct.toString() iterates the Struct fields
#     in the schema's declared order — that order is derived from the
#     source DB's metadata (INFORMATION_SCHEMA.KEY_COLUMN_USAGE,
#     pg_constraint, etc.) at the moment the connector starts.
#
#     After a connector restart that re-fetches the source-DB metadata
#     in a different order, OR after a Connect runtime upgrade that
#     changes Struct field iteration, OR after a primary-key
#     reordering at the source, the same logical key serializes to
#     DIFFERENT bytes:
#
#       Struct{tenant_id=7,order_id=12345}  vs.
#       Struct{order_id=12345,tenant_id=7}
#
#     Log-compaction treats these as two DIFFERENT keys; both are
#     retained; the one-record-per-key guarantee is silently broken.
#     The topic grows unbounded with old keys that no longer match
#     any current row.
#
# (2) KTABLE JOINS SILENTLY RETURN EMPTY.
#
#     Kafka Streams' KTable<K,V>.join(KTable<K,V2>) requires byte-equal
#     keys. When THIS connector emits keys as the UTF-8 string
#     "Struct{order_id=12345}" and another connector (correctly
#     configured with AvroConverter) emits the same logical key as
#     Avro-encoded binary bytes for Struct{order_id=12345}, the
#     join's key-equality predicate returns FALSE for every record
#     pair. The join's output topic is empty. The downstream
#     enriched-orders pipeline silently stalls. Hours of debugging
#     ensue before someone notices the converter mismatch.
#
# (3) JDBC SINK pk.fields EXTRACTION THROWS IllegalArgumentException.
#
#     A downstream JDBC sink configured with pk.mode=record_key and
#     pk.fields=order_id deserializes the record key via its own
#     key.converter (which MUST match the source's converter to read
#     the same bytes). The deserialized key is a plain Java String,
#     NOT a Struct, so keyStruct.get('order_id') throws
#     IllegalArgumentException: cannot extract field order_id from
#     value of type String. Every record falls into the DLQ; the sink
#     stops applying upserts; downstream tables lag forever.
#
# (4) ELASTICSEARCH SINK DOCUMENT IDs BECOME UNUSABLE.
#
#     A downstream Elasticsearch sink with key.ignore=false uses the
#     record key as the Elasticsearch document _id. With
#     StringConverter on the key, the _id becomes the literal string
#     "Struct{order_id=12345}". URL-encoding rules treat {, }, =
#     as reserved characters; every search-API call requires careful
#     escaping. The _id is 20+ bytes per document instead of 5 (the
#     bare integer), inflating index size by 20–30%. After a
#     refactor renames the primary-key column from order_id to id,
#     every document's _id silently changes — every existing
#     document remains under the OLD _id, every new document gets a
#     NEW _id, and the index now contains two copies of every order.
#
# COMMON ROOT CAUSES:
#   (a) Copy-paste of value-side anti-pattern to key-side: 'I just used
#       the same converter for both, for consistency.'
#   (b) Helm chart with StringConverter default for key.converter (and
#       value.converter) at the WORKER level for 'simplicity'; the
#       connector inherits the worker default unless overridden.
#   (c) Operator set value.converter=AvroConverter (correctly) but
#       forgot to override key.converter from the worker-level default.
#   (d) Migration from a topic where the key was a plain String (e.g.,
#       a string-bus migration) without recognizing that Debezium emits
#       Structs on the key side.
#
# FIX:
#   key.converter = io.confluent.connect.avro.AvroConverter
#   key.converter.schema.registry.url = http://schema-registry:8081
#
# or for JSON-based pipelines:
#   key.converter = org.apache.kafka.connect.json.JsonConverter
#   key.converter.schemas.enable = true
#
# or for Protobuf-based pipelines:
#   key.converter = io.confluent.connect.protobuf.ProtobufConverter
#   key.converter.schema.registry.url = http://schema-registry:8081
# =============================================================================

name = postgres-orders-cdc
connector.class = io.debezium.connector.postgresql.PostgresConnector
tasks.max = 1

plugin.name = pgoutput
slot.name = orders_cdc_slot
publication.name = orders_cdc_pub

config.providers = file
config.providers.file.class = org.apache.kafka.common.config.provider.FileConfigProvider

database.hostname = postgres.prod.svc.cluster.local
database.port = 5432
database.user = debezium
database.password = ${file:/run/secrets/debezium.properties:password}
database.dbname = orders

topic.prefix = orders-cdc

table.include.list = public.order,public.order_line,public.shipment

# Value side is correctly configured with AvroConverter so the Debezium
# envelope Struct (before/after/source/op/ts_ms/transaction) serializes
# to a structured binary format that downstream consumers can parse.
value.converter = io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url = http://schema-registry:8081
value.converter.auto.register.schemas = false

# VIOLATION: key side uses StringConverter, which flattens the primary-key
# Struct (Struct{order_id=12345}) to a Java debug-format string. Every
# downstream consumer that needs to do log-compaction, KTable joins, sink
# pk.fields extraction, or Elasticsearch document-ID inference silently
# breaks from this line forward.
key.converter = org.apache.kafka.connect.storage.StringConverter
