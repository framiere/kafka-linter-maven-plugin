# =============================================================================
# A MirrorMaker 2 source-connector configuration where the operator has left
# `localhost` in BOTH `source.cluster.bootstrap.servers` AND
# `target.cluster.bootstrap.servers`. The .properties file was originally
# written against a local Docker-Compose dev stack (two brokers on the
# loopback interface at ports 19092 and 29092) and was committed to git
# without environment-specific updates.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#
#   connector.class                        = MirrorSourceConnector
#   source.cluster.bootstrap.servers       = localhost:19092
#   target.cluster.bootstrap.servers       = localhost:29092
#
# WHAT THESE KEYS ACTUALLY DO:
#
# Every MirrorMaker 2 connector — MirrorSourceConnector,
# MirrorCheckpointConnector, MirrorHeartbeatConnector — needs TWO Kafka
# clusters reachable from the Connect-worker host:
#
#   - The SOURCE cluster: the cluster being replicated FROM. The connector
#     opens an `AdminClient` and a `KafkaConsumer` (or, for the heartbeat
#     connector, only an `AdminClient`) against this cluster's bootstrap
#     servers. The consumer reads records from the matching topics; the
#     admin client periodically describes topics, configs, and ACLs.
#
#   - The TARGET cluster: the cluster being replicated TO. The connector
#     opens an `AdminClient` and a `KafkaProducer` against this cluster's
#     bootstrap servers. The producer writes the replicated records (or
#     the checkpoints, or the heartbeats) to the target cluster's topics;
#     the admin client creates topics on the target as needed.
#
# The two keys — `source.cluster.bootstrap.servers` and
# `target.cluster.bootstrap.servers` — are REQUIRED on every MM2 connector
# (no ConfigDef default). They take comma-separated `host:port,host:port`
# values; the values are passed through unchanged to the inner Kafka
# clients via `MirrorClientConfig.adminConfig()`,
# `MirrorSourceConfig.sourceConsumerConfig()`, and
# `MirrorSourceConfig.targetProducerConfig()`.
#
# THE LOOPBACK PROBLEM:
#
# `localhost`, `127.0.0.1`, and `0.0.0.0` are all LOOPBACK addresses. They
# resolve only to the loopback interface (lo0 on Linux, the equivalent on
# other OSs) of the HOST WHERE THE CONNECTOR IS RUNNING. In a production
# Connect-cluster deployment, the connector runs on:
#
#   - A Kubernetes pod in the Connect StatefulSet (one of several worker
#     pods).
#   - A VM dedicated to the Connect cluster.
#   - A bare-metal host running the Connect process.
#
# In every one of those deployment models, the Kafka brokers run on a
# DIFFERENT set of pods/VMs/hosts. The connector's loopback interface does
# NOT have a Kafka broker listening on any port. The TCP `connect()` to
# `localhost:9092` (or whatever port) returns `Connection refused`.
#
# WHAT HAPPENS AT RUNTIME:
#
# 1. The Connect framework starts the MM2 connector successfully — the
#    config parses, the connector-class is loaded, `Connector#start(props)`
#    runs without throwing. The connector reports `RUNNING` to the Connect
#    coordinator.
#
# 2. The connector's first task is created and assigned to a worker. The
#    task's `start()` constructs the inner Kafka clients (`AdminClient`,
#    `KafkaConsumer`, `KafkaProducer`).
#
# 3. Each inner Kafka client begins its bootstrap protocol. The client's
#    `NetworkClient.poll()` loop:
#      a. Selects one of the `host:port` pairs from `bootstrap.servers`.
#      b. Resolves the host via DNS (or NSS — `localhost` resolves
#         immediately to `127.0.0.1`).
#      c. Opens a TCP connection to the resolved address.
#      d. If the connection fails (`Connection refused` — no listener on
#         the loopback at the configured port), schedule the next attempt
#         with exponential backoff (`reconnect.backoff.ms`,
#         `reconnect.backoff.max.ms`).
#      e. After the backoff, retry. Forever.
#
# 4. The client never receives a `MetadataResponse`. `Producer#send()` and
#    `Consumer#poll()` calls block on `max.block.ms` (default 60 000 ms)
#    and then throw `TimeoutException`. The MM2 task logs the timeout but
#    is re-invoked by the Connect runtime; the cycle repeats indefinitely.
#
# 5. The Connect REST API reports the task as `RUNNING` (because the task's
#    main thread is alive and doing work — namely, retrying). The connector
#    occupies a Connect-cluster task slot but does NOTHING useful. The
#    `MetadataRequest`-failure log lines accumulate but no alarm fires
#    unless the operator has configured one specifically for them.
#
# HOW THE LOOPBACK ADDRESS ENDS UP IN PRODUCTION:
#
# (a) **Dev-to-prod leak via git.** Developer set up a local Docker-Compose
#     stack with two brokers exposed at `localhost:19092` (the "primary"
#     cluster) and `localhost:29092` (the "DR" cluster). They wrote the
#     .properties file against this dev stack, tested replication locally,
#     committed the file to git. The deployment pipeline picks up the same
#     file for production; no value replacement happens; the connector
#     starts in prod and immediately fails its bootstrap. This is THIS
#     FIXTURE.
#
# (b) **Helm-chart placeholder default.** Org's Helm chart for MM2 has a
#     default in `values.yaml` of `sourceClusterBootstrapServers:
#     "localhost:9092"` that was set by the original author 'as a
#     placeholder until you override in your environment values.yaml'.
#     The first production team to use the chart did not override the
#     value (assumed it would default to something safe like an empty
#     string that would fail validation); the chart renders the
#     .properties with the localhost address. The connector starts; the
#     bootstrap fails; the team is paged.
#
# (c) **Tutorial copy-paste.** The Confluent MM2 quick-start tutorial uses
#     `localhost:9092` and `localhost:9093` throughout (the tutorial walks
#     through running everything on the operator's laptop). The team's
#     first MM2 deployment is bootstrapped from the tutorial. The team
#     replaces the source bootstrap with the production source-cluster
#     address but forgets the target bootstrap (the tutorial used
#     different ports for source and target; the operator only saw the
#     first one and changed only that). The connector bootstraps against
#     the source successfully but cannot reach the target; replication
#     never happens.
#
# (d) **Network-namespace confusion in Kubernetes.** Developer thinks the
#     MM2 connector pod and the Kafka broker pods share a network
#     namespace; they expect `localhost` to resolve to the Kafka broker.
#     In reality, the connector runs in a Connect-cluster pod separate
#     from the Kafka StatefulSet pods; `localhost` resolves to the
#     connector pod's own loopback. The team learns about Kubernetes
#     networking the hard way.
#
# THE FIX:
#
# Replace the loopback addresses with the actual broker hostnames reachable
# from the Connect-worker host:
#
#   source.cluster.bootstrap.servers=primary-kafka.internal:9093
#   target.cluster.bootstrap.servers=dr-kafka.internal:9093
#
# Recommended practice — externalize via a Connect `ConfigProvider` so the
# .properties file never contains environment-specific hostnames:
#
#   config.providers=env
#   config.providers.env.class=org.apache.kafka.connect.config.provider.EnvVarConfigProvider
#   source.cluster.bootstrap.servers=${env:SOURCE_BOOTSTRAP_SERVERS}
#   target.cluster.bootstrap.servers=${env:TARGET_BOOTSTRAP_SERVERS}
#
# The same .properties file then runs unmodified across dev/stage/prod —
# the environment variables provide the per-environment values.
#
# =============================================================================

name=mm2-source
connector.class=org.apache.kafka.connect.mirror.MirrorSourceConnector
tasks.max=4

source.cluster.alias=primary
target.cluster.alias=dr

# VIOLATION: source.cluster.bootstrap.servers points at the loopback. In
# production, the MM2 connector runs on a Connect-worker host that is NOT
# also a Kafka broker; the loopback has no broker; the inner Kafka client's
# bootstrap fails with `Connection refused`; the connector retries
# indefinitely without ever replicating a record. Fix: replace with the
# actual primary-cluster broker hostnames (e.g., primary-kafka.internal:9093).
source.cluster.bootstrap.servers=localhost:19092

# VIOLATION: target.cluster.bootstrap.servers also points at the loopback.
# Same failure mode on the producer side; the connector's KafkaProducer
# against the target cluster cannot bootstrap.
target.cluster.bootstrap.servers=127.0.0.1:29092

topics=orders\\..*,payments\\..*
groups=.*

replication.factor=3
offset-syncs.topic.replication.factor=3
heartbeats.topic.replication.factor=3
checkpoints.topic.replication.factor=3

refresh.topics.interval.seconds=600
