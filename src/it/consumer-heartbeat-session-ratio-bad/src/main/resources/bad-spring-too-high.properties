# RULE: CONSUMER_HEARTBEAT_SESSION_RATIO — Spring family, ratio out by 50%.
#
# heartbeat * 3 = 15000, session = 10000. The consumer rebalances on any
# blip; in a saturated GC scenario it can rebalance every minute.

spring.kafka.bootstrap-servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
spring.kafka.consumer.group-id=orders-processor
spring.kafka.consumer.client-id=bad-spring-too-high
spring.kafka.consumer.properties.heartbeat.interval.ms=5000
spring.kafka.consumer.properties.session.timeout.ms=10000
