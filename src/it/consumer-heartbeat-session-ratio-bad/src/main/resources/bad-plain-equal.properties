# RULE: CONSUMER_HEARTBEAT_SESSION_RATIO.
#
# Why this fires:
# The rule's safety margin is "heartbeat * 3 < session". With heartbeat=3000
# and session=9000 the product is exactly equal (9000 == 9000), so the
# strict-less-than check fails and the rule fires.
#
# Why the margin needs to be strict:
# The group coordinator only marks a consumer dead after session.timeout.ms
# has elapsed since the LAST received heartbeat. Under normal jitter
# (GC pause, network blip, scheduling delay) the consumer routinely
# misses ONE heartbeat. If heartbeat * 3 is below session, two heartbeats
# in a row can be lost before the third still slips in under the wire.
# If heartbeat * 3 equals session, missing one heartbeat consumes 2/3 of
# the budget and any latency in the next heartbeat tips over the edge,
# triggering an unwanted rebalance.
#
# A rebalance under steady-state load is expensive: every consumer in
# the group stops processing while assignments are recomputed; in-flight
# uncommitted work is replayed when the new owner picks up the partition;
# downstream sinks see batch-size hiccups. So the margin matters.

bootstrap.servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
group.id=orders-processor
client.id=bad-plain-equal
heartbeat.interval.ms=3000
session.timeout.ms=9000
