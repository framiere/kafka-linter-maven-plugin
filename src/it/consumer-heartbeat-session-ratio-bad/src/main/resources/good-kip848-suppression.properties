# Silent: ratio is wrong (heartbeat*3=15000 > session=10000) BUT
# group.protocol=consumer (KIP-848) is set, which switches the consumer
# to broker-driven heartbeats. In that mode the broker controls cadence
# and the client-side heartbeat.interval.ms is informational at best —
# the client-side ratio is no longer load-bearing.
#
# The rule explicitly suppresses on group.protocol=consumer to avoid
# nagging operators who have migrated to KIP-848.

bootstrap.servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
group.id=orders-processor
client.id=good-kip848-suppression
group.protocol=consumer
heartbeat.interval.ms=5000
session.timeout.ms=10000
