# Silent: only heartbeat.interval.ms is set, session.timeout.ms is absent.
# The rule needs BOTH values present to compute the ratio. With session
# missing, the broker default (45000 ms in 3.x) applies — the rule
# does not assume defaults; it only fires when both sides of the ratio
# are explicitly set in the properties file.

bootstrap.servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
group.id=orders-processor
client.id=good-only-heartbeat
heartbeat.interval.ms=3000
