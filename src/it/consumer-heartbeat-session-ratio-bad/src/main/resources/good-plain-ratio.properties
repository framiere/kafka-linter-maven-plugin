# Silent: heartbeat=3000, session=30000 — heartbeat * 3 = 9000 < 30000.
# Three full heartbeats can be lost before the coordinator considers
# the consumer dead, which leaves ample headroom for GC, network blips,
# and scheduler delays.

bootstrap.servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
group.id=orders-processor
client.id=good-plain-ratio
heartbeat.interval.ms=3000
session.timeout.ms=30000
