# RULE: CONSUMER_HEARTBEAT_SESSION_RATIO.
#
# Why this fires:
# heartbeat=5000 ms, session=10000 ms. Product 5000*3=15000 is well above
# 10000, so a single missed heartbeat consumes 50% of the session budget
# and the next heartbeat lands AFTER the session has already expired
# from the coordinator's point of view. Result: the coordinator evicts
# the consumer, triggers a rebalance, and the consumer rejoins —
# all without anything actually being wrong on the consumer side.

bootstrap.servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
group.id=orders-processor
client.id=bad-plain-too-high
heartbeat.interval.ms=5000
session.timeout.ms=10000
