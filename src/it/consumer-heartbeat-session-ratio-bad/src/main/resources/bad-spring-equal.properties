# RULE: CONSUMER_HEARTBEAT_SESSION_RATIO — Spring Boot key family.
#
# Same as bad-plain-equal but using Spring Boot's prefix convention.
# Spring Boot's application.properties surface for arbitrary Kafka
# consumer properties is the prefix "spring.kafka.consumer.properties." —
# anything after that prefix is passed through verbatim to the underlying
# org.apache.kafka.clients.consumer.KafkaConsumer config map.
#
# The rule treats these two key families as independent and checks both
# in every properties file. A properties file mixing both families would
# fire twice. This file uses only the Spring family.

spring.kafka.bootstrap-servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
spring.kafka.consumer.group-id=orders-processor
spring.kafka.consumer.client-id=bad-spring-equal
spring.kafka.consumer.properties.heartbeat.interval.ms=3000
spring.kafka.consumer.properties.session.timeout.ms=9000
