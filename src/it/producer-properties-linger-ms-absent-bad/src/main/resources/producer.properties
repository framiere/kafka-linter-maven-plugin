# RULE: PRODUCER_PROPERTIES_LINGER_MS_ABSENT.
#
# This producer config is otherwise production-ready:
#   - acks=all                         (durability)
#   - enable.idempotence=true          (no duplicates on retry)
#   - compression.type=zstd            (compressed batches)
#   - batch.size=131072                (128 KiB batches)
#
# ...but it never sets `linger.ms`. kafka-clients defaults `linger.ms` to
# `0` — the producer's accumulator sends partial batches AS SOON as the
# sender thread sees them, meaning every record becomes its own
# ProduceRequest on a steady stream of small records.
#
# Concrete cost of leaving this implicit:
#   - 10-100× more ProduceRequests per second than a 5-20 ms linger would
#     produce.
#   - Broker CPU dominated by per-request handling overhead.
#   - Broker network dominated by per-batch protocol framing (record-batch
#     headers, TCP packet boundaries, kafka protocol framing).
#   - Cluster scaling decisions made based on producer-driven REQUEST
#     rate, not actual record-byte throughput — meaning brokers are
#     scaled out for the wrong reason.
#
# The `batch.size=131072` knob in this file is a CAP, not a TARGET — with
# `linger.ms=0`, batches ship at whatever size they happen to be when the
# sender polls (often a single record), even though they're allowed to
# grow up to 128 KiB. Setting `linger.ms=5` (or 20) gives the accumulator
# a window to ACTUALLY fill those batches.
#
# Discovery shape: cluster is 'saturated', brokers report high CPU and
# high request rate, but record-byte throughput is mediocre. SRE doubles
# the broker count; the same producers continue at 1-record-per-request
# so the broker load doubles too. The root cause — absent `linger.ms` on
# the producer side — never gets diagnosed without static analysis.
#
# Fix: ONE LINE. Add `linger.ms=20` (recommended general default) or
# `linger.ms=5` (smallest non-zero value with measurable benefit), or
# `linger.ms=0` EXPLICITLY with a comment documenting why latency-
# criticality outweighs the throughput cost.
bootstrap.servers=kafka-1.prod.example.com:9092
client.id=bad-no-linger-producer
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=org.apache.kafka.common.serialization.StringSerializer
acks=all
enable.idempotence=true
compression.type=zstd
batch.size=131072
buffer.memory=33554432
