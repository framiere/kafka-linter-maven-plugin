# RULE: PRODUCER_PROPERTIES_DELIVERY_TIMEOUT_MS_ABSENT.
#
# This producer config is otherwise production-quality:
#   - acks=all                        (durability)
#   - enable.idempotence=true         (no duplicates on retry)
#   - compression.type=zstd           (compressed batches)
#   - linger.ms=20                    (batching window opened)
#   - batch.size=65536                (64 KiB)
#   - buffer.memory=33554432          (32 MiB explicit)
#
# ...but it never sets `delivery.timeout.ms`. kafka-clients defaults
# `delivery.timeout.ms` to `120000` (2 minutes).
#
# Why this matters: `delivery.timeout.ms` is the TOTAL retry budget
# for one record — wall-clock cap on `send()`-to-callback, covering
# `linger.ms` + `request.timeout.ms` + every retry attempt. The
# default 120s is a deliberate compromise but the right answer is
# workload-dependent:
#
#   (a) TOO LONG for a latency-sensitive synchronous path. If an
#       HTTP handler calls `producer.send(record).get()` to wait for
#       the broker ack, a stalled partition will block that thread
#       for 120s — long past any sensible HTTP timeout. The upstream
#       HTTP client gave up at 30s but the worker thread is still
#       hung. Setting `delivery.timeout.ms=10000` makes the producer
#       give up early enough for the application's retry layer to
#       take over.
#
#   (b) TOO SHORT for a bulk pipeline tolerating long outages. A
#       nightly batch writing 100 GB over 6 hours expects the
#       cluster to occasionally have 20-minute planned-failover
#       windows. With default 120s, every failover fails ~10% of
#       the batch with TimeoutException, requiring an app-layer
#       retry pass. Setting `delivery.timeout.ms=3600000` (1 hour)
#       absorbs the outages cleanly.
#
# Concrete failure mode for case (a):
#   - HTTP API receives a request that calls producer.send().get()
#   - Partition leader fails over (30s recovery time)
#   - send() blocks for full 120s (default delivery.timeout.ms)
#   - Upstream HTTP client timed out at 30s and gave up
#   - Worker thread pool is exhausted by stuck requests
#   - Service degrades; operators see "Kafka producer slow" in dashboards
#   - Root cause is the producer's own retry budget, not the broker
#
# INFO severity (not WARNING/ERROR) because the default is defensible
# for typical workloads — the rule is a 'have you thought about your
# retry budget?' nudge. Raised here to ERROR by config override so the
# IT fixture demonstrates the violation deterministically.
#
# Fix: ONE LINE. Add `delivery.timeout.ms=10000` for a latency-
# sensitive path, or `delivery.timeout.ms=3600000` for a bulk
# pipeline, or `delivery.timeout.ms=120000` EXPLICITLY to document
# that the default was deliberately chosen.
bootstrap.servers=kafka-1.prod.example.com:9092
client.id=bad-no-delivery-timeout-producer
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=org.apache.kafka.common.serialization.StringSerializer
acks=all
enable.idempotence=true
compression.type=zstd
linger.ms=20
batch.size=65536
buffer.memory=33554432
