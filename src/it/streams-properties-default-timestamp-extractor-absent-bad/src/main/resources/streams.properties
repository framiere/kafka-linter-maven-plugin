# =============================================================================
# IT fixture: STREAMS_PROPERTIES_DEFAULT_TIMESTAMP_EXTRACTOR_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A Kafka Streams .properties file destined for `new StreamsConfig(props)`.
#   It declares a complete production-quality Streams config for a CDC
#   REPLAY-PROCESSING topology — consumes from a Debezium-MySQL-emitted
#   CDC topic mirrored from a remote cluster via MirrorMaker2, processes
#   each row-change event (INSERT/UPDATE/DELETE), and emits a normalized
#   event stream for downstream analytics. Every other Streams knob is
#   set correctly — application.id, bootstrap.servers, default serdes,
#   processing guarantee, replication factor, min.insync.replicas,
#   num.standby.replicas, num.stream.threads, commit.interval.ms,
#   state.dir, both exception handlers, topology.optimization=all,
#   max.task.idle.ms, AND `task.timeout.ms=1800000` (30 min for
#   prolonged-outage tolerance on the cross-cluster MirrorMaker2 path).
#   Everything is set correctly EXCEPT `default.timestamp.extractor`
#   is not set anywhere.
#
# What's wrong
#   `org.apache.kafka.streams.StreamsConfig.DEFAULT_TIMESTAMP_EXTRACTOR_
#   CLASS_CONFIG` declares `default.timestamp.extractor` with:
#
#     ConfigDef.Type.CLASS,
#     default = org.apache.kafka.streams.processor.FailOnInvalidTimestamp,
#     importance = MEDIUM
#
#   The default's contract: for every record polled from a source
#   topic, the extractor returns `record.timestamp()` if `>= 0`;
#   otherwise throws `StreamsException("Input record has invalid
#   (negative) timestamp")`. The exception propagates through the
#   StreamThread to the configured `Thread.UncaughtExceptionHandler`
#   (default `SHUTDOWN_CLIENT` — kills the entire KafkaStreams
#   instance).
#
#   The 5 built-in / canonical TimestampExtractor implementations:
#
#     (1) FailOnInvalidTimestamp (default) — throws on timestamp < 0.
#     (2) LogAndSkipOnInvalidTimestamp — logs WARN, returns -1 to
#         skip the record (incrementing `dropped-records` metric).
#     (3) UsePreviousTimeOnInvalidTimestamp — returns the timestamp
#         of the previously processed valid record (preserves causal
#         ordering for windowed operations).
#     (4) WallclockTimestampExtractor — IGNORES record.timestamp()
#         entirely; returns System.currentTimeMillis() (useful for
#         IoT/sensor data where broker arrival time IS the event
#         time).
#     (5) Custom — operator-implemented to extract timestamps from a
#         field within the record value (typical for CDC and event-
#         sourcing where the event time is in the payload, not the
#         Kafka envelope).
#
# This fixture's specific risk
#   THIS topology consumes a Debezium-MySQL-emitted CDC topic mirrored
#   from a remote cluster via MirrorMaker2. THREE distinct failure
#   shapes apply at once:
#
#     (a) MirrorMaker2 preserves the original `-1` timestamps for
#         pre-0.10-format records emitted by an older Debezium
#         version on the source cluster. The first such record
#         crashes the StreamThread.
#
#     (b) Debezium's MySQL connector emits records with `record.
#         timestamp = transaction_commit_ts`. For some source DB
#         configurations (binlog_row_image=MINIMAL, row-based binlog
#         without timestamps), commit time may be missing; Debezium
#         falls back to `-1`. The first such record crashes the
#         topology.
#
#     (c) Even when records have valid envelope timestamps, the
#         envelope timestamp is the BROKER ARRIVAL TIME (when
#         MirrorMaker2 wrote the record to the local cluster) — NOT
#         the source DB commit time. The CDC payload's `source.ts_ms`
#         field is the true event time. Windowed analytics that
#         group by 1-hour tumbling windows will be silently WRONG
#         because the window boundaries reflect MirrorMaker2's
#         batching cadence, not the source DB's commit timeline.
#
# Why this is "INFO" by default (not WARNING or ERROR)
#   (a) For Kafka-native producers writing to LogAppendTime-typed
#       topics (the majority of production Streams workloads), the
#       default `FailOnInvalidTimestamp` is the right answer — the
#       broker guarantees valid timestamps, so the fail-on-invalid
#       posture catches legitimate bugs (e.g., a producer that was
#       mis-configured to not set timestamps).
#
#   (b) The right NON-default extractor is workload-dependent — Log
#       AndSkip for replay/CDC resilience, Wallclock for IoT,
#       Custom for event-sourcing — and the linter cannot infer the
#       workload character from .properties alone.
#
#   (c) The bug shape splits into (i) loud crash (the fail-fast
#       default catches the bug at the first invalid-timestamp
#       record — actually informative), and (ii) silent wrong-output
#       (when the operator should have implemented a custom extractor
#       to pull the event time from a value field, but the envelope
#       timestamp is still valid, so no crash — the analytics are
#       just wrong).
#
#   INFO is the right level: surfaces the missing knob and prompts
#   a deliberate workload-specific choice without false-alarming
#   the Kafka-native-LogAppendTime-typed-topics workloads.
#
#   This IT overrides severity to ERROR via pom.xml configuration to
#   force the build to fail and verify the rule fires.
#
# Common bug shapes
#   (1) MirrorMaker2 mirroring records from older source cluster.
#       Records with `timestamp=-1` (from a legacy producer on the
#       source cluster that never set timestamps) are mirrored over;
#       the Streams topology runs fine until a single such record
#       arrives, then `FailOnInvalidTimestamp` throws and the
#       StreamThread dies. The topology enters CrashLoopBackOff
#       until the bad record's offset is manually advanced past.
#       Setting `default.timestamp.extractor=LogAndSkipOnInvalid
#       Timestamp` makes the topology skip-and-alert instead.
#
#   (2) Debezium MySQL connector source-DB commit-time missing.
#       The source MySQL is configured with `binlog_row_image=
#       MINIMAL`; Debezium can't extract the commit time; falls
#       back to `record.timestamp=-1`. Downstream Streams crashes.
#       Fix: implement a custom extractor that pulls the timestamp
#       from the CDC payload's `source.ts_ms` field (which is
#       always populated by Debezium even when the binlog doesn't
#       have a commit time).
#
#   (3) Silent windowing-correctness bug.
#       The CDC topology uses `KStream.groupByKey().windowedBy(
#       TimeWindows.of(Duration.ofHours(1))).aggregate(...)` to
#       compute hourly row-change counts per primary key. With the
#       default extractor, the window key is derived from the Kafka
#       envelope timestamp (MirrorMaker2 arrival time, which lags
#       source DB commit by 2-15 minutes due to MirrorMaker2's
#       batching). The 09:00-10:00 window actually contains source
#       DB row-changes from 08:45-09:55 (with the MirrorMaker2 lag).
#       The bug is silent: the topology works, analytics emit, but
#       the per-hour counts are skewed by the mirror-lag distribution.
#       Fix: implement a custom extractor that reads `source.ts_ms`
#       from the Debezium payload.
#
#   (4) Replay tool re-publishing historical archives.
#       The operator periodically runs a replay tool that
#       re-publishes records from a long-term S3 archive to a
#       'replay' topic. The replay tool preserves the original
#       `timestamp=-1` for any pre-0.10-format records. The
#       Streams topology crashes on the first such record. Fix:
#       LogAndSkipOnInvalidTimestamp.
#
#   (5) Schema-registry-driven Avro payload — event_time in field.
#       The CDC payload is Avro-encoded with a top-level
#       `event_time` field (epoch-millis). The Kafka envelope
#       timestamp is the producer-side wall-clock (which differs
#       from the event_time by the producer's batching latency).
#       Windowed analytics should use event_time, not the envelope.
#       Operator must implement a custom extractor.
#
#   (6) Spring Boot Streams autoconfig — org-wide default leaks.
#       Spring Boot's Streams autoconfiguration (`spring-kafka`)
#       provides a `KafkaStreamsConfiguration` bean from
#       `application.yml`. The default Spring template DOES NOT
#       include `default.timestamp.extractor`. Every Spring Boot
#       Streams app inherits the framework default `FailOnInvalid
#       Timestamp`. For an org with diverse workloads (some need
#       fail-fast on Kafka-native sources, some need skip-and-alert
#       on replay/CDC, some need wall-clock for IoT, some need
#       custom for event-sourcing), the org-wide default-leak
#       masks workload-specific tuning.
#
# Fix
#   ONE LINE. For Kafka-native producers writing to LogAppendTime-
#   typed topics (typical-production case):
#     default.timestamp.extractor=org.apache.kafka.streams.processor.FailOnInvalidTimestamp
#                                  # Explicit default — documents
#                                  # the deliberate choice;
#                                  # insulates from future
#                                  # framework default changes.
#
#   For replay / CDC / MirrorMaker2-mirrored / custom-transformed
#   sources:
#     default.timestamp.extractor=org.apache.kafka.streams.processor.LogAndSkipOnInvalidTimestamp
#                                  # Skip-and-alert instead of
#                                  # crash on invalid timestamps.
#
#   For windowing causality on intermittently-invalid timestamps:
#     default.timestamp.extractor=org.apache.kafka.streams.processor.UsePreviousTimeOnInvalidTimestamp
#                                  # Returns the previously
#                                  # processed valid record's
#                                  # timestamp on invalid.
#
#   For IoT/sensor or ingestion-time-windowed analytics:
#     default.timestamp.extractor=org.apache.kafka.streams.processor.WallclockTimestampExtractor
#                                  # Broker arrival time IS the
#                                  # event time.
#
#   For event-sourcing with explicit event_time field (THIS app's
#   case — Debezium CDC with source.ts_ms in payload):
#     default.timestamp.extractor=com.example.streams.DebeziumSourceTsMsExtractor
#                                  # Custom — pulls timestamp from
#                                  # the deserialized value's
#                                  # source.ts_ms field.
#
# Sibling rule
#   `STREAMS_PROPERTIES_MAX_TASK_IDLE_MS_ABSENT` catches the absent
#   case for the multi-source-ordering knob. The two rules form a
#   pair: `max.task.idle.ms` governs how the StreamThread
#   INTERLEAVES records from multiple source partitions by their
#   extracted timestamps; `default.timestamp.extractor` governs
#   HOW the timestamps are extracted in the first place. Both
#   make sense only in the context of each other.
# =============================================================================

application.id=cdc-orders-replay-normalizer-stream
bootstrap.servers=broker-1.kafka.prod.example.com:9092,broker-2.kafka.prod.example.com:9092,broker-3.kafka.prod.example.com:9092

# Default serdes used by topology operators that don't pass explicit
# Consumed/Produced/Materialized/Grouped.
default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
default.value.serde=io.confluent.kafka.streams.serdes.avro.SpecificAvroSerde

# Internal-topic durability (replication factor for changelog + repartition topics).
replication.factor=3
min.insync.replicas=2

# Throughput & latency.
num.stream.threads=6
commit.interval.ms=5000

# HA for stateful tasks — 1 warm copy of every state-store partition.
num.standby.replicas=1

# At-least-once with explicit commit cadence (CDC replay-processing,
# downstream is idempotent on primary-key).
processing.guarantee=at_least_once

# State-store location (outside /tmp; survives container restarts when mounted as a volume).
state.dir=/var/lib/kafka-streams/cdc-orders-replay-normalizer

# Internal-topic-layout consolidation (KIP-295 / KIP-862).
topology.optimization=all

# Exception handlers — both set, so the existing handler-absent rules don't fire.
default.deserialization.exception.handler=org.apache.kafka.streams.errors.LogAndContinueExceptionHandler
default.production.exception.handler=org.apache.kafka.streams.errors.LogAndContinueProductionExceptionHandler

# Schema registry (Confluent Avro deserializer dependency).
schema.registry.url=http://schema-registry.kafka.prod.example.com:8081

# This is a CDC replay topology (single source, no joins) — `max.task.idle.ms=0`
# is the right value; set EXPLICITLY to isolate from
# STREAMS_PROPERTIES_MAX_TASK_IDLE_MS_ABSENT.
max.task.idle.ms=0

# 30-min retry budget — accommodates the MirrorMaker2-source-cluster
# round-trip outage envelope (controller failover on remote, cross-AZ
# partitions). Set EXPLICITLY to isolate from
# STREAMS_PROPERTIES_TASK_TIMEOUT_MS_ABSENT.
task.timeout.ms=1800000

