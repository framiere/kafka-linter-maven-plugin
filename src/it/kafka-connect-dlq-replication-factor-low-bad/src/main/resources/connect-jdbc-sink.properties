name=jdbc-sink-orders
connector.class=io.confluent.connect.jdbc.JdbcSinkConnector
tasks.max=2

topics=orders

connection.url=jdbc:postgresql://db.internal:5432/orders
connection.user=connect
connection.password=secret
insert.mode=upsert
pk.mode=record_key
pk.fields=order_id

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081

# DLQ is configured (good!) but with replication factor 1 (bad).
# Any broker outage that contains the DLQ leader makes the recovery path
# unavailable — exactly when the operator most needs it. The DLQ is
# low-volume; the storage cost of RF=3 vs RF=1 is negligible.
errors.tolerance=all
errors.deadletterqueue.topic.name=jdbc-sink-dlq
errors.deadletterqueue.topic.replication.factor=1
errors.deadletterqueue.context.headers.enable=true
errors.log.enable=true
errors.log.include.messages=true
