name=debezium-inventory
connector.class=io.debezium.connector.mysql.MySqlConnector
tasks.max=1

database.hostname=inventory-db.internal
database.port=3306
database.user=debezium
database.password=changeme
database.server.id=10001
database.include.list=inventory
topic.prefix=cdc.inventory

schema.history.internal.kafka.topic=cdc.inventory.schema-history
schema.history.internal.kafka.bootstrap.servers=kafka:9092

table.include.list=inventory.customers,inventory.orders
snapshot.mode=initial

# Anti-pattern: Debezium emits SourceRecord keys as Kafka Connect Struct
# instances containing the source row's primary-key columns. ByteArrayConverter's
# fromConnectData(...) is a single `(byte[]) value` cast — there is no
# Struct-handling branch. On the FIRST captured row, the task throws
# ClassCastException: Struct cannot be cast to [B and transitions to FAILED.
# Connect's REST status surfaces the failure but the connector-level state
# remains RUNNING (only the inner task is FAILED), so operators initially
# miss it. Zero change-events reach Kafka until the converter is fixed.
key.converter=org.apache.kafka.connect.converters.ByteArrayConverter
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
