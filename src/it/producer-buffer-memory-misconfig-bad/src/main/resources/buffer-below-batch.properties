# RULE: PRODUCER_BUFFER_MEMORY_MISCONFIG — sub-case 1: buffer.memory < batch.size.
#
# Detection: rule reads buffer.memory and batch.size, compares numerically.
# When buffer.memory is smaller than a single batch's worth of bytes, the
# accumulator simply cannot allocate even one batch — every send() hits the
# back-pressure path (waits up to max.block.ms, then throws TimeoutException
# "Expiring N records").
#
# Production failure mode: producer never actually publishes anything. Logs
# fill with "expired due to buffer exhausted before batch was ready" errors.
# Looks like a slow broker but is actually a client-side starvation bug.
#
# Fix: buffer.memory must be at least batch.size × (partitions actively written)
# with headroom — practically, leave buffer.memory at the 32 MiB default and
# size batch.size to fit (default 16 KiB is correct for most workloads).

# 8 KiB buffer — smaller than one batch.
buffer.memory=8192
# 16 KiB batch (the kafka-clients default for batch.size).
batch.size=16384
