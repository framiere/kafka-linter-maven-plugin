# RULE: PRODUCER_BUFFER_MEMORY_MISCONFIG — sub-case 2: buffer.memory absurdly small.
#
# Detection: buffer.memory < 1 MiB. The rule fires AFTER the buffer-below-batch
# check, so this case only triggers when batch.size is absent (the rule's
# findFirst returns null for batch) or when buffer.memory >= batch.size but is
# still under 1 MiB. With no batch.size set here, the order is:
#   1. buffer < batch?  no, batch is null  -> next check
#   2. buffer < 1 MiB?  yes (524288 < 1048576) -> fire
#
# Why 1 MiB is the floor: kafka-clients default is 32 MiB (33554432). Anything
# below 1 MiB is so small that any traffic spike — even just bringing the
# producer up — will fill the accumulator and cause send() to time out. The
# rule treats < 1 MiB as a category of misconfig distinct from "lower than
# batch.size" because the failure mode in production is the same: chronic
# back-pressure and Expiring N records.

# 512 KiB — below the 1 MiB floor.
buffer.memory=524288
