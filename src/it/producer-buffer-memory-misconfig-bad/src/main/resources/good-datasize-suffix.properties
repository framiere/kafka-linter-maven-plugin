# Control for PRODUCER_BUFFER_MEMORY_MISCONFIG — Spring DataSize suffix.
#
# The rule uses Long.parseLong on the trimmed property value. A Spring DataSize
# literal like "32MB" is intentionally OUT OF SCOPE — Long.parseLong throws
# NumberFormatException and the rule's catch block falls through to "no buffer
# found", which short-circuits the check (no buffer → no rule). This file
# proves the silent-skip path: even though "32MB" semantically means 32 MiB
# (which IS valid), the rule does not try to parse the suffix and emits no
# violation either way.

spring.kafka.producer.buffer-memory=32MB
