# RULE: PRODUCER_BUFFER_MEMORY_MISCONFIG — sub-case 3: buffer.memory absurdly large.
#
# Detection: buffer.memory > 1 GiB (1073741824). The rule fires AFTER the
# buffer < batch check and AFTER the buffer < 1 MiB check (both of which fall
# through here), so this case is the final guard.
#
# Why > 1 GiB is bad:
#   - The accumulator memory is OFF-HEAP-LIKE in spirit but lives on the JVM
#     heap (kafka-clients allocates `byte[]` for record batches). 2 GiB pinned
#     for record buffering is heap that the rest of the application can't use.
#   - GC pauses lengthen with heap size. A 4 GiB heap that's 50% record buffer
#     spends more time in stop-the-world collections than a 1 GiB heap.
#   - If the producer process crashes (OOM, panic, kill -9), the records
#     buffered but not yet acked are LOST. 1+ GiB of unacked records is a
#     much bigger data-loss event than 32 MiB.
#   - It usually signals the wrong fix to a real problem. "Sends were timing
#     out, so I bumped buffer.memory" — the real fix is almost always to tune
#     batch.size, linger.ms, or max.in.flight to match the broker's throughput,
#     not to dump more bytes into the accumulator.
#
# 2 GiB — pathological.

buffer.memory=2147483648
