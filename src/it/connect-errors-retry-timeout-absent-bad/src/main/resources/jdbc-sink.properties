# =============================================================================
# IT fixture: CONNECT_ERRORS_RETRY_TIMEOUT_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A Kafka Connect SINK connector .properties file for the Confluent JDBC sink
#   writing to a PostgreSQL OLTP database. The file declares a complete
#   production-quality JDBC-sink config: connector.class, name, topics,
#   tasks.max=6 (parallelism for a 6-partition topic), JDBC coordinates,
#   insert.mode=upsert with PK fields, batch.size, auto-creation policies,
#   schema-registry-backed AvroConverter on the value, `errors.tolerance=all`,
#   a FULL DLQ stanza (topic name, replication factor, context-headers
#   enabled), AND both observability channels (`errors.log.enable=true` and
#   `errors.log.include.messages=true`) — EXCEPT `errors.retry.timeout` is
#   not set anywhere.
#
# What's wrong
#   Kafka Connect's `org.apache.kafka.connect.runtime.ConnectorConfig.
#   ERRORS_RETRY_TIMEOUT_CONFIG` declares `errors.retry.timeout` with:
#
#     ConfigDef.Type.LONG, default = 0, importance = MEDIUM
#
#   With value `0`, the framework's `RetryWithToleranceOperator` performs
#   NO retries at all on retriable failures. The first transient broker-
#   side error, downstream-system blip, network jitter, or schema-registry
#   timeout is treated as a TERMINAL failure: the record goes straight to
#   the `errors.tolerance` decision — FAIL the task under `none`, route
#   to DLQ under `all`.
#
#   KIP-298 (Apache Kafka 2.0, July 2018) introduced this knob alongside
#   `errors.tolerance` specifically so retriable errors could be handled
#   gracefully. The retry-with-tolerance contract is TWO-STAGED:
#
#     Stage 1 — RETRY for up to `errors.retry.timeout` ms with exponential
#               backoff (capped per-attempt by `errors.retry.delay.max.ms`,
#               default 60000).
#     Stage 2 — ONLY after exhausting the retry budget does the `errors.
#               tolerance` policy apply (FAIL the task or route to DLQ).
#
#   With `errors.retry.timeout=0` (the default), Stage 1 is skipped entirely.
#   Every transient failure is treated as terminal.
#
# Why this is "INFO" by default (not WARNING or ERROR)
#   (a) For FAIL-FAST workloads (financial reconciliation, ledger writes,
#       regulatory CDC), the default `0` is the correct choice — operators
#       deliberately want retriable errors to halt the task and page on-
#       call immediately rather than silently retrying and masking the
#       underlying issue. The plugin can't infer the workload character.
#
#   (b) The right NON-ZERO value is also workload-dependent — 60 s for
#       typical sinks; 5 min for MirrorMaker 2 replication (must absorb
#       full rolling-broker-restart windows); -1 (infinite) for never-
#       drop-a-record connectors paired with health-check monitoring.
#
#   (c) INFO is the right level: surfaces the missing knob and prompts a
#       deliberate choice without false-alarming the fail-fast workloads.
#
#   This IT overrides severity to ERROR via pom.xml configuration to force
#   the build to fail and verify the rule fires.
#
# Common bug shapes
#   (1) S3 sink, single transient 5xx fills DLQ.
#       AWS S3 returns a 1-in-10000 transient 503 SlowDown. With
#       `errors.retry.timeout=0` + `errors.tolerance=all`, the record
#       routes to the DLQ on the FIRST failure; over a week the DLQ
#       accumulates thousands of records that would have succeeded on
#       the SECOND try. Setting `errors.retry.timeout=60000` (60 s)
#       absorbs S3's typical sub-second recovery.
#
#   (2) JDBC sink, connection-pool exhaustion mass-DLQs (THIS fixture's
#       pattern). HikariCP throws ConnectionTimeoutException during a
#       30-second DB backup window when the WAL is briefly blocked.
#       With `errors.retry.timeout=0` every record routes to DLQ; the
#       DLQ topic balloons; downstream OLTP-mirror jobs stall. Setting
#       `errors.retry.timeout=60000` absorbs the backup window with
#       no data movement to DLQ at all.
#
#   (3) Elasticsearch sink, bulk-request 429.
#       ES returns HTTP 429 (Too Many Requests) under ingest pressure
#       (background segment-merge, hot-shard rebalance). Without retry
#       budget every 429 is terminal. Setting `errors.retry.timeout=
#       120000` (2 min) lets the connector self-throttle via
#       exponential backoff and recover when ingest pressure subsides.
#
#   (4) HTTP sink, downstream maintenance window.
#       A 30-second API maintenance window kills the connector for the
#       duration. Setting `errors.retry.timeout=60000` waits it out
#       transparently.
#
#   (5) Schema-registry intermittent failure.
#       A 10-second schema-registry deploy fails every record at the
#       converter stage (cached subject resolution invalidates on every
#       fetch during the deploy). With `errors.retry.timeout=0` every
#       record routes to DLQ. Setting `errors.retry.timeout=30000`
#       covers the deploy window.
#
#   (6) MM2 replication with rolling broker restart.
#       Destination cluster's rolling restart intermittently fails
#       producer requests over a 4-minute window. Setting `errors.
#       retry.timeout=300000` (5 min) absorbs the full rolling-restart
#       window.
#
#   (7) Financial-reconciliation sink — fail-fast IS right.
#       Operator deliberately wants `errors.retry.timeout=0` so
#       retriable errors halt the task and page on-call IMMEDIATELY
#       rather than masking the issue with retries. In this case the
#       value should be set EXPLICITLY (`errors.retry.timeout=0`) to
#       document the deliberate choice and insulate the connector
#       from a future framework default change.
#
#   (8) Connect-on-K8s operator template ships `errors.tolerance=all`
#       without the retry budget.
#       A team's Connect operator template enables tolerance for
#       resilience but omits `errors.retry.timeout`. Every connector
#       deployed via the template inherits the default `0` retry
#       budget — every transient failure routes straight to DLQ; the
#       DLQ topic per connector accumulates records that would have
#       succeeded on the second try. Across an org with 40+
#       connectors, the cumulative DLQ-volume waste is significant
#       and rarely traced back to this knob.
#
# Fix
#   ONE LINE. Production default for retriable-failure-tolerant sinks:
#     errors.retry.timeout=60000        # 60 s retry budget — typical
#                                       # 7-10 retry attempts with
#                                       # exponential backoff (capped
#                                       # by errors.retry.delay.max.ms,
#                                       # default 60000).
#
#   For never-drop-a-record connectors (financial, ledger):
#     errors.retry.timeout=-1           # Infinite retries — REQUIRES
#                                       # paired health-check monitoring
#                                       # to detect non-retriable errors
#                                       # masquerading as retriable.
#
#   For MirrorMaker 2 replication:
#     errors.retry.timeout=300000       # 5 min — absorbs full rolling-
#                                       # broker-restart windows on the
#                                       # destination cluster.
#
#   For deliberate fail-fast workloads:
#     errors.retry.timeout=0            # Explicitly opt out. Documents
#                                       # the deliberate choice;
#                                       # insulates from future
#                                       # framework default changes.
#
# Sibling rules
#   `CONNECT_ERRORS_TOLERANCE_ABSENT` (the tolerance-policy companion),
#   `CONNECT_ERRORS_TOLERANCE_ALL_NO_DLQ` (the DLQ-channel companion),
#   `CONNECT_ERRORS_TOLERANCE_ALL_NO_LOG` (the log-channel companion).
#   Together these four rules cover the full KIP-298 contract: tolerance
#   policy + retry budget + DLQ channel + log channel.
# =============================================================================

name=orders-events-to-postgres-sink
connector.class=io.confluent.connect.jdbc.JdbcSinkConnector
topics=orders-events
tasks.max=6

# PostgreSQL OLTP destination — orders_events table is the upstream-mirrored
# write destination consumed by the order-fulfilment service.
connection.url=jdbc:postgresql://postgres-orders.prod.example.com:5432/orders_db
connection.user=kafka_connect_writer
connection.password=${file:/run/secrets/jdbc-creds:password}

# Credential externalization via FileConfigProvider — keeps the JDBC password
# out of the .properties file. Declaring this isolates the fixture from
# CONNECT_CONFIG_PROVIDER_REFERENCE_UNDEFINED.
config.providers=file
config.providers.file.class=org.apache.kafka.common.config.provider.FileConfigProvider

# Upsert semantics keyed by orders_events.order_id — replays land on the same
# row; PK collisions overwrite.
table.name.format=orders_events
insert.mode=upsert
pk.mode=record_key
pk.fields=order_id

# Auto-schema-evolution disabled in prod (schema changes go through migration
# tooling); auto-table-creation disabled (DBAs own DDL).
auto.create=false
auto.evolve=false

# Throughput — write 5000-row batches per flush.
batch.size=5000
max.retries=10
retry.backoff.ms=3000

# Converters with their schema-registry URLs set (isolates this rule from
# CONNECT_SCHEMA_REGISTRY_CONVERTER_MISSING_URL).
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry.kafka.prod.example.com:8081
value.converter.auto.register.schemas=false

# Per-record failure handling: tolerate (DB connection-pool exhaustion during
# the nightly backup window briefly fails every write — we don't want the
# task halted by that) AND preserve failing records to a DLQ.
errors.tolerance=all

# DLQ stanza — fully configured so CONNECT_ERRORS_TOLERANCE_ALL_NO_DLQ,
# CONNECT_DLQ_CONTEXT_HEADERS_DISABLED, and CONNECT_DLQ_REPLICATION_FACTOR_LOW
# do NOT fire (we want to isolate the missing-retry-budget violation).
errors.deadletterqueue.topic.name=orders-events-to-postgres-sink-dlq
errors.deadletterqueue.topic.replication.factor=3
errors.deadletterqueue.context.headers.enable=true

# Log channel — fully configured so CONNECT_ERRORS_TOLERANCE_ALL_NO_LOG
# does NOT fire.
errors.log.enable=true
errors.log.include.messages=true

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# MISSING:
#   errors.retry.timeout=...
# Without this key, Kafka Connect defaults `errors.retry.timeout` to `0`
# (declared in ConnectorConfig.ERRORS_RETRY_TIMEOUT_CONFIG with ConfigDef.
# Type.LONG, default = 0). With `0`, the runtime's RetryWithToleranceOperator
# performs NO retries on retriable failures. For THIS connector's
# PostgreSQL-write workload, the nightly 30-second DB backup window briefly
# fails every write with HikariCP ConnectionTimeoutException; with
# `errors.retry.timeout=0` every failing record routes straight to the DLQ
# topic. Over a week the DLQ accumulates thousands of records that would
# have succeeded on the SECOND try after the backup window closes. KIP-298
# (Apache Kafka 2.0, July 2018) designed the retry-with-tolerance contract
# as TWO-STAGED: first RETRY for up to `errors.retry.timeout` ms with
# exponential backoff; ONLY after exhausting the retry budget does the
# `errors.tolerance=all` policy route the record to the DLQ. The recommended
# production value for typical sinks is `errors.retry.timeout=60000`
# (60 s — covers most transient outages with no DLQ traffic). For
# MirrorMaker 2 replication, `300000` (5 min) absorbs full rolling-broker-
# restart windows. For never-drop-a-record connectors, `-1` (infinite
# retries) paired with health-check monitoring. For deliberate fail-fast
# workloads, the value should be set EXPLICITLY to `0` to document the
# choice and insulate from future framework default changes.
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
