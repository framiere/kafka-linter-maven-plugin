# RULE: SECURITY_PROTOCOL_PLAINTEXT_REMOTE — Bad shape #6.
#
# Spring Boot variant — the rule has a SECOND key pair for Spring's
# prefix-namespaced config:
#   bootstrapKey = "spring.kafka.bootstrap-servers"
#   securityKey  = "spring.kafka.properties.security.protocol"
#
# Spring Boot's KafkaProperties class maps spring.kafka.* into the
# kafka-clients property names at bean-construction time. The
# top-level shortcut spring.kafka.bootstrap-servers maps to
# bootstrap.servers; pass-through keys live under
# spring.kafka.properties.* (and spring.kafka.producer.properties.*
# / spring.kafka.consumer.properties.* for per-client variants).
#
# This fixture sets the Spring bootstrap key pointing at Confluent
# Cloud, but does NOT set spring.kafka.properties.security.protocol
# anywhere. The KafkaProperties resolver will leave
# security.protocol at the kafka-clients default (PLAINTEXT) — same
# failure mode as the plain-key bootstrap variant.
#
# Note: the plain bootstrap.servers key is ALSO not set, so the
# checkPair call for the plain pair simply returns without firing
# (bootstrap == null). The Spring pair is the one that triggers.
# The rule's checkPair design means EACH pair fires independently
# — see the Good fixture good-confluent-cloud-with-security for the
# negative-of-this case.
spring.kafka.bootstrap-servers=pkc-xyz12.us-east-1.aws.confluent.cloud:9092
spring.kafka.client-id=my-spring-app
