# Silent: bootstrap points at an internal corporate DNS name with
# no managed-cluster suffix.
#
# A common production shape: on-prem Kafka cluster behind the
# corporate firewall, exposed via the company's internal DNS
# (e.g., "kafka-1.internal.acme.corp"). The rule is intentionally
# conservative — it does NOT fire on arbitrary remote hostnames
# because the rationale "this hostname is reachable via the
# internet and therefore needs TLS" only holds for the managed
# Kafka SaaS providers explicitly listed in MANAGED_SUFFIXES.
#
# For on-prem clusters, the operational model is typically "TLS
# within the VPN, plaintext within the rack" — the rule would
# false-positive here if it flagged every non-localhost bootstrap.
#
# This is the documented escape hatch: name your broker hostname
# something OTHER than a managed-suffix match.
bootstrap.servers=kafka-1.internal.acme.corp:9092,kafka-2.internal.acme.corp:9092
