# RULE: SECURITY_PROTOCOL_PLAINTEXT_REMOTE — Bad shape #4.
#
# bootstrap.servers points at Redpanda Cloud (suffix
# ".cloud.redpanda.com"). security.protocol is unset.
#
# Redpanda Cloud's managed clusters expose brokers as
#   <cluster-id>.<region>.<provider>.cloud.redpanda.com
# All listeners are TLS by default (Redpanda's free tier and
# enterprise tier alike). Without security.protocol=SASL_SSL or
# security.protocol=SSL, the client's plaintext socket fails on
# the TLS handshake.
#
# Worth noting Redpanda is Kafka-protocol-compatible (NOT a
# different client library) — the kafka-clients defaults apply
# identically. The rule's value here is that Redpanda's
# documentation does not always make security.protocol prominent
# (the SDK helper hides it), and developers porting from a local
# plaintext broker often miss the config when shifting to managed
# Redpanda.
bootstrap.servers=abc123.bydsk1q.fmc.prd.cloud.redpanda.com:9092
