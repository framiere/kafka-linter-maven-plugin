# RULE: SECURITY_PROTOCOL_PLAINTEXT_REMOTE — Bad shape #2.
#
# bootstrap.servers points at AWS MSK (suffix ".amazonaws.com"
# — covers MSK's domain b-1.foo.abc123.c12.kafka.us-east-1.amazonaws.com
# and serverless variants like *.kafka.us-east-1.amazonaws.com).
# security.protocol is unset.
#
# Why ".amazonaws.com" is the chosen suffix and not the more
# specific ".kafka.us-east-1.amazonaws.com":
#   - MSK exposes brokers under MULTIPLE region-specific
#     subdomains (.us-east-1.amazonaws.com, .eu-west-1.amazonaws.com,
#     .ap-southeast-2.amazonaws.com, ...) and the rule deliberately
#     casts a wide net rather than enumerating every AWS region.
#   - The cost of broadening (someone happens to have a non-MSK
#     EC2 instance hostname ending in .amazonaws.com) is "a
#     prompt to set security.protocol" — false-positive-cost is
#     low. The cost of narrowing (missing a new region's MSK
#     hostname pattern) is "leak SASL credentials in plaintext" —
#     false-negative-cost is high.
#
# At runtime: same as Confluent Cloud — MSK's listener typically
# expects SASL_SSL or SASL_PLAINTEXT or TLS, and a plaintext
# connection either fails (best case) or leaks credentials (worst
# case).
bootstrap.servers=b-1.prod-cluster.abc123.c12.kafka.us-east-1.amazonaws.com:9098
