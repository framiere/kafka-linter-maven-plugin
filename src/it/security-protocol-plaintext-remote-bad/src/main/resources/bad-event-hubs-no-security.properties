# RULE: SECURITY_PROTOCOL_PLAINTEXT_REMOTE — Bad shape #5.
#
# bootstrap.servers points at Azure Event Hubs Kafka-compatible
# endpoint (suffix ".servicebus.windows.net"). security.protocol
# is unset.
#
# Event Hubs Kafka surface exposes brokers as
#   <namespace>.servicebus.windows.net:9093
# and Event Hubs ONLY supports SASL_SSL with a connection string
# (sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule
#    required username="$ConnectionString" password="<the-string>";).
# There is no plaintext endpoint on Event Hubs at all.
#
# Without security.protocol=SASL_SSL the client fails handshake.
# This is the case where the rule's value is highest: the typical
# Azure developer copies a connection string from the portal and
# pastes it into a Spring config, NEVER explicitly setting
# security.protocol because the connection string "looks
# sufficient". The rule nudges them to set the missing knob
# explicitly.
bootstrap.servers=my-namespace.servicebus.windows.net:9093
