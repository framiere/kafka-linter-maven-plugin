# Silent: bootstrap.servers points at localhost — no managed
# suffix matches.
#
# The rule's first gate is matchManagedSuffix(bootstrap). It
# iterates each comma-separated host, strips ":port", and checks
# endsWith against MANAGED_SUFFIXES. "localhost" matches no
# suffix, so the rule abstains without examining security.protocol.
#
# This is the canonical local-development shape: plaintext is fine
# against a local KRaft broker, and the rule's job is NOT to
# nag about local-dev security (sibling rule
# SECURITY_PROTOCOL_PLAINTEXT — which flags explicit PLAINTEXT —
# also defaults to a lower severity for the same reason).
bootstrap.servers=localhost:9092,localhost:9093,localhost:9094
