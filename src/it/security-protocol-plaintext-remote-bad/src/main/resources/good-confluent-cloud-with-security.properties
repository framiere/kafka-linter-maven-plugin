# Silent: bootstrap points at Confluent Cloud (managed-suffix
# match) AND security.protocol is set.
#
# The rule's check is
#   if (securityProtocol != null && !securityProtocol.isBlank()) return;
# — i.e., any non-blank value silently abstains. The rule does
# NOT validate WHICH value is set; that's the job of the sibling
# rule SECURITY_PROTOCOL_PLAINTEXT (which flags an EXPLICIT
# PLAINTEXT setting).
#
# Here security.protocol=SASL_SSL is the canonical Confluent Cloud
# shape — paired with sasl.mechanism=PLAIN and a sasl.jaas.config
# containing the API-key/secret pair.
bootstrap.servers=pkc-xyz12.us-east-1.aws.confluent.cloud:9092
security.protocol=SASL_SSL
sasl.mechanism=PLAIN
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="API_KEY" password="API_SECRET";
