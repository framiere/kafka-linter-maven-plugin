# RULE: SECURITY_PROTOCOL_PLAINTEXT_REMOTE — Bad shape #1.
#
# bootstrap.servers points at a Confluent Cloud cluster (suffix
# ".confluent.cloud") but security.protocol is unset.
#
# What the rule sees:
#   - PLAIN_BOOTSTRAP_KEY="bootstrap.servers" is present:
#     "pkc-xyz12.us-east-1.aws.confluent.cloud:9092"
#   - The bootstrap value is lower-cased and split on ",". For each
#     host the rule strips the ":port" suffix and checks
#     endsWith(suffix) against MANAGED_SUFFIXES. Here
#     "pkc-xyz12.us-east-1.aws.confluent.cloud" endsWith
#     ".confluent.cloud" → matches.
#   - PLAIN_SECURITY_KEY="security.protocol" is absent →
#     securityProtocol == null → rule fires.
#
# What happens at runtime if shipped this way:
#   - kafka-clients defaults security.protocol to PLAINTEXT.
#   - Confluent Cloud's broker listener accepts ONLY SASL_SSL
#     (typically), so the producer/consumer's plaintext socket
#     handshake fails immediately with a NetworkException or
#     SSLHandshakeException depending on the listener
#     misconfiguration mode. Best case: connection refused.
#     Worst case: SASL credentials (sasl.jaas.config) are sent in
#     CLEARTEXT to a misconfigured listener — leaking the API key.
#
# Fix: set security.protocol=SASL_SSL and the matching SASL keys
# (sasl.mechanism=PLAIN + sasl.jaas.config for Confluent Cloud).
bootstrap.servers=pkc-xyz12.us-east-1.aws.confluent.cloud:9092
