# Silent: Spring bootstrap points at MSK AND
# spring.kafka.properties.security.protocol is set.
#
# Mirror of good-confluent-cloud-with-security but exercising the
# Spring pair. Two-Spring-keys pattern:
#   spring.kafka.bootstrap-servers          → bootstrap.servers
#   spring.kafka.properties.security.protocol → security.protocol
#                                              (the pass-through prefix)
#
# This is the canonical Spring-Boot-on-MSK shape: SASL_SSL with
# AWS IAM via aws-msk-iam-auth's SASL handler.
spring.kafka.bootstrap-servers=b-1.prod-cluster.abc123.c12.kafka.us-east-1.amazonaws.com:9098
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=AWS_MSK_IAM
spring.kafka.properties.sasl.jaas.config=software.amazon.msk.auth.iam.IAMLoginModule required;
spring.kafka.properties.sasl.client.callback.handler.class=software.amazon.msk.auth.iam.IAMClientCallbackHandler
