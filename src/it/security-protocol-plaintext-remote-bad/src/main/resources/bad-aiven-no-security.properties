# RULE: SECURITY_PROTOCOL_PLAINTEXT_REMOTE — Bad shape #3.
#
# bootstrap.servers points at Aiven (suffix ".aivencloud.com").
# security.protocol is unset.
#
# Aiven Kafka services expose brokers as
#   <service-name>-<project>.aivencloud.com
# and ALL Aiven Kafka listeners require either SSL (mTLS) or
# SASL_SSL. There is no plaintext listener at all — so a client
# without security.protocol set will fail to connect with an
# SSLException or connection-refused as the broker rejects the
# plaintext handshake.
#
# Multi-host fixture: shows that the rule still fires when the
# bootstrap is a comma-separated list — the rule splits on "," and
# checks each host's suffix.
bootstrap.servers=kafka-mycluster-myproject.aivencloud.com:12345,kafka-mycluster-myproject-2.aivencloud.com:12345
