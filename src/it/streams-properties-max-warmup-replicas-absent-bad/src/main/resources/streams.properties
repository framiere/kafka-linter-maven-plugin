# =============================================================================
# IT fixture: STREAMS_PROPERTIES_MAX_WARMUP_REPLICAS_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A Kafka Streams .properties file destined for `new StreamsConfig(props)`.
#   It declares a complete production-quality Streams config for a LARGE-
#   CLUSTER topology — a payments-event enrichment pipeline
#   (`payments-event-enrichment-stream`) deployed across a 24-pod
#   Streams cluster with 240 active tasks (10 tasks per pod × 24 pods
#   from a 240-partition source topic), each with 2 warm standbys
#   (num.standby.replicas=2 → 480 standby tasks distributed cluster-
#   wide). The topology does multi-table KStream-KTable joins
#   (payments × customers × accounts × fraud-scores) to produce
#   enriched payment-events to a downstream risk-scoring service.
#
#   Every other Streams knob is set correctly — application.id,
#   bootstrap.servers, default serdes, processing guarantee, replication
#   factor, min.insync.replicas, num.standby.replicas, num.stream.
#   threads, commit.interval.ms, state.dir, both exception handlers,
#   topology.optimization=all, max.task.idle.ms, task.timeout.ms,
#   default.timestamp.extractor, acceptable.recovery.lag, AND
#   `probing.rebalance.interval.ms` explicitly. Everything is set
#   correctly EXCEPT `max.warmup.replicas` is not set anywhere.
#
# What's wrong
#   `org.apache.kafka.streams.StreamsConfig.MAX_WARMUP_REPLICAS_CONFIG`
#   declares `max.warmup.replicas` with:
#
#     ConfigDef.Type.INT,
#     default = 2,
#     importance = LOW,
#     validator = ConfigDef.Range.atLeast(1)
#
#   KIP-441 (Apache Kafka 2.6, October 2020) introduced this knob as
#   the CLUSTER-WIDE BUDGET on how many concurrent WARM-UP STANDBY
#   TASKS the HighAvailabilityTaskAssignor (default since 2.6) can
#   have in-flight per probing-rebalance round.
#
#   Critical distinction: a 'warm-up replica' is NOT the same as a
#   `num.standby.replicas`-driven STEADY-STATE STANDBY. The two are
#   conceptually different:
#     - STEADY-STATE STANDBY: kept in sync continuously throughout
#       the lifetime of the active task. Controlled by `num.standby.
#       replicas` (default 0). Used for HA promotion when an active
#       fails — promoted instantly because already in sync.
#     - WARM-UP REPLICA: a TRANSIENT standby spun up by the assignor
#       only when it wants to PROMOTE a task to a new instance that
#       doesn't yet have an ACCEPTABLE copy of the state. Bounded
#       cluster-wide by `max.warmup.replicas` (default 2). Catches
#       up in the background; promoted to active on the next
#       probing rebalance when its lag drops below acceptable.
#       recovery.lag.
#
#   The HighAvailabilityTaskAssignor's warm-up flow:
#     (1) For each task, find all instances with a copy of the
#         task's state (standbys + state-dir leftovers).
#     (2) Bucket candidates as ACCEPTABLE (lag <= acceptable.
#         recovery.lag) or LAGGED.
#     (3) Compute the IDEAL assignment (balance task ownership
#         across instances, respect num.standby.replicas, prefer
#         rack diversity).
#     (4) For tasks where the IDEAL assignment requires a state-
#         store on an instance that doesn't yet have one, the
#         assignor would like to PROVISION A NEW WARM-UP REPLICA
#         on that instance and let it catch up.
#     (5) BUT cluster-wide, NO MORE than `max.warmup.replicas`
#         such warm-ups can be in-flight at any one probing-
#         rebalance round.
#     (6) The assignor picks the HIGHEST-PRIORITY `max.warmup.
#         replicas` warm-ups (those that close the largest balance
#         gap) and DEFERS the rest to subsequent probing-rebalance
#         rounds.
#
#   The cap exists because each warm-up adds load:
#     (a) The warm-up's consumer reads from the changelog topic,
#         adding broker fetch load.
#     (b) The warm-up's state-store occupies disk space on the
#         destination instance (RocksDB; potentially gigabytes for
#         stateful topologies).
#     (c) The warm-up's StreamThread slot is occupied (and adds
#         consumer-group protocol traffic).
#
#   The default `2` is calibrated for SMALL-TO-MEDIUM Streams
#   clusters (2-8 instances, 10-100 tasks total).
#
# This fixture's specific risk
#   THIS topology is a LARGE-CLUSTER deployment: 24 pods, 240 active
#   tasks, 480 standby tasks (=720 task assignments total). When a
#   major rebalance event happens — for example, a 5-pod batch
#   restart for a Kafka client library security upgrade, or a Kafka
#   broker maintenance window that rolls 3 brokers — the assignor
#   typically wants to RE-DISTRIBUTE 30-60 task assignments to
#   instances that don't yet have current state.
#
#   With `max.warmup.replicas=2` (default) and `probing.rebalance.
#   interval.ms=60000` (set explicitly for high-churn — see below),
#   only 2 warm-ups can be in-flight cluster-wide per round.
#   Stabilizing a 50-task reassignment takes:
#     50 tasks / 2 warm-ups-per-round = 25 rounds
#     25 rounds × 60 seconds/round = 25 MINUTES of probing-only state
#
#   During those 25 minutes:
#     - Temporary-actives process on STALE STATE (the assignor
#       picked the least-lagged LAGGED candidate as temporary).
#     - Downstream consumers see continuous freshness regressions
#       (the risk-scoring service emits "delayed risk decision"
#       events).
#     - The transaction-processing pipeline backs up.
#
#   The right value for THIS app is `max.warmup.replicas=10` —
#   proportional to the 24-pod fleet size. At 10 concurrent warm-
#   ups per round:
#     50 tasks / 10 warm-ups-per-round = 5 rounds
#     5 rounds × 60 seconds/round = 5 MINUTES of stabilization
#
#   The cost: 10 simultaneous warm-ups consume 10x changelog-topic
#   fetch load AND 10 simultaneous state-store disk-copies. For
#   this app's 2 GiB state-stores, 10 simultaneous copies = 20 GiB
#   of transient disk I/O distributed across 24 pods = ~1 GiB per
#   pod, well within budget. The trade-off is right for this app.
#
#   The operator typically misdiagnoses this as "rebalance is slow"
#   or "Kafka cluster is overloaded" without realizing that the
#   root cause is the warm-up budget being too small for the
#   cluster size.
#
# Why this is "INFO" by default (not WARNING or ERROR)
#   (a) For SMALL-TO-MEDIUM clusters (2-8 instances, 10-100 tasks
#       total — the most common case in mature production), the
#       default `2` is fine: 2 warm-ups per round is enough
#       progress per probing-rebalance cycle.
#
#   (b) The right NON-default value is workload-dependent —
#       depends on cluster size, task count, instance memory/disk
#       budget, and acceptable stabilization latency. The linter
#       cannot infer the cluster size from .properties alone.
#
#   (c) The bug shape is delayed and rebalance-triggered: it
#       doesn't manifest at deploy time, only during the post-
#       major-rebalance stabilization window. Most operators only
#       discover the budget mismatch when investigating "why does
#       a small maintenance window cause multi-hour service
#       degradation?".
#
#   INFO is the right level: surfaces the missing knob and prompts
#   a deliberate cluster-size choice without false-alarming the
#   small-cluster workloads.
#
#   This IT overrides severity to ERROR via pom.xml configuration to
#   force the build to fail and verify the rule fires.
#
# Common bug shapes
#   (1) Large cluster post-major-rebalance — stabilization takes
#       hours.
#       THIS app: 24-pod cluster, 240 active tasks. A 5-pod batch
#       restart triggers a ~50-task reassignment. With default
#       `max.warmup.replicas=2` + `probing.rebalance.interval.ms=600000`
#       (default 10-min cadence), stabilization takes 25 rounds ×
#       10 min = 4+ HOURS of unstable assignment. Setting
#       `max.warmup.replicas=10` + `probing.rebalance.interval.ms=60000`
#       drops it to 5 minutes total.
#
#   (2) High-churn HPA-driven autoscaling — warm-ups can't keep up
#       with scale events.
#       A Streams app autoscales via Kubernetes HPA. During a
#       traffic spike, HPA scales from 4 to 16 instances over 30
#       minutes; each scale-up event triggers a rebalance with
#       new warm-ups for the new instances. With `max.warmup.
#       replicas=2`, only 2 warm-ups can be in-flight at once
#       across the WHOLE cluster — meaning each scale-up event
#       takes 6+ probing-rebalance rounds to stabilize before the
#       next scale event piles on more rebalances. The HPA
#       cascade can leave the cluster in perpetual probing-
#       rebalance state.
#
#   (3) Memory-constrained instances — warm-ups OOM the
#       destination.
#       A Streams app with 10 GiB state-stores. Each warm-up
#       copies its state-store to the destination instance,
#       doubling the disk-space and (transiently) the memory
#       footprint on the destination. With `max.warmup.replicas=2`,
#       two simultaneous warm-ups on the same instance can OOM
#       the JVM. Setting `max.warmup.replicas=1` serializes warm-
#       up I/O to avoid the double-store overhead at the cost of
#       slower stabilization.
#
#   (4) Small cluster (2-8 instances) — default is fine.
#       A Streams app on a 4-instance cluster with 20 tasks. The
#       default `max.warmup.replicas=2` lets the assignor make
#       steady progress in 2-3 probing-rebalance rounds.
#
#   (5) Spring Boot Streams autoconfig — org-wide default leaks
#       through.
#       Spring Boot's Streams autoconfiguration (`spring-kafka`)
#       provides a `KafkaStreamsConfiguration` bean from
#       `application.yml`. The default Spring template does NOT
#       include `max.warmup.replicas`. Every Spring Boot Streams
#       app inherits the framework default `2`. For an org with
#       diverse cluster sizes (some small, some large), the org-
#       wide default-leak masks workload-specific tuning.
#
#   (6) Cluster expansion — promoting 100 new task assignments
#       takes hours.
#       A Streams app's owner scales from 10 to 30 instances
#       after a forecasted traffic surge. The 20 new instances
#       start with empty state-dirs; the assignor wants to
#       rebalance 100+ task active assignments to them via warm-
#       ups. With `max.warmup.replicas=2`, only 2 promotions per
#       probing-rebalance round; the 100-task expansion takes 50
#       rounds × 10 min = 8+ hours of unstable assignment during
#       which the existing 10 instances are over-loaded.
#
# Fix
#   ONE LINE. For LARGE clusters (THIS app's case — 20+ instances):
#     max.warmup.replicas=10                  # 10 concurrent warm-
#                                             # ups — proportional
#                                             # to fleet size;
#                                             # stabilizes a 50-task
#                                             # reassignment in 5
#                                             # rounds vs 25 at
#                                             # default.
#
#   For small/medium clusters (2-8 instances):
#     max.warmup.replicas=2                   # explicit default —
#                                             # documents the
#                                             # deliberate choice;
#                                             # insulates from
#                                             # future framework
#                                             # default changes.
#
#   For memory-constrained workloads (large state-stores, tight
#   instance memory budget):
#     max.warmup.replicas=1                   # minimum allowed;
#                                             # serializes warm-up
#                                             # I/O to avoid double-
#                                             # state-store memory/
#                                             # disk overhead on
#                                             # the destination
#                                             # instance.
#
# Sibling rules
#   `STREAMS_PROPERTIES_ACCEPTABLE_RECOVERY_LAG_ABSENT` declares
#   WHEN a warm-up is "good enough" to promote (lag-threshold).
#   `STREAMS_PROPERTIES_PROBING_REBALANCE_INTERVAL_MS_ABSENT`
#   declares HOW OFTEN to re-check warm-up progress (cadence).
#   `STREAMS_PROPERTIES_MAX_WARMUP_REPLICAS_ABSENT` declares HOW
#   MANY warm-ups can be in-flight simultaneously (budget). The
#   three KIP-441 knobs together define warm-standby promotion
#   behavior — tuning one without the others typically does not
#   yield the desired stabilization profile.
# =============================================================================

application.id=payments-event-enrichment-stream
bootstrap.servers=broker-1.kafka.prod.example.com:9092,broker-2.kafka.prod.example.com:9092,broker-3.kafka.prod.example.com:9092

# Default serdes used by topology operators that don't pass explicit
# Consumed/Produced/Materialized/Grouped.
default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
default.value.serde=io.confluent.kafka.streams.serdes.avro.SpecificAvroSerde

# Internal-topic durability (replication factor for changelog + repartition topics).
replication.factor=3
min.insync.replicas=2

# Throughput & latency.
num.stream.threads=10
commit.interval.ms=5000

# HA for stateful tasks — 2 warm copies of every state-store partition,
# so that a rebalance can promote a standby without full changelog-
# replay delay. 240 active tasks × 2 standbys = 480 standby tasks
# distributed cluster-wide.
num.standby.replicas=2

# At-least-once with explicit commit cadence.
processing.guarantee=at_least_once

# State-store location (outside /tmp; survives container restarts when mounted as a volume).
state.dir=/var/lib/kafka-streams/payments-event-enrichment

# Internal-topic-layout consolidation (KIP-295 / KIP-862).
topology.optimization=all

# Exception handlers — both set, so the existing handler-absent rules don't fire.
default.deserialization.exception.handler=org.apache.kafka.streams.errors.LogAndContinueExceptionHandler
default.production.exception.handler=org.apache.kafka.streams.errors.LogAndContinueProductionExceptionHandler

# Schema registry (Confluent Avro deserializer dependency).
schema.registry.url=http://schema-registry.kafka.prod.example.com:8081

# Multi-source KStream-KTable joins — `max.task.idle.ms=2000` accommodates
# the 2-second skew window between payments/customers/accounts/fraud-scores
# source topics. Set EXPLICITLY to isolate from
# STREAMS_PROPERTIES_MAX_TASK_IDLE_MS_ABSENT.
max.task.idle.ms=2000

# 30-min retry budget — accommodates prolonged broker outages.
# Set EXPLICITLY to isolate from STREAMS_PROPERTIES_TASK_TIMEOUT_MS_ABSENT.
task.timeout.ms=1800000

# Kafka-native producers write to LogAppendTime-typed topics — the broker
# guarantees valid timestamps; fail-fast on invalid is the right posture.
# Set EXPLICITLY to isolate from STREAMS_PROPERTIES_DEFAULT_TIMESTAMP_
# EXTRACTOR_ABSENT.
default.timestamp.extractor=org.apache.kafka.streams.processor.FailOnInvalidTimestamp

# Warm-standby PROMOTION THRESHOLD — at 50k events/sec across 240
# partitions = ~200 events/sec/partition, default 10,000 records of
# lag is ~50 seconds — within the freshness budget. Set EXPLICITLY at
# the default to isolate from STREAMS_PROPERTIES_ACCEPTABLE_RECOVERY_
# LAG_ABSENT.
acceptable.recovery.lag=10000

# PROBING-REBALANCE CADENCE — set to 1-min (minimum allowed) to match
# the high-churn deployment cadence (8-12 GitOps deploys per day) for
# this large 24-pod fleet. Set EXPLICITLY to isolate from
# STREAMS_PROPERTIES_PROBING_REBALANCE_INTERVAL_MS_ABSENT.
probing.rebalance.interval.ms=60000

