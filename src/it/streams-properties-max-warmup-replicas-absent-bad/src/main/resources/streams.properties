# MISSING:
#   max.warmup.replicas=...
# Without this key, Kafka Streams defaults `max.warmup.replicas` to
# `2` (declared in StreamsConfig.MAX_WARMUP_REPLICAS_CONFIG with
# ConfigDef.Type.INT, validator ConfigDef.Range.atLeast(1)). Per
# KIP-441 (Apache Kafka 2.6, October 2020), this is the CLUSTER-WIDE
# BUDGET on how many concurrent WARM-UP STANDBY TASKS the
# HighAvailabilityTaskAssignor can have in-flight per probing-
# rebalance round. The default `2` is calibrated for SMALL-TO-
# MEDIUM clusters (2-8 instances, 10-100 tasks). For THIS app — a
# LARGE 24-pod cluster with 240 active tasks + 480 standby tasks =
# 720 task assignments — `2` is the bottleneck: a major rebalance
# event (e.g., 5-pod batch restart for a security upgrade)
# typically requires re-distributing 30-60 task assignments to
# instances without current state; at 2 warm-ups per round, this
# takes 25-30 probing-rebalance rounds × 60 seconds = 25-30
# minutes of unstable assignment during which downstream sees
# stale state. For THIS app: `max.warmup.replicas=10` (proportional
# to 24-pod fleet) cuts stabilization to 5 rounds = 5 minutes. For
# typical small/medium clusters, `max.warmup.replicas=2` (explicit
# default). For memory-constrained workloads with large state-
# stores, `max.warmup.replicas=1` (minimum allowed — serializes
# warm-up I/O to avoid double-state-store overhead on destination
# instances).
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
