name=customers-source
connector.class=io.debezium.connector.postgresql.PostgresConnector
tasks.max=1

database.hostname=customers-db.internal
database.port=5432
database.user=debezium
database.password=changeme
database.dbname=customers

topic.prefix=cdc.customers
slot.name=debezium_customers
schema.history.internal.kafka.topic=cdc.customers.schema-history
schema.history.internal.kafka.bootstrap.servers=kafka:9092

table.include.list=public.customers,public.orders

# Anti-pattern: maskPii transform is FULLY defined (type binding + fields list)
# but 'maskPii' is NOT in the transforms= chain. Connect's SMT framework
# iterates ONLY the aliases in transforms=, silently ignoring orphan
# transforms.maskPii.* entries — no error, no warning. The operator believes
# PII columns ssn and date_of_birth are being masked (the config is right
# there, audited and compliant-looking) but the runtime is not masking them.
# PII flows downstream in clear text. Compliance audit finds the exposure
# 6 months later.
transforms=tagSource
transforms.tagSource.type=org.apache.kafka.connect.transforms.InsertField$Value
transforms.tagSource.static.field=source_connector
transforms.tagSource.static.value=customers-source

transforms.maskPii.type=org.apache.kafka.connect.transforms.MaskField$Value
transforms.maskPii.fields=ssn,date_of_birth,credit_card

snapshot.mode=initial

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
