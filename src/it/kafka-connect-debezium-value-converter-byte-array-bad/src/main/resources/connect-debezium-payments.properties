name=debezium-payments
connector.class=io.debezium.connector.sqlserver.SqlServerConnector
tasks.max=1

database.hostname=payments-db.internal
database.port=1433
database.user=debezium
database.password=changeme
database.names=payments
database.encrypt=false

topic.prefix=cdc.payments
schema.history.internal.kafka.topic=cdc.payments.schema-history
schema.history.internal.kafka.bootstrap.servers=kafka:9092

table.include.list=dbo.transactions,dbo.refunds

snapshot.mode=initial

key.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=false

# Anti-pattern: ByteArrayConverter at the VALUE position for a Debezium
# connector. Every Debezium connector — Postgres, MySQL, SQL Server, Oracle,
# MongoDB, DB2, Cassandra, Vitess, Spanner — emits SourceRecord values as a
# Kafka Connect Struct: the Debezium envelope with before/after/source/op/
# ts_ms fields carrying the row-level change event. ByteArrayConverter's
# fromConnectData() is `return (byte[]) value;` — a hard cast with no Struct-
# handling branch. The cast throws ClassCastException on the first record:
# `org.apache.kafka.connect.data.Struct cannot be cast to [B`. Task flips to
# FAILED, zero events ever reach Kafka. The configuration is structurally
# invalid; there is no Debezium scenario where ByteArrayConverter is correct
# at the value position. Symmetric companion to the key-converter rule.
value.converter=org.apache.kafka.connect.converters.ByteArrayConverter
