name=shipments-cdc
connector.class=io.debezium.connector.mysql.MySqlConnector

tasks.max=1

# Anti-pattern: legacy Debezium 1.x key `database.server.name` carried
# forward into a Debezium 2.x deployment. In Debezium 1.x this key
# defined the logical name of the source database server AND was used
# as the prefix for every emitted topic name (with database.server.name=
# shipments-cdc, the connector would emit to topics like
# shipments-cdc.shipments.public.parcels, the schema-history topic
# shipments-cdc, the heartbeat topic __debezium-heartbeat.shipments-cdc).
#
# In Debezium 2.0 the key was RENAMED to `topic.prefix` (semantics
# IDENTICAL — same value, same role as topic-name prefix and as
# logical-source identifier in the Debezium envelope's source.name
# field — but the name was clarified to reflect that this is
# fundamentally a topic-naming concern, not a database-server-naming
# concern). The legacy `database.server.name` was kept as a deprecated
# ALIAS in Debezium 2.0-2.4 (the connector accepts it, logs a WARN,
# uses its value as a fallback when topic.prefix is absent) and
# REMOVED entirely from the connector's ConfigDef in Debezium 2.5.
#
# This config was deployed against Debezium 1.7 in 2021 with only
# `database.server.name=shipments-cdc` set. The Connect cluster was
# upgraded through Debezium 2.0 → 2.2 → 2.4 over the next two years;
# the connector continued to function because the 2.0-2.4 fallback
# used `database.server.name` as the topic-prefix when topic.prefix
# was absent. Each version upgrade emitted a deprecation WARN to the
# worker logs:
#
#   WARN io.debezium.connector.common.BaseSourceTask - The
#   'database.server.name' configuration property is deprecated and
#   will be removed in Debezium 3.x. Use 'topic.prefix' instead.
#
# The warning was buried in the worker logs; nobody on the team noticed.
# The deployed connector emitted to topic prefix `shipments-cdc`
# (matching the legacy value); downstream consumers (the
# shipment-tracking Kafka Streams app, the warehouse-management JDBC
# sink, the customer-notification consumer) all consumed from
# shipments-cdc.shipments.public.* topics; everything worked.
#
# Last week, the Connect cluster was upgraded from Debezium 2.4 to
# Debezium 2.5. In 2.5, the `database.server.name` fallback was REMOVED:
# the connector reads only `topic.prefix`; the unknown legacy key is
# silently accepted by Connect (Connect's general unknown-key behavior)
# but the connector ignores it. The connector's required `topic.prefix`
# config is absent. The connector's start() throws:
#
#   ConfigException: topic.prefix is required
#
# The connector enters FAILED state immediately after deployment. The
# REST-API connector-status endpoint shows FAILED (visible only if the
# operator checks the status endpoint specifically). The on-call team
# pages within 30 minutes because the shipment-tracking Kafka Streams
# app's input topic (shipments-cdc.shipments.public.parcels) stops
# receiving events.
#
# Recovery: replace `database.server.name=shipments-cdc` with
# `topic.prefix=shipments-cdc` (same value, just rename the key). The
# migration has NO downstream impact — the topic name `shipments-cdc.
# shipments.public.parcels` and the source.name value `shipments-cdc`
# in every emitted record are IDENTICAL between the legacy and modern
# config (the value is the same; only the key changed). Downstream
# consumers do not need to change; the schema-history topic does not
# need to be migrated; the existing offsets carry forward.
#
# But: the team had to do this fix at 2am under pressure, instead of
# at PR time when the change would have been routine. The static-
# analysis catch surfaces this at PR time, BEFORE the 2.5 upgrade
# breaks the connector.
database.server.name=shipments-cdc

database.hostname=shipments-mysql-primary.internal
database.port=3306
database.user=debezium
database.password=changeme
database.server.id=184057
database.include.list=shipments

schema.history.internal.kafka.bootstrap.servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
schema.history.internal.kafka.topic=schema-history.shipments-cdc

table.include.list=shipments.parcels,shipments.tracking_events,shipments.routes

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
