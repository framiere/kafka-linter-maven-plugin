# =============================================================================
# IT fixture: PRODUCER_PROPERTIES_CLIENT_ID_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A kafka-clients producer .properties file destined for
#   `new KafkaProducer<>(props)`. It declares bootstrap.servers, serializers,
#   acks, idempotence, compression, batching, the linger window, buffer.memory,
#   delivery.timeout.ms — a complete production-quality producer config —
#   EXCEPT `client.id` is not set anywhere.
#
# What's wrong
#   `org.apache.kafka.clients.producer.ProducerConfig.CLIENT_ID_CONFIG`
#   declares `client.id` with `ConfigDef.Type.STRING`, default `""` (the empty
#   string), importance MEDIUM. The kafka-clients parse step ACCEPTS the empty
#   value; `new KafkaProducer<>(props)` succeeds without error.
#
#   Then, inside the KafkaProducer constructor, kafka-clients sees that
#   `client.id` is empty and auto-generates:
#
#     "producer-" + PRODUCER_CLIENT_ID_SEQUENCE.getAndIncrement()
#
#   where `PRODUCER_CLIENT_ID_SEQUENCE` is a STATIC AtomicInteger inside the
#   `KafkaProducer` class, initialized to 1, RESET ON EVERY JVM RESTART.
#
#   So the first KafkaProducer in this JVM is `producer-1`, the second is
#   `producer-2`, etc. On the next pod restart, the counter resets to 1, so
#   the same first producer is `producer-1` again. Two replicas of the same
#   Deployment both run their own JVMs, both auto-generate `producer-1`. Two
#   different microservices' first-constructed producers are both `producer-1`.
#
#   The auto-gen value is THEN used downstream:
#     - Every ProduceRequest sent to the broker carries it in the request
#       header's `client_id` field.
#     - Broker request log (when `log4j.logger.kafka.request.logger=DEBUG` is
#       on, or audit logging is enabled) records this client_id.
#     - Broker-side per-client-id quotas (KIP-13 producer-byte-rate quota)
#       are keyed by it: `kafka-configs --add-config 'producer_byte_rate=
#       1048576' --entity-type clients --entity-name <client-id>` — without
#       a real client.id, you cannot target a specific producer.
#     - JMX metric labels on the broker side: `kafka_server_BrokerTopicMetrics_
#       BytesIn{client_id=producer-1}` — every Grafana board shows stacks of
#       generic `producer-N` names with no app correlation.
#     - Client-side JMX: `kafka.producer:type=producer-metrics,client-id=
#       producer-1` — dashboards built on this label are unstable across
#       restarts because the counter resets.
#
# Why this is "INFO" by default (not WARNING or ERROR)
#   (a) The framework does NOT fail — the producer runs fine with the auto-gen
#       client.id. The cost is purely observability: broker-side metrics, log
#       attribution, and KIP-13 quotas are useless without a stable handle.
#
#   (b) Some frameworks inject client.id PROGRAMMATICALLY:
#       - Spring Boot Kafka copies `spring.application.name` into client.id
#         via `KafkaProperties.Producer.getClientId()`.
#       - Quarkus Kafka extension uses `quarkus.application.name`.
#       - Micrometer-Kafka integrations may template a meaningful value.
#       When in play, the underlying .properties may LEGITIMATELY omit client.id.
#
#   (c) Single-tenant deployments with a single producer per JVM and no SRE-
#       owned broker-side observability MAY not care about the auto-gen name.
#
#   For these reasons, the rule's default severity is INFO — a documentation
#   nudge prompting the operator to make the choice deliberately.
#
#   This IT overrides severity to ERROR via pom.xml configuration to force the
#   build to fail and verify the rule fires.
#
# Common bug shapes
#   (1) Broker quota cannot be applied to a specific producer.
#       SRE notices one producer is saturating broker bandwidth. They want to
#       apply a KIP-13 quota:
#         kafka-configs --alter \
#           --add-config 'producer_byte_rate=1048576' \
#           --entity-type clients --entity-name <client-id>
#       But the producer's client.id is `producer-1` — and so is every other
#       producer in the cluster's first-constructed JVMs. The quota is either
#       too broad (applies to all `producer-1`s across the org) or there is
#       no way to target. SRE has to ask the team to set client.id and re-
#       deploy before the quota can be applied. The static-analysis catch at
#       PR time would have flagged the absent key.
#
#   (2) Broker request log forensics dead-end.
#       Incident at 02:30 UTC: broker partition replication storm caused by a
#       flood of overlarge ProduceRequests. Broker `request.log` shows
#       `client_id=producer-3` issued ~10K requests in 1 minute. Question:
#       which application is `producer-3`? Answer: unknown — could be any of
#       50 microservices' 3rd-constructed producer in some build's bean init
#       order. Investigation takes 4 hours of grepping git for which service
#       constructs producers in some particular sequence. Setting explicit
#       client.id would have made the answer one log line.
#
#   (3) Per-app dashboards across broker fleet are noise.
#       Org has Grafana dashboards per `client_id` on the broker side. With
#       all apps auto-generating `producer-1`, `producer-2`, the dashboards
#       show 'top 10 by traffic' as a stack of generic names with no app
#       correlation. Setting explicit client.id makes the dashboards self-
#       explanatory.
#
#   (4) Spring Boot wrapper leak.
#       Internal Spring Boot Kafka starter is documented as 'sets client.id
#       automatically from spring.application.name'. But a team's app has
#       `spring.application.name=app` (the literal string 'app', accidentally
#       left from a sample). Broker logs show 90% of that team's traffic
#       under `client_id=app`. The starter does what it claims; the app
#       misconfigured upstream. Static analysis catches the underlying issue.
#
#   (5) Two pods, same name.
#       Two replicas of the same Deployment both start their producers; both
#       auto-generate `producer-1` (each pod is its own JVM); broker sees
#       identical client_id from two source IPs. Per-pod investigation is
#       impossible; per-pod quota does not work.
#
#   (6) Multi-tenant library passthrough.
#       Internal Kafka library wraps KafkaProducer and lets tenants pass
#       through arbitrary properties. Library does not opinionate on
#       client.id. Every tenant inherits auto-gen `producer-N`; SRE has no
#       broker-side handle to enforce per-tenant quotas. Per-tenant static-
#       analysis at PR time would flag the absence.
#
# Fix
#   ONE LINE. Set `client.id` to a value uniquely identifying THIS producer's
#   role inside THIS service, ideally `<service-name>-<producer-purpose>`:
#
#     client.id=orders-service-event-producer
#     client.id=payments-fraud-callback-producer
#     client.id=inventory-cdc-producer
#
#   For multi-replica deployments, consider templating the pod-ordinal into
#   client.id so each replica is broker-side-distinguishable:
#
#     client.id=orders-service-event-producer-${HOSTNAME}
#
#   AVOID generic values (`my-producer`, `producer`, `client-1`) — those
#   defeat the purpose. The sibling rule KAFKA_CLIENT_ID_GENERIC catches
#   them as a separate violation.
# =============================================================================

bootstrap.servers=broker-1.kafka.prod.example.com:9092,broker-2.kafka.prod.example.com:9092,broker-3.kafka.prod.example.com:9092
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer

# Durability + idempotence (no duplicate-on-retry).
acks=all
enable.idempotence=true

# Compression + batching (high-throughput producer).
compression.type=zstd
linger.ms=20
batch.size=131072
buffer.memory=67108864

# Retry budget.
delivery.timeout.ms=120000

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# MISSING:
#   client.id=...
# kafka-clients auto-generates `producer-<N>` per JVM (counter resets on
# restart). Broker request logs, KIP-13 per-client-id quotas, and per-instance
# JMX dashboards are all left with this opaque label.
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
