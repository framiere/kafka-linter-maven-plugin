# =============================================================================
# A MirrorMaker 2 heartbeat-connector configuration where the operator has
# explicitly DISABLED heartbeat emission via `emit.heartbeats.enabled=false`.
# This is a NULL CONFIGURATION — the connector's entire purpose is to emit
# heartbeats; with emission disabled, the connector occupies a Connect-cluster
# task slot and does literally nothing useful.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#
#   connector.class             = MirrorHeartbeatConnector
#   emit.heartbeats.enabled     = false   ← null-config switch
#
# WHAT THIS CONNECTOR AND THIS KEY ACTUALLY DO:
#
# MirrorMaker 2 ships THREE separate connector classes, each with a single,
# well-defined responsibility:
#
#   MirrorSourceConnector       — replicates topic RECORDS from source to
#                                 target (the data plane). Auto-creates
#                                 replicated topics on the target cluster
#                                 (`<source-alias>.<topic>`). Owns
#                                 `sync.topic.configs.enabled`,
#                                 `sync.topic.acls.enabled`, and the
#                                 four replication-factor keys.
#
#   MirrorCheckpointConnector   — translates source-cluster consumer-group
#                                 offsets into target-cluster offsets and
#                                 writes them to the
#                                 `<source-alias>.checkpoints.internal`
#                                 topic (the failover-recovery plane).
#                                 Used by DR cutover playbooks to resume
#                                 consumers on the target cluster from
#                                 the correct offsets.
#
#   MirrorHeartbeatConnector    — writes periodic small records (one per
#                                 `heartbeats.topic.heartbeat.interval.
#                                 seconds`, default 1 s) to the
#                                 `heartbeats` topic on the target cluster
#                                 (the observability plane). Downstream
#                                 observers — other MM2 connectors,
#                                 monitoring systems, replication-lag
#                                 dashboards — read this topic to confirm
#                                 the replication pipeline is alive.
#
# `emit.heartbeats.enabled` (default `true`) controls whether
# MirrorHeartbeatConnector ACTUALLY DOES ITS JOB. The connector's only task
# (`MirrorHeartbeatTask`) is to schedule a periodic timer that produces one
# heartbeat record per interval to the `heartbeats` topic. If
# `emit.heartbeats.enabled=false`, the periodic timer is not scheduled; the
# task produces zero records; the connector occupies a Connect-cluster task
# slot, holds a rebalance lease, generates Connect-cluster coordination
# overhead at every restart/rebalance, but produces no useful output.
#
# WHY THIS IS A NULL CONFIGURATION:
#
# Setting `emit.heartbeats.enabled=false` while deploying
# MirrorHeartbeatConnector is a self-contradicting configuration. The
# connector's ONLY job is to emit heartbeats. The other two MM2 connectors
# have multiple responsibilities (MirrorSourceConnector replicates records
# AND syncs configs AND syncs ACLs AND creates topics; MirrorCheckpointConnector
# translates offsets AND emits checkpoints AND optionally syncs consumer-group
# offsets to __consumer_offsets), so disabling one responsibility still
# leaves useful work for the connector. MirrorHeartbeatConnector has
# essentially ONE responsibility: heartbeats. Disabling that responsibility
# leaves the connector as a do-nothing process.
#
# If the operator does not want heartbeats on the target cluster, the
# CORRECT action is to simply not deploy MirrorHeartbeatConnector. Running
# it with emission disabled has all of the following costs and none of the
# benefits:
#
#   - Consumes a Connect-cluster task slot that another connector could use
#   - Holds a rebalance lease, slowing every Connect-cluster restart
#   - Generates Connect-cluster coordination overhead at every restart
#   - Creates a false sense of 'MM2 is fully deployed' (the dashboard shows
#     three connectors running) when in fact the observability substrate
#     is dark
#   - Confuses monitoring: dashboards see the connector running but the
#     heartbeats topic is empty, leading to investigation cycles when
#     someone notices the discrepancy
#
# THE OBSERVABILITY IMPACT:
#
# The heartbeats observability substrate is dark; downstream
# replication-lag monitoring is dark; replication-alive checks return
# 'no recent heartbeat' INDISTINGUISHABLY from an actual replication
# stoppage. The gap is invisible in steady-state operation (no alarms
# fire because no monitoring exists that distinguishes 'connector emits
# no records' from 'connector is broken'); it manifests only during an
# actual replication-stoppage incident or DR drill — exactly the moments
# when the heartbeats substrate is most needed.
#
# HOW THIS HAPPENS:
#
# (a) **Pause that became permanent.** Operator notices heartbeats-topic
#     churn in a dev cluster (86 400 records/day from the default 1-second
#     interval); decides to 'pause' emission via
#     `emit.heartbeats.enabled=false` rather than tune the interval. The
#     pause was supposed to be a 1-day investigation; the operator gets
#     pulled into another incident; the config persists for years.
#
# (b) **Connector deployed for symbolic reasons.** A new SRE 'completes'
#     the MM2 deployment by adding MirrorHeartbeatConnector 'because the
#     MM2 docs mention three connectors and we should have all three for
#     completeness'. Not understanding the connector's purpose, the SRE
#     configures it with `emit.heartbeats.enabled=false` 'to be safe — we
#     don't want the connector emitting random stuff to a topic we don't
#     monitor'. The connector runs in NULL CONFIG for months.
#
# (c) **Tutorial / Helm-chart inheritance.** Early MM2 tutorial blog post
#     used `emit.heartbeats.enabled=false` 'to avoid populating the
#     heartbeats topic in the tutorial environment'. Someone built a Helm
#     chart from the tutorial; every team that deploys the chart inherits
#     the null config.
#
# (d) **Operator misunderstanding of 'emit' semantics.** Operator reads
#     'emit.heartbeats.enabled — Whether to emit heartbeats to target
#     cluster' and interprets 'emit' as 'broadcast loudly' (in the
#     broker-event-emit sense). They worry about cluster-wide noise and
#     disable to 'reduce cluster noise'. The actual semantics — one tiny
#     record per second to a single internal topic — is far more benign.
#
# (e) **Quota-related workaround.** Producer-quota policy on the target
#     cluster throttles per-principal traffic; the MM2 connector
#     principal is being throttled when writing heartbeats; logs are
#     noisy with ThrottlingException. Rather than fix the quota policy
#     or whitelist the MM2 connector principal, the operator disables
#     emission to silence the logs. The quota issue is masked; the
#     heartbeats substrate is permanently dark.
#
# (f) **Cost-savings misunderstanding.** Operator on Confluent Cloud
#     sees a small billed line item for heartbeats-topic ingest and
#     disables emission 'to save money'. The line item is fractions of a
#     penny per day; the 'savings' destroy the team's primary
#     observability signal.
#
# THE FIX:
#
# Either remove the explicit `=false` (the default `=true` is correct):
#
#   # emit.heartbeats.enabled=false       ← DELETE THIS LINE
#
# Or set explicitly to true to make the intent visible:
#
#   emit.heartbeats.enabled=true          ← OK
#
# OR — if heartbeats are genuinely not wanted — remove the entire
# MirrorHeartbeatConnector deployment. Do not run the connector in
# NULL CONFIG.
#
# If the concern is heartbeats-topic record volume, the CORRECT knob is:
#
#   heartbeats.topic.heartbeat.interval.seconds=60
#
# This gives 1440 records/day instead of 86 400/day — 60x less storage,
# still enough for monitoring purposes (1-minute-resolution liveness check).
#
# =============================================================================

name=mm2-heartbeat
connector.class=org.apache.kafka.connect.mirror.MirrorHeartbeatConnector
tasks.max=1

source.cluster.alias=primary
target.cluster.alias=dr

source.cluster.bootstrap.servers=primary-kafka.internal:9093
target.cluster.bootstrap.servers=dr-kafka.internal:9093

heartbeats.topic.replication.factor=3

# VIOLATION: emit.heartbeats.enabled=false on a MirrorHeartbeatConnector is
# a NULL CONFIGURATION. The connector's only job is heartbeat emission;
# disabling emission leaves the connector occupying a Connect-cluster task
# slot, holding rebalance lease, generating coordination overhead, but
# producing zero records. Downstream observability that depends on
# heartbeats is dark. Fix: either remove this line (default `=true` is
# correct) OR remove the MirrorHeartbeatConnector deployment entirely if
# heartbeats are not wanted. To reduce heartbeats-topic record volume,
# use `heartbeats.topic.heartbeat.interval.seconds=60` (NOT this knob).
emit.heartbeats.enabled=false

heartbeats.topic.heartbeat.interval.seconds=1
