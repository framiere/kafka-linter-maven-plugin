# =============================================================================
# IT fixture: STREAMS_PROPERTIES_ACCEPTABLE_RECOVERY_LAG_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A Kafka Streams .properties file destined for `new StreamsConfig(props)`.
#   It declares a complete production-quality Streams config for a LOW-
#   THROUGHPUT STATEFUL KTABLE topology — a user-tier KTable built from
#   a low-volume CDC stream of customer-tier-upgrade events (10 events/
#   sec average, 50 events/sec peak). The topology uses warm-standby
#   replicas (`num.standby.replicas=2`) for HA — 2 warm copies of every
#   state-store partition so that a rebalance can promote a standby
#   without changelog-replay delay.
#
#   Every other Streams knob is set correctly — application.id,
#   bootstrap.servers, default serdes, processing guarantee, replication
#   factor, min.insync.replicas, num.standby.replicas, num.stream.
#   threads, commit.interval.ms, state.dir, both exception handlers,
#   topology.optimization=all, max.task.idle.ms, task.timeout.ms, AND
#   `default.timestamp.extractor=FailOnInvalidTimestamp` explicitly.
#   Everything is set correctly EXCEPT `acceptable.recovery.lag` is
#   not set anywhere.
#
# What's wrong
#   `org.apache.kafka.streams.StreamsConfig.ACCEPTABLE_RECOVERY_LAG_
#   CONFIG` declares `acceptable.recovery.lag` with:
#
#     ConfigDef.Type.LONG,
#     default = 10000 (10,000 records),
#     importance = MEDIUM,
#     validator = ConfigDef.Range.atLeast(0)
#
#   KIP-441 (Apache Kafka 2.6, October 2020) introduced this knob as
#   the WARM-STANDBY PROMOTION THRESHOLD for the
#   HighAvailabilityTaskAssignor (default since 2.6):
#
#     - During a rebalance, for each task, the assignor finds all
#       instances that have a copy of the task's state.
#     - For each candidate, it queries the changelog lag (current
#       changelog end-offset minus the instance's consumed changelog
#       offset for this task).
#     - Candidates with lag <= `acceptable.recovery.lag` are
#       ACCEPTABLE; the assignor prefers the most-caught-up
#       ACCEPTABLE candidate for the active assignment.
#     - If NO candidate is ACCEPTABLE, the assignor falls back to
#       the least-lagged LAGGED candidate and triggers a probing
#       rebalance (interval `probing.rebalance.interval.ms`,
#       default 10 min) to re-check until an ACCEPTABLE candidate
#       emerges.
#
#   The default `10000` is calibrated for typical-throughput
#   production workloads (5,000-50,000 records/sec/partition,
#   where 10,000 records of lag is sub-second to a few seconds).
#
# This fixture's specific risk
#   THIS topology is a LOW-THROUGHPUT stateful aggregation:
#   user-tier-upgrade events at 10 events/sec average. The topology
#   builds a KTable indexed by customer_id; each update is a small
#   state-store write. At 10 events/sec, 10,000 records of changelog
#   lag represents ~17 MINUTES of wall-clock time. A standby that is
#   "ACCEPTABLE" by the default threshold could be 17 minutes behind
#   in event-time.
#
#   When a rebalance triggers (rolling deploy, scale-up, scale-down,
#   broker restart, K8s pod eviction), the HighAvailabilityTaskAssignor
#   considers a 17-minute-behind standby ACCEPTABLE and promotes it
#   to active. The new active starts processing from the standby's
#   stale state and emits 17 minutes of catch-up customer-tier
#   updates to downstream consumers — which see a sudden burst of
#   "tier-changed" events for customers whose tier actually changed
#   17 minutes ago.
#
#   Downstream consumers (a billing-update service, an analytics
#   dashboard, an alerting pipeline) interpret the catch-up burst as
#   a real-time event spike; the billing service may double-bill
#   customers whose tier-change event is replayed; the analytics
#   dashboard shows a fake spike; the alerting pipeline pages on-
#   call for "tier-upgrade flood" that doesn't actually exist.
#
#   The operator typically misdiagnoses this as "rebalance bug" or
#   "downstream consumer bug" without realizing that the root cause
#   is the warm-standby promotion threshold being too lenient for
#   the topology's throughput.
#
# Why this is "INFO" by default (not WARNING or ERROR)
#   (a) For TYPICAL-throughput production Streams workloads (5k-50k
#       rec/sec/partition), the default 10,000 records is fine —
#       it's sub-second to a few seconds of lag, well within
#       acceptable freshness bounds.
#
#   (b) The right NON-default value is workload-dependent —
#       depends on throughput, downstream freshness SLOs, and
#       rebalance frequency. The linter cannot infer the topology's
#       throughput characteristics from .properties alone.
#
#   (c) The bug shape is delayed and rebalance-triggered: it
#       doesn't manifest at deploy time, only during the next
#       rebalance event (rolling restart, scale event, broker
#       outage). Most operators only discover the threshold mis-
#       fit during an incident.
#
#   INFO is the right level: surfaces the missing knob and prompts
#   a deliberate workload-specific choice without false-alarming
#   the typical-default workloads.
#
#   This IT overrides severity to ERROR via pom.xml configuration to
#   force the build to fail and verify the rule fires.
#
# Common bug shapes
#   (1) Low-throughput CDC stream — standby is hours behind but
#       considered acceptable.
#       THIS app: 10 events/sec; 10,000 records = ~17 minutes of
#       state. Rebalance promotes a 17-min-stale standby. Downstream
#       sees a flood of 17-min-old "tier changed" events. Setting
#       `acceptable.recovery.lag=100` (= 10 seconds at 10 events/
#       sec) ensures promotion only when the standby is genuinely
#       caught up.
#
#   (2) Very high-throughput stream — default is fine but
#       aggressive setting cuts probing rebalances.
#       A Streams app at 500k events/sec/partition: 10,000 records
#       of lag = 20 ms. The default is fine but the operator could
#       set `acceptable.recovery.lag=100000` (= 200 ms) to reduce
#       probing-rebalance frequency during cold-start scenarios
#       where warm-ups are catching up rapidly.
#
#   (3) Sparse-update KTable with compacted source.
#       A Streams app builds a KTable from a compacted topic
#       (customer-profile changes at ~1 event/key/day, 10M records
#       compacted to ~5M). The default could be exceeded only
#       during the initial state-restore (which the compacted topic
#       naturally bounds); the knob is effectively inert in steady-
#       state.
#
#   (4) Bursty workload — calm period vs spike.
#       A Streams app processes log events at 100 events/sec
#       average and 50,000 events/sec spike during incident
#       detection. During calm, 10,000 records = 100 seconds; during
#       spike, 10,000 records = 200 ms. The right value depends on
#       which mode the operator optimizes for.
#
#   (5) Cross-cluster MirrorMaker2-mirrored source.
#       The standby lag is measured against the local changelog,
#       not against the original source. MirrorMaker2 lag doesn't
#       directly affect this knob, but the operator should be aware
#       that "standby is acceptable" doesn't mean "standby is
#       current with the source DB".
#
#   (6) Spring Boot Streams autoconfig — org-wide default leaks.
#       Spring Boot's Streams autoconfiguration (`spring-kafka`)
#       provides a `KafkaStreamsConfiguration` bean from
#       `application.yml`. The default Spring template DOES NOT
#       include `acceptable.recovery.lag`. Every Spring Boot
#       Streams app inherits the framework default 10,000. For an
#       org with diverse-throughput workloads, the org-wide
#       default-leak masks workload-specific tuning.
#
# Fix
#   ONE LINE. For typical-throughput production workloads:
#     acceptable.recovery.lag=10000        # 10k records — explicit
#                                          # default; documents the
#                                          # deliberate choice;
#                                          # insulates from future
#                                          # framework default
#                                          # changes.
#
#   For very-high-throughput workloads (>100k rec/sec/partition):
#     acceptable.recovery.lag=100000       # 100k records — still
#                                          # <1 second at 200k rec/
#                                          # sec; cuts probing-
#                                          # rebalance frequency.
#
#   For LOW-throughput workloads (THIS app's case — <100 rec/sec/
#   partition):
#     acceptable.recovery.lag=100          # 100 records — small
#                                          # absolute lag; promotes
#                                          # only when standby is
#                                          # genuinely caught up
#                                          # in event-time.
#
#   For fail-fast / no-tolerance workloads:
#     acceptable.recovery.lag=0            # Promote ONLY when
#                                          # EXACTLY caught up;
#                                          # eliminates any state-
#                                          # staleness on promotion
#                                          # at the cost of more
#                                          # probing-rebalance
#                                          # churn.
#
# Sibling rules
#   `STREAMS_PROPERTIES_NUM_STANDBY_REPLICAS_ABSENT` catches the
#   absent case for the warm-standby count knob — `num.standby.
#   replicas` declares how many warm copies exist; `acceptable.
#   recovery.lag` declares when one is "good enough" to promote.
#   The two rules form a pair: standby replicas without a
#   workload-tuned promotion threshold may produce stale
#   promotions; a tight threshold without standbys produces only
#   probing-rebalance churn.
# =============================================================================

application.id=user-tier-upgrade-ktable-stream
bootstrap.servers=broker-1.kafka.prod.example.com:9092,broker-2.kafka.prod.example.com:9092,broker-3.kafka.prod.example.com:9092

# Default serdes used by topology operators that don't pass explicit
# Consumed/Produced/Materialized/Grouped.
default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
default.value.serde=io.confluent.kafka.streams.serdes.avro.SpecificAvroSerde

# Internal-topic durability (replication factor for changelog + repartition topics).
replication.factor=3
min.insync.replicas=2

# Throughput & latency.
num.stream.threads=4
commit.interval.ms=5000

# HA for stateful tasks — 2 warm copies of every state-store partition,
# so that a rebalance can promote a standby without full changelog-
# replay delay.
num.standby.replicas=2

# At-least-once with explicit commit cadence.
processing.guarantee=at_least_once

# State-store location (outside /tmp; survives container restarts when mounted as a volume).
state.dir=/var/lib/kafka-streams/user-tier-upgrade-ktable

# Internal-topic-layout consolidation (KIP-295 / KIP-862).
topology.optimization=all

# Exception handlers — both set, so the existing handler-absent rules don't fire.
default.deserialization.exception.handler=org.apache.kafka.streams.errors.LogAndContinueExceptionHandler
default.production.exception.handler=org.apache.kafka.streams.errors.LogAndContinueProductionExceptionHandler

# Schema registry (Confluent Avro deserializer dependency).
schema.registry.url=http://schema-registry.kafka.prod.example.com:8081

# Single-source KTable — `max.task.idle.ms=0` is correct; set EXPLICITLY
# to isolate from STREAMS_PROPERTIES_MAX_TASK_IDLE_MS_ABSENT.
max.task.idle.ms=0

# 30-min retry budget — accommodates prolonged broker outages.
# Set EXPLICITLY to isolate from STREAMS_PROPERTIES_TASK_TIMEOUT_MS_ABSENT.
task.timeout.ms=1800000

# Kafka-native producers write to LogAppendTime-typed topics — the broker
# guarantees valid timestamps; fail-fast on invalid is the right posture.
# Set EXPLICITLY to isolate from STREAMS_PROPERTIES_DEFAULT_TIMESTAMP_
# EXTRACTOR_ABSENT.
default.timestamp.extractor=org.apache.kafka.streams.processor.FailOnInvalidTimestamp

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# MISSING:
#   acceptable.recovery.lag=...
# Without this key, Kafka Streams defaults `acceptable.recovery.lag` to
# `10000` (10,000 records, declared in StreamsConfig.ACCEPTABLE_RECOVERY_
# LAG_CONFIG with ConfigDef.Type.LONG). Per KIP-441 (Apache Kafka 2.6,
# October 2020), this is the WARM-STANDBY PROMOTION THRESHOLD: during a
# rebalance, a standby task with changelog-lag <= acceptable.recovery.lag
# is eligible for promotion to active. The default 10,000 is calibrated
# for typical-throughput workloads (5k-50k rec/sec/partition, where 10k
# records is sub-second of lag). For THIS app — low-throughput user-tier
# upgrades at 10 events/sec — 10,000 records of lag represents ~17
# MINUTES of wall-clock time. A rebalance can promote a 17-minute-stale
# standby; the new active emits a flood of catch-up tier-changed events;
# downstream billing/analytics/alerting misinterpret the flood as a
# real-time spike. For THIS app: `acceptable.recovery.lag=100` (= 10
# seconds at 10 events/sec) ensures promotion only when the standby is
# genuinely caught up. For typical-throughput workloads, `acceptable.
# recovery.lag=10000` (explicit default). For very-high-throughput
# workloads (>100k rec/sec/partition), `acceptable.recovery.lag=100000`
# (still <1 second at 200k rec/sec). For fail-fast / no-tolerance
# workloads, `acceptable.recovery.lag=0` (only promote when EXACTLY
# caught up).
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
