name=debezium-orders-cdc
connector.class=io.debezium.connector.postgresql.PostgresConnector
tasks.max=1

database.hostname=db.internal
database.port=5432
database.user=debezium
database.password=secret
database.dbname=orders
database.server.name=orders-cdc
plugin.name=pgoutput
slot.name=debezium

table.include.list=public.orders
topic.prefix=cdc.orders

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081

# SMT chain lists three aliases. The operator added 'UnwrapEnvelope' after a
# refactor (renamed from 'Unwrap') but forgot to provide the matching type.
# transforms.UnwrapEnvelope.type is MISSING — the task will fail at startup
# with: ConfigException: Missing required configuration "transforms.UnwrapEnvelope.type"
transforms=AddPrefix,UnwrapEnvelope,Cast

transforms.AddPrefix.type=org.apache.kafka.connect.transforms.RegexRouter
transforms.AddPrefix.regex=cdc\\.(.+)
transforms.AddPrefix.replacement=cdc.prod.$1

transforms.Cast.type=org.apache.kafka.connect.transforms.Cast$Value
transforms.Cast.spec=order_total:float64
