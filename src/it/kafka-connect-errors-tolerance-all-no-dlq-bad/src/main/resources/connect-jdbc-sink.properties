name=jdbc-sink-orders
connector.class=io.confluent.connect.jdbc.JdbcSinkConnector
tasks.max=2

topics=orders

connection.url=jdbc:postgresql://db.internal:5432/orders
connection.user=connect
connection.password=secret
insert.mode=upsert
pk.mode=record_key
pk.fields=order_id

key.converter=org.apache.kafka.connect.json.JsonConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=false
value.converter.schemas.enable=false

# Anti-pattern: errors.tolerance=all swallows EVERY per-record processing exception,
# but there is no errors.deadletterqueue.topic.name to preserve the failing record bytes.
# Connect's runtime increments errors.tolerated and continues — the bad record is gone
# from the pipeline with no recovery path. KIP-298 specifically warned against this.
errors.tolerance=all
