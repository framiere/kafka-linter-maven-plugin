name=debezium-cdc-source
connector.class=io.debezium.connector.postgresql.PostgresConnector
tasks.max=1

database.hostname=cdc-db.internal
database.port=5432
database.user=debezium
database.password=changeme
database.dbname=orders
topic.prefix=cdc.orders
slot.name=debezium_cdc_orders
schema.history.internal.kafka.topic=cdc.orders.schema-history
schema.history.internal.kafka.bootstrap.servers=kafka:9092
table.include.list=public.customers,public.orders

snapshot.mode=initial

# KIP-558 topic-auto-creation defaults (required for any topic.creation to work)
topic.creation.default.replication.factor=3
topic.creation.default.partitions=6

# Anti-pattern: 'compacted' group is FULLY defined (include regex + cleanup
# policy + partition count) but 'compacted' is NOT in topic.creation.groups
# (which lists only 'highvolume'). Connect's KIP-558 framework iterates ONLY
# the groups in topic.creation.groups — every topic.creation.compacted.* entry
# is SILENTLY IGNORED at runtime. The operator intends CDC topics to be
# created as compacted topics so each primary-key key retains its latest
# event indefinitely (a changelog topic pattern); instead the topics are
# created with the default cleanup.policy=delete and the broker's default
# retention.ms, so after the retention window the CDC history is lost.
# Discovered six months later when a new microservice tries to bootstrap
# its state from the topic and finds early history missing.
topic.creation.groups=highvolume

topic.creation.highvolume.include=cdc\\.orders\\..*\\.events
topic.creation.highvolume.partitions=24
topic.creation.highvolume.replication.factor=3

topic.creation.compacted.include=cdc\\.orders\\..*
topic.creation.compacted.cleanup.policy=compact
topic.creation.compacted.partitions=12

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
