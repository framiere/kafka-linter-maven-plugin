name=hdfs3-analytics-sink
connector.class=io.confluent.connect.hdfs3.Hdfs3SinkConnector
tasks.max=4

topics=events.clicks,events.impressions

hdfs.url=hdfs://namenode.hadoop.internal:8020
hadoop.conf.dir=/etc/hadoop/conf
topics.dir=/data/lake/events
logs.dir=/data/lake/_logs

# Anti-pattern: very large flush.size with no time-based rotation.
# At realistic throughput (5K records/sec/partition × 2KB/record) the
# per-partition heap buffer grows by 10MB/sec — fills 20GB in ~33 min,
# OOMing the Connect worker long before flush.size fires. Need either
# a smaller flush.size or a positive rotate.interval.ms /
# rotate.schedule.interval.ms to bound the buffer in time.
flush.size=10000000

format.class=io.confluent.connect.hdfs3.parquet.ParquetFormat
partitioner.class=io.confluent.connect.storage.partitioner.TimeBasedPartitioner
partition.duration.ms=3600000
path.format='year'=YYYY/'month'=MM/'day'=dd/'hour'=HH
locale=en-US
timezone=UTC
timestamp.extractor=Record

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
