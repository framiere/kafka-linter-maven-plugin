name=customers-cdc
connector.class=io.debezium.connector.mysql.MySqlConnector
tasks.max=1

database.hostname=customers-db.internal
database.port=3306
database.user=debezium
database.password=changeme
database.server.id=184071
database.include.list=crm

topic.prefix=cdc.customers

schema.history.internal.kafka.topic=cdc.customers.schema-history
schema.history.internal.kafka.bootstrap.servers=kafka:9092

table.include.list=crm.customers,crm.addresses,crm.consent_log

snapshot.mode=initial

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081

# Anti-pattern: tombstones.on.delete=false SUPPRESSES the Kafka tombstone
# record (key + null value) that Debezium normally emits after every
# row-deletion change event. The downstream consumers of cdc.customers.*
# include:
#   - log-compacted topics (cleanup.policy=compact) for changelog state
#   - a Kafka Streams app materializing cdc.customers.crm.customers as a
#     KTable, joined against the orders stream to enrich each order with
#     the customer's address
#   - a Confluent JDBC sink connector with delete.enabled=true that
#     mirrors customers into the analytics warehouse
#   - Mirror Maker 2 replication of the compacted topics to the DR cluster
# Every one of these systems is broken by suppressing tombstones:
#   - compacted topics never reclaim disk for deleted customer keys (the
#     broker's log-cleaner has no signal to compact them away)
#   - the KTable RETAINS the last op=d envelope as the customer's
#     "current state", and the orders stream-table join then enriches
#     incoming orders with a GDPR-deleted customer's address
#   - the JDBC sink IGNORES op=d events (its delete handler is keyed on
#     tombstones, not on envelope semantics) and the analytics warehouse
#     accumulates ghost customer rows
#   - cross-cluster compacted-topic replication loses delete semantics
# The fix is one of two: remove the key (default tombstones.on.delete=true)
# or set it to true.
tombstones.on.delete=false
