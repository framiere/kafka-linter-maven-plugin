name=audit-log-cdc
connector.class=io.debezium.connector.postgresql.PostgresConnector
tasks.max=1

database.hostname=shared-pg.internal
database.port=5432
database.user=debezium
database.password=changeme
database.dbname=appdb

topic.prefix=cdc.audit

slot.name=debezium_audit_log
plugin.name=pgoutput

# Server-side publication filtering: the publication captures ONLY the
# audit_log table, NOT every table on the appdb server. This is what
# operators reach for when they want to minimize WAL-decode CPU cost on
# Postgres for a shared database (the server hosts the legacy app's
# orders/customers schemas + a billing schema + this audit_log table,
# and only audit_log is CDC'd).
publication.name=dbz_publication_audit
publication.autocreate.mode=filtered

table.include.list=public.audit_log

# Anti-pattern: heartbeat.interval.ms=0 EXPLICITLY disables Debezium
# heartbeats while the publication is filtered. The audit_log table is
# written every few minutes by background jobs during business hours,
# but goes SILENT on weekends (no jobs scheduled). Meanwhile the
# orders/customers/billing schemas on the same shared-pg.internal
# server generate ~50GB/day of WAL. Without heartbeats:
#   - Debezium has nothing to ACK (no events from audit_log)
#   - the replication slot's confirmed_flush_lsn stays PINNED at the
#     last weekday LSN
#   - Postgres retains every WAL segment past restart_lsn (the slot's
#     view of the world)
#   - by Monday morning, pg_wal/ is 90GB+; the data partition fills;
#     Postgres crashes with "could not write to file ... No space left
#     on device"
# Recovery: page the DBA; either drop the slot (forces re-snapshot of
# audit_log — locks production tables for hours) or delete WAL segments
# (data loss, slot corruption). Both options are bad.
# Fix: set heartbeat.interval.ms=10000 (10 seconds). Debezium will then
# issue a tiny periodic LSN advance via STANDBY_STATUS_UPDATE — the
# slot's confirmed_flush_lsn stays current even during weekend silence.
heartbeat.interval.ms=0

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false

snapshot.mode=initial
