# =============================================================================
# A Confluent S3 sink connector configuration where the operator set
# `rotate.interval.ms = 5000` (5 seconds of EVENT TIME) on a base
# S3SinkConnector. The operator wanted "5-second fresh data in S3" and
# reached for `rotate.interval.ms` thinking it was the freshness dial.
# `rotate.interval.ms` is NOT a wall-clock freshness dial — it is the
# EVENT-TIME flush trigger. The 5-second value produced a small-object
# storm under steady-arrival production load (millions of sub-MB
# objects per day) within hours of deployment.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#
#   connector.class    = io.confluent.connect.s3.S3SinkConnector
#   rotate.interval.ms = 5000   # 5 seconds of EVENT TIME — far below
#                               # the plugin's threshold of 60_000
#                               # (1 minute), well below the typical
#                               # production value of 300_000 (5 min),
#                               # and producing a sub-minute flush
#                               # cadence at production scale.
#
# WHAT `rotate.interval.ms` ACTUALLY DOES:
#
# `rotate.interval.ms` is the EVENT-TIME flush trigger — one of THREE
# OR'd triggers in the S3 sink's flush model. The triggers are:
#
#   (1) flush.size                  — record-count trigger
#   (2) rotate.interval.ms          — EVENT-TIME trigger (gap between
#                                     first-buffered-record timestamp
#                                     and latest-record timestamp)
#   (3) rotate.schedule.interval.ms — WALL-CLOCK trigger (time since
#                                     buffer was opened)
#
# Whichever fires first triggers the flush. EVERY flush produces
# EXACTLY ONE object in S3 (or HDFS, or GCS for the sibling sinks).
#
# Distinction between (2) and (3) is CRITICAL and often missed:
#
#   rotate.interval.ms       — measures the EVENT-TIMESTAMPS of the
#                              RECORDS in the buffer. If records arrive
#                              with strictly-monotonic timestamps at
#                              wall-clock rate, then yes, this approximates
#                              wall-clock. BUT: for backfills (records
#                              with month-old timestamps replayed at full
#                              throttle), this trigger fires HOURS of
#                              event-time per second of wall-clock — the
#                              buffer flushes thousands of times.
#
#   rotate.schedule.interval.ms — measures System.currentTimeMillis()
#                                 ELAPSED since the buffer was opened.
#                                 This is the WALL-CLOCK trigger; it
#                                 always fires at the configured wall-
#                                 clock cadence regardless of event-time.
#
# An operator who wants "flush every minute regardless of throughput"
# should use rotate.schedule.interval.ms — NOT rotate.interval.ms.
#
# THE BLAST RADIUS OF rotate.interval.ms = 5000:
#
# With rotate.interval.ms = 5000 (5 seconds of event time), under
# steady-arrival load every active buffer flushes at least once every
# 5 seconds of event-time-progress. For a typical production-scale
# cluster:
#
#   500 topic-partitions × 4 tasks × ~10 partition-keys = 20K active buffers
#   20K active buffers × (1 flush per 5 sec event-time) = 4K flushes/sec
#                                                       = 4K objects/sec
#                                                       = 14.4M objects/hour
#                                                       = 345M objects/day
#
# (a) **S3 PUT-rate per-prefix saturation.** AWS S3 caps PUT requests
#     at 3500 PUTs/sec PER PREFIX. The connector saturates this within
#     a single second, producing HTTP 503 `SlowDown` errors. The AWS
#     SDK retries with exponential backoff; the connector's heap fills
#     with retry queues; eventually the worker OOMs and all connectors
#     on the worker fail.
#
# (b) **S3 LIST cost amplification.** AWS S3 LIST is priced per 1000
#     keys. 345M objects/day × Athena query frequency = millions of
#     LIST requests per day; the LIST cost line item dwarfs everything
#     else on the S3 bill.
#
# (c) **Downstream query-engine planner regression.** Athena, Trino,
#     Presto, BigQuery, and Spark all optimize for FEWER LARGER
#     OBJECTS. Hundreds of millions of objects per query partition
#     cause severe planner regression: per-file metadata read, per-
#     file open/close overhead, per-file Parquet footer parse.
#     Query latency rises from seconds to hours.
#
# (d) **Per-format overhead dominates.** For Parquet/ORC outputs, each
#     small object has fixed metadata overhead (Parquet footer, ORC
#     stripe metadata). With <KB of data per object, the metadata
#     bytes can EXCEED the data bytes. A 100-byte record becomes a
#     ~1KB Parquet file because of the footer overhead.
#
# (e) **S3 lifecycle-rule iteration overhead.** S3 lifecycle policies
#     (delete-after-30-days, transition-to-Glacier-after-90-days)
#     iterate per-object internally. Hundreds of millions of objects
#     amplify per-rule processing time; rules can take DAYS to complete
#     each day; AWS may rate-limit the account's lifecycle processing.
#
# (f) **S3 prefix hot-spotting.** Under shared time-partition prefixes
#     (HourlyPartitioner, DailyPartitioner), all partition-keys
#     simultaneously create new objects every 5 seconds under the SAME
#     S3 prefix. S3 PUT-rate is per-PREFIX, not per-object: the prefix
#     is saturated at thousands of PUTs/sec.
#
# (g) **Backfill amplification.** A MirrorMaker backfill replaying 90
#     days of history at full throttle: each record's timestamp is
#     historical; the event-time gap between consecutive records
#     accelerates the rotate.interval.ms trigger; the buffer flushes
#     MANY times per real-wall-clock-second during backfill, producing
#     millions of objects in a few hours.
#
# WHY 60_000 IS THE PLUGIN'S CHOSEN THRESHOLD:
#
# The 60_000 ms (1 minute) line is consistent with the
# CONNECT_STORAGE_SINK_PARTITION_DURATION_MS_TOO_LOW rule's threshold.
# Sub-minute rotation produces more than one flush per minute per
# active buffer; at production scale, that's millions of objects per
# day from a SINGLE connector. The 60_000 threshold is the plugin's
# pragmatic line between "aggressive but defensible" (60_000-300_000 —
# small fresh-bias case, operator's call) and "definitely wrong"
# (<60_000 — no legitimate production justification).
#
# An operator who deliberately needs sub-minute event-time rotation (a
# rare and almost certainly questionable choice) should suppress this
# rule with:
#
#   <CONNECT_STORAGE_SINK_ROTATE_INTERVAL_MS_TOO_LOW>OFF</CONNECT_STORAGE_SINK_ROTATE_INTERVAL_MS_TOO_LOW>
#
# and document the rationale in the .properties file.
#
# HOW SUB-60-SECOND VALUES END UP IN PRODUCTION:
#
# (i) **'Real-time data lake' misconception (most common).** Operator
#     wants "fresh data in S3" and sets `rotate.interval.ms = 5000`
#     (or 1000) thinking smaller is better for freshness. They do not
#     realize:
#       - rotate.interval.ms is per-buffer flush cadence, not "data
#         visibility latency end-to-end" — downstream Athena/Trino
#         scan cost is driven by object count.
#       - The CORRECT dial for wall-clock freshness is
#         rotate.schedule.interval.ms.
#       - At production scale, the per-buffer cadence multiplies by
#         partitions × tasks × partition-keys to produce per-cluster
#         object-creation rate.
#
# (ii) **Confusion with rotate.schedule.interval.ms.** Operator wants
#      "a wall-clock flush every 30 seconds as a safety net" (a
#      reasonable goal) and sets `rotate.interval.ms = 30000` thinking
#      it's wall-clock. On a steady-arrival low-throughput partition,
#      this LOOKS correct (event-time roughly tracks wall-clock). On a
#      HIGH-throughput partition or a partition with future-dated
#      records (test data, backfill), event-time advances fast — the
#      buffer flushes far more often than 1/30s wall-clock. The intent
#      is right; the dial is wrong. They should use
#      rotate.schedule.interval.ms=30000 instead.
#
# (iii) **Debug mode never reverted.** Operator sets
#       `rotate.interval.ms = 5000` during initial deployment to
#       verify the partitioner+writer logic works at low throughput;
#       they confirm it works; they never revert; the connector ships
#       to production at 50K records/sec/partition; the production
#       cluster generates millions of objects/hour.
#
# (iv) **Tutorial copy-paste at scale.** A Confluent S3 sink tutorial
#      uses `rotate.interval.ms = 10000` (10 seconds) so the tutorial
#      "shows results quickly". The tutorial cluster has 3 partitions
#      and 100 records/sec; the production cluster has 500 partitions
#      and 50_000 records/sec. The tutorial's rotate.interval.ms=10000
#      that produced 6 objects/min in the tutorial produces 600+
#      objects/sec in production.
#
# (v) **Backfill job with event-time skew.** An operator runs a
#     MirrorMaker backfill replaying 90 days of historical data into
#     a fresh S3 sink. The backfilled records have event-timestamps
#     spanning months/years; `rotate.interval.ms = 300000` (5 min) on
#     the sink fires on 5 minutes of EVENT-TIME — for backfilled data
#     spanning 90 days, that's 90×24×60/5 = 25_920 rotations per
#     partition from event-time progression alone. The fix here is to
#     TEMPORARILY disable event-time rotation (rotate.interval.ms=-1)
#     during backfill and re-enable it after catch-up.
#
# (vi) **Helm chart with debug default leftover.** A debug Helm chart
#      values.yaml has `rotateIntervalMs: 5000` to support local
#      debug-mode integration tests. The chart's defaults somehow
#      propagate to production via a chart-merge mishap;
#      rotate.interval.ms=5000 ships to a real cluster.
#
# THE FIX:
#
# Replace `rotate.interval.ms = 5000` with EITHER:
#
#   rotate.interval.ms = 300000  # 5-minute event-time rotation — typical
#                                # production value, balances object size
#                                # against downstream freshness
#   rotate.interval.ms = 900000  # 15-minute event-time rotation — even
#                                # larger objects, slower freshness
#
# OR, if event-time rotation is not specifically needed, remove the
# key entirely:
#
#   # rotate.interval.ms removed — inherits Confluent default -1
#   # (EVENT-TIME ROTATION DISABLED — only flush.size and
#   # rotate.schedule.interval.ms apply)
#
# OR, if sub-minute freshness is genuinely required for an operational
# reason (a rare case), use rotate.schedule.interval.ms (WALL-CLOCK)
# instead — and document the small-object-storm tradeoff explicitly:
#
#   rotate.schedule.interval.ms = 30000  # wall-clock 30-sec freshness
#                                        # ACCEPTS the small-object cost
#   # rule suppression with rationale:
#   # <CONNECT_STORAGE_SINK_ROTATE_INTERVAL_MS_TOO_LOW>OFF</...>
#
# =============================================================================

name=customer-events-s3-sink
connector.class=io.confluent.connect.s3.S3SinkConnector
tasks.max=4
topics=customer.events

s3.bucket.name=my-prod-customer-events-bucket
s3.region=us-east-1

format.class=io.confluent.connect.s3.format.json.JsonFormat
storage.class=io.confluent.connect.s3.storage.S3Storage

flush.size=1000

# VIOLATION: rotate.interval.ms = 5000 (5 seconds of EVENT TIME) —
# FAR below the plugin's 60_000 ms (1 minute) threshold. This is the
# EVENT-TIME flush trigger; with steady-arrival production load it
# produces at least one flush every 5 seconds of event-time per
# active buffer, which at production scale (500 partitions × 4 tasks
# × ~10 partition-keys = 20K active buffers) is 4K objects/sec
# sustained — saturating S3 PUT-rate per-prefix limits (3500
# PUTs/sec/prefix), inflating S3 LIST cost, regressing downstream
# Athena/Trino query planners, and amplifying S3 lifecycle-rule
# iteration time. The 5-second value originated from the operator's
# "real-time data lake" misconception (smaller does NOT make data
# fresher; that's rotate.schedule.interval.ms's job). Fix: raise to
# 300000 (5 min), or remove the key to inherit the Confluent default
# -1 (disabled), or — if sub-minute freshness is genuinely required —
# use rotate.schedule.interval.ms (WALL-CLOCK) instead.
rotate.interval.ms=5000

partitioner.class=io.confluent.connect.storage.partitioner.HourlyPartitioner
path.format='year'=YYYY/'month'=MM/'day'=dd/'hour'=HH
locale=en
timezone=UTC
timestamp.extractor=Record

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false
