name=billing-cdc
connector.class=io.debezium.connector.mysql.MySqlConnector

tasks.max=1

# Anti-pattern: legacy Debezium 1.x schema-history config keys carried
# forward into a Debezium 2.x deployment. In Debezium 2.0, the entire
# `database.history.*` config namespace was RENAMED to
# `schema.history.internal.*` (the prefix changed to clarify that the
# schema-history topic is an INTERNAL connector concern, not user-facing).
#
# This config was originally deployed against Debezium 1.6 in 2021 — a
# working setup at the time. The Connect cluster was bounced through
# Debezium 1.9 → 2.1 → 2.4 over the next two years; the connector
# continued to operate because:
#   - the existing schema-history topic on Kafka was already present
#     (created during the 1.x deployment, name=schema-history.billing-mysql)
#   - the connector's in-memory schema model was preserved across each
#     worker bounce (in-place upgrade, not connector recreate)
#   - the legacy `database.history.*` keys were silently ignored by 2.x
#     (Connect's unknown-key behavior is accept-and-pass-through; the
#     REST-API PUT-validate endpoint does NOT flag unknown keys)
#
# Critically, Debezium 2.x's KafkaSchemaHistory implementation REQUIRES
# `schema.history.internal.kafka.bootstrap.servers` to function. With
# the legacy keys silently ignored AND the modern keys absent, the
# connector's schema-history configuration is EFFECTIVELY EMPTY in the
# Debezium 2.x runtime. Why didn't the connector fail at start()? Because
# the connector's in-memory schema model survived the worker bounces;
# the connector NEVER had occasion to re-read schema-history from Kafka.
#
# The latent breakage will surface at the next event that forces a
# schema-history re-read from Kafka:
#   - a connector recreate (when the worker pool is fully replaced
#     rather than rolling-upgraded)
#   - a Kafka rebalance that moves the connector's tasks to a worker
#     that has never seen the connector before (no warm in-memory state)
#   - an explicit `POST /connectors/<name>/restart` operation
#   - a Kafka broker outage that triggers a full worker restart
#
# When that re-read happens, the connector throws:
#   ConfigException: schema.history.internal.kafka.bootstrap.servers is
#   required for KafkaSchemaHistory.
#
# The connector's REST-API status will then be FAILED; the CDC topics
# stop receiving events; downstream consumers (the Kafka Streams
# billing-aggregation app, the JDBC sink replicating to the analytics
# warehouse, the search-index updater) start to lag.
#
# Recovery: rename each legacy key per the documented mapping:
#   database.history.kafka.bootstrap.servers
#     → schema.history.internal.kafka.bootstrap.servers
#   database.history.kafka.topic
#     → schema.history.internal.kafka.topic
#   database.history.skip.unparseable.ddl
#     → schema.history.internal.skip.unparseable.ddl
#   database.history.store.only.captured.tables.ddl
#     → schema.history.internal.store.only.captured.tables.ddl
#
# The migration is mechanical (one-to-one prefix rename), has NO
# downstream impact (the schema-history topic's contents and consumer
# semantics are identical), and has NO Kafka-side changes (the existing
# schema-history topic schema-history.billing-mysql can be reused under
# the new key name — pointing the new config at the same topic name
# preserves continuity, and the connector's first schema-history replay
# against the new config reads the same topic the legacy config used).
#
# Static-analysis catch at PR time prevents the latent breakage from
# surfacing during an unrelated operational event (rebalance, restart,
# broker outage) where the team is already under stress.
database.history.kafka.bootstrap.servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
database.history.kafka.topic=schema-history.billing-mysql
database.history.skip.unparseable.ddl=true
database.history.store.only.captured.tables.ddl=true

database.hostname=billing-mysql-primary.internal
database.port=3306
database.user=debezium
database.password=changeme
database.server.id=184056
database.include.list=billing

topic.prefix=cdc.billing

table.include.list=billing.invoices,billing.line_items,billing.payments

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
