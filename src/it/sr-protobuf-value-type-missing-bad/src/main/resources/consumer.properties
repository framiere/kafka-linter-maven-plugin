# =============================================================================
# A Kafka consumer configuration that wires Confluent's
# `KafkaProtobufDeserializer` for the value channel without setting
# `specific.protobuf.value.type`. The deserializer falls back to returning
# `com.google.protobuf.DynamicMessage` instead of the generated typed class.
# Unlike the JSON-Schema case (silent ClassCastException at first cast), the
# Protobuf default is technically functional — `Object` references survive —
# but every line of typed downstream code (`record.value().getAccountId()`)
# fails to compile against `DynamicMessage`. Developers typically work around
# the problem by casting to `DynamicMessage` and reading fields by name
# string, losing all compile-time type safety.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#
#   value.deserializer            = io.confluent...KafkaProtobufDeserializer
#   # specific.protobuf.value.type = (UNSET)              ← TYPE GATE OPEN
#
# WHY THIS DEGRADES THE CONSUMER WITHOUT AN IMMEDIATE CRASH:
#
# Confluent's `KafkaProtobufDeserializer<T extends Message>` has a generic
# `<T>` parameter constrained to extend `com.google.protobuf.Message`, but
# Java erases generics at runtime (JLS §8.1.2). The deserializer cannot see
# the caller's intended `Transaction.class` from
# `new KafkaProtobufDeserializer<Transaction>()`. The deserializer reads
# `specific.protobuf.value.type` (for values) or `specific.protobuf.key.type`
# (for keys) from the Kafka properties; if set, it resolves the FQCN via
# `Class.forName(...)`, verifies the class extends `Message`, invokes the
# static `<T>.parseFrom(byte[])` factory (every generated Protobuf class has
# one), and returns the TYPED POJO. If UNSET, the deserializer builds a
# `DynamicMessage` from the schema registered in SR + the wire bytes — a
# generic reflective representation that carries the same data but offers no
# Java-level typed accessors.
#
# The asymmetry that makes this less obvious than the JSON case: the cast to
# the generated class doesn't crash on access because `DynamicMessage` IS a
# `Message` (the abstract supertype). Code that uses `(Message) record.value()`
# works. The problem appears in two shapes: (a) code written against the
# generated class fails to COMPILE against `DynamicMessage` (so developers
# work around it with `(DynamicMessage)` casts and reflective field lookups);
# (b) Streams topologies that join two Protobuf topics get `DynamicMessage`
# on both sides — typed selector functions like
# `(left, right) -> left.getAccountId() + right.getMerchantId()` cannot
# compile, so the developer either gives up on the join or rewrites it with
# string-typed accessors.
#
# REAL-WORLD INCIDENT SHAPES:
#
# (1) **Reflective field-access workaround proliferates.**
#     Developer notices that `(Transaction) rec.value()` fails to compile
#     and works around it by casting to `DynamicMessage` and reading fields
#     by name:
#       `((DynamicMessage) rec.value()).getField(
#            msg.getDescriptorForType().findFieldByName("account_id"))`
#     The cast works at runtime; the field access works. Type safety is
#     LOST throughout the downstream chain. Code becomes fragile to field
#     renames (string-typed name lookups don't break at compile time). The
#     lint rule's job is to flag the missing-type-FQCN BEFORE this workaround
#     proliferates across the codebase.
#
# (2) **Avro → Protobuf migration.**
#     Team converts a topic from Avro to Protobuf for performance or
#     cross-language reasons. The Avro deserializer config
#     (`specific.avro.reader=true`) is removed; the team adds
#     `value.deserializer=KafkaProtobufDeserializer` and forgets
#     `specific.protobuf.value.type`. Existing typed consumer code starts
#     seeing `DynamicMessage` at runtime; the build fails with compile
#     errors. The team scrambles to add the property under deadline pressure;
#     a calm static-analysis catch at PR time would have prevented the
#     scramble.
#
# (3) **Streams topology can't access typed fields.**
#     Streams app processes Protobuf topics; the developer wires
#     `default.value.serde=KafkaProtobufSerde` and writes a topology with
#     typed `mapValues` lambdas. The compile fails because
#     `KafkaProtobufSerde<DynamicMessage>` can't produce the typed POJO the
#     lambdas expect. The developer either rewrites the lambdas with
#     `DynamicMessage` accessors (losing type safety) or adds explicit
#     `KafkaProtobufSerde<Transaction>` instances per topic via
#     `Consumed.with(...)` (the right fix). The lint rule's job: flag the
#     missing `specific.protobuf.value.type` BEFORE the rewrite happens.
#
# (4) **Mixed Protobuf types in a Streams topology.**
#     Streams app processes multiple Protobuf topics with different message
#     types. The developer sets `default.value.serde=KafkaProtobufSerde`
#     with `specific.protobuf.value.type=TopicAType` and uses explicit
#     serdes for topic B. The default-serde catches topic A correctly but
#     the developer forgot to wire an explicit serde for topic C; topic-C
#     records deserialize via the default serde and `parseFrom` is invoked
#     against the wrong generated class — typically throws an
#     `InvalidProtocolBufferException` or returns a malformed POJO.
#     Symptom: occasional crashes when topic C's records flow through the
#     join.
#
# (5) **Generic schema-inspection tooling (the legitimate `DynamicMessage`
#     use case).** Federation gateways, log forwarders, audit-trail tools
#     that don't care about field semantics legitimately use `DynamicMessage`
#     for protocol-agnostic record forwarding. This is the false-positive
#     case for the rule. The rule fires WARNING (not ERROR) precisely
#     because of (5): the `DynamicMessage` default is occasionally
#     intentional. For the test fixture we elevate severity to ERROR via
#     plugin config so the IT can detect the violation as a build failure.
#
# (6) **Confluent docs copy-paste.**
#     Developer reads the Confluent Protobuf serdes doc, copies the
#     `value.deserializer=KafkaProtobufDeserializer` snippet from the
#     quick-start section, and misses `specific.protobuf.value.type` which
#     is documented in the typed-consumer section. The producer config in
#     the same doc uses the serializer (no type config needed), so the doc
#     appears self-consistent from a copy-paste reader's perspective.
#
# THE FIX:
#
# Add `specific.protobuf.value.type=<FQCN>` (or
# `specific.protobuf.key.type=<FQCN>` for keys) alongside the deserializer
# config:
#
#   value.deserializer            = io.confluent...KafkaProtobufDeserializer
#   specific.protobuf.value.type  = com.example.proto.Transaction
#
# Note: the value is the FQCN of the GENERATED Java class — NOT the `.proto`
# file's `option java_outer_classname=...` value. Look at the actual `.class`
# file emitted by `protoc-gen-java` for the right FQCN. For Kafka Streams
# with mixed Protobuf types across topics, prefer explicit
# `KafkaProtobufSerde<T>` instances passed via `Consumed.with(...)` /
# `Produced.with(...)` rather than relying on `default.value.serde`.
#
# =============================================================================

bootstrap.servers=kafka.internal:9092
group.id=orders-consumer
client.id=orders-consumer

key.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# VIOLATION: KafkaProtobufDeserializer is wired up for the value channel, but
# specific.protobuf.value.type is UNSET. The deserializer cannot recover the
# generated POJO type from its erased <T extends Message> generic parameter,
# so it returns DynamicMessage. Typed downstream code fails to compile; the
# typical workaround (reflective field-by-name access) loses all type safety
# and breaks silently on field renames. Fix: add
# `specific.protobuf.value.type=com.example.proto.Transaction` here.
value.deserializer=io.confluent.kafka.serializers.protobuf.KafkaProtobufDeserializer

schema.registry.url=https://sr.internal:8081

enable.auto.commit=false
auto.offset.reset=earliest
max.poll.records=500
fetch.min.bytes=65536
max.poll.interval.ms=300000
isolation.level=read_uncommitted
session.timeout.ms=45000
