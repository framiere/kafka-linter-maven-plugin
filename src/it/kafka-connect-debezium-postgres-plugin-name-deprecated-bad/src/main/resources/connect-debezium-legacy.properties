name=legacy-cdc
connector.class=io.debezium.connector.postgresql.PostgresConnector

tasks.max=1

# Anti-pattern: plugin.name=decoderbufs on a Debezium 2.x Postgres
# connector. `decoderbufs` was the DEFAULT in Debezium 1.x and required
# the `decoderbufs.so` Postgres extension installed on the source server
# (via the operator's DBA team — ALTER SYSTEM SET shared_preload_libraries
# = 'decoderbufs' followed by a Postgres restart). In Debezium 2.x the
# default switched to `pgoutput` (Postgres's BUILT-IN logical-replication
# output plugin, present in every Postgres ≥ 10 distribution without
# any extension install), and `decoderbufs` became DEPRECATED.
#
# This config was inherited from a Debezium 1.x deployment that the team
# upgraded to Debezium 2.x last year. The upgrade scripts changed the
# Connect-runtime image version but did NOT touch the connector
# .properties files; `plugin.name=decoderbufs` was carried forward as-is.
# Debezium 2.x accepts the deprecated value with a WARN log:
#
#   WARN io.debezium.connector.postgresql.PostgresConnectorConfig - The
#   'decoderbufs' plugin is deprecated and will be removed in Debezium
#   3.x. Migrate to 'pgoutput'.
#
# The warning is buried in the worker logs; nobody on the team has
# seen it. The connector runs cleanly: streaming is healthy, the CDC
# topics are flowing, the REST API reports RUNNING.
#
# In ~6 months the team plans to upgrade the Connect cluster to
# Debezium 3.x (the 2.x version reaches end-of-life on the Debezium
# project's support calendar). On the day of the 3.x upgrade, every
# connector with `plugin.name=decoderbufs` will FAIL to start with:
#
#   ConfigException: plugin.name=decoderbufs is no longer supported;
#   use plugin.name=pgoutput
#
# The upgrade will roll back. The team will scramble to update ~30
# connector configs across dev/staging/prod environments, then re-deploy
# each connector (each redeploy requires careful offset-inheritance so
# the new connector resumes from the prior connector's WAL position
# rather than re-snapshotting — a 4-8 hour cross-team coordination
# window).
#
# The fix is trivial and could be done TODAY at PR time: change
# `plugin.name=decoderbufs` to `plugin.name=pgoutput` (or remove the
# key — pgoutput is the Debezium 2.x default). The migration has NO
# downstream impact (the emitted Kafka records are identical regardless
# of which Postgres output plugin captured the WAL — Debezium normalizes
# the output). The only Postgres-side requirement is that the
# publication exists, which pgoutput requires; Debezium 2.x will
# auto-create it via `publication.autocreate.mode=all_tables` by
# default.
#
# Additional context: the `decoderbufs.so` extension that this connector
# currently depends on is NOT supported on managed Postgres services
# (AWS RDS, Aurora, Cloud SQL, Azure Postgres). If/when the team
# migrates the source database to a managed service for cost/operations
# reasons, the `decoderbufs` plugin will simply not be available, and
# the connector will fail with `extension decoderbufs is not available`
# on the very first deploy against the managed DB. Migrating to
# `pgoutput` removes this latent migration-blocker.
plugin.name=decoderbufs

database.hostname=legacy-pg.internal
database.port=5432
database.user=debezium
database.password=changeme
database.dbname=legacy

topic.prefix=cdc.legacy

slot.name=debezium_legacy
publication.name=dbz_publication_legacy

table.include.list=public.orders,public.customers

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
