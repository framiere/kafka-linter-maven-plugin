name=debezium-billing
connector.class=io.debezium.connector.postgresql.PostgresConnector
tasks.max=1

database.hostname=billing-db.internal
database.port=5432
database.user=debezium
database.password=changeme
database.dbname=billing

topic.prefix=cdc.billing
slot.name=debezium_billing
publication.name=dbz_publication_billing

schema.history.internal.kafka.topic=cdc.billing.schema-history
schema.history.internal.kafka.bootstrap.servers=kafka:9092

snapshot.mode=initial

# Anti-pattern: publication.autocreate.mode=filtered tells Debezium to issue
# `CREATE PUBLICATION <name> FOR TABLE <derived-list>;` at startup, with
# <derived-list> computed from the four filter-list configs
# (table.include.list, table.exclude.list, schema.include.list,
# schema.exclude.list). With ALL four filter-lists missing — the operator
# clearly intended to narrow capture (otherwise they would have stayed on
# the default `all_tables`) but forgot to add the actual narrowing list.
# Result: either startup fails with a Postgres syntax error from an empty
# FOR TABLE clause, or Debezium creates an EMPTY publication that captures
# ZERO events — connector status flips to RUNNING but no records ever flow.
publication.autocreate.mode=filtered

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
