# RULE: QK_DEVSERVICES_IN_PROD — Quarkus DevServices is implicitly enabled.
#
# This file declares Quarkus Kafka configuration but never sets the guard
# %prod.quarkus.kafka.devservices.enabled=false. At deploy time, if the
# real cluster's bootstrap.servers is missing or mistyped, Quarkus will
# silently spin up a Testcontainers Kafka in production and the app will
# happily read/write to a throwaway broker — no error, no warning.
#
# Adding %prod.quarkus.kafka.devservices.enabled=false makes this fail
# loudly instead of silently degrading.
quarkus.kafka.bootstrap.servers=kafka.internal.example.com:9093
%dev.quarkus.kafka.devservices.enabled=true
