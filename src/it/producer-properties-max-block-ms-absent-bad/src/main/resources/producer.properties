# =============================================================================
# IT fixture: PRODUCER_PROPERTIES_MAX_BLOCK_MS_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A kafka-clients producer .properties file destined for
#   `new KafkaProducer<>(props)`. It declares serializers, bootstrap.servers,
#   acks, idempotence, compression, linger.ms, batch.size, buffer.memory,
#   client.id, delivery.timeout.ms TUNED DOWN to 10s for fast-failover, AND
#   request.timeout.ms=5000 paired with the tuned delivery.timeout.ms —
#   a complete production-quality producer config for a SYNCHRONOUS API
#   path — EXCEPT `max.block.ms` is not set anywhere.
#
# What's wrong
#   The operator tuned the POST-ENQUEUE retry budget (delivery.timeout.ms +
#   request.timeout.ms + linger.ms) for a synchronous API path. The
#   intent is clear: 'this producer is called from a REST handler with a
#   10-second deadline; we want send() to fail fast at 10s so the handler
#   can return 503 to the user'.
#
#   But the operator forgot to set `max.block.ms`. kafka-clients defaults
#   `max.block.ms` to 60000 (60 seconds).
#
#   `max.block.ms` is the PRE-ENQUEUE wait budget — distinct from and
#   ADDITIVE to `delivery.timeout.ms`. When `send()` is called:
#
#     1. If the record-accumulator buffer (sized by buffer.memory, default
#        32 MB) is FULL, send() BLOCKS for up to `max.block.ms` waiting
#        for the sender thread to drain buffer space.
#     2. If topic metadata is NOT cached, send() BLOCKS for up to
#        `max.block.ms` waiting for a metadata fetch to complete.
#     3. Only AFTER the record is enqueued does `delivery.timeout.ms`
#        start counting (linger.ms + request.timeout.ms + retries).
#
#   So this file's intended 10-second budget is actually:
#
#     max.block.ms        = 60000ms (DEFAULT, because absent) — pre-enqueue
#     delivery.timeout.ms = 10000ms (explicit) — post-enqueue
#     ────────────────────────────
#     total max wall-clock = 70000ms = 70 seconds
#
#   The operator's intent is silently violated by 7x.
#
#   `org.apache.kafka.clients.producer.ProducerConfig.MAX_BLOCK_MS_CONFIG`
#   declares `max.block.ms` with `ConfigDef.Type.LONG`, default `60000`,
#   importance MEDIUM. There is NO validation that max.block.ms is
#   consistent with the post-enqueue budget; the operator must reason
#   about both knobs.
#
#   Failure scenario:
#     1. REST handler calls `producer.send(record).get(10, SECONDS)`.
#     2. Broker is reachable; buffer has 31 MB of in-flight requests from
#        preceding calls (this is a hot API endpoint).
#     3. Broker hiccups — leader for the destination partition becomes
#        slow. In-flight requests stop completing; buffer doesn't drain;
#        the 32 MB buffer is now 100% full.
#     4. send() BLOCKS waiting for buffer space. The deadline is
#        max.block.ms=60000ms (DEFAULT).
#     5. The .get(10, SECONDS) timeout never fires — the thread is stuck
#        INSIDE send() before the Future is even returned.
#     6. HTTP client (Apache HC, OkHttp, browser) times out at 30 seconds
#        and gives up. User sees 'request failed' / 502 / 504.
#     7. Worker thread is STILL stuck inside send() for another 30 seconds
#        before TimeoutException is thrown.
#     8. Tomcat worker thread pool (default 200) exhausts in 10 minutes if
#        the hiccup continues. Service degrades. New requests can't be
#        accepted. On-call wakes up.
#
#   Root cause: max.block.ms=60000 default bypassed the application's
#   explicit deadline. The fix is one line: max.block.ms=2000.
#
# Why this is "INFO" by default (not WARNING or ERROR)
#   (a) The default works for batch-oriented workloads where 60s of
#       back-pressure is acceptable. Many producers (audit, metrics,
#       background sync) tolerate 60s blocking — no problem.
#
#   (b) The framework does NOT fail — the producer runs fine. Behavior is
#       just opaque. No exception, no error log, no metric to alert on.
#
#   (c) Single-tenant deployments with no broker outages never see the
#       pathology. The bug shape is invisible in development (broker
#       always available, buffer never fills) and only manifests in
#       production during the first broker outage or partition migration.
#
#   For these reasons, the rule's default severity is INFO — a documentation
#   nudge prompting the operator to set max.block.ms paired with the
#   calling code's deadline.
#
#   This IT overrides severity to ERROR via pom.xml configuration to force
#   the build to fail and verify the rule fires.
#
# Common bug shapes
#   (1) Synchronous API send().get() stalls for 60s; HTTP client times out
#       at 30s; worker thread pool exhausts.
#       REST `POST /orders` calls `producer.send(orderEvent).get(5,
#       SECONDS)`. Operator reasons: 'we want at most 5s of producer
#       latency; if can't ack within 5s we'll return 503'. But send()
#       itself blocks for up to max.block.ms=60000 BEFORE returning the
#       Future. The .get(5s) deadline never fires — the thread is inside
#       send(). HTTP client times out at 30s; user sees 502; worker
#       thread stuck another 30s; thread pool exhausts in 10 minutes;
#       service appears down. Fix: max.block.ms=2000.
#
#   (2) Buffer fills during partition leader migration; back-pressure
#       manifests as 60s API hangs.
#       Partition leader migrates from broker-2 to broker-5 during a
#       controlled failover. During 5-10s transition, in-flight requests
#       stall; buffer fills 32 MB; application keeps calling send();
#       every send() blocks waiting for buffer space. max.block.ms=60000
#       default → 60s blocked sends. p99 latency jumps from 50ms to
#       60000ms during a 5s leader transition. Fix: max.block.ms=5000 +
#       tune buffer.memory higher.
#
#   (3) Fresh-topic first-send latency spike — auto-created topic + slow
#       metadata fetch.
#       Application creates topic via AdminClient.createTopics() and
#       immediately calls producer.send(). First send blocks for up to
#       max.block.ms=60000 waiting for metadata propagation (typically
#       1-3s but can spike to 30+s under controller overload).
#       'Create-topic-then-send' takes 60 seconds instead of 1-2s.
#       Fix: pre-fetch metadata via partitionsFor(topic) BEFORE the
#       time-sensitive send, OR max.block.ms=5000.
#
#   (4) Transactional initTransactions() hangs 60s on coordinator
#       unavailability.
#       App calls producer.initTransactions() at startup. Transaction
#       coordinator unavailable due to controller failover.
#       initTransactions() blocks 60s waiting for FindCoordinator
#       response. Kubernetes liveness probe (30s) fails the pod;
#       restart-loop pathology. Fix: max.block.ms=20000 + retry logic in
#       application.
#
#   (5) Resilience4j × max.block.ms × delivery.timeout.ms = 540s total
#       budget when operator wanted 5s.
#       App wraps producer.send().get() in Resilience4j Retry(3, expo-
#       backoff). Each producer.send() can independently block 60s on
#       max.block.ms + spend 120s on delivery.timeout.ms = 180s before
#       raising TimeoutException to Resilience4j. 3 attempts × 180s =
#       540s. Fix: max.block.ms=1000 + delivery.timeout.ms=4000.
#
#   (6) Spring Boot multi-producer template — global max.block.ms blocks
#       low-latency path.
#       App creates 3 producers: bulk audit (60s OK), fire-and-forget
#       metrics (don't care), synchronous API (must complete in 5s).
#       All 3 inherit default max.block.ms=60000. Tests pass in dev
#       (broker always available); production sees 60s hangs during
#       broker hiccups. Fix: per-producer max.block.ms (audit=60000,
#       metrics=10000, sync=2000).
#
# Fix
#   ONE LINE. Set `max.block.ms` to a value BELOW the calling code's
#   deadline:
#
#     # Synchronous API path (5s HTTP timeout):
#     max.block.ms=2000
#     delivery.timeout.ms=3000
#     # → max total = 2 + 3 = 5s, fits inside HTTP deadline.
#
#     # Fire-and-forget background producer:
#     max.block.ms=10000
#     delivery.timeout.ms=60000
#     # → tolerate 70s of back-pressure + retries.
#
#     # Bulk batch pipeline willing to wait:
#     max.block.ms=600000
#     delivery.timeout.ms=3600000
#     # → 10 minutes of back-pressure + 1 hour of retries.
#
#   For this fixture's `delivery.timeout.ms=10000` and `request.timeout.
#   ms=5000`, the right pair is `max.block.ms=2000` (2s ceiling on
#   buffer/metadata wait, fitting inside the 10s post-enqueue budget).
# =============================================================================

bootstrap.servers=broker-1.kafka.prod.example.com:9092,broker-2.kafka.prod.example.com:9092,broker-3.kafka.prod.example.com:9092
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer

# Client identity (isolate the rule from CLIENT_ID_ABSENT).
client.id=orders-api-fast-failover-producer

# Durability + delivery semantics.
acks=all
enable.idempotence=true
compression.type=zstd

# Batching window opened explicitly.
linger.ms=10
batch.size=65536
buffer.memory=33554432

# Post-enqueue retry budget TUNED DOWN for fast-failover on the API path.
# request.timeout.ms + delivery.timeout.ms = full coupling explicit.
request.timeout.ms=5000
delivery.timeout.ms=10000

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# MISSING:
#   max.block.ms=...
# With delivery.timeout.ms=10000 above tuned for fast-failover on the API
# path, the right pair is max.block.ms=2000 (2s pre-enqueue ceiling).
# Default max.block.ms=60000 (60s) silently bypasses the 10s budget —
# send() can block for 60s before the post-enqueue retry budget even
# starts. Total max wall-clock with default: 60 + 10 = 70 seconds, 7x
# what the operator intended.
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
