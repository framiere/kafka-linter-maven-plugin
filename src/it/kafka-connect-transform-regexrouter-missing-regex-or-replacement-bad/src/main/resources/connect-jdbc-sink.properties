name=jdbc-sink-routed
connector.class=io.confluent.connect.jdbc.JdbcSinkConnector
tasks.max=2

topics=orders,prices,audit

connection.url=jdbc:postgresql://db.internal:5432/analytics
connection.user=connect
connection.password=secret
insert.mode=insert
auto.create=true

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false

# SMT chain — two RegexRouter SMTs, each missing a required key.
# - 'AddPrefix' has type and regex but is missing 'replacement' (a refactor
#   forgot to update the replacement after renaming the regex group).
# - 'StripEnv' has type and replacement but is missing 'regex' (operator
#   commented out the regex line during debugging and never restored it).
# Both will fail at task startup with ConfigException; the connector never
# starts.
transforms=AddPrefix,StripEnv

transforms.AddPrefix.type=org.apache.kafka.connect.transforms.RegexRouter
transforms.AddPrefix.regex=(.+)
# missing: transforms.AddPrefix.replacement=connect_$1

transforms.StripEnv.type=org.apache.kafka.connect.transforms.RegexRouter
# missing: transforms.StripEnv.regex=prod\\.(.+)
transforms.StripEnv.replacement=$1
