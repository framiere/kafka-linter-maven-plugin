# =============================================================================
# Confluent JDBC sink connector writing records from `events.*` topics to a
# Postgres analytics warehouse.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#   auto.evolve = true
#   auto.create = false   (effectively — line is absent, defaults to false)
#
# WHY THIS IS A SCHEMA-LIFECYCLE BUG:
#
# The Confluent JDBC sink connector has TWO DDL-on-the-fly capabilities:
#
#   auto.create = true   The connector executes `CREATE TABLE <topic-name>
#                        (<derived-columns>);` against the JDBC database
#                        when a topic's target table does not exist.
#                        Default: false.
#
#   auto.evolve = true   The connector executes `ALTER TABLE <topic-name>
#                        ADD COLUMN <new-column> <type>;` when an upstream
#                        Avro/JSON/Protobuf schema evolves to add a new
#                        field that the existing table does not have.
#                        Default: false.
#
# The two configs are JOINTLY constrained by intent. The legitimate
# pairings are:
#
#   (both true)   — Development / sandbox: the connector owns the full
#                   downstream table lifecycle. Convenient but DBA-
#                   uncontrolled.
#
#   (both false)  — Production: the DBA owns the schema. Missing tables
#                   and columns produce visible connector errors that
#                   prompt a coordinated DDL migration.
#
# The MIXED pairing demonstrated here is structurally INCONSISTENT:
#
#   auto.evolve = true   AND   auto.create = false (default)
#
# The connector takes ownership of column evolution (it issues ALTER
# TABLE) but NOT of table creation (it relies on the DBA for new tables).
#
# THE VIOLATION:
#
# For weeks, this connector works. Every upstream Avro schema-evolution
# event (e.g. a new optional field added to `OrderCreated`, `OrderShipped`,
# etc.) successfully adds a column to the corresponding Postgres table.
# Engineering is happy: "schema evolution just works."
#
# Then the upstream `orders-service` team adds a new event type:
# `OrderRefunded`. The new event flows to a new topic `events.order_refunded`.
# The connector receives the first record for the new topic, tries to write
# it to Postgres, and FAILS with:
#
#   ConnectException: Table public.order_refunded is missing
#
# The connector task transitions to FAILED. On-call gets paged. Investigation
# reveals:
#
#   1. The connector silently drifted away from DBA control. Every Avro
#      schema-evolution event over the past 6 months has added a column
#      to the downstream Postgres tables. The DBA discovers 47 columns
#      that no migration script added.
#
#   2. The connector fails on EVERY new topic until a DBA manually
#      creates the table. The team's choice: either coordinate with the
#      DBA on every new topic (defeating the purpose of auto.evolve), or
#      enable auto.create (which the DBA was supposed to be controlling).
#
#   3. The org-wide pattern: every new microservice introduces new topics;
#      every new topic requires a DBA ticket; every DBA ticket has lead
#      time; production lags by weeks behind upstream changes.
#
# REAL-WORLD INCIDENT SHAPES:
#
#   - Operator enables auto.evolve "temporarily" for a known schema
#     migration; never disables it; DBA-uncontrolled column accumulation
#     follows.
#
#   - Helm chart with autoEvolve=true, autoCreate=false as default
#     ("production should not auto-create tables but auto-evolution is
#     fine"); propagates the half-managed config across the org.
#
#   - Operator copies a JDBC sink config from a dev team (auto.evolve=true)
#     but accepts the default auto.create=false; their tables don't exist;
#     the connector fails on first deploy; operator disables auto.evolve
#     "to make the error go away" and ends up with neither — losing the
#     original intent (automatic column adds).
#
# FIX:
#
#   Either set auto.create=true (development / sandbox — connector owns
#   the full table lifecycle):
#
#     auto.create = true
#     auto.evolve = true
#
#   OR set auto.evolve=false / remove the line (production — DBA owns
#   the schema; missing tables/columns are visible errors that prompt
#   coordinated DDL migrations):
#
#     auto.create = false   # or absent
#     auto.evolve = false   # or absent
#
# =============================================================================

name=warehouse-events-sink
connector.class=io.confluent.connect.jdbc.JdbcSinkConnector
tasks.max=4

topics.regex=events\\..*
connection.url=jdbc:postgresql://warehouse-db.internal:5432/analytics
connection.user=warehouse_writer
connection.password=changeme

insert.mode=upsert
pk.mode=record_key
pk.fields=event_id

# VIOLATION: structurally inconsistent schema-lifecycle ownership. The
# connector evolves existing tables (issues ALTER TABLE ADD COLUMN on
# upstream Avro schema changes) but does NOT auto-create new tables
# (the `auto.create` line is absent, which defaults to false). A new
# topic introduced upstream fails the connector with "Table is missing"
# until a DBA manually creates the table; meanwhile, existing tables
# silently drift away from DBA control. Should be either both true
# (development) or both false / both absent (production).
auto.evolve=true

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
