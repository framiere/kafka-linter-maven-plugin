# RULE: PRODUCER_PROPERTIES_BUFFER_MEMORY_ABSENT.
#
# This producer config is otherwise production-quality:
#   - acks=all                         (durability)
#   - enable.idempotence=true          (no duplicates on retry)
#   - compression.type=zstd            (compressed batches)
#   - linger.ms=20                     (batching window opened)
#   - batch.size=1048576               (1 MiB — RAISED for high throughput)
#
# ...but it never sets `buffer.memory`. kafka-clients defaults
# `buffer.memory` to `33554432` (32 MiB).
#
# Why this matters HERE specifically: the operator RAISED `batch.size` to
# 1 MiB to get larger batches. But the default `buffer.memory=32 MiB`
# means the BufferPool can hold at most 32 simultaneous batches across
# ALL partitions of the producer. If the producer fans out to ~30+
# partitions under load, the pool runs dry; subsequent `send()` calls
# block for up to `max.block.ms` (default 60s) and then throw
# `TimeoutException: Failed to allocate memory within the configured
# max.block.ms`.
#
# Concrete failure mode:
#   - Under load, the producer fans out across 50 partitions.
#   - Each new batch needs 1 MiB from the pool.
#   - 50 × 1 MiB = 50 MiB > 32 MiB (the default).
#   - send() blocks; broker isn't slow; metrics show
#     `buffer-available-bytes` at zero; `record-queue-time-avg` climbing.
#   - On-call sees "kafka producer slow" and looks at broker metrics
#     (they're fine); root cause is the producer's own buffer pool.
#
# INFO severity (not WARNING/ERROR) because the default is defensible
# for typical workloads; the rule is a 'have you thought about this
# knob?' nudge. Raised here to ERROR by config override so the IT fixture
# demonstrates the violation deterministically.
#
# Fix: ONE LINE. Add `buffer.memory=268435456` (256 MiB — matched to
# batch.size × partition-count + headroom) or
# `buffer.memory=33554432` EXPLICITLY to document that the default was
# deliberately chosen (with the understanding that buffer.memory is in
# the right ballpark for batch.size × partition-count of this workload).
bootstrap.servers=kafka-1.prod.example.com:9092
client.id=bad-no-buffer-memory-producer
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=org.apache.kafka.common.serialization.StringSerializer
acks=all
enable.idempotence=true
compression.type=zstd
linger.ms=20
batch.size=1048576
delivery.timeout.ms=120000
