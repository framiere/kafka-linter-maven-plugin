# =============================================================================
# A MirrorMaker 2 source-connector configuration where the operator has set
# `refresh.topics.interval.seconds=10` — well below the MM2 ConfigDef default
# of 600 (10 minutes), and also below the plugin's broker-thrash threshold
# of 60 seconds.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#
#   connector.class                = MirrorSourceConnector
#   refresh.topics.interval.seconds = 10        ← controller-storm value
#
# WHAT THIS KEY ACTUALLY DOES:
#
# `refresh.topics.interval.seconds` controls how often each MirrorMaker 2
# connector — MirrorSourceConnector, MirrorCheckpointConnector, and
# MirrorHeartbeatConnector — performs a FULL TOPIC METADATA REFRESH against
# the source cluster. A 'refresh' is not a cheap operation. It is a sequence
# of admin RPCs that lands on the source-cluster CONTROLLER (a single broker,
# the active controller — metadata operations are controller-routed):
#
#   1. `AdminClient.listTopics()` — one RPC to discover all topics.
#   2. `AdminClient.describeTopics()` — batched RPC, typically 50–100 topics
#      per batch, for every topic that matches the connector's
#      `topics` / `topics.exclude` regex.
#   3. `AdminClient.describeConfigs()` — when `sync.topic.configs.enabled=true`
#      (default), one batched RPC per topic batch, for the per-topic configs.
#   4. `AdminClient.describeAcls()` — when `sync.topic.acls.enabled=true`
#      (default), one RPC per ACL filter (typically one per topic for the
#      common 'topic-level ACLs' deployment pattern).
#
# On a source cluster with N topics, ONE refresh issues approximately:
#
#   1 (listTopics) + N/50 (describeTopics batches) + N/50 (describeConfigs)
#   + N (describeAcls per topic) ≈ ~1.1 × N admin RPCs per refresh.
#
# For a moderately-sized cluster with N = 5000 topics, one refresh is
# roughly 5500 admin RPCs to the controller.
#
# THE STORM MATH FOR THIS FIXTURE:
#
# With `refresh.topics.interval.seconds = 10` and N = 5000 topics:
#
#   5500 admin-RPCs every 10 seconds = 550 admin-RPCs per second
#
# From this connector alone. Now multiply by:
#
#   - 3x for the three MM2 connector types (source + checkpoint + heartbeat)
#     all sharing this key and all refreshing on the same interval.
#   - Kx for a multi-source topology (K source clusters replicating to one
#     DR cluster — increasingly common at scale).
#
# Total controller load can easily reach 5000+ admin-RPCs per second from
# a single MM2 deployment. The Kafka controller has a single-threaded event
# loop; its capacity is on the order of a few thousand admin RPCs per second
# before saturation. At 5000+ RPC/s the controller pegs at 100% CPU; the
# controller-side latency for ALL admin operations rises (including
# `CreateTopics` from ordinary application teams, `AlterConfigs` from
# capacity-planning runs, ACL updates from security teams). In pathological
# cases the controller fails its session-timeout heartbeat with ZooKeeper
# (or KRaft) and triggers an UNNECESSARY CONTROLLER FAILOVER — a real
# production outage.
#
# WHY THE DEFAULT IS 600 SECONDS:
#
# The Kafka team chose 600 s (10 minutes) as the default because:
#
#   - Topic-set membership changes are infrequent in production (most
#     clusters add or remove a handful of topics per day, not per minute).
#     A 10-minute lag between source-cluster topic-create and target-cluster
#     replicated-topic-create is acceptable.
#
#   - Topic-config changes are infrequent (retention bumps, cleanup-policy
#     changes, max.message.bytes adjustments — typically batched and rolled
#     out a few times per quarter).
#
#   - ACL changes are infrequent (typically tied to onboarding new principals
#     or rotating credentials — measured in days/weeks, not seconds).
#
#   - The controller-RPC budget for refresh-topics is a SHARED RESOURCE. The
#     same controller services every admin operation in the cluster. The
#     default is intentionally generous on the controller's behalf.
#
# Operators sometimes want lower values, but the legitimate range is
# typically 60–300 seconds (1–5 minutes), not 10 seconds.
#
# WHY 10 SECONDS IS ALMOST ALWAYS WRONG:
#
# (a) **Tutorial copy-paste.** Many MM2 tutorial blog posts use a 10-second
#     refresh interval 'so the demo reacts quickly when you create a topic'.
#     The tutorial cluster has 3 topics; the production cluster has 5000.
#     The 10-second interval that worked fine on 3 topics issues 5500 admin
#     RPCs every 10 seconds on the production cluster — saturating the
#     controller.
#
# (b) **Debug-session leftover.** Operator lowered the interval to 5 s during
#     an initial MM2 deployment to confirm a topic-regex was matching the
#     topics they expected. They confirmed the regex worked, then never
#     reverted the interval. The 5 s value went to production.
#
# (c) **Confusion with `metadata.max.age.ms`.** The consumer-side config
#     `metadata.max.age.ms` (default 300_000 ms = 5 min) controls how long
#     a Kafka consumer keeps its local metadata cache. Some operators confuse
#     the two keys and think `refresh.topics.interval.seconds = 10` 'makes
#     consumers react faster to topic changes'. This is doubly wrong:
#     (1) the MM2 server-side knob does not affect consumers at all;
#     (2) consumers already refresh metadata on cache miss anyway.
#
# (d) **Misunderstanding of replication-lag knob.** Operator wants to reduce
#     end-to-end replication LAG and assumes 'refresh more often = less lag'.
#     They do not realize that `refresh.topics.interval.seconds` controls
#     METADATA refresh (topic set, topic configs, ACLs), NOT RECORD
#     replication. Record replication runs continuously via the
#     `MirrorSourceConnector#poll()` loop — millisecond-level latency,
#     totally independent of this knob. Setting this knob to 1 s does
#     nothing for lag but everything for controller load.
#
# (e) **Multi-source amplification, invisible per-config.** Org has 5 source
#     clusters replicating to 1 DR cluster. Operator sets
#     `refresh.topics.interval.seconds=30` on all of them, reasoning that
#     '30 s is more responsive than the default'. The DR cluster sees 5x the
#     refresh storm; legitimate DR-cluster admin operations time out. The 5x
#     amplification is invisible from any single MM2 deployment's config.
#
# (f) **Helm chart inheritance from a dev cluster.** Org's internal Helm
#     chart for MM2 was templated with `refreshTopicsIntervalSeconds: 30`
#     by someone whose original test cluster had 3 topics. Multiple
#     production teams deploy the chart without overriding; all of them hit
#     controller saturation in the first week of production traffic.
#
# THE FIX:
#
# Remove the explicit value (the default 600 s is correct for production):
#
#   # refresh.topics.interval.seconds=10       ← DELETE THIS LINE
#
# Or set explicitly to a value >= 60 if there is a deliberate reason:
#
#   refresh.topics.interval.seconds=300        ← 5 min, acceptable
#   refresh.topics.interval.seconds=600        ← 10 min, default
#
# The rule's threshold is < 60. Values >= 60 do not fire (the operator has
# made a choice within the defensible range). The plugin treats < 60 as
# 'almost certainly wrong — either copy-paste, debug leftover, or
# misunderstanding'.
#
# =============================================================================

name=mm2-source
connector.class=org.apache.kafka.connect.mirror.MirrorSourceConnector
tasks.max=2

source.cluster.alias=primary
target.cluster.alias=dr

source.cluster.bootstrap.servers=primary-kafka.internal:9093
target.cluster.bootstrap.servers=dr-kafka.internal:9093

topics=orders\\..*,payments\\..*
groups=.*

replication.factor=3
offset-syncs.topic.replication.factor=3
heartbeats.topic.replication.factor=3
checkpoints.topic.replication.factor=3

# VIOLATION: refresh.topics.interval.seconds=10 is below the plugin's
# broker-thrash threshold of 60 seconds (and well below the MM2 ConfigDef
# default of 600 s). At 10-second refresh on a 5000-topic source cluster,
# this connector alone issues ~550 admin RPCs per second to the source-
# cluster controller — multiplied across the three MM2 connector classes
# and a multi-source topology, easily reaching controller saturation. Fix:
# remove this line (default 600 s is correct) or set to a value >= 60 s.
refresh.topics.interval.seconds=10
