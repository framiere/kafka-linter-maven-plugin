# =============================================================================
# IT fixture: PRODUCER_PROPERTIES_REQUEST_TIMEOUT_MS_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A kafka-clients producer .properties file destined for
#   `new KafkaProducer<>(props)`. It declares serializers, bootstrap.servers,
#   acks, idempotence, compression, linger.ms, batch.size, buffer.memory,
#   client.id, AND delivery.timeout.ms TUNED DOWN to 10000 (10s) for fast-
#   failover semantics — a complete production-quality producer config —
#   EXCEPT `request.timeout.ms` is not set anywhere.
#
# What's wrong
#   The operator tuned `delivery.timeout.ms` DOWN to 10000 (10s) so that
#   `producer.send()` fails fast when a partition leader is stuck; the
#   upstream HTTP API has a 15-second deadline, and the operator wants the
#   producer to give up before the HTTP client does so the application's
#   own retry/fallback path can run.
#
#   But the operator forgot to set `request.timeout.ms`. kafka-clients
#   defaults `request.timeout.ms` to 30000 (30 seconds).
#
#   kafka-clients enforces an invariant at `KafkaProducer` construction:
#
#     delivery.timeout.ms >= linger.ms + request.timeout.ms
#
#   With this file's values:
#     delivery.timeout.ms  = 10000   (explicit)
#     linger.ms            = 20      (explicit)
#     request.timeout.ms   = 30000   (DEFAULT, because absent)
#
#   The invariant check evaluates: 10000 >= 20 + 30000 → 10000 >= 30020
#   → FALSE. kafka-clients throws `ConfigException` IMMEDIATELY at
#   construction:
#
#     org.apache.kafka.common.config.ConfigException:
#       delivery.timeout.ms should be equal to or larger than
#       linger.ms + request.timeout.ms.
#
#   The KafkaProducer never finishes construction; the application fails
#   to start. This is a STARTUP CRASH, not a silent degradation.
#
#   `org.apache.kafka.clients.producer.ProducerConfig.
#   REQUEST_TIMEOUT_MS_CONFIG` declares `request.timeout.ms` with
#   `ConfigDef.Type.INT`, default `30000`, importance MEDIUM. It is the
#   PER-REQUEST wait window — how long the producer waits for one in-
#   flight ProduceRequest's ack from the broker before declaring that
#   single attempt failed (and, depending on remaining budget, retrying
#   or giving up).
#
#   The three keys form ONE COUPLED RETRY BUDGET:
#     linger.ms             — batch-accumulation window (per batch)
#     request.timeout.ms    — per-attempt broker-response window
#     delivery.timeout.ms   — total budget for ALL retries of ONE record
#
#   Setting any one of these without thinking about the other two
#   produces a config that is either (a) broken at startup (this fixture),
#   (b) silently doing far more retries than intended, or (c) silently
#   doing far fewer retries than intended.
#
# Why this is "INFO" by default (not WARNING or ERROR)
#   (a) Defaults work at default settings. The kafka-clients default
#       triple (linger=0, request.timeout=30s, delivery.timeout=120s)
#       satisfies the invariant trivially and gives ~4 retries — a
#       defensible mid-range setting. Operators on full defaults are
#       not at risk.
#
#   (b) The rule fires when ANY producer .properties file is missing
#       `request.timeout.ms`, including files that don't yet tune
#       `delivery.timeout.ms`. That broader fire-set catches the silent-
#       drift cases (b) and (c) before they manifest. ERROR/WARNING for
#       a key whose default is fine in the most common case would be
#       too noisy.
#
#   (c) The rule's purpose is a documentation nudge: 'you tuned one
#       timeout; have you thought about the other two?' INFO is the
#       right severity for that nudge — operators see it in CI output
#       and can address it before the next deploy.
#
#   For these reasons, the rule's default severity is INFO. This IT
#   overrides severity to ERROR via pom.xml configuration to force the
#   build to fail and verify the rule fires.
#
# Common bug shapes
#   (1) ConfigException at startup — fast-failover tuning without
#       matching request.timeout.ms.
#       Team has a low-latency API path; sets `delivery.timeout.ms=10000`
#       so that `producer.send().get()` fails fast when a partition is
#       stuck. Leaves request.timeout.ms at default 30000. KafkaProducer
#       construction throws ConfigException; application fails to start;
#       CI catches it, team scrambles to add `request.timeout.ms=8000`.
#       The rule would have caught this in static analysis BEFORE the
#       runtime crash.
#
#   (2) Silent retry-arithmetic drift — bulk pipeline tuning without
#       matching request.timeout.ms.
#       Nightly batch job: team sets `delivery.timeout.ms=3600000` (1
#       hour) so that during cluster-failover windows the producer
#       absorbs the outage instead of failing the batch. Leaves
#       request.timeout.ms at default 30000. Effective retry count:
#       3600000 / 30000 ≈ 120 retries. Operator expected ~10 retries
#       at ~6min intervals; got 120 retries at ~30s intervals. Logs
#       fill with 'retry attempt 47, 48, 49…' during outages; on-call
#       wonders if the producer is malfunctioning.
#
#   (3) Cross-region producer — slow-broker tuning without matching
#       delivery.timeout.ms.
#       Producer in us-east-1 writing to a Kafka cluster in eu-west-1
#       sees 60s broker acks during transatlantic link congestion. Team
#       sets `request.timeout.ms=90000` (90s) to absorb the slow acks
#       without spurious retries. Leaves delivery.timeout.ms at default
#       120000. Effective retry budget: 120000 / 90000 ≈ 1.3 retries.
#       Producer gives up after one slow attempt during congestion;
#       team expected 'patient' behavior, got 'one-shot' behavior.
#
#   (4) Resilience4j layer × default producer retries = 450s wait.
#       Application wraps `producer.send()` in a Resilience4j Retry
#       with maxAttempts=5, intervalFunction=exponentialBackoff. Team
#       reasons: 'we have a retry layer; producer.retries=0 keeps it
#       simple'. But producer.retries doesn't directly drive timing —
#       delivery.timeout.ms does. With delivery.timeout.ms at default
#       120s and request.timeout.ms at default 30s, each producer.send()
#       can spend up to 120s before raising TimeoutException to
#       Resilience4j. 5 Resilience4j retries × 120s producer budget =
#       up to 600s wall-clock for what the operator intended to be a
#       sub-30s operation.
#
#   (5) Spring Boot multi-producer template — no per-producer differentiation.
#       Spring Boot app creates 4 KafkaTemplates: one for high-latency
#       bulk writes (analytics), one for low-latency sync writes (API
#       responses), one for fire-and-forget (audit logs), one for
#       transactional writes (orders). The bulk and audit producers can
#       tolerate 120s waits; the API producer cannot. With all 4
#       inheriting default `request.timeout.ms=30000` from
#       `spring.kafka.producer.properties`, the API producer cannot
#       fast-fail without breaking the others. Operator wants per-
#       producer retry budgets; needs explicit `request.timeout.ms` in
#       each producer's properties block.
#
# Fix
#   ONE LINE. Set `request.timeout.ms` paired with the chosen
#   `delivery.timeout.ms` and `linger.ms`, ALWAYS with all three keys
#   set together so the retry budget breakdown is explicit:
#
#     # Low-latency, fast-failover sync send:
#     request.timeout.ms=5000
#     delivery.timeout.ms=10000
#     linger.ms=0
#     # → 5s per-attempt, 10s total budget → up to 2 attempts.
#
#     # Bulk batch, patient with cluster hiccups:
#     request.timeout.ms=60000
#     delivery.timeout.ms=600000
#     linger.ms=100
#     # → 60s per-attempt, 600s total budget → up to 10 attempts.
#
#     # Cross-region with congestion absorption:
#     request.timeout.ms=90000
#     delivery.timeout.ms=360000
#     linger.ms=50
#     # → 90s per-attempt, 360s total budget → up to 4 attempts.
#
#   For this fixture's `delivery.timeout.ms=10000` and `linger.ms=20`,
#   the right pair is `request.timeout.ms=8000` (8s per-attempt window)
#   so the invariant holds with margin: 10000 >= 20 + 8000 → 10000 >= 8020.
# =============================================================================

bootstrap.servers=broker-1.kafka.prod.example.com:9092,broker-2.kafka.prod.example.com:9092,broker-3.kafka.prod.example.com:9092
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer

# Client identity (isolate the rule from CLIENT_ID_ABSENT).
client.id=orders-api-fast-failover-producer

# Durability + delivery semantics.
acks=all
enable.idempotence=true
compression.type=zstd

# Batching window opened explicitly.
linger.ms=20
batch.size=65536
buffer.memory=33554432

# delivery.timeout.ms TUNED DOWN to 10s for fast-failover on the API path.
# Without the matching request.timeout.ms tune, kafka-clients enforces
# delivery.timeout.ms >= linger.ms + request.timeout.ms at construction.
# With default request.timeout.ms=30000, the invariant becomes
# 10000 >= 20 + 30000 → FALSE → ConfigException at KafkaProducer construction.
delivery.timeout.ms=10000

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# MISSING:
#   request.timeout.ms=...
# With delivery.timeout.ms=10000 and linger.ms=20 above, the right pair is
# request.timeout.ms=8000 (8s per-attempt window) so the kafka-clients
# invariant holds: 10000 >= 20 + 8000 → 10000 >= 8020. Default
# request.timeout.ms=30000 makes 10000 >= 30020 FALSE → startup crash.
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
