# =============================================================================
# Debezium 2.x PostgreSQL CDC connector consuming changes from the public.orders
# table, configured with incremental-snapshot TUNING knobs but NO signal channel
# (neither `signal.data.collection` nor `signal.kafka.topic`).
#
# ANTI-PATTERN DEMONSTRATED HERE:
#
#   incremental.snapshot.chunk.size = 4096       # ← incremental-snapshot tuning
#   incremental.snapshot.watermarking.strategy = insert_insert
#   # signal.data.collection         = (UNSET)   # ← no DB-table signal channel
#   # signal.kafka.topic             = (UNSET)   # ← no Kafka-topic signal channel
#
# WHY THIS IS A "DEAD CONFIG" BUG:
#
# Debezium 2.x's INCREMENTAL SNAPSHOT is an on-demand, watermark-based,
# chunked-table-rescan feature. Unlike the INITIAL snapshot (controlled by
# `snapshot.mode`, which runs ONCE at connector startup), an incremental
# snapshot is TRIGGERED AT RUNTIME by writing an `execute-snapshot` signal
# record to a configured SIGNAL CHANNEL. The connector watches that channel,
# picks up the signal, suspends streaming for the watermarked range, issues
# chunked SELECT * FROM <table> WHERE <pk> > <lo> AND <pk> <= <hi> ORDER BY <pk>
# LIMIT <chunk.size> for each chunk, emits each row as a CDC record with
# op=r in the Debezium envelope, then resumes streaming.
#
# Debezium 2.x supports TWO signal channels:
#
#   (1) `signal.data.collection = <schema>.<table>`
#       The connector auto-creates AND watches the named database table for
#       rows of the form (id, type, data) where type='execute-snapshot' and
#       data is a JSON payload naming the data-collections to snapshot.
#       Available for Postgres, MySQL, SQL Server, Oracle, Db2. The signal
#       table must be on the captured-database side (the connector's user
#       must have INSERT/SELECT on it). For an `auto.create`-enabled
#       deployment Debezium handles creation; otherwise the operator
#       creates it manually with the documented DDL.
#
#   (2) `signal.kafka.topic = <topic>` with
#       `signal.enabled.channels = source,kafka`
#       The connector consumes execute-snapshot records from the named
#       Kafka topic. Recommended for multi-task / orchestrated deployments
#       where writing to a database table is awkward (e.g. read-replica
#       captures, locked-down compliance environments).
#
# If a Debezium connector sets the incremental-snapshot TUNING knobs but
# DOES NOT configure either signal channel, the runtime has NO ENTRY POINT
# to trigger the snapshot. The tuning configs sit in the worker config but
# are DEAD: the connector starts cleanly, streams normally, the REST API
# reports RUNNING, the tasks log nothing unusual — and any operator action
# that ASSUMES the snapshot can be triggered will silently no-op.
#
# REAL-WORLD INCIDENT SHAPES:
#
# (1) **"We'll need incremental snapshot later".**
#     Team deploys a Postgres CDC connector with `snapshot.mode=initial`
#     (a one-time bulk dump of all rows that existed at connector start)
#     and adds `incremental.snapshot.chunk.size=4096` to the config "for
#     when we need to re-snapshot a single table later". Three months
#     later a customer reports their orders are missing CDC history for
#     an outage window. The on-call engineer tries to trigger an
#     incremental snapshot of public.orders by inserting a row into
#     debezium_signal — and finds no such table exists; the connector
#     never auto-created it because `signal.data.collection` was never
#     set. The engineer tries to write to a signal Kafka topic — and
#     finds `signal.kafka.topic` was never configured either. There is
#     NO mechanism to trigger the snapshot. The team has to redeploy the
#     connector with the missing signal config (a 30-minute outage) AND
#     re-snapshot the entire database (a 6-hour outage) because they
#     can't target a single table.
#
# (2) **Schema-drift recovery blocked.**
#     A new column `priority` is added to public.orders. The team wants
#     Debezium to emit historical orders WITH the new column populated
#     (the database has a backfill script that filled it in). They plan
#     to use incremental snapshot to "re-emit" the orders rows with the
#     new column. The connector has `incremental.snapshot.allow.schema.
#     changes=true` set (a tuning knob that lets the snapshot pick up
#     schema-altered tables mid-rescan). But with no signal channel, the
#     snapshot can never be triggered — the schema-change tuning knob
#     is dead config. The team must drop and recreate the connector (a
#     6-hour full re-snapshot) to get the column populated.
#
# (3) **Helm chart with incremental defaults baked in.**
#     Team's Debezium Helm chart sets `incrementalSnapshot.chunkSize: 4096`
#     and `incrementalSnapshot.watermarkingStrategy: insert_insert` as
#     templated defaults (chart author copied them from a Confluent
#     example). The signal channel is gated behind a separate
#     `signalChannel.enabled: false` block. Teams deploy the chart with
#     defaults; incremental snapshot is "configured" on every connector
#     but cannot be triggered on any of them. The platform team
#     discovers this only when a downstream consumer reports missing
#     historical rows and asks for an incremental snapshot — at which
#     point they need a Helm-chart change AND a coordinated rollout AND
#     a 4-hour change-window to enable signaling on the 23 connectors
#     across staging+prod.
#
# (4) **Migrated from Debezium 1.x.**
#     Team upgrades from Debezium 1.x (no incremental snapshot) to
#     Debezium 2.4 (incremental snapshot GA). The migration guide
#     suggests adding `incremental.snapshot.chunk.size=4096` "to enable
#     incremental snapshot". The team copies it in; the migration
#     guide's reference to `signal.data.collection` is in a separate
#     section the engineer doesn't read. The connector runs; nobody
#     notices the missing signal channel until an incident weeks later.
#
# (5) **Multi-task connector with stale signal channel.**
#     Team initially deployed with `signal.kafka.topic=debezium-signals`
#     and `signal.enabled.channels=source,kafka` — incremental snapshot
#     worked. A refactor moved signal handling to a database table; the
#     team set `signal.data.collection=public.debezium_signal`. During
#     the change the operator REMOVED `signal.kafka.topic` AND the new
#     `signal.data.collection` line was lost in a merge conflict — the
#     committed config has NEITHER. Streaming continues unchanged;
#     incremental-snapshot capability is silently lost.
#
# (6) **"Tuning is the same as enabling".**
#     Engineer reads the Debezium docs section on incremental snapshot,
#     sees the chunking / watermarking / schema-changes tuning knobs,
#     and adds them to the config under the assumption that SETTING the
#     tuning knobs is what ENABLES the feature (a reasonable
#     interpretation if you only read the tuning section). The
#     "Triggering" section, which explains the signal channel
#     requirement, is two pages away in the docs. The connector runs;
#     the snapshot has never been tried.
#
# (7) **Suppressed signal channel for "security review".**
#     Team initially deployed with `signal.data.collection=public.
#     debezium_signal` and `auto.create=true`. Security review flagged
#     the auto-created table as "unauthorized DDL" and required it to
#     be removed. The team commented out `signal.data.collection` and
#     dropped the table, intending to add a manually-created signal
#     table later. The "later" never happened. The incremental-snapshot
#     tuning was never cleaned up; the config has the tuning knobs but
#     no signal channel.
#
# THE FIX:
#
# Configure a signal channel — either the database-table channel:
#
#   signal.data.collection = public.debezium_signal
#   # (Debezium auto-creates the table; operator must grant INSERT/SELECT)
#
# OR the Kafka-topic channel:
#
#   signal.enabled.channels = source,kafka
#   signal.kafka.topic = debezium-signals
#   signal.kafka.bootstrap.servers = ${kafka.bootstrap.servers}
#
# OR, if incremental snapshot is NOT intended to be used, REMOVE the
# dead tuning configs:
#
#   # incremental.snapshot.chunk.size            = (remove)
#   # incremental.snapshot.watermarking.strategy = (remove)
#   # incremental.snapshot.allow.schema.changes  = (remove)
#
# =============================================================================

name=orders-cdc
connector.class=io.debezium.connector.postgresql.PostgresConnector
tasks.max=1

topic.prefix=orders-cdc-prod-eu-west-1

database.hostname=orders-db.internal
database.port=5432
database.user=debezium_user
database.password=debezium_password_placeholder
database.dbname=orders

plugin.name=pgoutput
slot.name=debezium_orders_prod_eu_west_1
publication.name=debezium_orders_prod_eu_west_1

# Initial snapshot policy — default-equivalent; rules out SNAPSHOT_MODE_NEVER.
snapshot.mode=initial

# VIOLATION: incremental-snapshot TUNING knobs are configured but NO signal
# channel is set — there is no entry point to trigger the snapshot at runtime.
# Both `signal.data.collection` (DB-table channel) and `signal.kafka.topic`
# (Kafka-topic channel) are absent. The tuning configs are dead — the connector
# runs cleanly and streams normally, but any operator action that assumes the
# snapshot can be triggered will silently no-op. Fix: configure a signal
# channel (`signal.data.collection=public.debezium_signal` for the DB-table
# channel, OR `signal.enabled.channels=source,kafka` + `signal.kafka.topic=
# debezium-signals` for the Kafka-topic channel), OR remove the dead tuning
# configs if incremental snapshot is not intended to be used.
incremental.snapshot.chunk.size=4096
incremental.snapshot.watermarking.strategy=insert_insert
incremental.snapshot.allow.schema.changes=true

# Avoid SKIPPED_OPERATIONS_DROPS_DATA: leave skipped.operations unset.
# Avoid INCLUDE_AND_EXCLUDE_LIST_BOTH_SET: set only include lists, not exclude.
# Avoid POSTGRES_FILTERED_PUBLICATION_HEARTBEAT_DISABLED: no filter list set
# (we capture all tables in the captured schema).

key.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=true
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=true
