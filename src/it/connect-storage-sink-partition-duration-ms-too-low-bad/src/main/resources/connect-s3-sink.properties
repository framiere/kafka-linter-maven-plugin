# =============================================================================
# A Confluent S3 sink connector configuration where the operator set
# `partition.duration.ms = 10000` (10 seconds) on a base `TimeBasedPartitioner`.
# The 10-second value originated from a debugging session — the operator wanted
# new S3 directories to appear every 10 seconds so they could verify that the
# partitioning logic was working. They confirmed the logic worked; they never
# reverted the value; the .properties was committed to git and deployed to
# production unchanged.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#
#   connector.class       = io.confluent.connect.s3.S3SinkConnector
#   partitioner.class     = io.confluent.connect.storage.partitioner.TimeBasedPartitioner
#   partition.duration.ms = 10000     # 10 seconds — far below the 1-minute threshold
#
# WHAT `partition.duration.ms` ACTUALLY DOES:
#
# `partition.duration.ms` is the WIDTH IN MILLISECONDS of each time bucket the
# `TimeBasedPartitioner` creates. All records whose extracted timestamp falls
# within the same `partition.duration.ms`-long window are routed to the SAME
# output S3 object (and the same directory path under the configured
# `path.format`).
#
# Example with `partition.duration.ms = 3600000` (1 hour):
#   Records timestamped 10:00:00.000 to 10:59:59.999 → bucket A → object A.
#   Records timestamped 11:00:00.000 to 11:59:59.999 → bucket B → object B.
#   Records timestamped 12:00:00.000 to 12:59:59.999 → bucket C → object C.
#
# Example with `partition.duration.ms = 60000` (1 minute):
#   Records timestamped 10:00:00.000 to 10:00:59.999 → bucket → one object.
#   Records timestamped 10:01:00.000 to 10:01:59.999 → bucket → one object.
#   ... (60 objects per hour per partition-key per topic-partition).
#
# Example with `partition.duration.ms = 10000` (10 seconds, THIS FIXTURE):
#   Records timestamped 10:00:00 to 10:00:09 → bucket → one object.
#   Records timestamped 10:00:10 to 10:00:19 → bucket → one object.
#   ... (360 objects per hour per partition-key per topic-partition).
#
# THE BLAST RADIUS OF A SUB-MINUTE BUCKET WIDTH:
#
# (a) **S3 PUT-rate per-prefix limit.** AWS S3 caps PUT requests at 3500 per
#     second PER PREFIX. With 500 topic-partitions × 4 sink tasks × 360
#     buckets/hour = 720_000 S3 PUTs/hour = 200 PUTs/sec sustained, with
#     bursts when multiple partitions rotate together → transient overruns
#     → HTTP 503 `SlowDown` errors → AWS SDK retries with exponential
#     backoff → flushes back up → worker heap pressure → eventual OOM.
#
# (b) **S3 LIST cost amplification.** AWS S3 LIST is priced per 1000 keys.
#     A day of 10-second-bucket output for a single connector = 24 × 3600
#     / 10 = 8640 buckets/day. With per-partition-key partitioning under
#     this, the bucket-count multiplies. Athena/Trino queries that scan
#     the day's prefix issue LISTs that scan hundreds of thousands of
#     objects. The LIST cost line item appears on the S3 bill.
#
# (c) **Downstream query-engine planner regression.** Athena, Trino,
#     Presto, BigQuery, and Spark all optimize for FEWER LARGER OBJECTS.
#     The query planner: opens each object's metadata, plans a scan, reads
#     the data. With 8640 objects per day per connector, the planner does
#     8640x the metadata work. Query latency rises from seconds to minutes.
#     Concurrent-query throughput drops. Analysts notice; data team is
#     paged.
#
# (d) **HDFS NameNode metadata pressure.** For HDFS sinks (Hdfs3SinkConnector
#     or HdfsSinkConnector), each output file is one HDFS inode. NameNode
#     stores inodes in heap. A connector with 360 objects/hour/partition-key
#     × 500 partition-keys × 24 hours = 4.3M inodes/day. NameNode heap
#     pressure rises; legitimate cluster workloads (Spark jobs, MapReduce
#     jobs creating their own files) get crowded out.
#
# (e) **S3 lifecycle-rule iteration overhead.** S3 lifecycle policies
#     (delete-after-30-days, transition-to-Glacier-after-90-days) iterate
#     per-object internally. Millions of small objects amplify the
#     processing time of each lifecycle-rule evaluation; the rules can
#     take HOURS to complete each day; AWS may rate-limit your account's
#     lifecycle processing if it consistently exceeds thresholds.
#
# (f) **S3 prefix hot-spotting.** With sub-minute buckets, all topic-
#     partitions of a tenant simultaneously create new objects every 10
#     seconds under the SAME S3 prefix (since the time-partition-key is
#     shared across all topic-partitions). S3 PUT-rate is per-PREFIX, not
#     per-object: 500 PUTs in a 10-second window = 50 PUTs/sec sustained,
#     then bursts when multiple partitions rotate together = transient
#     overrun of the 3500-PUT/sec limit per prefix.
#
# WHY `DailyPartitioner` AND `HourlyPartitioner` ARE EXCLUDED FROM THIS RULE:
#
# The Confluent `kafka-connect-storage-common` library ships THREE time-based
# partitioner implementations:
#
#   - `io.confluent.connect.storage.partitioner.TimeBasedPartitioner` — the
#     base class. Reads `partition.duration.ms` from the config map and
#     honors it.
#
#   - `io.confluent.connect.storage.partitioner.DailyPartitioner` — a
#     subclass of TimeBasedPartitioner. Overrides `configure()` to FORCE
#     `partition.duration.ms = 86_400_000` (24 hours), regardless of what
#     the operator wrote in the .properties file.
#
#   - `io.confluent.connect.storage.partitioner.HourlyPartitioner` — a
#     subclass of TimeBasedPartitioner. Overrides `configure()` to FORCE
#     `partition.duration.ms = 3_600_000` (1 hour), regardless of what
#     the operator wrote in the .properties file.
#
# This means a .properties file with `partitioner.class=DailyPartitioner` and
# `partition.duration.ms=1000` (1 second) is NOT a violation — the subclass
# IGNORES the explicit value and uses its hardcoded 24-hour duration. The
# static-analysis rule MUST exclude these two subclasses from detection to
# avoid false-positive violations. Only the base `TimeBasedPartitioner`
# (where the explicit value is honored) is in scope.
#
# WHY 60_000 ms IS THE PLUGIN'S CHOSEN THRESHOLD:
#
# The threshold is the plugin's pragmatic line between "aggressive but
# defensible" (60 s for a small dev cluster or a low-traffic topic — perhaps
# acceptable, perhaps not, but at least within shouting distance of a
# legitimate use case) and "definitely wrong" (<60 s, which produces a
# storm of small objects with no legitimate production justification).
#
# An operator who deliberately wants sub-minute partitioning (a rare and
# almost certainly questionable choice) should suppress the rule with:
#
#   <CONNECT_STORAGE_SINK_PARTITION_DURATION_MS_TOO_LOW>OFF</CONNECT_STORAGE_SINK_PARTITION_DURATION_MS_TOO_LOW>
#
# and document the rationale in the .properties file.
#
# HOW SUB-MINUTE VALUES END UP IN PRODUCTION:
#
# (a) **Confusion with `rotate.interval.ms` or `rotate.schedule.interval.ms`.**
#     Operator confuses `partition.duration.ms` (bucket WIDTH — a
#     downstream-organization concern) with `rotate.interval.ms` (time-
#     rotation safety net for the S3 sink's heap buffer — a freshness
#     concern). They want flushes every 60 seconds and set
#     `partition.duration.ms = 60000`. The actual effect: every minute
#     boundary, the partitioner routes records to a new bucket → a new
#     S3 object → 60 new objects per partition per hour.
#
# (b) **Debug-mode setting never reverted.** During initial deployment,
#     operator sets `partition.duration.ms = 10000` (10 seconds — THIS
#     FIXTURE) or `partition.duration.ms = 1000` (1 second) to verify the
#     partitioning logic works ("I want to see new directories appear
#     every 10 seconds"). They confirm the partitioning works; they
#     never revert the value; the deploy goes to production; S3 fills
#     with hundreds of millions of tiny objects.
#
# (c) **'Real-time data lake' misconception.** Operator wants a "real-time
#     data lake" and sets `partition.duration.ms = 10000` (10 seconds)
#     thinking smaller is better for freshness. They don't realize that
#     the S3 sink has SEPARATE dials for freshness: `rotate.interval.ms`
#     (event-time-based) and `rotate.schedule.interval.ms` (wall-clock-
#     based). Those are the correct dials for freshness; partition.
#     duration.ms controls partition WIDTH, not flush frequency.
#
# (d) **Tutorial copy-paste at scale.** A Confluent S3 sink tutorial uses
#     `partition.duration.ms = 60000` "so the tutorial reacts quickly to
#     new data". The tutorial cluster has 3 partitions and 100 records/sec;
#     the production cluster has 500 partitions and 50_000 records/sec.
#     The 1-minute bucket width that produced one object/min/partition in
#     the tutorial produces 500 objects/min in production = 30_000
#     objects/hour = 720_000 objects/day. S3 PUT-rate limits are
#     approached; downstream query performance degrades.
#
# THE FIX:
#
# Replace `partition.duration.ms = 10000` with a value appropriate for the
# downstream query pattern:
#
#   partition.duration.ms = 3600000      # 1 hour (typical hourly partitioning)
#   partition.duration.ms = 86400000     # 24 hours (typical daily partitioning)
#
# OR remove the explicit key entirely to inherit the ConfigDef default of
# 86_400_000 (24 hours).
#
# OR replace `partitioner.class = TimeBasedPartitioner` with `DailyPartitioner`
# (subclass that hardcodes 24h) or `HourlyPartitioner` (subclass that
# hardcodes 1h), which makes the intent explicit and avoids needing to
# specify `partition.duration.ms` at all.
#
# =============================================================================

name=customer-events-s3-sink
connector.class=io.confluent.connect.s3.S3SinkConnector
tasks.max=4
topics=customer.events

s3.bucket.name=my-prod-customer-events-bucket
s3.region=us-east-1

format.class=io.confluent.connect.s3.format.json.JsonFormat
storage.class=io.confluent.connect.s3.storage.S3Storage

flush.size=1000
rotate.interval.ms=300000

partitioner.class=io.confluent.connect.storage.partitioner.TimeBasedPartitioner
path.format='year'=YYYY/'month'=MM/'day'=dd/'hour'=HH
locale=en
timezone=UTC
timestamp.extractor=Record

# VIOLATION: partition.duration.ms = 10000 (10 seconds) — far BELOW the
# plugin's 60_000 ms (1 minute) threshold. This produces a NEW S3 object
# every 10 seconds per topic-partition per task per partition-key. On a
# moderately-sized cluster (500 partitions × 4 tasks), this creates
# 720_000 S3 objects per hour — saturating S3 PUT-rate per-prefix limits,
# inflating S3 LIST cost, regressing downstream Athena/Trino query
# planners, and amplifying S3 lifecycle-rule iteration time. The 10-second
# value originated from a debugging session ("I want new directories to
# appear quickly") and was never reverted. Fix: set partition.duration.ms
# to a production-appropriate value such as 3_600_000 (1h) or 86_400_000
# (24h), or remove the explicit key to inherit the 24-hour default.
partition.duration.ms=10000

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false
