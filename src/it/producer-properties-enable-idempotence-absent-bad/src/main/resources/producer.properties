# RULE: PRODUCER_PROPERTIES_ENABLE_IDEMPOTENCE_ABSENT.
#
# This producer config sets `acks=all` and looks production-ready:
#   - acks=all                         (durability — replicas confirm)
#   - compression.type=zstd            (compressed batches)
#   - linger.ms=20                     (batching window opened)
#   - batch.size=131072                (128 KiB batches)
#
# ...but it never sets `enable.idempotence`. The kafka-clients ConfigDef
# default is VERSION-DEPENDENT:
#   - kafka-clients 2.x  → default `enable.idempotence=false`
#     • Retries produce DUPLICATES (same record reaches the broker twice).
#     • With `max.in.flight.requests.per.connection > 1`, retries also
#       REORDER writes per partition (message N+1 lands before N).
#   - kafka-clients 3.x+ → default `enable.idempotence=true` (KIP-679)
#     • Producer attaches a PID + per-partition monotonic sequence number.
#     • Broker dedupes and orders within a 5-record window per partition.
#
# Worse than the version-default flip, KIP-679 also introduced SILENT-DISABLE
# rules: even on 3.x, when `enable.idempotence` is left to its default of
# true BUT `acks` is explicitly `0`/`1`, OR `max.in.flight > 5`, OR
# `retries=0`, the kafka-clients constructor silently DOWNGRADES idempotence
# to false and logs a WARN line nobody reads.
#
# Setting `enable.idempotence=true` EXPLICITLY changes the silent-disable
# behavior: kafka-clients then throws ConfigException at startup instead of
# silently downgrading. That converts a quiet WARN into a loud, fail-fast
# error — the only safe configuration is the explicit one.
#
# Discovery shape: weeks later, duplicates appear downstream as same-key,
# same-payload, sequential-offset records. The team greps the config, finds
# no `enable.idempotence` line, and realizes that either (a) they were on
# 2.x the whole time, or (b) they were on 3.x but their `acks=1` setting
# silently disabled idempotence.
#
# Fix: ONE LINE. Add `enable.idempotence=true`. (The combination with
# `acks=all` already in this file is the canonical exactly-once-on-retry
# setup for kafka-clients 3.x+.)
bootstrap.servers=kafka-1.prod.example.com:9092
client.id=bad-no-idempotence-producer
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=org.apache.kafka.common.serialization.StringSerializer
acks=all
compression.type=zstd
linger.ms=20
batch.size=131072
buffer.memory=33554432
