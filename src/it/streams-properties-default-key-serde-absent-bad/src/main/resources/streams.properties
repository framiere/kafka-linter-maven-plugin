# =============================================================================
# IT fixture: STREAMS_PROPERTIES_DEFAULT_KEY_SERDE_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A Kafka Streams .properties file destined for `new StreamsConfig(props)`.
#   It declares application.id, bootstrap.servers, default.value.serde,
#   commit interval, processing guarantee, replication, thread count, state
#   dir, both exception handlers — a complete Streams config — EXCEPT
#   `default.key.serde` is not set anywhere.
#
# What's wrong
#   `org.apache.kafka.streams.StreamsConfig.DEFAULT_KEY_SERDE_CLASS_CONFIG`
#   declares `default.key.serde` with `ConfigDef.Type.CLASS`, default `null`,
#   NULL_ALLOWED, importance MEDIUM. The kafka-streams parse step does NOT
#   validate the absence — `new StreamsConfig(props)` succeeds. The default
#   is consulted LATER, at topology-build or topology-start time, by every
#   DSL operator that does NOT pass an explicit Serde via:
#     - Consumed.with(...)       for stream() / table() / globalTable()
#     - Grouped.with(...)         for groupByKey() / groupBy()
#     - Materialized.with(...)    for aggregate() / count() / reduce()
#     - Produced.with(...)        for to() / through()
#     - Joined.with(...)          for join() / leftJoin() / outerJoin()
#
#   When the default is null and an operator needs it, the framework throws:
#
#     org.apache.kafka.common.config.ConfigException:
#       Please specify a default key serde through configured
#       'default.key.serde' or through
#       Materialized/Consumed/Grouped/Produced/Joined.with(...)
#
#   The exception fires at `Topology.build()` time for source-node-related
#   operators, or at `KafkaStreams.start()` time for others. Either way:
#   production crashes at startup with a clear exception pointing at the
#   missing default. Recovery: add the line, re-deploy.
#
# Why this is "WARNING" by default (not ERROR)
#   The all-explicit-Serdes pattern is legitimate (and recommended by some
#   Streams best-practice guides): every operator passes Consumed/Grouped/
#   Materialized/Produced/Joined.with(Serdes.X(), Serdes.Y()) explicitly,
#   making the topology's serialization shape self-documenting. In that
#   case, the default is never consulted, and absence is fine.
#
#   But this pattern requires DISCIPLINE: every operator, every refactor,
#   every new branch. As topologies evolve, operators slip in operators
#   without explicit Serdes (it's easy to forget on, e.g., a simple `to(
#   topic)` sink). The default is then consulted and is null, causing the
#   crash. So absence-without-comment is overwhelmingly an accident, but
#   absence-with-comment ("# default.key.serde intentionally omitted —
#   every operator passes explicit Serdes") is legitimate.
#
#   This IT overrides severity to ERROR via pom.xml configuration to force
#   the build to fail and verify the rule fires.
#
# Common bug shapes
#   (1) Local-dev all-explicit; production adds a default-needing operator.
#       Developer's local-dev topology uses explicit Consumed everywhere.
#       Production adds an aggregate(...) without Materialized.with(...).
#       Topology build at production startup throws ConfigException.
#       Deploy fails. Operator adds the missing line. Static analysis at
#       PR time catches it.
#
#   (2) Repartition trigger from selectKey().
#       Topology has kstream.selectKey((k,v) -> v.userId()).groupByKey().
#       aggregate(...). The selectKey() changes the key type; groupByKey()
#       triggers an implicit repartition; the repartition topic needs a key
#       Serde for the NEW key type. Default is null. Topology build crashes.
#
#   (3) GlobalKTable bootstrap before first record.
#       b.globalTable("countries") (no Consumed) consults the default key
#       Serde at GlobalStreamThread startup. The default is null. The
#       GlobalStreamThread crashes immediately at KafkaStreams.start().
#
#   (4) KStream-KTable join blowing up at build time.
#       Topology has KStream.join(KTable, valueJoiner) without Joined.
#       with(...). Join needs key Serde to repartition by join key. Default
#       is null. Topology build throws ConfigException.
#
#   (5) Spring Boot StreamsBuilderFactoryBean defaults leak through.
#       Spring Kafka exposes default.key.serde via spring.kafka.streams.
#       properties.default.key.serde. Many Spring Boot Streams apps never
#       set it. Static analysis catches the absence.
#
# Fix
#   Set `default.key.serde` to the most-common key encoding in your topology:
#
#     # String keys (most common simple case)
#     default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
#
#     # Byte-array keys
#     default.key.serde=org.apache.kafka.common.serialization.Serdes$ByteArraySerde
#
#     # Avro keys (Schema Registry)
#     default.key.serde=io.confluent.kafka.streams.serdes.avro.SpecificAvroSerde
#
#   For multi-typed topologies, set the default to the most-common type
#   and override per-operator with .with(...) for the others. For all-
#   explicit-Serdes topologies, document the choice with a comment:
#     # default.key.serde intentionally omitted — every operator passes
#     # explicit Serdes via Consumed/Grouped/Materialized/Produced/Joined.with()
# =============================================================================

application.id=customer-events-stream
bootstrap.servers=broker-1.kafka.prod.example.com:9092,broker-2.kafka.prod.example.com:9092,broker-3.kafka.prod.example.com:9092

# Value serde IS set — this isolates the rule to firing only on the absent KEY serde.
default.value.serde=io.confluent.kafka.streams.serdes.avro.SpecificAvroSerde

# Internal-topic durability.
replication.factor=3
min.insync.replicas=2

# Throughput & latency.
num.stream.threads=8
commit.interval.ms=5000

# At-least-once (the default; set explicitly for documentation).
processing.guarantee=at_least_once

# State-store location.
state.dir=/var/lib/kafka-streams/customer-events

# Exception handlers — both set.
default.deserialization.exception.handler=org.apache.kafka.streams.errors.LogAndContinueExceptionHandler
default.production.exception.handler=org.apache.kafka.streams.errors.LogAndContinueProductionExceptionHandler

# Schema registry (Confluent Avro serde dependency).
schema.registry.url=http://schema-registry.kafka.prod.example.com:8081

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# MISSING:
#   default.key.serde=...
# Any DSL operator without explicit Consumed/Grouped/Materialized/Produced/
# Joined.with(Serde, Serde) consults the default key Serde and gets null.
# Topology build throws ConfigException; production crashes at startup.
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
