# RULE: CONSUMER_PROPERTIES_SESSION_TIMEOUT_MS_ABSENT.
#
# This consumer config is otherwise reasonable:
#   - group.id set
#   - deserializers set
#   - auto.offset.reset=earliest             (replay/analytics intent)
#   - enable.auto.commit=false               (at-least-once)
#   - max.poll.records=500                   (explicit)
#   - max.poll.interval.ms=300000            (explicit)
#   - isolation.level=read_uncommitted       (explicit, non-transactional topic)
#   - heartbeat.interval.ms=15000            (explicit — see footgun below)
#
# ...but it never sets `session.timeout.ms`. kafka-clients defaults
# `session.timeout.ms` to a CLIENT-VERSION-DEPENDENT value:
#
#   - kafka-clients  2.x          → default = 10000   (10 s)
#   - kafka-clients  3.0+ (KIP-735) → default = 45000  (45 s)
#
# THE BUG SHAPE THIS RULE CATCHES:
#
# `session.timeout.ms` is the broker's patience for the consumer's
# HEARTBEAT THREAD (not the application thread that calls `poll()`).
# If the broker does not receive a heartbeat within this window, it
# considers the consumer dead and triggers a group rebalance.
#
# The default's silent change between kafka-clients 2.x and 3.x via
# KIP-735 (Sept 2021) is the bug: any consumer config that does NOT
# pin `session.timeout.ms` will silently rebalance differently when
# the client library is upgraded — same code, same broker, very
# different rebalance behavior.
#
# CONCRETE FAILURE MODE (this fixture):
#
# Operator copied `heartbeat.interval.ms=15000` from a guide written
# for kafka-clients 3.x. The guide assumed an implicit
# `session.timeout.ms=45000` (3.x default), so the pairing constraint
# `heartbeat.interval.ms <= session.timeout.ms / 3` holds:
#
#   15000 (heartbeat)  <=  45000 / 3  =  15000 (session)  ✓
#
# Deployed on a kafka-clients 2.x consumer (10 s default):
#
#   15000 (heartbeat)  <=  10000 / 3  =   3333 (session)  ✗
#
# Broker rejects the join: `Member's provided session timeout
# (15000ms) is out of acceptable range [6000ms, 1800000ms]` —
# actually the rejection on the heartbeat-interval constraint
# specifically fires as `Heartbeat interval (15000ms) is greater
# than (or equal to) session.timeout.ms (10000ms) / 3 (3333ms)`.
#
# Failure surfaces at FIRST JOIN, not gradually — the consumer
# never starts. Symptom: `InvalidSessionTimeoutException` in logs
# at startup. Root cause: `session.timeout.ms` was absent, so the
# 2.x default 10000 was used.
#
# OTHER CONCRETE FAILURE SHAPES:
#
# (1) GC pause exceeds the implicit timeout.
#     G1GC mixed-collection pauses up to 30 s. With 2.x default
#     10 s, every such pause evicts the consumer. With 3.x default
#     45 s, only the worst pauses do. Operator never knew which
#     default was active; could not tune MaxGCPauseMillis to match.
#
# (2) Sub-second-network deployment behind a flaky load balancer.
#     Consumer deployed behind an LB that does 500 ms TCP-level
#     connection probes. On 2.x (10 s) the brief LB-induced
#     partitions barely register; on 3.x (45 s) the heartbeat
#     thread tolerates much longer LB-induced gaps — but if the
#     LB sometimes does longer drops, the failure mode shifts
#     silently.
#
# (3) Helm-templated consumer config across multiple services.
#     SRE templates consumer.properties files in Helm; chart was
#     authored when 2.x was the standard client. The team upgrades
#     to 3.x. Same chart now produces consumers with very different
#     rebalance characteristics; only some hit the changed timeout
#     in production; difficult to root-cause.
#
# (4) Mixed-version fleet.
#     Some pods run 2.x clients (old image), some run 3.x clients
#     (new image). Same group; same `session.timeout.ms` absent.
#     Group coordinator sees mixed session timeouts (10000 from
#     2.x members, 45000 from 3.x members); group's effective
#     timeout is the MAX configured by any member — but the
#     individual members' heartbeat threads time out based on
#     their own configured value. Rebalance behavior diverges
#     within the same group; operators see flaky tests and
#     intermittent lag.
#
# INFO severity (not WARNING/ERROR) because the default is
# defensible for typical workloads on either client version. The
# rule is a 'have you pinned the eviction window against client-
# version-independent network reliability requirements?' nudge.
# Raised here to ERROR by config override so the IT fixture
# demonstrates the violation deterministically.
#
# Fix: ONE LINE. `session.timeout.ms=30000` for typical workloads
# (10× headroom against `heartbeat.interval.ms=3000`), or
# `session.timeout.ms=45000` EXPLICITLY to pin the 3.x default,
# or `session.timeout.ms=10000` EXPLICITLY to pin the 2.x default.
# The point is: PIN IT, do not let it shift across client upgrades.
bootstrap.servers=kafka-1.prod.example.com:9092
group.id=orders-heartbeat-fragile
client.id=bad-no-session-timeout-consumer
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
auto.offset.reset=earliest
enable.auto.commit=false
max.poll.records=500
max.poll.interval.ms=300000
isolation.level=read_uncommitted
heartbeat.interval.ms=15000
