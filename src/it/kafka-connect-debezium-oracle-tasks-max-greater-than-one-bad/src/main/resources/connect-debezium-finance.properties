name=oracle-finance-cdc
connector.class=io.debezium.connector.oracle.OracleConnector

# Anti-pattern: tasks.max=4 on a Debezium Oracle connector is silently
# ignored. The Debezium Oracle connector is FUNDAMENTALLY single-task in
# BOTH adapter modes:
#
#   - LogMiner mode (the default, log.mining.strategy=online_catalog or
#     redo_log_catalog): the connector establishes a SINGLE LogMiner
#     session and reads a SINGLE strictly-ordered stream of redo-log
#     records via the V$LOGMNR_CONTENTS cursor. Splitting across tasks is
#     architecturally impossible — every task would need its own session
#     mining the SAME redo logs, producing duplicate events to Kafka AND
#     multiplying the redo-log-retention load on the Oracle server by N.
#
#   - XStream mode (connection.adapter=xstream): the XStream outbound
#     server is a server-side singleton per outbound queue, and the
#     client connects to it ONCE per connector.
#
# The connector's OracleConnector#taskConfigs(int maxTasks) returns a
# one-element list regardless of maxTasks. Connect schedules exactly 1
# task and the remaining 3 "task slots" are never used.
#
# The operator who set tasks.max=4 likely intended to "scale CDC
# throughput" but got NO parallelism — the connector silently runs 1
# task. Capacity planning ('4x parallel CDC throughput available') is
# based on a false premise.
#
# Real scaling options for Oracle CDC: (a) horizontal sharding of tables
# across multiple connectors (each capturing a disjoint
# table.include.list); (b) Oracle-side tuning of LogMiner batch
# parameters (log.mining.batch.size.max, log.mining.view.fetch.size);
# (c) heap/CPU scaling of the single connector's worker thread; (d) for
# multitenant CDB/PDB installations: one-connector-per-PDB sharding.
# None involve raising tasks.max.
tasks.max=4

database.hostname=oracle-finance.internal
database.port=1521
database.user=DEBEZIUM
database.password=changeme
database.dbname=FINPDB
database.pdb.name=FINPDB

topic.prefix=cdc.finance.oracle

schema.history.internal.kafka.bootstrap.servers=kafka:9092
schema.history.internal.kafka.topic=schema-history.finance-oracle

table.include.list=FINANCE.GENERAL_LEDGER,FINANCE.JOURNAL_ENTRIES,FINANCE.ACCOUNT_BALANCES

log.mining.strategy=online_catalog
log.mining.batch.size.max=10000
log.mining.view.fetch.size=10000

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false

snapshot.mode=initial
