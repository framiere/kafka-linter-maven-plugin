# =============================================================================
# IT fixture: STREAMS_PROPERTIES_COMMIT_INTERVAL_MS_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A Kafka Streams .properties file destined for `new StreamsConfig(props)`.
#   It declares application.id, bootstrap.servers, default serdes, processing
#   guarantee, replication factor, thread count, state dir, both exception
#   handlers — a complete Streams config — EXCEPT `commit.interval.ms` is not
#   set anywhere.
#
# What's wrong
#   `org.apache.kafka.streams.StreamsConfig.COMMIT_INTERVAL_MS_CONFIG` declares
#   `commit.interval.ms` with importance LOW and TWO different defaults
#   depending on `processing.guarantee`:
#     * `at_least_once` (the default):   30000 ms (30 seconds)
#     * `exactly_once` / `exactly_once_v2`: 100 ms (0.1 seconds)
#
#   Both defaults are workload-dependent. This file sets
#   `processing.guarantee=exactly_once_v2`, so the framework would pick the
#   100 ms default. That default bounds three things at once:
#
#   (1) REPLAY WINDOW on restart / rebalance / thread crash.
#       In at-least-once, commit.interval.ms is the maximum time between
#       offset commits + state-store checkpoints. Up to commit.interval.ms
#       of records and state changes are re-processed on every recovery.
#       In EOS, it's the maximum time between transactions; uncommitted
#       transactions are rolled back on recovery, so up to commit.interval.ms
#       of records are re-processed (idempotently, exactly-once-from-the-
#       downstream's-point-of-view).
#
#   (2) END-TO-END LATENCY for downstream `isolation.level=read_committed`
#       consumers (EOS mode only). Downstream consumers wait for the next
#       commit marker before seeing records — so commit.interval.ms is the
#       maximum delay a downstream consumer sees between a record being
#       produced and being visible.
#
#   (3) TRANSACTION-COORDINATOR LOAD (EOS mode only). Every commit triggers
#       a `producer.commitTransaction()` which writes to `__transaction_state`,
#       writes commit markers to every output partition the transaction
#       touched, and writes a checkpoint file to disk. With 8 StreamThreads
#       × 10 commits/sec (100 ms interval) = 80 transactions/sec/instance;
#       a 100-instance cluster generates 8,000 transactions/sec on its
#       coordinators. With 20 output topics × 10 partitions, every
#       transaction writes 200 commit markers — 1.6 M commit-marker writes/
#       sec across the cluster. Coordinators saturate; end-to-end latency
#       spikes from 50 ms to 800 ms.
#
# Why this is "INFO" by default (not WARNING or ERROR)
#   Both defaults are defensible for SOME workloads:
#     * 30 s at-least-once is fine for low-throughput batch-y Streams
#       topologies where 30 s of replay is immaterial (e.g., a daily
#       aggregation job that processes a few hundred records/sec).
#     * 100 ms EOS is fine for low-instance-count topologies where
#       coordinator pressure is acceptable (e.g., a single-instance EOS
#       app processing 100 records/sec).
#
#   But for the majority of production Streams workloads, neither default
#   is right. High-throughput at-least-once apps want shorter commits
#   (5-10 s) to bound replay; EOS apps want longer commits (1-5 s) to
#   reduce coordinator pressure. The linter defaults to INFO because the
#   absence-of-explicit-choice is a "have you thought about this?" nudge,
#   not a blocker.
#
#   This IT overrides the severity to ERROR via pom.xml to force the
#   build to fail and verify the rule fires.
#
# Common bug shapes
#   (1) High-throughput at-least-once topology, frequent rebalances.
#       A Streams app processes 10k rec/s/partition × 16 partitions = 160k
#       rec/s. commit.interval.ms is unset, default 30 s is used. Every
#       rebalance (deploy, scale-up, broker-restart) costs 30 s × 160k =
#       4.8 M records of re-processing across all partitions. Setting
#       commit.interval.ms=5000 cuts the replay storm by 6x.
#
#   (2) EOS topology saturating transaction coordinator.
#       A Streams app uses processing.guarantee=exactly_once_v2.
#       commit.interval.ms is unset, default 100 ms is used. With 8 threads
#       × 10 instances = 80 threads, the cluster generates 800 txn/sec.
#       The transaction coordinator saturates; end-to-end latency spikes
#       from 50 ms to 800 ms. Setting commit.interval.ms=1000 restores
#       normal latency.
#
#   (3) Low-latency downstream consumer bound by commit interval.
#       A Streams app emits records that a downstream isolation.level=
#       read_committed consumer reads. With at-least-once and commit.
#       interval.ms=30000, the downstream sees records at 30-second
#       intervals batched together — "records appear in chunks, then
#       nothing for 30 seconds, then another chunk". Operator switches to
#       EOS for sub-second latency but hits coordinator pressure. The
#       right answer: EOS with commit.interval.ms=1000.
#
#   (4) State-store restore takes forever on restart.
#       A Streams app has a 50 GiB state-store. commit.interval.ms is
#       unset (default 30 s at-least-once). On a thread crash, the
#       StreamThread re-reads 30 s of changelog updates from the broker.
#       At 100 MB/s changelog throughput = 3 GiB of re-reads = 30 s
#       restore time AFTER the broker delivers the changelog. Setting
#       commit.interval.ms=5000 reduces re-reads to 500 MiB.
#
#   (5) Spring Boot StreamsConfig defaults leaking through.
#       Spring Kafka's StreamsBuilderFactoryBean exposes commit.interval.
#       ms via spring.kafka.streams.properties.commit.interval.ms. Many
#       Spring Boot Streams apps never set it and pick up the framework
#       default. Static analysis of the underlying .properties (or
#       @ConfigurationProperties Java config) catches the absence.
#
# Fix
#   For at-least-once high-throughput workloads:
#     commit.interval.ms=5000          # 5 seconds — cuts replay window 6x
#
#   For exactly_once_v2 workloads:
#     commit.interval.ms=1000          # 1 second — cuts coordinator pressure
#                                      # 10x, keeps end-to-end latency < 1s
#
#   For workloads where the default is right, set the value EXPLICITLY to
#   document the deliberate choice and to insulate the app from future
#   Streams version changes that might shift the default:
#     commit.interval.ms=30000         # at-least-once: accept 30 s replay
#     commit.interval.ms=100           # EOS: minimize end-to-end latency
# =============================================================================

application.id=orders-enrichment-stream
bootstrap.servers=broker-1.kafka.prod.example.com:9092,broker-2.kafka.prod.example.com:9092,broker-3.kafka.prod.example.com:9092

# Default serdes used by topology operators that don't pass explicit Consumed/Produced/Materialized/Grouped.
default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
default.value.serde=io.confluent.kafka.streams.serdes.avro.SpecificAvroSerde

# Internal-topic durability.
replication.factor=3
min.insync.replicas=2

# Throughput & latency.
num.stream.threads=8

# Exactly-once-v2 — Streams will pick a 100 ms commit.interval.ms default
# unless the operator overrides it.
processing.guarantee=exactly_once_v2

# State-store location (outside /tmp; survives container restarts when mounted as a volume).
state.dir=/var/lib/kafka-streams/orders-enrichment

# Exception handlers — both set, so the existing handler-absent rules don't fire.
default.deserialization.exception.handler=org.apache.kafka.streams.errors.LogAndContinueExceptionHandler
default.production.exception.handler=org.apache.kafka.streams.errors.LogAndContinueProductionExceptionHandler

# Schema registry (Confluent Avro deserializer dependency).
schema.registry.url=http://schema-registry.kafka.prod.example.com:8081

