# =============================================================================
# A MirrorMaker 2 source-connector configuration where ALL FOUR MM2
# replication-factor keys are explicitly set to 1 — the dev-cluster default
# that ships to production via Helm-chart inheritance, GitOps repo promotion,
# or environment-overlay misconfiguration.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#
#   connector.class                          = MirrorSourceConnector
#   replication.factor                       = 1    ← replicated data topics
#   checkpoints.topic.replication.factor     = 1    ← MM2 checkpoints topic
#   heartbeats.topic.replication.factor      = 1    ← MM2 heartbeats topic
#   offset-syncs.topic.replication.factor    = 1    ← MM2 offset-syncs topic
#
# WHAT THESE FOUR KEYS ACTUALLY CONTROL:
#
# MirrorMaker 2 maintains FOUR durability-critical topic classes on the target
# cluster, each with its own RF configuration key:
#
# (1) `replication.factor` — controls the RF of REPLICATED DATA topics that
#     MM2 auto-creates on the target cluster (every topic in the `topics=`
#     include-list that doesn't already exist on the target is created with
#     this RF; defaults to 2 in the connector's ConfigDef, but production
#     deployments override to 3). With RF=1, every record produced into a
#     replicated topic during a target-cluster broker outage is LOST when the
#     holding broker comes back as a follower of a different leader (or simply
#     stays down). The DR cluster diverges from the source cluster silently;
#     downstream consumers on the DR cluster see only the records that landed
#     on still-living brokers during the outage window.
#
# (2) `checkpoints.topic.replication.factor` — controls the RF of the MM2
#     CHECKPOINTS topic (`<source-alias>.checkpoints.internal`, written by
#     `MirrorCheckpointConnector`) that stores TRANSLATED consumer-group
#     commit offsets for every replicated group. This topic IS the
#     failover-recovery substrate: during a primary→DR cutover, consumers on
#     the DR cluster read from `<source-alias>.checkpoints.internal` to
#     translate their last-committed source-cluster offsets into DR-cluster
#     offsets BEFORE resuming consumption. Without this topic the consumers
#     must restart from earliest (replaying records they already processed,
#     causing double-billing for non-idempotent processing) or latest (LOSING
#     records that hadn't been processed yet). At RF=1, a single broker
#     outage on the DR cluster takes failover-recovery offline; the DR plan
#     is unexecutable until the holding broker returns.
#
# (3) `heartbeats.topic.replication.factor` — controls the RF of the MM2
#     HEARTBEATS topic (`heartbeats`, written by `MirrorHeartbeatConnector`)
#     that downstream consumers and operators read to confirm replication is
#     alive. Monitoring queries the timestamp of the latest record on the
#     heartbeats topic; a stall indicates replication lag or stoppage. At
#     RF=1, a single broker outage makes the heartbeats topic look
#     IDENTICAL to an actual replication stoppage — auto-paging a false
#     outage that wakes the on-call engineer, who then spends 30+ minutes
#     confirming that the actual data topics are still flowing (they are —
#     it's just the heartbeats observability that's down).
#
# (4) `offset-syncs.topic.replication.factor` — controls the RF of the MM2
#     OFFSET-SYNCS topic (`<source-alias>.offset-syncs.internal`, written by
#     `MirrorSourceConnector`) that maps source-partition offsets to
#     target-partition offsets for the MirrorCheckpointConnector's
#     offset-translation machinery. Without this topic, the checkpoint
#     connector cannot translate offsets — meaning the CHECKPOINTS topic
#     itself goes stale, which means failover-recovery becomes impossible
#     EVEN WHEN the checkpoints topic IS available. At RF=1, the
#     offset-syncs topic is the weakest link in the failover-recovery chain.
#
# WHY THIS LOOKS SAFE BUT IS NOT:
#
# The misconfiguration costs NOTHING in steady state. Replication runs fine
# when no broker is restarting. The MM2 connectors do not log warnings about
# low RF (Kafka's `AdminClient.createTopics()` accepts any positive integer
# value for replication factor without commentary). Monitoring dashboards
# show steady-state throughput. The cluster appears healthy.
#
# The damage manifests only at the moment of:
#   - a routine rolling broker restart on the target cluster
#   - a scheduled DR drill (quarterly cutover test)
#   - an actual primary cluster failover
#   - a target-cluster broker hardware failure
#
# Exactly the moments when the operator NEEDS the system to be durable. The
# misconfiguration is a time-bomb whose detonation aligns with the operator's
# worst day.
#
# HOW LOW RF ON MM2 INTERNAL TOPICS HAPPENS:
#
# (a) **Dev-cluster default shipped to prod.** Connector configs are first
#     authored against a single-broker dev cluster where `replication.factor=1`
#     is REQUIRED for the cluster to come up green (a one-broker cluster
#     cannot create a topic with RF > 1). The config is GitOps-promoted to
#     staging and prod without environment-specific overrides; the MM2
#     internal topics on staging/prod inherit the dev default.
#
# (b) **Helm-chart with RF=1 'dev shortcut'.** Org's internal Helm chart for
#     MM2 deployments templates `replicationFactor: 1` as a 'dev shortcut' to
#     reduce storage cost on dev clusters. Multiple teams deploy the chart to
#     prod without overriding; every team's MM2 internal topics are at RF=1.
#     Discovered during a quarterly DR drill: the cutover attempts to read
#     `<source>.checkpoints.internal` on the DR cluster; the topic's only
#     replica is on the broker that the drill simulates as 'failed'; the
#     drill cannot proceed without manual offset-replay; the drill is failed;
#     the DR plan is reclassified as 'untested in production' until the RF
#     is fixed and re-drilled (a multi-quarter effort because raising RF on
#     existing topics requires partition reassignment with shadowing).
#
# (c) **Confluent Cloud → self-managed migration.** Team migrates from
#     Confluent Cloud (where MM2 internal-topic RFs are managed by the
#     platform and not exposed to users) to self-managed Kafka. The
#     migration playbook copies the runtime connector config from the CC
#     REST API output; the API output reflects CC's three-broker durability
#     defaults but the migration script silently strips the RF keys
#     'because they're not interesting' — leaving the new self-managed
#     config to use the ConfigDef defaults (RF=2 for `replication.factor`,
#     RF=3 for the three internal topics). The team explicitly adds
#     `replication.factor=1` to the new config 'to match the dev cluster's
#     broker count' during initial testing, then forgets to remove the
#     override before prod promotion.
#
# (d) **Operator-template skeleton with placeholder RF.** A team's MM2
#     deployment uses a CI-generated skeleton with `replication.factor=
#     ${KAFKA_RF}` and a deployment-time `envsubst` step that fills in the
#     env-specific value. The dev pipeline uses `KAFKA_RF=1`; the prod
#     pipeline was supposed to use `KAFKA_RF=3` but the env-var was never
#     set; envsubst leaves the literal `${KAFKA_RF}` which Connect rejects
#     with `ConfigException: Invalid value '${KAFKA_RF}' for configuration
#     replication.factor: Not a number` — the LOUD failure mode. But a
#     SIBLING pipeline that used `KAFKA_RF=1` as a fallback to keep the
#     deploy green silently ships RF=1 to prod.
#
# (e) **DR-cluster failover with dependent topic.** Team's DR plan depends
#     on the `<source>.heartbeats` topic being readable on the DR cluster to
#     confirm the DR cluster has caught up with replication. The heartbeats
#     topic is RF=1; during the cutover the cluster restarts; the heartbeats
#     topic's single replica is on a restarting broker; the DR-readiness
#     check returns 'no data' and the runbook pauses the cutover for manual
#     investigation; the actual replicated data topics are caught up but
#     the team cannot prove it without the heartbeats signal.
#
# THE FIX:
#
# Set every MM2 RF key to >= 3:
#
#   replication.factor                       = 3
#   checkpoints.topic.replication.factor     = 3
#   heartbeats.topic.replication.factor      = 3
#   offset-syncs.topic.replication.factor    = 3
#
# IMPORTANT: changing this config does NOT automatically alter the RF of
# topics that already exist. MM2 uses these values only for first-time topic
# creation; existing topics retain their original RF. Raising RF retroactively
# requires `kafka-reassign-partitions.sh` (a manual operation with shadowing
# during the reassignment window). Plan both the config fix AND the topic
# reassignment together.
#
# If the deployment cluster genuinely has fewer than 3 brokers, MM2 should
# not be running on it — MM2's whole purpose is durable cross-cluster
# replication, which requires durable per-topic storage.
#
# =============================================================================

name=mm2-orders-source
connector.class=org.apache.kafka.connect.mirror.MirrorSourceConnector
tasks.max=8

source.cluster.alias=primary
target.cluster.alias=dr

source.cluster.bootstrap.servers=primary-kafka.internal:9093
target.cluster.bootstrap.servers=dr-kafka.internal:9093

# VIOLATION 1: replication.factor=1 — replicated DATA topics on the target
# cluster will be created with RF=1; a single broker outage on the target
# loses records during the outage window. Fix: replication.factor=3.
replication.factor=1

# VIOLATION 2: checkpoints.topic.replication.factor=1 — the MM2 checkpoints
# topic (<source-alias>.checkpoints.internal) is the failover-recovery
# substrate; at RF=1 a single broker outage on the target makes failover
# impossible. Fix: checkpoints.topic.replication.factor=3.
checkpoints.topic.replication.factor=1

# VIOLATION 3: heartbeats.topic.replication.factor=1 — the MM2 heartbeats
# topic is the observability substrate; at RF=1 a single broker outage looks
# identical to an actual replication stoppage (false-paging). Fix:
# heartbeats.topic.replication.factor=3.
heartbeats.topic.replication.factor=1

# VIOLATION 4: offset-syncs.topic.replication.factor=1 — the MM2 offset-syncs
# topic is the source→target offset-mapping substrate for the MirrorCheckpoint
# Connector's offset-translation machinery; at RF=1 the checkpoint connector
# starves on a single broker outage. Fix: offset-syncs.topic.replication.factor=3.
offset-syncs.topic.replication.factor=1

topics=orders\\..*,payments\\..*,customers\\..*
topics.exclude=__consumer_offsets,__transaction_state,_schemas

sync.topic.acls.enabled=true
sync.topic.configs.enabled=true
refresh.topics.interval.seconds=600
refresh.groups.interval.seconds=600
