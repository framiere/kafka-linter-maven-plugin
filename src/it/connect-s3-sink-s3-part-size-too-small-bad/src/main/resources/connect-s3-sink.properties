# =============================================================================
# A Confluent S3 sink connector configuration where the operator set
# `s3.part.size = 1048576` (1 MiB) — a value that is BELOW the AWS S3
# multipart-upload minimum part size of 5 MiB (5_242_880 bytes). The .properties
# file was originally tuned for a local MinIO test environment that accepts
# sub-5MiB parts as a development convenience; the value was never updated for
# the production AWS S3 deployment.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#
#   connector.class = io.confluent.connect.s3.S3SinkConnector
#   s3.part.size    = 1048576          # 1 MiB — BELOW the AWS minimum of 5 MiB
#
# WHAT `s3.part.size` ACTUALLY DOES:
#
# `s3.part.size` is the size in bytes of each PART in the S3 MULTIPART UPLOAD
# that the Confluent S3 sink connector uses to write its output objects to S3.
#
# Background on S3 multipart upload:
#
# The AWS S3 PUT-Object-as-multipart protocol breaks an object into multiple
# HTTP `UploadPart` requests. Each part:
#   - Has its own HTTP request and response.
#   - Has its own ETag (returned by S3 in the response).
#   - Has its own retry / resume / cancel semantics.
#   - Is uploaded INDEPENDENTLY of the other parts (allowing parallel uploads
#     and partial-failure retries).
#
# Once all parts are uploaded, the client issues a `CompleteMultipartUpload`
# request that:
#   - Lists all the part ETags in their intended assembly order.
#   - Asks S3 to stitch the parts together into a single S3 object.
#   - Returns the final object's ETag.
#
# Multipart upload exists for two reasons:
#
#   (a) To allow objects LARGER than the single-PUT limit. A single S3 PUT
#       is capped at 5 GiB; via multipart, an object can be up to 5 TiB.
#
#   (b) To allow PARALLEL uploads (parts can be uploaded simultaneously from
#       multiple threads, increasing throughput) and RESUMABLE uploads (a
#       failed part can be retried without re-uploading the parts that
#       already succeeded).
#
# THE AWS 5 MiB MINIMUM PART SIZE:
#
# AWS S3 enforces a HARD MINIMUM PART SIZE of 5 MiB (exactly 5 × 1024 × 1024
# = 5_242_880 bytes) per part, with ONE EXCEPTION: the FINAL part of a
# multipart upload has no minimum (it can be as small as the leftover bytes
# of the object after dividing into 5MiB+ chunks).
#
# This is NOT:
#   - A Confluent preference. (The S3 sink doesn't choose this number.)
#   - A "best practice" you can ignore. (It's enforced by the AWS S3 API.)
#   - A configurable AWS account setting. (It's a fixed API contract.)
#
# This IS:
#   - An AWS S3 API CONTRACT. Calling `UploadPart` with a body smaller than
#     5 MiB (when it's not the final part) returns HTTP 400 with error code
#     `EntityTooSmall` and message "Your proposed upload is smaller than the
#     minimum allowed size".
#
# (For reference: the AWS maximum part size is 5 GiB = 5_368_709_120 bytes,
# and the maximum number of parts per upload is 10_000. So the maximum
# object size via multipart is 10_000 × 5 GiB = 50 TiB in theory, capped at
# 5 TiB by a separate AWS limit.)
#
# WHY THE CONFLUENT S3 SINK ALWAYS USES MULTIPART:
#
# The Confluent S3 sink connector's `S3OutputStream` ALWAYS uses multipart
# upload. There is NO single-PUT code path for large objects — the multipart
# machinery is unconditionally on for all output formats (Parquet, Avro,
# JSON, raw bytes). The implementation:
#
#   1. Buffers up to `s3.part.size` bytes of record bytes in worker HEAP.
#   2. When the buffer is full, calls AWS SDK's `AmazonS3#uploadPart` with
#      the buffered bytes as the part body, gets back the part's ETag, adds
#      the ETag to its internal list.
#   3. Repeats until the flush trigger fires (flush.size records,
#      rotate.interval.ms, or rotate.schedule.interval.ms).
#   4. On flush, the remaining buffered bytes (typically smaller than
#      s3.part.size) are uploaded as the FINAL part — this part has no
#      minimum so it's accepted by S3 regardless of size.
#   5. Then calls `AmazonS3#completeMultipartUpload` with all the collected
#      ETags, finalizing the object.
#
# WHEN s3.part.size < 5 MiB:
#
# Step 2 above issues `UploadPart` requests with bodies of `s3.part.size`
# bytes each — and the bodies are SMALLER THAN 5 MiB. AWS S3 rejects every
# such `UploadPart` request with HTTP 400 `EntityTooSmall`.
#
# The Connect task experiences this as a runtime exception bubbling up from
# the AWS SDK. The exception is non-retriable (it's not a transient failure;
# it's an API-contract violation). The task fails. The connector reports
# `FAILED` status. The data backlog grows. On-call is paged.
#
# WHY THE CONFIGDEF VALIDATOR DOES NOT ALWAYS CATCH THIS:
#
# `S3SinkConnectorConfig` declares the field as:
#
#   PART_SIZE_CONFIG = "s3.part.size"
#   PART_SIZE_DEFAULT = 26_214_400 (25 MiB)
#   PART_SIZE_VALIDATOR = Range.between(5 * 1024 * 1024, Integer.MAX_VALUE)
#
# So in principle, sub-5MiB values should be rejected at startup with
# `ConfigException: Value for configuration s3.part.size must be at least
# 5242880`. In practice, the validator was INCONSISTENT across Confluent
# S3 sink versions:
#
#   - In older versions (<= 5.5.x), the validator was strict.
#   - In some intermediate versions (5.x-7.x), the validator was relaxed or
#     removed to support test configurations against MinIO (a development
#     S3-API server that accepts sub-5MiB parts).
#   - In current versions (10.x+), the validator is strict again.
#
# An operator running a non-current Confluent S3 sink plugin (very common
# in the wild — operators upgrade Connect plugins slowly) may have the
# validator-relaxed version and the misconfiguration passes startup
# validation. The misconfig is then caught only at the first flush against
# real AWS S3, in production.
#
# THIS STATIC-ANALYSIS RULE IS DEFENSE-IN-DEPTH:
#
# The rule fires at PR time, regardless of which version of the Confluent
# S3 sink plugin will be deployed at runtime. The static analysis sees the
# .properties file content directly and doesn't depend on the plugin's
# runtime validator behavior.
#
# HOW SUB-5MIB VALUES END UP IN PRODUCTION:
#
# (a) **MinIO local-dev leak.** Developer set up a local MinIO container
#     for testing the S3 sink without paying for AWS S3 calls. MinIO
#     accepts sub-5MiB parts as a dev convenience (MinIO's behavior is
#     more permissive than real AWS S3 by design — it's a dev/test tool).
#     The developer set `s3.part.size = 1048576` (1 MiB) thinking "smaller
#     parts upload faster in local testing". They tested replication
#     locally — it worked against MinIO. They committed the .properties
#     to git. The deployment pipeline picked up the same file for
#     production; the production AWS S3 endpoint rejected every UploadPart
#     with EntityTooSmall; the connector failed; the team was paged.
#     This is THIS FIXTURE.
#
# (b) **Confusion with HDFS block size.** Operator confused `s3.part.size`
#     (S3 multipart upload part size) with HDFS `dfs.blocksize` (HDFS
#     block size, typically 128 MiB). The intuition "smaller blocks =
#     better" is wrong even for HDFS, but the intuition leaks; they set
#     `s3.part.size = 1048576` thinking it would "improve performance".
#
# (c) **"Reduce part size for faster uploads" misconception.** Operator
#     read that "smaller parts upload faster" (which IS true for parallel
#     uploads with high latency, up to a point) and reduced `s3.part.size`
#     without checking the AWS 5 MiB minimum.
#
# (d) **"Reduce S3 storage cost" misconception.** Operator tried to
#     "reduce S3 storage cost" by making parts smaller, not realizing
#     S3 storage cost is per-object-byte (not per-part). They set
#     `s3.part.size = 2097152` (2 MiB) and broke every flush.
#
# (e) **Helm-chart default set by someone who misread the docs.** Org's
#     Helm chart for S3 sinks defaulted `s3PartSize: 1048576` (1 MiB)
#     because the author misread the docs (perhaps confused MiB with KB).
#     The first production deployment of the chart picked up the broken
#     default; every flush failed.
#
# (f) **Tutorial typo.** A blog post about "optimizing S3 sink throughput"
#     showed `s3.part.size = 5000000` (5 million bytes = 4.77 MiB — just
#     under the 5 MiB = 5_242_880 bytes minimum) without noting that the
#     author probably typoed (perhaps meant 5_242_880 or 50_000_000).
#     Readers copy the value verbatim into their production .properties.
#
# THE FIX:
#
# Replace `s3.part.size = 1048576` with a value >= 5_242_880 (5 MiB):
#
#   s3.part.size = 26214400      # 25 MiB (the Confluent default — recommended)
#
# OR (equivalently) just remove the explicit `s3.part.size` key entirely so
# the ConfigDef default of 26_214_400 (25 MiB) applies.
#
# Recommended production values:
#
#   - 26_214_400 (25 MiB) — Confluent default; balances multipart overhead
#     against worker memory footprint.
#   - 52_428_800 (50 MiB) — larger objects (fewer parts per object), suited
#     for high-throughput workloads with plenty of worker heap.
#   - 5_242_880 (5 MiB) — the legal minimum; appropriate only for
#     memory-constrained workers replicating low-throughput topics.
#
# =============================================================================

name=customer-events-s3-sink
connector.class=io.confluent.connect.s3.S3SinkConnector
tasks.max=4
topics=customer.events

s3.bucket.name=my-prod-customer-events-bucket
s3.region=us-east-1

# VIOLATION: s3.part.size = 1048576 (1 MiB) — BELOW the AWS S3 multipart
# upload minimum of 5_242_880 bytes (5 MiB). Every UploadPart request
# (except the final part of each flush) will be rejected by AWS S3 with
# HTTP 400 EntityTooSmall. The connector will fail on every flush against
# real AWS S3. The value was originally chosen for a local MinIO test
# environment (MinIO accepts sub-5MiB parts as a dev convenience); the
# value was never updated for the production AWS S3 deployment.
# Fix: set s3.part.size to a value >= 5_242_880 (typically 26_214_400 =
# 25 MiB, the Confluent default), or remove the explicit key.
s3.part.size=1048576

format.class=io.confluent.connect.s3.format.json.JsonFormat
storage.class=io.confluent.connect.s3.storage.S3Storage

flush.size=1000
rotate.interval.ms=300000

partitioner.class=io.confluent.connect.storage.partitioner.DefaultPartitioner

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false
