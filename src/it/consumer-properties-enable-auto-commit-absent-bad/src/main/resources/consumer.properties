# RULE: CONSUMER_PROPERTIES_ENABLE_AUTO_COMMIT_ABSENT.
#
# Silent at-most-once-with-data-loss. The consumer config below is
# otherwise reasonable: it has serializers, group.id, auto.offset.reset
# pointing to `earliest` (so the operator clearly cares about historical
# data). But it never sets `enable.auto.commit`. kafka-clients defaults
# `enable.auto.commit` to `true`, which schedules offset commits on a
# fixed 5-second timer (auto.commit.interval.ms) REGARDLESS of whether
# the application has actually finished processing the records.
#
# The implication: when the application crashes between `poll()`
# returning records and the application finishing them — or when a
# rebalance reassigns the partition mid-batch — the auto-commit may
# have ALREADY committed offsets PAST the unfinished records. On
# restart, those unfinished records are SILENTLY SKIPPED.
#
# Recovery is impossible without external tooling because the offsets
# are already in `__consumer_offsets` and the consumer has no way of
# knowing which records were 'not actually processed'.
#
# CONCRETE FAILURE SHAPES:
#
# (1) ETL pipeline silently dropping records on crash.
#     Daily ETL consumer reads from Kafka, transforms, writes to S3.
#     The transform step throws NPE on a malformed record. Container
#     restarts; consumer resumes from auto-committed offset (which
#     was past the failed record). The failed record and any records
#     buffered after it in the same poll batch are skipped. Next
#     day's report shows 12 records missing; no error in logs;
#     root cause is the auto-commit timing.
#
# (2) Event-driven service missing crash-window events.
#     Order-processing microservice consumes order-placed events,
#     persists each to DB. Service OOMs; container restarts; the
#     50 records polled in the last 5s window but never persisted
#     are silently skipped. Orders are 'placed' (per the upstream
#     event log) but never appear in the system.
#
# (3) Rebalance during processing skips records.
#     Consumer group autoscales: new instance joins, partitions
#     rebalance. Mid-batch on partitions reassigned away, the
#     auto-commit committed past unfinished records. New owner
#     resumes from committed offset; unfinished records skipped.
#     Intermittent — fires only during rebalances under load.
#
# (4) Sync acknowledgment pattern broken by auto-commit.
#     Operator writes a consumer that explicitly calls commitSync()
#     after processing, INTENDING at-least-once. But they left
#     `enable.auto.commit` absent (defaults to `true`). The
#     auto-commit fires between manual commits, sometimes committing
#     offsets the application hasn't actually processed. The
#     explicit commitSync() calls are correct but the auto-commits
#     silently override the application's intent during the gaps.
#
# WARNING severity (not ERROR/INFO) because the default is workload-
# dependent: silently right for fire-and-forget consumers (live
# dashboards, health probes, metrics) where missed records are
# immaterial, silently catastrophic for at-least-once consumers
# (analytics, ETL, event-driven). The plugin cannot determine intent
# from absence alone. Raised here to ERROR by config override so the
# IT fixture demonstrates the violation deterministically.
#
# Fix: ONE LINE. `enable.auto.commit=false` for at-least-once (and
# call commitSync()/commitAsync() from the application after
# processing), or `enable.auto.commit=true` EXPLICITLY to document
# that auto-commit was deliberately chosen.
bootstrap.servers=kafka-1.prod.example.com:9092
group.id=orders-etl
client.id=bad-no-enable-auto-commit-consumer
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
auto.offset.reset=earliest
max.poll.records=500
