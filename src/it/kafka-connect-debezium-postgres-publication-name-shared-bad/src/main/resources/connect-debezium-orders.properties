name=orders-cdc
connector.class=io.debezium.connector.postgresql.PostgresConnector
tasks.max=1

database.hostname=orders-pg.internal
database.port=5432
database.user=debezium
database.password=changeme
database.dbname=orders

topic.prefix=cdc.orders

slot.name=debezium_orders
plugin.name=pgoutput

# Anti-pattern: this connector and the inventory connector in this
# project both set publication.name=dbz_shared_pub. With
# publication.autocreate.mode=filtered, each connector REPLACES the
# publication's table list on every startup (LAST connector wins); the
# OTHER connector's filter is silently overwritten and that connector
# stops receiving events for its own tables. The missed events are GONE
# (never decoded, never reach the WAL retention window), not deferred.
# Discovery typically happens days later when a downstream consumer
# notices its topic has gone dry. The fix: give each Postgres connector
# a unique publication.name (publication.name=dbz_publication_orders /
# publication.name=dbz_publication_inventory). See sibling rule
# CONNECT_DEBEZIUM_POSTGRES_SLOT_NAME_SHARED for the analogous
# uniqueness requirement on replication slot names.
publication.name=dbz_shared_pub
publication.autocreate.mode=filtered

table.include.list=public.orders,public.order_items

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false

snapshot.mode=initial
