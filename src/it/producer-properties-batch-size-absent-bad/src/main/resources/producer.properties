# RULE: PRODUCER_PROPERTIES_BATCH_SIZE_ABSENT.
#
# This producer config is otherwise tuned for throughput:
#   - acks=all                         (durability)
#   - enable.idempotence=true          (no duplicates on retry)
#   - compression.type=zstd            (compressed batches)
#   - linger.ms=50                     (50 ms batching window — generous)
#
# ...but it never sets `batch.size`. kafka-clients defaults `batch.size`
# to `16384` (16 KiB), which is conservative.
#
# Why this matters HERE specifically: this config sets `linger.ms=50`,
# meaning the operator EXPLICITLY chose to spend 50 ms of latency to
# accumulate larger batches. But the batch.size cap of 16 KiB will be hit
# long before the 50 ms linger expires for any non-trivial throughput —
# meaning the 50 ms linger is WASTED. The batches still ship small. The
# operator paid the latency cost but didn't get the throughput benefit.
#
# Concrete cost:
#   - At 50k records/sec × 1 KB records = 50 MB/sec of producer input.
#   - 16 KiB / 50 MB/sec = 0.3 ms to fill batch.size.
#   - So every batch ships after 0.3 ms even though linger.ms=50.
#   - 16 KiB / 1 KB/record = ~16 records per batch.
#   - With batch.size=131072 (128 KiB), batches would ship after ~2.5 ms.
#   - With batch.size=131072, batches would hold ~128 records.
#   - 8× more records per batch = 8× lower per-record protocol overhead.
#
# INFO severity (not WARNING/ERROR) because the default value (16 KiB) is
# defensible for low-throughput producers. The rule is a 'have you thought
# about this knob?' nudge, raised here to ERROR by config override so the
# IT fixture demonstrates the violation deterministically.
#
# Fix: ONE LINE. Add `batch.size=131072` (or whatever value the operator's
# throughput measurements suggest), or `batch.size=16384` EXPLICITLY to
# document that the default was deliberately chosen.
bootstrap.servers=kafka-1.prod.example.com:9092
client.id=bad-no-batch-size-producer
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=org.apache.kafka.common.serialization.StringSerializer
acks=all
enable.idempotence=true
compression.type=zstd
linger.ms=50
buffer.memory=33554432
