# Silent: Spring family using the PASS-THROUGH key:
# spring.kafka.consumer.properties.isolation.level
# This is the escape hatch for any kafka-clients config that does not
# have a first-class Spring Boot property — anything under the
# "spring.kafka.consumer.properties." prefix is forwarded verbatim
# to the underlying KafkaConsumer config map.
# The rule treats this as equivalent to the first-class
# spring.kafka.consumer.isolation-level key.

spring.kafka.bootstrap-servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
spring.kafka.consumer.client-id=good-spring-properties-key
spring.kafka.consumer.group-id=orders-processor
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.properties.isolation.level=read_committed
