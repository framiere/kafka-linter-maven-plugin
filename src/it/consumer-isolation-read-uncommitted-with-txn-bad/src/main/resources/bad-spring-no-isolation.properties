# RULE: CONSUMER_ISOLATION_READ_UNCOMMITTED_WITH_TXN — Spring family.
#
# Spring Boot exposes the consumer group id as
# spring.kafka.consumer.group-id and the isolation level under either
# spring.kafka.consumer.isolation-level OR
# spring.kafka.properties.isolation.level.
#
# This file has the Spring group-id (it counts as a consumer config)
# but neither isolation-level key is set, so the rule fires.

spring.kafka.bootstrap-servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
spring.kafka.consumer.client-id=bad-spring-no-isolation
spring.kafka.consumer.group-id=orders-processor
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# spring.kafka.consumer.isolation-level NOT SET
# spring.kafka.properties.isolation.level NOT SET -> rule fires
