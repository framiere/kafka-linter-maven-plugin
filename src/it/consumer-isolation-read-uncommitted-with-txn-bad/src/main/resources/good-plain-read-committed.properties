# Silent: plain consumer config with isolation.level=read_committed.
# In the presence of the transactional producer this is the correct
# pairing — the consumer skips records from aborted transactions and
# only sees data after the COMMIT control record. This is EOS
# (exactly-once semantics) end-to-end.

bootstrap.servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
client.id=good-plain-read-committed
group.id=orders-processor
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
isolation.level=read_committed
