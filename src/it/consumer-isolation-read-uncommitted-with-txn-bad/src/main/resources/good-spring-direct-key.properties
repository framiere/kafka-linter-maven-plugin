# Silent: Spring family using the FIRST CLASS isolation-level key:
# spring.kafka.consumer.isolation-level
# This is Spring's purpose-built typed surface for the consumer
# isolation level — equivalent to setting isolation.level
# at the Kafka client layer.

spring.kafka.bootstrap-servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
spring.kafka.consumer.client-id=good-spring-direct-key
spring.kafka.consumer.group-id=orders-processor
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.isolation-level=read_committed
