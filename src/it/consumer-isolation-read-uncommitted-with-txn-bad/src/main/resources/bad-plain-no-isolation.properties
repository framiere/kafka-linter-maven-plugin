# RULE: CONSUMER_ISOLATION_READ_UNCOMMITTED_WITH_TXN.
#
# Why this fires:
# Two facts are simultaneously true in this project:
#   1. producer-transactional.properties (sibling file) sets
#      transactional.id, which means the producer side commits in
#      transactions and writes COMMIT/ABORT control batches into the
#      topic log.
#   2. THIS consumer file has group.id (it IS a consumer config) but
#      does NOT set isolation.level=read_committed. The Kafka broker
#      default for isolation.level is read_uncommitted, which means
#      the consumer reads every record in offset order including:
#        - records from committed transactions (correct),
#        - records from aborted transactions (WRONG — they were
#          written, then rolled back; reading them is reading data
#          that the producer explicitly said "pretend this never
#          happened"),
#        - records from in-flight transactions that haven't committed
#          yet (WRONG — reading drafts).
#
# Real-world failure mode:
# An aborted transaction looks identical to a committed one on disk
# until the COMMIT/ABORT control record lands. A read_uncommitted
# consumer that pulls a batch of records, processes them (e.g.
# debits a customer's balance), and commits its offsets — then sees
# the producer's ABORT — has already irreversibly applied the
# rolled-back records. The producer "rolled back", the consumer
# "applied". This is the EOS violation EOS was supposed to fix.
#
# Why both keys are needed: the rule needs to be conservative —
# without the transactional producer present, isolation.level
# defaulting to read_uncommitted is fine (nobody is writing control
# batches anyway). The rule fires only on the cross-product.

bootstrap.servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
client.id=bad-plain-no-isolation
group.id=orders-processor
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
# isolation.level NOT SET -> defaults to read_uncommitted -> rule fires
