# RULE: CONSUMER_ISOLATION_READ_UNCOMMITTED_WITH_TXN — explicit
# isolation.level=read_uncommitted variant.
#
# The rule fires both when isolation.level is absent (defaults to
# read_uncommitted) AND when it is explicitly set to anything other
# than read_committed. The check is "does isolation.level equal
# read_committed?", not "is isolation.level present?". An explicit
# read_uncommitted is the same data hazard as the implicit one —
# arguably worse, because it shows intent to opt OUT of EOS.

bootstrap.servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
client.id=bad-plain-explicit-uncommitted
group.id=orders-processor
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
isolation.level=read_uncommitted
