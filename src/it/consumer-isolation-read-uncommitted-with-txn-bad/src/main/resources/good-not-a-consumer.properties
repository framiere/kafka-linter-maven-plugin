# Silent: this is not a consumer config (no group.id, no
# spring.kafka.consumer.group-id), so it is excluded from the
# isolation-level audit. The rule's first gate is "is this file a
# consumer config?" — if there's no group.id, we don't even reach
# the isolation.level check. This is what keeps the rule from
# firing on producer-only files, schema-registry-only files,
# adminclient-only files, etc.

bootstrap.servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
client.id=good-not-a-consumer
acks=all
enable.idempotence=true
compression.type=zstd
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=org.apache.kafka.common.serialization.StringSerializer
