# Producer file that ESTABLISHES the transactional context for the
# whole project. The presence of transactional.id is the signal the
# rule keys on — once at least one properties file in the project
# sets transactional.id (plain) OR
# spring.kafka.producer.transaction-id-prefix (Spring), every
# consumer file in the same project gets audited for isolation.level.
#
# Why this is binary instead of file-pair-matching:
# A real project rarely keeps the producer-side and consumer-side
# configs in a way that the linter can correlate file-to-file (one
# microservice, one consumer-config file, a separate ops repo for
# the producer). What it CAN do is "there exists a transactional
# producer anywhere in this codebase, therefore consumers that read
# this output topic MUST be read_committed".
#
# This is conservative — false positives only happen if a project
# defines a transactional producer for ONE topic and a non-EOS
# consumer for an UNRELATED topic. In practice that's rare in a
# single repository, and the cost of the false positive (set
# isolation.level=read_committed) is one config key. The cost of
# missing the bug is a consumer seeing aborted-transaction records
# as legitimate data and double-billing the user.

bootstrap.servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
client.id=orders-producer
acks=all
enable.idempotence=true
transactional.id=orders-producer-tx
compression.type=zstd
