name=jdbc-sink-orders
connector.class=io.confluent.connect.jdbc.JdbcSinkConnector
tasks.max=2

topics=orders.events.created,orders.events.updated

connection.url=jdbc:postgresql://orders-db:5432/orders_replica
connection.user=connect_writer
connection.password=changeme

insert.mode=upsert
pk.mode=record_key
pk.fields=order_id
auto.create=false
auto.evolve=false

# Anti-pattern: sink consumer set to LATEST. On first deploy of this sink
# (or any restart with no committed offsets — renamed connector,
# deleted-and-recreated, Connect 3.6+ DELETE /connectors/<name>/offsets),
# the consumer starts at the END of the topic and SILENTLY SKIPS every
# existing order event. The orders_replica database stays empty until
# brand-new orders arrive after the deploy. Engineers chase networking,
# IAM, schema-registry, JDBC driver issues for hours before noticing
# `kafka-consumer-groups.sh --describe` shows the consumer parked at
# the LATEST offset for every partition.
consumer.override.auto.offset.reset=latest

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
