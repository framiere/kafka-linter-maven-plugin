name=debezium-payments
connector.class=io.debezium.connector.postgresql.PostgresConnector
tasks.max=1

database.hostname=payments-db.internal
database.port=5432
database.user=debezium
database.password=changeme
database.dbname=payments

topic.prefix=cdc.payments
slot.name=debezium_payments
schema.history.internal.kafka.topic=cdc.payments.schema-history
schema.history.internal.kafka.bootstrap.servers=kafka:9092

table.include.list=public.transactions,public.refunds

snapshot.mode=initial

# Anti-pattern: slot.drop.on.stop=true tells Debezium to DROP the Postgres
# logical-replication slot on graceful connector stop. Postgres then purges
# the WAL segments the slot was retaining. When the connector restarts (worker
# upgrade, pod migration, DELETE+POST reconfiguration, blue-green deploy), it
# creates a FRESH slot at the CURRENT WAL position — silently skipping every
# change event that occurred during the stop/restart window. Operator copied
# this snippet from a development tutorial; every routine restart now causes
# silent data loss in production.
slot.drop.on.stop=true

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
