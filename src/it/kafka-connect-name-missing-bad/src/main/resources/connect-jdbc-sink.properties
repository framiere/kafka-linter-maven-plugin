# Anti-pattern: copy-pasted connector body from a tutorial — the surrounding
# 'name=...' registration line was not included. Standalone Connect (and most
# .properties-driven Connect tooling) will reject this with ConfigException:
# Missing required configuration "name" which has no default value.
# The connector cannot register; the worker logs the failure; no records are
# consumed. The deploy pipeline rolls back.
connector.class=io.confluent.connect.jdbc.JdbcSinkConnector
tasks.max=2

topics=customer-events

connection.url=jdbc:postgresql://db.internal:5432/crm
connection.user=connect
connection.password=secret
insert.mode=upsert
pk.mode=record_key
pk.fields=customer_id
auto.create=true

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false
