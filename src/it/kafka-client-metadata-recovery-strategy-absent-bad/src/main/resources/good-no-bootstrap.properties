# Silent: no `bootstrap.servers` (plain) and no
# `spring.kafka.bootstrap-servers` (Spring) — the rule's gate is
# "is this a Kafka client config?", determined by the presence of
# a bootstrap key. Without one, the file isn't a client config and
# the recovery knob is irrelevant.
#
# This shape appears in real projects as schema-registry-only
# configs, admin-tooling configs, or partial overlay configs that
# expect to be merged with another file at runtime.

schema.registry.url=https://schema-registry.example.com:8081
schema.registry.ssl.protocol=TLSv1.3
basic.auth.credentials.source=USER_INFO
basic.auth.user.info=sr-user:${SR_USER_INFO_PASSWORD}
