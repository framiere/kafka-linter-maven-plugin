# =============================================================================
# IT fixture: KAFKA_CLIENT_METADATA_RECOVERY_STRATEGY_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A consumer .properties file destined for a long-running
#   `KafkaConsumer<String, String>` running inside a Java
#   daemon process. The consumer is `order-events-consumer` —
#   it consumes from the `orders` topic (24 partitions,
#   replication-factor=3) for an e-commerce order-fulfilment
#   pipeline.
#
#   Deployment shape: Kubernetes. Specifically:
#     - 16-replica `Deployment` on an EKS cluster (us-east-1,
#       eks-1.30 with Cilium CNI).
#     - Brokers are a Strimzi-managed Kafka cluster (3 brokers,
#       deployed as a StatefulSet, exposed via the Strimzi
#       `bootstrap` Service of type ClusterIP).
#     - The Strimzi operator reconciles broker config changes
#       (broker config tweaks, broker pod restarts, broker pod
#       rescheduling on node eviction, broker pod recreation
#       after node-drain) via rolling restart. Each restart
#       rotates the broker pod's IP — K8s ClusterIP is stable
#       on the Service, but the pod IPs behind the Service
#       endpoint slice change every time a pod is recreated.
#     - This consumer connects to brokers via the
#       `bootstrap.servers=kafka-bootstrap.kafka.svc.cluster.
#       local:9092` ClusterIP Service. The Service is stable;
#       the broker endpoint IPs behind it are NOT.
#
#   The consumer is long-running (JVM uptime: weeks between
#   deploys; the application team treats consumer processes as
#   "set-and-forget" workers and only redeploys for code
#   changes — not for broker churn).
#
#   Every other consumer-hardening knob is set correctly —
#   `group.id`, `key.deserializer`, `value.deserializer`,
#   `auto.offset.reset=earliest`, `enable.auto.commit=false`
#   (manual commits via `consumer.commitSync()`), `isolation.
#   level=read_committed`, `client.rack=us-east-1a` for fetch
#   locality, `max.poll.records=500`, `session.timeout.ms=
#   45000`, `heartbeat.interval.ms=3000`, `max.poll.interval.
#   ms=300000`, `request.timeout.ms=30000`, etc.
#
#   The ONLY missing knob is `metadata.recovery.strategy`.
#
# What's wrong
#   `metadata.recovery.strategy` is a Kafka client knob that
#   controls how the client recovers when ALL brokers in its
#   cached metadata become unreachable. Per KIP-899 (Apache
#   Kafka 3.7, March 2024 — i.e., the version of `kafka-
#   clients` this app links against), the knob defaults to
#   `none` for backward compatibility.
#
#   `metadata.recovery.strategy=none` (the default) means:
#     - Client startup: resolves `bootstrap.servers` ONCE via
#       DNS, caches the resulting IP addresses in its internal
#       `Metadata` object.
#     - Subsequent operation: when a connection to a broker
#       fails, the client switches to a different broker from
#       the cached metadata.
#     - When ALL brokers in the cached metadata become
#       unreachable: the client KEEPS RETRYING the cached IPs
#       INDEFINITELY. It NEVER re-resolves `bootstrap.servers`
#       via DNS. It is stuck on stale IPs until it is
#       manually restarted.
#
#   In a Kubernetes deployment — where broker pod IPs rotate
#   on restart, scaling, node-eviction, or rolling upgrades —
#   this is a stuck-client-on-restart trap. When broker pods
#   recycle, the cached IPs become stale, every connection
#   attempt times out with `Bootstrap broker <stale-ip>:9092
#   (id: -1 rack: null) disconnected`, and the client stays
#   stuck.
#
# The six bug shapes this rule catches
#   (1) Kubernetes rolling broker upgrade. The broker
#       StatefulSet pods rotate one at a time during a rolling
#       upgrade (broker config tweak, Kafka version bump,
#       Strimzi operator upgrade). Each broker pod gets a new
#       IP when recreated. Once all three brokers have rolled,
#       every cached IP this consumer has is stale. The
#       consumer's existing TCP connections die, the consumer
#       tries the cached IPs, every connection attempt fails
#       with `disconnected`, and the consumer is STUCK — for
#       hours, days, until ops notices and manually restarts
#       the consumer pods. With `metadata.recovery.strategy=
#       rebootstrap`, when all cached IPs fail, the client re-
#       resolves `bootstrap.servers` via DNS (fresh K8s DNS
#       lookup against the kafka-bootstrap Service), gets the
#       current IPs from the endpoint slice, and reconnects
#       within seconds.
#
#   (2) AWS Availability-Zone eviction event. AWS evicts the
#       EC2 node hosting one of the Strimzi broker pods (AZ
#       failure, spot-instance reclamation, or planned AZ
#       maintenance). K8s recreates the broker pod in another
#       AZ — same broker.id, same Strimzi PVC, but a brand-new
#       pod IP. The consumer's cached IP for that broker is
#       now stale. If the AZ event chains (which is common
#       during real AZ failures: AWS evicts multiple nodes
#       across the affected AZ in quick succession), all three
#       broker pod IPs rotate within minutes. Consumer
#       without rebootstrap: stuck. Consumer WITH rebootstrap:
#       reconnects via fresh DNS lookup.
#
#   (3) Helm cluster recreate. Operator does `helm uninstall
#       strimzi-kafka && helm install strimzi-kafka` (typical
#       during major Strimzi upgrades, namespace migrations,
#       or PVC re-provisioning). Every broker pod is destroyed
#       and recreated with a new IP. Every existing consumer
#       is now stuck on the old IPs. The K8s ClusterIP Service
#       is also recreated, but DNS still resolves the new
#       endpoint slice correctly — so `rebootstrap` would
#       reconnect. Without rebootstrap, every consumer
#       requires a manual restart.
#
#   (4) Kubernetes Service endpoint-slice churn under Cilium.
#       Cilium uses endpoint slices to map ClusterIPs to pod
#       IPs. Under some networking configurations (Cilium
#       endpoint-slice rotation, Cilium upgrade, Cilium pod
#       restart on the node hosting the kube-proxy
#       replacement), endpoint slices can churn even without
#       broker pod IP rotation. The DNS resolution still
#       works; the cached IPs may NOT. `rebootstrap` re-resolves
#       and gets the current correct mapping.
#
#   (5) Strimzi operator config-change reconciliation. The
#       Strimzi operator triggers chained broker restarts when
#       reconciling a `Kafka` CR config change (broker-side
#       knob update, broker version bump, listener TLS cert
#       rotation, broker storage class change). Reconciliation
#       restarts brokers in a rolling fashion — but if the
#       reconciliation is interrupted and re-triggered (common
#       during operator upgrades or CR re-applies), brokers
#       can restart in rapid succession. Consumers without
#       rebootstrap survive a single broker restart (the
#       cached IPs for the OTHER brokers still work) but fail
#       under chained restarts where every cached IP becomes
#       stale before the next broker comes up.
#
#   (6) Spring Boot autoconfig default-leak. This file is a
#       plain consumer.properties (not Spring Boot), but in
#       Spring Boot apps the issue is worse: `KafkaAutoConfig
#       uration` does NOT set `metadata.recovery.strategy`
#       anywhere. Every Spring Boot Kafka app on the planet
#       inherits the `none` default unless the operator
#       explicitly sets `spring.kafka.properties.metadata.
#       recovery.strategy=rebootstrap`. This is THE default-
#       leak pattern: a sensitive knob with a backward-compat
#       default that is wrong for the modern deployment shape,
#       and a framework autoconfiguration that doesn't
#       intervene.
#
# Why INFO and not WARNING
#   The knob requires Apache Kafka client 3.7+ (March 2024).
#   Older clients silently ignore unknown configs, so adding
#   the knob is forward-compatible but not effective until
#   the client is upgraded. Additionally, stable-IP
#   deployments (bare-metal Kafka, VMs with fixed broker IPs,
#   deployments behind a hardware load balancer that
#   transparently handles IP rotation) work fine with the
#   default `none`, and `rebootstrap` would add startup-DNS-
#   flap risk during transient DNS failures (the client
#   would re-resolve aggressively and potentially fail to
#   bootstrap on a flapping DNS service). The rule prompts
#   the operator to make the K8s-vs-VM choice explicit, but
#   does not assume the worst — hence INFO.
#
#   This IT fixture's pom.xml overrides the severity to ERROR
#   so that `mvn verify` fails on this bad configuration,
#   demonstrating the rule fires correctly.
#
# Fix
#   For K8s deployments: `metadata.recovery.strategy=
#   rebootstrap`. For Spring Boot: `spring.kafka.properties.
#   metadata.recovery.strategy=rebootstrap`. For stable-IP
#   non-K8s deployments: set the key explicitly to `none`
#   with a comment documenting the stable-IP rationale — the
#   explicit value disables this rule's trigger.
# =============================================================================

# Consumer identity + cluster connectivity.
client.id=order-events-consumer
group.id=order-events-consumer-group
bootstrap.servers=kafka-bootstrap.kafka.svc.cluster.local:9092

# Deserializers.
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Offset & commit posture — earliest reset with manual commits.
auto.offset.reset=earliest
enable.auto.commit=false

# Transactional read-isolation — only consume committed records.
isolation.level=read_committed

# Group-membership + heartbeating tuned for K8s pod lifecycle.
session.timeout.ms=45000
heartbeat.interval.ms=3000
max.poll.interval.ms=300000

# Poll-budget bounded to keep the processing loop predictable.
max.poll.records=500

# Request-level timeout.
request.timeout.ms=30000

# Rack-aware fetch — pin to the consumer's AZ for fetch
# locality (sibling rule KAFKA_CLIENT_RACK_PLACEHOLDER is the
# rack-aware-fetch sibling — both are K8s-deployment-hygiene
# rules).
client.rack=us-east-1a

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# MISSING:
#   metadata.recovery.strategy=rebootstrap
# Without this key, Apache Kafka clients 3.7+ default
# `metadata.recovery.strategy` to `none` (KIP-899). The client
# resolves `bootstrap.servers` ONCE at startup, caches the
# resulting IP addresses in its internal `Metadata` object,
# and NEVER re-resolves via DNS — even when ALL brokers in
# the cached metadata become unreachable. For this consumer
# — a 16-replica K8s deployment connecting to a Strimzi
# Kafka cluster whose broker pod IPs rotate on rolling
# upgrade, AZ eviction, helm recreate, Cilium endpoint-slice
# churn, or Strimzi operator reconciliation — the default is
# a stuck-client-on-restart trap. Setting `metadata.recovery.
# strategy=rebootstrap` enables KIP-899's recovery mode: when
# all cached broker connections fail, the client re-resolves
# `bootstrap.servers` via DNS (fresh K8s DNS lookup against
# the kafka-bootstrap Service) and rebuilds metadata from the
# newly-resolved IPs.
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
