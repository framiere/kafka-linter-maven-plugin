# Silent: Kafka Connect connector config — excluded by the rule.
#
# The rule short-circuits on the presence of `connector.class`. Connect
# connector configs are an entirely different shape — they describe a
# task to a Connect worker, not a long-lived kafka-clients producer or
# consumer that the application owns. The worker itself owns the
# bootstrap connection and applies recovery semantics to it via the
# worker config (`bootstrap.servers` + `metadata.recovery.strategy` at
# the worker level), not via the connector config.
#
# Including `bootstrap.servers` inside a connector config is unusual
# but not invalid (some connector implementations read it as part of
# their own client construction — e.g., self-contained connectors that
# build their own producer to a different target cluster). The rule
# stays silent here to avoid false positives on the worker-vs-connector
# config-shape ambiguity.
#
# This is the connector-config escape hatch — the `connector.class`
# key is the discriminator.

name=mirror-source-orders
connector.class=org.apache.kafka.connect.mirror.MirrorSourceConnector
tasks.max=1
topics=orders
source.cluster.alias=source
target.cluster.alias=target
source.cluster.bootstrap.servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
target.cluster.bootstrap.servers=kafka-target-1:9092,kafka-target-2:9092
bootstrap.servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
