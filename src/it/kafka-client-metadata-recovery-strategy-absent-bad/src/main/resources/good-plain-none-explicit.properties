# Silent: plain kafka-clients config with the recovery knob set
# EXPLICITLY to `none`.
#
# This is the stable-IP escape hatch. The rule fires on ABSENCE
# (default-leak), not on the value `none`. An explicit `none` is the
# operator declaring: "I know about KIP-899, I've considered it, my
# deployment has stable bootstrap IPs (bare-metal, fixed-IP VMs, or
# a load balancer that handles IP rotation transparently in front of
# the brokers), and `rebootstrap` would just add startup-DNS-flap
# risk during transient DNS failures."
#
# This matters because for stable-IP deployments, `rebootstrap` has
# a real downside: a transient DNS hiccup that loses all current
# broker connections briefly would cause an unnecessary metadata
# rebuild and reconnect storm, instead of letting the in-flight
# retries drain naturally on the existing connections.
#
# The rule's job is to force the operator to make this choice
# EXPLICITLY rather than inheriting `none` by default.

bootstrap.servers=broker.fixed.example.com:9092
client.id=good-plain-none-explicit
group.id=orders-processor
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
metadata.recovery.strategy=none
