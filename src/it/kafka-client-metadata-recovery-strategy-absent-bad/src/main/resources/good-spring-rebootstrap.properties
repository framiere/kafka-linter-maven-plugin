# Silent: Spring Boot family with the recovery knob set to
# `rebootstrap` via the pass-through prefix.
#
# Spring Boot's KafkaAutoConfiguration does NOT have a first-class
# property for `metadata.recovery.strategy`, so operators must use
# the pass-through prefix `spring.kafka.properties.*` — anything
# under that prefix is forwarded verbatim to the underlying
# kafka-clients config map when Spring constructs the
# KafkaConsumer / KafkaProducer.
#
# This is functionally equivalent to setting
# `metadata.recovery.strategy=rebootstrap` in a plain kafka-clients
# properties file.

spring.kafka.bootstrap-servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
spring.kafka.consumer.client-id=good-spring-rebootstrap
spring.kafka.consumer.group-id=orders-processor
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.properties.metadata.recovery.strategy=rebootstrap
