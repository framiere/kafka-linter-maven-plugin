# RULE: KAFKA_CLIENT_METADATA_RECOVERY_STRATEGY_ABSENT — Spring Boot family.
#
# The rule treats the Spring Boot family and the plain kafka-clients
# family as TWO INDEPENDENT GATES on the same file:
#
#   - Plain gate fires when `bootstrap.servers` is present and
#     `metadata.recovery.strategy` is absent.
#   - Spring gate fires when `spring.kafka.bootstrap-servers` is present
#     and `spring.kafka.properties.metadata.recovery.strategy` is absent.
#
# A single .properties file is allowed to mix both families (some teams
# stage Spring Boot apps that override individual kafka-clients knobs
# under `spring.kafka.properties.*`), so each family's recovery key is
# checked against the bootstrap key of the SAME family.
#
# This file exercises the Spring Boot gate ONLY: it sets
# `spring.kafka.bootstrap-servers` (the Spring Boot relocator key —
# Spring rewrites this to `bootstrap.servers` when it constructs the
# underlying KafkaConsumer/KafkaProducer) but never sets the
# Spring-prefixed recovery knob.
#
# Per KIP-899 (Apache Kafka 3.7), Spring Boot's KafkaAutoConfiguration
# does NOT set `metadata.recovery.strategy` for you — the consumer/
# producer factory inherits the kafka-clients default `none`. So a
# Spring Boot service running on Kubernetes is just as exposed to the
# stuck-client-on-broker-IP-rotation trap as a plain kafka-clients
# service.
#
# The fix the rule pushes you toward:
#   spring.kafka.properties.metadata.recovery.strategy=rebootstrap
#
# Anything under `spring.kafka.properties.*` is the pass-through escape
# hatch — Spring forwards it verbatim to the underlying client config.
# This is how Spring Boot exposes kafka-clients knobs that don't have
# a first-class Spring property.

spring.kafka.bootstrap-servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
spring.kafka.consumer.client-id=bad-spring-no-recovery
spring.kafka.consumer.group-id=orders-processor
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
