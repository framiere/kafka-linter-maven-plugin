# Silent: plain kafka-clients config with the recovery knob set to
# `rebootstrap` — the K8s-correct value.
#
# Per KIP-899, when ALL brokers in the cached metadata become
# unreachable, the client RE-RESOLVES `bootstrap.servers` via DNS
# (a fresh lookup against the K8s DNS service, not the cached IPs)
# and rebuilds metadata from the newly-resolved addresses. This is
# what makes a Kafka client survive a rolling broker upgrade, an
# AWS AZ eviction, a Helm cluster recreate, or any other event that
# rotates the broker pod IPs.
#
# This is the value the rule pushes K8s deployments toward.

bootstrap.servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
client.id=good-plain-rebootstrap
group.id=orders-processor
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
metadata.recovery.strategy=rebootstrap
