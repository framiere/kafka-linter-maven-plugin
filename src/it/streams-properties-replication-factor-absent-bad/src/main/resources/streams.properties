# RULE: STREAMS_PROPERTIES_REPLICATION_FACTOR_ABSENT.
#
# This Streams config is otherwise reasonable:
#   - application.id set                (group identity)
#   - bootstrap.servers set
#   - default serdes set
#   - processing.guarantee=exactly_once_v2 (EOS opted in)
#   - num.stream.threads=4              (parallelism declared)
#   - state.dir set to a persistent path
#
# ...but it never sets `replication.factor`. Kafka Streams
# defaults `replication.factor` to `-1`, which is documented as
# "use the broker's `default.replication.factor`".
#
# THE BUG SHAPE THIS RULE CATCHES:
#
# `replication.factor` applies to the INTERNAL TOPICS that
# Streams auto-creates:
#
#   - Changelog topics:  one per stateful operator that
#                        materializes a state store. Stores
#                        the full state-store updates so that
#                        on broker reboot or task reassign-
#                        ment, the new owner can restore the
#                        state store by replaying the change-
#                        log.
#
#   - Repartition topics: one per keyed re-grouping (selectKey
#                         + groupByKey, repartition()). Streams
#                         writes to and reads from these to
#                         move records to the correct partition
#                         owner before stateful aggregation.
#
# Default `-1` → broker decides → broker's `default.
# replication.factor` applies. In dev / sandbox / freshly-
# installed clusters that is almost always `1`. In well-run
# production clusters it's typically `3`. But:
#
#   1. The .properties file gives NO SIGNAL of which broker
#      default will be applied.
#   2. The application cannot inspect the broker config at
#      build time.
#   3. The same .properties file, deployed to dev (RF=1) and
#      prod (RF=3) clusters via Helm, will silently produce
#      different durability postures with no warning anywhere.
#
# CONCRETE FAILURE MODES:
#
# (1) Dev-to-prod broker default drift.
#     Operator builds Streams topology in dev cluster (single
#     broker, `default.replication.factor=1`). Everything
#     "just works". Promotes via the same Helm chart to a
#     staging cluster that's been recently migrated to 3
#     brokers — but `default.replication.factor` on staging
#     was never updated from 1. Streams creates its changelog
#     topics with RF=1. Six months later, one broker is
#     rebooted for an OS patch. State stores whose change-
#     log topic's leader partition was on the rebooted
#     broker cannot restore. Streams hangs in RESTORING state;
#     no records processed. Discovered as "Streams app stopped
#     consuming after the maintenance window."
#
# (2) Dynamic broker default changed by infra team.
#     SREs lower `default.replication.factor` from 3 to 1 on
#     a non-production cluster to save disk costs. Streams
#     apps that pinned `replication.factor=3` are unaffected.
#     Streams apps that left it absent silently start creating
#     new changelog topics (on first encounter of a new state
#     store) with RF=1. Single-broker death loses state
#     stores on those topics. The infra change had no
#     associated Streams alert because the Streams config
#     deferred to the broker.
#
# (3) Multi-tenant cluster with topic-default policy.
#     Cluster operator uses a topic-creation policy plugin
#     that enforces `replication.factor >= 3` on user-created
#     topics — but the policy explicitly EXCLUDES internal
#     Streams topics (assumes Streams apps will set RF
#     themselves). Operator's Streams app leaves the knob
#     absent. Changelog topics bypass the policy, get RF=1
#     via broker default. Audit finds the gap during a
#     compliance review.
#
# (4) Cross-region failover plan assumes RF=3.
#     DR plan assumes all internal Streams topics have RF >=
#     3 so a single-AZ outage doesn't kill any topic. Streams
#     config leaves `replication.factor` absent. Broker
#     default happens to be 3 in prod, so the topics ARE
#     RF=3 in practice — but the DR plan has no contract
#     with the Streams app to keep them that way. Six months
#     later, the broker team experiments with lowering the
#     default; everyone forgets about Streams.
#
# (5) Dev cluster's broker default is wrong on purpose.
#     Dev cluster intentionally has `default.replication.
#     factor=1` because dev only has one broker. Production
#     cluster has `default.replication.factor=3`. Streams
#     app without `replication.factor` set silently creates
#     internal topics with very different durability in the
#     two environments. Bug shape: "works on my machine"
#     under broker-default-derived configuration drift.
#
# WHY THIS RULE IS WARNING (NOT INFO):
#
# Most absence-rules in this family are INFO because the
# default is workload-dependent. This one is WARNING because:
#
#   - The failure mode is DATA LOSS (state store cannot
#     restore from a single-broker changelog topic), not
#     throughput.
#   - There is no defensible reason to leave a production
#     Streams app's internal topics at "broker's default"
#     for durability — it actively delegates a critical
#     durability decision to broker config that the
#     application cannot see or test.
#   - The sibling rule [[streams-replication-factor-one]]
#     catches the explicit value 1; this catches the unset/
#     -1 case where the broker may silently apply 1 anyway.
#
# Raised here to ERROR by config override so the IT fixture
# demonstrates the violation deterministically.
#
# Fix: ONE LINE.
#   - `replication.factor=3` for production.
#   - `replication.factor=1` EXPLICITLY for single-broker
#     dev/test clusters (to document the dev-only posture).
#
# The point is: PIN IT, do not delegate a critical durability
# decision to a broker config the app cannot read.
application.id=settlements-aggregator
bootstrap.servers=kafka-1.prod.example.com:9092
client.id=bad-no-replication-factor-streams
default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
default.value.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
processing.guarantee=exactly_once_v2
num.stream.threads=4
state.dir=/var/lib/settlements-aggregator/streams
