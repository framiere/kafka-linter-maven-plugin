name=orders-sink
connector.class=io.confluent.connect.jdbc.JdbcSinkConnector
tasks.max=2

topics=orders

connection.url=jdbc:postgresql://db.internal:5432/analytics
connection.user=connect
connection.password=changeme
insert.mode=upsert
pk.mode=record_key
auto.create=true

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false

# Anti-pattern: dropHeartbeats predicate is FULLY defined (type binding + name
# config) but 'dropHeartbeats' is NOT in the predicates= chain (which is absent
# here entirely — no predicates registered at all). Connect's KIP-585 predicate
# framework iterates ONLY the aliases in predicates=, silently ignoring orphan
# predicates.dropHeartbeats.* entries — no error, no warning, no ConfigException.
# Operators reading this config see a complete-looking predicate definition and
# believe heartbeat records can be filtered out by gating an SMT on it; the
# runtime never registers the predicate so no SMT can gate on it. Six months
# later a new operator adds transforms.drop.predicate=dropHeartbeats expecting
# it to work — and the task fails at startup with ConfigException ([[connect-
# predicate-reference-undefined]] would catch that case at PR time). This rule
# catches the latent orphan at PR time, before the dangling reference is added.
transforms=tagSource
transforms.tagSource.type=org.apache.kafka.connect.transforms.InsertField$Value
transforms.tagSource.static.field=source_connector
transforms.tagSource.static.value=orders-sink

predicates.dropHeartbeats.type=org.apache.kafka.connect.transforms.predicates.HasHeaderKey
predicates.dropHeartbeats.name=heartbeat
