# =============================================================================
# IT fixture: CONSUMER_PROPERTIES_GROUP_ID_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A kafka-clients consumer .properties file destined for `new KafkaConsumer<>(props)`.
#   It declares deserializers, bootstrap.servers, auto.offset.reset, enable.auto.commit,
#   session.timeout.ms, max.poll.records, fetch.min.bytes, isolation.level,
#   max.poll.interval.ms — but DOES NOT declare `group.id` anywhere.
#
# What's wrong
#   `org.apache.kafka.clients.consumer.ConsumerConfig.GROUP_ID_CONFIG` declares
#   `group.id` with `ConfigDef.Type.STRING`, default `null`, importance HIGH.
#   The kafka-clients parse step does NOT validate group.id as required — so
#   `new KafkaConsumer<>(props)` succeeds. The consumer is happily constructed,
#   connections to bootstrap.servers are opened, the network client warms up.
#
#   Then the application calls `subscribe(Set.of("orders"))`. The consumer
#   needs to enroll in a group to know which partitions to read; the group is
#   identified by `group.id`. With no group.id, the framework throws:
#
#     org.apache.kafka.common.errors.InvalidGroupIdException:
#       To use the group management or offset commit APIs, you must
#       provide a valid group.id in the consumer configuration.
#
#   Same exception fires from `commitSync()`, `commitAsync()`, and
#   `committed(partitions)`. The thread bubbles the exception up; in a typical
#   consumer loop, this kills the thread. The pod crashes; Kubernetes restarts
#   it; the next start gets through `new KafkaConsumer` and crashes at
#   `subscribe()` again — CrashLoopBackOff with a runtime exception, not a
#   config exception. Diagnosing this takes longer than the `bootstrap.servers`
#   case because the failure is at the FIRST subscribe() call, not at startup.
#
# Why this is a "WARNING" by default (not ERROR)
#   The ONLY legal usage without `group.id` is `assign(partitions)` (manual
#   partition assignment) combined with external offset storage. Example:
#   a CDC tool that picks specific partitions, stores offsets in its own DB,
#   and seeks on startup via `seek(partition, offset)`. This bypasses the
#   group coordinator entirely. For such consumers, group.id absence is RIGHT.
#
#   But that pattern is rare. The overwhelming majority of consumer
#   .properties files are destined for `subscribe()`-based consumers and need
#   `group.id`. The linter defaults to WARNING because the operator may
#   legitimately want assign(); a comment in the file (`# group.id intentionally
#   omitted — uses assign() with external offset storage`) documents the choice.
#
#   This IT overrides severity to ERROR via pom.xml configuration to force the
#   build to fail and verify the rule fires.
#
# Common bug shapes
#   (1) Partial-template copy missed the group.id line. Operator created a
#       new consumer service by copying a portion of an existing config. They
#       grabbed deserializers, bootstrap.servers, auto.offset.reset, but missed
#       group.id. Deploy 'succeeds' but the application crashes at first
#       subscribe(). Static analysis catches it at PR time.
#
#   (2) Helm-render empty value. Helm chart has `group.id: {{ .Values.consumerGroup }}`
#       and the values.yaml omits the key. The rendered .properties has
#       `group.id=` (empty). Empty is treated as 'not set' by the linter.
#
#   (3) Env-var indirection broken. Operator writes `group.id=${KAFKA_GROUP}`
#       thinking the loader resolves env-vars, but plain `Properties.load()`
#       does not. The literal string is parsed as the group.id; the consumer
#       enrolls in a group literally named `${KAFKA_GROUP}`. The linter
#       does not catch this case (the key IS set), but the kafka-consumer-groups
#       CLI shows the ridiculous group name eventually.
#
#   (4) assign()-based template reused for subscribe()-based consumer.
#       Operator inherits a legitimate assign()-based .properties (no group.id
#       on purpose) and writes a new consumer using subscribe(). subscribe()
#       throws InvalidGroupIdException at first call. Static analysis catches
#       the absent key and prompts the operator to either add group.id (for
#       subscribe) or document the assign() intent with a comment.
#
#   (5) Auto-generated assumption. Developer thinks kafka-clients auto-
#       generates a group.id (which IS true for `client.id`, but NOT for
#       `group.id`). Static analysis catches the absent key at PR time.
#
# Fix
#   Set `group.id=<service-name>-<role>`. Name groups by BUSINESS PURPOSE,
#   not technology — meaningful names show up in `__consumer_offsets` and
#   in lag dashboards. Examples:
#     group.id=payments-fraud-screening
#     group.id=orders-export-to-warehouse
#     group.id=analytics-orders-daily
#
#   For assign()-based consumers, document the choice with a comment:
#     # group.id intentionally omitted — uses assign() with external offset
#     # storage in the application's PostgreSQL state table.
# =============================================================================

bootstrap.servers=broker-1.kafka.prod.example.com:9092,broker-2.kafka.prod.example.com:9092,broker-3.kafka.prod.example.com:9092
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer

# Bootstrap-offset semantics: replay the backlog on a fresh group / fresh
# partition / expired-offset case.
auto.offset.reset=earliest

# At-least-once semantics: do not auto-commit; the application calls
# commitSync() after each successful batch.
enable.auto.commit=false

# Read-committed: skip aborted-transaction records.
isolation.level=read_committed

# Poll-loop tuning.
max.poll.records=500
max.poll.interval.ms=300000
session.timeout.ms=45000
fetch.min.bytes=1024

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# MISSING:
#   group.id=...
# At first `subscribe(...)`, `commitSync()`, `commitAsync()`, or
# `committed(...)` call, this consumer crashes with InvalidGroupIdException.
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
