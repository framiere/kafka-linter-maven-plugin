name=jdbc-sink-dual-subscribe
connector.class=io.confluent.connect.jdbc.JdbcSinkConnector
tasks.max=2

# Anti-pattern: a refactor migrated this connector from regex-based
# subscription (topics.regex=app-events-.*) to an explicit list (topics=
# below) but the regex line was left in place. At startup, Connect's
# SinkConnectorConfig throws ConfigException("Must configure one of topics
# or topics.regex"). The connector never reaches start(); status FAILED.
topics=app-events-orders,app-events-prices
topics.regex=app-events-.*

connection.url=jdbc:postgresql://db.internal:5432/analytics
connection.user=connect
connection.password=secret
insert.mode=insert
auto.create=true

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false
