# =============================================================================
# A Confluent S3 sink connector configuration where the operator set
# `flush.size = 1` (one record per flush) on a base S3SinkConnector. The
# 1-record value originated from a debugging session — the operator wanted
# to confirm that records were producing S3 objects, so they set flush.size
# to the smallest value that would create an object per record. They
# confirmed the connector was producing objects; they never reverted the
# value; the .properties was committed to git and deployed to production
# unchanged.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#
#   connector.class = io.confluent.connect.s3.S3SinkConnector
#   flush.size      = 1     # ONE record per S3 object — far below the
#                           # plugin's threshold of 100, and three orders of
#                           # magnitude below the Confluent default of 1000.
#
# WHAT `flush.size` ACTUALLY DOES:
#
# `flush.size` is the number of records the S3 sink buffers in heap before
# closing the buffer and uploading the resulting bytes as a SINGLE S3
# object. Every flush trigger produces EXACTLY ONE S3 object. So:
#
#   flush.size = 1     → one S3 object per record (THIS FIXTURE)
#   flush.size = 10    → one S3 object per 10 records
#   flush.size = 100   → one S3 object per 100 records (plugin threshold)
#   flush.size = 1000  → one S3 object per 1000 records (Confluent default)
#   flush.size = 10000 → one S3 object per 10000 records (large but defensible)
#
# Important: `flush.size` is one of THREE OR'd triggers. The other two are
# `rotate.interval.ms` (event-time based) and `rotate.schedule.interval.ms`
# (wall-clock based). Whichever fires first triggers the flush. So:
#
#   flush.size = 1000, rotate.interval.ms = unset
#     → flush exactly when 1000 records accumulate. At 100 records/sec/
#       partition that's once per 10 seconds. At 10 records/sec/partition
#       that's once per 100 seconds.
#
#   flush.size = 1000, rotate.interval.ms = 60000 (1 minute)
#     → flush when EITHER 1000 records accumulate OR 60 seconds elapsed.
#       The buffer is bounded in BOTH dimensions.
#
# THE BLAST RADIUS OF flush.size = 1:
#
# With flush.size=1, every record triggers a flush. Every flush is one
# S3 PUT. Consider a moderately-sized cluster:
#
#   500 topic-partitions × 4 tasks × 100 records/sec/partition
#     = 200_000 S3 PUTs/second sustained
#
# (a) **S3 PUT-rate per-prefix limit.** AWS S3 caps PUT requests at 3500
#     per second PER PREFIX. The connector saturates this within milli-
#     seconds, producing HTTP 503 `SlowDown` errors. The AWS SDK retries
#     with exponential backoff; the connector's heap fills with retry
#     queues; eventually the worker OOMs and all connectors on the
#     worker fail.
#
# (b) **S3 LIST cost amplification.** AWS S3 LIST is priced per 1000 keys.
#     A day of one-record-per-object output for a single connector =
#     200_000 × 86_400 = 17 BILLION objects/day. With per-partition-key
#     partitioning under this, the bucket-count multiplies. Athena/Trino
#     queries that scan the day's prefix issue LISTs that scan billions
#     of objects. The LIST cost line item dwarfs everything else on the
#     S3 bill.
#
# (c) **Downstream query-engine planner regression.** Athena, Trino,
#     Presto, BigQuery, and Spark all optimize for FEWER LARGER OBJECTS.
#     The query planner: opens each object's metadata, plans a scan,
#     reads the data. With BILLIONS of objects per day, the planner
#     does BILLIONS of metadata-only reads. Query latency rises from
#     seconds to hours. Concurrent-query throughput drops to near zero.
#     Analysts notice; data team is paged.
#
# (d) **Per-format overhead dominates.** For connectors using Parquet
#     or ORC formats, each S3 object has a fixed metadata overhead:
#     Parquet writes a footer with column-chunk metadata; ORC writes
#     a stripe-level metadata; Avro writes a schema header. With one-
#     record-per-object, the metadata bytes can EXCEED the data bytes.
#     A 100-byte record becomes a ~1KB Parquet file because of the
#     footer overhead.
#
# (e) **S3 lifecycle-rule iteration overhead.** S3 lifecycle policies
#     (delete-after-30-days, transition-to-Glacier-after-90-days)
#     iterate per-object internally. Billions of small objects
#     amplify the processing time of each lifecycle-rule evaluation;
#     the rules can take DAYS to complete each day; AWS may rate-
#     limit your account's lifecycle processing if it consistently
#     exceeds thresholds.
#
# (f) **S3 prefix hot-spotting.** With one-record-per-object, all
#     topic-partitions of a tenant simultaneously create new objects
#     every second under the SAME S3 prefix (since the time-
#     partition-key is shared across all topic-partitions). S3 PUT-
#     rate is per-PREFIX, not per-object: the prefix is saturated at
#     hundreds of thousands of PUTs/sec.
#
# WHY 100 IS THE PLUGIN'S CHOSEN THRESHOLD:
#
# The threshold is the plugin's pragmatic line between "aggressive but
# defensible" (100-999 — small dev/low-throughput case, perhaps
# acceptable but worth reviewing) and "definitely wrong" (<100 — no
# legitimate production justification).
#
# An operator who deliberately wants tiny S3 objects (a rare and almost
# certainly questionable choice) should suppress the rule with:
#
#   <CONNECT_S3_SINK_FLUSH_SIZE_TOO_SMALL>OFF</CONNECT_S3_SINK_FLUSH_SIZE_TOO_SMALL>
#
# and document the rationale in the .properties file.
#
# HOW SUB-100 VALUES END UP IN PRODUCTION:
#
# (i) **Debug mode never reverted.** During initial deployment,
#     operator sets `flush.size = 1` (or 10) to verify the connector
#     is producing S3 objects — they want to see new objects appear
#     in S3 every record so they can confirm the partitioning and
#     serialization logic works. They confirm it works; they never
#     revert the value; the deploy goes to production; S3 fills with
#     billions of tiny objects.
#
# (ii) **'Real-time data lake' misconception.** Operator wants a
#      "real-time data lake" and sets `flush.size = 1` thinking
#      smaller is better for freshness. They don't realize the S3
#      sink has SEPARATE freshness dials: `rotate.interval.ms`
#      (event-time) and `rotate.schedule.interval.ms` (wall-clock).
#      Those are the correct dials for freshness; flush.size controls
#      the per-object SIZE, not the flush FREQUENCY at a per-record
#      level.
#
# (iii) **Conflation with rotate.interval.ms.** Operator wants
#       "flushes every minute" and sets `flush.size = 60` thinking
#       that's how flush.size works. The actual semantic is "flush
#       when 60 records have accumulated" — at 1000 records/sec
#       that's every 60ms, producing ~60_000 objects per second
#       per partition-key.
#
# (iv) **Tutorial copy-paste at scale.** A Confluent S3 sink
#      tutorial uses `flush.size = 10` so the tutorial "reacts
#      quickly to new data". The tutorial cluster has 3 partitions
#      and 100 records/sec; the production cluster has 500
#      partitions and 50_000 records/sec. flush.size=10 that
#      produced one object every minute in the tutorial produces
#      millions of objects per hour in production.
#
# (v) **Helm chart with debug default leftover.** A debug Helm
#     chart values.yaml has `flushSize: 1` to support local debug-
#     mode integration tests. The chart's defaults somehow
#     propagate to production via a chart-merge mishap; flush.size=1
#     ships to a real cluster.
#
# THE FIX:
#
# Replace `flush.size = 1` with a value appropriate for the downstream
# query pattern and operational throughput:
#
#   flush.size = 1000     # Confluent default — safe starting point
#   flush.size = 10000    # large, good for downstream query planners,
#                         # but pair with rotate.interval.ms for freshness
#
# AND, if freshness matters more than throughput, ADD a time-rotation
# safety valve:
#
#   rotate.interval.ms = 300000          # 5 min event-time rotation
#   rotate.schedule.interval.ms = 60000  # 1 min wall-clock rotation
#
# Those time-rotation dials are the CORRECT way to bound flush latency
# without crippling per-object size.
#
# =============================================================================

name=customer-events-s3-sink
connector.class=io.confluent.connect.s3.S3SinkConnector
tasks.max=4
topics=customer.events

s3.bucket.name=my-prod-customer-events-bucket
s3.region=us-east-1

format.class=io.confluent.connect.s3.format.json.JsonFormat
storage.class=io.confluent.connect.s3.storage.S3Storage

# VIOLATION: flush.size = 1 (one record per flush) — FAR below the
# plugin's 100-record threshold, and three orders of magnitude below
# the Confluent default of 1000. This produces ONE S3 object per
# record per topic-partition per task. On a moderately-sized cluster
# (500 partitions × 4 tasks × 100 records/sec), the connector
# generates 200_000 S3 PUTs/second sustained — saturating S3 PUT-
# rate per-prefix limits, inflating S3 LIST cost, regressing downstream
# Athena/Trino query planners, and amplifying S3 lifecycle-rule
# iteration time. The 1-record value originated from a debugging
# session ("I want to see records flush immediately") and was never
# reverted. Fix: raise flush.size to at least 1000 (the Confluent
# default), or — if freshness matters more than throughput — pair
# the larger flush.size with `rotate.interval.ms=<event-time-ms>`
# (typically 300000=5min) or `rotate.schedule.interval.ms=<wall-clock-ms>`
# (typically 60000=1min) which bound flush latency without crippling
# per-object size.
flush.size=1

partitioner.class=io.confluent.connect.storage.partitioner.HourlyPartitioner
path.format='year'=YYYY/'month'=MM/'day'=dd/'hour'=HH
locale=en
timezone=UTC
timestamp.extractor=Record

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false
