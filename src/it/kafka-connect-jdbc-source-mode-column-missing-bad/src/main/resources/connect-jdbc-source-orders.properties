name=jdbc-source-orders
connector.class=io.confluent.connect.jdbc.JdbcSourceConnector
tasks.max=1

connection.url=jdbc:postgresql://orders-db.internal:5432/analytics
connection.user=connect
connection.password=changeme

# Anti-pattern: mode=timestamp+incrementing requires BOTH timestamp.column.name
# and incrementing.column.name to be set — but neither is set here. The
# connector ConfigDef-level validation passes (the keys are not pre-validated
# at submission time); the REST POST returns 201 Created; the connector state
# transitions to RUNNING; then the first task starts and immediately throws
# ConfigException: 'Must specify a column name for the timestamp+incrementing
# mode.' Operators who only look at the connector-status endpoint see
# 'connector running' and do not realize records are not flowing because the
# task is FAILED. Two violations fire: one for incrementing.column.name and
# one for timestamp.column.name.
mode=timestamp+incrementing
poll.interval.ms=10000
table.whitelist=public.orders
topic.prefix=db.orders.

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
