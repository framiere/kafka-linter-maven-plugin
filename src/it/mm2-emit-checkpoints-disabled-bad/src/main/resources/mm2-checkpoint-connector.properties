# =============================================================================
# A MirrorMaker 2 checkpoint-connector configuration where the operator has
# explicitly disabled checkpoint emission via `emit.checkpoints.enabled=false`
# WITHOUT enabling the alternative failover path
# (`sync.group.offsets.enabled` is absent, which means it defaults to `false`).
# This is the CATASTROPHIC dual-disable case — the connector runs but does
# NOTHING failover-useful.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#
#   connector.class                = MirrorCheckpointConnector
#   emit.checkpoints.enabled       = false   ← primary failover path off
#   # sync.group.offsets.enabled is absent → defaults to false → alternative path off
#
# WHAT THIS CONNECTOR AND THESE KEYS ACTUALLY DO:
#
# MirrorCheckpointConnector exists to enable consumer-group failover from a
# primary Kafka cluster to a DR cluster. The connector has TWO independent
# failover-recovery mechanisms; production deployments should have at least
# one of them enabled.
#
# MECHANISM 1 — emit.checkpoints (default true) — THE CANONICAL SUBSTRATE:
#
#   The connector periodically (every emit.checkpoints.interval.seconds,
#   default 60 s) reads the source-cluster's `__consumer_offsets` topic via
#   `AdminClient.listConsumerGroupOffsets()`. For each (group, source-topic-
#   partition, source-offset) tuple, it translates the source-offset into
#   the corresponding target-offset using the offset-sync table that
#   MirrorSourceConnector writes to `<source-alias>.offset-syncs.internal`.
#   The translated (group, target-topic-partition, target-offset) tuples
#   are then written as records to the `<source-alias>.checkpoints.internal`
#   topic on the target cluster.
#
#   During a primary→DR cutover, consumer applications (or operator tooling)
#   call `RemoteClusterUtils.translateOffsets(checkpointsTopic, groupId,
#   targetClusterConfig)`. The API reads the latest checkpoint record per
#   group from the checkpoints topic and returns the target-offsets the
#   consumer should resume from. The consumer then seeks to those offsets
#   and resumes consumption without data loss or excessive replay.
#
#   The checkpoints topic is also audit-friendly: operators can list its
#   contents to verify offset-translation freshness ('is the DR cluster's
#   view of consumer-group offsets within N seconds of the source?').
#   DR-readiness dashboards typically query this topic directly.
#
# MECHANISM 2 — sync.group.offsets (default false in older MM2; default true
# in newer MM2 — version-dependent) — THE TRANSPARENT SUBSTRATE:
#
#   When enabled, MirrorCheckpointConnector ALSO writes translated offsets
#   DIRECTLY to the target cluster's `__consumer_offsets` topic via
#   `AdminClient.alterConsumerGroupOffsets()`. This means a consumer
#   application connecting to the DR cluster with the same `group.id` it
#   used on the source cluster will find its 'last committed offset' already
#   set to the correct translated target-offset — and `auto.offset.reset`
#   behavior never triggers.
#
#   This mechanism is transparent to consumer code (no `RemoteClusterUtils`
#   API call needed; no application-side translation logic) and is the
#   recommended path for greenfield deployments. But it has tradeoffs:
#   (a) the target's `__consumer_offsets` may have entries the operator
#   doesn't want (e.g., for consumer groups that no longer exist on source);
#   (b) audit/dashboard tooling that reads the checkpoints topic for DR-
#   readiness verification still depends on Mechanism 1.
#
# THE TWO MECHANISMS ARE COMPLEMENTARY, NOT REDUNDANT:
#
#   - Mechanism 1 (emit.checkpoints) gives an audit trail and a tool-friendly
#     substrate that ecosystem tooling depends on.
#   - Mechanism 2 (sync.group.offsets) gives transparent consumer failover
#     without application-side code.
#
# Production deployments typically have BOTH enabled. Disabling Mechanism 1
# while leaving Mechanism 2 at its default-false (or explicit false) is the
# CATASTROPHIC dual-disable case: neither path is active; consumers cannot
# fail over without manual intervention.
#
# THE FAILURE MODE (THIS FIXTURE):
#
# With `emit.checkpoints.enabled=false` AND `sync.group.offsets.enabled`
# absent (default false), MirrorCheckpointConnector:
#
#   - Starts up successfully (no config error)
#   - Schedules its periodic task
#   - Runs the task; the task finds no work to do (both emission paths off)
#   - Logs nothing alarming; throughput dashboards show no records produced
#     (which is expected — the task has no records to produce)
#   - Holds its Connect-cluster task slot indefinitely
#
# The misconfiguration is INVISIBLE until a primary→DR cutover is attempted.
# At cutover time:
#
#   1. Consumer applications connect to the DR cluster with their existing
#      group.id and try to resume from their last-committed offset.
#   2. The DR cluster's `__consumer_offsets` has NO entry for the group
#      (Mechanism 2 was off, so MM2 never wrote one).
#   3. The consumer's `auto.offset.reset` policy fires:
#        - `earliest` → consumer reads from offset 0 → replays every retained
#          record (potentially weeks of data; at-least-once double-billing
#          for non-idempotent processing; significant downstream cost)
#        - `latest` → consumer skips every record between the source-cluster's
#          last commit and the failover moment → silent data loss
#   4. The team scrambles to manually reset offsets via
#      `kafka-consumer-groups.sh --reset-offsets` — but without a
#      checkpoints topic to read from, there is NO offset-translation
#      reference. The team has to guess based on timestamps and source-side
#      LRO records. This is a 30+ minute scramble during an active incident.
#
# WHY THIS LOOKS SAFE BUT IS NOT:
#
# Replication runs fine. Records flow. MirrorSourceConnector is healthy.
# MirrorCheckpointConnector is running. The dashboard shows three connectors
# in 'RUNNING' state. Nothing alerts. The misconfiguration is invisible
# until the moment it matters most.
#
# HOW THIS HAPPENS:
#
# (a) **'Production defaults' assumption.** Operator assumes the MM2
#     ConfigDef defaults are 'recommended for production' and sees that
#     `sync.group.offsets.enabled` defaults to `false`. They interpret
#     this as 'sync.group.offsets is an advanced/optional feature that
#     production doesn't need'. Without realizing it, they set
#     `emit.checkpoints.enabled=false` to 'reduce noise on the target',
#     leaving neither path active.
#
# (b) **Tutorial copy-paste.** Early MM2 tutorial used
#     `emit.checkpoints.enabled=false` 'to keep the tutorial simple'. The
#     tutorial author also did not set `sync.group.offsets.enabled` (since
#     the tutorial didn't cover failover). Team's first MM2 deployment was
#     bootstrapped from the tutorial; both paths are off.
#
# (c) **Migration from MM1 'manual failover' culture.** MM1 had no
#     offset-translation feature; failover was always manual. Operators
#     migrating from MM1 deliberately disable MM2's automatic
#     mechanisms 'to preserve our existing manual-failover playbook'.
#     The manual playbook was a MM1 workaround; MM2 was supposed to
#     replace it, but the operator didn't update the playbook.
#
# (d) **Operator confused 'emit' with 'broadcast'.** Operator reads
#     'emit.checkpoints.enabled — Whether to emit checkpoints' and
#     interprets 'emit' as 'broadcast loudly across the cluster'. They
#     worry about cluster-wide noise and disable to 'reduce noise'. The
#     actual semantics — one record per consumer-group per topic-partition
#     every 60 s — is far more benign than the operator imagined.
#
# (e) **Quota workaround.** Operator sees ThrottlingException in the
#     Connect logs when MirrorCheckpointConnector writes to the
#     checkpoints internal topic. Rather than raise the quota or fix the
#     connector's principal, they disable emission to silence the logs.
#     The quota issue is masked; the failover substrate is dark.
#
# (f) **Helm chart inheritance.** Org's internal Helm chart for MM2 was
#     written by someone whose dev cluster didn't need failover (it was
#     dev). They templated `emitCheckpointsEnabled: false` to 'reduce
#     dev-cluster topic count'. Multiple production teams deploy the
#     chart without overriding.
#
# THE FIX:
#
# Remove the explicit `=false` (the default `=true` is correct):
#
#   # emit.checkpoints.enabled=false       ← DELETE THIS LINE
#
# Or set explicitly to true to make the intent visible:
#
#   emit.checkpoints.enabled=true          ← OK
#
# AND consider enabling the complementary path:
#
#   sync.group.offsets.enabled=true        ← transparent consumer failover
#
# If the operator DELIBERATELY wants to use sync.group.offsets only (no
# checkpoints topic), set BOTH explicitly:
#
#   emit.checkpoints.enabled=false
#   sync.group.offsets.enabled=true
#
# AND suppress this rule with documented rationale:
#
#   <severities>
#       <MM2_EMIT_CHECKPOINTS_DISABLED>OFF</MM2_EMIT_CHECKPOINTS_DISABLED>
#   </severities>
#
# Production deployments should have AT LEAST ONE of the two failover-
# recovery paths active. The dual-disable case (this fixture) is always
# wrong.
#
# =============================================================================

name=mm2-checkpoint
connector.class=org.apache.kafka.connect.mirror.MirrorCheckpointConnector
tasks.max=1

source.cluster.alias=primary
target.cluster.alias=dr

source.cluster.bootstrap.servers=primary-kafka.internal:9093
target.cluster.bootstrap.servers=dr-kafka.internal:9093

checkpoints.topic.replication.factor=3

# VIOLATION: emit.checkpoints.enabled=false on a MirrorCheckpointConnector
# opts out of the canonical failover-recovery substrate (the
# <source-alias>.checkpoints.internal topic). Combined with the absent
# sync.group.offsets.enabled (defaults to false), this is the CATASTROPHIC
# dual-disable case — neither failover-recovery path is active. DR consumers
# will fall back to auto.offset.reset (earliest=replay/double-billing OR
# latest=silent data loss). Fix: remove this line (default `=true` is
# correct), AND/OR set `sync.group.offsets.enabled=true`. Production MM2
# deployments must have AT LEAST ONE failover path active.
emit.checkpoints.enabled=false

emit.checkpoints.interval.seconds=60
refresh.groups.interval.seconds=600

# NOTE: sync.group.offsets.enabled is ABSENT here, which means it defaults
# to false. Combined with emit.checkpoints.enabled=false, both failover
# paths are off.
