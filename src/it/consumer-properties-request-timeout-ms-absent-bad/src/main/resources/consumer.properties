# =============================================================================
# IT fixture: CONSUMER_PROPERTIES_REQUEST_TIMEOUT_MS_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A kafka-clients consumer .properties file destined for
#   `new KafkaConsumer<>(props)`. It declares deserializers, bootstrap.servers,
#   group.id, client.id, partition.assignment.strategy, auto.offset.reset,
#   enable.auto.commit, isolation.level, max.poll.records, max.poll.
#   interval.ms, session.timeout.ms (EXPLICITLY pinned to the kafka-clients
#   3.x default of 45000ms), heartbeat.interval.ms, fetch.min.bytes, AND
#   fetch.max.wait.ms — a complete production-quality consumer config —
#   EXCEPT `request.timeout.ms` is not set anywhere.
#
# What's wrong
#   The operator did everything else right: bootstrap servers, group
#   identity, assignment strategy, polling discipline, fetch coupling — all
#   explicit and well-thought-out. But they forgot to set
#   `request.timeout.ms`. kafka-clients defaults `request.timeout.ms` to
#   30000 (30 seconds).
#
#   With `session.timeout.ms=45000` (this file's explicit value — also the
#   kafka-clients 3.x default since KIP-735), the informal kafka-clients
#   guideline `request.timeout.ms > session.timeout.ms` is SILENTLY
#   VIOLATED:
#
#     request.timeout.ms = 30000  (DEFAULT, because absent)
#     session.timeout.ms = 45000  (explicit, also default since 3.0)
#     → 30000 < 45000 — guideline broken.
#
#   Under steady-state load this violation is INVISIBLE. Fetches return in
#   <500ms, well under both bounds; OffsetCommits land in <100ms during
#   normal cluster operation; the consumer reports healthy metrics; the
#   on-call dashboard shows green.
#
#   The violation manifests during REBALANCE. When the consumer joins,
#   leaves, or a partition is reassigned (during a deployment, scale-up,
#   scale-down, broker restart, or controller failover):
#
#     1. The consumer issues a JoinGroup request to the group coordinator.
#     2. The broker holds JoinGroup OPEN for up to `session.timeout.ms`
#        (45s) waiting for ALL group members to rejoin and converge.
#     3. The consumer's client-side `request.timeout.ms` (30s) fires at
#        the 30-second mark while the broker is still waiting for the
#        other members.
#     4. The kafka-clients NetworkClient cancels the in-flight JoinGroup,
#        raises TimeoutException internally, and the consumer's
#        ConsumerCoordinator re-issues JoinGroup.
#     5. The broker sees this as a fresh JoinGroup from the same member,
#        treats it as a member rejoin during rebalance, restarts the
#        rebalance protocol with a new generation.
#     6. The cycle repeats: 30s wait → cancel → re-issue → broker
#        restart. The consumer never stabilizes and never starts
#        processing records.
#
#   `org.apache.kafka.clients.consumer.ConsumerConfig.
#   REQUEST_TIMEOUT_MS_CONFIG` declares `request.timeout.ms` with
#   `ConfigDef.Type.INT`, default `30000`, importance MEDIUM. There is NO
#   validation at KafkaConsumer construction — the guideline is informal,
#   documented in kafka-clients javadoc but not enforced.
#
#   This is the KIP-735 silent default-violation footgun: before kafka-
#   clients 3.0, `session.timeout.ms` defaulted to 10000ms (10s), so the
#   coupling held by a 3x margin (request.timeout.ms=30000 > session.
#   timeout.ms=10000). KIP-735 raised `session.timeout.ms` default to
#   45000ms (to support more robust group membership during transient
#   network blips) but did NOT raise `request.timeout.ms`. The result:
#   every consumer on full defaults in kafka-clients 3.x is in a silently-
#   broken regime during rebalances.
#
#   Symptoms of the silently-broken state:
#     - Consumer logs show `Discovered group coordinator` followed by
#       repeated `(Re-)joining group` messages every ~30 seconds.
#     - JMX metric `last-rebalance-seconds-ago` resets to 0 every ~30s
#       and never grows past ~30s — meaning rebalance is constantly
#       restarting.
#     - JMX metric `records-consumed-rate` stays at 0 during the loop.
#     - Application logs show no record-processing activity.
#     - On-call dashboard shows 'consumer is alive but not consuming'.
#     - Group coordinator-side logs (if enabled) show the same member
#       repeatedly rejoining.
#
# Why this is "INFO" by default (not WARNING or ERROR)
#   (a) The violation is silent under defaults during STEADY-STATE load.
#       Fetches return in <500ms, well under request.timeout.ms=30000.
#       Most consumers spend 99%+ of their lifetime in steady state.
#
#   (b) The rebalance-loop pathology only manifests when a rebalance
#       actually occurs. Rebalances are infrequent (deployments, broker
#       restarts, scale events) — many consumers go weeks without one.
#
#   (c) The fix is straightforward and the kafka-clients javadoc is clear
#       — operators who read the docs know to set `request.timeout.ms`
#       paired with `session.timeout.ms`. The rule's purpose is to
#       prompt operators who haven't read the docs yet.
#
#   (d) Default `request.timeout.ms=30000` is NOT crashed; the consumer
#       starts, runs, looks healthy. ERROR/WARNING severity for a default
#       that works most of the time would be too noisy.
#
#   For these reasons, the rule's default severity is INFO — a documentation
#   nudge prompting the operator to set request.timeout.ms paired with
#   session.timeout.ms.
#
#   This IT overrides severity to ERROR via pom.xml configuration to force
#   the build to fail and verify the rule fires.
#
# Common bug shapes
#   (1) KIP-735 silent default-violation — every fresh consumer on 3.x.
#       kafka-clients 3.0+ defaults `session.timeout.ms=45000` (raised
#       from 10000 in 2.x by KIP-735 to support robust group membership).
#       Operators upgrading from 2.x to 3.x DID NOT change request.
#       timeout.ms (it was already at the default 30000). After upgrade,
#       the coupling silently inverts: 30000 < 45000. Under steady-state
#       load no symptom appears. The first time a rebalance triggers,
#       the consumer falls into a re-join loop. On-call investigates:
#       'why is this consumer stuck after the 3.x upgrade?' Root cause:
#       KIP-735 raised one default without raising the coupled default.
#
#   (2) Fetch storm — request.timeout.ms < fetch.max.wait.ms after
#       operator tunes fetch.max.wait.ms UP.
#       Operator has a batch-oriented consumer; sets `fetch.max.wait.ms=
#       60000` (60s) to allow the broker to accumulate large fetches
#       before responding. Leaves request.timeout.ms at default 30000.
#       The broker now holds each Fetch OPEN for up to 60s; the client
#       gives up at 30s and re-issues; the broker treats the re-issue as
#       a new FetchRequest, starts another 60s wait, and the cycle
#       repeats indefinitely. Result: every 30s the consumer issues a
#       new Fetch; the broker accumulates 50%-full responses; the
#       consumer never receives a complete fetch; consumption rate
#       drops to nearly zero.
#
#   (3) OffsetCommit timeout during partition migration → duplicate
#       processing.
#       Operator uses `enable.auto.commit=true` (defaults) or explicit
#       `commitSync()`. During a controlled partition migration (broker
#       restart, controller failover), the OffsetCommit can take up to
#       35s as the broker recovers leadership. If request.timeout.ms=
#       30000 (default) and the migration takes 35s, the OffsetCommit
#       times out; the consumer continues processing without the commit
#       landing; on next rebalance, the consumer is told to resume from
#       the previous offset and re-processes all the records committed
#       in the missing-commit window. Result: silent at-most-once →
#       at-least-once-with-duplicates downgrade during cluster ops.
#
#   (4) Spring Boot default Kafka configuration — invisible across
#       thousands of microservices.
#       Spring Boot Kafka starter defaults `spring.kafka.consumer.
#       properties.*` to kafka-clients defaults UNLESS the operator
#       overrides. Most Spring Boot operators tune bootstrap.servers,
#       group.id, auto.offset.reset, enable.auto.commit, and key/value-
#       deserializer — and stop. request.timeout.ms is rarely touched.
#       The KIP-735 silent default violation is present in nearly every
#       Spring Boot Kafka consumer in production today. Static analysis
#       on the underlying .properties surfaces every absence.
#
#   (5) Operator tunes session.timeout.ms UP to 120000 for slow
#       processing, leaves request.timeout.ms at default.
#       Consumer processes records via a downstream HTTP API with a 60s
#       per-record p99 latency. Operator sets max.poll.records=10 and
#       session.timeout.ms=120000 to give the consumer breathing room
#       between polls (combined with max.poll.interval.ms=600000).
#       request.timeout.ms left at default 30000. The coupling is now
#       even more broken: 30000 < 120000. Every rebalance triggers a
#       4x re-issue loop (3 retries within the broker's wait window
#       before the broker eventually times out).
#
#   (6) Kafka Connect — operator can't tune request.timeout.ms separately
#       for internal vs external consumers.
#       Kafka Connect's source and sink tasks use INTERNAL consumers
#       (for offset tracking, status tracking) and ALSO external
#       consumers (for sink tasks reading the source topic). Connect's
#       worker config conflates these; operators who tune request.
#       timeout.ms for the external sink consumer accidentally apply it
#       to the internal consumers too. The rule fires on the Connect
#       worker's consumer .properties block if request.timeout.ms is
#       absent, prompting the operator to consider both consumer types.
#
# Fix
#   ONE LINE. Set `request.timeout.ms` STRICTLY GREATER than `session.
#   timeout.ms`, ALWAYS with both set together so the rebalance budget
#   is explicit. Convention: request.timeout.ms = session.timeout.ms +
#   15000 (15s margin for JoinGroup completion after broker-side timeout):
#
#     # Low-latency consumer:
#     session.timeout.ms=10000
#     request.timeout.ms=20000
#
#     # Robust consumer (kafka-clients 3.x default-aware):
#     session.timeout.ms=45000
#     request.timeout.ms=60000
#
#     # Long-rebalance large group (slow processing or many members):
#     session.timeout.ms=120000
#     request.timeout.ms=180000
#
#   For this fixture's `session.timeout.ms=45000`, the right pair is
#   `request.timeout.ms=60000` (60s — 15s margin above session.timeout.ms).
# =============================================================================

bootstrap.servers=broker-1.kafka.prod.example.com:9092,broker-2.kafka.prod.example.com:9092,broker-3.kafka.prod.example.com:9092
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer

# Group identity + client identity (isolate the rule).
group.id=invoice-events
client.id=invoice-fraud-screening-consumer

# Partition assignment strategy (cooperative for safe rolling deploys).
partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor

# Bootstrap-offset semantics.
auto.offset.reset=earliest

# At-least-once semantics.
enable.auto.commit=false

# Read-committed.
isolation.level=read_committed

# Poll-loop tuning.
max.poll.records=500
max.poll.interval.ms=300000

# session.timeout.ms EXPLICITLY pinned to the kafka-clients 3.x default
# (45000ms, per KIP-735). Even pinning it explicitly does NOT save us from
# the silent request.timeout.ms < session.timeout.ms violation, because
# request.timeout.ms below is absent and inherits the default 30000ms.
session.timeout.ms=45000
heartbeat.interval.ms=12000

# Fetch coupling explicit (both set together).
fetch.min.bytes=1
fetch.max.wait.ms=500

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# MISSING:
#   request.timeout.ms=...
# With session.timeout.ms=45000 above, default request.timeout.ms=30000
# violates the guideline request.timeout.ms > session.timeout.ms. The right
# pair is request.timeout.ms=60000 (15s margin above 45000). On every
# rebalance, the broker holds JoinGroup OPEN for up to 45s; the client gives
# up at 30s; the consumer falls into a re-join loop and never stabilizes.
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
