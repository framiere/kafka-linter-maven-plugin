# =============================================================================
# IT fixture: SECURITY_PROTOCOL_PLACEHOLDER (bad)
# =============================================================================
#
# What this file is
#   A Kafka producer .properties file for `audit-event-publisher` — a
#   Java 17 microservice running on a self-managed Kubernetes cluster
#   (Rancher RKE2), responsible for publishing audit events from the
#   bank's core banking system to a Kafka 3.7 cluster used by the
#   regulatory reporting team.
#
#   The application uses a hybrid configuration strategy that
#   eventually backfires:
#     - Most app config lives in Spring Boot's `application.yml`
#       with `@Value("${kafka.security}")` expansion.
#     - The Kafka client config lives in a separate
#       `kafka-producer.properties` file (this file) that the
#       application loads directly via:
#         try (var in = ClassLoader.getResourceAsStream(
#                 "kafka-producer.properties")) {
#             var p = new Properties();
#             p.load(in);
#             return new KafkaProducer<>(p);
#         }
#     - This second properties file is loaded with `Properties.load`
#       — bypassing Spring's `${...}` expansion entirely.
#
#   The team did this to 'keep the Kafka producer setup independent
#   of Spring lifecycle' so they could reuse the .properties file
#   for non-Spring command-line tools that produce to the same
#   audit topics. The intent was reasonable; the consequence is not.
#
# What's wrong
#   `security.protocol=${KAFKA_SECURITY_PROTOCOL}` — the literal
#   placeholder reaches the Kafka client's `AbstractConfig.parse()`
#   validator, which checks the value against the closed enum:
#
#       SecurityProtocol.names() = ["PLAINTEXT", "SSL",
#                                   "SASL_PLAINTEXT", "SASL_SSL"]
#
#   The string `${KAFKA_SECURITY_PROTOCOL}` is not in the list. The
#   validator throws:
#
#       org.apache.kafka.common.config.ConfigException: Invalid value
#       ${KAFKA_SECURITY_PROTOCOL} for configuration security.protocol:
#       String must be one of: PLAINTEXT, SSL, SASL_PLAINTEXT,
#       SASL_SSL
#
#   The exception is thrown synchronously from the `KafkaProducer`
#   constructor, BEFORE any network code runs. The pod crashes at
#   startup before it can even attempt to resolve `bootstrap.servers`
#   to an IP.
#
# Why the placeholder is here in the first place
#   The team's mental model: the .properties file is a TEMPLATE that
#   Spring will expand at runtime. The team that wrote the file is
#   familiar with Spring Boot's `application.yml` semantics and
#   assumed the same `${VAR}` syntax works in any .properties file
#   the app loads.
#
#   The implementation reality: Java's `java.util.Properties.load()`
#   reads files as plain key=value pairs. It does NOT expand
#   placeholders. The expansion has to happen BEFORE the value
#   reaches the Kafka client — via:
#     (a) Spring's `@Value`/`@ConfigurationProperties` if the
#         properties go through Spring's `Environment`.
#     (b) Java's `System.getProperty("var")` if the value comes
#         from a `-Dvar=...` JVM argument.
#     (c) Explicit code: `props.put("security.protocol",
#         System.getenv("KAFKA_SECURITY_PROTOCOL"))`.
#     (d) A build-time substitution: Maven resource filtering with
#         `<filtering>true</filtering>`, which expands
#         `${env.VAR}` at `mvn package` time.
#
#   None of (a)-(d) applies to this file because the team loads it
#   with raw `Properties.load(...)` and the file is in
#   `src/main/resources/` without Maven filtering enabled.
#
# How this bug typically reaches production
#   The dev workflow: developers run the app with
#   `-Dkafka.security.protocol=PLAINTEXT` on their local machine,
#   talking to a local Testcontainers Kafka broker without TLS.
#   The .properties file's `${KAFKA_SECURITY_PROTOCOL}` placeholder
#   is overridden by the `-D` JVM argument because Spring Boot's
#   `Environment` (which the application uses for SOME config)
#   sees the `-D` value and the team THINKS that means the
#   placeholder was expanded. It wasn't — the `-D` argument
#   populated a different config path entirely.
#
#   The CI workflow: integration tests set
#   `KAFKA_SECURITY_PROTOCOL=PLAINTEXT` as an env var on the test
#   container. Spring's `@Value` expansion picks it up for the
#   Spring-managed code paths, and the test passes. The
#   .properties-file-loaded `KafkaProducer` works in CI because
#   `${KAFKA_SECURITY_PROTOCOL}` — well, no, it still fails. The
#   test only covers the Spring code path; the .properties file
#   was added later and is exercised only in production.
#
#   The staging workflow: the staging environment's Kubernetes
#   ConfigMap includes the env var; the app starts; the Kafka
#   producer fails on every send. The team mistakes the symptom
#   for a flaky broker; restarts of the pod don't help (the bug
#   is deterministic); the team rolls back the deploy.
#
#   The production reality: this is the staging-vs-prod config-
#   drift class of bug. Staging has the env var set; prod has it
#   missing (or named differently — `KAFKA_PROTOCOL` vs
#   `KAFKA_SECURITY_PROTOCOL`, easy to miss in a values.yaml
#   review). The same Docker image deploys cleanly to staging
#   and crash-loops on prod.
#
# Specific impact on this audit-event-publisher service
#   This is an AUDIT service. The events it publishes are
#   regulatory-mandated records of every customer-facing
#   transaction. When the producer crash-loops:
#     - Audit events are not published.
#     - The bank's audit pipeline (downstream consumer of the
#       Kafka audit topic) sees no events; reports show zero
#       activity for the period.
#     - Compliance auditors flag the gap; the bank pays a fine.
#     - The pod's `livenessProbe` may not detect the issue if
#       the probe only checks for HTTP liveness — the Kafka
#       producer is broken but the HTTP server is fine.
#     - On-call engineers see 'pod is healthy, no traffic
#       errors' and assume the upstream system (the core banking
#       system feeding the audit-event-publisher) is the
#       problem, costing hours of incorrect debugging.
#
# Why this rule is HIGH-CONFIDENCE catchable at lint time
#   The bug is purely syntactic at the .properties-file level: the
#   literal string `${KAFKA_SECURITY_PROTOCOL}` appears in the file.
#   A grep-style check can find it in milliseconds; the runtime
#   failure mode is deterministic; there is no false-positive case
#   where you'd WANT a placeholder to reach Kafka's validator
#   (Kafka does not expand placeholders, the enum is closed, the
#   literal will always fail). The placeholder pattern is
#   distinctive enough — `${...}`, `@{...}`, `%{...}` — that a
#   regex catches it without ambiguity.
#
# The six bug shapes this rule catches
#   (1) **Spring-Boot-template-style placeholder in a non-Spring-
#       loaded file.** (This fixture's scenario.) `Properties.load`
#       does no expansion; the team thinks Spring will handle it;
#       it doesn't.
#
#   (2) **Helm template engine version drift.** A Helm chart uses
#       `{{ .Values.kafka.security }}` to template into a
#       ConfigMap; a newer chart version requires `required` for
#       the value but a CI pipeline running `--dry-run` doesn't
#       fail on missing values, leaving the placeholder literal.
#
#   (3) **Maven resource filtering not enabled.** Build uses
#       `${env.KAFKA_SECURITY_PROTOCOL}` expecting Maven to expand
#       at package time, but the pom.xml never set
#       `<filtering>true</filtering>` on the resources block.
#
#   (4) **Kubernetes ConfigMap valueFrom typo.** The env var
#       reference points to a non-existent ConfigMap key; Kubernetes
#       silently leaves the env var unset; the framework's
#       resolution yields the literal placeholder (or empty
#       string, which fails the enum the same way).
#
#   (5) **Spring profile inheritance bug.** Spring loads
#       `application-local.yml` AFTER `application-prod.yml` for
#       a pod started with `SPRING_PROFILES_ACTIVE=prod,local`
#       (later wins). The local profile's literal placeholder
#       overrides the prod profile's resolved value.
#
#   (6) **MicroProfile / Quarkus config-provider not configured.**
#       The .properties file is intended to be processed by
#       MicroProfile's `ConfigProvider`, but the application
#       reads it via plain `Properties.load`; expansion never
#       happens.
#
# Why WARNING (not INFO / ERROR) by default
#   This is borderline ERROR — the bug is deterministic, reaches
#   production via config drift, and causes total service outage.
#   But the rule's confidence is HIGH only when the value contains
#   a placeholder syntax that matches the regex; teams who use a
#   custom placeholder convention (`<<VAR>>`, `__VAR__`, etc.)
#   would have false-negatives, and the runtime failure is loud
#   (ConfigException at startup, not silent data loss). WARNING
#   lets the team triage in code review; teams operating in
#   regulated environments should elevate to ERROR via pom-level
#   override.
#
#   This IT fixture's pom.xml overrides the severity to ERROR so
#   `mvn verify` fails on this bad configuration, demonstrating
#   the rule fires correctly.
#
# Fix
#   Two patterns, depending on where the value should come from:
#
#   (1) **JVM system property (preferred for ops-set values).**
#       Remove the placeholder; pass the value at JVM startup:
#         java -Dkafka.security.protocol=SASL_SSL ...
#       Then in code:
#         props.put("security.protocol",
#                   System.getProperty("kafka.security.protocol",
#                                      "PLAINTEXT"));
#       This puts the resolved value in `props` before the
#       `KafkaProducer` constructor.
#
#   (2) **Explicit env-var expansion in code.** Keep the
#       .properties file for the OTHER (non-placeholder) settings,
#       and override `security.protocol` in code:
#         var p = loadProperties("kafka-producer.properties");
#         var sec = System.getenv("KAFKA_SECURITY_PROTOCOL");
#         if (sec == null || sec.isBlank()) {
#             throw new IllegalStateException(
#                 "KAFKA_SECURITY_PROTOCOL env var must be set " +
#                 "to one of PLAINTEXT, SSL, SASL_PLAINTEXT, " +
#                 "SASL_SSL");
#         }
#         p.put("security.protocol", sec);
#         return new KafkaProducer<>(p);
#       The explicit null-check fails fast with a useful error
#       message; the runtime failure is 'KAFKA_SECURITY_PROTOCOL
#       env var missing' rather than the cryptic Kafka
#       ConfigException.
#
#   (3) **Spring Boot route — use application.yml.** Move the
#       Kafka config from a standalone .properties file into
#       `application.yml` and let Spring's `KafkaAutoConfiguration`
#       construct the producer. Spring's `@Value` expansion runs
#       on the YAML keys before they reach the Kafka client.
#       Trade-off: loses the 'reuse for command-line tools'
#       capability the team originally wanted.
#
#   (4) **Maven resource filtering at build time.** Enable
#       `<filtering>true</filtering>` on
#       `src/main/resources/` in pom.xml; configure
#       `${env.KAFKA_SECURITY_PROTOCOL}` (Maven's env-var syntax)
#       to be expanded at `mvn package` time. Trade-off: ties
#       the artifact to the build-time env-var value; you can't
#       move the same artifact across staging/prod without
#       rebuilding.
# =============================================================================

# Cluster connectivity.
bootstrap.servers=kafka-audit.platform.internal:9094

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# THE BUG:
# `${KAFKA_SECURITY_PROTOCOL}` is a literal string at the point this file is
# loaded with `Properties.load`. Kafka's validator runs at producer
# construction, sees the literal placeholder, throws ConfigException:
#   "Invalid value ${KAFKA_SECURITY_PROTOCOL} for configuration
#    security.protocol: String must be one of: PLAINTEXT, SSL,
#    SASL_PLAINTEXT, SASL_SSL"
# Pod crashes at startup. Staging passes (Spring profile resolves the env
# var); prod crash-loops (env var missing in prod ConfigMap).
# Fix: resolve the env var in code with `System.getenv(...)` and a null-check,
# or move config to application.yml so Spring's @Value expansion runs first.
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
security.protocol=${KAFKA_SECURITY_PROTOCOL}

# SASL stack (assumes security.protocol resolves to SASL_SSL).
sasl.mechanism=SCRAM-SHA-512
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required \
    username="audit-event-publisher" \
    password="${env:KAFKA_PASSWORD}";

# Truststore for broker certs.
ssl.truststore.location=/etc/audit-event-publisher/kafka.truststore.p12
ssl.truststore.password=${env:KAFKA_TRUSTSTORE_PASSWORD}
ssl.truststore.type=PKCS12

# Standard producer knobs.
client.id=audit-event-publisher-pod-0
acks=all
enable.idempotence=true
compression.type=zstd
linger.ms=20
batch.size=131072
buffer.memory=67108864
max.block.ms=60000
delivery.timeout.ms=120000
request.timeout.ms=30000

# Serializers.
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer

# Connection / metadata.
metadata.recovery.strategy=rebootstrap
