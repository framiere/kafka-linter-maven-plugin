# =============================================================================
# A Kafka consumer configuration that connects to Confluent Schema Registry
# over `https://` (TLS — good) but FORGETS to configure ANY client-side
# authentication credential. The TLS layer encrypts the bytes on the wire,
# but TLS does NOT authenticate the client identity. Without
# `basic.auth.credentials.source` / `basic.auth.user.info`,
# `bearer.auth.credentials.source` / `bearer.auth.token`, or
# `schema.registry.ssl.keystore.location` (mTLS), every Schema Registry
# request goes out with NO `Authorization` header and NO client certificate.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#
#   schema.registry.url            = https://sr.internal:8081     ← TLS (good)
#   # basic.auth.credentials.source = (UNSET)                     ← AUTH OPEN
#   # basic.auth.user.info          = (UNSET)
#   # bearer.auth.credentials.source = (UNSET)
#   # bearer.auth.token              = (UNSET)
#   # schema.registry.ssl.keystore.location = (UNSET)
#
# WHY THIS LOOKS SAFE BUT IS NOT:
#
# `https://` makes a security auditor's checklist tick green: 'Schema Registry
# uses TLS'. But TLS is a transport-layer property — it secures the BYTES,
# not the IDENTITY. The Schema Registry server-side decides whether to accept
# unauthenticated requests based on its `authentication.method` setting:
#
#   - `authentication.method=NONE` (the default for on-prem Confluent
#     Community SR distributions!) → accepts anonymous requests silently.
#     Anyone with network reachability to the SR endpoint can read every
#     schema (which often encodes business-domain detail like internal field
#     names, model labels, system identifiers) and, if the registry is
#     configured to allow write to anonymous, register new schemas under
#     existing subjects — corrupting schema evolution for the entire
#     ecosystem of producers/consumers using that registry.
#   - `authentication.method=BASIC` → expects `Authorization: Basic <b64>`.
#     A client with no auth gets `401 Unauthorized`. Confluent Cloud's SR
#     always uses BASIC (API key as user, API secret as password).
#   - `authentication.method=BEARER` → expects `Authorization: Bearer <jwt>`.
#     A client with no auth gets `401`.
#   - `authentication.method=SSL` → expects a client cert during the TLS
#     handshake. A client with no `schema.registry.ssl.keystore.location` is
#     rejected at the handshake with `403 Forbidden` (or the TLS handshake
#     itself aborts depending on the registry's renegotiation policy).
#
# Confluent's `RestService` (the underlying HTTP client behind
# `KafkaAvroDeserializer`, `KafkaJsonSchemaDeserializer`,
# `KafkaProtobufDeserializer`, and their Streams Serde counterparts) reads
# three config families on construction to build the per-request
# Authorization header / client cert:
#
#   (a) `basic.auth.credentials.source` ∈ {USER_INFO, URL, SASL_INHERIT}
#       USER_INFO reads `basic.auth.user.info=<user>:<password>` and
#       base64-encodes it as the Authorization header. URL reads the
#       user-info segment from the URL itself (deprecated). SASL_INHERIT
#       inherits from the broker SASL auth (only works in SASL-broker
#       setups).
#   (b) `bearer.auth.credentials.source` ∈ {STATIC_TOKEN, OAUTHBEARER,
#       CUSTOM}. STATIC_TOKEN reads `bearer.auth.token=<jwt>` verbatim.
#       OAUTHBEARER fetches an access token per request from an OAuth
#       provider (recommended — lower risk than static tokens).
#   (c) `schema.registry.ssl.keystore.location` / `.keystore.password` /
#       `.key.password` — mTLS. The client presents its cert at the TLS
#       handshake.
#
# If NONE of (a), (b), (c) is configured, RestService builds requests with
# no Authorization header and no client cert. The dominant failures:
#
# REAL-WORLD INCIDENT SHAPES:
#
# (1) **First-deploy 401 crashloop (Confluent Cloud).**
#     Team copies the Confluent Cloud quick-start, sets the
#     `schema.registry.url` to the cloud-issued HTTPS endpoint, and forgets
#     `basic.auth.credentials.source=USER_INFO` +
#     `basic.auth.user.info=<api-key>:<api-secret>`. The deserializer's first
#     schema fetch throws `RestClientException: Unauthorized; error code:
#     401` deep inside Kafka's `Fetcher.parseRecord`. The consumer crashes
#     on first poll, restarts, crashes again — the kind of restart-loop that
#     looks like a 'transient SR outage' to anyone not reading the stack
#     trace.
#
# (2) **Silent anonymous access (on-prem default).**
#     Many on-prem Confluent SR deployments ship with
#     `authentication.method=NONE`, the documented default. Team configures
#     `schema.registry.url=https://internal-sr:8081`, no auth, and ships.
#     Tests pass; production runs fine; the issue is invisible until a
#     security audit (months later) discovers that anyone on the internal
#     network can dump every schema. Worse, if the registry allows
#     anonymous write, an attacker can register a new schema version under
#     an existing subject and silently corrupt schema evolution — every
#     producer that picks up the corrupted version starts writing wrong
#     records.
#
# (3) **Half-migrated TLS-without-auth rollout.**
#     Team migrates SR from `http://` to `https://` for compliance (the
#     [[schema-registry-url-http]] rule fires on the http:// URL and is
#     fixed). The migration PR flips the scheme to `https://` but doesn't
#     add the matching auth config — it appears in a separate auth-team PR
#     that lands a week later. In the gap, every deploy of the application
#     runs with TLS but no client auth: either crashloops (Confluent Cloud)
#     or runs anonymously (on-prem). The static-analysis catch at PR time
#     prevents the gap.
#
# (4) **Helm chart default without env-var injection.**
#     Org's internal Helm chart for Kafka apps templates `schemaRegistryUrl:
#     "https://sr.svc.cluster.local"` (good — internal HTTPS) but leaves
#     auth config to per-team overrides. Teams that don't read the chart's
#     auth section deploy with the URL templated but no auth. The chart
#     itself doesn't fail to render; the application starts; the SR
#     requests either crashloop or run anonymously. The lint catches the
#     gap in each team's repo.
#
# (5) **Migration from MockSchemaRegistryClient to real SR.**
#     Team developed against `MockSchemaRegistryClient` (no real HTTPS
#     endpoint, no auth needed). The production config swaps in the real
#     HTTPS SR URL but the team forgets that real SR requires auth.
#     Equivalent shape to (1) — the dev environment hides the requirement.
#
# (6) **mTLS vs basic-auth confusion.**
#     SR is configured for mTLS (`authentication.method=SSL`). Team configs
#     the URL as HTTPS but doesn't set `schema.registry.ssl.keystore.
#     location` — the TLS handshake succeeds (server presents its cert,
#     client validates), but the server rejects the client at the
#     authentication layer because no client cert was presented. Symptoms:
#     `403 Forbidden` on first send. The fix is mechanical but is
#     occasionally confused with broker mTLS (which uses
#     `ssl.keystore.location`, NOT `schema.registry.ssl.keystore.location`
#     — different config namespace).
#
# THE FIX:
#
# Choose ONE of:
#
#   For basic auth (most common, Confluent Cloud + most on-prem):
#     basic.auth.credentials.source = USER_INFO
#     basic.auth.user.info          = ${SR_USER_INFO}    # env-injected
#
#   For OAuth (recommended over static tokens):
#     bearer.auth.credentials.source        = OAUTHBEARER
#     bearer.auth.issuer.endpoint.url       = https://idp.example.com/token
#     bearer.auth.client.id                 = ${SR_OAUTH_CLIENT_ID}
#     bearer.auth.client.secret             = ${SR_OAUTH_CLIENT_SECRET}
#     bearer.auth.scope                     = sr-write
#     bearer.auth.logical.cluster           = lsrc-xxxxx       # Confluent Cloud
#     bearer.auth.identity.pool.id          = pool-xxxxx       # Confluent Cloud
#
#   For mTLS:
#     schema.registry.ssl.keystore.location = /run/secrets/sr-client.p12
#     schema.registry.ssl.keystore.password = ${SR_KEYSTORE_PASS}
#     schema.registry.ssl.key.password      = ${SR_KEY_PASS}
#
# NEVER hardcode the credential value (the rule's siblings
# CRED_BASIC_AUTH_USER_INFO_LITERAL, CRED_SR_BEARER_AUTH_TOKEN_LITERAL,
# CRED_SSL_KEYSTORE_PASSWORD_LITERAL fire on literal values). Always inject
# via env-var / k8s secret / Vault.
#
# =============================================================================

bootstrap.servers=kafka.internal:9092
group.id=orders-consumer
client.id=orders-consumer

key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
specific.avro.reader=true

# VIOLATION: schema.registry.url uses https:// (TLS — good), but no auth is
# configured. RestService will send every request with no Authorization
# header and no client cert. Either crashloops with 401 Unauthorized
# (Confluent Cloud / auth-required SR) or runs anonymously (on-prem SR with
# default authentication.method=NONE — silent governance hole). Fix: add
# `basic.auth.credentials.source=USER_INFO` + `basic.auth.user.info=${SR_USER_INFO}`
# (or the OAuth / mTLS equivalents).
schema.registry.url=https://sr.internal:8081

enable.auto.commit=false
auto.offset.reset=earliest
max.poll.records=500
fetch.min.bytes=65536
max.poll.interval.ms=300000
isolation.level=read_uncommitted
session.timeout.ms=45000
