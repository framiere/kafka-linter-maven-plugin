# =============================================================================
# Debezium MySQL connector capturing the `inventory.*` schema from the orders
# OLTP database.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#   event.processing.failure.handling.mode = skip
#
# WHY THIS IS A SILENT-DATA-LOSS BUG:
#
# Debezium's CDC pipeline is a chain of decoders: the source-database log
# decoder (binlog parser here, since MySQL) produces RAW events; the
# schema-evolution-aware decoder maps raw events to typed SourceRecord
# instances using the SchemaHistory-cached table schema; the converter
# layer (Avro here) serializes them to Kafka. ANY stage in this chain can
# fail on a SINGLE event:
#
#   - A malformed DDL (unsupported syntax extension, a vendor-specific
#     DDL Debezium has not yet implemented, an ALTER TABLE the parser
#     handles incorrectly)
#   - A schema-mismatched row (out-of-band DDL on a replica that the
#     connector didn't see, schema cache stale)
#   - A corrupted source-log entry (rare, but happens on hardware faults)
#   - A partial event (network truncation, log-rotation race)
#
# The `event.processing.failure.handling.mode` config decides what happens
# when ONE such event fails. Three modes:
#
#   fail (DEFAULT) — Log the error with FULL context (source position,
#                    event payload, offending DDL/row) and STOP the
#                    connector. Task transitions to FAILED. Operator is
#                    paged. The source offset does NOT advance, so the
#                    source-database's log (binlog here) is preserved
#                    by the slot/offset retention mechanism. Operator
#                    investigates, patches the parser / fixes the schema
#                    race / upgrades Debezium, and replays from the
#                    preserved offset. NO DATA IS LOST.
#
#   warn          — Log the error with FULL context but DO NOT stop the
#                   connector. The offending event is SKIPPED (not emitted
#                   to Kafka), the source offset IS ADVANCED past it.
#                   MySQL's binlog purge policy eventually prunes the
#                   segment containing the dropped event; the source-of-
#                   truth row change is gone. A forensic reconstruction is
#                   possible from old log archives + connector logs IF
#                   they are still available — typically the connector
#                   logs are rotated within days, so the window is short.
#
#   skip          — Same as `warn` but WITHOUT logging the failing event's
#                   context. The connector emits a generic "Skipped event
#                   due to processing failure" message and moves on. There
#                   is NO RECORD OF WHAT WAS LOST. Post-hoc reconstruction
#                   is IMPOSSIBLE.
#
# THE VIOLATION:
#
# This config sets `event.processing.failure.handling.mode = skip` —
# probably because some operator got tired of being paged when an upstream
# DBA ran an unusual DDL that the MySQL connector's parser stumbled on.
# The connector is now "stable" — it never fails. But every parser
# stumble, every out-of-band schema change, every binlog corruption event
# silently drops one or more events. The downstream consumers (the
# `inventory-reconciliation` system, the `search-index-updater`, the
# `audit-log` pipeline) see partial data. Discrepancies appear in
# downstream systems weeks or months later, with no log trail to
# reconstruct what was lost.
#
# REAL-WORLD INCIDENT SHAPES:
#
#   1. An `ALTER TABLE ... ALGORITHM=INSTANT` is run on `inventory.items`.
#      The older Debezium MySQL parser does not handle this DDL correctly.
#      With `skip`, the DDL is dropped. The schema cache no longer matches
#      the source schema. SUBSEQUENT row events for `inventory.items` fail
#      to decode (column-count mismatch) and are ALSO silently skipped.
#      A week later, the downstream warehouse shows the `items` table has
#      zero events since the DDL; reconciliation flags a 12% discrepancy;
#      the binlog has been pruned and recovery is impossible.
#
#   2. A network partition causes a partial event write to the binlog;
#      the partial event fails to decode. With `skip`, the event is
#      dropped silently. A customer reports a missing record months later.
#
#   3. A schema-evolution race: the application updates a column type;
#      between the DDL replay and the next row event, a few rows arrive
#      with the old schema. With `skip`, those rows are dropped. The
#      downstream count is off by 47 over the next year.
#
# FIX:
#
#   Remove this line (default `fail` is correct), OR set
#   event.processing.failure.handling.mode = fail explicitly.
#
# If event-processing failures are happening REPEATEDLY in production,
# the fix is to investigate and patch the underlying cause:
#   - Upgrade Debezium to a version with the parser fix
#   - Fix the upstream schema-evolution race
#   - Investigate disk-corruption signals
#   - Coordinate with DBAs to run DDLs the parser supports
#
# NEVER respond to event-processing failures by dropping the events.
# =============================================================================

name=orders-source
connector.class=io.debezium.connector.mysql.MySqlConnector
tasks.max=1

database.hostname=orders-db.internal
database.port=3306
database.user=debezium
database.password=changeme
database.server.id=12345
database.include.list=inventory
table.include.list=inventory.items,inventory.warehouses,inventory.stock_levels
topic.prefix=db.orders

schema.history.internal.kafka.topic=schema-history.orders-source
schema.history.internal.kafka.bootstrap.servers=kafka.internal:9092

# VIOLATION: silent data loss. When the connector fails to process a
# single event (DDL parser stumble, schema mismatch, corrupted binlog
# entry), the event is silently dropped and the source offset advances
# past it. The MySQL binlog purge policy eventually deletes the segment
# containing the dropped event, and the source-of-truth row change is
# permanently lost. The `skip` mode also DROPS the failing event's
# context, so post-hoc reconstruction is impossible. Should be `fail`
# (the default), which stops the connector and preserves the failing
# event at the source.
event.processing.failure.handling.mode=skip

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
