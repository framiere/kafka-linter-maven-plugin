# RULE: CONSUMER_PROPERTIES_ISOLATION_LEVEL_ABSENT.
#
# This consumer config is otherwise reasonable:
#   - group.id set
#   - deserializers set
#   - auto.offset.reset=earliest         (replay/analytics intent)
#   - enable.auto.commit=false           (at-least-once)
#   - max.poll.records=500               (explicit)
#   - max.poll.interval.ms=300000        (explicit)
#
# ...but it never sets `isolation.level`. kafka-clients defaults
# `isolation.level` to `read_uncommitted`, which means: the consumer
# fetches records up to the partition's HIGH WATERMARK (HW) and
# returns ALL of them — INCLUDING records from in-flight
# transactions (the producer has called `send()` but not yet
# `commitTransaction()`) and INCLUDING records from aborted
# transactions (the producer called `abortTransaction()` after
# `send()`).
#
# WHY THIS MATTERS HERE SPECIFICALLY:
#
# This consumer reads from the `orders-eos` topic, which is written
# by an upstream service using transactional producers (the upstream
# is correct: `transactional.id=order-service-tx`, `enable.idempotence=
# true`, and explicit `beginTransaction()` / `commitTransaction()` /
# `abortTransaction()` boundaries). The upstream correctly aborts
# orders that fail validation. The downstream consumer should see
# ONLY committed orders.
#
# With default `read_uncommitted`:
#   - downstream sees the in-flight orders (before commit) → records
#     are emitted to the analytics DB while still in-flight; the
#     transaction subsequently aborts; the analytics DB now contains
#     'orders' that the upstream considers to have NEVER EXISTED
#   - downstream sees the aborted orders → records appear in the
#     dashboard, then disappear from the topic's logical history when
#     a `read_committed` reader re-scans; analysts see ghost orders
#   - downstream's auto-commit (if enabled — here it's disabled) would
#     commit offsets PAST the aborted records → on restart, the
#     consumer would skip the records that WILL appear in the next
#     (committed) transaction, causing silent loss of the genuinely-
#     committed data
#
# WHY KAFKA STREAMS DOES NOT HAVE THIS PROBLEM:
#
# Kafka Streams' EOS mode (`processing.guarantee=exactly_once_v2`)
# sets `isolation.level=read_committed` AUTOMATICALLY on every
# internal consumer. Plain kafka-clients consumers (this file) do
# NOT — the operator MUST opt in explicitly.
#
# CONCRETE FAILURE SHAPES:
#
# (1) Ghost orders in the analytics dashboard.
#     Order-service correctly aborts orders that fail validation.
#     Analytics consumer uses default `read_uncommitted`. The
#     aborted orders appear in the daily report. Finance team
#     investigates 'orders for products that don't exist'; root
#     cause is the consumer's isolation level.
#
# (2) Compliance audit reading PII that was aborted.
#     Legal-retention consumer ingests a transactional events topic.
#     PII records that were aborted (because of a downstream
#     validation failure) are nevertheless stored in the compliance
#     log. Compliance violation; legal has to delete the audit
#     entries; root cause is the consumer's isolation level.
#
# (3) Low-latency 'monitoring' consumer reporting wrong p99.
#     Operator writes a 'low-latency' consumer to monitor produce
#     traffic for SLAs. Uses default `read_uncommitted`. Sees
#     records the moment they hit the broker, before the
#     transaction commits. SLA dashboard reports p99 = 8 ms but
#     downstream `read_committed` consumers see the same records
#     with p99 = 200 ms (waiting for commit). The dashboard is
#     measuring the wrong thing.
#
# (4) DR replay re-emits aborted-transaction records.
#     Disaster-recovery consumer is provisioned in a new region to
#     replay a transactional topic from earliest. Operator sets
#     `auto.offset.reset=earliest` but forgets `isolation.level=
#     read_committed`. Replay re-emits aborted-transaction records;
#     downstream systems re-act on records that should never have
#     been visible; data corruption that takes hours to root-cause.
#
# (5) Lag-monitoring discrepancy.
#     `read_committed` consumers have LSO-based lag (their consumer-
#     lag metric measures distance to the Last Stable Offset);
#     `read_uncommitted` consumers have HW-based lag (distance to
#     the High Watermark). When the producer side has open
#     transactions, these two metrics diverge by the transaction
#     duration. Mixed-isolation consumer groups produce confusing
#     lag dashboards — same topic, same group, very different lag
#     reported by sibling consumers.
#
# INFO severity (not WARNING/ERROR) because the default is
# workload-dependent: silently correct for NON-transactional topics
# (plain log streams, sensor data, web-clickstream events from a
# producer that does NOT set `transactional.id`), silently
# catastrophic for transactional (EOS) topics. The plugin cannot
# determine the producer's transactional intent from the consumer-
# side config alone. Raised here to ERROR by config override so the
# IT fixture demonstrates the violation deterministically.
#
# Fix: ONE LINE. `isolation.level=read_committed` for consumers of
# transactional topics (the safe default for any EOS-aware
# pipeline), OR `isolation.level=read_uncommitted` EXPLICITLY to
# document that uncommitted reads were deliberately chosen (e.g.,
# low-latency monitoring of in-flight transactions, or for topics
# that you KNOW are written only by non-transactional producers).
bootstrap.servers=kafka-1.prod.example.com:9092
group.id=orders-eos-analytics
client.id=bad-no-isolation-level-consumer
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
auto.offset.reset=earliest
enable.auto.commit=false
max.poll.records=500
max.poll.interval.ms=300000
session.timeout.ms=45000
