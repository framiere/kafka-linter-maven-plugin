name=debezium-orders-mysql
connector.class=io.debezium.connector.mysql.MySqlConnector
tasks.max=1

database.hostname=orders-mysql.internal
database.port=3306
database.user=debezium
database.password=secret
database.include.list=orders
database.server.id=192168

# Anti-pattern: this connector shares topic.prefix=cdc.orders with a peer
# Postgres connector (connect-debezium-orders-postgres.properties). Even
# though the two source databases are distinct, `topic.prefix` is the
# single namespace for ALL of a Debezium connector's CDC topics,
# transaction-metadata topic, schema-change topic, heartbeat topic
# suffix, source.name field, and JMX metric tags — collision here means
# events from both sources interleave into the same Kafka topics, JMX
# metrics merge, and downstream consumers cannot tell sources apart.
topic.prefix=cdc.orders

table.include.list=orders.legacy_orders,orders.legacy_order_items

schema.history.internal.kafka.topic=cdc.orders.mysql.schema-history
schema.history.internal.kafka.bootstrap.servers=kafka-1.prod.example.com:9092

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
