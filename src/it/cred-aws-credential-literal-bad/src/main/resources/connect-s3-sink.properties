# =============================================================================
# A Confluent S3 sink connector configuration where the operator hardcoded
# the IAM access-key-id and secret-access-key into the .properties file
# instead of relying on the EC2/EKS/ECS IAM instance-role chain or a KIP-297
# ConfigProvider.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#
#   aws.access.key.id     = AKIAIOSFODNN7EXAMPLE
#   aws.secret.access.key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
#
# Both are non-empty literal strings (no `${...}` placeholder syntax). Both
# values appear above as the textbook AWS-documentation example pair — they
# are NOT real credentials, but the pattern recognizers (GitHub Secret
# Scanning, gitleaks, trufflehog) and the kafka-lint rule treat any non-empty
# non-placeholder value the same way: as a credential that is about to leak.
#
# WHAT HAPPENS THE INSTANT THIS FILE LANDS IN GIT:
#
# (a) **GitHub Secret Scanning auto-detection.** GitHub's secret scanner
#     recognizes `AKIA[0-9A-Z]{16}` as an AWS access-key-ID format and
#     `aws_secret_access_key` / `AWS_SECRET_ACCESS_KEY` (or `aws.secret.
#     access.key`) in nearby lines as the matching secret. On a public repo,
#     the scanner notifies AWS within MINUTES; AWS sends an automated email
#     and may auto-quarantine the key. On a private repo with Advanced
#     Security enabled, the scanner blocks the push at the pre-receive
#     hook. Either way, the secret is now flagged across the org's audit
#     trail — even if the developer reverts the commit two minutes later,
#     it's in the audit log forever.
#
# (b) **gitleaks / trufflehog pre-merge scan.** Most security-aware orgs
#     run gitleaks (a pre-commit or CI scan) on every PR; trufflehog as a
#     periodic full-history sweep. Both detect AWS credential patterns. A
#     PR with `aws.access.key.id=AKIA...` in a .properties file fails the
#     scan; the merge is blocked. With THIS lint rule firing at the same
#     point, the developer gets a clearer message ("this is a credential
#     leak; use the IAM role chain or a ConfigProvider") than the generic
#     gitleaks "secret-detected" warning. The kafka-lint catch is BEFORE
#     the gitleaks scan in most CI pipelines (mvn verify runs early), so
#     the developer can fix the issue and re-push without ever exposing
#     the credential to the secret-scanning trail.
#
# (c) **Container image layer baked-in credential.** Even if the file
#     never reaches a public repo, the build packages this .properties
#     file into the connector's JAR, which is packaged into a Docker image,
#     which is pushed to ECR. Anyone with read access to the ECR repo can
#     pull the image, `docker save` it to a tarball, extract the JAR, and
#     read the credentials. This includes every CI/CD service account that
#     pulls images, every developer with `docker pull` rights, every
#     security scanner that runs on artifacts.
#
# (d) **Credential exfiltration via container exec.** Even WITHOUT image
#     leak, a connect-worker container's filesystem is accessible to anyone
#     with `kubectl exec` rights to the pod. The .properties file with the
#     credentials is readable by every cluster operator. On a connect
#     cluster shared across teams, that's potentially dozens of people.
#
# (e) **Reused-credential blast-radius amplification.** Operators often
#     reuse the same IAM access key across multiple connectors (S3 sink +
#     Kinesis source + DynamoDB sink) to avoid the friction of provisioning
#     multiple IAM principals. When the key leaks via any of (a)-(d), the
#     blast radius is every S3 bucket, every Kinesis stream, every DynamoDB
#     table the principal can access — not just the one this connector
#     uses.
#
# (f) **Once-leaked-key weaponization.** AWS keys leaked to public GitHub
#     repos are typically detected and weaponized by automated scrapers
#     within MINUTES — the time-to-abuse window is measured in dozens of
#     minutes, not days. Typical abuse: spin up GPU instances for crypto
#     mining (multi-thousand-dollar bills overnight), exfiltrate the
#     principal's S3 data, set up reverse-shell EC2 instances as pivots
#     into the org's VPC.
#
# (g) **Rotation friction.** Even when the leak is detected, rotating an
#     IAM access key requires: revoke the old key in IAM, generate a new
#     key, update the .properties file in EVERY git repo / container
#     image / Helm chart that referenced it, redeploy every connector,
#     verify. This is hours-to-days of operational work that gets skipped
#     or done halfway. By contrast, an IAM role attached to the connect-
#     worker's instance/pod auto-rotates the credentials every ~6 hours
#     via STS without ANY operator action.
#
# WHY THE CONFLUENT S3 SINK CONNECTOR ACCEPTS THESE KEYS AT ALL:
#
# The connector consults AWS's `DefaultAWSCredentialsProviderChain` to
# resolve credentials at startup. The chain has the following precedence
# order:
#
#   1. Environment variables: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
#   2. Java system properties: aws.accessKeyId / aws.secretKey
#   3. ~/.aws/credentials profile file (the AWS SDK default location)
#   4. Container credentials (ECS task role via AWS_CONTAINER_CREDENTIALS_
#      RELATIVE_URI)
#   5. Instance Metadata Service (IMDS / IMDSv2) on EC2/EKS providing the
#      attached IAM instance role
#
# The Confluent S3 sink ADDITIONALLY exposes `aws.access.key.id` /
# `aws.secret.access.key` as explicit config keys; when set, those values
# take precedence over the chain. The fallback exists primarily for
# environments where the chain genuinely isn't available (some on-prem
# Kubernetes deployments without IRSA / cross-cloud installs). The CORRECT
# fallback path for those environments is the KIP-297 ConfigProvider:
#
#   aws.access.key.id     = ${file:/run/secrets/aws:access-key}
#   aws.secret.access.key = ${vault:secret/data/aws#access_key}
#
# Both forms contain `${...}` and the lint rule explicitly accepts them as
# placeholder syntax. The lint rule fires only on non-empty literal values
# that do NOT contain `${`.
#
# WHY THIS IS AN ERROR-SEVERITY RULE (NOT WARNING):
#
# Long-lived IAM credentials in version control are the single largest
# source of AWS-account-takeover incidents — the AWS Trust & Safety team's
# public incident write-ups routinely cite "leaked access key in public
# GitHub repo" as the entry vector. The blast radius is amplified by the
# standard practice of reusing one IAM principal across multiple services
# (see (e) above). The leak path is direct and historically the most
# common AWS-account-takeover vector; the rule SHOULD block the build
# until the credential is removed.
#
# HOW SUCH .PROPERTIES FILES END UP IN GIT:
#
# (i) **Tutorial copy-paste.** Most Confluent S3 sink tutorials show
#     `aws.access.key.id=YOUR_ACCESS_KEY` and `aws.secret.access.key=
#     YOUR_SECRET_KEY` as placeholder syntax to demonstrate the connector.
#     Developers reading the tutorial replace `YOUR_ACCESS_KEY` with their
#     actual dev-account key, commit, and ship to git. The tutorial never
#     mentioned the IAM-role alternative, so the developer doesn't know
#     there is one. THIS RULE catches the tutorial-copy-paste case at PR
#     time.
#
# (ii) **Dev-on-laptop scenarios.** Developers running connect locally
#      (outside EC2/EKS/ECS) don't have an instance-role chain available,
#      so they hardcode a dev-account credential to get the connector
#      starting. The credential is committed "temporarily" for convenience
#      and never reverted before the PR lands. The fix is: use
#      `~/.aws/credentials` (which the chain consults at priority 3) and
#      a profile, NOT the .properties file.
#
# (iii) **"Production has instance roles but dev needs literals" mindset.**
#       The dev environment doesn't have IAM roles wired (because no one
#       provisioned them), so the team uses literals "for dev". The dev
#       .properties file with literals gets committed; later it gets
#       copy-pasted as the base for the production .properties file; the
#       production file is "edited" to point at the prod bucket but the
#       credentials are accidentally left in. The prod connector now ships
#       with dev credentials hardcoded — or worse, the dev credentials
#       are over-privileged and have prod access.
#
# (iv) **Cross-team handoff with leftover credentials.** Team A wrote the
#      initial connector config with their own dev credentials; Team B
#      took over and never noticed the credentials were still in the
#      .properties file because they were focused on the bucket-name and
#      topic-list configuration. The .properties file ships with Team A's
#      credentials still embedded.
#
# (v) **Helm-chart values.yaml.** An operator writes
#     `awsAccessKeyId: AKIA...` into a Helm chart's `values.yaml` instead
#     of the K8s Secret pattern (`valueFrom: secretKeyRef`). The values
#     file is committed to git; the credential is now in a Helm-chart
#     repo alongside the rest of the deployment manifests. This rule
#     doesn't catch the values.yaml case directly (this rule scans
#     .properties files), but the same anti-pattern applies — and the
#     fix is the same: use a K8s Secret + KIP-297 ConfigProvider, NOT a
#     literal.
#
# THE FIX (PREFERRED):
#
# Remove the `aws.access.key.id` and `aws.secret.access.key` keys from
# this .properties file entirely. Provision an IAM role for the connect-
# worker pod/instance (IRSA on EKS, IAM Roles for Service Accounts on
# Kubernetes, IAM instance profile on EC2, IAM task role on ECS). The
# connector's `DefaultAWSCredentialsProviderChain` will resolve the role
# automatically at startup; STS will auto-rotate the credentials every
# ~6 hours; the .properties file stays clean.
#
# THE FIX (FALLBACK, FOR ENVIRONMENTS WITHOUT IAM ROLES):
#
# Use the KIP-297 ConfigProvider to inject the values at runtime from a
# secrets-manager source. Examples:
#
#   aws.access.key.id     = ${file:/run/secrets/aws:access-key}
#   aws.secret.access.key = ${file:/run/secrets/aws:secret-key}
#
#   aws.access.key.id     = ${vault:secret/data/aws#access_key}
#   aws.secret.access.key = ${vault:secret/data/aws#secret_key}
#
#   aws.access.key.id     = ${env:AWS_ACCESS_KEY_ID}
#   aws.secret.access.key = ${env:AWS_SECRET_ACCESS_KEY}
#
# The .properties file then contains a TEMPLATE; the secret material is
# pulled from the secrets-manager at connector startup. The .properties
# file is safe to commit because it contains no credential material.
#
# =============================================================================

name=customer-events-s3-sink
connector.class=io.confluent.connect.s3.S3SinkConnector
tasks.max=4
topics=customer.events

s3.bucket.name=my-prod-customer-events-bucket
s3.region=us-east-1

# VIOLATION: aws.access.key.id and aws.secret.access.key set to literal,
# non-empty, non-placeholder values. Once this file lands in git, the
# credentials are flagged by GitHub Secret Scanning / gitleaks / trufflehog
# and may be auto-quarantined by AWS. The values below are the textbook
# AWS-documentation example pair (NOT real credentials) but the
# pattern-recognizers and the kafka-lint rule treat any non-empty
# non-placeholder value the same way. Fix: remove these keys and use the
# EC2/EKS/ECS IAM role chain (DefaultAWSCredentialsProviderChain), or
# inject via KIP-297 ConfigProvider (${file:...}, ${vault:...}, ${env:...}).
aws.access.key.id=AKIAIOSFODNN7EXAMPLE
aws.secret.access.key=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY

format.class=io.confluent.connect.s3.format.json.JsonFormat
storage.class=io.confluent.connect.s3.storage.S3Storage

flush.size=1000
rotate.interval.ms=300000

partitioner.class=io.confluent.connect.storage.partitioner.HourlyPartitioner
path.format='year'=YYYY/'month'=MM/'day'=dd/'hour'=HH
locale=en
timezone=UTC
timestamp.extractor=Record

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false
