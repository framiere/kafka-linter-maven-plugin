# RULE: STREAMS_PROPERTIES_DEFAULT_PRODUCTION_EXCEPTION_HANDLER_ABSENT.
#
# This Streams config is otherwise reasonable:
#   - application.id set                          (group identity)
#   - bootstrap.servers set
#   - default serdes set
#   - replication.factor=3                        (changelog topics RF=3)
#   - processing.guarantee=exactly_once_v2        (EOS opted in)
#   - num.stream.threads=8                        (parallelism declared)
#   - state.dir set to a persistent path
#   - default.deserialization.exception.handler   (input-side handler set)
#
# ...but it never sets `default.production.exception.handler`.
# Kafka Streams defaults this to `DefaultProductionExceptionHandler`.
#
# THE BUG SHAPE THIS RULE CATCHES:
#
# `default.production.exception.handler` controls what happens when
# the Streams embedded producer cannot deliver a record to the
# broker (the producer's send-callback fires with an exception):
#
#   - DefaultProductionExceptionHandler (DEFAULT):
#       Returns `ProductionExceptionHandlerResponse.FAIL` for EVERY
#       exception. The FAIL response propagates through Streams'
#       `RecordCollectorImpl` as a `StreamsException`, which the
#       StreamThread's uncaught-exception handler catches; by
#       default the StreamThread DIES, and (with the default
#       `SHUTDOWN_CLIENT` response code) the entire KafkaStreams
#       instance shuts down. With `num.stream.threads=1` (the
#       implicit default), the entire topology stops. With multiple
#       threads, the surviving threads continue but the dead
#       thread's tasks rebalance to them — increasing their load
#       until another oversized record triggers the same handler.
#
#   - LogAndContinueProductionExceptionHandler (Kafka 3.9+, KIP-1033):
#       Returns `CONTINUE` for retriable-but-exhausted exceptions
#       (skip and move on). The topology keeps processing; the
#       dropped record is logged and counted via the `dropped-
#       records-total` metric. Operators alert on the metric.
#
#   - LogAndFailProductionExceptionHandler:
#       Same as the default but EXPLICIT. The right choice when
#       fail-fast is the deliberate intent (financial settlement,
#       regulatory reporting where every record matters).
#
#   - Custom handler (operator-supplied):
#       Typically routes the failing record to a DLQ topic via a
#       separate producer, then returns CONTINUE so the topology
#       moves on. The DLQ topic is consumed by a dead-letter
#       handler that triages the failed records out of band.
#
# CONCRETE FAILURE MODES — ALL ROOTED IN THE DEFAULT FAIL-ON-EVERY-EXCEPTION:
#
# (1) Aggregation blew up output record size.
#     A Streams topology performs a `KTable.groupBy().aggregate()`
#     that builds up a JSON-encoded set of all values seen for a
#     key. Some keys accumulate hundreds of thousands of entries;
#     the encoded output exceeds the broker's
#     `message.max.bytes=1048576` (1 MiB default). The producer
#     throws `RecordTooLargeException`; default handler returns
#     FAIL; StreamThread dies; topology halts. Recovery requires
#     either (a) increasing `message.max.bytes` on the changelog
#     topic + adding capacity, OR (b) restructuring the topology
#     to bound output size, OR (c) switching to
#     `LogAndContinueProductionExceptionHandler` to skip the
#     oversized records and alert on the metric.
#
# (2) Join blew up value size.
#     A `KStream.join(KTable, ...)` produces output records whose
#     value size is the SUM of the left value and the right value.
#     When the right-side KTable's values grow over time (e.g., a
#     customer-profile KTable that accumulates more attributes per
#     upgrade), the join output eventually exceeds
#     `message.max.bytes`. Operators see a clean topology working
#     fine for 6 months, then a sudden crash. The KTable changelog
#     compaction does NOT shrink values — it only shrinks the
#     number of keys.
#
# (3) Custom Serde adds overhead.
#     A custom Avro Serde with full reflection-based encoding adds
#     30% overhead vs hand-tuned serialization. A topology
#     designed against a 700 KiB record size suddenly produces 910
#     KiB records that exceed the broker's
#     `message.max.bytes=1048576` after the Serde upgrade. The fix
#     is to either tune `message.max.bytes` on the topic OR switch
#     to a non-failing production exception handler.
#
# (4) Repartition topic auto-created with default max.message.bytes.
#     Streams auto-creates repartition and changelog topics using
#     the worker's default `default.replication.factor` and
#     `min.insync.replicas` — but `message.max.bytes` is broker-
#     level and defaults to 1048588 (1 MiB minus a tiny header
#     allowance). Operators who tuned their PRODUCTION topics to
#     `max.message.bytes=10485760` (10 MiB) for big-record support
#     are unprepared when the Streams-auto-created repartition
#     topics inherit the broker default 1 MiB.
#     RecordTooLargeException fires on the FIRST oversized record.
#
# (5) Authorization revoked mid-run.
#     SASL credentials are rotated; the operator forgets to update
#     the Streams app's secret; the next produce attempt throws
#     `AuthorizationException`; default handler returns FAIL;
#     StreamThread dies. With
#     `LogAndContinueProductionExceptionHandler`, the records
#     would be skipped and the operator would have time to rotate
#     the credentials before downstream consumers notice.
#
# (6) Topic deleted but consumed.
#     Operator manually deletes a destination topic during a
#     routine cleanup; Streams' next produce-to-that-topic throws
#     `UnknownTopicOrPartitionException`; default handler returns
#     FAIL; StreamThread dies. The right fix is to NOT delete
#     topics that Streams writes to, but the secondary defense is
#     a non-failing production exception handler that buys
#     recovery time.
#
# (7) Transient broker-side errors stack up.
#     Under a rolling-broker-restart, the producer may exhaust its
#     `retries × retry.backoff.ms` budget on a single partition
#     while the new leader is elected; the resulting
#     `TimeoutException` reaches the production exception handler;
#     default handler returns FAIL; StreamThread dies. With a
#     more-tolerant handler, the record is dropped, the operator
#     alerts on `dropped-records-total`, and the topology keeps
#     processing the OTHER partitions while the affected partition
#     waits for the new leader.
#
# WHY THIS RULE IS INFO (NOT WARNING/ERROR):
#
# Fail-fast on production errors is a defensible choice for some
# workloads: financial settlement (every record matters; better to
# crash and alert than to silently drop), regulatory reporting,
# legal audit trails. For those workloads, the operator should set
# `default.production.exception.handler=org.apache.kafka.streams.errors.DefaultProductionExceptionHandler`
# (or LogAndFail) EXPLICITLY to document the deliberate choice.
#
# For the majority of Streams workloads (analytics, event-driven
# processing, ETL), CONTINUE is the right answer for at least the
# broker-rejection exceptions (RecordTooLargeException,
# MessageSizeTooLargeException) — losing one oversized record is
# better than halting the entire pipeline. The fact that the
# default is fail-fast for everything (including transient
# exhausted-retry timeouts) means the absent-handler config is
# overwhelmingly an accident.
#
# Sibling rule:
# `STREAMS_PROPERTIES_DEFAULT_DESERIALIZATION_EXCEPTION_HANDLER_ABSENT`
# catches the input-side equivalent (poison-record handling on
# read). Together they cover the two boundaries of the Streams
# topology.
#
# Fix: ONE LINE.
#   - For resilient workloads (Kafka 3.9+):
#     `default.production.exception.handler=org.apache.kafka.streams.errors.LogAndContinueProductionExceptionHandler`
#     Skip the failing record, log it, alert via the
#     `dropped-records-total` metric.
#   - For fail-fast workloads:
#     `default.production.exception.handler=org.apache.kafka.streams.errors.DefaultProductionExceptionHandler`
#     EXPLICITLY (or LogAndFail) to document the deliberate
#     fail-fast choice.
#   - For custom routing:
#     A custom handler that ships failing records to a DLQ topic
#     via a separate producer and returns CONTINUE.
application.id=settlements-streams-app
bootstrap.servers=kafka-1.prod.example.com:9092,kafka-2.prod.example.com:9092,kafka-3.prod.example.com:9092
default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
default.value.serde=org.apache.kafka.common.serialization.Serdes$ByteArraySerde
replication.factor=3
processing.guarantee=exactly_once_v2
num.stream.threads=8
state.dir=/var/lib/settlements-streams-app/state
default.deserialization.exception.handler=org.apache.kafka.streams.errors.LogAndContinueExceptionHandler
