# RULE: CONSUMER_PROPERTIES_MAX_POLL_RECORDS_ABSENT.
#
# This consumer config is otherwise reasonable:
#   - group.id set
#   - serializers set
#   - auto.offset.reset=earliest (replay/analytics intent)
#   - enable.auto.commit=false   (at-least-once)
#
# ...but it never sets `max.poll.records`. kafka-clients defaults
# `max.poll.records` to `500` and `max.poll.interval.ms` to `300000`
# (5 min).
#
# Why this matters HERE specifically: the implicit pairing
# (max.poll.records, max.poll.interval.ms) must satisfy
#   p99-per-record-cost × max.poll.records < max.poll.interval.ms × 0.5
#
# With defaults: 500 × p99-cost < 150000 ms → p99-cost < 300 ms.
# Workloads where each record needs an external HTTP call, an LLM
# inference, an external DB write, or a complex transform routinely
# exceed 300 ms per record — and the operator never realized that
# their per-record cost combined with the default batch size sits
# above the rebalance-storm threshold.
#
# CONCRETE FAILURE MODE:
#
# A consumer enriches each record with an external HTTP API call:
#   - p99 of external call: 800 ms
#   - default max.poll.records: 500
#   - per-batch cost: 500 × 800 ms = 400 s = 6.6 minutes
#   - max.poll.interval.ms default: 300000 ms = 5 minutes
#   - per-batch cost > max.poll.interval.ms → consumer evicted mid-batch
#   - partition rebalances to another consumer in the group
#   - new owner also takes 6.6 minutes → evicted again
#   - rebalance storm; records-lag-max climbs without bound;
#     last-rebalance-seconds-ago constantly resetting
#
# Operators see "consumer lag growing" in dashboards, look at broker
# metrics (they're fine), and discover hours later that the root
# cause is the implicit batch sizing.
#
# INFO severity (not WARNING/ERROR) because the default 500 is
# defensible for typical fast-processing consumers (<100 ms/record)
# — the rule is a 'have you thought about p99-per-record-cost ×
# batch-size?' nudge. Raised here to ERROR by config override so the
# IT fixture demonstrates the violation deterministically.
#
# Fix: ONE LINE. `max.poll.records=100` for slow per-record cost
# (HTTP, LLM, DB), `max.poll.records=5000` for bulk fast processing
# (<1 ms/record), or `max.poll.records=500` EXPLICITLY to document
# that the default was deliberately chosen.
bootstrap.servers=kafka-1.prod.example.com:9092
group.id=orders-enrichment
client.id=bad-no-max-poll-records-consumer
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
auto.offset.reset=earliest
enable.auto.commit=false
