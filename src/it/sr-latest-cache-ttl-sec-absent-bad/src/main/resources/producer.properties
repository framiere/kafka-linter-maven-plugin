# =============================================================================
# IT fixture: SR_LATEST_CACHE_TTL_SEC_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A producer .properties file destined for a long-running
#   `KafkaProducer<String, SpecificRecord>` that emits Avro records
#   via Confluent's `KafkaAvroSerializer`. The producer is
#   `payment-events-producer` — the canonical payment-event-
#   emitter for a payments processor. It runs as a Java daemon
#   inside a 12-pod EKS deployment, produces ~8k events/sec to
#   the `payments` topic (48 partitions, replication-factor=3),
#   and is INTENTIONALLY long-lived: typical JVM uptime is
#   30-60 days between deploys (the payments service follows a
#   strict change-management process — only critical fixes
#   redeploy out-of-band).
#
#   Schemas are managed via a centralized Confluent Schema
#   Registry. The org practices "Category-A producer hardening"
#   per Confluent's compliance taxonomy: producers cannot
#   register new schemas (governance gate is enforced via
#   `auto.register.schemas=false`), and producers must follow
#   the LATEST registered schema version (via `use.latest.
#   version=true`) so that Terraform-managed schema-evolution
#   propagates without requiring producer redeploys.
#
#   Every other Schema Registry knob and producer-hardening
#   knob is set correctly — `schema.registry.url` (HTTPS + basic
#   auth), `auto.register.schemas=false`, `use.latest.version=
#   true`, `latest.compatibility.strict=true`, `normalize.
#   schemas=true`, `key.serializer` + `value.serializer`,
#   `acks=all`, `enable.idempotence=true`, `compression.type=
#   zstd`, etc. The ONLY missing knob is `latest.cache.ttl.sec`.
#
# What's wrong
#   `latest.cache.ttl.sec` is the TTL on Confluent's per-subject
#   latest-version cache. Per KIP-906 (Confluent SR client 7.0,
#   July 2022), the knob defaults to `-1` — meaning the cache
#   NEVER EXPIRES.
#
#   The Category-A producer combination depends on the cache
#   actually refreshing for `use.latest.version=true` to
#   function as intended:
#
#     - Producer first send → calls `getLatestSchemaMetadata
#       (subject)` → HTTP GET to SR → fetches version N's
#       schema-ID → caches it in the `latestVersions` map.
#     - Producer second send (5 minutes later) → checks the
#       cache → entry exists and (per default -1 TTL) is
#       considered ALWAYS FRESH → returns the cached version
#       N's schema-ID → NO network round-trip to SR.
#     - Terraform registers version N+1 the next day → SR
#       now has version N+1 as latest.
#     - Producer third send (next day) → checks the cache →
#       entry STILL VALID (TTL is -1 = no expiry) → still
#       returns version N's schema-ID → still NO network
#       round-trip.
#     - For the entire JVM lifetime (30-60 days for this
#       payments service), the producer is PINNED to version
#       N's schema-ID. Every new compatible field registered
#       in versions N+1, N+2, N+3, ... is invisible.
#
#   When `latest.cache.ttl.sec=300` is set (5 minutes —
#   Confluent's documented recommendation):
#
#     - Producer first send → fetches version N → caches with
#       `cached-at-timestamp`.
#     - Producer fourth send (5 minutes 1 second later) →
#       cache check sees `cached-at + 300 * 1000 < now` →
#       cache MISS → HTTP GET to SR → fetches version N
#       (still latest) → caches with fresh timestamp.
#     - Terraform registers version N+1 → cache entry is
#       stale within 5 minutes.
#     - Producer send post-Terraform → cache MISS → fetches
#       version N+1 → writes records with the new field
#       populated.
#
# This fixture's specific risk
#   THIS producer is the payments-events emitter with strict
#   change-management (30-60 day JVM uptime). The payments team
#   manages schema evolution via Terraform; a typical month
#   sees 1-2 compatible field additions (new payment-rail
#   support, new fraud-signal fields, new merchant-metadata
#   fields). With `latest.cache.ttl.sec=-1` (the default for
#   this fixture's absent setting):
#
#     - Month 1: Terraform adds `is_subscription_renewal`
#       (boolean). The downstream fraud-detection consumer
#       updates its code to read this field. Producer keeps
#       emitting with version N (no `is_subscription_renewal`
#       field set). Consumer sees `is_subscription_renewal=
#       null` for every record. Fraud-detection accuracy
#       degrades silently — the model treats null as 'not a
#       renewal', biasing toward FALSE POSITIVES on legitimate
#       subscription charges.
#     - Month 2: Terraform adds `network_token_used`
#       (boolean). Same shape: consumer expects it, producer
#       doesn't emit it, model bias compounds.
#     - Month 3: A fraud incident occurs. Post-mortem
#       discovers the model has been operating on missing
#       fields for 60+ days. Root cause: the producer cache
#       is permanent.
#
#   The estimated business impact for a payments processor at
#   this scale: ~$50k/month in additional manual-review costs
#   from false-positive fraud flags, plus reputational impact
#   from legitimate transactions blocked at checkout.
#
# Why this is "INFO" by default (not WARNING or ERROR)
#   (a) Some narrow legitimate cases want pinned-version
#       behavior: a producer following strict change-
#       management discipline that should NOT pick up new
#       schemas until JVM restart (deliberate pinning for
#       auditability or for change-freeze periods).
#
#   (b) The knob requires Confluent SR client 7.0+ (July 2022);
#       pre-7.0 clients have no override and the cache is
#       permanent regardless. The linter cannot verify the
#       client version from .properties alone.
#
#   (c) Many producers run short-lived (Kubernetes Jobs,
#       request-scoped producers, lambda-style functions) and
#       are restarted frequently enough that the cache
#       permanence is not observable.
#
#   (d) The bug shape is delayed and cumulative — only
#       observable in long-lived JVMs after a schema-evolution
#       event. INFO is the right level: surfaces the missing
#       knob and prompts a deliberate change-management choice
#       without false-alarming the short-lived workloads.
#
#   This IT overrides severity to ERROR via pom.xml
#   `<severities>` block to force the build to fail and verify
#   the rule fires.
#
# Common bug shapes
#   (1) Terraform-managed schema registration.
#       Org has CI/CD that registers schema versions via
#       Terraform's `confluent_schema` resource. New compatible
#       fields land in SR; producers using auto.register=false +
#       use.latest=true (but no TTL) keep emitting with the
#       old cached version — for weeks until redeployed for an
#       unrelated reason.
#
#   (2) Helm-chart Category-A defaults.
#       Internal Helm chart templates the Category-A
#       combination (auto-register=false, use-latest-version=
#       true) as defaults but omits latest.cache.ttl.sec.
#       Every Spring Boot producer inherits the permanent
#       cache.
#
#   (3) Long-lived JVMs.
#       Streams apps, ingestion daemons, batch processors
#       running 30+ days between deploys silently ignore every
#       schema-registration in that window.
#
#   (4) Multi-team schema evolution under Category-A.
#       Team A registers Monday; Team B's producers (Category-A
#       but no TTL) keep emitting last-week-schema-ID for
#       weeks; Team C's freshly-deployed producer immediately
#       picks up the new schema; consumers see a mix of
#       records.
#
#   (5) Confluent docs ambiguity.
#       Security-hardening guide enables use.latest.version=
#       true but mentions latest.cache.ttl.sec only in the
#       Advanced Configuration section that developers skip.
#
#   (6) Spring Boot autoconfig default-leak.
#       `KafkaAutoConfiguration` does NOT set this knob. Every
#       Spring Boot Kafka producer using Confluent SR inherits
#       -1 by default. Org-wide cache permanence by accident.
#
# Fix
#   ONE LINE.
#
#   For typical refresh-on-cadence (THIS fixture's target):
#     latest.cache.ttl.sec=300   # 5 minutes — Confluent's
#                                  # documented recommendation
#                                  # for schema-evolution
#                                  # latency budgets
#
#   For slower schema-evolution orgs (weekly cadence):
#     latest.cache.ttl.sec=3600  # 1 hour
#
#   For high-velocity schema-evolution (sub-minute cadence,
#   e.g., feature-flag-driven schema flags):
#     latest.cache.ttl.sec=60    # 1 minute
#
#   For Spring Boot apps:
#     spring.kafka.properties.latest.cache.ttl.sec=300
#
#   For deliberate pinning (change-management discipline):
#     latest.cache.ttl.sec=-1    # PIN to first-cached version
#                                  # until JVM restart — paired
#                                  # with documentation
#                                  # explaining the rationale.
#     # Setting the key explicitly to -1 disables this rule's
#     # trigger (the rule only fires on UNSET, not explicit -1
#     # with documentation).
#
# Sibling rules
#   `SR_USE_LATEST_VERSION_MISSING` — the half-migrated state
#   where use.latest.version is unset entirely. Orthogonal to
#   this rule's gap: that rule catches second-knob-missing;
#   this rule catches third-knob-missing.
#
#   `SR_AUTO_REGISTER_SCHEMAS_TRUE` — the Category-C-not-yet-
#   migrated state. Orthogonal but related — without the
#   Category-A hardening this rule's gap doesn't matter.
#
#   `SR_LATEST_COMPATIBILITY_STRICT_FALSE` — the disabled-gate
#   state. Interacts with this knob — stale cached-latest
#   means stale compatibility checks.
#
#   `SR_NORMALIZE_SCHEMAS_ABSENT` — orthogonal canonicalization
#   concern, but both surface as "default-is-wrong-for-modern-
#   deployments" (Confluent kept defaults backward-compatible
#   with pre-6.0/7.0 clients).
# =============================================================================

# Producer identity + cluster connectivity.
client.id=payment-events-producer
bootstrap.servers=broker-1.kafka.prod.example.com:9092,broker-2.kafka.prod.example.com:9092,broker-3.kafka.prod.example.com:9092

# Avro serdes via Confluent.
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=io.confluent.kafka.serializers.KafkaAvroSerializer

# Schema Registry — HTTPS endpoint, shared across the org.
schema.registry.url=https://schema-registry.kafka.prod.example.com:8081

# SR auth — BASIC over TLS (env-injected, not literal).
basic.auth.credentials.source=USER_INFO
basic.auth.user.info=${SR_USER_INFO}

# Category-A producer hardening — both knobs flipped correctly.
# (This fixture is NOT firing SR_AUTO_REGISTER_SCHEMAS_TRUE or
# SR_USE_LATEST_VERSION_MISSING — those preconditions are
# satisfied. The bug is the MISSING THIRD KNOB: latest.cache.
# ttl.sec.)
auto.register.schemas=false
use.latest.version=true
latest.compatibility.strict=true

# Canonicalization gate — set correctly so SR_NORMALIZE_
# SCHEMAS_ABSENT doesn't fire. The cache-TTL bug is
# orthogonal to canonicalization but both default to "wrong
# for modern deployments" in Confluent's framework — this
# fixture isolates the TTL bug.
normalize.schemas=true

# Idempotence + acks=all = exactly-once-producer posture.
acks=all
enable.idempotence=true
max.in.flight.requests.per.connection=5
retries=2147483647
delivery.timeout.ms=180000

# Throughput tuning.
compression.type=zstd
linger.ms=20
batch.size=131072

# Memory budget for in-flight batches.
buffer.memory=67108864

# Request-level timeout.
request.timeout.ms=30000

# Client-rack for fetcher locality (declared on producer for
# symmetry with paired consumer configs).
client.rack=us-east-1a

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# MISSING:
#   latest.cache.ttl.sec=300
# Without this key, Confluent's `AbstractKafkaAvroSerDeConfig`
# defaults `latest.cache.ttl.sec` to `-1` (no expiry). Per KIP-
# 906 (Confluent SR client 7.0, July 2022), this is the TTL on
# the per-subject latest-version cache. With the default -1,
# the producer's `latestVersions` ConcurrentHashMap entry for
# each subject is cached at first send and NEVER REFRESHES for
# the JVM lifetime. Even though `use.latest.version=true` is
# set (the producer is SUPPOSED to follow latest), the cache
# permanence pins the producer to whatever was "latest" at
# first send. For THIS app — a payments-events producer with
# 30-60 day JVM uptime under strict change-management — every
# Terraform-registered schema-evolution event (typical: 1-2
# compatible field additions per month) is invisible to the
# producer for the rest of its lifetime. Downstream consumers
# using the new schema project missing-newer-fields to
# defaults — silent semantic data loss. For typical refresh-
# on-cadence: `latest.cache.ttl.sec=300` (5 minutes — Confluent's
# documented recommendation). For Spring Boot:
# `spring.kafka.properties.latest.cache.ttl.sec=300`. For
# deliberate pinning (change-management discipline): set the
# key explicitly to `-1` with documentation explaining the
# rationale — the explicit value disables this rule's trigger.
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
