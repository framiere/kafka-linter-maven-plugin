name=customers-cdc
connector.class=io.debezium.connector.postgresql.PostgresConnector
tasks.max=1

database.hostname=customers-db.internal
database.port=5432
database.user=debezium
database.password=changeme
database.dbname=customers

topic.prefix=cdc.customers
slot.name=debezium_customers
schema.history.internal.kafka.topic=cdc.customers.schema-history
schema.history.internal.kafka.bootstrap.servers=kafka:9092

# Anti-pattern: BOTH table.include.list AND table.exclude.list set on the
# same scope. Debezium's documented behavior is 'include wins'; the
# exclude list is silently dropped with a single WARN log line at
# connector start, rarely caught in log aggregation. The operator thinks
# customers.deleted_records is being filtered out (perhaps it was added
# for compliance — soft-delete records should not flow downstream), but
# the connector continues to capture it because the include list is
# preempting the exclude rule.
table.include.list=public.customers,public.deleted_records,public.addresses
table.exclude.list=public.deleted_records

# Anti-pattern compounded on a second scope: column-level PII filtering
# is ALSO silently broken. The operator wrote column.exclude.list to
# drop the social_security_number and date_of_birth columns from the
# Kafka topic for compliance — but column.include.list is also set, so
# the exclude is silently dropped. The PII columns are still in the
# Kafka topic. This is the #1 cause of compliance-audit findings in
# Debezium-using organizations.
column.include.list=public.customers.id,public.customers.email,public.customers.name,public.customers.social_security_number,public.customers.date_of_birth
column.exclude.list=public.customers.social_security_number,public.customers.date_of_birth

snapshot.mode=initial

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
