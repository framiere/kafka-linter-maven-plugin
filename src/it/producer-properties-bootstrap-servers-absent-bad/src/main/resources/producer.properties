# RULE: PRODUCER_PROPERTIES_BOOTSTRAP_SERVERS_ABSENT.
#
# This producer config is otherwise reasonable:
#   - key.serializer set                  (StringSerializer)
#   - value.serializer set                (ByteArraySerializer)
#   - client.id set                       (identifies this producer instance)
#   - acks=all                            (durable writes)
#   - enable.idempotence=true             (exactly-once-per-partition)
#   - compression.type=zstd               (good — compressed batches)
#   - linger.ms=20                        (good — batching window opened)
#   - batch.size=131072                   (good — 128 KiB batches)
#   - buffer.memory=67108864              (good — 64 MiB accumulator)
#   - delivery.timeout.ms=120000          (good — bounded send window)
#
# ...but it never sets `bootstrap.servers`.
#
# THE BUG SHAPE THIS RULE CATCHES:
#
# `bootstrap.servers` is the FIRST required config for ANY Kafka
# client (producer, consumer, AdminClient, Streams). It is a
# comma-separated list of `<host>:<port>` entries that the client
# uses to discover the cluster topology — at startup, the client
# connects to ANY ONE of the listed brokers, requests the current
# Metadata response (which lists ALL brokers in the cluster,
# current partition leaderships, etc.), and uses that metadata for
# all subsequent operations. The list is a BOOTSTRAP list — once
# the client is connected, it speaks to ALL brokers in the cluster,
# not just the bootstrap ones. The recommendation is to list 2-3
# brokers (for redundancy at startup — if the first broker is
# unreachable, the client tries the next), not the entire cluster.
#
# For a plain kafka-clients PRODUCER specifically, `bootstrap.servers`
# is consumed by the producer's internal `NetworkClient` to populate
# the initial `MetadataCache`. Without it, the producer cannot
# discover which broker hosts the leader for any partition, and
# `send()` has nowhere to dispatch records.
#
# `ProducerConfig.BOOTSTRAP_SERVERS_CONFIG` is declared with:
#
#     ConfigDef.Type.LIST
#     NO default value
#     importance HIGH
#     validator: ConfigDef.NonEmptyListValidator
#
# When the operator constructs `new KafkaProducer<>(props)`, the
# constructor calls `AbstractConfig.parse(props)` which:
#
#   (a) Requires every key with no default to be present in props,
#       throwing `ConfigException: Missing required configuration
#       "<key>" which has no default value` otherwise.
#   (b) Runs all validators, throwing `ConfigException: Invalid
#       value [] for configuration bootstrap.servers: At least one
#       bootstrap server must be specified` for an empty list.
#
# Either way, the failure is SYNCHRONOUS, at constructor time,
# BEFORE the first `send()` call, BEFORE any network I/O.
#
# The application's main() method gets the ConfigException and
# (typically) exits non-zero; Kubernetes restarts the pod; the
# pod's next start fails for the same reason → CrashLoopBackOff.
#
# CONCRETE FAILURE MODES:
#
# (1) Partial-template copy.
#     Operator creates a new producer service by copying a portion
#     of an existing config — they grab the serializers, the
#     acks=all line, the idempotence flag, the compression — but
#     miss the bootstrap.servers line at the top. Deploy fails with
#     `ConfigException: Missing required configuration
#     "bootstrap.servers" which has no default value`. Recovery is
#     fast (add the line, re-deploy) but the 10-minute round-trip
#     per attempt adds up across multiple missed keys.
#
# (2) Per-environment overlay missing.
#     Dev and staging have a Kustomize patch that supplies
#     bootstrap.servers via a configmap injection. The production
#     overlay was supposed to do the same but the configmap-name
#     was changed in a refactor and the patch's selector no longer
#     matches. Production deploy fails with the missing-config
#     error. Investigation: 30 minutes of git-blame and configmap-
#     listing before someone notices the mismatch.
#
# (3) Env-var indirection broken.
#     Operator writes `bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}`
#     thinking the app's config-loader resolves env-vars, but the
#     app uses plain `Properties.load(reader)` which does NOT
#     resolve placeholders. The literal string
#     `${KAFKA_BOOTSTRAP_SERVERS}` is parsed as a single bootstrap-
#     server entry; the Kafka client tries to resolve the hostname
#     `${KAFKA_BOOTSTRAP_SERVERS}` via DNS, fails with
#     `UnknownHostException`, and the producer retries forever.
#
# (4) Helm-render empty value.
#     Helm chart has `bootstrap.servers: {{ .Values.bootstrapServers
#     }}` and the values.yaml omits the key (perhaps because the
#     team moved bootstrap-servers to a sibling chart's values).
#     The rendered .properties has `bootstrap.servers=` (empty).
#     NonEmptyListValidator rejects the empty list with
#     `ConfigException: At least one bootstrap server must be
#     specified`.
#
# (5) Refactor removes the line as 'externalized.'
#     A team member 'cleans up' the producer config by removing the
#     bootstrap.servers line and adding a comment `# externalized
#     via SPRING_PROFILES_ACTIVE`. But the app is plain Java, not
#     Spring Boot — there's no profile system in play. Deploy
#     fails. The 'cleanup' PR was accepted by a reviewer who saw
#     the externalization comment and assumed the mechanism was in
#     place.
#
# (6) Local-dev .properties promoted to staging.
#     Operator's local-dev .properties has `bootstrap.servers=
#     localhost:9092`. They check in the file and an automated
#     build promotes it through staging. In staging the pod
#     resolves `localhost:9092` to its own pod IP, finds nothing
#     listening, and fails with connection-refused indefinitely.
#     (Sibling rule `KAFKA_BOOTSTRAP_SERVERS_LOCALHOST` catches
#     this localhost-leak case as a separate violation.)
#
# WHY THIS RULE IS ERROR (NOT WARNING/INFO):
#
# The framework REJECTS the config deterministically. There is no
# scenario where absence is correct for a plain-Java producer app —
# the validator runs at parse time before any record is sent. The
# static-analysis catch produces zero false positives: any
# producer-shaped .properties (top-level `key.serializer` or
# `value.serializer`, no application.id, no connector.class)
# without bootstrap.servers is unambiguously broken when used
# directly.
#
# Edge case: configs intended for a framework that resolves
# placeholders or supplies bootstrap.servers via a different
# mechanism (Spring Boot's spring.kafka.bootstrap-servers, Quarkus
# kafka.bootstrap.servers, Helm template overlays) — those configs
# may legitimately omit bootstrap.servers because the framework
# injects it. The rule is gated on a TOP-LEVEL `key.serializer` or
# `value.serializer`; Spring/Quarkus configs do NOT typically set
# these top-level — they use the framework's prefix
# (`spring.kafka.producer.key-serializer`,
# `kafka.producer.key.serializer`). So false-positive risk is
# minimal in practice.
#
# Fix: ONE LINE.
#   - `bootstrap.servers=<host>:<port>[,<host>:<port>...]` to a
#     comma-separated list of 2-3 broker addresses for startup
#     redundancy. Production recommendation: at least 3 entries
#     for fault tolerance during a rolling broker restart.
#   - For env-var-driven configs, use the framework's placeholder
#     syntax (Spring `${KAFKA_BOOTSTRAP_SERVERS}`, Quarkus
#     `${KAFKA_BOOTSTRAP_SERVERS:default}`) and ensure the loader
#     resolves placeholders — plain Properties.load() does NOT.
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
client.id=bad-no-bootstrap-producer
acks=all
enable.idempotence=true
compression.type=zstd
linger.ms=20
batch.size=131072
buffer.memory=67108864
delivery.timeout.ms=120000
