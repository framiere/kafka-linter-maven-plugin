# =============================================================================
# IT fixture: STREAMS_PROPERTIES_CLIENT_RACK_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A Kafka Streams .properties file destined for
#   `new StreamsConfig(Properties)` inside a long-running JVM
#   process. The application is `event-enrichment-pipeline` —
#   a Kafka Streams topology that joins raw event records
#   from `events-raw` (96 partitions, RF=3) against three
#   reference KTables (`customers`, `products`,
#   `merchants`), windowed-aggregates them into 5-minute
#   rollups, and produces enriched events to
#   `events-enriched` for downstream consumers (a fraud
#   pipeline, a finance audit log, a real-time analytics
#   dashboard).
#
#   Deployment topology:
#     - EKS in us-east-1 (3 AZs: us-east-1a, us-east-1b,
#       us-east-1c)
#     - 12 pods deployed across the 3 AZs (4 pods per AZ)
#     - 4 StreamThreads per pod = 48 consumer instances
#       cluster-wide
#     - Steady-state fetch rate: ~5 MB/sec per consumer
#       instance × 48 = ~240 MB/sec aggregate
#     - State-store footprint: ~2 GB per pod (RocksDB on
#       PVC-backed `state.dir`)
#     - Standby tasks: 1 per active task (KIP-441 warm-
#       standby promotion)
#
#   Cluster topology:
#     - AWS MSK Provisioned, 9 brokers (3 per AZ),
#       Apache Kafka 3.6.0
#     - broker.rack=us-east-1a/b/c set per broker (MSK
#       sets this automatically per cluster-create AZ-
#       affinity)
#     - replica.selector.class=org.apache.kafka.common.
#       replica.RackAwareReplicaSelector (operator set
#       this in MSK's advanced configuration during
#       cluster creation)
#     - All topics are RF=3 with rack-aware placement
#       (one replica per AZ for every partition)
#
#   The broker side is fully configured for rack-aware
#   fetch. The only missing piece is `client.rack` on the
#   Streams .properties.
#
# What's wrong
#   `client.rack` (kafka-clients' KIP-392, Apache Kafka
#   2.4, December 2019) is the CONSUMER-side availability-
#   zone tag that tells the broker which AZ this client is
#   running in. Kafka Streams inherits this directly because
#   every StreamThread runs an embedded `KafkaConsumer`:
#   top-level consumer configs in the Streams .properties
#   are forwarded verbatim to all internal consumers.
#
#   Without `client.rack`, the broker's
#   RackAwareReplicaSelector has no rack to match against
#   — it falls back to returning the partition leader for
#   every fetch. The leader is randomly distributed across
#   all 3 AZs by Kafka's leader-election algorithm,
#   meaning ~67% of every Streams pod's fetches cross an
#   AZ boundary.
#
#   For this `event-enrichment-pipeline` topology:
#     - 240 MB/sec aggregate steady-state fetch
#     - 240 MB/sec × 67% cross-AZ = ~160 MB/sec cross-AZ
#     - 160 MB/sec × 86400 sec/day × 30 days = ~417 TB/
#       month of cross-AZ data transfer
#     - AWS charges $0.01/GB cross-AZ within a region
#       (per direction)
#     - 417 TB × $0.01/GB × 6 AZ-pair directions ≈ $25k/
#       month in AWS DataTransfer-Regional-Bytes
#
#   Additionally, every pod restart triggers state-store
#   restoration via the RESTORE consumer. For a 2 GB
#   state-store per pod at 50 MB/sec restoration rate, a
#   restart takes ~40 seconds; during those 40 seconds,
#   the restore consumer is doing CONTINUOUS cross-AZ
#   fetches at full pipe. For a frequently-restarted pod
#   (daily rolling deploys, occasional node evictions),
#   the restore traffic alone is meaningful.
#
#   Setting `client.rack=${POD_ZONE}` (where POD_ZONE is
#   injected via the Kubernetes Downward API from the
#   node's `topology.kubernetes.io/zone` label):
#     - the broker selector matches the consumer's rack
#       against the in-sync follower replicas' racks
#     - returns the same-AZ follower (every partition has
#       one in this cluster, by rack-aware placement
#       guarantee)
#     - cross-AZ fetch traffic drops from ~67% to ~0%
#     - monthly AWS DataTransfer-Regional-Bytes drops by
#       ~95% (the only remaining cross-AZ traffic is the
#       inter-broker replication, which is independent
#       of consumer-side rack-awareness)
#     - new bill: ~$2.5k/month (vs $25k/month) — a $22.5k/
#       month savings for a single Streams app
#
# The eight bug shapes this rule catches
#   (1) AWS multi-AZ Streams app — cross-AZ tax compounds
#       across StreamThreads. As described above, a 12-
#       pod × 4-thread Streams app on EKS in 3 AZs pays
#       ~$25k/month in DataTransfer-Regional-Bytes if
#       `client.rack` is absent.
#
#   (2) State restoration after pod restart — the RESTORE
#       consumer hammers cross-AZ for minutes. Every pod
#       restart triggers full state replay; for a 10 GB
#       changelog at 50 MB/sec, restoration takes 3-4
#       minutes of continuous cross-AZ traffic. The
#       restore consumer also obeys `client.rack` —
#       setting it cuts restore-window cross-AZ by ~67%.
#
#   (3) Strimzi with broker-side rack-awareness but
#       consumer-side empty. Strimzi's
#       `KafkaNodePool.spec.template.brokerRack` is set;
#       `replica.selector.class=RackAwareReplicaSelector`
#       is configured; broker side is ready. But the
#       Streams app's .properties has no `client.rack`
#       line; broker selector falls back to leader; the
#       configured rack-awareness does nothing. Silent:
#       no error, no log, no cost reduction.
#
#   (4) GlobalKTable broadcast traffic — partial
#       mitigation. GlobalKTable replicates ALL partitions
#       to every Streams instance via the global consumer;
#       with `client.rack` set on the global consumer
#       (inherited from top-level), each instance reads
#       from same-AZ followers where available, cutting
#       GlobalKTable broadcast traffic by ~67%.
#
#   (5) AWS MSK / Confluent Cloud Dedicated — broker side
#       ALREADY configured with rack-aware selector by
#       default; only the consumer side needs `client.
#       rack` set. Many operators assume the cluster is
#       fully optimized and never configure the consumer
#       side. Cost savings are immediate the moment
#       `client.rack` is set.
#
#   (6) Helm chart for Streams apps with no `client.rack`
#       default. 50+ teams use the chart; each pays the
#       cross-AZ tax.
#
#   (7) Spring Boot Streams autoconfig —
#       `KafkaStreamsConfiguration` bean does NOT inject
#       `client.rack`; every Spring Boot Streams app on
#       default config pays cross-AZ. For an org with
#       multiple Spring Boot Streams apps, the cost
#       compounds.
#
#   (8) KIP-708 standby-placement rack-awareness is
#       complementary — set `rack.aware.assignment.tags=
#       zone` AND `client.rack=${POD_ZONE}` together for
#       optimal multi-AZ Streams (this fixture sets the
#       former but is missing the latter — demonstrating
#       the half-configured state).
#
# Why INFO and not WARNING / ERROR
#   `client.rack` alone is a no-op if the broker-side
#   stack is not configured. Single-AZ deployments do not
#   benefit. The linter cannot verify either condition
#   from the Streams .properties alone. The rule is a
#   'have you considered whether your deployment crosses
#   an AZ boundary?' nudge for multi-AZ cloud
#   deployments.
#
#   This IT fixture's pom.xml overrides the severity to
#   ERROR so that `mvn verify` fails on this bad
#   configuration, demonstrating the rule fires correctly.
#
# Fix
#   For multi-AZ / multi-region Streams deployments where
#   the broker-side stack is configured (broker.rack per
#   broker + replica.selector.class=
#   RackAwareReplicaSelector):
#
#     client.rack=${POD_ZONE}
#
#   In Kubernetes, inject POD_ZONE via the Downward API
#   from the node's `topology.kubernetes.io/zone` label,
#   then template it into the streams.properties at
#   process start.
#
#   For Streams workloads with standby tasks, ALSO set
#   the KIP-708 standby-placement rack-awareness (already
#   set in this fixture):
#     rack.aware.assignment.tags=zone
#     client.tag.zone=${POD_ZONE}
#
#   Both knobs together give optimal multi-AZ Streams:
#   KIP-392 cuts fetch-side cross-AZ; KIP-708 places
#   standby tasks in different AZs from active tasks for
#   failover-friendliness.
# =============================================================================

# Application identity — the streams-shape gate.
application.id=event-enrichment-pipeline
client.id=event-enrichment-pipeline-pod-0

# Cluster connectivity (MSK private endpoint).
bootstrap.servers=b-1.events-msk.def456.c5.kafka.us-east-1.amazonaws.com:9098,b-2.events-msk.def456.c5.kafka.us-east-1.amazonaws.com:9098,b-3.events-msk.def456.c5.kafka.us-east-1.amazonaws.com:9098

# Default Serdes.
default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
default.value.serde=io.confluent.kafka.streams.serdes.avro.GenericAvroSerde

# Schema Registry endpoint with mTLS auth.
schema.registry.url=https://schema-registry.events.svc.cluster.local:8081
schema.registry.ssl.keystore.location=/var/run/secrets/sr-client/keystore.p12
schema.registry.ssl.keystore.password=${SR_KEYSTORE_PASS}
basic.auth.credentials.source=USER_INFO
basic.auth.user.info=${SR_USER_INFO}

# Exactly-once-v2 for transactional enrichment guarantees.
processing.guarantee=exactly_once_v2

# Standby replicas + KIP-441 warm-standby promotion.
num.standby.replicas=1
acceptable.recovery.lag=10000
probing.rebalance.interval.ms=600000
max.warmup.replicas=2

# KIP-708 STANDBY-PLACEMENT rack-awareness — set, but the
# KIP-392 FETCH-SIDE rack-awareness (client.rack) below is
# MISSING. Both are needed for optimal multi-AZ Streams.
rack.aware.assignment.tags=zone
client.tag.zone=${POD_ZONE}

# State-store persistence.
state.dir=/var/lib/streams/event-enrichment
default.dsl.store=rocksdb

# Group-membership + heartbeating tuned for K8s pod lifecycle.
session.timeout.ms=45000
heartbeat.interval.ms=15000
request.timeout.ms=60000
max.poll.interval.ms=300000

# Exception handlers — all three sides set explicitly.
default.deserialization.exception.handler=org.apache.kafka.streams.errors.LogAndContinueExceptionHandler
default.production.exception.handler=org.apache.kafka.streams.errors.DefaultProductionExceptionHandler
processing.exception.handler=org.apache.kafka.streams.errors.LogAndContinueProcessingExceptionHandler

# Timestamp extractor — explicit fail-on-invalid.
default.timestamp.extractor=org.apache.kafka.streams.processor.FailOnInvalidTimestamp

# Topology optimization.
topology.optimization=all

# Commit interval (EOS-v2 default 100 ms is fine; set explicitly).
commit.interval.ms=100

# 4 StreamThreads per instance.
num.stream.threads=4

# State-store cache budget.
statestore.cache.max.bytes=134217728

# Metadata recovery strategy — K8s-aware.
metadata.recovery.strategy=rebootstrap

# Task idle ms for stream-stream join time-alignment.
max.task.idle.ms=200

# Task timeout.
task.timeout.ms=300000

# Replication factor for internal topics.
replication.factor=3

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# MISSING:
#   client.rack=${POD_ZONE}
# Without this key, the broker's RackAwareReplicaSelector falls back to leader
# for every fetch from this Streams app's embedded consumers (main consumer,
# restore consumer, global consumer). For this `event-enrichment-pipeline`
# topology on EKS in us-east-1 spread across 3 AZs, 12 pods × 4 StreamThreads
# = 48 consumer instances at 5 MB/sec each = ~240 MB/sec aggregate fetch, of
# which ~67% crosses an AZ boundary (the leader is in a different AZ from
# the consumer pod ~2/3 of the time). 240 MB/sec × 67% × 86400 sec × 30 days
# = ~417 TB/month × $0.01/GB × 6 AZ-pair directions ≈ $25k/month in AWS
# DataTransfer-Regional-Bytes for THIS Streams app alone. Setting
# `client.rack=${POD_ZONE}` (with POD_ZONE injected via the Kubernetes
# Downward API from the node's `topology.kubernetes.io/zone` label) cuts
# cross-AZ fetch traffic from ~67% to ~0% (every partition has a same-AZ
# follower under RF=3 rack-aware placement) and drops the monthly bill by
# ~95% — a $22.5k/month savings for a single Streams app. Companion broker-
# side prerequisites — already set on this MSK cluster: broker.rack per
# broker + replica.selector.class=org.apache.kafka.common.replica.
# RackAwareReplicaSelector. The optimization is one Streams-side line.
# The KIP-708 standby-placement rack-awareness above (rack.aware.assignment.
# tags + client.tag.zone) is ORTHOGONAL and complementary — both should be
# set together for optimal multi-AZ Streams.
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
