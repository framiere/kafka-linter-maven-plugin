# =============================================================================
# IT fixture: CONNECT_ERRORS_TOLERANCE_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A Kafka Connect SINK connector .properties file. It declares
#   `connector.class` (JdbcSinkConnector — a real, parallelizable
#   connector), `name`, `topics`, `tasks.max=24` (deliberate parallelism
#   for a 24-partition topic), the JDBC connection coordinates, upsert
#   semantics with `pk.mode=record_key`, converters with their schema-
#   registry URLs set — a production-quality JDBC sink config — EXCEPT
#   `errors.tolerance` is not set anywhere.
#
# What's wrong
#   Kafka Connect's `org.apache.kafka.connect.runtime.ConnectorConfig.
#   ERRORS_TOLERANCE_CONFIG` declares `errors.tolerance` with:
#
#     ConfigDef.Type.STRING, default = "none", validValues = ["none", "all"]
#
#   When absent from the connector .properties, Connect parses the config
#   with `errors.tolerance=none`. The runtime's `RetryWithToleranceOperator`
#   then operates in FAIL-FAST mode: ANY exception thrown anywhere in the
#   per-record processing pipeline is re-thrown and the task transitions
#   to FAILED state.
#
#   The per-record processing pipeline for a SINK connector is:
#
#     1. consumer.poll() → ConsumerRecord<byte[],byte[]>
#     2. key.converter.toConnectData(topic, rawKeyBytes)    → SchemaAndValue
#     3. value.converter.toConnectData(topic, rawValueBytes) → SchemaAndValue
#     4. SMT chain (each Transformation#apply(SinkRecord))
#     5. SinkTask.put(records)
#
#   ANY exception at any of stages 2-5 — `SerializationException` (the JSON
#   converter saw `{"bad":` half-record), `DataException` (the SMT's Cast
#   saw a NULL where it expected an integer), `ConnectException` (the
#   JDBC sink saw a unique-constraint violation), even a transient
#   `KafkaException` from the downstream broker — kills the task.
#
#   The connector REST API now shows the task as FAILED. The Connect log
#   contains the exception stacktrace. The operator's pager fires. The
#   on-call must:
#
#     (a) Decide whether the failing record is recoverable (legitimate
#         data corruption → manual offset skip; transient downstream
#         outage → wait and restart).
#     (b) Either skip the offset (data loss with no inspection path) or
#         restart the task (which immediately re-fails on the same record
#         because Connect resumes from the LAST COMMITTED offset — which
#         is BEFORE the bad record).
#     (c) Modify the connector config to add `errors.tolerance=all` + DLQ
#         stanza and redeploy.
#
#   Total downtime: 15-60 minutes for what was either a single bad record
#   or a 50ms transient downstream blip.
#
# Why this is "WARNING" by default (not INFO or ERROR)
#   (a) The default `errors.tolerance=none` actively breaks the task on
#       the first per-record exception — that's WORSE behavior than the
#       producer/consumer kafka-clients INFO-severity absent rules (which
#       silently degrade or under-perform but don't outright halt the
#       pipeline). So WARNING is one notch above INFO.
#
#   (b) BUT for some connectors, `errors.tolerance=none` IS the correct
#       production posture: financial-reconciliation sinks where any
#       drop is catastrophic; ledger writes that must be exactly-once;
#       single-record-criticality pipelines where halting on bad data
#       is the desired safety net. The plugin cannot infer which
#       category a given `connector.class` belongs to. So WARNING is
#       one notch below ERROR.
#
#   (c) The fix is one line — and almost always EITHER `errors.tolerance=
#       all` + DLQ stanza OR explicit `errors.tolerance=none` to document
#       the deliberate fail-fast posture. Either way, the operator should
#       MAKE A DELIBERATE CHOICE rather than accepting the implicit
#       default.
#
#   This IT overrides severity to ERROR via pom.xml configuration to
#   force the build to fail and verify the rule fires.
#
# Common bug shapes
#   (1) JDBC sink halted by single null-field record — 30+ minutes
#       downtime.
#       Upstream service starts emitting records with a previously-non-
#       null field set to null. JDBC sink's value-mapping throws NPE.
#       errors.tolerance=none halts the task. Operator pager fires. On-
#       call must manually advance the consumer-group offset past the
#       bad record (via `kafka-consumer-groups.sh --reset-offsets`,
#       which loses the bad record with no inspection path) OR modify
#       the connector config and redeploy. Either path is 30+ minutes
#       of downtime in a sink that was supposed to be 24/7.
#
#   (2) S3 sink halted by transient S3 5xx — 3am pager for resolved
#       transient.
#       S3 returns a transient 5xx for one PUT call (AWS-documented
#       1-in-10000 transient error rate on S3). The connector's
#       S3SinkTask#put throws ConnectException. Default `none` halts
#       the task. Operator pager fires at 3am. By the time the
#       operator restarts the task 15 minutes later, the transient
#       S3 error has long since resolved; the same PUT now succeeds.
#       Entire incident was a 50ms transient that `errors.tolerance=
#       all` + DLQ + retry-on-failure would have handled invisibly.
#
#   (3) MM2 (MirrorMaker 2) full-pipeline-halt on single oversized
#       record.
#       MM2 inherits Connect's error-handling. An MM2 replication
#       deployment without `errors.tolerance` halts replication for
#       an entire source-target pair if even ONE record fails to
#       replicate (e.g., destination broker rejects an oversized
#       record due to max.message.bytes). The whole replication
#       topology stops; downstream consumers of the destination
#       cluster see a lag spike; operator pager fires. With
#       `errors.tolerance=all` + DLQ, the oversized record would
#       land in the DLQ; replication for all OTHER records continues
#       uninterrupted.
#
#   (4) Debezium CDC pipeline freeze on schema-evolution window.
#       A Debezium Postgres CDC connector emits change events to a
#       Kafka topic. Source DB undergoes a schema evolution adding
#       a non-null column; mid-deploy, some records have the new
#       column and some don't; the value-converter chokes on the
#       mixed schema for a brief window. Debezium's connector
#       .properties has no `errors.tolerance`. The connector halts;
#       the CDC topic stops receiving events; downstream sinks
#       consuming the CDC topic stop receiving updates; the entire
#       CDC pipeline freezes mid-deploy. Operator must restart the
#       connector after the schema evolution completes; the events
#       emitted DURING the schema-evolution window are still
#       problematic on restart.
#
#   (5) Operator-template missing the knob propagates org-wide.
#       A team's Helm chart template for Connect connectors omits
#       `errors.tolerance`. Every connector deployed via the
#       template inherits the default `none`. Across the org, 47
#       connectors have the same fail-fast posture; over 6 months,
#       the org's incident-response load is dominated by 'single
#       bad record halted a connector' tickets, each one a manual
#       restart by on-call. Adding `errors.tolerance=all` + DLQ to
#       the template would have eliminated the entire ticket
#       category.
#
#   (6) Resource-locking ledger sink — `none` IS correct here, but
#       should be EXPLICIT.
#       A financial-reconciliation sink writes records to a ledger
#       system with EXACTLY-ONCE semantics on a record-by-record
#       basis; if any record fails to write, the operator MUST
#       manually inspect and correct before continuing — silent
#       skip-and-continue would corrupt the ledger. This is a
#       connector where `errors.tolerance=none` is the correct
#       production posture; the plugin's nudge is to make this
#       choice EXPLICIT in the .properties file so future operators
#       understand it was deliberate, not an oversight.
#
# Fix
#   ONE LINE. Two options:
#
#     # Production default for high-volume sinks/sources:
#     errors.tolerance=all
#     errors.deadletterqueue.topic.name=orders-to-postgres-sink-dlq
#     errors.deadletterqueue.topic.replication.factor=3
#     errors.deadletterqueue.context.headers.enable=true
#     errors.log.enable=true
#     errors.log.include.messages=true
#     # → Bad records land in DLQ; pipeline continues; operator inspects
#     # → DLQ at leisure during business hours.
#
#     # Explicit fail-fast for record-criticality pipelines:
#     errors.tolerance=none
#     # → Documents the deliberate fail-fast choice. Future operators
#     # → see the explicit value and understand it was deliberate.
#
# Sibling rule
#   `CONNECT_ERRORS_TOLERANCE_ALL_NO_DLQ` fires on the COMPLEMENTARY case:
#   `errors.tolerance=all` SET but DLQ stanza MISSING. Together, the two
#   rules enforce the full KIP-298 contract:
#     - errors.tolerance set → either `none` (deliberate fail-fast) or
#       `all` (deliberate tolerance) with DLQ stanza populated.
# =============================================================================

name=orders-to-postgres-sink
connector.class=io.confluent.connect.jdbc.JdbcSinkConnector
topics=orders-events
tasks.max=24

# JDBC connection
connection.url=jdbc:postgresql://postgres-prod.example.com:5432/orders
connection.user=connect_writer

# Sink semantics: idempotent upserts by record key.
auto.create=true
insert.mode=upsert
pk.mode=record_key
pk.fields=order_id

# Converters with their schema-registry URLs set (isolates this rule from
# CONNECT_SCHEMA_REGISTRY_CONVERTER_MISSING_URL).
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry.example.com:8081
value.converter.auto.register.schemas=false

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# MISSING:
#   errors.tolerance=...
# Without this key, Kafka Connect defaults `errors.tolerance` to `none`
# (declared in ConnectorConfig.ERRORS_TOLERANCE_CONFIG with ConfigDef.Type.
# STRING, default = "none", validValues = ["none", "all"]). With `none`,
# the first per-record processing exception (deserialization,
# transformation, or sink-write failure) transitions the task to FAILED
# state and halts the entire connector. The operator's pager fires; the
# on-call must manually inspect, decide whether to skip the offset or
# fix upstream, and restart the task — 15-60 minutes downtime per bad
# record. The expected production posture for a high-volume JDBC sink is
# `errors.tolerance=all` paired with a DLQ stanza.
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
