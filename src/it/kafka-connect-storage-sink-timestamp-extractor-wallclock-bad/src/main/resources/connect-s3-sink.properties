name=s3-events-archive
connector.class=io.confluent.connect.s3.S3SinkConnector
tasks.max=2

topics=events.signups,events.purchases

s3.bucket.name=data-lake-events
s3.region=eu-west-1
s3.part.size=5242880

flush.size=1000
rotate.interval.ms=300000
storage.class=io.confluent.connect.s3.storage.S3Storage
format.class=io.confluent.connect.s3.format.parquet.ParquetFormat

# Anti-pattern: TimeBasedPartitioner without timestamp.extractor — defaults
# to Wallclock. Records are partitioned by `System.currentTimeMillis()` AT
# the moment Connect processes them, NOT by the event's actual time.
# On replay (consumer reset, worker restart), the entire historical event
# stream lands in TODAY's partition; downstream Athena queries grouped by
# year/month/day return wildly wrong counts. The fix is one line:
# timestamp.extractor=Record (Kafka record timestamp) or
# timestamp.extractor=RecordField with timestamp.field=event_time
# (event-time field within the record value).
partitioner.class=io.confluent.connect.storage.partitioner.TimeBasedPartitioner
partition.duration.ms=3600000
path.format='year'=YYYY/'month'=MM/'day'=dd/'hour'=HH
locale=en-US
timezone=UTC
# missing: timestamp.extractor=Record

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
