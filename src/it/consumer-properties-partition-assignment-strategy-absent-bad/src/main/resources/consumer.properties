# =============================================================================
# IT fixture: CONSUMER_PROPERTIES_PARTITION_ASSIGNMENT_STRATEGY_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A kafka-clients consumer .properties file destined for
#   `new KafkaConsumer<>(props)`. It declares deserializers, bootstrap.servers,
#   group.id, client.id, auto.offset.reset, enable.auto.commit, isolation.level,
#   poll-loop tuning, session/heartbeat windows — a complete production-quality
#   consumer config — EXCEPT `partition.assignment.strategy` is not set
#   anywhere.
#
# What's wrong
#   `org.apache.kafka.clients.consumer.ConsumerConfig.
#   PARTITION_ASSIGNMENT_STRATEGY_CONFIG` declares
#   `partition.assignment.strategy` with `ConfigDef.Type.LIST`, importance
#   MEDIUM. The default value SILENTLY CHANGED between major client versions:
#
#     kafka-clients 2.x:
#       [org.apache.kafka.clients.consumer.RangeAssignor]
#       (single-strategy list, eager-rebalance only)
#
#     kafka-clients 3.0+ (KIP-726):
#       [org.apache.kafka.clients.consumer.RangeAssignor,
#        org.apache.kafka.clients.consumer.CooperativeStickyAssignor]
#       (two-strategy list with Range listed first for backwards compatibility;
#       the group can be migrated to cooperative via rolling restart with
#       `[CooperativeStickyAssignor]` once all members support it)
#
#   At group join time, the group coordinator collects each member's
#   `partition.assignment.strategy` list and picks the FIRST strategy that ALL
#   members support. Consequences:
#
#     - A homogeneous 3.x group with default settings: coordinator picks
#       RangeAssignor (it appears first AND all members support it). To run
#       CooperativeSticky, all members must be migrated via rolling restart
#       with the explicit list `[CooperativeStickyAssignor]`.
#
#     - A group with even ONE member running kafka-clients 2.x (or anyone
#       running `[RangeAssignor]` only): coordinator picks Range for everyone.
#       Cooperative mode is silently downgraded for the entire group, even
#       though 95% of members support it.
#
#   The protocol consequences:
#
#     EAGER PROTOCOL (Range, RoundRobin, Sticky):
#       - On every rebalance, the coordinator REVOKES ALL partitions from ALL
#         members.
#       - Each member's onPartitionsRevoked() callback runs (commit offsets,
#         flush state).
#       - The coordinator computes the new assignment.
#       - Each member receives onPartitionsAssigned() and re-seeks each
#         partition.
#       - During the revoke→reassign window (~1-3 seconds for a 200-partition
#         group, longer for more), NO consumer in the group is processing.
#
#     COOPERATIVE PROTOCOL (CooperativeStickyAssignor, KIP-429):
#       - Coordinator computes the NEW assignment first.
#       - Only members that LOSE partitions revoke those specific partitions
#         (onPartitionsRevoked with a SUBSET, not all).
#       - Members that keep their existing partitions keep processing
#         THROUGHOUT the rebalance.
#       - Members that gain partitions receive onPartitionsAssigned for the
#         NEW partitions only.
#       - The stall is bounded to the partitions that actually move (typically
#         5-10% of the partitions during a single-pod restart, not 100%).
#
# Why this is "INFO" by default (not WARNING or ERROR)
#   (a) The 3.x default `[RangeAssignor, CooperativeStickyAssignor]` is
#       REASONABLE for greenfield deployments: it preserves backwards
#       compatibility with 2.x members AND allows migration to cooperative.
#       Operators who do nothing on a 3.x homogeneous fleet get Range
#       (eager) — not ideal but not broken.
#
#   (b) Some operators legitimately accept the default and document the
#       choice in a separate runbook ('we're aware our 200-partition group
#       pauses 1s per rebalance during deploys; we deploy off-hours').
#
#   (c) Streams uses its own partition assignor based on the topology; the
#       rule excludes Streams .properties files (`application.id` set).
#
#   For these reasons, the rule's default severity is INFO — a documentation
#   nudge prompting the operator to make the choice deliberately.
#
#   This IT overrides severity to ERROR via pom.xml configuration to force
#   the build to fail and verify the rule fires.
#
# Common bug shapes
#   (1) Mixed-version group silently downgraded.
#       Org runs 20 consumer instances on kafka-clients 3.6 with no explicit
#       partition.assignment.strategy; default `[Range, CooperativeSticky]`;
#       group negotiates CooperativeSticky and rebalances cheaply (~50ms
#       stall during a single-pod restart). New team adds a SINGLE
#       kafka-clients 2.8 ETL worker to the same group; 2.8 default is
#       `[Range]` only. Coordinator picks the intersection — RangeAssignor
#       for ALL 20 members. The 20 main consumers' rebalance behavior
#       silently regresses from cooperative back to eager; every pod restart
#       now stalls the whole group for 2-3 seconds; SLO violations during
#       deploys. Root cause: ABSENCE of explicit strategy on both sides
#       allowed the silent downgrade. Static-analysis at PR time would
#       surface the version-coupling.
#
#   (2) Upgrade 2.x → 3.x silently changes behavior.
#       Team is on kafka-clients 2.6 with no explicit partition.assignment.
#       strategy; group uses RangeAssignor (eager); team has 1.5-second
#       rebalance stalls during every deploy, considered 'tax we live with'.
#       Team upgrades to kafka-clients 3.4 (no .properties change); group
#       now uses `[Range, CooperativeSticky]`; behavior silently improves
#       (rebalance stalls drop to <100ms when all members are 3.x). Team
#       takes credit for the 'improvement' without understanding why. Years
#       later a rollback for an unrelated reason silently regresses to
#       eager; team cannot reproduce the original improvement. Setting
#       `partition.assignment.strategy=CooperativeStickyAssignor` explicitly
#       pins the behavior across upgrades.
#
#   (3) 20-instance group with 1000 partitions takes 4s to rebalance.
#       Group reads a 1000-partition topic; default eager Range means every
#       rebalance revokes all 1000 partitions across all 20 instances and
#       reassigns. Revoke→reassign window is ~4 seconds during which no
#       consumer is processing. SLO is 500ms p99; every rebalance breaches.
#       Switching to CooperativeStickyAssignor would reduce stall to ~50ms.
#       Static-analysis would have prompted the operator to choose.
#
#   (4) GroupCoordinator log analysis is opaque.
#       SRE investigating slow rebalances greps the broker's GroupCoordinator
#       log; sees `Preparing to rebalance group <g> in state
#       PreparingRebalance ...` followed by `Stabilized group <g>
#       generation N+1`. They cannot tell from the log whether the group
#       ran eager or cooperative; they have to ssh into a consumer pod and
#       read its config. Setting explicit strategy makes the answer one
#       `kafka-consumer-groups --describe` away.
#
#   (5) Spring Boot defaults pass through.
#       Spring Kafka exposes `spring.kafka.consumer.properties.partition.
#       assignment.strategy` but typical Spring Boot apps don't set it.
#       Effective value is whatever the bundled kafka-clients version
#       defaults to. Spring auto-config never opinionates. Static analysis
#       on Spring's underlying .properties surfaces the absence.
#
#   (6) CI test group with frequent autoscale.
#       Performance test scales consumer group from 5 to 50 instances and
#       back over 10 minutes; each scale event triggers a rebalance. Under
#       eager Range, every scale event stalls the whole group; 10 minutes
#       of test time include ~2 minutes of cumulative stall time. Under
#       CooperativeSticky, the same test has <10 seconds of cumulative
#       stall. Throughput numbers are dramatically more representative.
#
# Fix
#   ONE LINE. Pick the strategy that matches the deployment:
#
#     # Best behavior for homogeneous 3.x+ fleets (recommended):
#     partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor
#
#     # Rolling-upgrade scenarios (matches 3.x default explicitly, allows
#     # migration once all members run 3.x):
#     partition.assignment.strategy=org.apache.kafka.clients.consumer.RangeAssignor,org.apache.kafka.clients.consumer.CooperativeStickyAssignor
#
#     # Documenting a deliberate choice of eager-rebalance (rare):
#     partition.assignment.strategy=org.apache.kafka.clients.consumer.RangeAssignor
#
#   The sibling rule CONSUMER_PARTITION_ASSIGNMENT_LEGACY catches the
#   explicit-pinned-to-legacy case (Range/RoundRobin/Sticky WITHOUT
#   CooperativeSticky in the list).
# =============================================================================

bootstrap.servers=broker-1.kafka.prod.example.com:9092,broker-2.kafka.prod.example.com:9092,broker-3.kafka.prod.example.com:9092
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer

# Group identity + client identity (isolate the rule from group-id-absent
# and client-id-absent sibling rules).
group.id=payments-events
client.id=payments-fraud-screening-consumer

# Bootstrap-offset semantics.
auto.offset.reset=earliest

# At-least-once semantics.
enable.auto.commit=false

# Read-committed.
isolation.level=read_committed

# Poll-loop tuning (isolate the rule from max-poll-records,
# max-poll-interval-ms, session-timeout-ms, fetch-min-bytes absent siblings).
max.poll.records=500
max.poll.interval.ms=300000
session.timeout.ms=45000
fetch.min.bytes=1024

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# MISSING:
#   partition.assignment.strategy=...
# kafka-clients 2.x defaults to `[RangeAssignor]` (eager-only); 3.0+ defaults
# to `[RangeAssignor, CooperativeStickyAssignor]` (KIP-726). The absence
# leaves the group at the mercy of version-dependent defaults and silent
# downgrade by any 2.x member that joins.
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
