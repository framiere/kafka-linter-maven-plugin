# =============================================================================
# Debezium MySQL connector capturing the `inventory.*` schema from the
# warehouse OLTP database.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#   schema.history.internal.skip.unparseable.ddl = true
#
# WHY THIS IS A SILENT-SCHEMA-DRIFT BUG:
#
# Debezium's CDC pipeline for relational databases that emit DDL on the
# change log (MySQL here; also MariaDB, SQL Server, Oracle, DB2) maintains
# an internal in-memory cache of every captured table's schema. The cache
# is ESSENTIAL: when a row event arrives off the binlog, the connector
# needs the EXACT schema of the table at the time of that row event to
# decode the binary payload (column order, types, nullability).
#
# The cache is built from REPLAYING all historical DDL statements that
# have ever applied to the captured tables. Those DDLs are stored in the
# SchemaHistory Kafka topic (`schema.history.internal.kafka.topic`). On
# connector startup, the SchemaHistory subsystem reads the topic from
# the beginning, replays each stored DDL into a parser, and reconstructs
# the schema cache. On steady-state, the connector reads new DDLs off
# the binlog, applies them to the cache, AND writes them to the
# SchemaHistory topic so the next restart can replay them.
#
# The DDL parser is connector-specific (`MySqlAntlrDdlParser` for MySQL).
# It's good but NOT perfect — every release of MySQL adds new syntax
# (`ALGORITHM=INSTANT` in 8.0, `INVISIBLE` columns in 8.0.23, etc.), and
# the parser lags the source-database release cadence. When the parser
# hits a DDL it cannot parse, it raises `ParsingException`.
#
# The `schema.history.internal.skip.unparseable.ddl` config decides what
# to do:
#
#   false (DEFAULT) — Stop the connector with a clear error pointing to
#                     the offending DDL. Operator investigates: upgrade
#                     Debezium to a version with the parser fix, work
#                     with DBA to rewrite the DDL in parser-compatible
#                     syntax, or manually advance the schema history.
#                     NO SCHEMA DRIFT.
#
#   true            — LOG-AND-SKIP-AND-CONTINUE. The DDL's schema change
#                     is NOT applied to the in-memory schema cache. The
#                     connector keeps running with a SILENTLY DRIFTING
#                     schema cache.
#
# THE VIOLATION:
#
# This config sets `schema.history.internal.skip.unparseable.ddl = true`
# — probably because some operator got tired of being paged when a DBA
# ran an unusual DDL that the parser stumbled on. The connector now
# never fails on parser stumbles. But:
#
#   1. The schema cache silently diverges from the source database. The
#      source `inventory.items` table has a new `sku_v2 VARCHAR(64)`
#      column (added via `ALTER TABLE ... ALGORITHM=INSTANT`); the
#      connector's cache still has the old 8-column schema.
#
#   2. The NEXT INSERT into `items` arrives with 9 columns on the binlog;
#      the connector decodes it against the stale 8-column cache; decode
#      FAILS (column count mismatch).
#
#   3. The failure then cascades to `event.processing.failure.handling.
#      mode`. With the default `fail`, the connector starts failing on
#      every subsequent `items` row event — but the operator is paged
#      DAYS LATER, by which time the schema-history topic has the
#      unparseable DDL stored and recovery is hard. If
#      `event.processing.failure.handling.mode = skip` (the cascade-
#      completion silent-drop rule), EVERY ROW EVENT for `items` is
#      silently dropped forever; the table's CDC stream goes dead.
#
# REAL-WORLD INCIDENT SHAPES:
#
#   - DBA migrates to MySQL 8.0; uses `ALTER TABLE ... ALGORITHM=INSTANT`
#     for online schema changes; older Debezium MySQL parser stumbles;
#     `skip.unparseable.ddl=true` was set 'for resilience'; the schema
#     cache silently drifts; subsequent row events fail to decode;
#     downstream warehouse shows table is frozen at the pre-migration
#     state for weeks.
#
#   - Multi-tenant database has DDLs on `tenant_b.*` that the connector's
#     `table.include.list` doesn't even capture; operator finds it
#     'annoying' that the connector cares about unrelated tenants' DDLs
#     and sets `skip.unparseable.ddl=true` instead of the correct fix
#     (`schema.history.internal.store.only.captured.tables.ddl=true`).
#     A future DDL on the captured tenant_a is also unparseable and is
#     now silently skipped — actual data loss for tenant_a follows.
#
#   - Helm chart with `schemaHistorySkipUnparseableDdl: true` as a
#     'production resilience' default propagates the silent-drift across
#     the org; systematic row-decode failures appear as 'random' incidents.
#
# FIX:
#
#   Remove this line (default `false` is correct), OR set
#   schema.history.internal.skip.unparseable.ddl = false explicitly.
#
# If parser-stumbles are happening repeatedly in production, address
# the root cause:
#   - Upgrade Debezium to a version with the parser fix
#   - Coordinate with DBAs to use parser-compatible DDL syntax
#   - Use schema.history.internal.store.only.captured.tables.ddl=true
#     to filter the schema-history to only the captured tables (so DDLs
#     on unrelated tables don't even reach the parser)
#
# NEVER let the connector run with a known-broken schema cache.
# =============================================================================

name=inventory-source
connector.class=io.debezium.connector.mysql.MySqlConnector
tasks.max=1

database.hostname=warehouse-db.internal
database.port=3306
database.user=debezium
database.password=changeme
database.server.id=20001
database.include.list=inventory
table.include.list=inventory.items,inventory.warehouses,inventory.stock_levels
topic.prefix=db.inventory

schema.history.internal.kafka.topic=schema-history.inventory-source
schema.history.internal.kafka.bootstrap.servers=kafka.internal:9092

# VIOLATION: silent schema-drift switch. When the MySQL DDL parser fails
# to parse a source DDL (vendor-syntax extension, new MySQL 8.x feature,
# parser bug), the connector logs the parse error and CONTINUES with a
# stale schema cache. Subsequent row events for the affected table fail
# to decode and cascade to event.processing.failure.handling.mode —
# either crashing the connector later or silently dropping every row
# event forever. Should be `false` (the default).
schema.history.internal.skip.unparseable.ddl=true

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
