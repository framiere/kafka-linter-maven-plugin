# =============================================================================
# IT fixture: STREAMS_PROPERTIES_DEFAULT_VALUE_SERDE_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A Kafka Streams .properties file destined for `new StreamsConfig(props)`.
#   It declares application.id, bootstrap.servers, default.key.serde,
#   commit interval, processing guarantee, replication, thread count, state
#   dir, both exception handlers — a complete Streams config — EXCEPT
#   `default.value.serde` is not set anywhere.
#
# What's wrong
#   `org.apache.kafka.streams.StreamsConfig.DEFAULT_VALUE_SERDE_CLASS_CONFIG`
#   declares `default.value.serde` with `ConfigDef.Type.CLASS`, default
#   `null`, NULL_ALLOWED, importance MEDIUM. The kafka-streams parse step
#   does NOT validate the absence — `new StreamsConfig(props)` succeeds.
#   The default is consulted LATER, at topology-build or topology-start
#   time, by every DSL operator that does NOT pass an explicit Serde via:
#     - Consumed.with(...)       for stream() / table() / globalTable()
#     - Grouped.with(...)         for groupByKey() / groupBy()
#     - Materialized.with(...)    for aggregate() / count() / reduce()
#     - Produced.with(...)        for to() / through()
#     - Joined.with(...)          for join() / leftJoin() / outerJoin()
#
#   When the default is null and an operator needs it, the framework throws:
#
#     org.apache.kafka.common.config.ConfigException:
#       Please specify a default value serde through configured
#       'default.value.serde' or through
#       Materialized/Consumed/Grouped/Produced/Joined.with(...)
#
#   The exception fires at `Topology.build()` time for source-node-related
#   operators, or at `KafkaStreams.start()` time for others. Either way:
#   production crashes at startup. Recovery: add the line, re-deploy.
#
# Why this is "WARNING" by default (not ERROR)
#   Same reasoning as the key-serde sibling: the all-explicit-Serdes
#   pattern is legitimate, but absence-without-comment is overwhelmingly
#   an accident. See streams-properties-default-key-serde-absent-bad
#   for the full discussion.
#
#   This IT overrides severity to ERROR via pom.xml to force the build to
#   fail and verify the rule fires.
#
# Common bug shapes
#   (1) Topology with Avro values; default.value.serde omitted; deploy crashes.
#       A topology consumes Avro records from a topic via b.stream("orders")
#       (no Consumed). The .properties sets default.key.serde=StringSerde
#       but misses default.value.serde. Topology build throws ConfigException
#       at startup. Production deploy fails.
#
#   (2) Aggregate state-store changelog topic missing value Serde.
#       An aggregate(...) with Materialized.<K,V>as("store-name") (no
#       explicit Serdes) needs the default value Serde to write the
#       aggregated state to the state-store changelog topic. Default is
#       null. Build crashes.
#
#   (3) Internal repartition topic needs value Serde.
#       A selectKey().groupByKey().aggregate() chain triggers an internal
#       repartition; the repartition topic needs the default value Serde
#       to encode the records being re-partitioned. Default is null.
#       Build crashes.
#
#   (4) GlobalKTable bootstrap before first record.
#       b.globalTable("countries") (no Consumed) consults the default
#       value Serde at GlobalStreamThread startup. Default is null.
#       GlobalStreamThread crashes immediately at KafkaStreams.start().
#
#   (5) Spring Boot StreamsBuilderFactoryBean defaults leak through.
#       Spring Kafka exposes default.value.serde via spring.kafka.streams.
#       properties.default.value.serde. Many Spring Boot Streams apps
#       never set it. Static analysis catches the absence.
#
#   (6) Mixed-type topology refactor to unified helper.
#       A topology consumes from orders (Order objects), users (User
#       objects), and events (raw bytes). Initially passes per-operator
#       Serdes; later refactors to a unified Topology.from(topics) helper
#       that uses the default value Serde. Default is null; helper crashes.
#
# Fix
#   Set `default.value.serde` to the most-common value encoding in your
#   topology:
#
#     # String values (most common simple case)
#     default.value.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
#
#     # Byte-array values (raw payloads)
#     default.value.serde=org.apache.kafka.common.serialization.Serdes$ByteArraySerde
#
#     # Avro values (Schema Registry)
#     default.value.serde=io.confluent.kafka.streams.serdes.avro.SpecificAvroSerde
#
#   For multi-typed topologies, set the default to the most-common type
#   and override per-operator with .with(...) for the others. For all-
#   explicit-Serdes topologies, document the choice with a comment:
#     # default.value.serde intentionally omitted — every operator passes
#     # explicit Serdes via Consumed/Grouped/Materialized/Produced/Joined.with()
# =============================================================================

application.id=customer-events-stream
bootstrap.servers=broker-1.kafka.prod.example.com:9092,broker-2.kafka.prod.example.com:9092,broker-3.kafka.prod.example.com:9092

# Key serde IS set — this isolates the rule to firing only on the absent VALUE serde.
default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde

# Internal-topic durability.
replication.factor=3
min.insync.replicas=2

# Throughput & latency.
num.stream.threads=8
commit.interval.ms=5000

# At-least-once (the default; set explicitly for documentation).
processing.guarantee=at_least_once

# State-store location.
state.dir=/var/lib/kafka-streams/customer-events

# Exception handlers — both set.
default.deserialization.exception.handler=org.apache.kafka.streams.errors.LogAndContinueExceptionHandler
default.production.exception.handler=org.apache.kafka.streams.errors.LogAndContinueProductionExceptionHandler

# Schema registry (Confluent Avro serde dependency).
schema.registry.url=http://schema-registry.kafka.prod.example.com:8081

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# MISSING:
#   default.value.serde=...
# Any DSL operator without explicit Consumed/Grouped/Materialized/Produced/
# Joined.with(Serde, Serde) consults the default value Serde and gets null.
# Topology build throws ConfigException; production crashes at startup.
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
