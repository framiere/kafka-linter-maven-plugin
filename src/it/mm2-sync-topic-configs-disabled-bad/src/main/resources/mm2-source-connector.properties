# =============================================================================
# A MirrorMaker 2 source-connector configuration where the operator has
# EXPLICITLY disabled topic-config synchronization by setting
# `sync.topic.configs.enabled=false`. The default for this key is `true`;
# disabling it opts out of one of MM2's core durability guarantees.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#
#   connector.class               = MirrorSourceConnector
#   sync.topic.configs.enabled    = false   ← the smoking gun
#
# WHAT THIS KEY ACTUALLY CONTROLS:
#
# `sync.topic.configs.enabled` (default: true) tells the MirrorSourceConnector
# whether to COPY topic-level configurations from source-cluster topics to
# their replicated counterparts on the target cluster. Topic-level configs
# include EVERY per-topic Kafka setting:
#
#   cleanup.policy        (delete | compact | "delete,compact")
#   retention.ms          (how long records are retained on the topic)
#   retention.bytes       (max bytes per partition before deletion)
#   compression.type      (producer | uncompressed | gzip | snappy | lz4 | zstd)
#   max.message.bytes     (max record size accepted by the topic)
#   segment.ms            (max age of a log segment before roll)
#   segment.bytes         (max size of a log segment before roll)
#   min.insync.replicas   (min ISR count for acks=all to succeed)
#   message.timestamp.type, delete.retention.ms, min.compaction.lag.ms, ...
#
# These configs are PART OF THE TOPIC'S CONTRACT WITH ITS CONSUMERS. A topic
# with cleanup.policy=compact behaves fundamentally differently from a topic
# with cleanup.policy=delete: a compacted topic guarantees that the LATEST
# record per key is retained indefinitely (the classic 'changelog topic'
# pattern used by Kafka Streams, KSQL, and Debezium); a delete-policy topic
# retains records for retention.ms and then drops them. A consumer that
# depends on the compaction semantics CRASHES (or silently produces wrong
# results) when the topic it reads is changed to delete policy.
#
# When MM2 replicates a topic to a target cluster with sync.topic.configs
# DISABLED, the target topic uses TARGET BROKER DEFAULTS — typically:
#
#   cleanup.policy=delete         (the universal Kafka broker default)
#   retention.ms=604800000        (7 days)
#   compression.type=producer
#   max.message.bytes=1048588     (~1 MiB — the broker default)
#
# regardless of what the source topic's configuration was. If the source
# topic was cleanup.policy=compact with retention.ms=Long.MAX_VALUE, the
# replicated topic on the target is cleanup.policy=delete with retention.ms=
# 604800000 — a SILENT, INVISIBLE config divergence.
#
# TWO FAILURE SHAPES:
#
# (1) SILENT DIVERGENCE AT CREATION. When MM2 auto-creates a replicated topic
#     on the target (every topic in the `topics=` include-list that doesn't
#     already exist on the target is auto-created by MM2), it uses target
#     broker defaults rather than copying the source topic's configs. A
#     source topic with cleanup.policy=compact silently becomes
#     cleanup.policy=delete on the target. Compacted topics on the source
#     LOSE their compaction semantics on the target. Consumers that depend
#     on 'latest value per key' (Kafka Streams state stores, Debezium schema
#     history topics, Connect status/offsets/configs topics, KSQL changelog
#     topics) BREAK during failover: their state-store rebuilds replay only
#     the records retained by the target's delete policy (e.g., last 7 days),
#     not the full key-state history. Downstream applications produce
#     incorrect results (missing keys, stale values) for the duration of the
#     state-rebuild window — which can be hours for large state stores.
#
# (2) SILENT ONGOING DIVERGENCE. When an operator runs `kafka-configs.sh
#     --alter` on the SOURCE cluster (e.g., raising retention.ms from 7d to
#     30d to satisfy a new compliance requirement; or switching
#     cleanup.policy from delete to "delete,compact" for a CDC log topic),
#     the change does NOT propagate to the target cluster. The target retains
#     the old retention (7d) or the old policy (delete). DR consumers reading
#     historical data on the target see records expire EARLIER than expected;
#     compliance auditors querying the target see GAPS in the historical
#     record that don't exist on the source. The discrepancy surfaces only
#     during the compliance audit (typically months after the operator made
#     the source-side change and assumed MM2 would carry it forward).
#
# WHY THIS LOOKS SAFE BUT IS NOT:
#
# Replication runs FINE with sync.topic.configs.enabled=false. Records flow
# from source to target. Throughput dashboards show steady-state replication.
# Lag metrics are healthy. The Kafka cluster's health-check dashboards report
# 'green'. Nothing alerts.
#
# The damage is INVISIBLE in normal operation. It manifests only at:
#   - a DR drill (quarterly cutover test)
#   - an actual primary cluster failover
#   - a compliance audit ("show me the same record on the source and the
#     target — they should be identical, including topic-level configs")
#   - a downstream consumer's first failover read from a compacted topic
#     that was silently de-compacted on the target
#
# Exactly the high-stakes moments when the operator NEEDS the target cluster
# to be a faithful mirror of the source. The misconfiguration is a time-bomb
# that detonates during the operator's worst day.
#
# HOW THIS HAPPENS:
#
# (a) **Tutorial copy-paste.** An early MM2 tutorial blog post used
#     `sync.topic.configs.enabled=false` as a 'shortcut' to avoid permission
#     issues when the tutorial's MM2 user didn't have ALTER permission on
#     the target cluster's topics. The team's first MM2 deployment was
#     bootstrapped from that tutorial; the explicit `=false` was carried
#     forward through every subsequent MM2 deployment in the org as 'the way
#     we configure MM2 here'.
#
# (b) **Operator misunderstanding of 'sync'.** A new SRE assumes that 'sync
#     topic configs' means 'pulling configs from the target to the source'
#     and is worried about target-side experimental settings overwriting
#     production source settings. They disable the sync 'to be safe'. The
#     opposite is true: MM2 syncs from source→target only (replication
#     direction); disabling the sync removes the source→target propagation
#     and leaves the target with broker defaults.
#
# (c) **Permission workaround that was meant to be temporary.** The MM2
#     connector user lacks ALTER permission on target topics. Rather than
#     fix the ACL, the operator disables sync.topic.configs to silence the
#     authorization-failure warnings in the Connect logs. The ALTER ACL is
#     never granted; the sync stays disabled; the divergence becomes a
#     permanent invisible time-bomb.
#
# (d) **Multi-tenant target cluster with per-tenant config policies.** The
#     target cluster enforces org-wide policies (e.g., max retention 30 days
#     for all topics regardless of source) via a custom AlterConfigPolicy
#     plugin. The MM2 connector's ALTER calls fail with PolicyViolation; the
#     operator disables sync.topic.configs to stop the noise. Now the target
#     uses BROKER defaults for every replicated topic, which is even further
#     from the source than the org policy would have produced.
#
# (e) **Compacted-changelog topic regression.** Team A on the source cluster
#     uses Kafka Streams with state stores backed by compacted changelog
#     topics. The source cluster has cleanup.policy=compact configured per
#     topic. MM2 replicates the changelog topics to the DR cluster but
#     sync.topic.configs is disabled; the DR-cluster changelogs are
#     cleanup.policy=delete with 7-day retention. During a DR drill, Team A
#     fails over to the DR cluster; their state-store rebuilds replay only
#     the last 7 days of changelog data; aggregations and joins produce
#     incorrect results (missing historical keys); the drill is failed; the
#     DR plan is reclassified as 'untested' until the config-sync issue is
#     resolved AND every replicated changelog topic is re-aligned with
#     `kafka-configs.sh --alter` on the DR cluster (a manual operation per
#     topic, often hundreds of topics).
#
# (f) **Compliance audit reveals divergence.** Auditor requests proof that
#     records retained on the source for 90 days (PCI requirement) are also
#     retained on the DR target for the same period. The team queries both
#     clusters; the source has retention.ms=7776000000 (90 days); the
#     target has retention.ms=604800000 (7 days, the broker default). The
#     team cannot prove PCI compliance for the DR cluster; the audit is
#     blocked until the configs are aligned and the team can demonstrate
#     that records are retained for 90 days on both sides.
#
# THE FIX:
#
# Remove the explicit `=false` (the default `=true` is the
# production-recommended setting):
#
#   # sync.topic.configs.enabled=false    ← DELETE THIS LINE
#
# Or set explicitly to true to make the intent visible to future readers:
#
#   sync.topic.configs.enabled=true       ← OK (matches the default)
#
# If the operator DELIBERATELY wants per-cluster config divergence (e.g.,
# the target cluster has a cheaper storage tier and shorter retention is
# intentional for cost reasons), document the intent in a comment AND
# suppress this rule via per-rule severity override:
#
#   <severities>
#       <MM2_SYNC_TOPIC_CONFIGS_DISABLED>OFF</MM2_SYNC_TOPIC_CONFIGS_DISABLED>
#   </severities>
#
# IMPORTANT: enabling sync.topic.configs=true does NOT retroactively fix
# already-divergent topics. MM2 syncs configs going forward, but existing
# target topics retain their current configs until manually aligned with
# `kafka-configs.sh --alter` on the target cluster. Plan both the config
# fix AND the manual realignment of already-replicated topics together.
#
# =============================================================================

name=mm2-orders-source
connector.class=org.apache.kafka.connect.mirror.MirrorSourceConnector
tasks.max=8

source.cluster.alias=primary
target.cluster.alias=dr

source.cluster.bootstrap.servers=primary-kafka.internal:9093
target.cluster.bootstrap.servers=dr-kafka.internal:9093

replication.factor=3
checkpoints.topic.replication.factor=3
heartbeats.topic.replication.factor=3
offset-syncs.topic.replication.factor=3

# VIOLATION: sync.topic.configs.enabled=false — opts out of source→target
# topic-config synchronization. Replicated topics on the target cluster will
# use TARGET BROKER DEFAULTS rather than copying configs from the source.
# Compacted source topics become delete-policy on the target; high-retention
# source topics become 7-day retention on the target. The divergence is
# invisible in steady-state monitoring and emerges only during DR drills,
# compliance audits, or actual cluster failover.
# Fix: remove this line (the default `=true` is correct), OR if per-cluster
# divergence is deliberate, document the intent and suppress this rule via
# `<MM2_SYNC_TOPIC_CONFIGS_DISABLED>OFF</MM2_SYNC_TOPIC_CONFIGS_DISABLED>`.
sync.topic.configs.enabled=false

topics=orders\\..*,payments\\..*,customers\\..*
topics.exclude=__consumer_offsets,__transaction_state,_schemas

sync.topic.acls.enabled=true
refresh.topics.interval.seconds=600
refresh.groups.interval.seconds=600
