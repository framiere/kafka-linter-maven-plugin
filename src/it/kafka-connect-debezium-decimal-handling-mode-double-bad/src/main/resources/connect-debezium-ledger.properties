name=debezium-ledger
connector.class=io.debezium.connector.postgresql.PostgresConnector
tasks.max=1

database.hostname=ledger-db.internal
database.port=5432
database.user=debezium
database.password=changeme
database.dbname=ledger

topic.prefix=cdc.ledger
slot.name=debezium_ledger
publication.name=dbz_publication_ledger

table.include.list=public.transactions,public.account_balances

schema.history.internal.kafka.topic=cdc.ledger.schema-history
schema.history.internal.kafka.bootstrap.servers=kafka:9092

snapshot.mode=initial

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081

# Anti-pattern: decimal.handling.mode=double silently rounds every
# DECIMAL/NUMERIC value at the connector to the nearest 64-bit IEEE-754
# double, BEFORE the record reaches Kafka. For a financial ledger with
# transaction amounts in DECIMAL(20,4) and running balances in DECIMAL(28,8),
# this is catastrophic data corruption: a balance of 99999999999999.99
# becomes 99999999999999.984; a tax calculation of 0.0000000001 becomes
# 1.0E-10 (sometimes representable, sometimes not — every value drifts in
# the 17th digit). Sum-aggregations across millions of rows accumulate
# fractional-cent errors; quarterly reconciliation reports diverge from
# the source database; auditors flag the discrepancy weeks-to-months later.
# Once written to Kafka with the rounded `double` value, the original
# precision is GONE — there is no recovery. The correct setting for any
# financial / monetary / inventory / regulatory data is the default
# `precise` (encodes losslessly as Avro `bytes` + logicalType:decimal)
# or `string` (lossless ASCII representation for JSON-only consumers).
decimal.handling.mode=double
