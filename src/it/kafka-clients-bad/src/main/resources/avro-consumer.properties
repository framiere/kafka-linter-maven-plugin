# RULE: AVRO_SPECIFIC_READER_MISSING — value.deserializer is KafkaAvroDeserializer
# but specific.avro.reader is unset. The deserializer returns GenericRecord and
# the first `(MyEvent) record.value()` cast throws ClassCastException at runtime.
bootstrap.servers=broker:9092
group.id=avro-consumer
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
schema.registry.url=https://schema-registry:8081
auto.offset.reset=earliest
enable.auto.commit=false
max.poll.records=500
max.poll.interval.ms=300000
isolation.level=read_uncommitted
