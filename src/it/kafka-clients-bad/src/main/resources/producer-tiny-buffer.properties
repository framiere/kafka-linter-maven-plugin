# RULE: PRODUCER_BUFFER_MEMORY_MISCONFIG (cross-key sub-case).
# buffer.memory=524288 (512 KiB) is smaller than batch.size=1048576 (1 MiB).
# A single batch cannot fit in the buffer — every send() blocks for max.block.ms
# and times out with "Expiring N records".
bootstrap.servers=kafka-1.prod.example.com:9092
client.id=bad-tiny-buffer-producer
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=org.apache.kafka.common.serialization.StringSerializer
compression.type=zstd
buffer.memory=524288
batch.size=1048576
