# RULE: PRODUCER_BUFFER_MEMORY_MISCONFIG (absurdly-large sub-case).
# buffer.memory=2147483648 (2 GiB) pins JVM heap that should be available for
# processing, lengthens GC pauses, and turns a producer OOM into a 2 GiB
# lost-write event.
bootstrap.servers=kafka-1.prod.example.com:9092
client.id=bad-huge-buffer-producer
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=org.apache.kafka.common.serialization.StringSerializer
acks=all
enable.idempotence=true
compression.type=zstd
buffer.memory=2147483648
