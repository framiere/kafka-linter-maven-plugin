# RULE: CONSUMER_ISOLATION_READ_UNCOMMITTED_WITH_TXN (producer side of the pair).
# This file enables a transactional producer. The companion txn-consumer.properties
# in the same project does NOT set isolation.level=read_committed, so the project's
# EOS pipeline silently downgrades to at-least-once-with-extras.
bootstrap.servers=kafka-1.prod.example.com:9092
client.id=bad-txn-producer
transactional.id=orders-tx-1
enable.idempotence=true
acks=all
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=org.apache.kafka.common.serialization.StringSerializer
compression.type=zstd
linger.ms=20
