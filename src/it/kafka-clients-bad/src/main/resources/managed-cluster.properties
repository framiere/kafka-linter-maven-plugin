# RULE: SECURITY_PROTOCOL_PLAINTEXT_REMOTE — bootstrap points at Confluent Cloud
# but security.protocol is unset, so the client defaults to PLAINTEXT and the
# TLS handshake fails (or, worse, SASL credentials leak on a misconfigured listener).
bootstrap.servers=pkc-XXXXX.us-east-1.aws.confluent.cloud:9092
client.id=managed-cluster-client
acks=all

# RULE: CONSUMER_HEARTBEAT_SESSION_RATIO — 8s heartbeat in a 10s session means
# a single missed heartbeat evicts the consumer. Official guidance: heartbeat
# must be < 1/3 of session.
heartbeat.interval.ms=8000
session.timeout.ms=10000
