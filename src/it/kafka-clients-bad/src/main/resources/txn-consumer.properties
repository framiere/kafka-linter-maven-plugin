# RULE: CONSUMER_ISOLATION_READ_UNCOMMITTED_WITH_TXN (consumer side of the pair).
# This consumer reads from a project that ships a transactional producer (see
# producer-txn.properties) but does NOT set isolation.level=read_committed.
# Result: this consumer reads aborted-transaction records and pre-commit drafts
# that the producer later rolled back, silently corrupting downstream sinks.
bootstrap.servers=kafka-1.prod.example.com:9092
client.id=bad-txn-consumer
group.id=orders-readers
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Missing: isolation.level=read_committed
auto.offset.reset=earliest
