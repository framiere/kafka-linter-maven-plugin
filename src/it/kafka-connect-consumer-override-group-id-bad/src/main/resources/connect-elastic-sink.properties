name=elastic-sink-events
connector.class=io.confluent.connect.elasticsearch.ElasticsearchSinkConnector
tasks.max=3

topics=events

connection.url=http://es.internal:9200
type.name=_doc
key.ignore=true
schema.ignore=true

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false

# Anti-pattern: overriding the consumer group.id. Connect derives the consumer
# group.id from the connector name (connect-elastic-sink-events). REST API
# offset queries, ACL grants, and JMX metrics all key off the framework-derived
# group — but the actual consumer commits to "legacy-elastic-consumer", creating
# a split-brain where dashboards show zero offsets while data flows correctly.
# To take over offsets from an external consumer, use PUT /connectors/{name}/offsets
# (KIP-875, Kafka 3.6+), not this hijack.
consumer.override.group.id=legacy-elastic-consumer
