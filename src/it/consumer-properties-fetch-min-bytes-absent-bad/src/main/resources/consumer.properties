# RULE: CONSUMER_PROPERTIES_FETCH_MIN_BYTES_ABSENT.
#
# This consumer config is otherwise reasonable — it sets all the
# OTHER consumer knobs explicitly:
#   - group.id set
#   - deserializers set
#   - auto.offset.reset=earliest             (replay/analytics intent)
#   - enable.auto.commit=false               (at-least-once)
#   - max.poll.records=10000                 (BULK — large batches)
#   - max.poll.interval.ms=1800000           (BULK — 30 min)
#   - session.timeout.ms=45000               (pinned)
#   - isolation.level=read_committed         (EOS-aware)
#
# This consumer is the SHAPE of a high-throughput batch ETL: large
# poll batches, generous interval, at-least-once delivery. Such
# consumers benefit ENORMOUSLY from a non-default `fetch.min.bytes`
# because they don't care about latency below ~1 second.
#
# ...but it never sets `fetch.min.bytes`. kafka-clients defaults
# `fetch.min.bytes` to `1` byte — the latency-optimal but
# throughput-pessimal choice.
#
# WHY THIS MATTERS HERE SPECIFICALLY:
#
# The broker waits up to `fetch.max.wait.ms` (default 500 ms) for
# at least `fetch.min.bytes` of data to accumulate across the
# consumer's owned partitions before responding to a `FetchRequest`.
# With `fetch.min.bytes=1`, the broker responds the INSTANT any
# record is available — which on a busy topic means: as fast as
# the broker can answer fetch RPCs, the consumer issues them, each
# carrying typically a single record or just a few.
#
# THE COST SHAPE:
#
# Per-fetch RPC overhead (TCP round-trip, broker request-handler
# thread time to assemble the FetchResponse) is FIXED regardless
# of payload. Doubling the payload does NOT double the per-fetch
# cost — throughput scales SUB-LINEARLY with payload size.
#
# Concrete numbers for this fixture's shape:
#
#   - 500-consumer fleet
#   - 5000-partition log-aggregation topic
#   - default `fetch.min.bytes=1`
#   - average per-consumer fetch rate: 50 RPCs/sec
#   - total broker-side fetch RPC rate:    25,000 RPCs/sec
#   - broker request-handler CPU per fetch: ~50 µs (fixed)
#   - broker request-handler CPU on fetch:  25,000 × 50 µs = 1.25 s/s
#                                          = 125% of ONE broker core
#                                          just on near-empty fetches
#
# Bumping `fetch.min.bytes=100000` makes the broker accumulate 100 KB
# before responding (or wait up to fetch.max.wait.ms=500ms):
#
#   - per-consumer fetch rate:     ~5 RPCs/sec   (10× reduction)
#   - total broker fetch RPC rate: 2,500 RPCs/sec
#   - broker fetch CPU:            12.5% of one core
#   - 10× CPU savings on fetch path with no user-visible latency
#     change for a batch ETL that doesn't care about sub-500ms
#
# CONCRETE FAILURE SHAPES:
#
# (1) Broker CPU pegged by tiny fetches.
#     SREs spend hours diagnosing 'broker CPU at 95%, request-handler
#     thread pool saturated' before realizing the consumer fleet's
#     default `fetch.min.bytes=1` is making 25k near-empty fetches
#     per second. The catch flags the absent key BEFORE deployment.
#
# (2) Nightly ETL throughput collapse under broker contention.
#     ETL consumer reads 100 GB from a 1000-partition topic with
#     default `fetch.min.bytes=1`. ETL takes 6 hours; SLA is 4 hours.
#     Operator can't explain — consumer not CPU-bound, network not
#     saturated, broker at 80% CPU. Setting `fetch.min.bytes=1000000`
#     (1 MB) cuts ETL time to 1.5 hours.
#
# (3) Cross-DC consumer hitting wide-area network.
#     Consumer reads from a topic in a different data center across
#     a 50 ms WAN link. Each fetch RPC pays the WAN RTT. Default
#     `fetch.min.bytes=1` returns ~1 record per RPC — throughput
#     bounded by `records-per-RPC / RTT = 1 / 50ms = 20 records/sec`.
#     Bumping to 500000 returns ~5000 records per RPC = 100,000
#     records/sec. 5000× throughput improvement on the same network.
#
# (4) ML training-data pipeline.
#     Consumer feeds an ML training job that reads at 50 MB/sec from
#     Kafka. Default `fetch.min.bytes=1` makes thousands of tiny
#     fetches; the consumer's CPU is dominated by deserialization
#     overhead (per-record fixed cost). Setting `fetch.min.bytes=
#     500000` batches deserialization, freeing CPU for the GPU
#     pipeline upstream.
#
# (5) Throughput-vs-latency tuning never thought about.
#     Microservice consumes order events for asynchronous processing;
#     doesn't care about latency below 1 second. Default
#     `fetch.min.bytes=1` is silently wasteful. The catch surfaces
#     the absent key, prompting the operator to think 'do I need
#     sub-500ms latency, or can I trade for throughput?'.
#
# INFO severity (not WARNING/ERROR) because the default is
# workload-dependent: silently correct for low-latency consumers
# (monitoring, real-time fraud detection, interactive dashboards),
# silently wasteful for batch consumers (ETL, ML, log aggregation,
# cross-DC). Raised here to ERROR by config override so the IT
# fixture demonstrates the violation deterministically.
#
# Fix: ONE LINE. `fetch.min.bytes=100000` for typical batch
# workloads, `fetch.min.bytes=1000000` for cross-DC ETL,
# `fetch.min.bytes=1` EXPLICITLY for low-latency monitoring (to
# document the choice). The point is: PICK ONE deliberately.
bootstrap.servers=kafka-1.prod.example.com:9092
group.id=orders-batch-etl
client.id=bad-no-fetch-min-bytes-consumer
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
auto.offset.reset=earliest
enable.auto.commit=false
max.poll.records=10000
max.poll.interval.ms=1800000
session.timeout.ms=45000
isolation.level=read_committed
