name=users-cdc
connector.class=io.debezium.connector.mysql.MySqlConnector

tasks.max=1

# Anti-pattern: include.query=true on a Debezium MySQL connector
# capturing the `users` schema in production. By default
# (include.query=false), the connector emits each captured change as a
# Debezium envelope containing before/after row state + source metadata
# (server-id, binlog-file, binlog-position, ts_ms, txId, snapshot-flag).
# With include.query=true, the connector ADDITIONALLY embeds the RAW
# SQL STATEMENT that produced the change into source.query — verbatim
# text, parameter values INLINED into the SQL string (NOT bound
# separately as placeholders), comments included.
#
# This config was originally set during a dev-environment debugging
# session 14 months ago: a junior engineer needed to inspect the
# application's SQL to diagnose a CDC ordering issue, set
# include.query=true, finished the debugging, and forgot to revert. The
# dev config was then copy-pasted to staging, then to production, over
# three subsequent connector deployments. The MySQL servers (dev,
# staging, prod) are all configured with binlog_rows_query_log_events=
# ON (org-wide convention for debuggability), so the include.query=true
# setting is actively populating the source.query field on every
# captured change.
#
# What's currently flowing through cdc.users.users.users on the
# production Kafka cluster (sampled from kafka-console-consumer):
#
#   {"before":{"id":42,...},"after":{"id":42,"email":"alice@example.com",
#    "password_hash":"$2b$12$LMx...","name":"Alice Smith",...},
#    "source":{"server_id":1,"file":"binlog.001234","pos":56789,...,
#    "query":"UPDATE users SET password_hash='$2b$12$LMx7c...0gK',
#    updated_at=NOW() WHERE email='alice@example.com'"},"op":"u",...}
#
# Every UPDATE to a user row, every INSERT to the payment_methods table
# (where card_number is stored — yes, the team is also in violation of
# PCI-DSS Article 3.2.1 on stored-PAN policy, but that's a separate
# audit), every soft-DELETE via UPDATE users SET deleted_at=NOW(),
# embeds the verbatim SQL with PII and (for password updates) the
# BCrypt hash of the new password in source.query.
#
# Downstream consumers (the analytics warehouse via the BigQuery sink
# connector, the long-term retention archive via the S3 sink connector,
# the search-index update consumer, the audit-log consumer) all have
# READ access to the source.query field. The BigQuery sink connector's
# default schema flattens the Debezium envelope to columns including
# source__query — a BigQuery analyst running a SELECT * FROM
# cdc.users.users.users sees every UPDATE statement the application has
# ever issued for every user, with the SQL parameter values inlined.
#
# The S3 archive retains the topic data for 7 years per the team's
# data-retention policy. The BCrypt password hashes in source.query are
# now part of a 7-year-retained file. The GDPR right-to-be-forgotten
# pipeline, when invoked, can delete the user's row from MySQL and the
# user's records from the CDC topic via tombstone+compaction — but it
# CANNOT remove the user's PII from earlier records whose key was
# someone else's user.id but whose source.query mentioned the deleted
# user's email (e.g., a customer-service admin's UPDATE with WHERE
# email='deleted-user@example.com'). The team is in technical breach
# of GDPR; the breach will surface at the next compliance audit.
#
# Fix: include.query=false (the default), or remove the key. The
# cleanup of historically-leaked source.query data in retained topic
# archives is a separate, costly project — but stopping the bleeding
# is a one-line edit. The static-analysis catch surfaces this at PR
# time, BEFORE the dev → staging → production copy-paste happens.
include.query=true

database.hostname=users-mysql-primary.internal
database.port=3306
database.user=debezium
database.password=changeme
database.server.id=184055
database.include.list=users

topic.prefix=cdc.users

schema.history.internal.kafka.bootstrap.servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
schema.history.internal.kafka.topic=schema-history.cdc.users

table.include.list=users.users,users.payment_methods,users.audit_log

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
