name=customers-cdc
connector.class=io.debezium.connector.postgresql.PostgresConnector

tasks.max=1

# Anti-pattern: snapshot.mode=never on a brand-new connector against a
# production Postgres database with 200M existing rows. The connector
# SKIPS the initial snapshot phase entirely and starts streaming from
# the CURRENT WAL LSN. Every row that EXISTS in public.customers and
# public.addresses at connector-start time is INVISIBLE to every
# downstream Kafka consumer.
#
# Downstream impact: the order-fulfillment service's Kafka Streams
# KTable rebuilt off cdc.customers.public.customers has zero entries for
# any customer who hasn't placed an order since connector deployment;
# the analytics warehouse joined off cdc.customers.public.addresses
# under-reports active address count by ~95%; the GDPR-audit pipeline
# (which requires the CDC topic to be a complete replayable record of
# the source database) fails its compliance check.
#
# The connector runs cleanly, the streaming is healthy, the REST API
# reports RUNNING — the only symptom is 'we have less data than
# expected'. Typical diagnosis time: 2-4 weeks. Typical recovery:
# delete the connector + topics, redeploy with snapshot.mode=initial,
# rebuild all downstream KTables — a 24-48 hour outage window.
#
# Fix: snapshot.mode=initial (the default — snapshot once, then stream),
# snapshot.mode=when_needed (snapshot if no offsets exist, otherwise
# stream — equivalent to initial on first start), or
# snapshot.mode=initial_only (snapshot then stop — for bulk-load
# scenarios with a separate stream-only connector).
snapshot.mode=never

database.hostname=customers-pg.internal
database.port=5432
database.user=debezium
database.password=changeme
database.dbname=customers

topic.prefix=cdc.customers

slot.name=debezium_customers
publication.name=dbz_publication_customers
plugin.name=pgoutput

table.include.list=public.customers,public.addresses

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
