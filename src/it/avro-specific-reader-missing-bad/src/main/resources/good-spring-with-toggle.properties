# Control: KafkaAvroDeserializer + specific.avro.reader=true (Spring Boot family).

spring.kafka.bootstrap-servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
spring.kafka.consumer.client-id=good-spring-with-toggle
spring.kafka.consumer.group-id=orders-processor
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.properties.schema.registry.url=http://schema-registry:8081
spring.kafka.properties.specific.avro.reader=true
