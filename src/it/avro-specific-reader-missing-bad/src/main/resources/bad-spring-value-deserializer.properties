# RULE: AVRO_SPECIFIC_READER_MISSING — Spring Boot variant.
#
# Spring Boot exposes the Kafka client config under a different
# property namespace:
#   - kafka-clients native key:  value.deserializer
#   - Spring Boot namespace:     spring.kafka.consumer.value-deserializer
#   - kafka-clients native key:  specific.avro.reader
#   - Spring Boot namespace:     spring.kafka.properties.specific.avro.reader
# The kafka-linter rule recognizes BOTH families and pairs them
# correctly — the spring value-deserializer must be paired with the
# spring specific.avro.reader, the plain ones must be paired
# together.
#
# This file uses the Spring family and omits the toggle. The trap
# is identical: Spring's container constructs a KafkaConsumer with
# the deserializer configured, the deserializer returns
# GenericRecord, and the @KafkaListener method's first cast throws.

spring.kafka.bootstrap-servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
spring.kafka.consumer.client-id=bad-spring-value-deser
spring.kafka.consumer.group-id=orders-processor
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.properties.schema.registry.url=http://schema-registry:8081
# spring.kafka.properties.specific.avro.reader NOT SET -> rule fires
