# RULE: AVRO_SPECIFIC_READER_MISSING — key.deserializer variant.
#
# Same bug as the value-deserializer case, but on the KEY side.
# Keying records by a generated Avro type is uncommon but valid —
# the rule treats both deserializer keys symmetrically because the
# trap is identical: cast site is the same shape, ClassCastException
# is the same, fix is the same.
#
# Note that the rule fires ONCE per file, on whichever of the two
# keys matches first. With only the key deserializer set, the
# fire is attributed to key:key.deserializer.

bootstrap.servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
client.id=bad-plain-key-deser
group.id=orders-processor
key.deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
schema.registry.url=http://schema-registry:8081
# specific.avro.reader NOT SET -> rule fires
