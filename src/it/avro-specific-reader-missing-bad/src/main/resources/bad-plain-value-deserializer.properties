# RULE: AVRO_SPECIFIC_READER_MISSING
#
# This file configures the Confluent KafkaAvroDeserializer as the plain
# kafka-clients value.deserializer key, but never sets
# specific.avro.reader. The rule fires.
#
# What happens at runtime without specific.avro.reader=true:
#   1. The Avro deserializer pulls the schema bytes off the wire and
#      asks the Schema Registry for the writer schema (cached after
#      the first lookup).
#   2. With specific.avro.reader unset (the default is false), the
#      deserializer uses GenericDatumReader and returns
#      GenericRecord — a Map-like object indexed by field name.
#   3. The application code typically does the natural thing:
#        OrderEvent e = (OrderEvent) record.value();
#      That cast throws ClassCastException on the FIRST record because
#      GenericRecord is not OrderEvent.
#   4. The bug only surfaces in environments where real records are
#      consumed. Unit tests that mock the deserializer pass; the
#      bytecode-level shape of the code looks identical to the
#      working variant.
#
# Fix: set specific.avro.reader=true and ensure the generated Avro
# class is on the classpath. The deserializer then returns the
# concrete type and the cast succeeds.

bootstrap.servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
client.id=bad-plain-value-deser
group.id=orders-processor
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
schema.registry.url=http://schema-registry:8081
# specific.avro.reader NOT SET -> rule fires
