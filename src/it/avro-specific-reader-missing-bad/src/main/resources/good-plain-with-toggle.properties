# Control: KafkaAvroDeserializer + specific.avro.reader=true (plain).
#
# The deserializer is configured AND the toggle is set in the SAME
# property family (kafka-clients native keys). Rule pairs them and
# is silent.

bootstrap.servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
client.id=good-plain-with-toggle
group.id=orders-processor
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
schema.registry.url=http://schema-registry:8081
specific.avro.reader=true
