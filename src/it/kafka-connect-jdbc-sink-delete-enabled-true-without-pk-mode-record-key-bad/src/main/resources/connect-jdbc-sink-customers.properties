# =============================================================================
# Confluent JDBC sink connector mirroring the `cdc.public.customers` topic
# (produced by an upstream Debezium Postgres source) into a Postgres analytics
# warehouse table.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#   delete.enabled = true     (with pk.mode = record_value)
#
# WHY THIS IS A CONNECTOR-WONT-START BUG WITH SILENT-LOOKING SYMPTOMS:
#
# Kafka's TOMBSTONE record is the protocol-level signal for 'this key is
# deleted': a record with a non-null KEY and a NULL VALUE. Downstream
# consumers that maintain key-indexed state — compacted topics, Kafka Streams
# KTable, KSQL TABLE, Confluent JDBC sink with delete.enabled=true,
# Mirror Maker 2 compacted-topic replication — interpret a tombstone as
# 'remove this key from your state'.
#
# The Confluent JDBC sink connector's `delete.enabled=true` config opts into
# this behavior: on each consumed tombstone, the sink issues a SQL
# `DELETE FROM <table> WHERE <pk-col>=<pk-value>` against the target. To do
# that, the sink MUST know:
#
#   - WHICH TABLE       — derived from topic name + table.name.format
#   - WHICH PK COLUMN   — derived from the connector's PK configuration
#   - WHICH PK VALUE    — extracted from the record AT RUNTIME
#
# Since a tombstone has, by definition, a NULL value (that's what makes it a
# tombstone), the ONLY place to extract the PK from is the record KEY.
# Therefore `pk.mode=record_key` is the only valid pairing with
# `delete.enabled=true`.
#
# Confluent's JDBC sink enforces this with a hard cross-key constraint at
# startup. Each non-record_key pk.mode is incompatible:
#
#   pk.mode = none           — no PK at all; DELETE WHERE clause impossible.
#   pk.mode = kafka          — synthetic PK from topic+partition+offset;
#                              doesn't match source-DB row identity, so the
#                              DELETE either targets nothing or, worse, the
#                              wrong row.
#   pk.mode = record_value   — PK lives in the value envelope, but the value
#                              is NULL for a tombstone, so the PK cannot be
#                              extracted.
#
# THE VIOLATION:
#
# This config sets `delete.enabled = true` AND `pk.mode = record_value`. The
# connector's start() throws:
#
#   ConfigException: pk.mode must be record_key when delete.enabled is true
#
# The task transitions to FAILED. The CONNECTOR state remains RUNNING (Connect
# allows this state combination — a connector can be RUNNING while ALL tasks
# are FAILED). The connector-status REST endpoint shows the sink as 'running';
# only the per-task status endpoint surfaces the FAILED state.
#
# CONSEQUENCES:
#
#   - Connector deploys cleanly (REST POST returns 201 Created).
#   - Operator's dashboard shows 'sink running'.
#   - NO records are ever consumed (the task is FAILED — it never enters the
#     poll/put loop).
#   - The downstream Postgres `customers_warehouse` table receives nothing —
#     no INSERTs, no UPDATEs, no DELETEs.
#   - Analytics dashboards show zero rows; analytics team assumes a Kafka- or
#     schema-registry-side issue; spends days debugging the wrong layer.
#   - Hours-to-days before someone checks the per-task status endpoint and
#     discovers the ConfigException.
#
# FIX (the canonical CDC-sink configuration):
#
#   delete.enabled = true
#   insert.mode    = upsert
#   pk.mode        = record_key
#   pk.fields      = id           # the column name in the Kafka record key
#
# This pairs with an upstream Debezium connector that emits each source-row's
# primary key in the Kafka record key, and emits TOMBSTONES for source-DB
# DELETE events. The sink translates the tombstones into target-table DELETEs.
#
# Alternative fixes:
#   (a) delete.enabled = false    — disable delete propagation entirely; the
#                                   sink will silently ignore tombstones and
#                                   leave deleted source rows in the target.
#                                   Acceptable when the target is an audit/
#                                   history table that should retain deleted
#                                   rows; NOT acceptable for a live mirror.
#
#   (b) keep pk.mode=record_value — only if delete.enabled=false. The
#                                   resulting sink can upsert from the value
#                                   envelope but cannot propagate deletes.
# =============================================================================

name=customers-warehouse-sink
connector.class=io.confluent.connect.jdbc.JdbcSinkConnector
tasks.max=2

topics=cdc.public.customers

connection.url=jdbc:postgresql://analytics-db.internal:5432/warehouse
connection.user=connect
connection.password=changeme

# VIOLATION: delete.enabled=true requires pk.mode=record_key (the ONLY valid
# pairing — tombstones have no value, so the PK must come from the key). With
# pk.mode=record_value, the sink CANNOT extract the PK from a NULL value, and
# the connector's start() throws ConfigException: pk.mode must be record_key
# when delete.enabled is true. The task transitions to FAILED while the
# connector reports RUNNING.
insert.mode=upsert
delete.enabled=true
pk.mode=record_value
pk.fields=id
auto.create=true

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
