# =============================================================================
# Debezium PostgreSQL connector capturing `public.orders` from the orders
# OLTP database.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#   skipped.operations = u,d
#
# WHY THIS IS A DATA-COMPLETENESS BUG:
#
# Debezium's `skipped.operations` config takes a comma-separated list of
# CDC operation-type codes that the connector should DROP before emitting
# them as Kafka records. The codes are:
#
#   c — row INSERT (a new row was added to the source table)
#   u — row UPDATE (an existing row was modified)
#   d — row DELETE (a row was removed)
#   t — TRUNCATE (the entire table was truncated; no per-row payload)
#   r — READ (a row emitted during the INITIAL-SNAPSHOT phase to populate
#         downstream state with the existing table contents)
#
# The Debezium 2.x default is `t` — TRUNCATEs are skipped because they
# carry no row data and most downstream consumers (Kafka Streams
# aggregations, JDBC sinks, search-index updaters) cannot meaningfully
# process a 'this entire table was emptied' signal.
#
# THE VIOLATION:
#
# This config sets `skipped.operations = u,d` — silently dropping every
# UPDATE and DELETE on the `public.orders` source table. The Kafka topic
# receives ONLY INSERTs and the initial-snapshot READs. Downstream
# consumers:
#
#   1. The downstream search index sees the post-insert state of each
#      order ONCE and never sees any subsequent state changes. A customer
#      updates their order from "pending" to "shipped" — the search index
#      shows "pending" forever. Customer support gets escalations about
#      "stale" order status.
#
#   2. The downstream analytics warehouse sees every order create event
#      but never any deletion. An order is deleted from the source
#      (chargeback fraud detection deletes the row); the warehouse
#      retains it. Six months later, a compliance audit asks "what was
#      the state of order 12345 on 2026-01-15?" — the warehouse shows
#      the order exists, but the source database deleted it 5 months ago.
#      The audit team escalates: the warehouse showed an order that
#      didn't legally exist for 5 months.
#
#   3. Downstream and source diverge with no signal. There is no metric,
#      no log entry, no DLQ entry indicating that the connector dropped
#      these events. The drop happens BEFORE the converter layer; the
#      events never become Kafka records.
#
# The `skipped.operations` config was designed for TRUNCATE filtering
# (the default `t`) and optionally READ filtering (`r`) for connectors
# intended only for ongoing change-capture (downstream bootstrapped via
# a separate process). Using it to filter `c`, `u`, or `d` is the wrong
# tool — those use cases should be implemented via downstream Single-
# Message-Transforms (visible in the connector topology) or consumer-
# side filtering, where the data-loss is auditable.
#
# REAL-WORLD INCIDENT SHAPES:
#
#   - "We don't model deletes downstream, so let's drop them at the
#     source" → compliance violations when deleted rows persist
#     downstream.
#
#   - "Updates are too noisy, let's only emit creates" → downstream
#     state diverges from source by every UPDATE ever made.
#
#   - "Inserts cause OOM on the downstream during initial bootstrap" →
#     operator adds `c` to skipped.operations as a temporary fix, never
#     reverts it, every new row added thereafter is silently absent.
#
#   - Helm chart with `skipped.operations: u,d` as a default 'for
#     append-only downstreams' propagates the data-loss across the org.
#
# FIX:
#
#   Remove this line (default `t` is correct), OR set
#   skipped.operations = t   # or t,r if snapshot READs are unwanted
#
# To filter operations downstream, use a Connect Single-Message-Transform
# with a predicate, e.g.:
#
#   transforms                = dropDeletes
#   transforms.dropDeletes.type      = org.apache.kafka.connect.transforms.Filter
#   transforms.dropDeletes.predicate = isDelete
#   predicates                 = isDelete
#   predicates.isDelete.type   = org.apache.kafka.connect.transforms.predicates.RecordIsTombstone
#
# This makes the filtering visible in the connector topology and easy
# to audit, instead of silently dropping events before they reach Kafka.
# =============================================================================

name=orders-source
connector.class=io.debezium.connector.postgresql.PostgresConnector
tasks.max=1

database.hostname=orders-db.internal
database.port=5432
database.user=debezium
database.password=changeme
database.dbname=orders
topic.prefix=db.orders

plugin.name=pgoutput
slot.name=debezium_orders_slot
publication.name=debezium_orders_pub
publication.autocreate.mode=filtered
table.include.list=public.orders

# VIOLATION: silent data loss for UPDATEs and DELETEs. Every UPDATE and
# DELETE on `public.orders` is silently dropped before reaching Kafka —
# no log entry, no metric, no DLQ. Downstream consumers see only the
# initial-snapshot READs and subsequent INSERTs; the post-update state
# of any modified order is never emitted; deleted orders persist
# downstream forever. Should be `t` (the default) or removed entirely.
# To filter operations downstream, use a Connect SMT (visible in the
# topology) instead of silently dropping at the connector layer.
skipped.operations=u,d

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false

schema.history.internal.kafka.topic=schema-history.orders-source
schema.history.internal.kafka.bootstrap.servers=kafka.internal:9092
