# RULE: CONNECT_TASKS_MAX_ABSENT.
#
# This Connect connector config is otherwise reasonable:
#   - name set                            (registration identity)
#   - connector.class set to JDBC sink    (real, parallelizable connector)
#   - topics set                          (subscribes to a 24-partition topic)
#   - connection.url set                  (Postgres target)
#   - auto.create=true                    (DDL-managed)
#   - insert.mode=upsert                  (idempotent writes)
#   - pk.mode=record_key                  (uses record key as PK)
#   - errors.tolerance=none               (fail-fast on bad records)
#   - errors.deadletterqueue.topic.name set (DLQ defined)
#   - key.converter / value.converter set
#
# ...but it never sets `tasks.max`. Kafka Connect defaults this to `1`.
#
# THE BUG SHAPE THIS RULE CATCHES:
#
# `tasks.max` is the connector's parallelism dial. It is declared in
# `org.apache.kafka.connect.runtime.ConnectorConfig.TASKS_MAX_CONFIG` as:
#
#     ConfigDef.Type.INT, default = 1, validator = Range.atLeast(1)
#
# When absent from the connector .properties, Connect parses the
# config with `tasks.max=1`. The worker then calls
# `Connector#taskConfigs(int maxTasks)` with `maxTasks=1` and the
# connector returns a list of length 1. EXACTLY ONE task is
# scheduled, regardless of how many partitions the source topic has.
#
# For a SINK connector consuming from a topic with N>1 partitions,
# this means:
#
#   - All N partitions are assigned to the ONE running task.
#   - The task's WorkerSinkTask instance polls all N partitions
#     through a single Kafka consumer instance.
#   - The task's SinkTask.put() implementation processes records
#     SERIALLY (Connect calls put() in a single thread per task).
#   - Aggregate throughput is bounded by:
#       min(single-consumer poll rate × N,
#           single-task put() processing rate)
#     — typically the put() rate (the network round-trip to the
#     downstream sink dominates).
#
# Real-world consequence: a JDBC sink to a 24-partition topic with
# tasks.max=1 will write to Postgres at the per-row INSERT round-
# trip rate × 1 task = ~5000 rows/sec. The same connector with
# tasks.max=24 will write at ~24 × the put() rate = ~80,000+
# rows/sec (now limited by Postgres write capacity, not by Connect
# parallelism). The throughput delta is 16-24×.
#
# The operator's misperception: they deployed the connector,
# observed it processes records, and assumed Connect "scales
# automatically" with the cluster. The connector log shows one
# running task; the operator may notice but not understand that
# tasks.max controls this. Capacity-planning assumptions are wrong
# from day one — the team sizes the source topic's partition count
# for "24 parallel consumers" but Connect runs 1.
#
# CONCRETE FAILURE MODES:
#
# (1) Sink to a multi-partition topic with no tasks.max.
#     Team deploys JDBC sink to a 24-partition topic. They size the
#     topic for 24 parallel consumers (= 24 tasks). They forget to
#     set tasks.max. Connect defaults to 1. The connector runs one
#     task that polls all 24 partitions through a single consumer.
#     Throughput plateaus at 5000 rows/sec; expected 80,000+ rows/
#     sec. The operator investigates: partition-assignment metric
#     shows one task with 24 assigned partitions. Fix is one line:
#     `tasks.max=24`. Three months of under-utilization recovered.
#
# (2) S3 sink under-provisioned.
#     Team's S3 sink writes records with `flush.size=100000` and
#     `rotate.interval.ms=300000`. Source topic has 12 partitions.
#     No tasks.max. One task buffers records from all 12 partitions;
#     `flush.size=100000` is reached 12× faster than designed
#     (because it pools from 12 sources). Buffer hits S3 PUT limits;
#     worker heap pressure during the flush; OOM kills the worker.
#     Fix: `tasks.max=12` gives each task one partition; buffer
#     flushes at the expected rate; no heap pressure.
#
# (3) Template inheritance from Debezium config.
#     Team's first Connect deployment was Debezium Postgres
#     (legitimately single-task — `MySqlConnector#taskConfigs`
#     hardcodes a one-element list). The team's standard Connect
#     deployment template inherited `# tasks.max defaults to 1` as
#     a comment with no actual value. Every subsequent connector
#     deployed via the template inherits the implicit default.
#     JDBC sinks to 32-partition topics, S3 sinks with thousands
#     of input partitions, custom sinks designed for parallelism
#     — all run with one task. Year-long productivity gap.
#
# (4) Per-environment override missing for production.
#     Dev and staging have `tasks.max=1` set deliberately (low-
#     cost, deterministic testing). The production overlay was
#     supposed to set `tasks.max=24` but the override file was
#     omitted from the production Kustomize patch. Production
#     connector deploys without tasks.max, falls through to the
#     framework default of 1. Production throughput is 24× under
#     expectation. Operators don't notice for weeks because the
#     dashboards measure "records processed" (which is up) not
#     "task count" (which is silently wrong).
#
# (5) Auto-scale script writing to the wrong file.
#     Team's connector auto-scale script reads partitionCount from
#     a Kafka admin client and intended to set `tasks.max=
#     $partitionCount`. The script has a bug: it writes
#     `tasks.max=$partitionCount` to a sibling file
#     `tasks-max.properties` instead of appending to the
#     connector's `.properties`. The actual connector .properties
#     has no tasks.max. Connect uses the default of 1. The auto-
#     scale script appears to work (it writes a file with no
#     errors), the operator believes parallelism scales with
#     partitions, but in reality every connector runs with 1 task.
#
# (6) Migration from Kafka 0.10 → modern Connect.
#     Team's connector config dates back to Kafka 0.10 where
#     `tasks.max` was a REQUIRED key with no default. When the
#     team upgrades Connect and adopts a tooling pass that
#     "removes redundant defaults", an automated cleanup PR
#     deletes the explicit `tasks.max=8` line from every connector
#     .properties (because the tooling believed Connect's default
#     of 1 would apply — true, but the operator's INTENDED default
#     was 8). Throughput drops 8× post-merge. The static-analysis
#     catch surfaces the missing knob at PR review time.
#
# WHY THIS RULE IS INFO (NOT WARNING/ERROR):
#
# The default `tasks.max=1` is genuinely correct for SOME real
# connectors:
#
#   - Debezium MySQL (single binlog reader, see
#     CONNECT_DEBEZIUM_MYSQL_TASKS_MAX_GREATER_THAN_ONE).
#   - Debezium Postgres (single logical-replication slot, see
#     CONNECT_DEBEZIUM_POSTGRES_TASKS_MAX_GREATER_THAN_ONE).
#   - Debezium Oracle (single LogMiner session).
#   - Debezium DB2 (single ASN-table reader).
#   - Custom source connectors that hold an exclusive resource
#     (a database lock, a leader election, a single API session).
#
# For these, the connector's `taskConfigs(int maxTasks)`
# implementation hardcodes a one-element list — `tasks.max`
# above 1 is silently ignored.
#
# For everything else (sink connectors to multi-partition topics,
# JDBC source with multi-table polling, S3 source with multi-
# prefix reads, custom parallelizable sources), `tasks.max=1` is
# under-provisioned. The plugin cannot infer the connector's
# parallelism semantics from `connector.class` alone without an
# exhaustive class allowlist that would lag behind the connector
# ecosystem.
#
# INFO is the right default. Operators raise to WARNING/ERROR for
# connector classes they KNOW to be parallelizable.
# Raised here to ERROR by config override so the IT fixture
# demonstrates the violation deterministically.
#
# Fix: ONE LINE.
#   - `tasks.max=1` to explicitly document the deliberate single-
#     task choice (for single-task-by-design connectors).
#   - `tasks.max=<partition-count>` for sink connectors at maximum
#     parallelism.
#   - `tasks.max=<table-count>` or `<prefix-count>` for
#     parallelizable source connectors.
#
# The point is: PICK ONE deliberately.
name=orders-to-postgres-sink
connector.class=io.confluent.connect.jdbc.JdbcSinkConnector
topics=orders-events
connection.url=jdbc:postgresql://postgres-prod.example.com:5432/orders
connection.user=connect_writer
auto.create=true
insert.mode=upsert
pk.mode=record_key
pk.fields=order_id
errors.tolerance=none
errors.deadletterqueue.topic.name=orders-to-postgres-sink-dlq
errors.deadletterqueue.topic.replication.factor=3
errors.deadletterqueue.context.headers.enable=true
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry.example.com:8081
value.converter.auto.register.schemas=false
