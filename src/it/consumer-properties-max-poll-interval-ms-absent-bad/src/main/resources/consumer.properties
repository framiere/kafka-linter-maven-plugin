# RULE: CONSUMER_PROPERTIES_MAX_POLL_INTERVAL_MS_ABSENT.
#
# This consumer config is otherwise reasonable:
#   - group.id set
#   - deserializers set
#   - auto.offset.reset=earliest (replay/analytics intent)
#   - enable.auto.commit=false   (at-least-once)
#   - max.poll.records=500       (explicit, not relying on default)
#
# ...but it never sets `max.poll.interval.ms`. kafka-clients defaults
# `max.poll.interval.ms` to `300000` (5 minutes). This is the broker's
# patience: the maximum time between two `poll()` calls before the
# group coordinator declares the consumer dead and triggers a
# rebalance, redistributing its partitions to other group members.
#
# Why this matters HERE specifically: the implicit pairing
# (max.poll.records, max.poll.interval.ms) must satisfy
#   p99-per-record-cost × max.poll.records < max.poll.interval.ms × 0.5
#
# With defaults: 500 records × p99-cost < 150000 ms → p99-cost < 300 ms.
# Workloads where each record needs an external HTTP call, an LLM
# inference, a synchronous DB write, or a complex transform routinely
# exceed 300 ms per record. The operator never realized that the
# combination of their per-record processing cost and the default
# 5-minute interval sits above the rebalance-storm threshold.
#
# NOTE: KIP-62 (Kafka 0.10.1) DECOUPLED the consumer heartbeat from
# `poll()`. The heartbeat thread keeps the session alive on its own
# timer (`session.timeout.ms`, default 45000 ms). But the broker
# ADDITIONALLY enforces `max.poll.interval.ms`: even if the heartbeat
# thread is healthy, if the application thread does not call `poll()`
# within `max.poll.interval.ms`, the coordinator evicts the consumer.
# This is the failure mode this rule catches — operators who pre-KIP-62
# assumed 'as long as the heartbeat fires we're fine' are still bitten.
#
# CONCRETE FAILURE MODE:
#
# A consumer applies an LLM inference to each record:
#   - p99 of LLM inference call: 1500 ms (1.5 s)
#   - explicit max.poll.records: 500
#   - per-batch cost: 500 × 1500 ms = 750000 ms = 12.5 minutes
#   - max.poll.interval.ms default: 300000 ms = 5 minutes
#   - per-batch cost > max.poll.interval.ms → consumer evicted
#     mid-batch, partitions rebalance to another consumer in the group
#   - new owner also takes 12.5 minutes → evicted again
#   - rebalance storm: kafka.consumer:type=consumer-coordinator-
#     metrics,client-id=*: rebalance-rate-per-hour climbs;
#     last-rebalance-seconds-ago constantly resetting to 0;
#     records-lag-max grows without bound; throughput collapses
#
# Operators see "consumer lag growing" in dashboards, look at broker
# metrics (they're fine), and discover hours later that the root
# cause is the implicit interval sizing.
#
# CONTRAST WITH MAX_POLL_RECORDS_ABSENT:
#   - max.poll.records too high     → same pairing-constraint violation
#   - max.poll.interval.ms too low  → same pairing-constraint violation
#   - both implicit                 → DOUBLE-implicit; operator has
#                                     no idea where the threshold is
#
# This rule catches the second axis of the pair: even when the
# operator has thought about `max.poll.records` (set explicitly here
# to 500), they may still rely on the implicit `max.poll.interval.ms`
# default of 5 minutes — which is the OTHER half of the constraint.
#
# INFO severity (not WARNING/ERROR) because the default 300000 is
# defensible for typical workloads (<300 ms per record × 500 records).
# The rule is a 'have you thought about worst-case batch time?' nudge.
# Raised here to ERROR by config override so the IT fixture
# demonstrates the violation deterministically.
#
# Fix: ONE LINE. `max.poll.interval.ms=900000` (15 min) for
# slow-per-record workloads (HTTP, LLM, DB), `max.poll.interval.ms=
# 60000` (1 min) for fast-fail strict-latency workloads, or
# `max.poll.interval.ms=300000` EXPLICITLY to document that the
# default was deliberately chosen and matched against measured
# p99-per-record-cost × max.poll.records.
bootstrap.servers=kafka-1.prod.example.com:9092
group.id=orders-llm-enrichment
client.id=bad-no-max-poll-interval-consumer
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
auto.offset.reset=earliest
enable.auto.commit=false
max.poll.records=500
isolation.level=read_uncommitted
