name=jdbc-sink-loop
connector.class=io.confluent.connect.jdbc.JdbcSinkConnector
tasks.max=1

# Anti-pattern: 'orders.dlq' appears BOTH as an input topic AND as the DLQ
# destination. Every record that fails JSON conversion on the orders.dlq
# input partition will be published to errors.deadletterqueue.topic.name,
# which is orders.dlq, which is then re-consumed by this same sink, fails
# JSON conversion again (the record bytes are identical), is re-published
# to orders.dlq, and so on at full broker throughput until the broker disk
# fills and the cluster goes read-only.
topics=orders,prices,orders.dlq

connection.url=jdbc:postgresql://db.internal:5432/analytics
connection.user=connect
connection.password=secret
insert.mode=insert
auto.create=true

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false

# DLQ wired up to absorb poison pills — except the DLQ topic is itself in
# the topics= consumption list above, creating the infinite loop.
errors.tolerance=all
errors.deadletterqueue.topic.name=orders.dlq
errors.deadletterqueue.topic.replication.factor=3
errors.deadletterqueue.context.headers.enable=true
