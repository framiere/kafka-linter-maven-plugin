name=debezium-orders-cdc
connector.class=io.debezium.connector.postgresql.PostgresConnector
tasks.max=1

database.hostname=orders-db.internal
database.port=5432
database.user=debezium
database.password=secret
database.dbname=orders
topic.prefix=cdc.orders
plugin.name=pgoutput

# Anti-pattern: this connector shares slot.name=debezium_shared with a
# peer Postgres connector (connect-debezium-inventory.properties). The
# Postgres logical-replication slot is exclusive; only one consumer can
# attach. The peer will fail-loop on startup with 'replication slot
# "debezium_shared" is active for PID <N>'.
slot.name=debezium_shared

table.include.list=public.orders,public.order_items

schema.history.internal.kafka.topic=cdc.orders.schema-history
schema.history.internal.kafka.bootstrap.servers=kafka-1.prod.example.com:9092

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
