# =============================================================================
# IT fixture: STREAMS_PROPERTIES_TASK_TIMEOUT_MS_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A Kafka Streams .properties file destined for `new StreamsConfig(props)`.
#   It declares a complete production-quality Streams config for a SINGLE-
#   SOURCE WINDOWED AGGREGATION topology (orders-events stream tumbling-
#   windowed by 1 hour with a running per-customer order-count aggregate)
#   — application.id, bootstrap.servers, default serdes, processing
#   guarantee, replication factor, min.insync.replicas, num.standby.replicas,
#   num.stream.threads, commit.interval.ms, state.dir, both exception
#   handlers, topology.optimization=all, AND `max.task.idle.ms=0`
#   explicitly (because this topology has NO joins or merges — single
#   source, single aggregate, so the wall-clock-arrival default is correct
#   and the operator wants it documented). Everything is set correctly
#   EXCEPT `task.timeout.ms` is not set anywhere.
#
# What's wrong
#   `org.apache.kafka.streams.StreamsConfig.TASK_TIMEOUT_MS_CONFIG`
#   declares `task.timeout.ms` with:
#
#     ConfigDef.Type.LONG, default = 300000 (5 minutes),
#     importance = MEDIUM, validator = ConfigDef.Range.atLeast(0)
#
#   KIP-572 (Apache Kafka 2.8, June 2021) introduced this knob as the
#   UNIFIED retry budget for ALL retriable exceptions a StreamThread
#   encounters during task processing:
#
#     - TimeoutException from the embedded producer's send-callback
#       (broker briefly unavailable, partition leader change, network
#       jitter).
#     - TimeoutException from the embedded consumer's poll/commit/
#       listOffsets (default.api.timeout.ms exhausted).
#     - OffsetOutOfRangeException (consumer position no longer on the
#       broker — recoverable via auto.offset.reset).
#     - TaskCorruptedException (state-store / changelog offsets
#       inconsistent — recoverable via state-restore round-trip).
#     - Transient NotEnoughReplicasException,
#       NotLeaderForPartitionException, LeaderNotAvailableException,
#       UnknownTopicOrPartitionException during a broker mid-
#       leadership-change.
#
#   The StreamThread maintains a per-task retry deadline. When the
#   cumulative wall-clock time spent retrying ONE task exceeds
#   `task.timeout.ms`, the task transitions to FAILED and the
#   configured Thread.UncaughtExceptionHandler decides the fate of
#   the whole KafkaStreams instance (default SHUTDOWN_CLIENT — kill
#   the entire instance, NOT just the failed task).
#
#   The default `300000` (5 min) covers TYPICAL rolling-restart-
#   shaped outages (broker rolling restart through 3-5 nodes, leader
#   re-election after a single broker failure, partition reassignment
#   completing in a few minutes). It does NOT cover two important
#   failure shapes the linter wants the operator to consider:
#
#     (a) PROLONGED outages — controller failover with metadata-
#         quorum recovery (KRaft), AZ-to-AZ network partition,
#         cluster-wide config-change rolling upgrade. All have 10-30
#         minute envelopes. With the 5-min default, the StreamThread
#         gives up at the halfway point and the topology dies into
#         CrashLoopBackOff for the duration of the outage.
#
#     (b) FAIL-FAST workloads (financial settlement, regulatory CDC,
#         ledger writes) where operators DELIBERATELY want retriable
#         errors to halt the topology and page on-call IMMEDIATELY.
#         The default 5 min masks the first error for 5 minutes;
#         setting task.timeout.ms=0 opts out of retries entirely.
#
# Why this is "INFO" by default (not WARNING or ERROR)
#   (a) For the MAJORITY of production Streams workloads, the default
#       5 min is fine — typical broker outages are well under that.
#       The rule is a 'have you thought about your retry budget?'
#       nudge, not a deployment-blocker.
#
#   (b) The right NON-DEFAULT value is workload-dependent — 30 min
#       for prolonged-outage tolerance, 0 for fail-fast — and the
#       linter cannot infer the workload character from .properties
#       alone.
#
#   (c) The bug shape is delayed and outage-triggered: it doesn't
#       manifest at deploy time, only during the next prolonged-
#       outage event (cluster upgrade, controller failover, AZ
#       isolation). Most operators only discover the budget
#       mis-fit during an incident.
#
#   INFO is the right level: surfaces the missing knob and prompts a
#   deliberate workload-specific choice without false-alarming the
#   typical-default workloads.
#
#   This IT overrides severity to ERROR via pom.xml configuration to
#   force the build to fail and verify the rule fires.
#
# Common bug shapes
#   (1) Controller failover with metadata-quorum recovery — 5 min not enough.
#       KRaft cluster encounters a controller failure; the metadata-
#       quorum elects a new controller; the recovery process touches
#       every partition's high-watermark; cluster takes 8 minutes to
#       fully recover. During minutes 0-8, every Streams send and
#       poll throws TimeoutException. At minute 5, task.timeout.ms
#       (default 300000) is exhausted; the StreamThread's task
#       transitions to FAILED; SHUTDOWN_CLIENT fires; the
#       KafkaStreams instance dies. Kubernetes restarts the pod into
#       the same outage stream; the new pod dies at minute 10.
#       CrashLoopBackOff until the cluster fully recovers. Setting
#       `task.timeout.ms=1800000` (30 min) absorbs the worst-case
#       controller-recovery window.
#
#   (2) AZ-to-AZ network partition — 5 min not enough.
#       An AZ-isolation event in AWS isolates the Streams-instance
#       AZ (us-east-1a) from the broker AZ (us-east-1b) for 12
#       minutes. Every send and poll fails with TimeoutException.
#       The StreamThread's task budget (default 5 min) is exhausted
#       at the halfway point; the task transitions to FAILED; the
#       KafkaStreams instance dies. After the partition heals, the
#       new pod recovers but lost 12 min of processing. Setting
#       `task.timeout.ms=1800000` (30 min) covers the partition
#       envelope; the Streams instance just retries through it.
#
#   (3) Cluster-wide config-change with 10-min convergence — 5 min
#       not enough.
#       Operator pushes a cluster-wide
#       `inter.broker.protocol.version` upgrade; the cluster takes
#       10 min to converge through 30+ brokers. Streams instances
#       see a stream of NotLeaderForPartitionException,
#       LeaderNotAvailableException, TimeoutException mixed
#       throughout. With task.timeout.ms=300000 (default 5 min),
#       the task budget is exhausted at the halfway point and the
#       topology dies. Across an org with 50+ Streams apps,
#       operators see a flood of CrashLoopBackOff alerts during
#       routine cluster upgrades. Setting `task.timeout.ms=1800000`
#       (30 min) absorbs the upgrade window.
#
#   (4) Fail-fast financial settlement — 5 min default MASKS a real
#       bug.
#       A financial-settlement Streams app processes settlement
#       events; every record matters; retriable errors mean the
#       broker is unhealthy; the operator deliberately wants the
#       on-call paged IMMEDIATELY rather than have the topology
#       silently retry. With task.timeout.ms=300000 (default), the
#       StreamThread retries for 5 minutes before the on-call gets
#       paged — 5 minutes of delayed settlement records. The
#       operator should set `task.timeout.ms=0` to opt out of
#       retries; the FIRST retriable error fails the task and
#       surfaces the broker-health issue immediately.
#
#   (5) Spring Boot Streams autoconfig — org-wide default leak.
#       Spring Boot's Streams autoconfiguration (`spring-kafka`)
#       provides a `KafkaStreamsConfiguration` bean from
#       `application.yml`. The default Spring template DOES NOT
#       include `task.timeout.ms`. Every Spring Boot Streams app
#       inherits the framework default 5 min. For an org with
#       diverse workloads (some need 30-min tolerance, some need
#       fail-fast), the org-wide default-leak masks workload-
#       specific tuning.
#
#   (6) Streams version upgrade — pre-KIP-572 behavior was different.
#       Apache Kafka <2.8 had per-exception retry handling
#       (TimeoutException retried per delivery.timeout.ms,
#       OffsetOutOfRangeException died immediately). Upgrading to
#       Streams 2.8+ silently introduces the 5-min cumulative-retry
#       budget. The same workload that survived a 10-min broker
#       outage on Streams 2.7 now dies at the 5-min mark on Streams
#       2.8+. The upgrade is the trigger; the bug appears at the
#       next long-tail outage.
#
# Fix
#   ONE LINE. For typical production workloads (the most common case):
#     task.timeout.ms=300000           # 5 min explicit — documents
#                                      # the deliberate choice;
#                                      # insulates from future
#                                      # framework default changes.
#
#   For workloads that must survive prolonged broker outages
#   (controller failover, AZ isolation, cluster-wide upgrades):
#     task.timeout.ms=1800000          # 30 min — absorbs prolonged-
#                                      # outage envelopes; combine
#                                      # with paired health-check
#                                      # monitoring to detect non-
#                                      # retriable errors masquerading
#                                      # as retriable.
#
#   For fail-fast workloads (financial settlement, regulatory CDC,
#   ledger writes):
#     task.timeout.ms=0                # Opts out of retries; first
#                                      # retriable error fails the
#                                      # task; on-call paged
#                                      # IMMEDIATELY.
#
# Sibling rules
#   `STREAMS_TASK_TIMEOUT_MS_TOO_HIGH` catches the bytecode-detected
#   explicit too-high value in code-side `Properties.put()` calls
#   (e.g., `task.timeout.ms=3600000` = 1 hour, which masks problems
#   for too long); `STREAMS_TASK_TIMEOUT_MS_ZERO` catches the
#   bytecode-detected explicit zero (should be deliberate). This rule
#   catches the .properties-file absent case where the operator never
#   set the knob at all.
# =============================================================================

application.id=orders-events-hourly-aggregate-stream
bootstrap.servers=broker-1.kafka.prod.example.com:9092,broker-2.kafka.prod.example.com:9092,broker-3.kafka.prod.example.com:9092

# Default serdes used by topology operators that don't pass explicit
# Consumed/Produced/Materialized/Grouped.
default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
default.value.serde=io.confluent.kafka.streams.serdes.avro.SpecificAvroSerde

# Internal-topic durability (replication factor for changelog + repartition topics).
replication.factor=3
min.insync.replicas=2

# Throughput & latency.
num.stream.threads=8
commit.interval.ms=5000

# HA for stateful tasks — 1 warm copy of every state-store partition.
num.standby.replicas=1

# At-least-once with explicit commit cadence.
processing.guarantee=at_least_once

# State-store location (outside /tmp; survives container restarts when mounted as a volume).
state.dir=/var/lib/kafka-streams/orders-events-hourly-aggregate

# Internal-topic-layout consolidation (KIP-295 / KIP-862).
topology.optimization=all

# Exception handlers — both set, so the existing handler-absent rules don't fire.
default.deserialization.exception.handler=org.apache.kafka.streams.errors.LogAndContinueExceptionHandler
default.production.exception.handler=org.apache.kafka.streams.errors.LogAndContinueProductionExceptionHandler

# Schema registry (Confluent Avro deserializer dependency).
schema.registry.url=http://schema-registry.kafka.prod.example.com:8081

# This is a single-source aggregation topology (no joins, no merges) — the
# default `max.task.idle.ms=0` (process whichever partition has data in
# wall-clock-arrival order) is correct. Set EXPLICITLY to document the
# deliberate choice and isolate this fixture from
# STREAMS_PROPERTIES_MAX_TASK_IDLE_MS_ABSENT.
max.task.idle.ms=0

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# MISSING:
#   task.timeout.ms=...
# Without this key, Kafka Streams defaults `task.timeout.ms` to `300000`
# (5 minutes, declared in StreamsConfig.TASK_TIMEOUT_MS_CONFIG with
# ConfigDef.Type.LONG, default 300000). Per KIP-572 (Apache Kafka 2.8,
# June 2021), this is the UNIFIED retry budget for ALL retriable
# exceptions a StreamThread encounters during task processing —
# TimeoutException from producer/consumer, OffsetOutOfRangeException,
# TaskCorruptedException, transient leadership-change exceptions, etc.
# When the cumulative retry time on ONE task exceeds the budget, the
# task transitions to FAILED and the configured uncaught-exception
# handler (default SHUTDOWN_CLIENT) kills the KafkaStreams instance.
# The default 5 min covers typical rolling-restart outages but does NOT
# cover (a) prolonged events — controller failover with metadata-quorum
# recovery, AZ-to-AZ network partition, cluster-wide config-change
# rolling upgrade — all 10-30 min envelopes; with the 5-min default the
# StreamThread gives up at the halfway point and the topology dies into
# CrashLoopBackOff for the duration of the outage. The default also
# does NOT match the intent of (b) fail-fast workloads (financial
# settlement, regulatory CDC, ledger writes) where the operator wants
# the on-call paged IMMEDIATELY on the first retriable error rather
# than silently retrying for 5 min. For THIS app's typical-production
# orders-events workload, `task.timeout.ms=300000` (5 min explicit)
# documents the deliberate choice and insulates from future framework
# default changes. For prolonged-outage tolerance, `task.timeout.ms=
# 1800000` (30 min). For fail-fast, `task.timeout.ms=0`.
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
