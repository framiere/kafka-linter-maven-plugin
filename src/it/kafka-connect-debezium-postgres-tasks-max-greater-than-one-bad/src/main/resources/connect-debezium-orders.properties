name=orders-cdc
connector.class=io.debezium.connector.postgresql.PostgresConnector

# Anti-pattern: tasks.max=8 on a Debezium Postgres connector is silently
# ignored. The connector hardcodes single-task — it attaches a SINGLE
# PostgreSQL logical-replication slot to a SINGLE plugin subscription,
# producing a SINGLE strictly-ordered WAL stream that must be processed
# sequentially to preserve transactional ordering. Logical-replication
# slots are EXCLUSIVE: only one consumer process may attach at a time,
# so multi-task parallelism is architecturally impossible. The
# connector's taskConfigs(int maxTasks) returns a one-element list
# regardless of maxTasks. Connect schedules exactly 1 task and the
# remaining 7 "task slots" are never used.
#
# The operator who set tasks.max=8 likely intended to "scale CDC
# throughput" but got NO parallelism — the connector silently runs 1
# task. Capacity planning ('8x parallel CDC throughput available') is
# based on a false premise; cluster sizing over-provisions worker
# threads that will never be allocated.
#
# Real scaling options for Postgres CDC: (a) horizontal sharding of
# tables across multiple connectors (each with unique slot.name and
# disjoint table.include.list); (b) heap/CPU scaling of the single
# connector's worker thread; (c) Debezium 2.x incremental snapshot for
# parallel initial-snapshot phase. None involve raising tasks.max.
tasks.max=8

database.hostname=orders-pg.internal
database.port=5432
database.user=debezium
database.password=changeme
database.dbname=orders

topic.prefix=cdc.orders

slot.name=debezium_orders
publication.name=dbz_publication_orders
plugin.name=pgoutput

table.include.list=public.orders,public.order_items,public.shipments

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false

snapshot.mode=initial
