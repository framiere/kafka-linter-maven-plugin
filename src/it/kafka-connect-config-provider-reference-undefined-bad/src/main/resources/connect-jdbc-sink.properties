name=jdbc-sink-secrets
connector.class=io.confluent.connect.jdbc.JdbcSinkConnector
tasks.max=1

topics=audit-events

connection.url=jdbc:postgresql://db.internal:5432/audit
connection.user=connect

# Anti-pattern: connection.password uses KIP-297 indirect-reference syntax
# ${secret:/etc/secrets/db.properties:audit_password} expecting a config
# provider named "secret" — but config.providers= only declares "file".
# Connect silently SKIPS the substitution: the JDBC connector receives the
# LITERAL string "${secret:/etc/secrets/db.properties:audit_password}" as
# its password, the PostgreSQL server rejects the connection with
# "password authentication failed for user 'connect'", and the operator
# searches for a typo in the password instead of a typo in the provider
# alias.
connection.password=${secret:/etc/secrets/db.properties:audit_password}
insert.mode=insert
auto.create=true

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false

# Only "file" is declared — "secret" is missing.
config.providers=file
config.providers.file.class=org.apache.kafka.common.config.provider.FileConfigProvider
