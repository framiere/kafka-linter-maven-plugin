# =============================================================================
# IT fixture: STREAMS_PROPERTIES_RACK_AWARE_ASSIGNMENT_TAGS_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A Kafka Streams .properties file destined for `new StreamsConfig(props)`.
#   It declares a complete production-quality Streams config for a MULTI-AZ
#   KUBERNETES topology — a user-profile materialized-view store
#   (`user-profile-store-stream`) deployed across 6 pods spread evenly
#   over 3 availability zones (us-east-1a / us-east-1b / us-east-1c) on
#   EKS. The topology consumes the `users` topic (60 partitions) and
#   materializes it into a KTable backed by RocksDB (~4 GiB state-stores
#   per partition); the materialized state is served via Streams
#   Interactive Queries to an upstream user-profile-service API.
#
#   Every other Streams knob is set correctly — application.id,
#   bootstrap.servers, default serdes, processing guarantee, replication
#   factor, min.insync.replicas, num.standby.replicas, num.stream.
#   threads, commit.interval.ms, state.dir, both exception handlers,
#   topology.optimization=all, max.task.idle.ms, task.timeout.ms,
#   default.timestamp.extractor, acceptable.recovery.lag, probing.
#   rebalance.interval.ms, AND max.warmup.replicas explicitly.
#   Everything is set correctly EXCEPT `rack.aware.assignment.tags`
#   is not set anywhere.
#
# What's wrong
#   `org.apache.kafka.streams.StreamsConfig.RACK_AWARE_ASSIGNMENT_
#   TAGS_CONFIG` declares `rack.aware.assignment.tags` with:
#
#     ConfigDef.Type.LIST,
#     default = Collections.emptyList(),
#     importance = MEDIUM
#
#   KIP-708 (Apache Kafka 3.2, May 2022) introduced this knob as the
#   RACK-AWARE STANDBY PLACEMENT mechanism for the
#   HighAvailabilityTaskAssignor (default since 2.6).
#
#   The mechanism requires TWO things to function:
#     (a) Every Streams instance declares its location via per-instance
#         tags: `client.tag.<key>=<value>`. For example:
#           client.tag.zone=us-east-1a
#           client.tag.cluster=primary
#         These tags are NOT global — each pod / each VM sets ITS OWN
#         tag values, typically injected at startup from the runtime
#         environment.
#     (b) The operator lists the tag KEYS in `rack.aware.assignment.
#         tags=zone,cluster` (a comma-separated list). This tells the
#         assignor WHICH tag dimensions are FAULT DOMAINS.
#
#   The HighAvailabilityTaskAssignor's rack-aware standby algorithm:
#     (1) For each active task, look at the active instance's tag
#         values (e.g., active is on `client.tag.zone=us-east-1a`,
#         `client.tag.cluster=primary`).
#     (2) For each candidate standby placement, compute a TAG-DISTANCE
#         score: how many of the LISTED tag keys have DIFFERENT values
#         between the candidate and the active. (e.g., a candidate at
#         `zone=us-east-1b,cluster=primary` has tag-distance 1 from
#         the active.)
#     (3) Prefer the HIGHEST tag-distance candidates: 'all-tags-differ'
#         > 'some-tags-differ' > 'no-tags-differ'.
#     (4) Subject to the existing balance and rack-distribution
#         constraints.
#
#   With the default `Collections.emptyList()` value (the rule's
#   trigger):
#     The assignor skips rack-aware scoring entirely. Standby placement
#     falls back to LOAD-BALANCING ONLY: distribute standby tasks
#     across instances to balance task ownership, with NO regard for
#     which AZ / cluster / rack each instance lives in.
#
#   For a multi-AZ Kubernetes deployment (3 AZs, num.standby.replicas=2,
#   N=6 pods), random standby placement means roughly:
#     - For each active task, the assignor randomly picks 2 of the
#       remaining 5 pods for standbys.
#     - Probability that BOTH standbys land in the SAME AZ as the
#       active: (1/3 × 1/3) ≈ 11%.
#     - Probability that AT LEAST ONE of the 3 copies (active + 2
#       standbys) is missing from at least one AZ: ~70%.
#     - Result: for ~30% of partitions, all 3 copies of the state
#       (active + 2 standbys) land in the SAME AZ. An AZ outage stalls
#       those partitions until cross-AZ recovery completes — typically
#       MINUTES to HOURS depending on the changelog-replay duration.
#
# This fixture's specific risk
#   THIS topology is a multi-AZ Kubernetes deployment (6 pods × 3 AZs,
#   2 pods per AZ, num.standby.replicas=2, 60 active tasks + 120
#   standby tasks). When AWS has a typical AZ-level incident (e.g.,
#   the us-east-1 power events of 2021-12-07 and 2023-06-13 — both
#   single-AZ outages), all 4 GiB state-stores in the affected AZ go
#   dark.
#
#   WITHOUT `rack.aware.assignment.tags`:
#     - ~30% of the 60 partitions have all 3 copies in the SAME AZ.
#     - When that AZ goes dark, ~18 partitions have NO surviving copy.
#     - The Streams rebalance picks the least-lagged candidate in
#       another AZ as temporary-active; but the candidate must
#       changelog-replay 4 GiB of state, which at typical 50-MiB/s
#       changelog-restore rates takes ~80 seconds per partition.
#     - During those 80 seconds × 18 partitions, the upstream user-
#       profile-service API returns 503 (no Interactive Query target)
#       or stale data (least-lagged candidate's state).
#
#   WITH `rack.aware.assignment.tags=zone`:
#     - The assignor places the 2 standbys in the 2 OTHER AZs (one in
#       each), guaranteeing 1 surviving copy per AZ for every
#       partition.
#     - The AZ outage promotes the in-AZ standby of the surviving
#       AZ to active INSTANTLY (no changelog-replay).
#     - The upstream user-profile-service API sees a few seconds of
#       rebalance latency, not 80-second-per-partition stalls.
#
#   The cost of the fix is ONE LINE of .properties plus per-pod tag
#   injection (typically already declared via Kubernetes Downward API
#   for other purposes — pod anti-affinity, telemetry labels).
#
# Why this is "INFO" by default (not WARNING or ERROR)
#   (a) The default empty list is CORRECT for single-AZ deployments
#       (no rack-aware benefit; would just add unnecessary asymmetry).
#
#   (b) The default empty list is CORRECT for stateless topologies
#       (`num.standby.replicas=0` → no standbys to place).
#
#   (c) The mechanism requires BOTH the list AND per-instance
#       `client.tag.<key>` values to be injected — a half-configured
#       deployment (`rack.aware.assignment.tags=zone` but no `client.
#       tag.zone` per pod) silently degrades to the default behavior
#       (assignor treats every instance as same-tag). The linter
#       cannot verify the per-pod tag injection from .properties
#       alone.
#
#   (d) The bug shape is delayed and disaster-triggered: it doesn't
#       manifest at deploy time, only when an AZ outage happens (AWS
#       averages 1-2 single-AZ outages per region per year).
#
#   INFO is the right level: surfaces the missing knob and prompts a
#   deliberate multi-AZ vs single-AZ choice without false-alarming
#   the single-AZ workloads.
#
#   This IT overrides severity to ERROR via pom.xml configuration to
#   force the build to fail and verify the rule fires.
#
# Common bug shapes
#   (1) Multi-AZ Kubernetes — AZ failure stalls topology partitions.
#       THIS app: 6 pods across 3 AZs, num.standby.replicas=2.
#       Without rack-awareness, ~30% of partitions have all 3 copies
#       in the same AZ. AWS AZ outages happen 1-2x/year per region;
#       setting `rack.aware.assignment.tags=zone` plus per-pod
#       `client.tag.zone=<az>` via Kubernetes Downward API
#       (`spec.template.spec.containers[].env.valueFrom.fieldRef.
#       fieldPath: "metadata.labels['topology.kubernetes.io/zone']"`)
#       ensures every partition has at least 1 copy per AZ.
#
#   (2) Multi-cluster Streams (primary+DR) — standbys may all land
#       in primary.
#       A Streams app deployed across two K8s clusters (primary +
#       disaster-recovery) with a single `bootstrap.servers` list.
#       Without `rack.aware.assignment.tags=cluster` plus per-pod
#       `client.tag.cluster=primary` or `client.tag.cluster=dr`,
#       the assignor may place ALL standbys in the primary cluster,
#       defeating the DR posture entirely. The operator discovers
#       this only when the primary cluster fails and the DR cluster
#       has no warm standbys to promote.
#
#   (3) 3-rack on-premise Kafka — single-rack power outage kills
#       active+standbys co-located on that rack.
#       An on-premise Streams app on bare-metal hardware with 3
#       physical racks. A rack UPS failure (typical mean-time-
#       between-failures ~5 years per UPS) takes out all instances
#       on that rack simultaneously. Without `rack.aware.assignment.
#       tags=rack` plus per-host `client.tag.rack=<rack-id>`, the
#       partitions with all 3 copies on the failed rack have NO
#       surviving copy.
#
#   (4) Single-AZ deployment — default is fine.
#       A Streams app on a single-AZ Kubernetes cluster (cost-
#       optimized, no multi-AZ SLA). No rack-awareness benefit; the
#       empty-list default is correct. Document the deliberate
#       choice with an explicit empty-list-equivalent comment.
#
#   (5) Stateless topology — default is fine.
#       A Streams app with `num.standby.replicas=0` (pure transform
#       topology, no Materialized stores). No standbys to place;
#       the empty-list default is correct.
#
#   (6) Spring Boot Streams autoconfig — org-wide default leaks
#       through.
#       Spring Boot's Streams autoconfiguration (`spring-kafka`)
#       provides a `KafkaStreamsConfiguration` bean from `application.
#       yml`. The default Spring template does NOT include `rack.
#       aware.assignment.tags`. Every Spring Boot Streams app
#       inherits the framework default empty list. For an org with
#       diverse deployment shapes (some single-AZ, some multi-AZ,
#       some multi-cluster), the org-wide default-leak masks
#       deployment-specific fault-domain configuration.
#
# Fix
#   ONE LINE plus PER-INSTANCE TAG INJECTION.
#
#   For multi-AZ Kubernetes deployments (THIS app's case):
#     rack.aware.assignment.tags=zone           # declare 'zone' as a
#                                                 # fault domain
#     # AND per-pod, via Kubernetes Downward API:
#     #   client.tag.zone=us-east-1a            # injected from
#                                                 # metadata.labels
#                                                 # ['topology.kuber
#                                                 # netes.io/zone']
#
#   For multi-cluster (primary+DR) deployments:
#     rack.aware.assignment.tags=zone,cluster   # declare BOTH zone
#                                                 # AND cluster as
#                                                 # fault domains —
#                                                 # the assignor
#                                                 # spreads standbys
#                                                 # to maximize
#                                                 # cross-cluster
#                                                 # AND cross-zone
#                                                 # diversity
#     # AND per-pod:
#     #   client.tag.zone=us-east-1a
#     #   client.tag.cluster=primary
#
#   For 3-rack on-premise deployments:
#     rack.aware.assignment.tags=rack
#     # AND per-host:
#     #   client.tag.rack=rack-3
#
#   For single-AZ / stateless deployments (default is correct):
#     # No setting needed — empty list is correct for these shapes.
#     # Optionally document the deliberate choice with a comment.
#
# Sibling rules
#   `STREAMS_PROPERTIES_NUM_STANDBY_REPLICAS_ABSENT` declares HOW MANY
#   standby copies of each task's state to keep — rack-awareness only
#   matters if you have standbys (num.standby.replicas >= 1). These
#   two rules together define standby placement: how many standbys
#   (num.standby.replicas) AND where to spread them (rack.aware.
#   assignment.tags).
#
#   `STREAMS_PROPERTIES_ACCEPTABLE_RECOVERY_LAG_ABSENT` declares WHEN
#   a warm-up replica is "good enough" to promote to active — works
#   together with rack-aware placement to define the standby
#   promotion behavior.
# =============================================================================

application.id=user-profile-store-stream
bootstrap.servers=broker-1.kafka.prod.example.com:9092,broker-2.kafka.prod.example.com:9092,broker-3.kafka.prod.example.com:9092

# Default serdes used by topology operators that don't pass explicit
# Consumed/Produced/Materialized/Grouped.
default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
default.value.serde=io.confluent.kafka.streams.serdes.avro.SpecificAvroSerde

# Internal-topic durability (replication factor for changelog + repartition topics).
replication.factor=3
min.insync.replicas=2

# Throughput & latency.
num.stream.threads=4
commit.interval.ms=5000

# HA for stateful tasks — 2 warm copies of every state-store partition,
# so that a rebalance can promote a standby without full changelog-
# replay delay. 60 active tasks × 2 standbys = 120 standby tasks
# distributed cluster-wide (across the 6 pods in 3 AZs).
num.standby.replicas=2

# At-least-once with explicit commit cadence.
processing.guarantee=at_least_once

# State-store location (outside /tmp; survives container restarts when mounted as a volume).
state.dir=/var/lib/kafka-streams/user-profile-store

# Internal-topic-layout consolidation (KIP-295 / KIP-862).
topology.optimization=all

# Exception handlers — both set, so the existing handler-absent rules don't fire.
default.deserialization.exception.handler=org.apache.kafka.streams.errors.LogAndContinueExceptionHandler
default.production.exception.handler=org.apache.kafka.streams.errors.LogAndContinueProductionExceptionHandler

# Schema registry (Confluent Avro deserializer dependency).
schema.registry.url=http://schema-registry.kafka.prod.example.com:8081

# Single-source KTable — no multi-source join, so the default
# max.task.idle.ms=0 is correct. Set EXPLICITLY at the default to
# isolate from STREAMS_PROPERTIES_MAX_TASK_IDLE_MS_ABSENT.
max.task.idle.ms=0

# 30-min retry budget — accommodates prolonged broker outages.
# Set EXPLICITLY to isolate from STREAMS_PROPERTIES_TASK_TIMEOUT_MS_ABSENT.
task.timeout.ms=1800000

# Kafka-native producers write to LogAppendTime-typed topics — the broker
# guarantees valid timestamps; fail-fast on invalid is the right posture.
# Set EXPLICITLY to isolate from STREAMS_PROPERTIES_DEFAULT_TIMESTAMP_
# EXTRACTOR_ABSENT.
default.timestamp.extractor=org.apache.kafka.streams.processor.FailOnInvalidTimestamp

# Warm-standby PROMOTION THRESHOLD — at typical user-profile-update
# rates (~5k events/sec across 60 partitions = ~80 events/sec/partition),
# default 10,000 records of lag is ~2 minutes — within the freshness
# budget for materialized-view staleness. Set EXPLICITLY at the default
# to isolate from STREAMS_PROPERTIES_ACCEPTABLE_RECOVERY_LAG_ABSENT.
acceptable.recovery.lag=10000

# PROBING-REBALANCE CADENCE — set to 5-min for a moderately-stable
# deployment (1-2 deploys per day). Set EXPLICITLY to isolate from
# STREAMS_PROPERTIES_PROBING_REBALANCE_INTERVAL_MS_ABSENT.
probing.rebalance.interval.ms=300000

# WARM-UP BUDGET — 6 pods × 10 tasks/pod = 60 active tasks; a 1-pod
# restart triggers a ~10-task reassignment. With max.warmup.replicas=4,
# stabilization takes 3 rounds × 5 min = 15 min. Set EXPLICITLY to
# isolate from STREAMS_PROPERTIES_MAX_WARMUP_REPLICAS_ABSENT.
max.warmup.replicas=4

