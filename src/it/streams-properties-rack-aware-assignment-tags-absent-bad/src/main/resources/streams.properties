# NO regard for fault-domain diversity. For THIS app — a multi-AZ
# Kubernetes deployment (6 pods × 3 AZs, num.standby.replicas=2,
# 60 active + 120 standby tasks, 4 GiB RocksDB state-stores) — random
# placement means ~30% of partitions have all 3 copies (active + 2
# standbys) in the SAME AZ; an AWS AZ outage (1-2x/year per region)
# stalls those partitions for ~80 seconds per partition during cross-
