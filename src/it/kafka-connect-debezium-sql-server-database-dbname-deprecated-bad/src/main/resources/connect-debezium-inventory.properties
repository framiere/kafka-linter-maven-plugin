name=inventory-cdc
connector.class=io.debezium.connector.sqlserver.SqlServerConnector

tasks.max=1

# Anti-pattern: database.dbname=<name> on a Debezium SQL Server connector.
# This key was correct in Debezium 1.x but was DEPRECATED in Debezium 2.0
# (replaced by database.names=<csv>, supporting multi-database capture
# from a single connector instance) and REMOVED entirely from the
# connector's ConfigDef in Debezium 2.5.
#
# This connector config was originally written in 2021 against
# Debezium 1.7 — a working setup at the time. The Connect cluster was
# upgraded to Debezium 2.2 in 2023; database.dbname was accepted with a
# WARN log nobody noticed, and the connector continued to work.
#
# Last month, the Connect cluster was upgraded to Debezium 2.5 (a
# routine quarterly upgrade for security patches). On the day of the
# upgrade:
#   - all SQL Server connectors transitioned to RUNNING state
#   - none of them threw any errors
#   - the REST API connector-status endpoint reported every connector
#     healthy
#   - the worker logs showed no relevant ERRORs
#   - the SQL Server CDC tables continued to be populated by the SQL
#     Server Agent capture jobs
#   - the CDC Kafka topics received ZERO new records
#
# Downstream consumers' lag grew over the next 36 hours. The team
# eventually traced the issue: in Debezium 2.5, database.dbname was
# removed from the connector's ConfigDef. Connect's general behavior
# with unknown keys is to silently accept them (the unknown-key
# validation is informational, not strict). The connector's required
# database.names config was empty (not set). Depending on the 2.5+
# minor version, the connector either:
#   (a) throws IllegalArgumentException: No databases configured for
#       capture at start() — visible in worker logs but not in the
#       connector-status response;
#   (b) runs cleanly with an empty capture loop emitting ZERO records
#       (the version this team hit).
#
# The fix is a one-line edit per connector: replace database.dbname=
# inventory with database.names=inventory. For multi-database capture
# (a Debezium 2.x feature), provide a CSV: database.names=inventory,
# warehousing,returns. The topic.prefix config is unchanged.
#
# The migration has NO downstream impact (the emitted Kafka records'
# schema is identical between 1.x and 2.x — the database name appears
# in the source.db field in both versions) and no SQL-Server-side
# changes (the CDC tables and Agent capture jobs are unaffected). But
# the team's recovery from this incident took 36 hours, during which:
#   - the inventory-service's product-availability cache rebuild
#     stalled (the cache rebuilds from the cdc.inventory topic from
#     beginning-of-time; no new records meant the rebuild made no
#     progress)
#   - the warehouse-allocation Kafka Streams app emitted stale state
#     for the entire window (its KTable joined off cdc.inventory.dbo.
#     stock_levels saw no updates, so reservations were made against
#     stale stock counts; the result was 4000+ over-allocated orders
#     that had to be manually canceled)
#   - the returns-management JDBC sink connector continued to flush
#     empty batches every poll interval, accumulating no data
#
# Static-analysis catch at PR time prevents the entire incident.
database.dbname=inventory

database.hostname=inventory-sqlserver-primary.internal
database.port=1433
database.user=debezium
database.password=changeme

topic.prefix=cdc.inventory

schema.history.internal.kafka.bootstrap.servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
schema.history.internal.kafka.topic=schema-history.cdc.inventory

table.include.list=dbo.products,dbo.stock_levels,dbo.warehouses

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
