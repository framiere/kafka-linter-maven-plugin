# =============================================================================
# A MirrorMaker 2 source-connector configuration that uses the LEGACY
# `topics.blacklist` and `groups.blacklist` keys instead of the modern
# `topics.exclude` / `groups.exclude` (KIP-629, accepted for Kafka 2.8 in 2020).
#
# ANTI-PATTERN DEMONSTRATED HERE:
#
#   connector.class = org.apache.kafka.connect.mirror.MirrorSourceConnector
#   topics.blacklist = __consumer_offsets,__transaction_state,_schemas    ← LEGACY
#   groups.blacklist = connect-cluster,console-consumer-.*                ← LEGACY
#
#   # The modern equivalents (semantics IDENTICAL — same regex/glob list):
#   #   topics.exclude = __consumer_offsets,__transaction_state,_schemas
#   #   groups.exclude = connect-cluster,console-consumer-.*
#
# WHY THIS LOOKS SAFE BUT IS NOT:
#
# In MirrorMaker 2 versions 2.8 through 3.x, the legacy keys are accepted as
# DEPRECATED ALIASES — the connector starts cleanly, reads the value, and logs
# a WARN line on every connector restart:
#
#   WARN The configuration 'topics.blacklist' was supplied but isn't a known
#        config. (Use 'topics.exclude' instead.)
#   WARN The configuration 'groups.blacklist' was supplied but isn't a known
#        config. (Use 'groups.exclude' instead.)
#
# These WARN lines are easy to miss — most teams' logging stacks filter them
# as 'noise' (single-line WARN at connector start, repeated only on restart,
# in a connector log channel that's typically inspected only on incident).
#
# WHAT KIP-629 ACTUALLY DID:
#
# KIP-629 ('Use racially neutral terms in our codebase'), accepted for Kafka 2.8
# in 2020, renamed every `blacklist`/`whitelist` configuration key in the Kafka
# codebase to `exclude`/`include`. The rename was purely terminological — same
# semantics, same value format, same default. For MirrorMaker 2 the affected
# keys were:
#
#   topics.blacklist  →  topics.exclude   (comma-separated regex/glob list of
#                                          topics to skip during replication)
#   groups.blacklist  →  groups.exclude   (comma-separated regex/glob list of
#                                          consumer-groups to skip during
#                                          checkpoint-offset replication)
#
# Each connector's ConfigDef in `org.apache.kafka.connect.mirror.
# MirrorConnectorConfig` declares both the canonical key and the legacy alias:
#
#   .define(TOPICS_EXCLUDE_CONFIG, ..., importance=HIGH, ...)
#   .define(TOPICS_EXCLUDE_ALIAS_DEPRECATED, ..., importance=LOW,
#           "DEPRECATED: use topics.exclude instead.")
#
# At config-resolution time `AbstractConfig` reads both keys; if the new key
# is set, it wins; if only the legacy key is set, its value is used and the
# WARN is emitted via `ConfigDef.logDeprecation()`.
#
# WHY THIS IS WORTH CATCHING NOW:
#
# Kafka 4.0 (released 2024) removes the deprecated aliases from MM2's
# ConfigDef. At that point the connector REST-API PUT-validate endpoint will
# flag `topics.blacklist`/`groups.blacklist` as `Unknown configuration` errors;
# the connector will fail at startup with:
#
#   ConfigException: Unknown configuration 'topics.blacklist'.
#
# Configs that have carried the legacy keys forward through every 2.x and 3.x
# release will BREAK at the moment of the 4.0 upgrade — typically with org-wide
# blast radius because the same legacy syntax is replicated across every MM2
# connector pair in the deployment (a hub-and-spoke replication topology with
# 8 spoke clusters means 16+ MM2 connectors, each with the same broken syntax).
#
# REAL-WORLD INCIDENT SHAPES:
#
# (1) **4.0 upgrade blocked org-wide.**
#     Team operates 12 MM2 connector pairs (source→DR for 6 source clusters,
#     each with a `MirrorSourceConnector` + `MirrorCheckpointConnector`). All
#     12 configs were authored in 2020 against MM2 2.4 and use
#     `topics.blacklist=__consumer_offsets,__transaction_state,_schemas` plus
#     `groups.blacklist=connect-cluster-.*`. The team plans Kafka 4.0 upgrade;
#     the upgrade-test cluster brings up the MM2 connectors and EVERY connector
#     fails at startup with `ConfigException: Unknown configuration
#     'topics.blacklist'`. Upgrade rolled back; team spends two sprints
#     updating 12 connector configs across dev/staging/prod GitOps repos and
#     coordinating restart windows with downstream teams.
#
# (2) **Helm-chart 4.0 upgrade breaks every consumer of the chart.**
#     Org's internal Helm chart for MM2 connectors (used by ~30 teams)
#     templates `topics.blacklist: "{{ .Values.excludePattern | default
#     \"__.*\" }}"` (chart authored 2020). Platform team upgrades the chart's
#     connector base image to Kafka 4.0; every team's deployment fails
#     identically; the platform team's Slack is flooded with `ConfigException:
#     Unknown configuration 'topics.blacklist'` reports. Chart rolled back;
#     chart authors update the template to `topics.exclude:` and bump the
#     chart's major version; consumers must explicitly opt-in to the bump.
#
# (3) **Multi-cluster replication audit reveals divergent configs.**
#     Team operates an MM2-based hub-and-spoke topology with 8 spoke clusters
#     replicating to a hub. Audit reveals 5 of 8 spoke configs use
#     `topics.blacklist` and 3 use `topics.exclude` — configs were authored at
#     different times by different operators. A typo in one of the legacy
#     configs (`__transaction_state` misspelled as `__transactionstate`) had
#     gone unnoticed because the WARN log obscured which key was actually
#     being applied.
#
# (4) **Mid-incident config-edit confusion.**
#     During a Kafka cluster failover, operator needs to ADD a topic exclusion
#     to an MM2 connector via the Connect REST API. They look at the current
#     config (uses `topics.blacklist=...`) and try to add the new exclusion via
#     `PUT /connectors/<name>/config` with a `topics.exclude` key (modern Kafka
#     docs say so). PUT succeeds; connector restarts; WARN log appears for the
#     now-orphan `topics.blacklist` (because the new `topics.exclude` wins and
#     the legacy is ignored — but the OLD exclusions in `topics.blacklist` are
#     ALSO ignored). The operator's INTENDED exclusion is in place but the
#     PREVIOUS exclusions are silently dropped; MM2 source connector starts
#     replicating Kafka internal topics (`__consumer_offsets`,
#     `__transaction_state`) to the DR cluster; DR cluster's offset-management
#     is CORRUPTED by the replicated `__consumer_offsets`; consumers reset to
#     earliest on next rebalance.
#
# (5) **Tutorial copy-paste from a 2020-era blog post.**
#     Junior engineer copies an MM2 config from a 2020 Confluent blog post on
#     cross-region replication; config uses `topics.blacklist=__.*`. Connector
#     deploys cleanly (with the WARN); ships to prod; runs for two years; the
#     4.0 upgrade in 2026 surfaces the issue.
#
# (6) **Confluent Replicator → MM2 migration carrying legacy syntax.**
#     Team migrates from licensed Confluent Replicator to open-source MM2;
#     translates Replicator's `topic.blacklist` (singular `topic`) to MM2's
#     `topics.blacklist` (plural). They never update to `topics.exclude`
#     because the migration was 'just rename, don't refactor'. Migration
#     succeeds on Kafka 3.5; 4.0 upgrade breaks every connector.
#
# THE FIX:
#
# Replace each legacy key with its modern equivalent — values unchanged:
#
#   topics.blacklist=<value>    →    topics.exclude=<value>
#   groups.blacklist=<value>    →    groups.exclude=<value>
#
# If both legacy and modern keys are currently set (a safe migration
# intermediate), REMOVE the legacy key — the modern key wins at
# config-resolution time and the legacy key is cruft.
#
# There is NO downstream impact (MM2 reads exactly the same exclude-list at
# runtime; replicated topics and groups are exactly the same set). No Kafka-
# side changes (broker config unaffected). The rename is purely in the
# connector's own .properties file.
#
# =============================================================================

name=mm2-orders-source
connector.class=org.apache.kafka.connect.mirror.MirrorSourceConnector
tasks.max=8

source.cluster.alias=primary
target.cluster.alias=dr

source.cluster.bootstrap.servers=primary-kafka.internal:9093
target.cluster.bootstrap.servers=dr-kafka.internal:9093

replication.factor=3
checkpoints.topic.replication.factor=3
heartbeats.topic.replication.factor=3
offset-syncs.topic.replication.factor=3

topics=orders\\..*,payments\\..*,customers\\..*

# VIOLATION 1: topics.blacklist is the legacy key (KIP-629 / Kafka 2.8). It is
# accepted as a deprecated alias in 2.8-3.x with a WARN log on every restart,
# but is SCHEDULED for REMOVAL in Kafka 4.0 — at that point the connector
# fails at startup with ConfigException: Unknown configuration 'topics.blacklist'.
# Fix: rename to topics.exclude (semantics identical, value unchanged).
topics.blacklist=__consumer_offsets,__transaction_state,_schemas,.*\\.internal,.*\\.replica

# VIOLATION 2: groups.blacklist is the legacy key (KIP-629 / Kafka 2.8). Same
# deprecation/removal trajectory as topics.blacklist. Fix: rename to
# groups.exclude.
groups.blacklist=connect-cluster-.*,console-consumer-.*,__.*

sync.topic.acls.enabled=true
sync.topic.configs.enabled=true
refresh.topics.interval.seconds=600
refresh.groups.interval.seconds=600
