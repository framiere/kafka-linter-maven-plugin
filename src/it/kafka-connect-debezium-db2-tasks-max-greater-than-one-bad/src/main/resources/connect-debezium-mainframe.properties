name=db2-mainframe-cdc
connector.class=io.debezium.connector.db2.Db2Connector

# Anti-pattern: tasks.max=5 on a Debezium DB2 connector is silently
# ignored. The connector captures changes from a DB2 LUW database by
# polling the DB2 ASN (Q Replication Apply / SQL Replication Capture)
# CD (Change Data) tables in IBMSNAP_COMMITSEQ order, producing a SINGLE
# strictly-ordered stream of change-data rows.
#
# A single DB2 transaction touching multiple captured tables produces
# multiple CD-table rows sharing ONE COMMITSEQ — they must be emitted
# together as one transaction-boundary unit to preserve cross-CD-table
# transactional ordering. Splitting work across tasks is architecturally
# impossible: every task would either poll the same CD tables (causing
# duplicate emission to Kafka), or partition CD tables across tasks
# (losing the cross-CD-table transactional grouping — a multi-table
# transaction would be emitted as several disjoint transactions).
#
# The connector's Db2Connector#taskConfigs(int maxTasks) returns a
# one-element list regardless of maxTasks. Connect schedules exactly 1
# task and the remaining 4 "task slots" are never used.
#
# The operator who set tasks.max=5 likely intended to "scale CDC
# throughput" but got NO parallelism — the connector silently runs 1
# task. Capacity planning ('5x parallel CDC throughput available') is
# based on a false premise.
#
# Real scaling options for DB2 CDC: (a) horizontal sharding of tables
# across multiple connectors (each polling a disjoint
# table.include.list); (b) DB2-side tuning of the ASN Capture program
# (ASNCAP priority, CD-table retention, CD-table indexes); (c) heap/CPU
# scaling of the single connector's worker thread. None involve raising
# tasks.max.
tasks.max=5

database.hostname=db2-mainframe.internal
database.port=50000
database.user=DB2INST1
database.password=changeme
database.dbname=BANKDB
database.cdcschema=ASNCDC

topic.prefix=cdc.bank.db2

schema.history.internal.kafka.bootstrap.servers=kafka:9092
schema.history.internal.kafka.topic=schema-history.bank-db2

table.include.list=BANK.ACCOUNTS,BANK.TRANSACTIONS,BANK.CUSTOMER_PROFILES

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false

snapshot.mode=initial
