# =============================================================================
# A Confluent JDBC source connector configuration where the operator set
# `poll.interval.ms = 100` (10 polls/sec/task) on a base
# JdbcSourceConnector. The operator wanted "real-time data in Kafka" and
# reached for `poll.interval.ms` thinking smaller = fresher. The 100 ms
# value originated from a tutorial they followed (which used 100 ms on a
# single-task local-Postgres demo); they did not realize that at
# tasks.max=4 in production against a real OLTP database, the connector
# hammers the source DB with 40+ SELECTs/sec sustained.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#
#   connector.class  = io.confluent.connect.jdbc.JdbcSourceConnector
#   tasks.max        = 4
#   poll.interval.ms = 100   # 100 ms = 10 polls/sec/task = 40 polls/
#                            # sec total against the source DB — far
#                            # below the plugin's 1000 ms threshold,
#                            # 50x below the Confluent default of
#                            # 5000 ms.
#
# WHAT `poll.interval.ms` ACTUALLY DOES:
#
# `poll.interval.ms` is the per-task sleep at the END of each polling
# iteration. The polling loop is:
#
#   while (task is running) {
#     start = now
#     issue SELECT <cols> FROM <table>
#       WHERE <tracking-column> > <last-seen-value>
#       ORDER BY <tracking-column> ASC LIMIT <batch.max.rows>
#     emit rows as SourceRecords
#     elapsed = now - start
#     Thread.sleep(max(0, poll.interval.ms - elapsed))
#   }
#
# So the EFFECTIVE polling interval is `max(poll.interval.ms,
# query-duration)`. For fast tables with sub-millisecond queries (the
# common case on indexed tracking columns), the sleep dominates:
#
#   poll.interval.ms = 5000  → 1 poll per 5 sec per task
#                             (Confluent default — safe starting point)
#   poll.interval.ms = 1000  → 1 poll per 1 sec per task
#                             (plugin's threshold — aggressive but
#                             defensible if you accept the DB load)
#   poll.interval.ms = 500   → 2 polls per sec per task
#                             (questionable — most production DBs
#                             notice this on a multi-task connector)
#   poll.interval.ms = 100   → 10 polls per sec per task (THIS FIXTURE)
#                             — at tasks.max=4 this is 40 polls/sec
#                             total, an order of magnitude above the
#                             default; definitely wrong.
#   poll.interval.ms = 10    → 100 polls per sec per task — pathological.
#
# CRITICAL MISCONCEPTION:
#
# Operators set sub-second poll.interval.ms because they want "fresher
# data". They do not realize:
#
# (a) **Polling cannot beat the application's commit cadence.** The
#     freshness floor is the application's commit latency — typically
#     10-100 ms for OLTP. Polling more often than the commit cadence
#     does NOT produce fresher records; it just re-fetches the same
#     rows the previous poll already emitted.
#
# (b) **Sub-second freshness is Debezium's job.** Debezium reads the
#     DB's WAL (Postgres logical replication, MySQL binlog, SQL Server
#     CDC stream, Oracle XStream/LogMiner) and emits events as they
#     are written to the WAL — typically <50 ms after the application
#     COMMIT. NO polling. No DB load beyond the WAL-replication slot.
#     If you genuinely need sub-second propagation, the answer is
#     ALWAYS Debezium, never sub-second JDBC source polling.
#
# (c) **Polling is fundamentally batch-oriented.** The JDBC source is
#     designed for "fetch every N seconds" workloads — financial-
#     reporting batch ingest, inventory snapshots, materialized-view
#     refresh. It is not a real-time CDC mechanism.
#
# THE BLAST RADIUS OF poll.interval.ms = 100 ON A PRODUCTION DB:
#
# With poll.interval.ms = 100 and tasks.max = 4, the connector issues
# 40 SELECTs/sec sustained against the source DB. Real production
# consequences:
#
# (a) **Connection-pool exhaustion (HikariCP, PgBouncer).** The
#     application's HikariCP has maximumPoolSize=20. The JDBC source
#     connector uses 4 long-lived connections (one per task). With
#     each task issuing 10 SELECTs/sec on its connection, those 4
#     connections are essentially always busy. The application gets
#     16 connections; under spike traffic, HikariCP throws
#     `Connection is not available, request timed out after 30000 ms`;
#     application user-facing latency degrades; checkout flows fail.
#
# (b) **PostgreSQL MVCC snapshot pinning (vacuum starvation).** Every
#     SELECT in PostgreSQL opens an MVCC snapshot for the duration of
#     the query. With 40 SELECTs/sec sustained, the database's
#     `xmin horizon` advances slowly (every long-lived SELECT pins
#     the horizon). VACUUM cannot reclaim dead tuples that are
#     visible to any active snapshot. The `orders` table bloats;
#     index size grows; query performance degrades; the DBA must run
#     pg_repack manually during low-traffic windows.
#
# (c) **Shared row-lock contention with OLTP (SERIALIZABLE / RR).**
#     Under SERIALIZABLE isolation (Postgres default for some
#     application stacks; MySQL InnoDB-RR default), each SELECT
#     acquires shared row locks on the rows it scans. With
#     poll.interval.ms=100 the connector is essentially always
#     holding shared locks on the recently-updated rows. The
#     application's `UPDATE orders SET status=...` statements wait
#     for those locks; transaction latency p99 doubles; the
#     application's user-facing checkout latency increases noticeably.
#
# (d) **WAL/redo-log amplification.** The SELECTs themselves don't
#     write WAL. But every poll's SELECT advances the connector's
#     stored offsets in the Connect framework's `connect-offsets`
#     internal Kafka topic. At 40 polls/sec, the connector writes
#     40 offset records/sec to `connect-offsets`. The `connect-
#     offsets` topic's I/O load multiplies; the worker process's
#     network egress to Kafka brokers spikes; downstream Kafka
#     consumer groups that subscribe to `connect-offsets` (e.g., for
#     monitoring) see amplified traffic.
#
# (e) **Per-task CPU on the worker.** The worker's JdbcSourceTask
#     thread is essentially always executing the polling loop —
#     query, serialize rows to Connect Schema, push to internal
#     queue. CPU utilization per task is 5-15% on a modern CPU; at
#     tasks.max=4 that's 20-60% of one CPU core dedicated to the
#     connector. The worker process's other connectors compete for
#     the remaining CPU.
#
# (f) **DB-side query-planner cache pressure.** Every poll's WHERE
#     clause has a parameterized predicate (`tracking-column > $1`).
#     With 40 polls/sec on potentially many tables, the DB's prepared-
#     statement cache and plan-cache see high churn; on some DBs
#     (Oracle especially), prepared-statement-cache eviction causes
#     hard parses that consume DB CPU.
#
# (g) **Replication lag amplification (replica-targeting).** If the
#     operator pointed the JDBC source at a read-replica (common
#     pattern to offload from the primary), the read-replica's
#     replication lag grows: the replica must apply primary WAL while
#     also serving 40 SELECTs/sec from the connector; under load the
#     replica falls behind; stale data is emitted to Kafka.
#
# WHY 1000 IS THE PLUGIN'S CHOSEN THRESHOLD:
#
# The 1000 ms (1 second) line is the plugin's pragmatic boundary:
# polls slower than 1/sec are operator-territory (could be 1 sec, 5
# sec, 30 sec — all defensible depending on freshness/load tradeoff),
# polls faster than 1/sec are essentially never defensible for a JDBC
# source against a production DB. The 1000 ms threshold matches the
# "definitely wrong" line for the other small-cadence rules in the
# linter (see [[connect-storage-sink-partition-duration-ms-too-low]],
# [[connect-storage-sink-rotate-interval-ms-too-low]], etc.).
#
# An operator who genuinely needs sub-second polling (extremely rare —
# almost always Debezium is the right answer) should suppress the
# rule with:
#
#   <CONNECT_JDBC_SOURCE_POLL_INTERVAL_MS_TOO_LOW>OFF</CONNECT_JDBC_SOURCE_POLL_INTERVAL_MS_TOO_LOW>
#
# and document the DBA's signoff, connection-pool sizing, and WAL/
# redo-log retention impact in the .properties file.
#
# HOW SUB-SECOND VALUES END UP IN PRODUCTION:
#
# (i) **'I want real-time data' misconception (most common).**
#     Operator wants 'records in Kafka within seconds of source-DB
#     inserts' and sets poll.interval.ms=100. They do not realize:
#       - the freshness floor is the application's commit cadence;
#       - the correct mechanism for sub-second freshness is Debezium;
#       - polling faster than the commit cadence does not add freshness.
#
# (ii) **Debug mode never reverted.** Operator sets poll.interval.ms=50
#      (or 100) during initial deployment to verify the connector is
#      emitting records (they want immediate feedback during dev). They
#      confirm the partitioning and serialization logic work; they
#      never revert; the connector ships to production at tasks.max=8
#      against a real OLTP DB; the DBA pages the team about 'runaway
#      query loop on the master'.
#
# (iii) **Tutorial copy-paste at scale.** A Confluent JDBC source
#       tutorial uses poll.interval.ms=100 on a local-Postgres demo
#       with tasks.max=1 and a 10-row tutorial table. The operator
#       copies the config to production at tasks.max=8 against a
#       10M-row orders table; the production DB sees a load profile
#       that the tutorial never tested.
#
# (iv) **'Polling is the only freshness dial I know.'** Operator does
#      not know about Debezium (or has it ruled out for unrelated
#      reasons — e.g., the DB doesn't support CDC, or the security
#      team blocks installing the Debezium-required replication-slot
#      privileges). They turn the polling dial as low as possible
#      hoping for the best.
#
# (v) **Helm chart with debug default leftover.** Helm chart values.yaml
#     has `pollIntervalMs: 100` to support local debug-mode integration
#     tests; chart-merge mishap propagates the default to production.
#
# THE FIX:
#
# (1) Raise poll.interval.ms to a production-appropriate value:
#
#     poll.interval.ms = 5000   # Confluent default — 5 sec freshness,
#                               # safe DB load
#     poll.interval.ms = 30000  # 30 sec freshness — even lighter DB
#                               # load, fine for analytics ingest
#     poll.interval.ms = 60000  # 1 min freshness — typical for
#                               # batch / reporting ingest
#
# (2) For genuine sub-second freshness, switch to Debezium:
#
#     connector.class = io.debezium.connector.postgresql.PostgresConnector
#     # ...Debezium-specific configs:
#     # - plugin.name, slot.name, publication.name
#     # - database.history.kafka.topic
#     # - snapshot.mode = initial / never / when_needed
#     # ...
#
# (3) If sub-second polling is genuinely required AND polling is the
#     only option (rare), explicitly accept the tradeoff:
#
#     # rule suppression with rationale:
#     # <CONNECT_JDBC_SOURCE_POLL_INTERVAL_MS_TOO_LOW>OFF</...>
#     # DBA signoff: <name> 2026-05-22
#     # Connection-pool sizing: dedicated 8-conn pool for connector
#     # WAL/redo-log retention: 24h (was 6h) to accommodate snapshot pinning
#     poll.interval.ms = 500
#
# =============================================================================

name=orders-jdbc-source
connector.class=io.confluent.connect.jdbc.JdbcSourceConnector
tasks.max=4

connection.url=jdbc:postgresql://prod-db.example.internal:5432/orders
connection.user=connect-user
connection.password=changeme

mode=incrementing
incrementing.column.name=id

table.whitelist=public.orders,public.order_items

topic.prefix=cdc.

batch.max.rows=1000

# VIOLATION: poll.interval.ms = 100 (10 polls/sec/task) — FAR below
# the plugin's 1000 ms threshold, 50x below the Confluent default of
# 5000 ms. At tasks.max=4, this is 40 SELECTs/sec sustained against
# the production Postgres DB. Real impact: connection-pool exhaustion
# (HikariCP, PgBouncer), MVCC snapshot pinning (vacuum starvation),
# shared row-lock contention with OLTP, WAL/redo-log amplification,
# 20-60% of one worker CPU core consumed by polling. The 100 ms value
# originated from the operator's "I want real-time data" misconception
# — they did not realize the freshness floor is the application's
# commit cadence (10-100 ms for OLTP) and the correct mechanism for
# sub-second freshness is Debezium (CDC against the WAL/binlog), not
# faster polling. Fix: raise to 5000 ms (the Confluent default), OR
# switch to Debezium for genuine sub-second freshness.
poll.interval.ms=100

key.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=false
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false
