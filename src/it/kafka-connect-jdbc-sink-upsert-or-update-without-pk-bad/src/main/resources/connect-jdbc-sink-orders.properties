# =============================================================================
# Confluent JDBC sink connector writing the `orders` Kafka topic into a Postgres
# analytics warehouse.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#   insert.mode = upsert    (with no pk.mode and no pk.fields)
#
# WHY THIS IS A SILENT-NO-DATA BUG:
#
# The Confluent JDBC sink connector's `insert.mode` config selects HOW each
# record from the input Kafka topic becomes a SQL statement against the
# target table:
#
#   insert  — every record becomes a SQL INSERT; duplicate-PK records cause
#             a UniqueConstraintException (the record fails, the connector
#             falls back to DLQ or stops, depending on errors.tolerance).
#
#   upsert  — every record becomes an INSERT-or-UPDATE depending on whether
#             the PK already exists in the target. Implementation is vendor-
#             specific: Postgres uses INSERT ... ON CONFLICT (<pk>) DO UPDATE;
#             MySQL uses INSERT ... ON DUPLICATE KEY UPDATE; SQL Server uses
#             MERGE INTO ... USING ...; Oracle uses MERGE.
#
#   update  — every record becomes a SQL UPDATE; rows that do not exist in
#             the target are SILENTLY SKIPPED (no insert performed).
#
# Both `upsert` and `update` REQUIRE a primary key to construct their
# WHERE clause:
#
#   UPDATE <table> SET <col>=... WHERE <pk-col>=<pk-value>
#                                      ^^^^^^^^^^^^^^^^^^^
#                                      this is impossible to bind without
#                                      a PK
#
# The PK configuration is a CROSS-KEY contract between three properties:
#
#   pk.mode = none           — no PK (the default; INVALID with upsert/update)
#   pk.mode = kafka          — synthetic PK from topic+partition+offset
#                              (rarely matches source-DB row identity)
#   pk.mode = record_key     — extract PK from the Kafka record KEY
#                              (the standard CDC-sink choice — pairs with
#                              an upstream Debezium connector that emits the
#                              source-table PK in the record key)
#   pk.mode = record_value   — extract PK from one or more fields of the
#                              Kafka record VALUE envelope
#
# For pk.mode=record_key or record_value:
#   pk.fields = <col1>[,<col2>,...]  — REQUIRED, non-empty CSV
#
# THE VIOLATION:
#
# This config sets `insert.mode = upsert` but does NOT set `pk.mode` at all
# (so it defaults to `none`). The connector's start() throws:
#
#   ConfigException: pk.mode must be set when insert.mode is upsert or update
#
# The task transitions to FAILED. The CONNECTOR state remains RUNNING (Connect
# allows this state combination — a connector can be RUNNING while ALL its
# tasks are FAILED). The connector-status REST endpoint shows the sink as
# 'running'; only the per-task status endpoint surfaces the FAILED state.
#
# CONSEQUENCES:
#
#   - Connector deploys cleanly (REST POST returns 201 Created).
#   - Operator's dashboard says 'sink running'.
#   - NO ROWS are ever written to the target Postgres `orders_summary` table.
#   - The downstream BI dashboard (which reads from orders_summary) shows zero
#     rows; analytics team assumes a Kafka-side or schema-registry issue and
#     spends days debugging the wrong layer.
#   - Hours-to-days before someone checks the per-task status endpoint and
#     discovers the ConfigException.
#
# FIX (the canonical CDC-sink configuration):
#
#   insert.mode  = upsert
#   pk.mode      = record_key
#   pk.fields    = order_id        # name of the field in the Kafka record key
#
# This pairs with an upstream Debezium connector that emits each source-row's
# primary key in the Kafka record key — the sink reads the PK from the key and
# uses it to construct the WHERE clause for the upsert.
#
# Alternative fixes:
#   (a) insert.mode = insert        — switch to append-only if the target table
#                                     should accumulate rather than be merged.
#   (b) pk.mode = record_value      — extract PK from a named field in the
#       pk.fields = id                value envelope (used when the value
#                                     carries the PK explicitly, e.g. JSON
#                                     events with an `id` top-level field).
# =============================================================================

name=orders-sink
connector.class=io.confluent.connect.jdbc.JdbcSinkConnector
tasks.max=2

topics=orders

connection.url=jdbc:postgresql://analytics-db.internal:5432/warehouse
connection.user=connect
connection.password=changeme

# VIOLATION: upsert insert mode WITHOUT a pk.mode (defaults to `none`) and
# WITHOUT pk.fields. The connector cannot construct the WHERE clause for the
# upsert SQL — start() throws ConfigException — task transitions to FAILED
# while the connector itself stays RUNNING in the connector-status response.
insert.mode=upsert
auto.create=true

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
