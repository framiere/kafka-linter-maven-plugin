# RULE: CONNECT_SINK_TOPICS_AND_TOPICS_REGEX_NEITHER_SET.
#
# This Connect SINK connector config is otherwise reasonable:
#   - name set                            (registration identity)
#   - connector.class set to JDBC sink    (real sink connector — `*SinkConnector` suffix)
#   - tasks.max=12 set                    (parallelism declared)
#   - connection.url set                  (Postgres target)
#   - auto.create=true                    (DDL-managed)
#   - insert.mode=upsert + pk.mode + pk.fields (idempotent upserts on order_id)
#   - errors.tolerance=none               (fail-fast on bad records)
#   - DLQ topic + RF + context.headers.enable (operationally observable DLQ)
#   - key/value converters set            (no Schema-Registry leakage)
#
# ...but it declares NEITHER `topics` NOR `topics.regex`. Kafka Connect's
# SinkConnectorConfig validator REQUIRES exactly one of these keys.
#
# THE BUG SHAPE THIS RULE CATCHES:
#
# Kafka Connect's `org.apache.kafka.connect.runtime.SinkConnectorConfig`
# declares two mutually-exclusive ways to subscribe to topics:
#
#   - `topics=<comma-separated-list>`
#       Explicit subscription. Connect's sink-side consumer
#       subscribes via `consumer.subscribe(Collection<String>)`,
#       which receives DETERMINISTIC partition assignments at
#       startup (no metadata-refresh subscription update). The
#       topic list is FIXED until the connector is restarted.
#
#   - `topics.regex=<java-regex>`
#       Dynamic regex subscription. Connect's consumer subscribes
#       via `consumer.subscribe(Pattern, ConsumerRebalanceListener)`,
#       which re-evaluates the regex against the broker's topic
#       catalog on every metadata refresh (default ~5min) and
#       updates the assignment if new matching topics have been
#       created.
#
# The framework's `SinkConnectorConfig#validate()` enforces:
#   - EXACTLY ONE of `topics` or `topics.regex` MUST be non-empty.
#   - Both non-empty → ConfigException (sibling rule
#     CONNECT_SINK_TOPICS_AND_TOPICS_REGEX_BOTH_SET).
#   - NEITHER non-empty → ConfigException (this rule).
#
# The validation runs SYNCHRONOUSLY at config-parse time:
#   - `Worker#startConnector` constructs `SinkConnectorConfig`
#   - The constructor invokes `AbstractConfig.parse(props)`
#   - The validators run; topics-XOR validator fires
#   - ConfigException("Must configure one of topics or topics.regex")
#     propagates up — BEFORE the connector class is loaded,
#     BEFORE any plugin classloader work, BEFORE Connector#start().
#
# The connector never reaches `start()`. The connector status
# transitions directly from CREATED to FAILED. Standalone Connect
# exits the worker process; distributed Connect leaves the FAILED
# entry in `<connect-status-topic>` until the operator explicitly
# deletes via `DELETE /connectors/<name>`.
#
# CONCRETE FAILURE MODES:
#
# (1) Sink-from-source-template copy.
#     Operator's first sink connector is an adaptation of an
#     existing source connector template (e.g., a Debezium
#     Postgres source connector). The source connector had a long
#     list of database-side config (database.hostname,
#     database.user, slot.name, etc.) — no `topics` key because
#     source connectors PRODUCE TO topics rather than CONSUME FROM
#     them. Operator swaps `connector.class` to JdbcSinkConnector
#     and forgets to add the `topics=` line. Deploy fails with
#     ConfigException. Operator re-reads the JDBC sink
#     documentation, realizes the missing key, fixes it, re-
#     submits — 15 minutes per attempt. Multiple attempts as the
#     operator gets multiple keys wrong in succession.
#
# (2) Refactor removes the topics line as 'dead config'.
#     A senior engineer reviews the connector .properties and sees
#     `topics=orders-events` followed by 30 other configs. They
#     note: 'the topics key is duplicated in the topic-management
#     Terraform anyway, this is redundant.' Delete the line in a
#     cleanup PR. The PR merges; the next deploy of the connector
#     fails. The engineer who deleted the line is on vacation; the
#     on-call has to git-blame, find the original value, and
#     restore it. The Terraform topic-management was creating the
#     TOPIC; the connector .properties was telling Connect which
#     topic to SUBSCRIBE to. These are different concerns and the
#     `topics=` line is NOT redundant.
#
# (3) Helm-template renders to empty value.
#     Helm chart has `topics: {{ .Values.topics }}`. The values.yaml
#     OMITS `topics` (perhaps because a sibling chart defines it
#     in a different way, or because of a refactor that moved
#     values around). The rendered .properties has `topics=`
#     (empty value). Connect's `ConfigDef.Type.LIST` parser treats
#     `topics=` as an empty list, which fails the XOR-with-required
#     validator the same way as if the key were absent.
#
# (4) Per-environment override drops the topic list.
#     Dev .properties has `topics=orders-events-dev`. The
#     production overlay file (Kustomize patch, Spring profile, or
#     Helm values-prod.yaml) was supposed to override to
#     `topics=orders-events` but the override file was accidentally
#     deleted in a config-management cleanup. Production has
#     neither dev nor prod topic configured; deploy fails.
#
# (5) Migration tool generates the base config with a TODO.
#     A migration script converts a Debezium server config to a
#     Kafka Connect connector config. The migration generates
#     `connector.class`, all the database-side configs, and a
#     placeholder `# TODO: configure topics or topics.regex`
#     comment. The operator merges the PR without filling in the
#     TODO. Deploy fails.
#
# (6) Distributed Connect cluster: failed-connector entry survives.
#     Operator deploys a sink connector without topics; Connect
#     records the failure in connect-status. The operator notices,
#     fixes the .properties, and re-submits — but Connect's REST
#     API rejects the re-submission until the failed entry is
#     explicitly deleted via `DELETE /connectors/<name>`. The
#     operator doesn't know about this requirement; they think
#     their fix is in but the connector is still showing FAILED.
#     Investigation takes 30 minutes.
#
# WHY THIS RULE IS ERROR (NOT WARNING/INFO):
#
# The framework REJECTS the config deterministically. There is no
# scenario where a sink connector without `topics` or `topics.regex`
# works at runtime — the validator fires before any connector logic
# runs. The static-analysis catch produces zero false positives:
# any sink connector .properties without one of the two keys is
# unambiguously broken. ERROR severity is the right default.
#
# Sink-connector detection uses the `*SinkConnector` class-name
# suffix — a near-universal convention across Apache Kafka,
# Confluent Hub, MirrorMaker 2, and third-party connectors. False
# positives would require a sink connector class that doesn't
# follow the convention; the connector ecosystem has been
# self-consistent on this for ~7 years.
#
# Fix: ONE LINE.
#   - `topics=<comma-separated-list>` for an explicit subscription
#     (recommended for production — tight access control,
#     predictable consumer-group rebalances).
#   - `topics.regex=<java-regex>` for a dynamic pattern subscription
#     (e.g., `topics.regex=app-events-.*` for a topic-naming
#     convention that grows over time).
#
# Recommended for production: explicit `topics=` unless the topic
# set genuinely changes frequently.
name=orders-to-postgres-sink
connector.class=io.confluent.connect.jdbc.JdbcSinkConnector
tasks.max=12
connection.url=jdbc:postgresql://postgres-prod.example.com:5432/orders
connection.user=connect_writer
auto.create=true
insert.mode=upsert
pk.mode=record_key
pk.fields=order_id
errors.tolerance=none
errors.deadletterqueue.topic.name=orders-to-postgres-sink-dlq
errors.deadletterqueue.topic.replication.factor=3
errors.deadletterqueue.context.headers.enable=true
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry.example.com:8081
value.converter.auto.register.schemas=false
