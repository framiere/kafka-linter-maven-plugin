# =============================================================================
# IT fixture: CONSUMER_PROPERTIES_FETCH_MAX_WAIT_MS_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A kafka-clients consumer .properties file destined for
#   `new KafkaConsumer<>(props)`. It declares deserializers, bootstrap.servers,
#   group.id, client.id, partition.assignment.strategy, auto.offset.reset,
#   enable.auto.commit, isolation.level, max.poll.records, max.poll.
#   interval.ms, session.timeout.ms, heartbeat.interval.ms, AND
#   fetch.min.bytes TUNED UP to 65536 (64 KB) for throughput — a complete
#   production-quality consumer config — EXCEPT `fetch.max.wait.ms` is not
#   set anywhere.
#
# What's wrong
#   The operator tuned `fetch.min.bytes` UP to 65536 (64 KB) to amortize
#   fetch overhead during peak business hours (high-throughput regime).
#   But they forgot to also set `fetch.max.wait.ms`, so it defaults to 500
#   milliseconds.
#
#   The coupling is now broken: during PEAK traffic (>>64 KB/sec arrival
#   rate), every fetch returns instantly with a full 64 KB batch — exactly
#   what the operator wanted. But during OFF-PEAK periods (e.g., 3am,
#   weekends, post-incident traffic drop), traffic might be 1 KB/sec or
#   slower. Every fetch now stalls UP TO 500ms waiting for 64 KB to
#   accumulate — and since 1 KB/sec × 0.5s = 0.5 KB, 64 KB never
#   accumulates within the window; the broker returns partial batches
#   after timing out at 500ms.
#
#   The result: p99 fetch latency jumps from ~10ms (peak) to ~500ms
#   (off-peak). If the consumer's downstream SLA requires <100ms e2e
#   latency, that SLA is silently breached every off-peak period.
#
#   `org.apache.kafka.clients.consumer.ConsumerConfig.
#   FETCH_MAX_WAIT_MS_CONFIG` declares `fetch.max.wait.ms` with
#   `ConfigDef.Type.INT`, default `500`, importance LOW. The kafka-clients
#   library does NOT validate the coupling: a high `fetch.min.bytes` with
#   default `fetch.max.wait.ms` is accepted silently.
#
#   The broker-side logic (`org.apache.kafka.server.purgatory.DelayedFetch`):
#     - Accumulate records for the requested partition(s).
#     - If total accumulated bytes >= `fetch.min.bytes` → respond NOW.
#     - Otherwise, wait up to `fetch.max.wait.ms` ms → respond with
#       whatever has accumulated.
#
#   So the EFFECTIVE behavior of the coupled pair is:
#     - Peak (>> fetch.min.bytes/window arrival rate):
#         fetch returns instant with fetch.min.bytes payload — great throughput.
#     - Off-peak (<< fetch.min.bytes/window arrival rate):
#         fetch stalls fetch.max.wait.ms, returns partial — bad latency.
#
#   At default settings (`fetch.min.bytes=1, fetch.max.wait.ms=500`), the
#   coupling is moot — fetch.min.bytes=1 triggers on the first byte. The
#   bug only manifests after the operator tunes one without the other.
#
# Why this is "INFO" by default (not WARNING or ERROR)
#   (a) The framework does NOT fail — fetches still return data, just with
#       higher latency during off-peak. The cost is bounded (500ms p99 in
#       the worst case).
#
#   (b) Default `fetch.min.bytes=1` plus default `fetch.max.wait.ms=500`
#       gives instant fetches — operators on full defaults are unaffected.
#       The rule fires when fetch.min.bytes IS set (this fixture) AND
#       fetch.max.wait.ms is unset, OR when fetch.min.bytes is unset and
#       the operator hasn't thought about either knob.
#
#   (c) Some operators legitimately accept the 500ms ceiling and document
#       the trade-off ('our consumer is throughput-oriented; 500ms off-peak
#       latency is fine').
#
#   For these reasons, the rule's default severity is INFO — a documentation
#   nudge prompting the operator to set `fetch.min.bytes` AND
#   `fetch.max.wait.ms` TOGETHER, documenting the latency-throughput
#   trade-off explicitly.
#
#   This IT overrides severity to ERROR via pom.xml configuration to force
#   the build to fail and verify the rule fires.
#
# Common bug shapes
#   (1) Operator tunes fetch.min.bytes for throughput; latency silently
#       spikes during quiet periods.
#       Team has a high-throughput log-ingest consumer; sets
#       `fetch.min.bytes=65536` to amortize fetch overhead. During peak
#       business hours (10 GB/min ingest rate), fetches return instant
#       with 64 KB batches — great. During off-peak hours (10 MB/min, 1000x
#       slower), fetches stall up to 500ms waiting for 64 KB to accumulate;
#       consumer's processing rate drops to 100 batches/sec instead of
#       10,000/sec; p99 e2e latency jumps from 10ms to 500ms+. SRE sees
#       the p99 spike and investigates; root cause: fetch.min.bytes was
#       set, fetch.max.wait.ms was not.
#
#   (2) Latency SLA violations during off-peak periods.
#       Real-time fraud detection consumer; team wants <100ms e2e latency
#       for each transaction. Default `fetch.min.bytes=1, fetch.max.wait.
#       ms=500` — fetches return instantly because fetch.min.bytes=1. No
#       problem. Now team adds `fetch.min.bytes=4096` for 'throughput
#       tuning' (advice from a Confluent blog post). At 3am when traffic
#       drops to 100 transactions/min (~400 bytes/sec at 4 KB per
#       transaction), each fetch stalls up to 500ms waiting for 4096 bytes
#       to accumulate. Fraud-detection latency SLA breached for 30% of
#       off-peak transactions.
#
#   (3) Idle consumer's p99 metric looks like a deadlock.
#       Monitoring system charts consumer fetch latency; alerts fire when
#       p99 > 200ms. A consumer of an infrequent admin-event topic has
#       default `fetch.min.bytes=1` but team manually configured `fetch.
#       min.bytes=8192` 'for consistency with the other consumers'. Topic
#       gets 1 event per hour. Every fetch stalls 500ms waiting for 8 KB
#       to accumulate (which never happens), then returns with the 1
#       event. p99 fetch latency = 500ms; alert fires every hour.
#
#   (4) Kafka Connect source-task fetches show 500ms p99 wait.
#       Kafka Connect uses internal consumers for source tasks; default
#       fetch.min.bytes=1, fetch.max.wait.ms=500. Some Connect deployments
#       override fetch.min.bytes for throughput. When the source topic has
#       low write rate, every poll() stalls 500ms — visible in Connect's
#       per-task metric `kafka_connect_task_metrics_fetch_latency_avg`.
#
#   (5) Spring Boot 'optimization' tutorial gives wrong advice.
#       A Spring Boot Kafka tutorial says 'set spring.kafka.consumer.fetch-
#       min-size for better throughput'. Team follows the advice; sets
#       fetch-min-size=64KB; doesn't mention fetch-max-wait. Latency SLA
#       breaches during off-peak. Static analysis on the underlying
#       .properties surfaces the missing pair.
#
#   (6) Mixed-traffic-pattern consumer can't satisfy both regimes.
#       Consumer handles two traffic patterns: business-hours bursts (high
#       throughput, want big batches) and off-hours sparse events (low rate,
#       want low latency). Default fetch.min.bytes=1 satisfies the off-
#       hours pattern but does not amortize fetch overhead during bursts.
#       Operator must pick: tune for ONE pattern and accept worse behavior
#       for the other. Either choice requires understanding the coupling.
#
# Fix
#   ONE LINE. Set `fetch.max.wait.ms` paired with the chosen
#   `fetch.min.bytes`, ALWAYS with both keys set together so the
#   latency-throughput trade-off is explicit:
#
#     # Low-latency, responsive (sub-100ms always):
#     fetch.min.bytes=1
#     fetch.max.wait.ms=10
#
#     # Throughput with bounded latency (good for OLTP-like consumers):
#     fetch.min.bytes=65536
#     fetch.max.wait.ms=50
#
#     # Batch-oriented (willing to wait for big batches):
#     fetch.min.bytes=1048576
#     fetch.max.wait.ms=2000
#
#   For this fixture's `fetch.min.bytes=65536`, the right pair is
#   `fetch.max.wait.ms=50` (50ms latency ceiling) or `fetch.max.wait.ms=100`
#   (100ms latency ceiling), depending on the consumer's latency SLA.
# =============================================================================

bootstrap.servers=broker-1.kafka.prod.example.com:9092,broker-2.kafka.prod.example.com:9092,broker-3.kafka.prod.example.com:9092
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer

# Group identity + client identity (isolate the rule).
group.id=payments-events
client.id=payments-fraud-screening-consumer

# Partition assignment strategy.
partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor

# Bootstrap-offset semantics.
auto.offset.reset=earliest

# At-least-once semantics.
enable.auto.commit=false

# Read-committed.
isolation.level=read_committed

# Poll-loop tuning.
max.poll.records=500
max.poll.interval.ms=300000
session.timeout.ms=45000
heartbeat.interval.ms=12000

# fetch.min.bytes TUNED UP to 64 KB for peak-hour throughput (amortize fetch
# overhead). Without the matching fetch.max.wait.ms tune, off-peak fetches
# silently stall up to 500ms — p99 latency SLA-breaking.
fetch.min.bytes=65536

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# MISSING:
#   fetch.max.wait.ms=...
# With fetch.min.bytes=65536 above, the right pair is fetch.max.wait.ms=50
# (50ms latency ceiling) — when off-peak traffic is too low to accumulate
# 64 KB within the window, the broker responds at 50ms with partial data.
# Default fetch.max.wait.ms=500 means 10x worse off-peak latency.
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
