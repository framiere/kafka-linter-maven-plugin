# =============================================================================
# IT fixture: STREAMS_PROPERTIES_DEFAULT_DSL_STORE_ABSENT (bad)
# =============================================================================
#
# What this file is
#   A Kafka Streams .properties file destined for
#   `new StreamsConfig(Properties)` inside a long-running JVM
#   process. The application is `realtime-pricing-engine` — a
#   sub-10-ms-SLO real-time pricing topology consuming from
#   `market-events-raw` (96 partitions, replication-factor=3),
#   joining against `current-prices` (KTable) and
#   `instrument-rules` (GlobalKTable), running per-instrument
#   stateful aggregations to maintain a rolling 5-second VWAP,
#   and producing computed prices to `pricing-decisions` —
#   downstream consumers (the trading engine, the risk monitor,
#   the audit-log writer) all have hard <10 ms p99 SLOs on
#   per-event completion.
#
#   The topology has THREE materialized state-stores:
#     1. current-prices (KTable, ~5k instruments × 200 bytes)
#     2. instrument-rules (GlobalKTable, ~2k rules × 500 bytes)
#     3. vwap-window-store (windowed KTable, 5s rolling)
#
#   Total state-store footprint: ~3 MB. Trivial to hold in
#   memory. The deployment instances have 16 GiB heap (massive
#   safety margin; only 2-3 GiB actively used). Brokers are
#   Strimzi-managed Kafka 3.9.0 (October 2024), so KIP-591's
#   `default.dsl.store` (Apache Kafka 3.2, May 2022) is
#   AVAILABLE in this client/broker pairing.
#
#   The topology runs on a 4-StreamThread instance, 6 instances
#   deployed on dedicated nodes (cost-optimized real-time
#   workload — no PVC, pods are ephemeral, restart via
#   changelog-replay).
#
# What's wrong
#   `default.dsl.store` (KIP-591, Apache Kafka 3.2, May 2022)
#   is the GLOBAL DEFAULT for which state-store implementation
#   the DSL operators use when not explicitly overridden via
#   `Materialized.as(Stores.inMemoryKeyValueStore(...))` or
#   `Materialized.withStoreType(Materialized.StoreType.IN_
#   MEMORY)` (KIP-825, Apache Kafka 3.6+).
#
#   Default: `"rocksdb"` — every materialized state-store is
#   backed by RocksDB (embedded LSM-tree KV store):
#   - state is PERSISTED to disk via `state.dir` (per-instance
#     PVC or host path)
#   - memory is OFF-HEAP (native write-buffer, block-cache,
#     index/filter blocks allocated by the C++ allocator)
#   - p99 get/put latency is 0.5-5 ms (JNI overhead + native
#     code path + occasional disk read for cache miss)
#   - warm restart from disk is near-instant
#
#   Alternative: `"in_memory"` — every state-store is backed by
#   a TreeMap/ConcurrentSkipListMap:
#   - state is HEAP-ONLY (lives in JVM heap)
#   - state is LOST on JVM restart (must be fully restored
#     from the changelog topic on every start)
#   - p99 get/put latency is 5-50 μs (pure Java HashMap
#     operation, NO JNI, NO disk)
#   - 100-1000× faster than RocksDB
#
#   For this `realtime-pricing-engine` topology with a <10 ms
#   p99 SLO on per-event completion and only ~3 MB of state on
#   a 16 GiB heap, `default.dsl.store=in_memory` is the right
#   answer. Without setting it, the default `rocksdb` is used
#   and the topology's per-event latency budget is dominated by
#   RocksDB JNI overhead.
#
# The eight bug shapes this rule catches
#   (1) SLO-critical hot-key topology — rocksdb p99 dominates
#       latency budget. Each pricing event triggers 3 state-
#       store accesses:
#         - current-prices.get(instrumentId) → 1-2 ms p99
#         - instrument-rules.get(instrumentId) → 1-2 ms p99
#           (GlobalKTable lookup)
#         - vwap-window-store.put(instrumentId, vwap) → 2-3
#           ms p99 (windowed write-amp)
#       Total in-topology latency: 4-7 ms p99. Adding broker
#       poll (~1 ms) + producer batching (~1 ms) + network
#       round-trip (~1 ms) = 7-10 ms p99 — RIGHT AT the SLO
#       boundary. Any spike (RocksDB compaction, block-cache
#       miss, disk I/O contention) pushes p99 over 10 ms;
#       downstream alerts fire.
#
#       With `default.dsl.store=in_memory`, the 3 state-store
#       accesses drop to ~30 μs each = 0.1 ms total
#       in-topology latency; total per-event = 3.1 ms p99 —
#       comfortably under SLO with massive headroom for noise.
#
#   (2) Heap headroom unused. The deployment instances have
#       16 GiB heap; only 2-3 GiB is actively used (JIT,
#       framework, application objects). The remaining 13+ GiB
#       sits idle. With `default.dsl.store=in_memory`, the ~3
#       MB state-store footprint adds nothing meaningful to
#       heap pressure (0.02% of available heap) — completely
#       free latency win.
#
#   (3) Ephemeral pod restart actually wins cold-start.
#       Without PVCs, every pod restart triggers a full
#       changelog-replay regardless of store-type. With
#       `default.dsl.store=rocksdb`, replay involves writing
#       every record to RocksDB SSTables (3-5 minutes for
#       this topology's changelog). With `default.dsl.store=
#       in_memory`, replay only writes to a TreeMap (30-60
#       seconds) — in_memory cold-starts FASTER than rocksdb
#       for this deployment shape.
#
#   (4) Native memory allocation overhead. RocksDB's
#       off-heap memory allocation (write-buffer, block-cache,
#       index/filter blocks) is allocated by `librocksdbjni`'s
#       C++ allocator, OUTSIDE the JVM's heap accounting. For
#       3 state-stores × 4 StreamThreads = 12 RocksDB
#       instances, each with ~30 MB of native memory, that's
#       ~360 MB of off-heap memory the JVM can't see. On
#       memory-constrained pods, this can OOM the pod (the
#       Kubernetes OOM-killer cares about RSS, not heap). With
#       `default.dsl.store=in_memory`, all memory is on-heap
#       and visible to the JVM's GC and to `jmap`/profilers —
#       easier to monitor and bound.
#
#   (5) Block-cache miss tail latencies. RocksDB's block-cache
#       is FIXED-SIZE (default 50 MB per store-thread). For
#       hot keys that don't fit in block-cache, every read
#       triggers a disk read (~5 ms p99 on local SSD, ~20 ms
#       p99 on EBS gp3). The tail latency distribution under
#       cache pressure has a long tail that pushes p99.9 and
#       p99.99 well past p99 estimates. In_memory has uniform
#       p99/p99.9/p99.99 latency (no disk, no cache).
#
#   (6) Compaction-induced latency spikes. RocksDB's
#       background compaction (L0→L1→L2 promotion) consumes
#       CPU and I/O bandwidth on the same thread as the
#       StreamThread. During compaction, foreground writes
#       block (write-stall), pushing latency from 0.5-2 ms
#       p99 to 50-500 ms during the stall window. For a 10-ms
#       SLO topology, ANY compaction-induced stall is an SLO
#       violation. In_memory has NO compaction.
#
#   (7) Per-operator override is FINER-grained, but not used
#       here. KIP-825 (Apache Kafka 3.6, October 2023)
#       introduced `Materialized.withStoreType(Materialized.
#       StoreType.IN_MEMORY)` as a per-operator override. For
#       mixed-latency-profile topologies (some hot-path
#       in-memory, some cold-path rocksdb), per-operator
#       override is the right pattern. For THIS topology
#       (every state-store is hot-path), the global default
#       is correct and simpler.
#
#   (8) Spring Boot autoconfig default-leak. Spring Boot's
#       KafkaStreamsConfiguration bean does NOT set
#       `default.dsl.store`; every Spring Boot Streams app on
#       Apache Kafka 3.2+ inherits the framework default
#       `rocksdb` unless the operator explicitly sets
#       `spring.kafka.streams.properties.default.dsl.store=
#       in_memory`. For an org with mixed-latency-profile
#       workloads, the org-wide default-leak silently locks
#       every app to RocksDB.
#
# Why INFO and not WARNING
#   The default `rocksdb` is the CORRECT choice for the
#   majority of production Streams workloads: large state,
#   PVC-backed Kubernetes deployments where pod restart should
#   be near-instant via disk warm-restart, tolerable p99
#   latencies (most analytics, ETL, event-driven workloads
#   have 100-ms+ SLOs where RocksDB's 0.5-5 ms is invisible).
#   In_memory is the right answer for a NARROW subset:
#   low-latency hot-key topologies (<10 ms SLO), small-state
#   on memory-rich instances, ephemeral-pod deployments. The
#   linter cannot infer the SLO budget or instance heap size
#   from .properties alone. The rule is a 'have you considered
#   whether your topology's latency profile matches the
#   rocksdb default?' nudge.
#
#   This IT fixture's pom.xml overrides the severity to ERROR
#   so that `mvn verify` fails on this bad configuration,
#   demonstrating the rule fires correctly.
#
# Fix
#   For default persistent state-stores (analytics, ETL,
#   long-state, PVC-backed):
#     default.dsl.store=rocksdb
#   (explicit default — documents the deliberate choice;
#   insulates from future framework default changes.)
#
#   For low-latency / small-state / ephemeral deployments
#   (real-time pricing, fraud, ad-bidding — like this
#   fixture):
#     default.dsl.store=in_memory
#   (cuts state-access latency 100-1000× at the cost of heap
#   memory and slower cold-start from changelog replay.)
#
#   For mixed-latency-profile topologies, leave the global
#   default and override per-operator with KIP-825's
#   `Materialized.withStoreType(Materialized.StoreType.IN_
#   MEMORY)` (Apache Kafka 3.6+) or the older
#   `Materialized.as(Stores.inMemoryKeyValueStore(
#   "store-name"))`.
# =============================================================================

# Application identity — the streams-shape gate.
application.id=realtime-pricing-engine
client.id=realtime-pricing-engine-0

# Cluster connectivity.
bootstrap.servers=kafka-bootstrap.kafka.svc.cluster.local:9092

# Default Serdes.
default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
default.value.serde=org.apache.kafka.common.serialization.Serdes$StringSerde

# Exactly-once-v2 for transactional pricing guarantees.
processing.guarantee=exactly_once_v2

# Standby replicas + KIP-441 warm-standby promotion.
num.standby.replicas=2
acceptable.recovery.lag=10000
probing.rebalance.interval.ms=600000
max.warmup.replicas=2

# Rack-aware standby placement.
rack.aware.assignment.tags=zone

# State-store persistence (only meaningful for rocksdb mode — ignored for in_memory).
state.dir=/var/lib/streams/realtime-pricing

# Group-membership + heartbeating tuned for K8s pod lifecycle.
session.timeout.ms=45000
heartbeat.interval.ms=3000
max.poll.interval.ms=300000

# Exception handlers — all three sides set explicitly.
default.deserialization.exception.handler=org.apache.kafka.streams.errors.LogAndContinueExceptionHandler
default.production.exception.handler=org.apache.kafka.streams.errors.DefaultProductionExceptionHandler
processing.exception.handler=org.apache.kafka.streams.errors.LogAndContinueProcessingExceptionHandler

# Timestamp extractor — explicit fail-on-invalid.
default.timestamp.extractor=org.apache.kafka.streams.processor.FailOnInvalidTimestamp

# Topology optimization.
topology.optimization=all

# Commit interval (EOS-v2 default 100 ms is fine; set explicitly).
commit.interval.ms=100

# 4 StreamThreads per instance.
num.stream.threads=4

# Cache sized for the topology — 4 stores × 4 threads = 16 store-thread combos,
# 128 MiB / 16 = ~8 MiB per combo — ample for the small working set.
statestore.cache.max.bytes=134217728

# Metadata recovery strategy — K8s-aware.
metadata.recovery.strategy=rebootstrap

# Task idle ms for stream-stream join time-alignment.
max.task.idle.ms=200

# Task timeout.
task.timeout.ms=300000

# Replication factor for internal topics.
replication.factor=3

