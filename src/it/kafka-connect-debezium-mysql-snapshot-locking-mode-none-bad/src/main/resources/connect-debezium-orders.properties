name=orders-cdc
connector.class=io.debezium.connector.mysql.MySqlConnector

tasks.max=1

# Anti-pattern: snapshot.locking.mode=none on a Debezium MySQL connector
# against a production MySQL primary that's under continuous write load.
# The connector SKIPS the global read lock (FLUSH TABLES WITH READ LOCK)
# that defines the snapshot's transactional boundary, and proceeds with
# the per-table SELECT * FROM <table> reads against a concurrently-written
# source database WITHOUT a single point-in-time consistency boundary.
#
# Concretely:
#   - the `orders` table snapshot starts at T1 (08:00:00), runs for 90
#     minutes (snapshotting ~50M order rows ordered by primary key).
#   - the `order_items` table snapshot starts at T2 (09:30:00), runs for
#     45 minutes (snapshotting ~150M item rows).
#   - the `customers` table snapshot starts at T3 (10:15:00), runs for 20
#     minutes (snapshotting ~8M customer rows).
#
# Between T1 and T3, the production application:
#   - DELETED ~3000 customers via GDPR right-to-be-forgotten requests
#   - INSERTED ~50000 new orders for those (and other) customers
#   - REASSIGNED ~12000 orders to consolidated customer accounts (the
#     orders' customer_id column was UPDATED)
#
# The resulting snapshot is logically inconsistent:
#   - orders rows captured at T1 reference customer_ids that were
#     DELETED by T3 (those customer rows DON'T APPEAR in the snapshot)
#   - new orders inserted between T1 and T3 partially appear (some are
#     captured by the streaming phase, some by the late tables' snapshot)
#   - order_items rows captured at T2 reference order_ids whose
#     customer_id was UPDATED after T2 — but the orders snapshot already
#     captured the OLD customer_id at T1
#
# Downstream impact:
#   - the warehouse JDBC sink's foreign-key constraint fires:
#     ERROR: insert or update on table "order_items" violates foreign key
#     constraint "fk_order_items_orders" — DETAIL: Key (order_id)=(...)
#     is not present in table "orders". The sink connector enters FAILED
#     state; data-platform on-call is paged at 3am.
#   - the order-fulfillment Kafka Streams app's orders→customer KTable
#     join returns NULL for 3000 orders whose customer was deleted; the
#     fulfillment service ships orders to "unknown" addresses (the
#     application's null-customer fallback path).
#   - the GDPR-compliance pipeline reports a violation: 3000 customer
#     records that were DELETED in source still appear referenced by
#     orders rows in the CDC topic — auditor flags the pipeline as
#     "not fulfilling the data-erasure guarantee".
#
# The streaming phase's takeover binlog position is ambiguous: Debezium
# picks a position observed after the last table-read, but events between
# snapshot-start (T1) and snapshot-end (~T3+20min) are split between
# snapshot-output and streaming-output non-deterministically. Some rows
# are DOUBLE-EMITTED (snapshot at T2, then a delta event in streaming).
# Some rows are MISSED (inserted at T1+5min, deleted at T1+10min, both
# happened before the orders snapshot completed but after the snapshot
# already passed the relevant primary-key range).
#
# Root-cause discovery: ~2 weeks of cross-team debugging. Recovery:
# delete the connector + topics, redeploy with snapshot.locking.mode=
# minimal (the default), rebuild all downstream KTables — a 24-48 hour
# outage window during which the JDBC sink is offline.
#
# Fix: snapshot.locking.mode=minimal (the default — brief FTWRL just
# long enough to capture the binlog coordinate, then release; requires
# RELOAD privilege), snapshot.locking.mode=extended (FTWRL for the full
# snapshot duration — perfectly consistent but BLOCKS ALL WRITES on the
# source for the duration; acceptable only in maintenance windows), or
# remove the key (default minimal applies).
snapshot.locking.mode=none

database.hostname=orders-mysql-primary.internal
database.port=3306
database.user=debezium
database.password=changeme
database.server.id=184054
database.include.list=orders

topic.prefix=cdc.orders

schema.history.internal.kafka.bootstrap.servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
schema.history.internal.kafka.topic=schema-history.cdc.orders

table.include.list=orders.orders,orders.order_items,orders.customers

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
