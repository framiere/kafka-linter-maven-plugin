name=mysql-orders-cdc
connector.class=io.debezium.connector.mysql.MySqlConnector

# Anti-pattern: tasks.max=6 on a Debezium MySQL connector is silently
# ignored. The connector consumes a SINGLE MySQL binlog stream via a
# SINGLE replication-client connection (using the MySQL replication
# protocol with a unique database.server.id). The binlog itself is a
# SINGLE strictly-ordered append-only log on the source MySQL primary —
# every commit across every table on the server is serialized into this
# one stream in commit order. Splitting this work across tasks is
# architecturally impossible: either multiple tasks share the single
# replication connection (defeats ordering — the demux thread becomes
# the bottleneck), or each task opens its OWN replication connection
# with its OWN database.server.id (each then receives a FULL COPY of
# every binlog event, producing duplicate emission AND multiplying load
# on the MySQL primary by N).
#
# The connector's taskConfigs(int maxTasks) returns a one-element list
# regardless of maxTasks. Connect schedules exactly 1 task and the
# remaining 5 "task slots" are never used.
#
# The operator who set tasks.max=6 likely intended to "scale CDC
# throughput" but got NO parallelism — the connector silently runs 1
# task. Capacity planning ('6x parallel CDC throughput available') is
# based on a false premise; cluster sizing over-provisions worker
# threads that will never be allocated.
#
# Real scaling options for MySQL CDC: (a) horizontal sharding of
# databases/tables across multiple connectors (each with unique
# database.server.id and disjoint database.include.list /
# table.include.list); (b) heap/CPU scaling of the single connector's
# worker thread; (c) Debezium 2.x incremental snapshot for parallel
# initial-snapshot phase. None involve raising tasks.max.
tasks.max=6

database.hostname=orders-mysql.internal
database.port=3306
database.user=debezium
database.password=changeme
database.server.id=184254
database.include.list=orders

topic.prefix=cdc.orders.mysql

database.history.kafka.bootstrap.servers=kafka:9092
database.history.kafka.topic=schema-history.orders-mysql

table.include.list=orders.orders,orders.order_items,orders.shipments

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false

snapshot.mode=initial
