# =============================================================================
# A Kafka consumer configuration that wires Confluent's
# `KafkaJsonSchemaDeserializer` for the value channel without setting
# `json.value.type`. This is the textbook silent-data-loss trap: the
# deserializer returns `LinkedHashMap<String, Object>` instead of the typed
# POJO, and every typed access (`((Transaction) record.value()).getAccountId()`)
# throws `ClassCastException` at runtime on the first poll.
#
# ANTI-PATTERN DEMONSTRATED HERE:
#
#   value.deserializer = io.confluent...KafkaJsonSchemaDeserializer
#   # json.value.type  = (UNSET)                ← TYPE GATE OPEN
#
# WHY THIS IS A SILENT-DATA-LOSS-AT-FIRST-POLL BUG:
#
# Confluent's `KafkaJsonSchemaDeserializer<T>` has a `<T>` generic parameter
# but Java erases generics at runtime (JLS §8.1.2). The deserializer cannot
# discover the caller's intended POJO type from `new
# KafkaJsonSchemaDeserializer<Transaction>()` — the type argument is INVISIBLE
# at runtime. The deserializer reads `json.value.type` (for values) or
# `json.key.type` (for keys) from the Kafka properties; if set, it resolves
# the FQCN via `Class.forName(...)` and uses Jackson's
# `ObjectMapper.readValue(bytes, resolvedClass)` to materialize a TYPED POJO.
# If UNSET, the deserializer falls back to materializing the JSON document as
# a `LinkedHashMap<String, Object>` (or `JsonNode` in newer versions), neither
# of which can satisfy a typed cast.
#
# The asymmetry that hides this in test: the PRODUCER side works fine because
# the serializer just writes the JSON document; no type info is needed on the
# write path. Unit tests using `MockSchemaRegistryClient` typically pass POJOs
# directly through the test harness and never exercise the
# LinkedHashMap-deserialization path. CI is green, the deploy ships, the first
# real-record poll fails with `ClassCastException: class
# java.util.LinkedHashMap cannot be cast to class com.example.Transaction`.
#
# REAL-WORLD INCIDENT SHAPES:
#
# (1) **Avro → JSON Schema migration.**
#     Team migrates a topic from Avro to JSON Schema for cross-language
#     interop. The Avro deserializer config (`specific.avro.reader=true`) is
#     removed; the team replaces it with `value.deserializer=
#     KafkaJsonSchemaDeserializer` and FORGETS `json.value.type`. The team's
#     Avro-era unit tests still pass (they used SpecificRecord mocks).
#     Production breaks on first poll with a stack trace pointing deep into
#     a Streams `mapValues` lambda — far from the deserializer config that
#     caused it.
#
# (2) **Streams default-deserialization-exception-handler routing.**
#     A Streams app sets `default.deserialization.exception.handler=
#     LogAndContinueExceptionHandler` (a common 'be tolerant' choice during
#     rollout). Without `json.value.type`, every record fails to deserialize
#     into the expected POJO and is silently DROPPED. The topology runs, lag
#     stays low, dashboards look fine — but no records reach the downstream
#     sink. Silent data loss until a downstream consumer notices missing
#     events days or weeks later.
#
# (3) **Spring @KafkaListener with method-level typing.**
#     A Spring `@KafkaListener(topics = "transactions")` method declares its
#     parameter as `Transaction txn`. Spring's `MessageConverter` then
#     attempts a cast (`Object → Transaction`) on the LinkedHashMap return
#     value and throws `ClassCastException`. The container's
#     `DefaultErrorHandler` retries forever (or until the DLQ is reached),
#     creating apparent partition lag without any clear root cause —
#     debugging starts with 'why is the listener slow?' rather than 'why
#     does it crash?'.
#
# (4) **Confluent docs copy-paste.**
#     Developer reads the Confluent JSON Schema serdes doc, copies the
#     `value.deserializer=KafkaJsonSchemaDeserializer` snippet (which appears
#     in the doc's quick-start section), and misses the `json.value.type`
#     property which is documented in a different section (the typed-consumer
#     section, separate from the quick-start). The producer config in the
#     same doc uses the serializer (no type config needed), so the doc
#     appears self-consistent from a copy-paste reader's perspective.
#
# (5) **MockSchemaRegistryClient hides it.**
#     Unit tests use `MockSchemaRegistryClient` which is wired to pass POJOs
#     directly through the test harness — never exercising the
#     LinkedHashMap deserialization path. CI is green, the deploy ships, the
#     first production poll fails. The team adds explicit
#     'KafkaJsonSchemaDeserializer-with-real-bytes' integration tests after
#     the incident; the static-analysis catch belongs at PR time, before any
#     real bytes hit the consumer.
#
# (6) **Mixed value types in a Streams topology.**
#     Streams app processes multiple JSON-Schema topics with different POJO
#     types; the developer sets `default.value.serde=KafkaJsonSchemaSerde`
#     with `json.value.type=TopicAType` and uses explicit serdes for topic
#     B. The default-serde catches topic A correctly but the developer
#     forgot to wire an explicit serde for topic C; topic-C records
#     deserialize via the default serde with the TopicA `json.value.type` —
#     so Jackson silently coerces a topic-C document into a TopicA POJO,
#     leaving fields default-valued (Jackson's `FAIL_ON_UNKNOWN_PROPERTIES`
#     is false by default in the Confluent path). Semantic data loss without
#     any error.
#
# THE FIX:
#
# Add `json.value.type=<FQCN>` (or `json.key.type=<FQCN>` for keys)
# alongside the deserializer config:
#
#   value.deserializer = io.confluent...KafkaJsonSchemaDeserializer
#   json.value.type    = com.example.model.Transaction
#
# For Kafka Streams with mixed value types across topics, prefer explicit
# `KafkaJsonSchemaSerde<T>` instances passed via `Consumed.with(...)` /
# `Produced.with(...)` rather than relying on `default.value.serde`. For
# Spring Boot the property maps to `spring.kafka.properties.json.value.type`.
#
# =============================================================================

bootstrap.servers=kafka.internal:9092
group.id=orders-consumer
client.id=orders-consumer

key.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# VIOLATION: KafkaJsonSchemaDeserializer is wired up for the value channel,
# but json.value.type is UNSET. The deserializer cannot recover the POJO type
# from its erased <T> generic parameter, so it returns a LinkedHashMap. The
# first (Transaction) record.value() cast throws ClassCastException at runtime
# — typically deep inside business code, far from this config. Fix: add
# `json.value.type=com.example.model.Transaction` here.
value.deserializer=io.confluent.kafka.serializers.json.KafkaJsonSchemaDeserializer

schema.registry.url=https://sr.internal:8081

# Reasonable consumer tuning — orthogonal to the type-missing issue but included
# to make the fixture a realistic full consumer config.
enable.auto.commit=false
auto.offset.reset=earliest
max.poll.records=500
fetch.min.bytes=65536
max.poll.interval.ms=300000
