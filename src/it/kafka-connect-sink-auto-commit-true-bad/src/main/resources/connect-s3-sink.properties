name=s3-sink-events
connector.class=io.confluent.connect.s3.S3SinkConnector
tasks.max=4

topics=events

s3.region=eu-west-1
s3.bucket.name=warehouse-events
flush.size=10000
storage.class=io.confluent.connect.s3.storage.S3Storage
format.class=io.confluent.connect.s3.format.parquet.ParquetFormat

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false

# Anti-pattern: consumer.override.enable.auto.commit=true bypasses Connect's
# offset-management lifecycle. WorkerSinkTask hardcodes enable.auto.commit=false
# precisely because Connect must commit ONLY after SinkTask.put() flushes the
# batch to S3. With auto-commit on, offsets advance every 5s regardless of
# whether the S3 upload succeeded — a crash mid-upload silently loses every
# record between the last auto-commit and the crash. KIP-458 enabled the
# override mechanism; it was never intended to undo Connect's safety contract.
consumer.override.enable.auto.commit=true
