name=debezium-payments-cdc
connector.class=io.debezium.connector.mysql.MySqlConnector
tasks.max=1

database.hostname=payments-db.internal
database.port=3306
database.user=debezium
database.password=secret
database.include.list=payments
topic.prefix=cdc.payments

# Anti-pattern: this connector shares database.server.id=184054 with a
# peer MySQL connector (connect-debezium-billing.properties). MySQL's
# binlog protocol requires UNIQUE server_id per replica; the primary
# will intermittently disconnect whichever reader matches the duplicate
# signature, causing both connectors to enter a connect/disconnect storm.
database.server.id=184054

table.include.list=payments.charges,payments.refunds

schema.history.internal.kafka.topic=cdc.payments.schema-history
schema.history.internal.kafka.bootstrap.servers=kafka-1.prod.example.com:9092

key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
key.converter.auto.register.schemas=false
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081
value.converter.auto.register.schemas=false
